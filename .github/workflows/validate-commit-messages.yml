name: Validate Commit Messages

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate pushed commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            node tools/validate-commit-message.mjs --rev-range "$RANGE"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              COMMITS="$(git rev-list --reverse HEAD --not --remotes | paste -sd, -)"
              if [ -z "$COMMITS" ]; then
                echo "No branch-exclusive commits found for initial push."
                exit 0
              fi
              node tools/validate-commit-message.mjs --commits "$COMMITS"
              exit 0
            fi
            RANGE="$BEFORE..${{ github.sha }}"
            node tools/validate-commit-message.mjs --rev-range "$RANGE"
          fi
