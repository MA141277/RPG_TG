w'w'w'w'w<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilemap 编辑器</title>
  <style>
    :root {
      --bg: #0f141c;
      --panel: #1a2330;
      --panel-2: #243245;
      --text: #e6edf3;
      --muted: #93a4b8;
      --accent: #58a6ff;
      --danger: #ff7b72;
      --cell-size: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      min-height: 100vh;
    }
    .panel {
      background: var(--panel);
      border: 1px solid #2d3d52;
      border-radius: 10px;
      padding: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p.hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .section {
      margin-bottom: 14px;
      padding: 10px;
      border: 1px solid #2d3d52;
      border-radius: 8px;
      background: var(--panel-2);
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #c8d7e6;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    label {
      font-size: 13px;
      color: var(--muted);
    }
    input[type="number"], input[type="text"], select, textarea {
      background: #111923;
      color: var(--text);
      border: 1px solid #334862;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    input[type="number"] { width: 72px; }
    input[type="text"] { width: 100%; }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
    }
    button {
      background: #25415f;
      color: #d9ebff;
      border: 1px solid #3e6d97;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary {
      background: #263344;
      border-color: #3e5168;
      color: #d4deea;
    }
    button.danger {
      background: #552a2a;
      border-color: #8e4a4a;
      color: #ffe3e1;
    }
    .tool-active {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .status {
      margin-top: 6px;
      min-height: 18px;
      font-size: 12px;
      color: #7ee787;
    }
    .status.error { color: var(--danger); }
    .canvas-wrap {
      background: var(--panel);
      border: 1px solid #2d3d52;
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
    }
    #editorCanvas {
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
      border: 1px solid #3a4e67;
      background: #0b1119;
    }
    .palette-swatches {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.35);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>Tilemap 编辑器</h1>
      <p class="hint">左侧设置网格和颜色，右侧直接绘制。当前默认风格为绿色草地大地图，支持本地保存、导出 JSON、导入 JSON、导出 PNG。</p>

      <div class="section">
        <h2>地图参数</h2>
        <div class="row">
          <label>宽</label><input id="mapWidth" type="number" min="4" max="256" value="64" />
          <label>高</label><input id="mapHeight" type="number" min="4" max="256" value="64" />
          <label>格像素</label><input id="cellSize" type="number" min="6" max="48" value="20" />
        </div>
        <div class="row">
          <button id="btnCreate">新建空白地图</button>
          <button id="btnResize" class="secondary">按当前尺寸重设</button>
        </div>
      </div>

      <div class="section">
        <h2>绘制工具</h2>
        <div class="row">
          <button id="btnBrush" class="tool-active">画笔</button>
          <button id="btnEraser" class="secondary">橡皮</button>
          <button id="btnFill" class="secondary">油漆桶</button>
        </div>
        <div class="row">
          <label>当前颜色</label>
          <input id="colorPicker" type="color" value="#6f9f52" />
          <input id="colorText" type="text" value="#6f9f52" />
        </div>
        <div class="palette-swatches" id="swatches"></div>
      </div>

      <div class="section">
        <h2>函数生成</h2>
        <div class="row">
          <label>种子</label>
          <input id="genSeed" type="number" min="0" max="999999999" value="42" />
          <label>强度</label>
          <input id="genStrength" type="number" min="1" max="100" value="50" />
        </div>
        <div class="row">
          <label>模式</label>
          <select id="genMode">
            <option value="replace">覆盖</option>
            <option value="overlay">叠加</option>
          </select>
          <button id="btnGenSnow" class="secondary">生成草地底图</button>
        </div>
        <div class="row">
          <button id="btnGenShadows" class="secondary">添加草地阴影</button>
          <button id="btnGenShrubs" class="secondary">添加灌木点缀</button>
        </div>
      </div>

      <div class="section">
        <h2>存储与导入导出</h2>
        <div class="row">
          <label>地图名</label>
          <input id="mapName" type="text" value="grass_tilemap_v1" />
        </div>
        <div class="row">
          <button id="btnSave">保存到本地</button>
          <button id="btnLoad" class="secondary">读取本地</button>
          <button id="btnClear" class="danger">清空</button>
        </div>
        <div class="row">
          <button id="btnExportJson" class="secondary">导出 JSON</button>
          <button id="btnImportJson" class="secondary">导入 JSON</button>
          <button id="btnExportPng" class="secondary">导出 PNG</button>
        </div>
        <textarea id="jsonArea" placeholder="导入/导出 JSON 会显示在这里"></textarea>
        <div id="status" class="status"></div>
      </div>
    </aside>

    <main class="canvas-wrap">
      <canvas id="editorCanvas" width="1280" height="1280"></canvas>
    </main>
  </div>

  <script>
    (function () {
      const STORAGE_PREFIX = "pixelwf_tilemap_editor_v1:";
      const DEFAULT_COLORS = [
        "#d8efc2", "#c3e29f", "#a8d17b", "#8ebd63", "#6f9f52",
        "#5b8744", "#4a7238", "#36562a", "#8f6d49", "#6f5339",
        "#4e3a29", "#5b93bf", "#3f76a1", "#295777", "#d9d2b6",
        "#0f141c", "#ffffff", "#000000"
      ];

      const elWidth = document.getElementById("mapWidth");
      const elHeight = document.getElementById("mapHeight");
      const elCellSize = document.getElementById("cellSize");
      const elMapName = document.getElementById("mapName");
      const elCanvas = document.getElementById("editorCanvas");
      const ctx = elCanvas.getContext("2d");
      const elColorPicker = document.getElementById("colorPicker");
      const elColorText = document.getElementById("colorText");
      const elJsonArea = document.getElementById("jsonArea");
      const elStatus = document.getElementById("status");
      const elSwatches = document.getElementById("swatches");
      const elGenSeed = document.getElementById("genSeed");
      const elGenStrength = document.getElementById("genStrength");
      const elGenMode = document.getElementById("genMode");

      const btnBrush = document.getElementById("btnBrush");
      const btnEraser = document.getElementById("btnEraser");
      const btnFill = document.getElementById("btnFill");

      let state = {
        width: 64,
        height: 64,
        cellSize: 20,
        tool: "brush",
        color: "#6f9f52",
        isMouseDown: false,
        grid: [],
      };

      function setStatus(msg, isError) {
        elStatus.textContent = msg || "";
        elStatus.className = "status" + (isError ? " error" : "");
      }

      function normalizeHexColor(input) {
        if (!input) return null;
        let c = String(input).trim().toLowerCase();
        if (!c.startsWith("#")) c = "#" + c;
        if (/^#[0-9a-f]{3}$/.test(c)) {
          c = "#" + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
        }
        if (!/^#[0-9a-f]{6}$/.test(c)) return null;
        return c;
      }

      function buildEmptyGrid(w, h, fillColor) {
        return Array.from({ length: h }, () =>
          Array.from({ length: w }, () => fillColor)
        );
      }

      function hexToRgb(hex) {
        const c = normalizeHexColor(hex);
        if (!c) return [0, 0, 0];
        return [
          parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16),
        ];
      }

      function rgbToHex(r, g, b) {
        const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
        const p = (v) => clamp(v).toString(16).padStart(2, "0");
        return "#" + p(r) + p(g) + p(b);
      }

      function mixColor(hexA, hexB, t) {
        const a = hexToRgb(hexA);
        const b = hexToRgb(hexB);
        return rgbToHex(
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t
        );
      }

      function mulColor(hex, factor) {
        const c = hexToRgb(hex);
        return rgbToHex(c[0] * factor, c[1] * factor, c[2] * factor);
      }

      function blendOver(baseHex, overHex, alpha) {
        const b = hexToRgb(baseHex);
        const o = hexToRgb(overHex);
        const a = Math.max(0, Math.min(1, alpha));
        return rgbToHex(
          b[0] * (1 - a) + o[0] * a,
          b[1] * (1 - a) + o[1] * a,
          b[2] * (1 - a) + o[2] * a
        );
      }

      function makeRng(seed) {
        let s = (Number(seed) || 1) >>> 0;
        return function rand() {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      function generationMode() {
        return elGenMode.value === "overlay" ? "overlay" : "replace";
      }

      function applyCellByMode(x, y, color, alpha) {
        const mode = generationMode();
        if (mode === "replace") {
          state.grid[y][x] = color;
          return;
        }
        const a = Number.isFinite(alpha) ? alpha : 0.55;
        state.grid[y][x] = blendOver(state.grid[y][x], color, a);
      }

      function getGenStrength01() {
        const v = Math.max(1, Math.min(100, Number(elGenStrength.value) || 50));
        return v / 100;
      }

      function generateSnowBase() {
        const rand = makeRng(elGenSeed.value);
        const t = getGenStrength01();
        const light = mixColor("#9ccc73", "#b8de8a", t * 0.4);
        const dark = mixColor("#5f8f45", "#4f7d39", 1 - t * 0.25);
        const speck = mixColor("#7fb35d", "#a0c87a", rand() * 0.7);

        if (generationMode() === "replace") {
          state.grid = buildEmptyGrid(state.width, state.height, light);
        }
        for (let y = 0; y < state.height; y++) {
          for (let x = 0; x < state.width; x++) {
            const n = rand();
            const c = n < 0.52 ? light : dark;
            applyCellByMode(x, y, c, 0.72);
            if (rand() < 0.08 + t * 0.16) {
              applyCellByMode(x, y, speck, 0.35 + rand() * 0.2);
            }
          }
        }
        draw();
        setStatus("已生成草地底图。");
      }

      function addSnowShadows() {
        const rand = makeRng(Number(elGenSeed.value) + 1314);
        const t = getGenStrength01();
        const dots = Math.floor(state.width * state.height * (0.015 + t * 0.05));
        for (let i = 0; i < dots; i++) {
          const x = Math.floor(rand() * state.width);
          const y = Math.floor(rand() * state.height);
          const shade = mixColor("#476434", "#36502a", rand());
          applyCellByMode(x, y, shade, 0.28 + t * 0.18);
          if (rand() < 0.25) {
            const x2 = Math.min(state.width - 1, x + 1);
            const y2 = Math.min(state.height - 1, y + 1);
            applyCellByMode(x2, y2, shade, 0.15 + t * 0.12);
          }
        }
        draw();
        setStatus("已添加草地阴影。");
      }

      function addShrubDots() {
        const rand = makeRng(Number(elGenSeed.value) + 2048);
        const t = getGenStrength01();
        const dots = Math.floor(state.width * state.height * (0.008 + t * 0.03));
        for (let i = 0; i < dots; i++) {
          const x = Math.floor(rand() * state.width);
          const y = Math.floor(rand() * state.height);
          const wood = mixColor("#4c6f33", "#6b8a4a", rand());
          applyCellByMode(x, y, wood, 0.26 + t * 0.22);
          if (rand() < 0.33 && x + 1 < state.width) applyCellByMode(x + 1, y, wood, 0.24);
          if (rand() < 0.2 && y > 0) applyCellByMode(x, y - 1, mulColor(wood, 0.9), 0.22);
        }
        draw();
        setStatus("已添加灌木点缀。");
      }

      function resizeGridKeepOld(newW, newH, fillColor) {
        const next = buildEmptyGrid(newW, newH, fillColor);
        const h = Math.min(state.height, newH);
        const w = Math.min(state.width, newW);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            next[y][x] = state.grid[y][x];
          }
        }
        state.width = newW;
        state.height = newH;
        state.grid = next;
      }

      function updateCanvasSize() {
        const cw = state.width * state.cellSize;
        const ch = state.height * state.cellSize;
        elCanvas.width = cw;
        elCanvas.height = ch;
        draw();
      }

      function draw() {
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, elCanvas.width, elCanvas.height);

        for (let y = 0; y < state.height; y++) {
          for (let x = 0; x < state.width; x++) {
            ctx.fillStyle = state.grid[y][x] || "#000000";
            ctx.fillRect(
              x * state.cellSize,
              y * state.cellSize,
              state.cellSize,
              state.cellSize
            );
          }
        }

        ctx.strokeStyle = "rgba(255,255,255,0.14)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= state.width; x++) {
          const gx = x * state.cellSize + 0.5;
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, elCanvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= state.height; y++) {
          const gy = y * state.cellSize + 0.5;
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(elCanvas.width, gy);
          ctx.stroke();
        }
      }

      function getCellByEvent(evt) {
        const rect = elCanvas.getBoundingClientRect();
        const x = Math.floor((evt.clientX - rect.left) / state.cellSize);
        const y = Math.floor((evt.clientY - rect.top) / state.cellSize);
        if (x < 0 || x >= state.width || y < 0 || y >= state.height) return null;
        return { x, y };
      }

      function paintCell(x, y, color) {
        if (!state.grid[y]) return;
        state.grid[y][x] = color;
      }

      function floodFill(startX, startY, newColor) {
        const targetColor = state.grid[startY][startX];
        if (targetColor === newColor) return;
        const q = [[startX, startY]];
        while (q.length) {
          const [x, y] = q.pop();
          if (x < 0 || x >= state.width || y < 0 || y >= state.height) continue;
          if (state.grid[y][x] !== targetColor) continue;
          state.grid[y][x] = newColor;
          q.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }

      function handlePaint(evt) {
        const c = getCellByEvent(evt);
        if (!c) return;
        if (state.tool === "fill") {
          floodFill(c.x, c.y, state.color);
          draw();
          return;
        }
        const color = state.tool === "eraser" ? "#000000" : state.color;
        paintCell(c.x, c.y, color);
        draw();
      }

      function setTool(toolName) {
        state.tool = toolName;
        btnBrush.classList.toggle("tool-active", toolName === "brush");
        btnEraser.classList.toggle("tool-active", toolName === "eraser");
        btnFill.classList.toggle("tool-active", toolName === "fill");
      }

      function mapStorageKey() {
        const name = String(elMapName.value || "").trim() || "unnamed";
        return STORAGE_PREFIX + name;
      }

      function serializeMap() {
        return {
          name: String(elMapName.value || "").trim() || "unnamed",
          width: state.width,
          height: state.height,
          cellSize: state.cellSize,
          paletteHint: DEFAULT_COLORS.slice(),
          data: state.grid,
          savedAt: new Date().toISOString(),
        };
      }

      function applyMap(payload) {
        if (!payload || !Array.isArray(payload.data)) throw new Error("JSON 缺少 data");
        const h = payload.data.length;
        const w = h > 0 && Array.isArray(payload.data[0]) ? payload.data[0].length : 0;
        if (!w || !h) throw new Error("data 必须是二维数组");

        state.width = w;
        state.height = h;
        state.cellSize = Math.max(6, Math.min(48, Number(payload.cellSize) || state.cellSize || 20));
        state.grid = payload.data.map((row) =>
          row.map((c) => normalizeHexColor(c) || "#000000")
        );
        elWidth.value = String(state.width);
        elHeight.value = String(state.height);
        elCellSize.value = String(state.cellSize);
        if (payload.name) elMapName.value = String(payload.name);
        updateCanvasSize();
      }

      function downloadText(filename, content, mime) {
        const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      function exportPng() {
        const out = document.createElement("canvas");
        out.width = state.width;
        out.height = state.height;
        const g = out.getContext("2d");
        g.imageSmoothingEnabled = false;
        for (let y = 0; y < state.height; y++) {
          for (let x = 0; x < state.width; x++) {
            g.fillStyle = state.grid[y][x];
            g.fillRect(x, y, 1, 1);
          }
        }
        out.toBlob((blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const safe = (elMapName.value || "tilemap").replace(/[^\w\u4e00-\u9fa5-]+/g, "_");
          a.href = url;
          a.download = safe + ".png";
          a.click();
          URL.revokeObjectURL(url);
        }, "image/png");
      }

      function renderSwatches() {
        elSwatches.innerHTML = "";
        DEFAULT_COLORS.forEach((c) => {
          const d = document.createElement("button");
          d.type = "button";
          d.className = "swatch";
          d.style.background = c;
          d.title = c;
          d.addEventListener("click", () => {
            state.color = c;
            elColorPicker.value = c;
            elColorText.value = c;
          });
          elSwatches.appendChild(d);
        });
      }

      document.getElementById("btnCreate").addEventListener("click", () => {
        const w = Math.max(4, Math.min(256, Number(elWidth.value) || 64));
        const h = Math.max(4, Math.min(256, Number(elHeight.value) || 64));
        state.width = w;
        state.height = h;
        state.cellSize = Math.max(6, Math.min(48, Number(elCellSize.value) || 20));
        state.grid = buildEmptyGrid(w, h, "#000000");
        updateCanvasSize();
        setStatus("已新建空白地图。");
      });

      document.getElementById("btnResize").addEventListener("click", () => {
        const w = Math.max(4, Math.min(256, Number(elWidth.value) || state.width));
        const h = Math.max(4, Math.min(256, Number(elHeight.value) || state.height));
        state.cellSize = Math.max(6, Math.min(48, Number(elCellSize.value) || state.cellSize));
        resizeGridKeepOld(w, h, "#000000");
        updateCanvasSize();
        setStatus("已按当前尺寸重设（保留重叠区域）。");
      });

      btnBrush.addEventListener("click", () => setTool("brush"));
      btnEraser.addEventListener("click", () => setTool("eraser"));
      btnFill.addEventListener("click", () => setTool("fill"));

      elColorPicker.addEventListener("input", () => {
        state.color = elColorPicker.value;
        elColorText.value = state.color;
      });
      elColorText.addEventListener("change", () => {
        const c = normalizeHexColor(elColorText.value);
        if (!c) {
          setStatus("颜色格式无效，请输入 #RRGGBB。", true);
          elColorText.value = state.color;
          return;
        }
        state.color = c;
        elColorPicker.value = c;
        setStatus("");
      });

      elCanvas.addEventListener("mousedown", (evt) => {
        state.isMouseDown = true;
        handlePaint(evt);
      });
      window.addEventListener("mouseup", () => {
        state.isMouseDown = false;
      });
      elCanvas.addEventListener("mousemove", (evt) => {
        if (!state.isMouseDown) return;
        if (state.tool === "fill") return;
        handlePaint(evt);
      });

      document.getElementById("btnSave").addEventListener("click", () => {
        try {
          const payload = serializeMap();
          localStorage.setItem(mapStorageKey(), JSON.stringify(payload));
          elJsonArea.value = JSON.stringify(payload, null, 2);
          setStatus("已保存到本地存储。");
        } catch (err) {
          setStatus("保存失败：" + (err && err.message ? err.message : String(err)), true);
        }
      });

      document.getElementById("btnLoad").addEventListener("click", () => {
        try {
          const raw = localStorage.getItem(mapStorageKey());
          if (!raw) throw new Error("未找到同名地图。");
          const payload = JSON.parse(raw);
          applyMap(payload);
          elJsonArea.value = JSON.stringify(payload, null, 2);
          setStatus("已从本地读取地图。");
        } catch (err) {
          setStatus("读取失败：" + (err && err.message ? err.message : String(err)), true);
        }
      });

      document.getElementById("btnClear").addEventListener("click", () => {
        if (!confirm("确认清空当前地图吗？")) return;
        state.grid = buildEmptyGrid(state.width, state.height, "#000000");
        draw();
        setStatus("当前地图已清空。");
      });

      document.getElementById("btnExportJson").addEventListener("click", () => {
        const payload = serializeMap();
        const text = JSON.stringify(payload, null, 2);
        elJsonArea.value = text;
        const safe = (payload.name || "tilemap").replace(/[^\w\u4e00-\u9fa5-]+/g, "_");
        downloadText(safe + ".json", text, "application/json;charset=utf-8");
        setStatus("JSON 已导出。");
      });

      document.getElementById("btnImportJson").addEventListener("click", () => {
        try {
          const txt = elJsonArea.value.trim();
          if (!txt) throw new Error("请先在文本框粘贴 JSON。");
          const payload = JSON.parse(txt);
          applyMap(payload);
          setStatus("JSON 导入成功。");
        } catch (err) {
          setStatus("导入失败：" + (err && err.message ? err.message : String(err)), true);
        }
      });

      document.getElementById("btnExportPng").addEventListener("click", () => {
        exportPng();
        setStatus("PNG 已导出。");
      });

      document.getElementById("btnGenSnow").addEventListener("click", () => {
        generateSnowBase();
      });
      document.getElementById("btnGenShadows").addEventListener("click", () => {
        addSnowShadows();
      });
      document.getElementById("btnGenShrubs").addEventListener("click", () => {
        addShrubDots();
      });

      function init() {
        state.grid = buildEmptyGrid(state.width, state.height, "#000000");
        updateCanvasSize();
        renderSwatches();
        setTool("brush");
      }
      init();
    })();
  </script>
</body>
</html>
