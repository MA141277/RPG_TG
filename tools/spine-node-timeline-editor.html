          state.arrowParentTracks = cloneArrowParentTracks(activeAction.arrowParentTracks);
          state.slashFxVisibilityTracks = cloneSlashFxVisibilityTracks(activeAction.slashFxVisibilityTracks);
          state.slashFxParentTracks = cloneSlashFxParentTracks(activeAction.slashFxParentTracks);
          state.slashFxActionHiddenMap = cloneSlashFxActionHiddenMap(activeAction.slashFxActionHiddenMap);
          hydrateBowRigTimelineMap(state.timelines);
        }
      }

      function migrateLegacySwordAttachments() {
        const migrations = [];
        const additions = [];
        state.nodes.forEach((node) => {
          if (!isLegacySwordAttachmentOwner(node)) return;
          const newId = uniqueNodeId(`${node.id}-sword`);
          const swordAttachment = normalizeAttachment({
            ...node.attachment,
            skinBoneIds: [newId],
          });
          additions.push({
            id: newId,
            name: `sword_${migrations.length + 1}`,
            parentId: node.parentId || null,
            x: node.x,
            y: node.y,
            rotation: node.rotation,
            length: node.length,
            scaleX: node.scaleX,
            scaleY: node.scaleY,
            color: "#d8d2bd",
            role: "sword",
            bindPose: normalizeBindPose(node.bindPose || node),
            attachment: swordAttachment,
          });
          node.attachment = null;
          migrations.push({ sourceId: node.id, targetId: newId });
        });
        if (!migrations.length) return;
        state.nodes.push(...additions);
        migrations.forEach(({ sourceId, targetId }) => {
          state.timelines[targetId] = cloneTimelineKeys(state.timelines[sourceId]);
          state.actions.forEach((action) => {
            action.timelines[targetId] = cloneTimelineKeys(action.timelines[sourceId]);
          });
        });
      }

      function restoreLegAssetImages(unitType = state.currentUnitType) {
        state.nodes.forEach((node) => {
          const image = node.attachment?.image;
          if (image?.startsWith(legAssetPrefix)) registerLegAssetImage(image.slice(legAssetPrefix.length), unitType);
        });
      }

      function isLegacySwordAttachmentOwner(node) {
        const attachment = node?.attachment;
        if (!attachment) return false;
        const attachmentIsSword = attachment.image === "newSword" || attachment.restPart?.partId === "sword";
        if (!attachmentIsSword) return false;
        return node.role !== "sword" && !/sword|weapon|\u5200|\u5251|\u6b66\u5668/i.test(`${node.id} ${node.name}`);
      }

      function cloneTimelineKeys(keys) {
        return Array.isArray(keys) ? keys.map((keyframe) => ({ ...keyframe })) : [];
      }

      function hydrateBowRigTimelineMap(timelineMap) {
        if (!timelineMap || typeof timelineMap !== "object") return timelineMap;
        state.nodes
          .filter((node) => isBowStringControlNode(node))
          .forEach((node) => {
            const keys = timelineMap[node.id];
            if (!Array.isArray(keys) || !keys.length) return;
            timelineMap[node.id] = keys.map((keyframe) => {
              if (BowRigController.hasSerializedPose(keyframe)) return { ...keyframe };
              return BowRigController.snapshot(node, { ...node, ...keyframe }, keyframe.frame);
            });
          });
        return timelineMap;
      }

      function hydrateBowRigSerializedKeys() {
        hydrateBowRigTimelineMap(state.timelines);
        state.actions.forEach((action) => hydrateBowRigTimelineMap(action.timelines));
      }

      function snapshotAllBowRigsAtCurrentFrame() {
        if (isBindingMode()) return;
        state.nodes
          .filter((node) => isBowStringControlNode(node))
          .forEach((node) => {
            const pose = BowRigController.enrichPose(node, getLocalPose(node, state.currentFrame));
            upsertKeyframe(node, BowRigController.snapshot(node, pose, state.currentFrame));
          });
      }

      function normalizeActions(actions) {
        if (!Array.isArray(actions)) return [];
        return actions
          .map((action, index) => {
            if (!action || typeof action !== "object") return null;
            const duration = Math.max(
              0,
              Number.isFinite(Number(action.duration)) ? Number(action.duration) : state.duration,
            );
            return {
              id: String(action.id || uid("action")),
              name: String(action.name || `Action ${index + 1}`),
              duration,
              timelines: normalizeTimelineMap(action.timelines || {}, duration),
              arrowVisibilityTracks: cloneArrowVisibilityTracks(action.arrowVisibilityTracks, duration),
              arrowParentTracks: cloneArrowParentTracks(action.arrowParentTracks, duration),
              slashFxVisibilityTracks: cloneSlashFxVisibilityTracks(action.slashFxVisibilityTracks, duration),
              slashFxParentTracks: cloneSlashFxParentTracks(action.slashFxParentTracks, duration),
              slashFxActionHiddenMap: cloneSlashFxActionHiddenMap(action.slashFxActionHiddenMap),
            };
          })
          .filter(Boolean);
      }

      function normalizeTimelineMap(timelines, duration) {
        const result = {};
        if (!timelines || typeof timelines !== "object") return result;
        Object.entries(timelines).forEach(([nodeId, keys]) => {
          if (!Array.isArray(keys)) return;
          result[nodeId] = keys
            .map((item) => ({
              frame: clampFrameToDuration(item.frame, duration),
              x: Number(item.x) || 0,
              y: Number(item.y) || 0,
              rotation: Number(item.rotation) || 0,
              length: Math.max(4, Number(item.length) || 80),
              scaleX: Math.max(0.05, Number(item.scaleX) || 1),
              scaleY: Math.max(0.05, Number(item.scaleY) || 1),
              visible: item.visible !== false,
              ...(Number.isFinite(Number(item.bowGroupRotation))
                ? { bowGroupRotation: Number(item.bowGroupRotation) }
                : {}),
              ...(Number.isFinite(Number(item.bowAngle)) ? { bowAngle: Number(item.bowAngle) } : {}),
              ...(Number.isFinite(Number(item.bowUpperLength))
                ? { bowUpperLength: Math.max(4, Number(item.bowUpperLength)) }
                : {}),
              ...(Number.isFinite(Number(item.bowLowerLength))
                ? { bowLowerLength: Math.max(4, Number(item.bowLowerLength)) }
                : {}),
              ...(Number.isFinite(Number(item.bowControlBaseX))
                ? { bowControlBaseX: Number(item.bowControlBaseX) }
                : {}),
              ...(Number.isFinite(Number(item.bowControlBaseY))
                ? { bowControlBaseY: Number(item.bowControlBaseY) }
                : {}),
              ...(Number.isFinite(Number(item.bowPull)) ? { bowPull: Number(item.bowPull) } : {}),
              ...(typeof item.attachmentImage === "string" && item.attachmentImage.trim()
                ? { attachmentImage: String(item.attachmentImage).trim() }
                : {}),
            }))
            .sort((a, b) => a.frame - b.frame);
        });
        return result;
      }

      function clampFrameToDuration(frame, duration) {
        return Math.max(0, Math.min(Math.max(0, duration), Math.round(Number(frame) || 0)));
      }

      function normalizeAttachment(attachment) {
        if (!attachment || typeof attachment !== "object") return null;
        const normalizedImage = String(attachment.image || "");
        return {
          image: normalizedImage,
          imageVariants: attachmentImageVariants({
            image: normalizedImage,
            imageVariants: Array.isArray(attachment.imageVariants) ? attachment.imageVariants : [],
          }),
          chainTo: attachment.chainTo ? String(attachment.chainTo) : null,
          width: Math.max(1, Number(attachment.width) || 48),
          alpha: Number.isFinite(Number(attachment.alpha))
            ? Math.max(0, Math.min(1, Number(attachment.alpha)))
            : 1,
          layer: Number(attachment.layer) || 0,
          meshCols: Math.max(3, Math.round(Number(attachment.meshCols) || 4)),
          meshRows: Math.max(6, Math.round(Number(attachment.meshRows) || 12)),
          anchorX: Number.isFinite(Number(attachment.anchorX)) ? Number(attachment.anchorX) : 0.5,
          lengthScale: Math.max(0.1, Number(attachment.lengthScale) || 1),
          reverse: Boolean(attachment.reverse),
          segments: Boolean(attachment.segments),
          rotationOffset: Number(attachment.rotationOffset) || 0,
          offsetX: Number(attachment.offsetX) || 0,
          offsetY: Number(attachment.offsetY) || 0,
          lineColor: /^#[0-9a-f]{6}$/i.test(String(attachment.lineColor || "")) ? String(attachment.lineColor) : null,
          lower: normalizeSegmentAttachment(attachment.lower),
          fullSkin: Boolean(attachment.fullSkin),
          skinBoneIds: Array.isArray(attachment.skinBoneIds)
            ? attachment.skinBoneIds.map((id) => String(id))
            : [],
          restPart:
            attachment.restPart && typeof attachment.restPart === "object"
              ? {
                  partId: String(attachment.restPart.partId || ""),
                  x: Number(attachment.restPart.x) || 0,
                  y: Number(attachment.restPart.y) || 0,
                  scale: Math.max(0.001, Number(attachment.restPart.scale) || 1),
                  rotation: Number(attachment.restPart.rotation) || 0,
                  parentBoneId: attachment.restPart.parentBoneId ? String(attachment.restPart.parentBoneId) : null,
                  anchorX: Number.isFinite(Number(attachment.restPart.anchorX))
                    ? Number(attachment.restPart.anchorX)
                    : 0.5,
                  anchorY: Number.isFinite(Number(attachment.restPart.anchorY))
                    ? Number(attachment.restPart.anchorY)
                    : 0.5,
                }
              : null,
          scarfEnabled:
            attachment.scarfEnabled === undefined
              ? String(attachment.image || "") === "head"
              : Boolean(attachment.scarfEnabled),
          scarfSplit: clampNumber(attachment.scarfSplit, 0.05, 0.95, 0.52),
          scarfRootX: clampNumber(attachment.scarfRootX, 0, 1, 0.52),
          scarfRootY: clampNumber(attachment.scarfRootY, 0, 1, 0.6),
          scarfLength: normalizeSpringLength(attachment),
          scarfAngle: normalizeSpringAngle(attachment),
          scarfStiffness: clampNumber(attachment.scarfStiffness, 0, 1, 0.06),
          scarfDamping: clampNumber(attachment.scarfDamping, 0, 0.99, 0.84),
          scarfGravity: Number.isFinite(Number(attachment.scarfGravity))
            ? Number(attachment.scarfGravity)
            : 420,
          scarfWave: Number.isFinite(Number(attachment.scarfWave))
            ? Math.max(0, Number(attachment.scarfWave))
            : 1,
          hemEnabled: Boolean(attachment.hemEnabled),
          hemX: clampNumber(attachment.hemX, 0, 1, 0.5),
          hemY: clampNumber(attachment.hemY, 0, 1, 0.68),
          hemLength: clampNumber(attachment.hemLength, 0.05, 2, 0.75),
          hemAngle: Number.isFinite(Number(attachment.hemAngle)) ? Number(attachment.hemAngle) : 90,
        };
      }

      function normalizeBowRig(bowRig) {
        if (!bowRig || typeof bowRig !== "object") return null;
        const groupRotation = Number.isFinite(Number(bowRig.groupRotation))
          ? Number(bowRig.groupRotation)
          : Number.isFinite(Number(bowRig.angle))
            ? Number(bowRig.angle)
            : null;
        return {
          type: String(bowRig.type || ""),
          centerId: bowRig.centerId ? String(bowRig.centerId) : null,
          upperId: bowRig.upperId ? String(bowRig.upperId) : null,
          lowerId: bowRig.lowerId ? String(bowRig.lowerId) : null,
          stringUpperId: bowRig.stringUpperId ? String(bowRig.stringUpperId) : null,
          stringLowerId: bowRig.stringLowerId ? String(bowRig.stringLowerId) : null,
          stringId: bowRig.stringId ? String(bowRig.stringId) : null,
          maxPull: Math.max(1, Number(bowRig.maxPull) || 60),
          bodyInfluence: Math.max(0, Number(bowRig.bodyInfluence) || 0.5),
          groupRotation,
          angle: groupRotation,
          upperLength: Math.max(4, Number(bowRig.upperLength) || 4),
          lowerLength: Math.max(4, Number(bowRig.lowerLength) || 4),
          controlBaseX: Number.isFinite(Number(bowRig.controlBaseX)) ? Number(bowRig.controlBaseX) : null,
          controlBaseY: Number.isFinite(Number(bowRig.controlBaseY)) ? Number(bowRig.controlBaseY) : null,
          pull: Number.isFinite(Number(bowRig.pull)) ? Number(bowRig.pull) : 0,
        };
      }

      class BowRigController {
        static hasSerializedPose(pose) {
          return [
            "bowGroupRotation",
            "bowAngle",
            "bowUpperLength",
            "bowLowerLength",
            "bowControlBaseX",
            "bowControlBaseY",
            "bowPull",
          ].some((key) => pose && Object.prototype.hasOwnProperty.call(pose, key));
        }

        static enrichPose(node, pose) {
          if (!isBowStringControlNode(node)) return pose;
          const rig = this.rigFromPose(node, pose);
          if (!rig) return pose;
          return {
            ...pose,
            bowPoseSerialized: this.hasSerializedPose(pose),
            bowGroupRotation: rig.groupRotation,
            bowAngle: rig.angle,
            bowUpperLength: rig.upperLength,
            bowLowerLength: rig.lowerLength,
            bowControlBaseX: rig.controlBaseX,
            bowControlBaseY: rig.controlBaseY,
            bowPull: rig.pull,
          };
        }

        static rigFromPose(node, pose) {
          if (!isBowStringControlNode(node)) return normalizeBowRig(node?.bowRig);
          const base = normalizeBowRig(node?.bowRig);
          if (!base) return null;
          const groupRotation =
            pose?.bowGroupRotation ??
            pose?.bowRig?.groupRotation ??
            pose?.bowAngle ??
            pose?.bowRig?.angle ??
            base.groupRotation ??
            base.angle;
          return normalizeBowRig({
            ...base,
            groupRotation,
            angle: groupRotation,
            upperLength: pose?.bowUpperLength ?? pose?.bowRig?.upperLength ?? base.upperLength,
            lowerLength: pose?.bowLowerLength ?? pose?.bowRig?.lowerLength ?? base.lowerLength,
            controlBaseX: pose?.bowControlBaseX ?? pose?.bowRig?.controlBaseX ?? base.controlBaseX,
            controlBaseY: pose?.bowControlBaseY ?? pose?.bowRig?.controlBaseY ?? base.controlBaseY,
            pull: pose?.bowPull ?? pose?.bowRig?.pull ?? base.pull,
          });
        }

        static snapshot(node, source, frame = state.currentFrame) {
          const snap = {
            frame,
            x: source.x,
            y: source.y,
            rotation: source.rotation,
            length: source.length,
            scaleX: source.scaleX,
            scaleY: source.scaleY,
            visible: source.visible !== false,
          };
          const rig = this.rigFromPose(node, source);
          if (!rig) return snap;
          return {
            ...snap,
            bowGroupRotation: rig.groupRotation,
            bowAngle: rig.angle,
            bowUpperLength: rig.upperLength,
            bowLowerLength: rig.lowerLength,
            bowControlBaseX: rig.controlBaseX,
            bowControlBaseY: rig.controlBaseY,
            bowPull: rig.pull,
          };
        }

        static interpolatePose(node, before, after, t, basePose) {
          if (!isBowStringControlNode(node)) return basePose;
          const from = this.enrichPose(node, before || {});
          const to = this.enrichPose(node, after || before || {});
          return {
            ...basePose,
            bowPoseSerialized: Boolean(from.bowPoseSerialized || to.bowPoseSerialized),
            bowGroupRotation: lerpAngle(
              Number(from.bowGroupRotation ?? from.bowAngle) || 0,
              Number(to.bowGroupRotation ?? to.bowAngle) || 0,
              t,
            ),
            bowAngle: lerpAngle(
              Number(from.bowGroupRotation ?? from.bowAngle) || 0,
              Number(to.bowGroupRotation ?? to.bowAngle) || 0,
              t,
            ),
            bowUpperLength: lerp(Number(from.bowUpperLength) || 4, Number(to.bowUpperLength) || 4, t),
            bowLowerLength: lerp(Number(from.bowLowerLength) || 4, Number(to.bowLowerLength) || 4, t),
            bowControlBaseX: lerp(Number(from.bowControlBaseX) || 0, Number(to.bowControlBaseX) || 0, t),
            bowControlBaseY: lerp(Number(from.bowControlBaseY) || 0, Number(to.bowControlBaseY) || 0, t),
            bowPull: lerp(Number(from.bowPull) || 0, Number(to.bowPull) || 0, t),
          };
        }

        static persistKeyframe(node) {
          if (isBindingMode() || !node) return;
          upsertKeyframe(node, this.snapshot(node, { ...node }));
        }
      }

      function normalizeSpringLength(attachment) {
        if (Number.isFinite(Number(attachment.scarfLength))) {
          return clampNumber(attachment.scarfLength, 0.05, 2, 0.55);
        }
        if (
          Number.isFinite(Number(attachment.scarfRootX)) &&
          Number.isFinite(Number(attachment.scarfRootY)) &&
          Number.isFinite(Number(attachment.scarfTipX)) &&
          Number.isFinite(Number(attachment.scarfTipY))
        ) {
          const dx = Number(attachment.scarfTipX) - Number(attachment.scarfRootX);
          const dy = Number(attachment.scarfTipY) - Number(attachment.scarfRootY);
          return clampNumber(Math.hypot(dx, dy), 0.05, 2, 0.55);
        }
        return 0.55;
      }

      function normalizeSpringAngle(attachment) {
        if (Number.isFinite(Number(attachment.scarfAngle))) return Number(attachment.scarfAngle);
        if (
          Number.isFinite(Number(attachment.scarfRootX)) &&
          Number.isFinite(Number(attachment.scarfRootY)) &&
          Number.isFinite(Number(attachment.scarfTipX)) &&
          Number.isFinite(Number(attachment.scarfTipY))
        ) {
          const dx = Number(attachment.scarfTipX) - Number(attachment.scarfRootX);
          const dy = Number(attachment.scarfTipY) - Number(attachment.scarfRootY);
          return (Math.atan2(dy, dx) * 180) / Math.PI;
        }
        return 154;
      }

      function normalizeSegmentAttachment(attachment) {
        if (!attachment || typeof attachment !== "object") return null;
        return {
          width: Math.max(1, Number(attachment.width) || 48),
          alpha: Number.isFinite(Number(attachment.alpha))
            ? Math.max(0, Math.min(1, Number(attachment.alpha)))
            : 1,
          anchorX: Number.isFinite(Number(attachment.anchorX)) ? Number(attachment.anchorX) : 0.5,
          rotationOffset: Number(attachment.rotationOffset) || 0,
          offsetX: Number(attachment.offsetX) || 0,
          offsetY: Number(attachment.offsetY) || 0,
        };
      }

      function normalizeBindPose(pose) {
        return {
          x: Number(pose?.x) || 0,
          y: Number(pose?.y) || 0,
          rotation: Number(pose?.rotation) || 0,
          length: Math.max(4, Number(pose?.length) || 80),
          scaleX: Math.max(0.05, Number(pose?.scaleX) || 1),
          scaleY: Math.max(0.05, Number(pose?.scaleY) || 1),
        };
      }

      function clampNumber(value, min, max, fallback) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.max(min, Math.min(max, number));
      }

      function round(value, places = 1) {
        const scale = 10 ** places;
        return Math.round(value * scale) / scale;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          })[char],
        );
      }

      function isDescendant(candidateId, ancestorId) {
        let current = state.nodes.find((node) => node.id === candidateId);
        while (current?.parentId) {
          if (current.parentId === ancestorId) return true;
          current = state.nodes.find((node) => node.id === current.parentId);
        }
        return false;
      }

      function reparentNodePreserveWorld(node, parentId) {
        if (!node) return;
        const nextParentId = parentId || null;
        const pose = worldPose(node);
        const parent = nextParentId ? state.nodes.find((item) => item.id === nextParentId) : null;
        const parentPose = parent ? worldPose(parent) : null;
        const local = parentPose
          ? localFromWorldByParentPose(parentPose, { x: pose.worldX, y: pose.worldY })
          : { x: pose.worldX, y: pose.worldY };
        node.parentId = nextParentId;
        node.x = local.x;
        node.y = local.y;
        node.rotation = pose.worldRotation - (parentPose?.worldRotation || 0);
        node.scaleX = (pose.worldScaleX || 1) / (parentPose?.worldScaleX || 1);
        node.scaleY = (pose.worldScaleY || 1) / (parentPose?.worldScaleY || 1);
        if (isBindingMode()) {
          node.bindPose = normalizeBindPose(node);
          Object.assign(node, node.bindPose);
        } else {
          syncKeyAtCurrentFrame(node);
        }
      }

      function setBowRigParent(node, parentId) {
        const nodes = bowRigNodesForNode(node);
        if (!nodes?.center) return false;
        ensureBowRigPieceRestPart(nodes);
        reparentNodePreserveWorld(nodes.center, parentId);
        [nodes.upper, nodes.lower, nodes.stringUpper, nodes.stringLower, nodes.control].forEach((child) => {
          if (child?.parentId !== nodes.center.id) {
            reparentNodePreserveWorld(child, nodes.center.id);
          }
        });
        syncBowRigFromModel(nodes.control);
        return true;
      }

      function setNodePatch(patch, shouldRender = true) {
        const node = selectedNode();
        if (!node) return;
        if (patch && isTransformLockedNode(node)) {
          const filteredPatch = { ...patch };
          ["x", "y", "rotation", "length", "scaleX", "scaleY", "parentId"].forEach((key) => {
            delete filteredPatch[key];
          });
          if (!Object.keys(filteredPatch).length) return;
          patch = filteredPatch;
        }
        if (patch && Object.prototype.hasOwnProperty.call(patch, "rotation") && isBowRigNode(node)) {
          const nodes = bowRigNodesForNode(node);
          if (nodes?.control) {
            const model = ensureBowRigModel(nodes.control);
            if (model) {
              model.rig.groupRotation = Number(patch.rotation) || 0;
              model.rig.angle = model.rig.groupRotation;
              nodes.control.bowRig = normalizeBowRig(model.rig);
              syncBowRigFromModel(nodes.control);
              BowRigController.persistKeyframe(nodes.control);
              state.selectedKey = { nodeId: nodes.control.id, frame: state.currentFrame };
              const remainingPatch = { ...patch };
              delete remainingPatch.rotation;
              if (!Object.keys(remainingPatch).length) {
                if (shouldRender) renderAll();
                return;
              }
              patch = remainingPatch;
            }
          }
        }
        if (patch && Object.prototype.hasOwnProperty.call(patch, "parentId") && isBowRigNode(node)) {
          setBowRigParent(node, patch.parentId || null);
          const remainingPatch = { ...patch };
          delete remainingPatch.parentId;
          if (!Object.keys(remainingPatch).length) {
            if (shouldRender) renderAll();
            return;
          }
          patch = remainingPatch;
        }
        if (isBindingMode()) {
          const transformKeys = ["x", "y", "rotation", "length", "scaleX", "scaleY"];
          const transformPatch = {};
          const nodePatch = {};
          Object.entries(patch).forEach(([key, value]) => {
            if (transformKeys.includes(key)) transformPatch[key] = value;
            else nodePatch[key] = value;
          });
          Object.assign(node, nodePatch);
          if (Object.keys(transformPatch).length) {
            node.bindPose = normalizeBindPose({ ...getRestLocalPose(node), ...transformPatch });
            Object.assign(node, node.bindPose);
          }
        } else {
          Object.assign(node, patch);
          upsertKeyframe(node, snapshotNode(node));
          state.selectedKey = { nodeId: node.id, frame: state.currentFrame };
          snapshotAllBowRigsAtCurrentFrame();
        }
        if (shouldRender) renderAll();
      }

      function setAttachmentPatch(patch) {
        const { owner: node, lower } = attachmentEditContext();
        if (!node) return;
        if (isTransformLockedNode(node)) return;
        if (patch === null) {
          if (lower && node.attachment) node.attachment.lower = null;
          else node.attachment = null;
        } else {
          if (lower) {
            const sharedPatch = {};
            const lowerPatch = {};
            Object.entries(patch).forEach(([key, value]) => {
              if (["image", "imageVariants", "chainTo", "segments", "layer"].includes(key)) sharedPatch[key] = value;
              else if (
                ["width", "alpha", "anchorX", "rotationOffset", "offsetX", "offsetY"].includes(key)
              ) {
                lowerPatch[key] = value;
              }
            });
            node.attachment = normalizeAttachment({
              ...(node.attachment || createDefaultAttachment()),
              ...sharedPatch,
              lower: normalizeSegmentAttachment({
                ...(node.attachment?.lower || {
                  width: node.attachment?.width,
                  alpha: node.attachment?.alpha,
                  anchorX: node.attachment?.anchorX,
                  rotationOffset: node.attachment?.rotationOffset,
                  offsetX: node.attachment?.offsetX,
                  offsetY: node.attachment?.offsetY,
                }),
                ...lowerPatch,
              }),
            });
          } else {
            node.attachment = normalizeAttachment({
              ...(node.attachment || createDefaultAttachment()),
              ...patch,
            });
          }
        }
        dynamicScarves.clear();
        renderAll();
      }

      function setAttachmentImageVariants(nextVariants) {
        const node = attachmentEditNode();
        if (!node?.attachment) return;
        const normalized = attachmentImageVariants({
          image: node.attachment.image,
          imageVariants: nextVariants,
        });
        node.attachment = normalizeAttachment({
          ...node.attachment,
          imageVariants: normalized,
        });
        renderAll();
      }

      function addAttachmentVariant(image) {
        const node = attachmentEditNode();
        if (!node?.attachment || isTransformLockedNode(node)) return;
        const nextImage = String(image || "").trim();
        if (!nextImage) return;
        setAttachmentImageVariants([...attachmentImageVariants(node.attachment), nextImage]);
      }

      async function importAttachmentVariantFromLegAssetInput() {
        const node = attachmentEditNode();
        if (!node?.attachment || isTransformLockedNode(node)) return;
        const filename = String(el.attachmentLegAssetSelect?.value || "").trim();
        if (!filename) return;
        const imageKey = registerLegAssetImage(filename);
        addAttachmentVariant(imageKey);
      }

      async function importAttachmentVariantFromFile(file) {
        const node = attachmentEditNode();
        if (!node?.attachment || isTransformLockedNode(node) || !file) return;
        const image = await loadFileImage(file);
        const cleanName = normalizeLegAssetFilename(file.name);
        const customImageId = `${customImagePrefix}attachment-variant-${uid("image")}`;
        registerCustomImage(customImageId, file.name, `${legAssetPrefix}${cleanName}`, { image });
        addAttachmentVariant(customImageId);
      }

      function replacePieceImageReferences(piece, fromImage, toImage) {
        if (!piece?.attachment || !fromImage || !toImage) return;
        const nextVariants = [
          toImage,
          ...attachmentImageVariants(piece.attachment).map((image) => (image === fromImage ? toImage : image)),
        ].filter(Boolean);
        piece.attachment = normalizeAttachment({
          ...piece.attachment,
          image: piece.attachment.image === fromImage ? toImage : piece.attachment.image,
          imageVariants: [...new Set(nextVariants)],
        });
        attachmentImageKeys(piece).forEach((keyframe) => {
          if (keyframe.attachmentImage === fromImage) {
            keyframe.attachmentImage = toImage;
          }
        });
      }

      async function cleanupSelectedPieceImage() {
        if (!isBindingMode()) {
          toast("请先进入绑定管理。");
          return;
        }
        const piece = selectedPieceNode();
        if (!piece?.attachment) {
          toast("请先选择一个物块。");
          return;
        }
        const imageKey = getAttachmentImageForFrame(piece);
        const sourceImage = warriorImages[imageKey];
        if (!sourceImage?.complete) {
          toast("当前物块贴图还没加载完成。");
          return;
        }
        const processed = preprocessImportedImageData(imageToImageData(sourceImage), state.imageCleanup);
        if (!processed.components.length) {
          toast("清理后没有保留任何可见像素。");
          return;
        }
        const outputImage = await imageDataToImage(processed.imageData);
        const customImageId = `${customImagePrefix}piece-cleanup-${uid("image")}`;
        const baseName = String(piece.name || imageKey || "piece").trim().replace(/\s+/g, "_") || "piece";
        registerCustomImage(
          customImageId,
          `${baseName}-clean.png`,
          imageDataToDataUrl(processed.imageData),
          { image: outputImage },
        );
        replacePieceImageReferences(piece, imageKey, customImageId);
        renderAll();
        toast(`已清理当前物块贴图：${baseName}`);
      }

      function setAttachmentDefaultImage(image) {
        const node = attachmentEditNode();
        if (!node?.attachment || isTransformLockedNode(node)) return;
        const nextImage = String(image || "").trim();
        if (!nextImage) return;
        node.attachment = normalizeAttachment({
          ...node.attachment,
          image: nextImage,
          imageVariants: [nextImage, ...attachmentImageVariants(node.attachment)],
        });
        renderAll();
      }

      function removeAttachmentVariant(image) {
        const node = attachmentEditNode();
        if (!node?.attachment || isTransformLockedNode(node)) return;
        const nextImage = String(image || "").trim();
        const variants = attachmentImageVariants(node.attachment).filter((value) => value !== nextImage);
        if (!variants.length) return;
        const nextDefault = node.attachment.image === nextImage ? variants[0] : node.attachment.image;
        node.attachment = normalizeAttachment({
          ...node.attachment,
          image: nextDefault,
          imageVariants: variants,
        });
        const keys = state.timelines[node.id] || [];
        state.timelines[node.id] = keys.map((item) =>
          item.attachmentImage === nextImage ? { ...item, attachmentImage: nextDefault } : item,
        );
        renderAll();
      }

      function setAttachmentImageKeyAtCurrentFrame(image = el.attachmentImageKeySelect?.value) {
        const node = attachmentEditNode();
        if (!node?.attachment || isBindingMode()) return;
        const nextImage = String(image || "").trim();
        if (!nextImage) return;
        const variants = attachmentImageVariants(node.attachment);
        if (variants.length && !variants.includes(nextImage)) return;
        const keys = state.timelines[node.id] || [];
        const existing = keys.find((item) => item.frame === state.currentFrame);
        if (existing) existing.attachmentImage = nextImage;
        else keys.push({ ...sourceSnapshotNode(node), frame: state.currentFrame, attachmentImage: nextImage });
        keys.sort((a, b) => a.frame - b.frame);
        state.timelines[node.id] = keys;
        state.selectedKey = { nodeId: node.id, frame: state.currentFrame, channel: "attachmentImage" };
        renderAll();
      }

      function deleteAttachmentImageKeyAtCurrentFrame() {
        const node = attachmentEditNode();
        if (!node?.attachment) return;
        const keys = state.timelines[node.id] || [];
        let changed = false;
        state.timelines[node.id] = keys.flatMap((item) => {
          if (item.frame !== state.currentFrame || !item.attachmentImage) return [item];
          changed = true;
          const next = { ...item };
          delete next.attachmentImage;
          const hasPoseData =
            ["x", "y", "rotation", "length", "scaleX", "scaleY", "visible"].some((key) => key in next) ||
            BowRigController.hasSerializedPose(next);
          return hasPoseData ? [next] : [];
        });
        if (changed && state.selectedKey?.channel === "attachmentImage" && state.selectedKey?.nodeId === node.id) {
          state.selectedKey = null;
        }
        renderAll();
      }

      function createDefaultAttachment(image = "body") {
        return {
          image,
          imageVariants: image ? [image] : [],
          chainTo: null,
          width: image === "head" ? 56 : 48,
          alpha: 1,
          layer: 0,
          anchorX: 0.5,
          lengthScale: 1,
          reverse: false,
          segments: false,
          rotationOffset: 0,
          offsetX: 0,
          offsetY: 0,
          scarfEnabled: image === "head",
          scarfSplit: 0.52,
          scarfRootX: 0.52,
          scarfRootY: 0.6,
          scarfLength: 0.55,
          scarfAngle: 154,
          scarfStiffness: 0.06,
          scarfDamping: 0.84,
          scarfGravity: 420,
          scarfWave: 1,
          hemEnabled: false,
          hemX: 0.5,
          hemY: 0.68,
          hemLength: 0.75,
          hemAngle: 90,
        };
      }

      function syncKeyAtCurrentFrame(node) {
        if (isBindingMode()) return;
        const keys = state.timelines[node.id] || [];
        const existing = keys.find((item) => item.frame === state.currentFrame);
        if (existing) Object.assign(existing, snapshotNode(node));
      }

      function snapshotNode(node) {
        const override = poseOverrides.get(node.id);
        const source = override ? { ...node, ...override } : { ...node };
        if (!isBindingMode()) {
          source.visible = getLocalPose(node, state.currentFrame).visible !== false;
        }
        return BowRigController.snapshot(node, source, state.currentFrame);
      }

      function copyPoseAtFrame(source, frame = state.currentFrame) {
        const node = source?.id ? state.nodes.find((item) => item.id === source.id) || source : source;
        return BowRigController.snapshot(node, source, frame);
      }

      function visibilitySnapshotAtCurrentFrame(node, visible) {
        return {
          ...copyPoseAtFrame(getLocalPose(node, state.currentFrame), state.currentFrame),
          frame: state.currentFrame,
          visible,
        };
      }

      function sourceSnapshotNode(node) {
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        if (!keys.length) return snapshotNode(node);
        const start = keys.find((item) => item.frame === 0) || keys[0];
        const previous = [...keys].reverse().find((item) => item.frame < state.currentFrame) || start;
        const next = keys.find((item) => item.frame > state.currentFrame) || start;
        const source =
          state.keyframeSource === "next" ? next : state.keyframeSource === "start" ? start : previous;
        return copyPoseAtFrame({ ...node, ...source });
      }

      function addKeyframe(node = selectedNode()) {
        if (!node) return;
        upsertKeyframe(node, sourceSnapshotNode(node));
        snapshotAllBowRigsAtCurrentFrame();
        state.selectedKey = { nodeId: node.id, frame: state.currentFrame };
        toast(`Recorded ${node.name} at frame ${state.currentFrame + 1}`);
        renderAll();
      }

      function upsertKeyframe(node, snap = snapshotNode(node)) {
        const keys = state.timelines[node.id] || [];
        const existing = keys.find((item) => item.frame === state.currentFrame);
        if (existing) Object.assign(existing, snap);
        else keys.push(snap);
        keys.sort((a, b) => a.frame - b.frame);
        state.timelines[node.id] = keys;
      }

      function deleteSelectedKey() {
        if (!state.selectedKey) {
          const node = selectedNode();
          state.selectedKey = { nodeId: node.id, frame: state.currentFrame };
        }
        const keys = state.timelines[state.selectedKey.nodeId] || [];
        const next = keys.flatMap((item) => {
          if (item.frame !== state.selectedKey.frame) return [item];
          if (state.selectedKey.channel !== "attachmentImage") return [];
          if (!item.attachmentImage) return [item];
          const cloned = { ...item };
          delete cloned.attachmentImage;
          const hasPoseData =
            ["x", "y", "rotation", "length", "scaleX", "scaleY", "visible"].some((key) => key in cloned) ||
            BowRigController.hasSerializedPose(cloned);
          return hasPoseData ? [cloned] : [];
        });
        state.timelines[state.selectedKey.nodeId] = next;
        state.selectedKey = null;
        renderAll();
      }

      function deleteCurrentFrameKeys() {
        const frame = Math.round(state.currentFrame);
        let deleted = 0;
        Object.keys(state.timelines).forEach((nodeId) => {
          const keys = state.timelines[nodeId] || [];
          const next = keys.filter((item) => item.frame !== frame);
          deleted += keys.length - next.length;
          state.timelines[nodeId] = next;
        });
        state.selectedKey = null;
        renderAll();
        toast(deleted ? `Deleted ${deleted} keyframes at frame ${frame + 1}` : `No keyframes at frame ${frame + 1}`);
      }

      function setSelectedArrowVisibilityAtCurrentFrame(visible) {
        if (isBindingMode()) {
          toast("Arrow visibility can only be edited in animation mode.");
          return;
        }
        const piece = selectedArrowPiece();
        const nodes = arrowRigNodesForPiece(piece);
        if (!nodes.length) {
          toast("Create an arrow rig first.");
          return;
        }
        const track = normalizeArrowVisibilityTrack([
          ...(state.arrowVisibilityTracks?.[piece.id] || legacyArrowVisibilityTrackForPiece(piece)).filter(
            (item) => item.frame !== state.currentFrame,
          ),
          { frame: state.currentFrame, visible },
        ]);
        state.arrowVisibilityTracks[piece.id] = track;
        state.selectedNodeId = nodes[0].id;
        state.selectedPieceNodeId = piece?.id || null;
        state.selectedKey = null;
        renderAll();
        toast(`Arrow ${visible ? "shown" : "hidden"} at frame ${state.currentFrame + 1}`);
      }

      function setSelectedArrowParentAtCurrentFrame(parentId) {
        if (isBindingMode()) {
          toast("Arrow temp parent can only be edited in animation mode.");
          return;
        }
        const piece = selectedArrowPiece();
        const bone = arrowCarrierBoneForPiece(piece);
        if (!piece || !bone) {
          toast("Create an arrow rig first.");
          return;
        }
        if (parentId && parentId === bone.id) {
          toast("Arrow temp parent cannot bind to itself.");
          return;
        }
        const currentTrack = normalizeArrowParentTrack(state.arrowParentTracks?.[piece.id]);
        const previousParentId = arrowParentAtFrame(piece, state.currentFrame);
        const nextFrame = currentTrack.find((item) => item.frame > state.currentFrame)?.frame ?? Infinity;
        convertNodeKeysToParentContext(bone, previousParentId, parentId, state.currentFrame, nextFrame);
        state.arrowParentTracks[piece.id] = normalizeArrowParentTrack([
          ...currentTrack.filter((item) => item.frame !== state.currentFrame),
          { frame: state.currentFrame, parentId: parentId || null },
        ]);
        state.selectedNodeId = bone.id;
        state.selectedPieceNodeId = piece.id;
        state.selectedKey = { nodeId: bone.id, frame: state.currentFrame };
        renderAll();
        toast(
          parentId
            ? `Arrow temp parent bound at frame ${state.currentFrame + 1}`
            : `Arrow temp parent cleared at frame ${state.currentFrame + 1}`,
        );
      }

      function resetSelectedArrowVisibilityForCurrentAction() {
        if (isBindingMode()) {
          toast("Arrow visibility reset is only available in animation mode.");
          return;
        }
        const piece = selectedArrowPiece();
        const nodes = arrowRigNodesForPiece(piece);
        if (!piece || !nodes.length) {
          toast("Select an arrow rig first.");
          return;
        }
        state.arrowVisibilityTracks[piece.id] = normalizeArrowVisibilityTrack([{ frame: 0, visible: true }]);
        state.selectedNodeId = nodes[0].id;
        state.selectedPieceNodeId = piece.id;
        state.selectedKey = null;
        renderAll();
        toast("Reset arrow visibility for the current action.");
      }

      function setSelectedSlashFxVisibilityAtCurrentFrame(visible) {
        const fxContext = slashEffectContext();
        if (isBindingMode()) {
          toast(`${fxContext.label} visibility can only be edited in animation mode.`);
          return;
        }
        const piece = selectedSlashFxPiece();
        const nodes = slashFxRigNodesForPiece(piece);
        if (!nodes.length) {
          toast(`Create ${fxContext.label} first.`);
          return;
        }
        let nextTrack = [...(state.slashFxVisibilityTracks?.[piece.id] || []).filter((item) => item.frame !== state.currentFrame)];
        if (visible && state.currentFrame > 0) {
          const hasHiddenBefore = nextTrack.some((item) => item.frame < state.currentFrame && item.visible === false);
          if (!hasHiddenBefore) {
            let rewroteBaseline = false;
            nextTrack = nextTrack.map((item) => {
              if (item.frame === 0) {
                rewroteBaseline = true;
                return { frame: 0, visible: false };
              }
              return item;
            });
            if (!rewroteBaseline) {
              nextTrack.push({ frame: 0, visible: false });
            }
          }
        }
        state.slashFxVisibilityTracks[piece.id] = normalizeSlashFxVisibilityTrack([
          ...nextTrack,
          { frame: state.currentFrame, visible },
        ]);
        state.selectedNodeId = nodes[0].id;
        state.selectedPieceNodeId = piece?.id || null;
        state.selectedKey = null;
        renderAll();
        toast(`${fxContext.label} ${visible ? "shown" : "hidden"} at frame ${state.currentFrame + 1}`);
      }

      function resetSelectedSlashFxVisibilityForCurrentAction() {
        if (isBindingMode()) {
          toast("Slash FX visibility reset is only available in animation mode.");
          return;
        }
        const piece = selectedSlashFxPiece();
        const nodes = slashFxRigNodesForPiece(piece);
        if (!piece || !nodes.length) {
          toast("Select a slash FX rig first.");
          return;
        }
        state.slashFxVisibilityTracks[piece.id] = normalizeSlashFxVisibilityTrack([{ frame: 0, visible: false }]);
        delete state.slashFxActionHiddenMap[piece.id];
        state.selectedNodeId = nodes[0].id;
        state.selectedPieceNodeId = piece.id;
        state.selectedKey = null;
        renderAll();
        toast("Reset slash FX visibility for the current action.");
      }

      function toggleSelectedSlashFxHiddenForAction() {
        const fxContext = slashEffectContext();
        if (isBindingMode()) {
          toast(`${fxContext.label} action visibility can only be edited in animation mode.`);
          return;
        }
        const piece = selectedSlashFxPiece();
        const nodes = slashFxRigNodesForPiece(piece);
        if (!nodes.length || !piece) {
          toast(`Create ${fxContext.label} first.`);
          return;
        }
        const nextHidden = !isSlashFxHiddenForCurrentAction(piece);
        if (nextHidden) {
          state.slashFxActionHiddenMap[piece.id] = true;
        } else {
          delete state.slashFxActionHiddenMap[piece.id];
        }
        state.selectedNodeId = nodes[0].id;
        state.selectedPieceNodeId = piece.id;
        state.selectedKey = null;
        renderAll();
        toast(nextHidden ? `${fxContext.label} hidden for this action.` : `${fxContext.label} shown for this action.`);
      }

      function setSelectedSlashFxParentAtCurrentFrame(parentId) {
        const fxContext = slashEffectContext();
        if (isBindingMode()) {
          toast(`${fxContext.label} temp parent can only be edited in animation mode.`);
          return;
        }
        const piece = selectedSlashFxPiece();
        const bone = slashFxCarrierBoneForPiece(piece);
        if (!piece || !bone) {
          toast(`Create ${fxContext.label} first.`);
          return;
        }
        if (parentId && parentId === bone.id) {
          toast(`${fxContext.label} temp parent cannot bind to itself.`);
          return;
        }
        const currentTrack = normalizeSlashFxParentTrack(state.slashFxParentTracks?.[piece.id]);
        const previousParentId = slashFxParentAtFrame(piece, state.currentFrame);
        const nextFrame = currentTrack.find((item) => item.frame > state.currentFrame)?.frame ?? Infinity;
        convertNodeKeysToParentContext(bone, previousParentId, parentId, state.currentFrame, nextFrame);
        state.slashFxParentTracks[piece.id] = normalizeSlashFxParentTrack([
          ...currentTrack.filter((item) => item.frame !== state.currentFrame),
          { frame: state.currentFrame, parentId: parentId || null },
        ]);
        state.selectedNodeId = bone.id;
        state.selectedPieceNodeId = piece.id;
        state.selectedKey = { nodeId: bone.id, frame: state.currentFrame };
        renderAll();
        toast(
          parentId
            ? `${fxContext.label} temp parent bound at frame ${state.currentFrame + 1}`
            : `${fxContext.label} temp parent cleared at frame ${state.currentFrame + 1}`,
        );
      }

      function keyDragEntries(nodeId, keyframe, mode = state.keyMoveMode) {
        const sourceFrame = keyframe.frame;
        if (mode !== "all") return [{ nodeId, keyframe, sourceFrame }];
        return Object.entries(state.timelines).flatMap(([entryNodeId, keys]) =>
          (keys || [])
            .filter((item) => item.frame === sourceFrame)
            .map((item) => ({ nodeId: entryNodeId, keyframe: item, sourceFrame })),
        );
      }

      function selectedAction() {
        return state.actions.find((action) => action.id === state.selectedActionId) || state.actions[0] || null;
      }

      function syncCurrentActionFromTimeline() {
        if (actionAutosavePaused) return;
        const action = selectedAction();
        if (!action) return;
        action.duration = state.duration;
        action.timelines = cloneTimelines(state.timelines);
        action.arrowVisibilityTracks = cloneArrowVisibilityTracks(state.arrowVisibilityTracks, action.duration);
        action.arrowParentTracks = cloneArrowParentTracks(state.arrowParentTracks, action.duration);
        action.slashFxVisibilityTracks = cloneSlashFxVisibilityTracks(state.slashFxVisibilityTracks, action.duration);
        action.slashFxParentTracks = cloneSlashFxParentTracks(state.slashFxParentTracks, action.duration);
        action.slashFxActionHiddenMap = cloneSlashFxActionHiddenMap(state.slashFxActionHiddenMap);
      }

      function createActionSnapshot(name, id = uid("action")) {
        return {
          id,
          name: String(name || "new_action"),
          duration: state.duration,
          timelines: cloneTimelines(state.timelines),
          arrowVisibilityTracks: cloneArrowVisibilityTracks(state.arrowVisibilityTracks, state.duration),
          arrowParentTracks: cloneArrowParentTracks(state.arrowParentTracks, state.duration),
          slashFxVisibilityTracks: cloneSlashFxVisibilityTracks(state.slashFxVisibilityTracks, state.duration),
          slashFxParentTracks: cloneSlashFxParentTracks(state.slashFxParentTracks, state.duration),
          slashFxActionHiddenMap: cloneSlashFxActionHiddenMap(state.slashFxActionHiddenMap),
        };
      }

      function cloneTimelines(timelines) {
        return Object.fromEntries(
          Object.entries(timelines || {}).map(([nodeId, keys]) => [
            nodeId,
            Array.isArray(keys) ? keys.map((keyframe) => ({ ...keyframe })) : [],
          ]),
        );
      }

      function currentPoseTimelines() {
        const result = {};
        state.nodes.forEach((node) => {
          result[node.id] = [copyPoseAtFrame(getLocalPose(node), 0)];
        });
        return result;
      }

      function newAction() {
        const suggested = `Action ${state.actions.length + 1}`;
        const name = window.prompt("Enter action name", suggested);
        if (name === null) return;
        const action = {
          id: uid("action"),
          name: String(name || suggested),
          duration: state.duration,
          timelines: currentPoseTimelines(),
          arrowVisibilityTracks: cloneArrowVisibilityTracks(state.arrowVisibilityTracks, state.duration),
          arrowParentTracks: cloneArrowParentTracks(state.arrowParentTracks, state.duration),
          slashFxVisibilityTracks: cloneSlashFxVisibilityTracks(state.slashFxVisibilityTracks, state.duration),
          slashFxParentTracks: cloneSlashFxParentTracks(state.slashFxParentTracks, state.duration),
          slashFxActionHiddenMap: cloneSlashFxActionHiddenMap(state.slashFxActionHiddenMap),
        };
        state.actions.push(action);
        selectAction(action.id);
        toast(`Duplicated action: ${action.name}`);
      }

      async function saveCurrentAction() {
        let action = selectedAction();
        if (!action) {
          action = createActionSnapshot(el.actionNameInput.value || "new_action");
          state.actions.push(action);
          state.selectedActionId = action.id;
        }
        action.name = el.actionNameInput.value.trim() || action.name || "new_action";
        action.duration = state.duration;
        action.timelines = cloneTimelines(state.timelines);
        action.arrowVisibilityTracks = cloneArrowVisibilityTracks(state.arrowVisibilityTracks, action.duration);
        action.arrowParentTracks = cloneArrowParentTracks(state.arrowParentTracks, action.duration);
        action.slashFxVisibilityTracks = cloneSlashFxVisibilityTracks(state.slashFxVisibilityTracks, action.duration);
        action.slashFxParentTracks = cloneSlashFxParentTracks(state.slashFxParentTracks, action.duration);
        action.slashFxActionHiddenMap = cloneSlashFxActionHiddenMap(state.slashFxActionHiddenMap);
        renderAll();
        await saveProjectJsonFile({ suggestedPath: defaultProjectSavePath() });
      }

      function deleteSelectedAction() {
        if (state.actions.length <= 1) {
          toast("At least one action must remain");
          return;
        }
        syncCurrentActionFromTimeline();
        const index = state.actions.findIndex((item) => item.id === state.selectedActionId);
        if (index < 0) return;
        const [removed] = state.actions.splice(index, 1);
        const nextAction = state.actions[index] || state.actions[index - 1] || state.actions[0] || null;
        if (!nextAction) {
          renderAll();
          return;
        }
        state.selectedActionId = nextAction.id;
        state.duration = Math.max(0, Number(nextAction.duration) || 0);
        state.currentFrame = 0;
        state.selectedKey = null;
        state.playing = false;
        poseOverrides.clear();
        dynamicScarves.clear();
        state.timelines = cloneTimelines(nextAction.timelines);
        state.arrowVisibilityTracks = cloneArrowVisibilityTracks(nextAction.arrowVisibilityTracks);
        state.arrowParentTracks = cloneArrowParentTracks(nextAction.arrowParentTracks);
        state.slashFxVisibilityTracks = cloneSlashFxVisibilityTracks(nextAction.slashFxVisibilityTracks);
        state.slashFxParentTracks = cloneSlashFxParentTracks(nextAction.slashFxParentTracks);
        state.slashFxActionHiddenMap = cloneSlashFxActionHiddenMap(nextAction.slashFxActionHiddenMap);
        hydrateBowRigTimelineMap(state.timelines);
        syncCurrentActionFromTimeline();
        renderAll();
        toast(`Deleted action: ${removed?.name || ""}`);
      }

      function copyCurrentFrameKeyframes() {
        if (isBindingMode()) return;
        const sourceFrame = Math.round(state.selectedKey?.frame ?? state.currentFrame);
        state.keyframeClipboard = {
          frame: sourceFrame,
          poses: Object.fromEntries(
            state.nodes.map((node) => [node.id, copyPoseAtFrame(getLocalPose(node, sourceFrame), sourceFrame)]),
          ),
        };
        renderStatus();
        toast(`Copied frame ${sourceFrame + 1}`);
      }

      function pasteCopiedKeyframes() {
        if (isBindingMode()) return;
        if (!state.keyframeClipboard?.poses) {
          toast("No copied frame");
          return;
        }
        const targetFrame = Math.round(state.currentFrame);
        let pasted = 0;
        state.nodes.forEach((node) => {
          const pose = state.keyframeClipboard.poses[node.id];
          if (!pose) return;
          upsertKeyframe(node, { ...pose, frame: targetFrame });
          pasted += 1;
        });
        state.selectedKey = selectedNode() ? { nodeId: selectedNode().id, frame: targetFrame } : null;
        syncCurrentActionFromTimeline();
        renderAll();
        toast(`Pasted ${pasted} nodes to frame ${targetFrame + 1}`);
      }

      function selectAction(actionId) {
        const action = state.actions.find((item) => item.id === actionId);
        if (!action) return;
        syncCurrentActionFromTimeline();
        state.selectedActionId = action.id;
        state.duration = Math.max(0, Number(action.duration) || 0);
        state.currentFrame = 0;
        state.selectedKey = null;
        state.playing = false;
        poseOverrides.clear();
        dynamicScarves.clear();
        state.timelines = cloneTimelines(action.timelines);
        state.arrowVisibilityTracks = cloneArrowVisibilityTracks(action.arrowVisibilityTracks);
        state.arrowParentTracks = cloneArrowParentTracks(action.arrowParentTracks);
        state.slashFxVisibilityTracks = cloneSlashFxVisibilityTracks(action.slashFxVisibilityTracks);
        state.slashFxParentTracks = cloneSlashFxParentTracks(action.slashFxParentTracks);
        state.slashFxActionHiddenMap = cloneSlashFxActionHiddenMap(action.slashFxActionHiddenMap);
        hydrateBowRigTimelineMap(state.timelines);
        syncCurrentActionFromTimeline();
        renderAll();
        toast(`Switched to action: ${action.name}`);
      }

      function frameFromPointer(event, container) {
        const rect = container.getBoundingClientRect();
        const x = event.clientX - rect.left + container.scrollLeft;
        return Math.round(x / frameWidth);
      }

      function stageScreenPoint(event) {
        const rect = el.stage.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
        };
      }

      function worldFromScreen(point) {
        const view = state.stageView || { zoom: 1, x: 0, y: 0 };
        return {
          x: (point.x - view.x) / view.zoom,
          y: (point.y - view.y) / view.zoom,
        };
      }

      function screenFromWorld(point) {
        const view = state.stageView || { zoom: 1, x: 0, y: 0 };
        return {
          x: point.x * view.zoom + view.x,
          y: point.y * view.zoom + view.y,
        };
      }

      function canvasPoint(event) {
        return worldFromScreen(stageScreenPoint(event));
      }

      function screenLengthToWorld(length) {
        return length / Math.max(0.01, state.stageView?.zoom || 1);
      }

      function formatWorldValue(value) {
        return `${round(Number(value) || 0, 1)} px`;
      }

      function formatWorldPoint(point) {
        if (!point) return "(-, -)";
        return `(${formatWorldValue(point.x)}, ${formatWorldValue(point.y)})`;
      }

      function formatStageViewOffset() {
        return `(${formatWorldValue(state.stageView?.x || 0)}, ${formatWorldValue(state.stageView?.y || 0)})`;
      }

      function updateStagePointerWorld(point) {
        state.stagePointerWorld = point ? { x: point.x, y: point.y } : null;
        renderStageWorldStatus();
        renderTimeStatus();
      }

      function clampStageZoom(zoom) {
        return Math.max(0.2, Math.min(8, zoom));
      }

      function zoomStageAtScreenPoint(screenPoint, nextZoom) {
        const before = worldFromScreen(screenPoint);
        const zoom = clampStageZoom(nextZoom);
        state.stageView.zoom = zoom;
        state.stageView.x = screenPoint.x - before.x * zoom;
        state.stageView.y = screenPoint.y - before.y * zoom;
      }

      function applyStageViewTransform() {
        const view = state.stageView || { zoom: 1, x: 0, y: 0 };
        ctx.translate(view.x, view.y);
        ctx.scale(view.zoom, view.zoom);
      }

      function renderStageWorldStatus() {
        if (!el.stageWorldStatus) return;
        const mouse = state.stagePointerWorld ? formatWorldPoint(state.stagePointerWorld) : "(out of stage)";
        el.stageWorldStatus.textContent = [
          `Origin: ${formatWorldPoint({ x: 0, y: 0 })}`,
          `Mouse: ${mouse}`,
          `View Zoom: ${round(state.stageView?.zoom || 1, 2)}x`,
          `View Offset: ${formatStageViewOffset()}`,
        ].join("\n");
      }

      function hitTest(point) {
        const jointRadius = screenLengthToWorld(12);
        const boneRadius = screenLengthToWorld(8);
        const bindingMode = isBindingMode();
        const bindingNodeMode = bindingMode && state.bindingDragMode === "node";
        const bindingPieceMode = bindingMode && state.bindingDragMode === "piece";
        const bindingBoneMode = bindingMode && state.bindingDragMode === "bone";
        const bindingStretchMode = bindingMode && state.bindingDragMode === "stretch";
        if (bindingStretchMode) return hitTestStretch(point);
        if (state.editMode === "stretch") return hitTestStretch(point);
        if (bindingPieceMode) {
          const selectedPieceHit = hitTestSelectedPiece(point);
          if (selectedPieceHit) return selectedPieceHit;
          return null;
        }
        const allowJointHits = !bindingMode || bindingNodeMode;
        const allowBoneHits = !bindingMode || bindingBoneMode;
        if (allowJointHits || allowBoneHits) {
          const nodes = sortedNodes().reverse();
          for (const node of nodes) {
            if (!isCanvasVisibleNode(node)) continue;
            const pose = worldPose(node);
            const end = endPoint(pose);
            const boneLength = distance({ x: pose.worldX, y: pose.worldY }, end);
            const effectiveJointRadius = bindingMode
              ? Math.min(jointRadius, Math.max(screenLengthToWorld(4), boneLength * 0.35))
              : jointRadius;
            if (allowJointHits && distance(point, end) <= effectiveJointRadius) {
              const childAtJoint = firstChildOf(node.id);
              if (childAtJoint) {
                return { type: "origin", node: childAtJoint, jointId: endJointId(node) };
              }
              return { type: "end", node, jointId: endJointId(node) };
            }
            if (allowJointHits && distance(point, { x: pose.worldX, y: pose.worldY }) <= effectiveJointRadius) {
              return { type: "origin", node, jointId: startJointId(node) };
            }
            if (allowBoneHits && pointSegmentDistance(point, { x: pose.worldX, y: pose.worldY }, end) <= boneRadius) {
              return { type: "bone", node };
            }
          }
        }
        if (bindingMode && !bindingBoneMode) return null;
        return null;
      }

      function hitTestSelectedPiece(point) {
        const handleRadius = screenLengthToWorld(12);
        const piece = selectedPieceNode();
        if (!piece || !isNodeVisibleAtFrame(piece)) return null;
        const handles = pieceHandlePoints(piece);
        if (distance(point, handles.rotate) <= handleRadius) return { type: "piece-rotate", node: piece };
        for (const corner of handles.corners) {
          if (distance(point, corner) <= handleRadius) return { type: "piece-scale", node: piece };
        }
        const corners = pieceCorners(piece);
        if (corners && pointInPolygon(point, corners)) {
          return proxyHitForArrowPieceBody(piece) || proxyHitForSlashFxPieceBody(piece) || { type: "piece", node: piece };
        }
        return null;
      }

      function hitTestPiece(point) {
        const pieces = pieceNodes()
          .filter((piece) => isNodeVisibleAtFrame(piece))
          .slice()
          .sort((a, b) => (b.attachment?.layer || 0) - (a.attachment?.layer || 0));
        for (const piece of pieces) {
          const corners = pieceCorners(piece);
          if (corners && pointInPolygon(point, corners)) {
            return proxyHitForArrowPieceBody(piece) || proxyHitForSlashFxPieceBody(piece) || { type: "piece", node: piece };
          }
        }
        return null;
      }

      function pointInPolygon(point, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i, i += 1) {
          const a = polygon[i];
          const b = polygon[j];
          const intersects =
            a.y > point.y !== b.y > point.y &&
            point.x < ((b.x - a.x) * (point.y - a.y)) / Math.max(0.0001, b.y - a.y) + a.x;
          if (intersects) inside = !inside;
        }
        return inside;
      }

      function hitTestStretch(point) {
        const active = selectedNode();
        if (active) {
          const activeHit = hitTestStretchNode(point, active);
          if (activeHit) return activeHit;
        }
        const nodes = sortedNodes().reverse();
        for (const node of nodes) {
          if (node.id === active?.id) continue;
          const hit = hitTestStretchNode(point, node);
          if (hit) return hit;
        }
        return null;
      }

      function hitTestStretchNode(point, node) {
        const handleRadius = screenLengthToWorld(14);
        if (!isCanvasVisibleNode(node)) return null;
        const pose = worldPose(node);
        const end = endPoint(pose);
        if (distance(point, end) <= handleRadius) {
          return { type: "stretch-end", node, jointId: endJointId(node) };
        }
        if (distance(point, { x: pose.worldX, y: pose.worldY }) <= handleRadius) {
          return { type: "stretch-origin", node, jointId: startJointId(node) };
        }
        return null;
      }

      function firstChildOf(parentId) {
        return (
          sortedNodes().find(
            (node) =>
              effectiveParentIdForNode(node) === parentId &&
              participatesInGenericJointSolver(node) &&
              isCanvasVisibleNode(node),
          ) || null
        );
      }

      function startJointId(node) {
        const effectiveParentId = effectiveParentIdForNode(node);
        return effectiveParentId ? endJointId({ id: effectiveParentId }) : `base:${node.id}`;
      }

      function endJointId(node) {
        return `end:${node.id}`;
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function pointSegmentDistance(point, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (lengthSquared === 0) return distance(point, a);
        const t = Math.max(
          0,
          Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared),
        );
        return distance(point, { x: a.x + dx * t, y: a.y + dy * t });
      }

      function localFromWorld(node, world) {
        const effectiveParentId = effectiveParentIdForNode(node);
        if (!effectiveParentId) return world;
        const parent = state.nodes.find((item) => item.id === effectiveParentId);
        if (!parent) return world;
        const p = worldPose(parent);
        const anchor = endPoint(p);
        const dx = world.x - anchor.x;
        const dy = world.y - anchor.y;
        const rad = (-p.worldRotation * Math.PI) / 180;
        return {
          x: (dx * Math.cos(rad) - dy * Math.sin(rad)) / p.worldScaleX,
          y: (dx * Math.sin(rad) + dy * Math.cos(rad)) / p.worldScaleY,
        };
      }

      function captureWorldPoses() {
        return Object.fromEntries(
          state.nodes.map((node) => {
            const pose = worldPose(node);
            const end = endPoint(pose);
            return [
              node.id,
              {
                origin: { x: pose.worldX, y: pose.worldY },
                end: { x: end.x, y: end.y },
              },
            ];
          }),
        );
      }

      function solveGenericJointDrag(jointId, targetWorld) {
        const positions = captureJointPositions();
        positions[jointId] = { x: targetWorld.x, y: targetWorld.y };
        const edges = state.nodes.filter((node) => participatesInGenericJointSolver(node)).map((node) => ({
          node,
          startId: startJointId(node),
          endId: endJointId(node),
          length: node.length,
        }));

        for (let pass = 0; pass < 18; pass += 1) {
          edges.forEach((edge) => {
            const start = positions[edge.startId];
            const end = positions[edge.endId];
            if (!start || !end) return;
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const currentLength = Math.hypot(dx, dy);
            if (currentLength <= 0.001) return;
            const diff = (currentLength - edge.length) / currentLength;
            const offset = { x: dx * diff, y: dy * diff };
            const startPinned = edge.startId === jointId;
            const endPinned = edge.endId === jointId;
            if (startPinned && !endPinned) {
              end.x -= offset.x;
              end.y -= offset.y;
            } else if (!startPinned && endPinned) {
              start.x += offset.x;
              start.y += offset.y;
            } else if (!startPinned && !endPinned) {
              start.x += offset.x * 0.5;
              start.y += offset.y * 0.5;
              end.x -= offset.x * 0.5;
              end.y -= offset.y * 0.5;
            }
          });
          positions[jointId] = { x: targetWorld.x, y: targetWorld.y };
        }

        applySolvedJointPositions(positions);
      }

      function captureJointPositions() {
        const positions = {};
        sortedNodes().forEach((node) => {
          if (!participatesInGenericJointSolver(node)) return;
          const pose = worldPose(node);
          positions[startJointId(node)] = { x: pose.worldX, y: pose.worldY };
          positions[endJointId(node)] = endPoint(pose);
        });
        return positions;
      }

      function applySolvedJointPositions(positions) {
        sortedNodeRefs().forEach((node) => {
          if (!participatesInGenericJointSolver(node)) return;
          const start = positions[startJointId(node)];
          const end = positions[endJointId(node)];
          if (!start || !end) return;
          if (!node.parentId) {
            node.x = start.x;
            node.y = start.y;
          } else if (isBindingMode()) {
            const local = localFromWorld(node, start);
            node.x = local.x;
            node.y = local.y;
          } else {
            node.x = 0;
            node.y = 0;
          }
          const parentRotation = node.parentId
            ? worldPose(state.nodes.find((item) => item.id === node.parentId)).worldRotation
            : 0;
          node.rotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI - parentRotation;
          poseOverrides.set(node.id, {
            x: node.x,
            y: node.y,
            rotation: node.rotation,
            length: node.length,
            scaleX: node.scaleX,
            scaleY: node.scaleY,
          });
          syncKeyAtCurrentFrame(node);
          drag?.touched?.add(node.id);
        });
      }

      function moveBoneRigid(node, deltaWorld, startWorldOrigin) {
        const targetOrigin = {
          x: startWorldOrigin.x + deltaWorld.x,
          y: startWorldOrigin.y + deltaWorld.y,
        };
        const local = localFromWorld(node, targetOrigin);
        node.x = local.x;
        node.y = local.y;
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
        syncKeyAtCurrentFrame(node);
        drag?.touched?.add(node.id);
      }

      function rotateBoneEndpointPreserveLength(node, startWorld, targetWorld) {
        if (!node || !startWorld || !targetWorld) return;
        const parent = node.parentId ? state.nodes.find((item) => item.id === node.parentId) : null;
        const parentPose = parent ? worldPose(parent) : null;
        const parentRotation = parentPose?.worldRotation || 0;
        const dx = targetWorld.x - startWorld.x;
        const dy = targetWorld.y - startWorld.y;
        if (Math.hypot(dx, dy) <= 0.001) return;
        node.rotation = (Math.atan2(dy, dx) * 180) / Math.PI - parentRotation;
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
        syncKeyAtCurrentFrame(node);
        drag?.touched?.add(node.id);
      }

      function handleBindingJointDrag(node, dragType, point) {
        if (!isBindingMode() || !node || node.parentId) return false;
        if (dragType === "origin") {
          moveBoneRigid(
            node,
            { x: point.x - drag.start.x, y: point.y - drag.start.y },
            drag.startWorldOrigin,
          );
          return true;
        }
        if (dragType === "end") {
          rotateBoneEndpointPreserveLength(node, drag.startWorldOrigin, point);
          return true;
        }
        return false;
      }

      function detachBoneFromParentPreserveWorld(node) {
        if (!node?.parentId) return;
        const pose = worldPose(node);
        node.parentId = null;
        node.x = pose.worldX;
        node.y = pose.worldY;
        node.rotation = pose.worldRotation;
        node.scaleX = pose.worldScaleX;
        node.scaleY = pose.worldScaleY;
        node.bindPose = normalizeBindPose(node);
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
      }

      function movePieceByDrag(piece, delta) {
        if (!piece?.attachment || !drag?.startPieceTransform) return;
        setPieceTransformPatch(
          {
            x: drag.startPieceTransform.x + delta.x,
            y: drag.startPieceTransform.y + delta.y,
          },
          false,
        );
      }

      function scalePieceByDrag(piece, point) {
        if (!piece?.attachment || !drag?.startPieceTransform || !drag.startPieceCenter) return;
        const nextDistance = Math.max(1, distance(point, drag.startPieceCenter));
        const nextScale = Math.max(0.01, drag.startPieceTransform.scale * (nextDistance / drag.startPieceDistance));
        setPieceTransformPatch({ scale: nextScale }, false);
      }

      function rotatePieceByDrag(piece, point) {
        if (!piece?.attachment || !drag?.startPieceTransform || !drag.startPieceCenter) return;
        const nextAngle = (Math.atan2(point.y - drag.startPieceCenter.y, point.x - drag.startPieceCenter.x) * 180) / Math.PI;
        setPieceTransformPatch(
          { rotation: drag.startPieceTransform.rotation + nextAngle - drag.startPieceAngle },
          false,
        );
      }

      function stretchBoneEndpoint(node, movingType, targetWorld) {
        const start = movingType === "stretch-origin" ? targetWorld : drag.startWorldOrigin;
        const end = movingType === "stretch-end" ? targetWorld : drag.startWorldEnd;
        const parent = node.parentId ? state.nodes.find((item) => item.id === node.parentId) : null;
        const parentPose = parent ? worldPose(parent) : null;
        const parentRotation = parentPose?.worldRotation || 0;
        const parentScaleX = Math.abs(parentPose?.worldScaleX || 1);
        const nodeScaleX = Math.abs(node.scaleX || 1);
        const localStart = localFromWorld(node, start);
        const worldLength = distance(start, end);
        node.x = localStart.x;
        node.y = localStart.y;
        node.rotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI - parentRotation;
        node.length = Math.max(4, worldLength / Math.max(0.001, parentScaleX * nodeScaleX));
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
        syncKeyAtCurrentFrame(node);
        drag?.touched?.add(node.id);
      }

      function sanitizeProjectFileSegment(value, fallback = "spine-project") {
        const clean = String(value || "")
          .trim()
          .replace(/[\\/:*?"<>|]+/g, "-")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^\.+|\.+$/g, "");
        return clean || fallback;

      function defaultProjectSavePath() {
        const action = selectedAction();

        const config = getSpineUnitConfig(state.currentUnitType);
        return config.projectUrl || `src/faxian/leg/${baseName}.json`;

      function defaultProjectSaveFilename(suggestedPath = defaultProjectSavePath()) {
        const normalized = String(suggestedPath || defaultProjectSavePath()).replaceAll("\\", "/");
        const filename = normalized.split("/").pop() || "spine-project.json";
        return filename.endsWith(".json") ? filename : `${filename}.json`;
      }

      function promptProjectSavePath(suggestedPath = defaultProjectSavePath()) {
        const input = window.prompt("Save as path (.json, inside workspace)", suggestedPath);
        if (input === null) return null;
        const trimmed = String(input).trim().replaceAll("\\", "/");
        if (!trimmed) {
          toast("Save cancelled");
          return null;
        }
        return trimmed.endsWith(".json") ? trimmed : `${trimmed}.json`;
      }

      async function pickProjectSaveTarget(options = {}) {
        const suggestedPath = options.suggestedPath || defaultProjectSavePath();
        if (typeof window.showSaveFilePicker === "function") {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: defaultProjectSaveFilename(suggestedPath),
              types: [
                {
                  description: "JSON Files",
                  accept: {
                    "application/json": [".json"],
                  },
                },
              ],
            });
            return { kind: "file-handle", handle };
          } catch (error) {
            if (error?.name === "AbortError") {
              toast("Save cancelled");
              return null;
            }
            throw error;
          }
        }
        const targetPath = promptProjectSavePath(suggestedPath);
        if (!targetPath) return null;
        return { kind: "workspace-path", path: targetPath };
      }

      async function saveProjectJsonFile(options = {}) {
        try {
          const data = projectData();
          const target = await pickProjectSaveTarget(options);
          if (!target) return;
          if (target.kind === "file-handle") {
            const writable = await target.handle.createWritable();
            await writable.write(`${JSON.stringify(data, null, 2)}\n`);
            await writable.close();
            renderJsonPreview();
            toast(`Saved to ${target.handle.name || "JSON file"}`);
            return;
          }
          const response = await fetch("/api/spine-editor/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              path: target.path,
              data,
            }),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "Save failed");
          renderJsonPreview();
          toast(`Saved to ${result.path || "JSON file"}`);
        } catch (error) {
          toast(error.message || "Saving JSON failed");
        }
      }
