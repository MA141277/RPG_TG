      function applyIdleAnimation() {
        state.duration = 47;
        state.currentFrame = 0;
        state.selectedKey = null;
        state.nodes.forEach((node) => {
          state.timelines[node.id] = buildIdleTimelineForNode(node, state.duration);
        });
        const action = selectedAction();
        if (action) {
          action.name = el.actionNameInput.value.trim() || action.name || "idle";
          action.duration = state.duration;
          action.timelines = cloneTimelines(state.timelines);
        }
        renderAll();
        toast("Generated a 48-frame idle loop.");
      }

      function buildIdleTimelineForNode(node, duration = 47) {
        const loopLength = duration + 1;
        const frames = [0, 0.25, 0.5, 0.75].map((ratio) =>
          Math.max(0, Math.min(duration, Math.round(loopLength * ratio))),
        );
        const base = {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        };
        return frames.map((frame, index) => idlePoseAtFrame(node, base, frame, index));
      }

      function idlePoseAtFrame(node, base, frame, index) {
        const breath = [0, 1, 0, -0.65][index] || 0;
        const sway = [0, 0.55, 0, -0.55][index] || 0;
        const role = idleRole(node);
        const pose = { frame, ...base };
        if (!node.parentId) {
          pose.y = base.y - breath * 2.5;
          pose.rotation = base.rotation + sway * 0.35;
        }
        if (role === "head") {
          pose.y = base.y - breath * 0.8;
          pose.rotation = base.rotation - sway * 0.9;
        } else if (role === "torso") {
          pose.rotation = base.rotation + sway * 1.2;
          pose.length = Math.max(4, base.length * (1 - breath * 0.012));
        } else if (role === "rightArm") {
          pose.rotation = base.rotation - breath * 1.8 + sway * 0.7;
          pose.length = Math.max(4, base.length * (1 + breath * 0.004));
        } else if (role === "leftArm") {
          pose.rotation = base.rotation + breath * 1.5 - sway * 0.6;
          pose.length = Math.max(4, base.length * (1 + breath * 0.004));
        } else if (role === "rightLeg") {
          pose.rotation = base.rotation + sway * 0.45;
        } else if (role === "leftLeg") {
          pose.rotation = base.rotation - sway * 0.45;
        }
        return {
          frame: pose.frame,
          x: round(pose.x, 2),
          y: round(pose.y, 2),
          rotation: round(pose.rotation, 2),
          length: round(pose.length, 2),
          scaleX: round(pose.scaleX, 3),
          scaleY: round(pose.scaleY, 3),
        };
      }

      function idleRole(node) {
        if (node.role) return node.role;
        const name = String(node.name || "").toLowerCase();
        if (name.includes("head") || name.includes("\u5934")) return "head";
        if (name.includes("torso") || name.includes("\u8eaf\u5e72") || name.includes("\u810a\u690e")) return "torso";
        if (name.includes("rightarm") || name.includes("\u53f3\u81c2")) return "rightArm";
        if (name.includes("leftarm") || name.includes("\u5de6\u81c2")) return "leftArm";
        if (name.includes("rightleg") || name.includes("\u53f3\u817f")) return "rightLeg";
        if (name.includes("leftleg") || name.includes("\u5de6\u817f")) return "leftLeg";
        return "";
      }

      function buildJumpTimelines(nodes, duration = 47) {
        return Object.fromEntries(nodes.map((node) => [node.id, buildJumpTimelineForNode(node, duration)]));
      }

      function buildJumpTimelineForNode(node, duration = 47) {
        const frames = [0, 8, 14, 24, 34, 42].map((frame) => Math.min(duration, frame));
        const base = {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        };
        return frames.map((frame, index) => jumpPoseAtFrame(node, base, frame, index));
      }

      function jumpPoseAtFrame(node, base, frame, index) {
        const phase = ["ready", "crouch", "takeoff", "apex", "fall", "land"][index] || "ready";
        const role = jumpRole(node);
        const partIndex = nodePartIndex(node);
        const pose = { frame, ...base };

        if (!node.parentId) {
          const rootY = {
            ready: 0,
            crouch: 18,
            takeoff: -38,
            apex: -96,
            fall: -52,
            land: 10,
          };
          const rootTilt = {
            ready: 0,
            crouch: -1.5,
            takeoff: 3,
            apex: 0,
            fall: -2,
            land: -1,
          };
          pose.y = base.y + rootY[phase];
          pose.rotation = base.rotation + rootTilt[phase];
        }

        if (role === "head") {
          pose.rotation += { ready: 0, crouch: 4, takeoff: -5, apex: -2, fall: 3, land: 5 }[phase];
          pose.y += { ready: 0, crouch: 1, takeoff: -1, apex: -2, fall: 1, land: 2 }[phase];
        } else if (role === "torso") {
          const torsoDepth = partIndex >= 3 ? 1.4 : 1;
          pose.rotation =
            base.rotation + ({ ready: 0, crouch: 8, takeoff: -10, apex: -4, fall: 5, land: 10 }[phase] * torsoDepth);
          pose.length = Math.max(
            4,
            base.length * (1 + { ready: 0, crouch: -0.04, takeoff: 0.025, apex: 0.01, fall: -0.01, land: -0.05 }[phase]),
          );
        } else if (role === "rightArm") {
          const lower = partIndex >= 2 ? 1.35 : 1;
          pose.rotation = base.rotation + ({ ready: 0, crouch: 20, takeoff: -28, apex: -18, fall: 14, land: 24 }[phase] * lower);
          pose.length = Math.max(4, base.length * (1 + { ready: 0, crouch: -0.015, takeoff: 0.02, apex: 0, fall: 0, land: -0.01 }[phase]));
        } else if (role === "leftArm") {
          const lower = partIndex >= 2 ? 1.35 : 1;
          pose.rotation = base.rotation + ({ ready: 0, crouch: -18, takeoff: 32, apex: 24, fall: -10, land: -20 }[phase] * lower);
          pose.length = Math.max(4, base.length * (1 + { ready: 0, crouch: -0.015, takeoff: 0.02, apex: 0, fall: 0, land: -0.01 }[phase]));
        } else if (role === "rightLeg") {
          const lower = partIndex >= 2 ? 1.25 : 1;
          pose.rotation = base.rotation + ({ ready: 0, crouch: -24, takeoff: 18, apex: 34, fall: 8, land: -30 }[phase] * lower);
          pose.length = Math.max(4, base.length * (1 + { ready: 0, crouch: -0.055, takeoff: 0.035, apex: 0.005, fall: -0.015, land: -0.06 }[phase]));
        } else if (role === "leftLeg") {
          const lower = partIndex >= 2 ? 1.25 : 1;
          pose.rotation = base.rotation + ({ ready: 0, crouch: 22, takeoff: -16, apex: -28, fall: -6, land: 28 }[phase] * lower);
          pose.length = Math.max(4, base.length * (1 + { ready: 0, crouch: -0.055, takeoff: 0.035, apex: 0.005, fall: -0.015, land: -0.06 }[phase]));
        }

        return {
          frame: pose.frame,
          x: round(pose.x, 2),
          y: round(pose.y, 2),
          rotation: round(pose.rotation, 2),
          length: round(pose.length, 2),
          scaleX: round(pose.scaleX, 3),
          scaleY: round(pose.scaleY, 3),
        };
      }

      function jumpRole(node) {
        const name = String(node.name || "");
        if (node.role === "torso" && /\u8eaf\u5e72\s*[56]/.test(name)) return "leftArm";
        return idleRole(node);
      }

      function nodePartIndex(node) {
        const match = String(node.name || "").match(/(\d+)\s*$/);
        return match ? Number(match[1]) : 1;
      }

      async function loadProjectJsonFile(url) {

          if (!response.ok) return null;

        } catch (error) {

      async function loadNewVersionSample() {

      function buildNewVersionProject(layout) {
        const scale = 0.26;
        const offset = { x: 170, y: 0 };
        const colors = {
          head: "#77c66e",
          torso: "#e6a23c",
          leftArm: "#4d8ecf",
          rightArm: "#d96a7b",
          leftLeg: "#9a7af0",
          rightLeg: "#70c99b",
          sword: "#d8d2bd",
        };
        const imageKeys = {
          head: "newHead",
          torso: "newTorso",
          leftArm: "newLeftArm",
          rightArm: "newRightArm",
          leftLeg: "newLeftLeg",
          rightLeg: "newRightLeg",
          sword: "newSword",
        };
        const toStage = (point) => ({
          x: point.x * scale + offset.x,
          y: point.y * scale + offset.y,
        });
        const samePoint = (a, b) => distance(a, b) <= 1.5;
        const nodeByBoneId = new Map();
        const nodes = layout.bones.map((bone) => {
          const start = toStage(bone.pixelStart);
          const end = toStage(bone.pixelEnd);
          const parentBone = layout.bones.find(
            (candidate) => candidate.id !== bone.id && samePoint(candidate.pixelEnd, bone.pixelStart),
          );
          const parentNode = parentBone ? nodeByBoneId.get(parentBone.id) : null;
          const worldRotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI;
          const parentRotation = parentNode ? parentNode.worldRotation : 0;
          const parentEnd = parentNode
            ? {
                x: parentNode.worldStart.x + Math.cos((parentNode.worldRotation * Math.PI) / 180) * parentNode.length,
                y: parentNode.worldStart.y + Math.sin((parentNode.worldRotation * Math.PI) / 180) * parentNode.length,
              }
            : null;
          const localOffset = parentNode ? rotateVector(start.x - parentEnd.x, start.y - parentEnd.y, -parentRotation) : start;
          const node = {
            id: bone.id,
            name: bone.name,
            parentId: parentNode?.id || null,
            x: parentNode ? round(localOffset.x, 2) : round(start.x, 2),
            y: parentNode ? round(localOffset.y, 2) : round(start.y, 2),
            rotation: round(worldRotation - parentRotation, 2),
            length: round(distance(start, end), 2),
            scaleX: 1,
            scaleY: 1,
            color: colors[bone.partId] || "#35b6b4",
            role: bone.partId,
            worldStart: start,
            worldRotation,
          };
          nodeByBoneId.set(bone.id, node);
          return node;
        });
        addVirtualSwordNodeFromPart(layout, nodes, toStage, colors);

        const idleTimelines = {};
        nodes.forEach((node) => {
          const { worldStart, worldRotation, ...cleanNode } = node;
          Object.assign(node, cleanNode);
          node.bindPose = normalizeBindPose(node);
          idleTimelines[node.id] = buildIdleTimelineForNode(node, 47);
          delete node.worldStart;
          delete node.worldRotation;
        });
        const jumpTimelines = buildJumpTimelines(nodes, 47);

        const partBoneIds = resolveNewVersionPartBoneIds(layout.bones);
        for (const part of layout.parts) {
          const partBones = (partBoneIds[part.id] || []).map((id) => layout.bones.find((bone) => bone.id === id)).filter(Boolean);
          const skinBoneIds =
            partBones.length > 0
              ? partBones.map((bone) => bone.id)
              : fallbackSkinBoneIds(part.id, layout.bones);
          const owner = nodes.find((node) => node.id === skinBoneIds[0]);
          if (!owner) continue;
          owner.attachment = {
            image: imageKeys[part.id],
            chainTo: null,
            width: 48,
            alpha: 1,
            layer: part.layer,
            anchorX: part.anchorX,
            lengthScale: 1,
            reverse: false,
            segments: false,
            fullSkin: true,
            skinBoneIds,
            rotationOffset: 0,
            offsetX: 0,
            offsetY: 0,
            restPart: {
              partId: part.id,
              x: round(part.x * scale + offset.x, 2),
              y: round(part.y * scale + offset.y, 2),
              scale: round(part.scale * scale, 4),
              rotation: part.rotation,
              anchorX: part.anchorX,
              anchorY: part.anchorY,
            },
          };
        }

        return {
          format: "spine-node-timeline-editor",
          version: 1,
          name: "new_version",

          timelines: jumpTimelines,

      function fallbackSkinBoneIds(partId, bones) {
        return [];
      }

      function resolveNewVersionPartBoneIds(bones) {
        const byPart = (partId) => bones.filter((bone) => bone.partId === partId).map((bone) => bone.id);
        const torsoBones = bones.filter((bone) => bone.partId === "torso");
        return {
          head: byPart("head"),
          torso: torsoBones.slice(0, 4).map((bone) => bone.id),
          rightArm: byPart("rightArm"),
          leftArm: torsoBones.slice(4, 6).map((bone) => bone.id),
          leftLeg: byPart("leftLeg"),
          rightLeg: byPart("rightLeg"),
          sword: byPart("sword"),
        };
      }

      function addVirtualSwordNodeFromPart(layout, nodes, toStage, colors) {
        if (layout.bones.some((bone) => bone.partId === "sword")) return;
        const swordPart = layout.parts.find((part) => part.id === "sword");
        if (!swordPart) return;
        const usedIds = new Set(nodes.map((node) => node.id));
        let id = "sword-bone";
        let suffix = 2;
        while (usedIds.has(id)) {
          id = `sword-bone-${suffix}`;
          suffix += 1;
        }
        const start = toStage({ x: swordPart.x, y: swordPart.y });
        const spec = materialReplacementSpecsForUnit().find((item) => item.id === "sword");
        const length = Math.max(24, (spec?.targetHeight || 240) * (Number(swordPart.scale) || 1) * 0.26);
        const worldRotation = (Number(swordPart.rotation) || 0) + 90;
        const rightArmNodes = nodes.filter((node) => node.role === "rightArm");
        const parentNode = rightArmNodes[rightArmNodes.length - 1] || null;
        const parentRotation = parentNode ? parentNode.worldRotation : 0;
        const parentEnd = parentNode
          ? {
              x: parentNode.worldStart.x + Math.cos((parentNode.worldRotation * Math.PI) / 180) * parentNode.length,
              y: parentNode.worldStart.y + Math.sin((parentNode.worldRotation * Math.PI) / 180) * parentNode.length,
            }
          : null;
        const localOffset = parentNode ? rotateVector(start.x - parentEnd.x, start.y - parentEnd.y, -parentRotation) : start;
        nodes.push({
          id,
          name: "sword 1",
          parentId: parentNode?.id || null,
          x: parentNode ? round(localOffset.x, 2) : round(start.x, 2),
          y: parentNode ? round(localOffset.y, 2) : round(start.y, 2),
          rotation: round(worldRotation - parentRotation, 2),
          length: round(length, 2),
          scaleX: 1,
          scaleY: 1,
          color: colors.sword || "#d8d2bd",
          role: "sword",
          worldStart: start,
          worldRotation,
        });
        layout.bones.push({
          id,
          name: "sword 1",
          partId: "sword",
          pixelStart: { x: swordPart.x, y: swordPart.y },
          pixelEnd: {
            x: swordPart.x + Math.cos((worldRotation * Math.PI) / 180) * length / 0.26,
            y: swordPart.y + Math.sin((worldRotation * Math.PI) / 180) * length / 0.26,
          },
        });
      }

      function rotateVector(x, y, degrees) {
        const angle = (degrees * Math.PI) / 180;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: x * cos - y * sin,
          y: x * sin + y * cos,
        };
      }

      function setWorkspaceMode(mode) {
        state.workspaceMode = mode === "binding" ? "binding" : "animation";
        state.playing = false;
        state.selectedKey = null;
        poseOverrides.clear();
        if (isBindingMode()) {
          state.nodes.forEach((node) => {
            node.bindPose = normalizeBindPose(node.bindPose || node);
            Object.assign(node, node.bindPose);
          });
          if (!selectedPieceNode()) state.selectedPieceNodeId = pieceNodes()[0]?.id || null;
        }
        renderAll();
        toast(isBindingMode() ? "Entered binding mode: drag and property edits write into bindPose." : "Returned to animation timeline.");

      function selectedWeaponNode() {
        const selected = selectedNode();
        if (isWeaponNode(selected)) return selected;
        return state.nodes.find((node) => isWeaponNode(node)) || null;

        if (!node) return false;
        return (
          node.role === "sword" ||

          node.attachment?.image === "newSword" ||
          /sword|weapon|\u5200|\u5251|\u6b66\u5668/i.test(`${node.id} ${node.name}`)

      function handleBindingBoneToolClick(point) {
        if (!isBindingMode() || !state.bindingBoneTool) return false;
        const piece = selectedPieceNode();
        if (!piece) {
          toast("Select a piece in the piece list first.");
          return true;
        }
        if (state.bindingBoneTool === "from-node") {
          const parent = selectedNode();
          if (!parent) {
            toast("Select a bone node as the start point first.");
            return true;
          }
          createBoneFromParent(parent, point);
          state.bindingBoneTool = null;
          renderAll();
          return true;
        }
        if (!state.pendingFreeBoneStart) {
          state.pendingFreeBoneStart = point;
          toast("Free-bone start point locked. Click an end point next.");
          renderStatus();
          drawStage();
          return true;
        }
        createFreeBone(state.pendingFreeBoneStart, point);
        state.pendingFreeBoneStart = null;
        state.bindingBoneTool = null;
        renderAll();
        return true;

      function createBoneFromParent(parent, endWorld) {

          id,
          name: `bone_${state.nodes.length}`,
          parentId: parent.id,
          x: 0,
          y: 0,
          rotation: (Math.atan2(endWorld.y - start.y, endWorld.x - start.x) * 180) / Math.PI - parentPose.worldRotation,
          length,
          scaleX: 1,

      function imagePixelToRestWorld(restPart, imageSize, pixelX, pixelY) {
        const anchorX = restPart.anchorX ?? 0.5;
        const anchorY = restPart.anchorY ?? 0.5;
        const localX = (pixelX - imageSize.width * anchorX) * (restPart.scale || 1);
        const localY = (pixelY - imageSize.height * anchorY) * (restPart.scale || 1);
        const angle = ((restPart.rotation || 0) * Math.PI) / 180;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: (restPart.x || 0) + localX * cos - localY * sin,
          y: (restPart.y || 0) + localX * sin + localY * cos,
        };
      }

      function localFromWorldByParentPose(parentPose, world) {
        const anchor = endPoint(parentPose);
        const dx = world.x - anchor.x;
        const dy = world.y - anchor.y;
        const rad = (-parentPose.worldRotation * Math.PI) / 180;
        return {
          x: (dx * Math.cos(rad) - dy * Math.sin(rad)) / (parentPose.worldScaleX || 1),
          y: (dx * Math.sin(rad) + dy * Math.cos(rad)) / (parentPose.worldScaleY || 1),
        };
      }

      function worldFromLocalByParentPose(parentPose, local) {
        const anchor = endPoint(parentPose);
        const rad = (parentPose.worldRotation * Math.PI) / 180;
        const px = (local.x || 0) * (parentPose.worldScaleX || 1);
        const py = (local.y || 0) * (parentPose.worldScaleY || 1);
        return {
          x: anchor.x + px * Math.cos(rad) - py * Math.sin(rad),
          y: anchor.y + px * Math.sin(rad) + py * Math.cos(rad),
        };
      }

      function worldPoseFromParentContext(localPose, parentId, frame) {
        const anchoredLocal = parentId ? { ...localPose, x: 0, y: 0 } : localPose;
        if (!parentId) {
          return {
            ...anchoredLocal,
            worldX: anchoredLocal.x,
            worldY: anchoredLocal.y,
            worldRotation: anchoredLocal.rotation,
            worldScaleX: anchoredLocal.scaleX,
            worldScaleY: anchoredLocal.scaleY,
          };
        }
        const parent = state.nodes.find((node) => node.id === parentId);
        if (!parent) {
          return {
            ...anchoredLocal,
            worldX: anchoredLocal.x,
            worldY: anchoredLocal.y,
            worldRotation: anchoredLocal.rotation,
            worldScaleX: anchoredLocal.scaleX,
            worldScaleY: anchoredLocal.scaleY,
          };
        }
        const parentPose = worldPose(parent, frame);
        const worldPoint = worldFromLocalByParentPose(parentPose, anchoredLocal);
        return {
          ...anchoredLocal,
          worldX: worldPoint.x,
          worldY: worldPoint.y,
          worldRotation: parentPose.worldRotation + anchoredLocal.rotation,
          worldScaleX: parentPose.worldScaleX * anchoredLocal.scaleX,
          worldScaleY: parentPose.worldScaleY * anchoredLocal.scaleY,
        };
      }

      function localPoseForParentContext(worldPoseLike, parentId, frame) {
        if (!parentId) {
          return {
            x: worldPoseLike.worldX,
            y: worldPoseLike.worldY,
            rotation: worldPoseLike.worldRotation,
            length: worldPoseLike.length,
            scaleX: worldPoseLike.worldScaleX,
            scaleY: worldPoseLike.worldScaleY,
          };
        }
        const parent = state.nodes.find((node) => node.id === parentId);
        if (!parent) {
          return {
            x: worldPoseLike.worldX,
            y: worldPoseLike.worldY,
            rotation: worldPoseLike.worldRotation,
            length: worldPoseLike.length,
            scaleX: worldPoseLike.worldScaleX,
            scaleY: worldPoseLike.worldScaleY,
          };
        }
        const parentPose = worldPose(parent, frame);
        const localPoint = localFromWorldByParentPose(parentPose, {
          x: worldPoseLike.worldX,
          y: worldPoseLike.worldY,
        });
        return {
          x: 0,
          y: 0,
          rotation: worldPoseLike.worldRotation - parentPose.worldRotation,
          length: worldPoseLike.length,
          scaleX: worldPoseLike.worldScaleX / (parentPose.worldScaleX || 1),
          scaleY: worldPoseLike.worldScaleY / (parentPose.worldScaleY || 1),
        };
      }

      function convertNodeKeysToParentContext(node, fromParentId, toParentId, frameStart, frameEndExclusive = Infinity) {
        const keys = state.timelines[node.id] || [];
        if (!keys.some((item) => item.frame === frameStart)) {
          upsertKeyframe(node, copyPoseAtFrame(getLocalPose(node, frameStart), frameStart));
        }
        (state.timelines[node.id] || []).forEach((keyframe) => {
          if (keyframe.frame < frameStart || keyframe.frame >= frameEndExclusive) return;
          const worldPoseLike = worldPoseFromParentContext(keyframe, fromParentId, keyframe.frame);
          const localPose = localPoseForParentContext(worldPoseLike, toParentId, keyframe.frame);
          Object.assign(keyframe, localPose);
        });
      }


      function poseFromNodeAndParent(node, parentPose = null) {
        if (!parentPose) {
          return {
            ...node,
            worldX: node.x,
            worldY: node.y,
            worldRotation: node.rotation,
            worldScaleX: node.scaleX ?? 1,
            worldScaleY: node.scaleY ?? 1,
          };
        }
        const anchor = endPoint(parentPose);
        const rad = (parentPose.worldRotation * Math.PI) / 180;
        const px = (node.x || 0) * (parentPose.worldScaleX || 1);
        const py = (node.y || 0) * (parentPose.worldScaleY || 1);
        return {
          ...node,
          worldX: anchor.x + px * Math.cos(rad) - py * Math.sin(rad),
          worldY: anchor.y + px * Math.sin(rad) + py * Math.cos(rad),
          worldRotation: parentPose.worldRotation + (node.rotation || 0),
          worldScaleX: (parentPose.worldScaleX || 1) * (node.scaleX || 1),
          worldScaleY: (parentPose.worldScaleY || 1) * (node.scaleY || 1),
        };
      }

      function cloneRestPartForPiece(piece) {
        const source = piece?.attachment?.restPart || {
          partId: piece?.id || uid("part"),
          x: piece?.bindPose?.x || 420,
          y: piece?.bindPose?.y || 330,
          scale: 1,
          rotation: 0,
          anchorX: 0.5,
          anchorY: 0.5,
        };
        return {
          partId: source.partId,
          x: source.x || 0,
          y: source.y || 0,
          scale: Math.max(0.001, Number(source.scale) || 1),
          rotation: Number(source.rotation) || 0,
          anchorX: Number.isFinite(Number(source.anchorX)) ? Number(source.anchorX) : 0.5,
          anchorY: Number.isFinite(Number(source.anchorY)) ? Number(source.anchorY) : 0.5,
        };
      }

      function createBindingBone(name, startWorld, endWorld, color, role = "bow", parentNode = null, parentPose = null) {
        const id = uniqueNodeId(name);
        const resolvedParentPose = parentNode ? parentPose || worldPose(parentNode) : null;
        const localStart = resolvedParentPose
          ? localFromWorldByParentPose(resolvedParentPose, startWorld)
          : { x: startWorld.x, y: startWorld.y };
        const parentRotation = resolvedParentPose?.worldRotation || 0;
        const parentScaleX = Math.abs(resolvedParentPose?.worldScaleX || 1);
        const worldRotation = (Math.atan2(endWorld.y - startWorld.y, endWorld.x - startWorld.x) * 180) / Math.PI;
        const length = Math.max(4, distance(startWorld, endWorld) / Math.max(0.001, parentScaleX));
        return {
          id,
          name,
          parentId: parentNode?.id || null,
          x: localStart.x,
          y: localStart.y,
          rotation: worldRotation - parentRotation,
          length,
          scaleX: 1,
          scaleY: 1,
          color,
          role,
          bindPose: {
            x: localStart.x,
            y: localStart.y,
            rotation: worldRotation - parentRotation,
            length,
            scaleX: 1,
            scaleY: 1,
          },
        };
      }

      function createGeneratedPieceNode(name, image, restPart, layer, skinBoneIds) {
        const source = warriorImages[image];
        const width = Math.max(1, source?.naturalWidth || source?.width || 80);
        const id = uid("piece");
        return {
          id,
          name,
          parentId: null,
          x: restPart.x || 420,
          y: restPart.y || 330,
          rotation: 0,
          length: 4,
          scaleX: 1,
          scaleY: 1,
          color: "#8bd17c",
          role: "piece",
          bindPose: { x: restPart.x || 420, y: restPart.y || 330, rotation: 0, length: 4, scaleX: 1, scaleY: 1 },
          attachment: normalizeAttachment({
            image,
            width,
            alpha: 1,
            layer,
            fullSkin: true,
            skinBoneIds,
            restPart: {
              ...restPart,
              partId: id,
            },
          }),
        };
      }

      function endLocalFromPose(pose) {
        const startX = Number(pose?.x) || 0;
        const startY = Number(pose?.y) || 0;
        const rotation = ((Number(pose?.rotation) || 0) * Math.PI) / 180;
        const length = Math.max(4, Number(pose?.length) || 80);
        return {
          x: startX + Math.cos(rotation) * length,
          y: startY + Math.sin(rotation) * length,
        };
      }

      function applyNodePose(node, patch, persist = true) {
        if (!persist) {
          setNodePoseTransient(node, patch);
          return;
        }
        Object.assign(node, patch);
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
        if (persist) {
          syncKeyAtCurrentFrame(node);
          drag?.touched?.add(node.id);
        }
      }

      function applyBoneBetweenWorldPoints(node, startWorld, endWorld, persist = true) {
        const parent = node.parentId ? state.nodes.find((item) => item.id === node.parentId) : null;
        const parentPose = parent ? worldPose(parent) : null;
        const localStart = parentPose
          ? localFromWorldByParentPose(parentPose, startWorld)
          : { x: startWorld.x, y: startWorld.y };
        const parentRotation = parentPose?.worldRotation || 0;
        const parentScaleX = Math.abs(parentPose?.worldScaleX || 1);
        applyNodePose(node, {
          x: localStart.x,
          y: localStart.y,
          rotation: (Math.atan2(endWorld.y - startWorld.y, endWorld.x - startWorld.x) * 180) / Math.PI - parentRotation,
          length: Math.max(4, distance(startWorld, endWorld) / Math.max(0.001, parentScaleX)),
        }, persist);
      }

      function applyChildBoneEndpointFromBind(node, endLocalYDelta) {
        const bind = normalizeBindPose(node.bindPose || node);
        const start = { x: bind.x, y: bind.y };
        const end = endLocalFromPose(bind);
        const targetEnd = { x: end.x, y: end.y + endLocalYDelta };
        applyNodePose(node, {
          x: start.x,
          y: start.y,
          rotation: (Math.atan2(targetEnd.y - start.y, targetEnd.x - start.x) * 180) / Math.PI,
          length: Math.max(4, distance(start, targetEnd)),
        });
      }

      function bowRigNodes(node) {
        const rig = normalizeBowRig(node?.bowRig);
        if (!rig) return null;
        const center = state.nodes.find((item) => item.id === rig.centerId);
        const upper = state.nodes.find((item) => item.id === rig.upperId);
        const lower = state.nodes.find((item) => item.id === rig.lowerId);
        const stringUpper =
          state.nodes.find((item) => item.id === rig.stringUpperId) ||
          state.nodes.find((item) => item.id === rig.stringId);
        const stringLower =
          state.nodes.find((item) => item.id === rig.stringLowerId) ||
          state.nodes.find((item) => item.id === rig.stringId);
        if (!center || !upper || !lower || !stringUpper || !stringLower) return null;
        return {
          rig,
          center,
          upper,
          lower,
          stringUpper,
          stringLower,
          control: isBowStringControlNode(node) ? node : null,
        };
      }

      function bowRigNodesForNode(node) {
        if (!node) return null;
        if (isBowStringControlNode(node)) {
          const direct = bowRigNodes(node);
          return direct ? { ...direct, control: node } : null;
        }
        const control = state.nodes.find((candidate) => {
          if (!isBowStringControlNode(candidate)) return false;
          const rig = normalizeBowRig(candidate.bowRig);
          if (!rig) return false;
          return [
            candidate.id,
            rig.centerId,
            rig.upperId,
            rig.lowerId,
            rig.stringUpperId,
            rig.stringLowerId,
            rig.stringId,
          ].includes(node.id);
        });
        if (!control) return null;
        const resolved = bowRigNodes(control);
        return resolved ? { ...resolved, control } : null;
      }

      function isBowRigNode(node) {
        return Boolean(bowRigNodesForNode(node));
      }

      function worldBoneLength(pose) {
        return Math.max(4, distance({ x: pose.worldX, y: pose.worldY }, endPoint(pose)));
      }

      function projectPointToLength(origin, target, length, fallbackAngle = 0) {
        const dx = target.x - origin.x;
        const dy = target.y - origin.y;
        const current = Math.hypot(dx, dy);
        if (current <= 0.001) {
          return {
            x: origin.x + Math.cos(fallbackAngle) * length,
            y: origin.y + Math.sin(fallbackAngle) * length,
          };
        }
        const scale = length / current;
        return {
          x: origin.x + dx * scale,
          y: origin.y + dy * scale,
        };
      }

      function setNodePoseTransient(node, patch) {
        poseOverrides.set(node.id, {
          x: patch.x ?? node.x,
          y: patch.y ?? node.y,
          rotation: patch.rotation ?? node.rotation,
          length: patch.length ?? node.length,
          scaleX: patch.scaleX ?? node.scaleX,
          scaleY: patch.scaleY ?? node.scaleY,
        });
      }

      function bowCenterWorld(nodes) {
        return endPoint(worldPose(nodes.center));
      }

      function bowAxes(angle) {
        const rad = (angle * Math.PI) / 180;
        return {
          body: { x: Math.cos(rad), y: Math.sin(rad) },
          pull: { x: -Math.sin(rad), y: Math.cos(rad) },
        };
      }

      function bowLocalToWorld(centerWorld, angle, local) {
        const axes = bowAxes(angle);
        return {
          x: centerWorld.x + axes.pull.x * (local.x || 0) + axes.body.x * (local.y || 0),
          y: centerWorld.y + axes.pull.y * (local.x || 0) + axes.body.y * (local.y || 0),
        };
      }

      function bowWorldToLocal(centerWorld, angle, world) {
        const axes = bowAxes(angle);
        const offset = { x: world.x - centerWorld.x, y: world.y - centerWorld.y };
        return {
          x: dotVector(offset, axes.pull),
          y: dotVector(offset, axes.body),
        };
      }

      function ensureBowRigModel(controlNode) {
        const nodes = bowRigNodes(controlNode);
        if (!nodes) return null;
        const { center, upper, lower, control } = nodes;
        const controlLocal = BowRigController.enrichPose(
          control,
          isBindingMode() ? getRestLocalPose(control) : getLocalPose(control),
        );
        const rig =
          (controlLocal?.bowPoseSerialized
            ? BowRigController.rigFromPose(control, controlLocal)
            : normalizeBowRig({
                ...nodes.rig,
                groupRotation: null,
                angle: null,
                upperLength: null,
                lowerLength: null,
                controlBaseX: null,
                controlBaseY: null,
                pull: 0,
              })) || nodes.rig;
        if (!rig) return null;
        const centerWorld = endPoint(worldPose(center));
        const upperTip = endPoint(worldPose(upper));
        const lowerTip = endPoint(worldPose(lower));
        const controlPose = worldPose(control);
        const controlPoint = { x: controlPose.worldX, y: controlPose.worldY };
        if (!Number.isFinite(Number(rig.groupRotation))) {
          rig.groupRotation =
            (Math.atan2(upperTip.y - centerWorld.y, upperTip.x - centerWorld.x) * 180) / Math.PI;
        }
        rig.angle = rig.groupRotation;
        if (!Number.isFinite(Number(rig.upperLength)) || rig.upperLength <= 4) {
          rig.upperLength = Math.max(4, distance(centerWorld, upperTip));
        }
        if (!Number.isFinite(Number(rig.lowerLength)) || rig.lowerLength <= 4) {
          rig.lowerLength = Math.max(4, distance(centerWorld, lowerTip));
        }
        if (!Number.isFinite(Number(rig.controlBaseX)) || !Number.isFinite(Number(rig.controlBaseY))) {
          const local = bowWorldToLocal(centerWorld, rig.groupRotation, controlPoint);
          rig.controlBaseX = local.x;
          rig.controlBaseY = local.y;
        }
        if (!Number.isFinite(Number(rig.pull))) rig.pull = 0;
        controlNode.bowRig = normalizeBowRig(rig);
        return { ...nodes, rig: controlNode.bowRig, control };
      }

      function syncBowRigFromModel(controlNode) {
        const nodes = ensureBowRigModel(controlNode);
        if (!nodes) return false;
        const { rig, center, upper, lower, stringUpper, stringLower, control } = nodes;
        const centerWorld = bowCenterWorld(nodes);
        const bend = (rig.pull || 0) * rig.bodyInfluence;
        const upperTip = bowLocalToWorld(centerWorld, rig.groupRotation, { x: bend, y: rig.upperLength });
        const lowerTip = bowLocalToWorld(centerWorld, rig.groupRotation, { x: bend, y: -rig.lowerLength });
        const controlPoint = bowLocalToWorld(centerWorld, rig.groupRotation, {
          x: (rig.controlBaseX || 0) + (rig.pull || 0),
          y: rig.controlBaseY || 0,
        });
        applyBoneBetweenWorldPoints(upper, centerWorld, upperTip, false);
        applyBoneBetweenWorldPoints(lower, centerWorld, lowerTip, false);
        applyBoneBetweenWorldPoints(control, centerWorld, controlPoint, false);
        applyBoneBetweenWorldPoints(stringUpper, upperTip, controlPoint, false);
        applyBoneBetweenWorldPoints(stringLower, controlPoint, lowerTip, false);
        return true;
      }

      function syncAllBowRigs() {
        state.nodes.filter((node) => isBowStringControlNode(node)).forEach((node) => {
          syncBowRigFromModel(node);
        });
      }

      function moveBowRigRigid(nodes, deltaWorld) {
        if (!nodes?.center) return false;
        const centerOrigin = drag?.startPoses?.[nodes.center.id]?.origin || {
          x: worldPose(nodes.center).worldX,
          y: worldPose(nodes.center).worldY,
        };
        moveBoneRigid(nodes.center, deltaWorld, centerOrigin);
        if (!isBindingMode()) upsertKeyframe(nodes.center, snapshotNode(nodes.center));
        syncBowRigFromModel(nodes.control);
        BowRigController.persistKeyframe(nodes.control);
        return true;
      }

      function findBowRigPiece(nodes) {
        if (!nodes) return null;
        return pieceNodes().find((piece) => {
          const ids = new Set(piece.attachment?.skinBoneIds || []);
          return ids.has(nodes.upper.id) && ids.has(nodes.lower.id);
        }) || null;
      }

      function findLegacyWeaponNodeForBowPiece(piece) {
        if (!piece?.attachment) return null;
        const pieceWorldCenter = pieceCenter(piece);
        const candidates = state.nodes
          .filter((node) => isWeaponNode(node) && node.id !== piece.id)
          .map((node) => ({
            node,
            distance: distance(pieceWorldCenter, pieceCenter(node)),
          }))
          .sort((a, b) => a.distance - b.distance);
        return candidates[0]?.node || null;
      }

      function replaceLegacyWeaponNodeWithBowRig(legacyWeapon, centerBone, piece) {
        if (!legacyWeapon || !centerBone || !piece || legacyWeapon.id === piece.id) return;
        state.nodes
          .filter((node) => node.parentId === legacyWeapon.id)
          .forEach((node) => reparentNodePreserveWorld(node, centerBone.id));
        if ((state.timelines[legacyWeapon.id] || []).length) {
          state.timelines[centerBone.id] = cloneTimelineKeys(state.timelines[legacyWeapon.id]);
        }
        delete state.timelines[legacyWeapon.id];
        state.actions.forEach((action) => {
          if ((action.timelines?.[legacyWeapon.id] || []).length) {
            action.timelines[centerBone.id] = cloneTimelineKeys(action.timelines[legacyWeapon.id]);
          }
          if (action.timelines) delete action.timelines[legacyWeapon.id];
        });
        state.nodes.forEach((node) => {
          if (node.attachment?.skinBoneIds?.includes(legacyWeapon.id)) {
            node.attachment.skinBoneIds = node.attachment.skinBoneIds
              .map((id) => (id === legacyWeapon.id ? centerBone.id : id))
              .filter((id, index, list) => list.indexOf(id) === index);
          }
          if (node.attachment?.chainTo === legacyWeapon.id) {
            node.attachment.chainTo = centerBone.id;
          }
        });
        state.nodes = state.nodes.filter((node) => node.id !== legacyWeapon.id);
      }

      function ensureBowRigPieceRestPart(nodes) {
        const piece = findBowRigPiece(nodes);
        if (!piece?.attachment?.restPart || !nodes?.center) return;
        const resolved = resolveRestPartTransform(piece.attachment.restPart, false) || piece.attachment.restPart;
        const centerRest = restWorldPose(nodes.center);
        const local = localFromWorldByParentPose(centerRest, { x: resolved.x, y: resolved.y });
        piece.attachment.restPart = {
          ...piece.attachment.restPart,
          parentBoneId: nodes.center.id,
          x: local.x,
          y: local.y,
          rotation: (resolved.rotation || 0) - centerRest.worldRotation,
        };
      }

      function syncBowRigStringsFromControl(nodes) {
        return nodes?.control ? syncBowRigFromModel(nodes.control) : false;
      }

      function moveBowRigBodyTip(nodes, which, targetWorld) {
        if (!nodes?.control) return false;
        const model = ensureBowRigModel(nodes.control);
        if (!model) return false;
        const centerWorld = bowCenterWorld(model);
        model.rig.groupRotation =
          (Math.atan2(targetWorld.y - centerWorld.y, targetWorld.x - centerWorld.x) * 180) / Math.PI;
        model.rig.angle = model.rig.groupRotation;
        nodes.control.bowRig = normalizeBowRig(model.rig);
        const moved = syncBowRigFromModel(nodes.control);
        BowRigController.persistKeyframe(nodes.control);
        return moved;
      }

      function handleBowRigDrag(node, dragType, point) {
        const nodes = bowRigNodesForNode(node);
        if (!nodes || !["origin", "bone", "end"].includes(dragType)) return false;
        const deltaWorld = { x: point.x - drag.start.x, y: point.y - drag.start.y };
        if (node.id === nodes.control.id) {
          if (isBindingMode()) {
            const model = ensureBowRigModel(nodes.control);
            if (!model) return false;
            const centerWorld = bowCenterWorld(model);
            const controlLocal = bowWorldToLocal(centerWorld, model.rig.groupRotation, point);
            model.rig.controlBaseX = controlLocal.x;
            model.rig.controlBaseY = controlLocal.y;
            model.rig.pull = 0;
            nodes.control.bowRig = normalizeBowRig(model.rig);
            syncBowRigFromModel(nodes.control);
            return true;
          }
          return moveBowStringControl(nodes.control, point);
        }
        if (dragType === "bone") return moveBowRigRigid(nodes, deltaWorld);
        if (node.id === nodes.center.id) return moveBowRigRigid(nodes, deltaWorld);
        if (node.id === nodes.upper.id) {
          return dragType === "end" ? moveBowRigBodyTip(nodes, "upper", point) : moveBowRigRigid(nodes, deltaWorld);
        }
        if (node.id === nodes.lower.id) {
          return dragType === "end" ? moveBowRigBodyTip(nodes, "lower", point) : moveBowRigRigid(nodes, deltaWorld);
        }
        if (node.id === nodes.stringUpper.id) {
          return dragType === "origin" ? moveBowRigBodyTip(nodes, "upper", point) : moveBowStringControl(nodes.control, point);
        }
        if (node.id === nodes.stringLower.id) {
          return dragType === "end" ? moveBowRigBodyTip(nodes, "lower", point) : moveBowStringControl(nodes.control, point);
        }
        return false;
      }

      function isBowStringControlNode(node) {
        return node?.role === "bow-string-control" && node?.bowRig?.type === "string-control";
      }

      function moveBowStringControl(node, targetWorld) {
        const nodes = ensureBowRigModel(node);
        if (!nodes) return false;
        const centerWorld = bowCenterWorld(nodes);
        const baseWorld = bowLocalToWorld(centerWorld, nodes.rig.groupRotation, {
          x: nodes.rig.controlBaseX || 0,
          y: nodes.rig.controlBaseY || 0,
        });
        const pullAxis = bowAxes(nodes.rig.groupRotation).pull;
        const projected = dotVector(
          { x: targetWorld.x - baseWorld.x, y: targetWorld.y - baseWorld.y },
          pullAxis,
        );
        nodes.rig.pull = Math.max(-nodes.rig.maxPull, Math.min(nodes.rig.maxPull, projected));
        node.bowRig = normalizeBowRig(nodes.rig);
        const moved = syncBowRigFromModel(node);
        BowRigController.persistKeyframe(node);
        return moved;
      }

      function createBowRigFromSelectedPiece() {
        if (!isBindingMode()) setWorkspaceMode("binding");
        const piece = selectedPieceNode();
        if (!piece?.attachment?.image) {
          toast("Select a bow piece first");
          return;
        }
        const sourceImage = warriorImages[piece.attachment.image];
        if (!sourceImage?.complete) {
          toast("Bow image is still loading");
          return;
        }
        try {
          const baseName = String(piece.name || "bow").replace(/\s+/g, "_");
          const split = splitBowImageLayers(sourceImage);
          const originalLayer = Number(piece.attachment.layer) || 20;
          const restPart = cloneRestPartForPiece(piece);
          const legacyWeapon = findLegacyWeaponNodeForBowPiece(piece);
          const carrier = (() => {
            if (legacyWeapon?.parentId) {
              return state.nodes.find((node) => node.id === legacyWeapon.parentId && !node.attachment) || null;
            }
            const selected = selectedNode();
            return selected &&
              selected.id !== piece.id &&
              selected.id !== legacyWeapon?.id &&
              !selected.attachment
              ? selected
              : null;
          })();
          const carrierPose = carrier ? worldPose(carrier) : null;
          const centerPoint = imagePixelToRestWorld(restPart, split.size, split.bodyStats.centerX, split.bodyStats.centerY);
          const upperTip = imagePixelToRestWorld(restPart, split.size, split.bodyStats.centerX, split.bodyStats.minY);
          const lowerTip = imagePixelToRestWorld(restPart, split.size, split.bodyStats.centerX, split.bodyStats.maxY);
          const stringCenter = imagePixelToRestWorld(restPart, split.size, split.stringStats.centerX, split.stringStats.centerY);
          const bowAxis = normalizeVector({
            x: upperTip.x - centerPoint.x,
            y: upperTip.y - centerPoint.y,
          });
          const anchorLength = Math.max(6, Math.min(18, distance(upperTip, lowerTip) * 0.05));
          const centerStart = {
            x: centerPoint.x - bowAxis.x * anchorLength,
            y: centerPoint.y - bowAxis.y * anchorLength,
          };
          const centerBone = createBindingBone(
            `${baseName}_center`,
            centerStart,
            centerPoint,
            "#d6a15d",
            "bow-center",
            carrier,
            carrierPose,
          );
          const centerPose = poseFromNodeAndParent(centerBone, carrierPose);
          const restPartLocalToCenter = localFromWorldByParentPose(centerPose, {
            x: restPart.x || 0,
            y: restPart.y || 0,
          });
          const upperBone = createBindingBone(
            `${baseName}_upper`,
            centerPoint,
            upperTip,
            "#e0b26d",
            "bow-upper",
            centerBone,
            centerPose,
          );
          const lowerBone = createBindingBone(
            `${baseName}_lower`,
            centerPoint,
            lowerTip,
            "#c79258",
            "bow-lower",
            centerBone,
            centerPose,
          );
          const stringUpperBone = createBindingBone(
            `${baseName}_string_upper`,
            upperTip,
            stringCenter,
            "#7ab8ff",
            "bow-string-upper",
            centerBone,
            centerPose,
          );
          const stringControl = createBindingBone(
            `${baseName}_string_center`,
            stringCenter,
            {
              x: stringCenter.x - bowAxis.y * Math.max(10, split.size.width * restPart.scale * 0.1),
              y: stringCenter.y + bowAxis.x * Math.max(10, split.size.width * restPart.scale * 0.1),
            },
            "#7ab8ff",
            "bow-string-control",
            centerBone,
            centerPose,
          );
          const stringLowerBone = createBindingBone(
            `${baseName}_string_lower`,
            stringCenter,
            lowerTip,
            "#7ab8ff",
            "bow-string-lower",
            centerBone,
            centerPose,
          );
          stringControl.bowRig = normalizeBowRig({
            type: "string-control",
            centerId: centerBone.id,
            upperId: upperBone.id,
            lowerId: lowerBone.id,
            stringUpperId: stringUpperBone.id,
            stringLowerId: stringLowerBone.id,
            groupRotation:
              (Math.atan2(upperTip.y - centerPoint.y, upperTip.x - centerPoint.x) * 180) / Math.PI,
            angle: (Math.atan2(upperTip.y - centerPoint.y, upperTip.x - centerPoint.x) * 180) / Math.PI,
            upperLength: Math.max(4, distance(centerPoint, upperTip)),
            lowerLength: Math.max(4, distance(centerPoint, lowerTip)),
            controlBaseX: bowWorldToLocal(
              centerPoint,
              (Math.atan2(upperTip.y - centerPoint.y, upperTip.x - centerPoint.x) * 180) / Math.PI,
              stringCenter,
            ).x,
            controlBaseY: bowWorldToLocal(
              centerPoint,
              (Math.atan2(upperTip.y - centerPoint.y, upperTip.x - centerPoint.x) * 180) / Math.PI,
              stringCenter,
            ).y,
            pull: 0,
            maxPull: Math.max(24, split.bodyStats.height * restPart.scale * 1.15),
            bodyInfluence: 0.5,
          });
          state.nodes.push(centerBone, upperBone, lowerBone, stringUpperBone, stringLowerBone, stringControl);
          state.timelines[centerBone.id] = [];
          state.timelines[upperBone.id] = [];
          state.timelines[lowerBone.id] = [];
          state.timelines[stringUpperBone.id] = [];
          state.timelines[stringLowerBone.id] = [];
          state.timelines[stringControl.id] = [snapshotNode(stringControl)];

          piece.name = `${baseName}_rig`;
          piece.role = "bow-rig";
          piece.attachment = normalizeAttachment({
            ...piece.attachment,
            image: piece.attachment.image,
            layer: originalLayer,
            fullSkin: true,
            segments: false,
            chainTo: null,
            lower: null,
            skinBoneIds: [upperBone.id, lowerBone.id, stringUpperBone.id, stringLowerBone.id],
            restPart: {
              ...restPart,
              parentBoneId: centerBone.id,
              x: restPartLocalToCenter.x,
              y: restPartLocalToCenter.y,
              rotation: (restPart.rotation || 0) - centerPose.worldRotation,
              partId: piece.id,
            },
          });
          replaceLegacyWeaponNodeWithBowRig(legacyWeapon, centerBone, piece);
          state.selectedPieceNodeId = piece.id;
          state.selectedNodeId = stringControl.id;
          state.selectedKey = null;
          dynamicScarves.clear();
          renderAll();
          toast("Bow rig created.");
        } catch (error) {
          toast(error instanceof Error ? error.message : String(error));
        }
      }

      async function createArrowRigFromFile(file) {
        const image = await loadFileImage(file);
        const cleanName = normalizeLegAssetFilename(file.name);
        const customImageId = `${customImagePrefix}arrow-${uid("image")}`;
        registerCustomImage(customImageId, file.name, `${legAssetPrefix}${cleanName}`, { image });
        const imageWidth = Math.max(1, image.naturalWidth || image.width || 1);
        const imageHeight = Math.max(1, image.naturalHeight || image.height || 1);
        const baseName = String(file.name || "arrow")
          .replace(/\.[^.]+$/, "")
          .trim()
          .replace(/\s+/g, "_") || "arrow";
        const scale = Math.min(1, 140 / Math.max(imageWidth, imageHeight));
        const horizontal = imageWidth >= imageHeight;
        const boneLength = Math.max(12, (horizontal ? imageWidth : imageHeight) * scale);
        const center = { x: 420, y: 330 };
        const halfLength = boneLength * 0.5;
        const startWorld = horizontal
          ? { x: center.x - halfLength, y: center.y }
          : { x: center.x, y: center.y - halfLength };
        const endWorld = horizontal
          ? { x: center.x + halfLength, y: center.y }
          : { x: center.x, y: center.y + halfLength };
        const arrowBone = createBindingBone(
          `${baseName}_arrow_bone`,
          startWorld,
          endWorld,
          "#d8d2bd",
          "arrow",
          null,
          null,
        );
        const arrowPiece = createGeneratedPieceNode(
          `${baseName}_arrow`,
          customImageId,
          {
            x: -boneLength * 0.5,
            y: 0,
            scale,
            rotation: 0,
            anchorX: 0.5,
            anchorY: 0.5,
            parentBoneId: arrowBone.id,
          },
          24 + pieceNodes().length,
          [arrowBone.id],
        );
        arrowPiece.role = "arrow-piece";
        arrowBone.bindPose = normalizeBindPose(arrowBone);
        state.nodes.push(arrowBone, arrowPiece);
        state.timelines[arrowBone.id] = [];
        state.timelines[arrowPiece.id] = [];
        state.arrowVisibilityTracks[arrowPiece.id] = [];
        state.arrowParentTracks[arrowPiece.id] = [];
        state.selectedPieceNodeId = arrowPiece.id;
        state.selectedNodeId = arrowBone.id;
        state.selectedKey = null;
        dynamicScarves.clear();
        renderAll();
        toast("Arrow rig created.");
      }

      function deleteSelectedPiece() {
        const piece = selectedPieceNode();
        if (!piece) return;
        if (piece.role === "arrow-piece") delete state.arrowVisibilityTracks[piece.id];
        if (piece.role === "arrow-piece") delete state.arrowParentTracks[piece.id];
        if (piece.role === "slash-fx-piece") delete state.slashFxVisibilityTracks[piece.id];
        if (piece.role === "slash-fx-piece") delete state.slashFxParentTracks[piece.id];
        if (piece.role === "slash-fx-piece") delete state.slashFxActionHiddenMap[piece.id];
        if (piece.role === "piece" && !boundBoneIdsForPiece(piece).length) {
          state.nodes = state.nodes.filter((node) => node.id !== piece.id);
          delete state.timelines[piece.id];
          state.selectedNodeId = state.nodes[0]?.id || null;
        } else {

      function bindCanvas() {
        el.stage.style.cursor = "grab";
        const startDrag = (event) => {
          if (event.type === "mousedown" && window.PointerEvent) return;
          if (drag && drag.type !== "key") return;
          if (event.button !== undefined && event.button !== 0) return;
          const screenPoint = stageScreenPoint(event);
          const point = canvasPoint(event);
          updateStagePointerWorld(point);
          if (handleBindingBoneToolClick(point)) {
            event.preventDefault();
            return;
          }
          const hit = hitTest(point);
          if (!hit) {
            event.preventDefault();
            drag = {
              type: "viewport-pan",
              start: point,
              startScreen: screenPoint,
              startStageView: { ...state.stageView },
              hasMoved: false,
            };
            if (event.pointerId !== undefined && el.stage.setPointerCapture) {
              el.stage.setPointerCapture(event.pointerId);
            }
            el.stage.style.cursor = "grabbing";
            return;
          }
          event.preventDefault();
          poseOverrides.clear();
          if (hit.piece?.id) {
            state.selectedPieceNodeId = hit.piece.id;
          }
          if (hit.type === "piece" || hit.type === "piece-scale" || hit.type === "piece-rotate") {
            state.selectedPieceNodeId = hit.node.id;
          }
          if (isBindingMode() && hit.type === "bone" && !isBowRigNode(hit.node) && !isTransformLockedNode(hit.node)) {
            detachBoneFromParentPreserveWorld(hit.node);
          }
          state.selectedNodeId = hit.node.id;
          state.selectedKey = null;
          const pose = worldPose(hit.node);
          const end = endPoint(pose);
          const pieceStartTransform = hit.type.startsWith("piece") ? pieceTransform(hit.node) : null;
          const pieceCenterPoint = hit.type.startsWith("piece") ? pieceCenter(hit.node) : null;
          drag = {
            type: hit.type,
            nodeId: hit.node.id,
            jointId: hit.jointId,
            start: point,
            startScreen: screenPoint,
            hasMoved: false,
            startWorldOrigin: { x: pose.worldX, y: pose.worldY },
            startWorldEnd: { x: end.x, y: end.y },
            startPieceTransform: pieceStartTransform,
            startPieceCenter: pieceCenterPoint,
            startPieceDistance: pieceCenterPoint ? Math.max(1, distance(point, pieceCenterPoint)) : 1,
            startPieceAngle: pieceCenterPoint
              ? (Math.atan2(point.y - pieceCenterPoint.y, point.x - pieceCenterPoint.x) * 180) / Math.PI
              : 0,
            startPoses: captureWorldPoses(),
            touched: new Set([hit.node.id]),
          };
          if (event.pointerId !== undefined && el.stage.setPointerCapture) {
            el.stage.setPointerCapture(event.pointerId);
          }
          renderAll();
        };

        const moveDrag = (event) => {
          if (event.type === "mousemove" && window.PointerEvent) return;
          const screenPoint = stageScreenPoint(event);
          const point = canvasPoint(event);
          updateStagePointerWorld(point);
          if (!drag) {
            el.stage.style.cursor = hitTest(point) ? "grab" : "grab";
            return;
          }
          event.preventDefault();
          if (drag.type === "viewport-pan") {
            const deltaX = screenPoint.x - drag.startScreen.x;
            const deltaY = screenPoint.y - drag.startScreen.y;
            if (!drag.hasMoved && Math.hypot(deltaX, deltaY) < 3) {
              return;
            }
            drag.hasMoved = true;
            state.stageView.x = drag.startStageView.x + deltaX;
            state.stageView.y = drag.startStageView.y + deltaY;
            el.stage.style.cursor = "grabbing";
            renderDragFrame();
            return;
          }
          const node = state.nodes.find((item) => item.id === drag.nodeId);
          if (!node) return;
          if (
            ((["piece", "piece-scale", "piece-rotate"].includes(drag.type) && isPieceTransformLocked(node)) ||
              ([
                "origin",
                "bone",
                "end",
                "stretch-origin",
                "stretch-end",
                "arrow-piece-bone",
                "slash-fx-piece-bone",
              ].includes(drag.type) &&
                isTransformLockedNode(node)))
          ) {
            renderDragFrame();
            return;
          }
          const moveDistance = Math.hypot(screenPoint.x - drag.startScreen.x, screenPoint.y - drag.startScreen.y);
          if (!drag.hasMoved && moveDistance < 3) {
            return;
          }
          drag.hasMoved = true;
          if (isBowRigNode(node) && ["origin", "bone", "end"].includes(drag.type)) {
            handleBowRigDrag(node, drag.type, point);
            renderDragFrame();
            return;
          }
          if (drag.type === "origin") {
            if (handleBindingJointDrag(node, drag.type, point)) {
              renderDragFrame();
              return;
            }
            solveGenericJointDrag(drag.jointId, point);
          }
          if (drag.type === "bone" || drag.type === "arrow-piece-bone" || drag.type === "slash-fx-piece-bone") {
            moveBoneRigid(
              node,
              { x: point.x - drag.start.x, y: point.y - drag.start.y },
              drag.startWorldOrigin,
            );
          }
          if (drag.type === "piece") {
            movePieceByDrag(node, { x: point.x - drag.start.x, y: point.y - drag.start.y });
          }
          if (drag.type === "piece-scale") {
            scalePieceByDrag(node, point);
          }
          if (drag.type === "piece-rotate") {
            rotatePieceByDrag(node, point);
          }
          if (drag.type === "stretch-origin" || drag.type === "stretch-end") {
            stretchBoneEndpoint(node, drag.type, point);
          }
          if (drag.type === "end") {
            if (handleBindingJointDrag(node, drag.type, point)) {
              renderDragFrame();
              return;
            }
            solveGenericJointDrag(drag.jointId, point);
          }
          renderDragFrame();
        };

        const endDrag = (event) => {
          if (event.type === "mouseup" && window.PointerEvent) return;
          commitActiveDrag();
          if (event.pointerId !== undefined && el.stage.releasePointerCapture) {
            el.stage.releasePointerCapture(event.pointerId);
          }
        };

        const handleWheel = (event) => {
          event.preventDefault();
          const screenPoint = stageScreenPoint(event);
          updateStagePointerWorld(worldFromScreen(screenPoint));
          const zoomFactor = Math.exp(-event.deltaY * 0.0015);
          zoomStageAtScreenPoint(screenPoint, state.stageView.zoom * zoomFactor);
          renderDragFrame();
        };

        const handlePointerLeave = () => {
          if (drag?.type === "viewport-pan") return;
          updateStagePointerWorld(null);
        };

        el.stage.addEventListener("pointerdown", startDrag);
        el.stage.addEventListener("pointermove", moveDrag);
        el.stage.addEventListener("pointerup", endDrag);
        el.stage.addEventListener("pointerleave", handlePointerLeave);
        el.stage.addEventListener("mousedown", startDrag);
        el.stage.addEventListener("wheel", handleWheel, { passive: false });
        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", endDrag);
      }

      function commitActiveDrag() {
        if (!drag || drag.type === "key") return;
        if (drag.type === "viewport-pan") {
          drag = null;
          el.stage.style.cursor = "grab";
          renderAll();
          return;
        }
        if (!drag.hasMoved) {
          drag = null;
          poseOverrides.clear();
          el.stage.style.cursor = "grab";
          renderAll();
          return;
        }
        const pieceDrag = drag.type.startsWith("piece");
        if (!pieceDrag) persistTouchedNodes();
        const activeNode = state.nodes.find((node) => node.id === drag.nodeId);
        if (activeNode) {
          if (pieceDrag) {
            state.selectedPieceNodeId = activeNode.id;
            state.selectedKey = null;
            toast("Piece adjusted. Bone binding position was not changed.");
          } else if (isBindingMode()) {
            state.selectedKey = null;
            toast(`Updated bind pose for ${drag.touched?.size || 1} nodes.`);
          } else {
            state.selectedKey = { nodeId: activeNode.id, frame: state.currentFrame };
            toast(`Recorded ${drag.touched?.size || 1} nodes at frame ${state.currentFrame + 1}.`);
          }
        }
        drag = null;
        poseOverrides.clear();
        el.stage.style.cursor = "grab";
        renderAll();
      }

      function captureFullSkinWorldSnapshots() {
        return state.nodes
          .filter((node) => node?.attachment?.fullSkin && node.attachment.restPart)
          .map((node) => {
            const resolved = resolveRestPartTransform(node.attachment.restPart, false);
            if (!resolved) return null;
            return {
              nodeId: node.id,
              x: Number(resolved.x) || 0,
              y: Number(resolved.y) || 0,
              rotation: Number(resolved.rotation) || 0,
            };
          })
          .filter(Boolean);
      }

      function restoreFullSkinWorldSnapshots(snapshots) {
        if (!Array.isArray(snapshots) || !snapshots.length) return;
        snapshots.forEach((snapshot) => {
          const node = state.nodes.find((item) => item.id === snapshot.nodeId);
          const restPart = node?.attachment?.restPart;
          if (!restPart) return;
          node.attachment.restPart = setResolvedRestPartTransform(
            restPart,
            {
              x: snapshot.x,
              y: snapshot.y,
              rotation: snapshot.rotation,
            },
            false,
          );
        });
      }

      function persistTouchedNodes() {
        if (!drag?.touched) return;
        const preserveFullSkinWorld =
          isBindingMode() && state.bindingDragMode === "node" ? captureFullSkinWorldSnapshots() : null;
        const touchedNodes = state.nodes.filter((node) => drag.touched?.has(node.id));
        touchedNodes.forEach((node) => {
          if (isBindingMode()) {
            node.bindPose = normalizeBindPose(node);
            Object.assign(node, node.bindPose);
          } else {
            upsertKeyframe(node);
          }
        });
        if (preserveFullSkinWorld) restoreFullSkinWorldSnapshots(preserveFullSkinWorld);
        snapshotAllBowRigsAtCurrentFrame();
      }

      function bindTimelineDrag() {
        document.addEventListener("pointermove", (event) => {
          if (!drag || drag.type !== "key") return;
          const delta = Math.round((event.clientX - drag.startX) / frameWidth);
          const nextFrame = clampFrame(drag.sourceFrame + delta);
          const entries = drag.keyEntries || [];
          if (!entries.length) return;
          const occupied = entries.some(({ nodeId, keyframe }) =>
            (state.timelines[nodeId] || []).some((item) => item !== keyframe && item.frame === nextFrame),
          );
          if (!occupied) {
            entries.forEach(({ keyframe }) => {
              keyframe.frame = nextFrame;
            });
            state.currentFrame = nextFrame;
            state.selectedKey = { nodeId: drag.nodeId, frame: nextFrame };
            [...new Set(entries.map((entry) => entry.nodeId))].forEach((nodeId) => {
              state.timelines[nodeId]?.sort((a, b) => a.frame - b.frame);
            });
            renderAll();
          }
        });
        document.addEventListener("pointerup", () => {
          commitActiveDrag();
          if (drag?.type === "key") drag = null;
        });
        el.tracksViewport.addEventListener("pointerdown", (event) => {
          if (event.target !== el.tracks && !event.target.classList.contains("frame-ruler")) return;
          state.currentFrame = clampFrame(frameFromPointer(event, el.tracksViewport));
          state.selectedKey = null;
          renderAll();
        });
      }

      function tick(now) {
        if (!state.playing) return;
        const elapsed = (now - lastTime) / 1000;
        lastTime = now;
        state.currentFrame += elapsed * state.fps;
        if (state.currentFrame > state.duration) state.currentFrame = 0;
        state.currentFrame = Math.round(state.currentFrame * 100) / 100;
        el.frameInput.value = Math.round(state.currentFrame) + 1;
        renderTimeStatus();
        renderPlaybackFrame();
        rafId = requestAnimationFrame(tick);
      }

      bindEvents();
      resizeCanvas();
      const params = new URLSearchParams(window.location.search);
      if (params.get("sample") === "new") {
        loadNewVersionSample();
      } else if (params.get("sample") === "walk") {
        loadSideWalkSample();
      } else {
        loadInitialSpineUnitProject();
      }
    </script>
  </body>
</html>
