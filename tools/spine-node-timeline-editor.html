<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spine 节点时间轴编辑器</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151719;
        --panel: #202326;
        --panel-2: #292d31;
        --line: #3b4147;
        --text: #eef2f5;
        --muted: #9aa5ae;
        --accent: #35b6b4;
        --accent-2: #e6a23c;
        --danger: #e66f6f;
        --ok: #77c66e;
        --canvas: #101214;
        --track: #23282d;
        --track-alt: #1b1f23;
        --key: #f5c84b;
        --key-active: #ff7a59;
        --shadow: 0 18px 50px rgb(0 0 0 / 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui,
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #30363b;
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #171a1d;
        color: var(--text);
        padding: 5px 8px;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
        line-height: 1.45;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr 224px;
        width: 100vw;
        height: 100vh;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #1c2024;
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
        min-height: 32px;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background:
          linear-gradient(135deg, transparent 48%, #ffffff40 50%, transparent 52%),
          linear-gradient(135deg, var(--accent), #4d8ecf);
      }

      .brand h1 {
        margin: 0;
        overflow: hidden;
        font-size: 15px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toolbar button {
        padding: 0 10px;
      }

      .mode-button.active {
        border-color: var(--accent);
        background: #244f4f;
      }

      .app.binding-mode .timeline {
        visibility: hidden;
        pointer-events: none;
      }

      .bind-only {
        display: none;
      }

      .app.binding-mode .bind-only {
        display: block;
      }

      .bind-note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .workspace {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        min-height: 0;
      }

      .panel {
        min-height: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow: auto;
      }

      .panel.right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }

      .panel-section {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .node-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .node-item {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 6px;
        align-items: center;
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        padding: 4px 8px;
        color: var(--text);
        text-align: left;
      }

      .node-item.active {
        border-color: var(--accent);
        background: #294144;
      }

      .node-depth {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      .node-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .node-color {
        width: 14px;
        height: 14px;
        border: 1px solid #ffffff80;
        border-radius: 50%;
      }

      .action-list {
        margin-top: 10px;
      }

      .action-item {
        grid-template-columns: 1fr auto;
      }

      .action-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .stage-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
        background:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px), var(--canvas);
        background-size: 32px 32px;
        user-select: none;
      }

      #stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .stage-hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: min(520px, calc(100% - 24px));
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgb(22 25 28 / 0.82);
        color: var(--muted);
        padding: 8px 10px;
        font-size: 12px;
        pointer-events: none;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
      }

      .field.checkbox-field {
        justify-content: end;
      }

      .field.checkbox-field label {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 32px;
        color: var(--text);
      }

      .field.checkbox-field input {
        width: 16px;
        min-height: 16px;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .button-row.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .danger {
        border-color: #6d3838;
        background: #4a2424;
      }

      .primary {
        border-color: #337f7d;
        background: #236160;
      }

      .timeline {
        display: grid;
        grid-template-rows: 42px 1fr;
        min-height: 0;
        border-top: 1px solid var(--line);
        background: #191d20;
      }

      .timeline-top {
        display: grid;
        grid-template-columns: 340px 1fr 300px;
        border-bottom: 1px solid var(--line);
      }

      .transport,
      .timeline-meta,
      .timeline-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
      }

      .transport {
        gap: 6px;
        border-right: 1px solid var(--line);
      }

      .timeline-actions {
        justify-content: flex-end;
        border-left: 1px solid var(--line);
      }

      .transport button,
      .timeline-actions button {
        min-width: 34px;
        padding: 0 6px;
        font-size: 12px;
        white-space: nowrap;
      }

      .small-input {
        width: 72px;
      }

      .timeline-body {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 0;
      }

      .track-labels {
        overflow: hidden auto;
        border-right: 1px solid var(--line);
      }

      .track-label {
        display: flex;
        align-items: center;
        min-height: 30px;
        border-bottom: 1px solid #ffffff10;
        padding: 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .tracks-viewport {
        position: relative;
        overflow: auto;
      }

      .tracks {
        position: relative;
        min-height: 100%;
      }

      .frame-ruler,
      .track-row {
        position: relative;
        min-height: 30px;
      }

      .frame-ruler {
        position: sticky;
        top: 0;
        z-index: 4;
        background: #1f2428;
        border-bottom: 1px solid var(--line);
      }

      .track-row {
        border-bottom: 1px solid #ffffff10;
        background: var(--track);
      }

      .track-row:nth-child(odd) {
        background: var(--track-alt);
      }

      .frame-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #ffffff14;
      }

      .frame-label {
        position: absolute;
        top: 8px;
        color: var(--muted);
        font-size: 11px;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        width: 2px;
        background: var(--accent-2);
        pointer-events: none;
      }

      .playhead::before {
        position: absolute;
        top: 0;
        left: -5px;
        width: 12px;
        height: 12px;
        border-radius: 0 0 6px 6px;
        background: var(--accent-2);
        content: "";
      }

      .key {
        position: absolute;
        top: 8px;
        z-index: 2;
        width: 14px;
        height: 14px;
        border: 1px solid #6f4d00;
        border-radius: 3px;
        background: var(--key);
        cursor: ew-resize;
        transform: translateX(-50%) rotate(45deg);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.35);
      }

      .key.active {
        border-color: #8c2d15;
        background: var(--key-active);
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .file-input {
        display: none;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        max-width: 360px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #24292e;
        box-shadow: var(--shadow);
        color: var(--text);
        padding: 10px 12px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 230px 1fr;
        }

        .panel.right {
          display: none;
        }

        .timeline-top {
          grid-template-columns: 230px 1fr;
        }

        .timeline-actions {
          display: none;
        }

        .timeline-body {
          grid-template-columns: 230px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>Spine 节点时间轴编辑器</h1>
            <span>骨骼节点 · 关键帧 · 插值播放 · JSON 工程导入导出</span>
          </div>
        </div>
        <div class="toolbar">
          <div id="swordsmanFeatureGroup" class="toolbar-group" hidden></div>
          <div id="archerFeatureGroup" class="toolbar-group" hidden></div>
          <button id="newProjectBtn" type="button">新建</button>
          <button id="importBtn" type="button">导入 JSON</button>
          <button id="exportBtn" type="button">导出 JSON</button>
          <button id="sampleBtn" type="button">示例</button>
          <button id="walkSampleBtn" type="button">侧面行走</button>
          <button id="newVersionSampleBtn" type="button">新版</button>
          <button id="idleAnimationBtn" type="button">待机动画</button>
          <button id="replaceMaterialBtn" type="button">素材替换</button>
          <button id="bindingModeBtn" class="mode-button" type="button">绑定管理</button>
          <button id="slashSampleBtn" type="button" hidden>侧身劈砍</button>
          <button id="threeQuarterSampleBtn" type="button" hidden>70度侧身</button>
          <button id="viewToggleBtn" type="button">骨骼视图</button>
          <button id="skeletonOverlayBtn" type="button">显示骨骼</button>
          <button id="nodeModeBtn" class="mode-button active" type="button">节点移动</button>
          <button id="boneModeBtn" class="mode-button" type="button">骨骼移动</button>
          <button id="stretchModeBtn" class="mode-button" type="button">骨骼伸缩</button>
          <input id="fileInput" class="file-input" type="file" accept=".json,application/json" />
          <input id="materialInput" class="file-input" type="file" accept="image/png,image/jpeg,image/webp" />
        </div>
      </header>

      <main class="workspace">
        <aside class="panel">
          <section class="panel-section">
            <div class="panel-title">
              <span>动作列表</span>
              <button id="newActionBtn" type="button">新建</button>
            </div>
            <div class="field">
              <label for="actionNameInput">动作名</label>
              <input id="actionNameInput" type="text" />
            </div>
            <div class="button-row">
              <button id="saveActionBtn" class="primary" type="button">保存动作</button>
              <button id="applyIdleToActionBtn" type="button">生成待机</button>
            </div>
            <div id="actionList" class="node-list action-list"></div>
          </section>
          <section class="panel-section">
            <div class="panel-title">
              <span>节点树</span>
              <button id="addNodeBtn" type="button">添加</button>
            </div>
            <div id="nodeList" class="node-list"></div>
          </section>
          <section class="panel-section bind-only">
            <div class="panel-title">
              <span>物块列表</span>
              <button id="addPieceBtn" type="button">添加</button>
            </div>
            <div id="pieceList" class="node-list"></div>
            <div class="button-row">
              <button id="deletePieceBtn" class="danger" type="button">删除物块</button>
            </div>
            <div class="button-row">
              <button id="addBoneFromNodeBtn" type="button">从节点添加骨骼</button>
              <button id="addFreeBoneBtn" type="button">自由添加骨骼</button>
            </div>
          </section>
          <section class="panel-section">
            <div class="panel-title">项目设置</div>
            <div class="form-grid">
              <div class="field">
                <label for="fpsInput">FPS</label>
                <input id="fpsInput" type="number" min="1" max="120" step="1" />
              </div>
              <div class="field">
                <label for="durationInput">总帧数</label>
                <input id="durationInput" type="number" min="1" max="1200" step="1" />
              </div>
            </div>
          </section>
        </aside>

        <section class="stage-wrap">
          <canvas id="stage" draggable="false"></canvas>
          <div class="stage-hint">
            节点移动：拖拽关节圆点，沿父骨骼方向会拉伸/缩短父骨骼并带动相连子链；骨骼移动：拖拽骨骼段会平移当前骨骼和子骨骼。
          </div>
        </section>

        <aside class="panel right">
          <section class="panel-section">
            <div class="panel-title">节点属性</div>
            <div class="form-grid">
              <div class="field full">
                <label for="nodeNameInput">名称</label>
                <input id="nodeNameInput" type="text" />
              </div>
              <div class="field full">
                <label for="parentSelect">父节点</label>
                <select id="parentSelect"></select>
              </div>
              <div class="field">
                <label for="xInput">X</label>
                <input id="xInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="yInput">Y</label>
                <input id="yInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="rotationInput">旋转</label>
                <input id="rotationInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="lengthInput">长度</label>
                <input id="lengthInput" type="number" min="4" step="1" />
              </div>
              <div class="field">
                <label for="scaleXInput">缩放 X</label>
                <input id="scaleXInput" type="number" min="0.05" step="0.05" />
              </div>
              <div class="field">
                <label for="scaleYInput">缩放 Y</label>
                <input id="scaleYInput" type="number" min="0.05" step="0.05" />
              </div>
              <div class="field full">
                <label for="colorInput">颜色</label>
                <input id="colorInput" type="color" />
              </div>
              <div class="field full">
                <label for="attachmentImageSelect">贴图</label>
                <select id="attachmentImageSelect">
                  <option value="">无</option>
                  <option value="body">body.png</option>
                  <option value="head">head.png</option>
                  <option value="arm">arm_right.png</option>
                  <option value="leg">leg.png</option>
                  <option value="newHead">新版/head.png</option>
                  <option value="newTorso">新版/torso.png</option>
                  <option value="newLeftArm">新版/leftarm.png</option>
                  <option value="newRightArm">新版/rightarm.png</option>
                  <option value="newLeftLeg">新版/leftleg.png</option>
                  <option value="newRightLeg">新版/rightleg.png</option>
                  <option value="newSword">新版/sword.png</option>
                </select>
              </div>
              <div class="field">
                <label for="attachmentOffsetXInput">贴图 X</label>
                <input id="attachmentOffsetXInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentOffsetYInput">贴图 Y</label>
                <input id="attachmentOffsetYInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentWidthInput">贴图宽度</label>
                <input id="attachmentWidthInput" type="number" min="1" step="1" />
              </div>
              <div class="field">
                <label for="attachmentLengthScaleInput">拉伸比例</label>
                <input id="attachmentLengthScaleInput" type="number" min="0.1" step="0.05" />
              </div>
              <div class="field">
                <label for="attachmentRotationInput">贴图旋转</label>
                <input id="attachmentRotationInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentAlphaInput">透明度</label>
                <input id="attachmentAlphaInput" type="number" min="0" max="1" step="0.05" />
              </div>
              <div class="field">
                <label for="attachmentLayerInput">图层</label>
                <input id="attachmentLayerInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentAnchorXInput">锚点 X</label>
                <input id="attachmentAnchorXInput" type="number" min="0" max="1" step="0.05" />
              </div>
              <div class="field checkbox-field">
                <label for="attachmentSegmentsInput">
                  <input id="attachmentSegmentsInput" type="checkbox" />
                  分段弯曲
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="attachmentReverseInput">
                  <input id="attachmentReverseInput" type="checkbox" />
                  反向贴图
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="attachmentScarfEnabledInput">
                  <input id="attachmentScarfEnabledInput" type="checkbox" />
                  头巾弹簧
                </label>
              </div>
              <div class="field">
                <label for="attachmentScarfSplitInput">头巾分割</label>
                <input id="attachmentScarfSplitInput" type="number" min="0.05" max="0.95" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfRootXInput">弹簧 X</label>
                <input id="attachmentScarfRootXInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfRootYInput">弹簧 Y</label>
                <input id="attachmentScarfRootYInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfTipXInput">弹簧长度</label>
                <input id="attachmentScarfTipXInput" type="number" min="0.05" max="2" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfTipYInput">弹簧角度</label>
                <input id="attachmentScarfTipYInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentScarfStiffnessInput">弹簧强度</label>
                <input id="attachmentScarfStiffnessInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfDampingInput">弹簧阻尼</label>
                <input id="attachmentScarfDampingInput" type="number" min="0" max="0.99" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfGravityInput">弹簧重力</label>
                <input id="attachmentScarfGravityInput" type="number" step="10" />
              </div>
              <div class="field">
                <label for="attachmentScarfWaveInput">弹簧摆幅</label>
                <input id="attachmentScarfWaveInput" type="number" min="0" step="0.1" />
              </div>
              <div class="field checkbox-field">
                <label for="attachmentHemEnabledInput">
                  <input id="attachmentHemEnabledInput" type="checkbox" />
                  下摆弹簧
                </label>
              </div>
              <div class="field">
                <label for="attachmentHemXInput">下摆 X</label>
                <input id="attachmentHemXInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentHemYInput">下摆 Y</label>
                <input id="attachmentHemYInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentHemLengthInput">下摆长度</label>

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`Cannot load ${src}`));
          image.src = src;
        });
      }

      function loadFileImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error(`Cannot load ${file.name}`));
          };
          image.src = url;
        });
      }

      function imageToImageData(image) {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth || image.width;
        canvas.height = image.naturalHeight || image.height;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(image, 0, 0);
        return context.getImageData(0, 0, canvas.width, canvas.height);
      }

      function imageDataToImage(imageData) {
        const canvas = document.createElement("canvas");
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        canvas.getContext("2d").putImageData(imageData, 0, 0);
        return loadImage(canvas.toDataURL("image/png"));
      }

      function imageDataToDataUrl(imageData) {
        const canvas = document.createElement("canvas");
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        canvas.getContext("2d").putImageData(imageData, 0, 0);
        return canvas.toDataURL("image/png");
      }

      function averageOpaqueColorFromImageData(imageData) {
        let r = 0;
        let g = 0;
        let b = 0;
        let weight = 0;
        for (let index = 0; index < imageData.width * imageData.height; index += 1) {
          const alpha = imageData.data[index * 4 + 3];
          if (alpha < 16) continue;
          const a = alpha / 255;
          r += imageData.data[index * 4] * a;
          g += imageData.data[index * 4 + 1] * a;
          b += imageData.data[index * 4 + 2] * a;
          weight += a;
        }
        if (weight <= 0) return "#d8d0bf";
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value / weight))).toString(16).padStart(2, "0");
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }

      function imageDataOffset(imageData, x, y) {

      function createOpaqueMask(imageData, alphaThreshold = 16) {
        const mask = new Uint8Array(imageData.width * imageData.height);
        for (let index = 0; index < mask.length; index += 1) {
          mask[index] = imageData.data[index * 4 + 3] >= alphaThreshold ? 1 : 0;
        }
        return mask;
      }

      function maskPixelCount(mask) {
        let count = 0;
        for (let index = 0; index < mask.length; index += 1) {

            const index = y * width + x;
            if (!mask[index]) continue;
            let count = 0;
            for (let dy = -1; dy <= 1; dy += 1) {
              const py = y + dy;
              if (py < 0 || py >= height) continue;
              for (let dx = -1; dx <= 1; dx += 1) {
                const px = x + dx;
                if (px < 0 || px >= width) continue;
                count += mask[py * width + px] ? 1 : 0;
              }
            }
            counts[index] = count;
          }
        }
        return counts;
      }

      function computeDistanceToTransparent(mask, width, height) {
        const distance = new Int16Array(mask.length);
        distance.fill(-1);
        const queue = [];
        let cursor = 0;
        for (let index = 0; index < mask.length; index += 1) {
          if (mask[index]) continue;
          distance[index] = 0;
          queue.push(index);
        }
        while (cursor < queue.length) {
          const index = queue[cursor++];
          const x = index % width;
          const y = Math.floor(index / width);
          const nextDistance = distance[index] + 1;
          if (x > 0) {
            const neighbor = index - 1;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
          if (x < width - 1) {
            const neighbor = index + 1;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
          if (y > 0) {
            const neighbor = index - width;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
          if (y < height - 1) {
            const neighbor = index + width;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
        }
        return distance;
      }

      function dilateMask(mask, width, height, steps, limitMask = null) {
        let current = mask.slice();
        for (let step = 0; step < steps; step += 1) {
          const next = current.slice();
          for (let index = 0; index < current.length; index += 1) {
            if (!current[index]) continue;
            const x = index % width;
            const y = Math.floor(index / width);
            if (x > 0 && (!limitMask || limitMask[index - 1])) next[index - 1] = 1;
            if (x < width - 1 && (!limitMask || limitMask[index + 1])) next[index + 1] = 1;
            if (y > 0 && (!limitMask || limitMask[index - width])) next[index - width] = 1;
            if (y < height - 1 && (!limitMask || limitMask[index + width])) next[index + width] = 1;
          }
          current = next;
        }
        return current;
      }

      function removeSmallMaskRegions(mask, width, height, minPixels) {
        const result = mask.slice();
        const seen = new Uint8Array(mask.length);
        for (let index = 0; index < mask.length; index += 1) {
          if (!result[index] || seen[index]) continue;
          const region = [index];
          seen[index] = 1;
          for (let cursor = 0; cursor < region.length; cursor += 1) {
            const current = region[cursor];
            const x = current % width;
            const y = Math.floor(current / width);
            if (x > 0 && result[current - 1] && !seen[current - 1]) {
              seen[current - 1] = 1;
              region.push(current - 1);
            }
            if (x < width - 1 && result[current + 1] && !seen[current + 1]) {
              seen[current + 1] = 1;
              region.push(current + 1);
            }
            if (y > 0 && result[current - width] && !seen[current - width]) {
              seen[current - width] = 1;
              region.push(current - width);
            }
            if (y < height - 1 && result[current + width] && !seen[current + width]) {
              seen[current + width] = 1;
              region.push(current + width);
            }
          }
          if (region.length >= minPixels) continue;
          region.forEach((pixelIndex) => {
            result[pixelIndex] = 0;
          });
        }
        return result;
      }

      function maskBounds(mask, width, height) {
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;
        let sumX = 0;
        let sumY = 0;
        let count = 0;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          sumX += x;
          sumY += y;
          count += 1;
        }
        if (!count) return null;
        return {
          minX,
          minY,
          maxX,
          maxY,
          width: maxX - minX + 1,
          height: maxY - minY + 1,
          centerX: sumX / count,
          centerY: sumY / count,
          count,
        };
      }

      function imageDataFromMask(sourceImageData, mask) {
        const output = new ImageData(sourceImageData.width, sourceImageData.height);
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const offset = index * 4;
          output.data[offset] = sourceImageData.data[offset];
          output.data[offset + 1] = sourceImageData.data[offset + 1];
          output.data[offset + 2] = sourceImageData.data[offset + 2];
          output.data[offset + 3] = sourceImageData.data[offset + 3];
        }
        return output;
      }

      function registerGeneratedMaskImage(baseName, suffix, imageData) {
        const id = `${customImagePrefix}${uid(`bow-${suffix}`)}`;
        registerCustomImage(id, `${baseName}-${suffix}.png`, imageDataToDataUrl(imageData));
        return id;
      }

      function splitBowImageLayers(image) {
        const sourceImageData = imageToImageData(image);
        const { width, height } = sourceImageData;
        const opaqueMask = createOpaqueMask(sourceImageData);
        const opaqueCount = maskPixelCount(opaqueMask);
        if (!opaqueCount) throw new Error("Bow image has no opaque pixels");
        const distanceMap = computeDistanceToTransparent(opaqueMask, width, height);
        const neighborCounts = computeOpaqueNeighborCounts(opaqueMask, width, height);
        const bodySeed = new Uint8Array(opaqueMask.length);
        for (let index = 0; index < opaqueMask.length; index += 1) {
          if (!opaqueMask[index]) continue;
          if (distanceMap[index] >= 3 || neighborCounts[index] >= 8) {
            bodySeed[index] = 1;
          }
        }
        let bodyMask = dilateMask(bodySeed, width, height, 2, opaqueMask);
        if (maskPixelCount(bodyMask) < opaqueCount * 0.35) {
          bodyMask = dilateMask(bodySeed, width, height, 3, opaqueMask);
        }
        let stringMask = new Uint8Array(opaqueMask.length);
        for (let index = 0; index < opaqueMask.length; index += 1) {
          stringMask[index] = opaqueMask[index] && !bodyMask[index] ? 1 : 0;
        }
        stringMask = removeSmallMaskRegions(stringMask, width, height, Math.max(12, Math.round(height * 0.015)));
        if (maskPixelCount(stringMask) < Math.max(24, Math.round(opaqueCount * 0.03))) {
          throw new Error("Failed to isolate bow string");
        }
        stringMask = dilateMask(stringMask, width, height, 2, opaqueMask);
        for (let index = 0; index < opaqueMask.length; index += 1) {
          bodyMask[index] = opaqueMask[index] && !stringMask[index] ? 1 : 0;
        }
        const bodyStats = maskBounds(bodyMask, width, height);
        const stringStats = maskBounds(stringMask, width, height);
        if (!bodyStats || !stringStats) {
          throw new Error("Failed to split bow body and string");
        }
        return {
          bodyImageData: imageDataFromMask(sourceImageData, bodyMask),
          stringImageData: imageDataFromMask(sourceImageData, stringMask),
          bodyStats,
          stringStats,
          size: { width, height },
        };
      }

      function estimateMaterialBackground(imageData) {
        const samples = [];
        const edge = Math.min(24, imageData.width, imageData.height);
        for (let y = 0; y < edge; y += 1) {
          for (let x = 0; x < edge; x += 1) {
            const points = [
              [x, y],
              [imageData.width - 1 - x, y],
              [x, imageData.height - 1 - y],
              [imageData.width - 1 - x, imageData.height - 1 - y],
            ];
            for (const [px, py] of points) {
              const offset = imageDataOffset(imageData, px, py);
              samples.push([imageData.data[offset], imageData.data[offset + 1], imageData.data[offset + 2]]);
            }
          }
        }
        return [0, 1, 2].map((channel) => {
          const sorted = samples.map((sample) => sample[channel]).sort((a, b) => a - b);
          return sorted[Math.floor(sorted.length / 2)] || 255;
        });
      }

      function materialColorDistance(background, r, g, b) {
        const dr = r - background[0];
        const dg = g - background[1];
        const db = b - background[2];
        return Math.sqrt(dr * dr + dg * dg + db * db);
      }

      function createMaterialForegroundMask(imageData) {
        const { width, height, data } = imageData;
        const background = estimateMaterialBackground(imageData);
        const count = width * height;
        const edgeBackground = new Uint8Array(count);
        const candidateBackground = new Uint8Array(count);
        const strongBackground = new Uint8Array(count);
        const queue = [];
        let cursor = 0;

        function backgroundDistance(index) {
          const offset = index * 4;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return materialColorDistance(background, r, g, b);
        }

        function isBackground(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return (
            backgroundDistance(index) <= materialReplacementOptions.backgroundTolerance ||
            (r >= 235 && g >= 232 && b >= 228)
          );
        }

        function isStrongBackground(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return (
            backgroundDistance(index) <= materialReplacementOptions.backgroundTolerance * 0.65 ||
            (r >= 244 && g >= 241 && b >= 238)
          );
        }

        function push(index) {
          if (edgeBackground[index]) return;
          edgeBackground[index] = 1;
          queue.push(index);
        }

        for (let index = 0; index < count; index += 1) {
          candidateBackground[index] = isBackground(index) ? 1 : 0;
          strongBackground[index] = isStrongBackground(index) ? 1 : 0;
        }

        for (let x = 0; x < width; x += 1) {
          const top = x;
          const bottom = (height - 1) * width + x;
          if (candidateBackground[top]) push(top);
          if (candidateBackground[bottom]) push(bottom);
        }
        for (let y = 0; y < height; y += 1) {
          const left = y * width;
          const right = y * width + width - 1;
          if (candidateBackground[left]) push(left);
          if (candidateBackground[right]) push(right);
        }

        while (cursor < queue.length) {
          const index = queue[cursor++];
          const x = index % width;
          const y = Math.floor(index / width);
          const neighbors = [];
          if (x > 0) neighbors.push(index - 1);
          if (x < width - 1) neighbors.push(index + 1);
          if (y > 0) neighbors.push(index - width);
          if (y < height - 1) neighbors.push(index + width);
          for (const neighbor of neighbors) {
            if (!edgeBackground[neighbor] && candidateBackground[neighbor]) {
              push(neighbor);
            }
          }
        }

        let holeBackground = new Uint8Array(count);
        const holeSeen = new Uint8Array(count);
        const minHolePixels = Math.max(24, Math.round(count * 0.00008));
        for (let index = 0; index < count; index += 1) {
          if (!strongBackground[index] || edgeBackground[index] || holeSeen[index]) continue;
          const region = [index];
          holeSeen[index] = 1;
          let touchesEdge = false;
          for (let regionCursor = 0; regionCursor < region.length; regionCursor += 1) {
            const current = region[regionCursor];
            const x = current % width;
            const y = Math.floor(current / width);
            if (x === 0 || y === 0 || x === width - 1 || y === height - 1) touchesEdge = true;
            if (x > 0 && strongBackground[current - 1] && !edgeBackground[current - 1] && !holeSeen[current - 1]) {
              holeSeen[current - 1] = 1;
              region.push(current - 1);
            }
            if (
              x < width - 1 &&
              strongBackground[current + 1] &&
              !edgeBackground[current + 1] &&
              !holeSeen[current + 1]
            ) {
              holeSeen[current + 1] = 1;
              region.push(current + 1);
            }
            if (
              y > 0 &&
              strongBackground[current - width] &&
              !edgeBackground[current - width] &&
              !holeSeen[current - width]
            ) {
              holeSeen[current - width] = 1;
              region.push(current - width);
            }
            if (
              y < height - 1 &&
              strongBackground[current + width] &&
              !edgeBackground[current + width] &&
              !holeSeen[current + width]
            ) {
              holeSeen[current + width] = 1;
              region.push(current + width);
            }
          }
          if (touchesEdge || region.length < minHolePixels) continue;
          region.forEach((pixelIndex) => {
            holeBackground[pixelIndex] = 1;
          });
        }
        if (maskPixelCount(holeBackground)) {
          holeBackground = dilateMask(holeBackground, width, height, 1, candidateBackground);
        }

        const foreground = new Uint8Array(count);
        for (let index = 0; index < count; index += 1) {
          foreground[index] = edgeBackground[index] || holeBackground[index] || data[index * 4 + 3] < 8 ? 0 : 1;
        }
        return foreground;
      }

      function detectMaterialComponents(imageData) {
        const { width, height } = imageData;
        const foreground = createMaterialForegroundMask(imageData);
        const seen = new Uint8Array(width * height);
        const components = [];

        for (let index = 0; index < foreground.length; index += 1) {
          if (!foreground[index] || seen[index]) continue;
          const stack = [index];
          seen[index] = 1;
          let pixels = 0;
          let minX = width;
          let minY = height;
          let maxX = 0;
          let maxY = 0;

          for (let cursor = 0; cursor < stack.length; cursor += 1) {
            const current = stack[cursor];
            const x = current % width;
            const y = Math.floor(current / width);
            pixels += 1;
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
            const neighbors = [];
            if (x > 0) neighbors.push(current - 1);
            if (x < width - 1) neighbors.push(current + 1);
            if (y > 0) neighbors.push(current - width);
            if (y < height - 1) neighbors.push(current + width);
            for (const neighbor of neighbors) {
              if (foreground[neighbor] && !seen[neighbor]) {
                seen[neighbor] = 1;
                stack.push(neighbor);
              }
            }
          }

          if (pixels >= materialReplacementOptions.minPixels) {
            components.push({
              pixels,
              minX,
              minY,
              maxX,
              maxY,
              width: maxX - minX + 1,
              height: maxY - minY + 1,
              cx: (minX + maxX + 1) / 2,
              cy: (minY + maxY + 1) / 2,
            });
          }
        }
        return components.sort((a, b) => b.pixels - a.pixels);
      }

      function matchMaterialReferenceSlots(referenceImageData, referenceComponents) {
        const slots = [];
        const used = new Set();
        for (const spec of materialReplacementSpecs) {
          let best = null;
          let bestScore = Number.POSITIVE_INFINITY;
          for (const component of referenceComponents) {
            if (used.has(component)) continue;
            const widthRatio = Math.abs(component.width - spec.targetWidth) / Math.max(spec.targetWidth, 1);
            const heightRatio = Math.abs(component.height - spec.targetHeight) / Math.max(spec.targetHeight, 1);
            const score = widthRatio + heightRatio;
            if (score < bestScore) {
              best = component;
              bestScore = score;
            }
          }
          if (!best) throw new Error(`Cannot find reference slot for ${spec.id}`);
          used.add(best);
          slots.push({
            ...spec,
            reference: best,
            referenceImageSize: {
              width: referenceImageData.width,
              height: referenceImageData.height,
            },
            normalizedCenter: {
              x: best.cx / referenceImageData.width,
              y: best.cy / referenceImageData.height,
            },
          });
        }
        return slots;
      }

      function matchMaterialInputComponents(inputImageData, inputComponents, slots) {
        const matches = [];
        const scaleX = inputImageData.width / slots[0].referenceImageSize.width;
        const scaleY = inputImageData.height / slots[0].referenceImageSize.height;
        for (const slot of slots) {
          const expected = {
            minX: Math.round(slot.reference.minX * scaleX),
            minY: Math.round(slot.reference.minY * scaleY),
            maxX: Math.round(slot.reference.maxX * scaleX),
            maxY: Math.round(slot.reference.maxY * scaleY),
          };
          expected.width = expected.maxX - expected.minX + 1;
          expected.height = expected.maxY - expected.minY + 1;
          expected.cx = (expected.minX + expected.maxX + 1) / 2;
          expected.cy = (expected.minY + expected.maxY + 1) / 2;

          let best = null;
          let bestScore = Number.POSITIVE_INFINITY;
          for (const component of inputComponents) {
            const cx = component.cx / inputImageData.width;
            const cy = component.cy / inputImageData.height;
            const dx = cx - slot.normalizedCenter.x;
            const dy = cy - slot.normalizedCenter.y;
            const positionScore = Math.sqrt(dx * dx + dy * dy) * 10;
            const sizeScore =
              Math.abs(component.width / inputImageData.width - expected.width / inputImageData.width) +
              Math.abs(component.height / inputImageData.height - expected.height / inputImageData.height);
            const score = positionScore + sizeScore;
            if (score < bestScore) {
              best = component;
              bestScore = score;
            }
          }
          if (!best) throw new Error(`Cannot find input component for ${slot.id}`);

          const tooWide = best.width > expected.width * 1.35;
          const tooTall = best.height > expected.height * 1.35;
          const tooFar =
            Math.abs(best.cx - expected.cx) > expected.width * 0.9 ||
            Math.abs(best.cy - expected.cy) > expected.height * 0.9;
          matches.push({
            slot,
            component: tooWide || tooTall || tooFar ? expected : best,
            mode: tooWide || tooTall || tooFar ? "slot" : "component",
          });
        }
        return matches;
      }

      function extractMaterialPiece(sourceImageData, component, padding) {
        const minX = Math.max(0, component.minX - padding);
        const minY = Math.max(0, component.minY - padding);
        const maxX = Math.min(sourceImageData.width - 1, component.maxX + padding);
        const maxY = Math.min(sourceImageData.height - 1, component.maxY + padding);
        const output = new ImageData(maxX - minX + 1, maxY - minY + 1);
        const foreground = createMaterialForegroundMask(sourceImageData);
        for (let y = minY; y <= maxY; y += 1) {
          for (let x = minX; x <= maxX; x += 1) {
            const sourceIndex = y * sourceImageData.width + x;
            const outputIndex = (y - minY) * output.width + (x - minX);
            const sourceOffset = sourceIndex * 4;
            const outputOffset = outputIndex * 4;
            if (!foreground[sourceIndex]) {
              output.data[outputOffset + 3] = 0;
              continue;
            }
            output.data[outputOffset] = sourceImageData.data[sourceOffset];
            output.data[outputOffset + 1] = sourceImageData.data[sourceOffset + 1];
            output.data[outputOffset + 2] = sourceImageData.data[sourceOffset + 2];
            output.data[outputOffset + 3] = sourceImageData.data[sourceOffset + 3];
          }
        }
        return output;
      }

      function normalizeMaterialPiece(pieceImageData, width, height, padding) {
        if (pieceImageData.width === width && pieceImageData.height === height) return pieceImageData;
        const output = new ImageData(width, height);
        const drawWidth = Math.max(1, width - padding * 2);
        const drawHeight = Math.max(1, height - padding * 2);
        for (let y = 0; y < drawHeight; y += 1) {
          const sourceY = Math.min(pieceImageData.height - 1, Math.floor((y / drawHeight) * pieceImageData.height));
          for (let x = 0; x < drawWidth; x += 1) {
            const sourceX = Math.min(pieceImageData.width - 1, Math.floor((x / drawWidth) * pieceImageData.width));
            const sourceOffset = (sourceY * pieceImageData.width + sourceX) * 4;
            const outputOffset = ((y + padding) * width + (x + padding)) * 4;
            output.data[outputOffset] = pieceImageData.data[sourceOffset];
            output.data[outputOffset + 1] = pieceImageData.data[sourceOffset + 1];
            output.data[outputOffset + 2] = pieceImageData.data[sourceOffset + 2];
            output.data[outputOffset + 3] = pieceImageData.data[sourceOffset + 3];
          }
        }
        return output;
      }

      async function applyMaterialReplacement(file) {
        if (!file) return;
        el.replaceMaterialBtn.disabled = true;
        toast("正在识别素材图...");
        try {
          const [referenceImage, inputImage] = await Promise.all([
            loadImage(materialReferencePath),
            loadFileImage(file),
          ]);
          const referenceImageData = imageToImageData(referenceImage);
          const inputImageData = imageToImageData(inputImage);
          const referenceComponents = detectMaterialComponents(referenceImageData);
          const inputComponents = detectMaterialComponents(inputImageData);
          const slots = matchMaterialReferenceSlots(referenceImageData, referenceComponents);
          const matches = matchMaterialInputComponents(inputImageData, inputComponents, slots);
          for (const match of matches) {
            const extracted = extractMaterialPiece(inputImageData, match.component, materialReplacementOptions.padding);
            const normalized = normalizeMaterialPiece(
              extracted,
              match.slot.targetWidth,
              match.slot.targetHeight,
              materialReplacementOptions.padding,
            );
            warriorImages[match.slot.imageKey] = await imageDataToImage(normalized);
          }
          drawStage();
          toast(`已替换新版关键帧贴图：${matches.length} 个部件`);
        } catch (error) {
          toast(error instanceof Error ? error.message : String(error));
        } finally {
          el.replaceMaterialBtn.disabled = false;
          el.materialInput.value = "";
        }
      }

      function key(nodeId, frame, patch = {}) {
        const node = state?.nodes?.find((item) => item.id === nodeId);
        const base = node || {
          x: 0,
          y: 0,
          rotation: 0,
          length: 80,
          scaleX: 1,
          scaleY: 1,
        };
        return {
          frame,
          x: patch.x ?? base.x,
          y: patch.y ?? base.y,
          rotation: patch.rotation ?? base.rotation,
          length: patch.length ?? base.length,
          scaleX: patch.scaleX ?? base.scaleX,
          scaleY: patch.scaleY ?? base.scaleY,
          visible: patch.visible ?? base.visible !== false,
        };
      }

      function uid(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function uniqueNodeId(baseId) {
        const cleanBase = String(baseId || "node").trim() || "node";
        const used = new Set(state.nodes.map((node) => node.id));
        if (!used.has(cleanBase)) return cleanBase;
        let index = 2;
        while (used.has(`${cleanBase}-${index}`)) index += 1;
        return `${cleanBase}-${index}`;
      }

      function selectedNode() {
        return state.nodes.find((node) => node.id === state.selectedNodeId) || state.nodes[0];
      }

      function attachmentEditNode(node = selectedNode()) {
        if (!node) return null;
        if (node.attachment) return node;
        return (
          state.nodes.find(
            (item) => item.attachment?.segments && item.attachment.chainTo === node.id,
          ) || node
        );
      }

      function attachmentEditContext(node = selectedNode()) {
        const owner = attachmentEditNode(node);
        if (!owner?.attachment) return { owner, lower: false };
        return { owner, lower: owner.id !== node?.id && owner.attachment.chainTo === node?.id };
      }

      function selectedAttachmentView(node = selectedNode()) {
        const context = attachmentEditContext(node);
        if (!context.owner?.attachment) return null;
        return context.lower
          ? { ...context.owner.attachment, ...(context.owner.attachment.lower || {}) }
          : context.owner.attachment;
      }

      function clampFrame(frame) {
        return Math.max(0, Math.min(state.duration, Math.round(frame)));
      }

      function sortedNodes() {
        const result = [];
        const walk = (parentId, depth) => {
          state.nodes
            .filter((node) => node.parentId === parentId)
            .forEach((node) => {
              result.push({ ...node, depth });
              walk(node.id, depth + 1);
            });
        };
        walk(null, 0);
        state.nodes
          .filter((node) => !result.some((item) => item.id === node.id))
          .forEach((node) => result.push({ ...node, depth: 0 }));
        return result;
      }

      function isBindingMode() {
        return state.workspaceMode === "binding";
      }

      function getLocalPose(node, frame = state.currentFrame) {
        const override = ignorePoseOverrides ? null : poseOverrides.get(node.id);
        if (override) return BowRigController.enrichPose(node, { ...node, ...override });
        if (isBindingMode()) return getRestLocalPose(node);
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        if (keys.length === 0) return BowRigController.enrichPose(node, { ...node });
        const exact = keys.find((item) => item.frame === frame);
        if (exact) return BowRigController.enrichPose(node, { ...node, ...exact });
        if (keys.length === 1) return BowRigController.enrichPose(node, { ...node, ...keys[0] });
        const before = [...keys].reverse().find((item) => item.frame < frame);
        const after = keys.find((item) => item.frame > frame);
        if (!before) {
          return BowRigController.enrichPose(node, {
            ...node,
            ...keys[0],
            visible: node.visible !== false,
          });
        }
        if (!after) {
          const start = keys.find((item) => item.frame === 0) || keys[0];
          const loopEndFrame = state.duration + 1;
          const span = Math.max(1, loopEndFrame - before.frame);
          const t = Math.max(0, Math.min(1, (frame - before.frame) / span));
          return interpolateLocalPose(node, before, start, t);
        }
        const arrowPiece = arrowPieceForNode(node);
        const slashFxPiece = slashFxPieceForNode(node);
        const parentChange =
          arrowParentChangeBetweenFrames(arrowPiece, before.frame, after.frame) ||
          slashFxParentChangeBetweenFrames(slashFxPiece, before.frame, after.frame);
        if (parentChange) {
          if (frame < parentChange.frame) {
            return BowRigController.enrichPose(node, { ...node, ...before });
          }
          return BowRigController.enrichPose(node, { ...node, ...after });
        }
        const t = (frame - before.frame) / (after.frame - before.frame);
        return interpolateLocalPose(node, before, after, t);
      }

      function interpolateLocalPose(node, before, after, t) {
        return BowRigController.interpolatePose(node, before, after, t, {
          ...node,
          x: lerp(before.x, after.x, t),
          y: lerp(before.y, after.y, t),
          rotation: lerpAngle(before.rotation, after.rotation, t),
          length: lerp(before.length, after.length, t),
          scaleX: lerp(before.scaleX, after.scaleX, t),
          scaleY: lerp(before.scaleY, after.scaleY, t),
          visible:
            typeof before?.visible === "boolean"
              ? before.visible
              : typeof after?.visible === "boolean"
                ? after.visible
                : node.visible !== false,
        });
      }

      function isNodeVisibleAtFrame(node, frame = state.currentFrame) {
        if (!node) return false;
        if (isBindingMode()) return true;
        const arrowPiece = arrowPieceForNode(node);
        if (arrowPiece) return arrowVisibilityAtFrame(arrowPiece, frame);
        const slashFxPiece = slashFxPieceForNode(node);
        if (slashFxPiece) return slashFxAlphaAtFrame(slashFxPiece, frame) > 0.001;
        return true;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpAngle(a, b, t) {
        let diff = ((b - a + 180) % 360) - 180;
        if (diff < -180) diff += 360;
        return a + diff * t;
      }

      function worldPose(node, frame = state.currentFrame, seen = new Set()) {
        if (seen.has(node.id)) return getLocalPose(node, frame);
        seen.add(node.id);
        const local = getLocalPose(node, frame);
        const effectiveParentId = effectiveParentIdForNode(node, frame);
        if (!effectiveParentId) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const parent = cachedNodeById(effectiveParentId);
        if (!parent) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const p = worldPose(parent, frame, seen);
        const anchor = endPoint(p);
        const worldRotation = p.worldRotation + local.rotation;
        const worldScaleX = p.worldScaleX * local.scaleX;
        const worldScaleY = p.worldScaleY * local.scaleY;
        if (isTempParentBoundArrowCarrier(node, frame)) {
          const gripLocal = arrowGripLocalForPiece(arrowPieceForNode(node));
          if (gripLocal) {
            const gripRad = (worldRotation * Math.PI) / 180;
            const gripOffsetX =
              gripLocal.x * worldScaleX * Math.cos(gripRad) - gripLocal.y * worldScaleY * Math.sin(gripRad);
            const gripOffsetY =
              gripLocal.x * worldScaleX * Math.sin(gripRad) + gripLocal.y * worldScaleY * Math.cos(gripRad);
            return {
              ...local,
              worldX: anchor.x - gripOffsetX,
              worldY: anchor.y - gripOffsetY,
              worldRotation,
              worldScaleX,
              worldScaleY,
            };
          }
        }
        if (isTempParentBoundSlashFxCarrier(node, frame)) {
          const gripLocal = slashFxGripLocalForPiece(slashFxPieceForNode(node));
          if (gripLocal) {
            const gripRad = (worldRotation * Math.PI) / 180;
            const gripOffsetX =
              gripLocal.x * worldScaleX * Math.cos(gripRad) - gripLocal.y * worldScaleY * Math.sin(gripRad);
            const gripOffsetY =
              gripLocal.x * worldScaleX * Math.sin(gripRad) + gripLocal.y * worldScaleY * Math.cos(gripRad);
            return {
              ...local,
              worldX: anchor.x - gripOffsetX,
              worldY: anchor.y - gripOffsetY,
              worldRotation,
              worldScaleX,
              worldScaleY,
            };
          }
        }
        const rad = (p.worldRotation * Math.PI) / 180;
        const px = local.x * p.worldScaleX;
        const py = local.y * p.worldScaleY;
        const rotatedX = px * Math.cos(rad) - py * Math.sin(rad);
        const rotatedY = px * Math.sin(rad) + py * Math.cos(rad);
        return {
          ...local,
          worldX: anchor.x + rotatedX,
          worldY: anchor.y + rotatedY,
          worldRotation,
          worldScaleX,
          worldScaleY,
        };
      }

      function getRestLocalPose(node) {
        if (!node) {
          return {
            x: 0,
            y: 0,
            rotation: 0,
            length: 80,
            scaleX: 1,
            scaleY: 1,
          };
        }
        return { ...node, ...(node.bindPose || {}) };
      }

      function restWorldPose(node, seen = new Set()) {
        if (!node) {
          return {
            x: 0,
            y: 0,
            rotation: 0,
            length: 80,
            scaleX: 1,
            scaleY: 1,
            worldX: 0,
            worldY: 0,
            worldRotation: 0,
            worldScaleX: 1,
            worldScaleY: 1,
          };
        }
        if (seen.has(node.id)) return getRestLocalPose(node);
        seen.add(node.id);
        const local = getRestLocalPose(node);
        if (!node.parentId) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const parent = cachedNodeById(node.parentId);
        if (!parent) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const p = restWorldPose(parent, seen);
        const anchor = endPoint(p);
        const rad = (p.worldRotation * Math.PI) / 180;
        const px = local.x * p.worldScaleX;
        const py = local.y * p.worldScaleY;
        const rotatedX = px * Math.cos(rad) - py * Math.sin(rad);
        const rotatedY = px * Math.sin(rad) + py * Math.cos(rad);
        return {
          ...local,
          worldX: anchor.x + rotatedX,
          worldY: anchor.y + rotatedY,
          worldRotation: p.worldRotation + local.rotation,
          worldScaleX: p.worldScaleX * local.scaleX,
          worldScaleY: p.worldScaleY * local.scaleY,
        };
      }

      function endPoint(pose) {
        const rad = (pose.worldRotation * Math.PI) / 180;
        return {
          x: pose.worldX + Math.cos(rad) * pose.length * pose.worldScaleX,
          y: pose.worldY + Math.sin(rad) * pose.length * pose.worldScaleY,
        };
      }

      function resizeCanvas() {
        const rect = el.stage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        el.stage.width = Math.max(1, Math.floor(rect.width * dpr));
        el.stage.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawStage();
      }

      function drawStage() {
        resetRuntimeCaches();
        const rect = el.stage.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        drawAxes(rect);
        const nodes = sortedNodes();
        drawPreviousKeyGhost(nodes);
        if (state.renderMode === "texture") {
          drawWarriorTextures();
          if (state.showSkeletonOverlay) {
            nodes.forEach((node) => drawParentLink(node));
            nodes.forEach((node) => drawBone(node, node.id === state.selectedNodeId));
          }
          drawSelectedPieceBinding(nodes);
          drawTextureHandles(nodes);
        } else {
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, node.id === state.selectedNodeId));
          drawSelectedPieceBinding(nodes);
        }
        drawBindingToolPreview();
      }

      function drawPreviousKeyGhost(nodes) {
        if (isBindingMode()) return;
        const frame = previousKeyFrameForSelected();
        if (frame === null) return;
        const currentFrame = state.currentFrame;
        const previousAlpha = drawAlphaMultiplier;
        const previousIgnore = ignorePoseOverrides;
        state.currentFrame = frame;
        drawAlphaMultiplier = 0.28;
        ignorePoseOverrides = true;
        ctx.save();
        if (state.renderMode === "texture") {
          drawWarriorTextures();
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, false));
        } else {
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, false));
        }
        ctx.restore();
        ignorePoseOverrides = previousIgnore;
        drawAlphaMultiplier = previousAlpha;
        state.currentFrame = currentFrame;
      }

      function previousKeyFrameForSelected() {
        const node = selectedNode();
        if (!node) return null;
        const currentFrame = Number(state.currentFrame);
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        const previous = [...keys].reverse().find((item) => item.frame < currentFrame - 0.001);
        return previous?.frame ?? null;
      }

      function drawAxes(rect) {
        ctx.save();
        ctx.strokeStyle = "#ffffff10";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, rect.height / 2);
        ctx.lineTo(rect.width, rect.height / 2);
        ctx.moveTo(rect.width / 2, 0);
        ctx.lineTo(rect.width / 2, rect.height);
        ctx.stroke();
        ctx.restore();
      }

      function drawBone(node, active) {
        if (!isNodeVisibleAtFrame(node)) return;
        const pose = worldPose(node);
        const end = endPoint(pose);
        const bowTag = bowDebugLabel(node);
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = node.color;
        if (node.role?.startsWith("bow-string")) ctx.setLineDash([8, 6]);
        ctx.lineWidth = active ? 9 : 6;
        setDrawAlpha(active ? 1 : 0.78);
        ctx.beginPath();
        ctx.moveTo(pose.worldX, pose.worldY);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();

        setDrawAlpha(1);
        ctx.fillStyle = active ? "#ffffff" : node.color;
        ctx.strokeStyle = active ? varColor("--accent-2") : "#00000080";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pose.worldX, pose.worldY, active ? 8 : 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = active ? varColor("--accent-2") : "#ffffff";
        ctx.beginPath();
        ctx.arc(end.x, end.y, active ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#eef2f5";
        ctx.font = "12px sans-serif";
        ctx.fillText(bowTag ? `${node.name} [${bowTag}]` : node.name, pose.worldX + 10, pose.worldY - 8);
        ctx.restore();
      }

      function bowDebugLabel(node) {
        if (!node?.role) return "";
        if (node.role === "bow-center") return "center";
        if (node.role === "bow-upper") return "body-upper";
        if (node.role === "bow-lower") return "body-lower";
        if (node.role === "bow-string-upper") return "string-upper";
        if (node.role === "bow-string-lower") return "string-lower";
        if (node.role === "bow-string-control") return "string-control";
        return "";
      }

      function drawWarriorTextures() {
        const texturedNodes = state.nodes.filter((node) => node.attachment && isNodeVisibleAtFrame(node));
        if (texturedNodes.length === 0) return;
        texturedNodes
          .slice()
          .sort((a, b) => {
            const layerDiff = (a.attachment.layer || 0) - (b.attachment.layer || 0);
            if (layerDiff) return layerDiff;
            return effectiveAttachmentAlpha(a) - effectiveAttachmentAlpha(b);
          })
          .forEach((node) => drawAttachment(node));
      }

      function drawAttachment(node) {
        const attachment = node.attachment;
        const alpha = effectiveAttachmentAlpha(node);
        if (alpha <= 0.001) return;
        if (node.role === "bow-string" && attachment.segments && attachment.chainTo) {
          drawBowStringAttachment(node, attachment, alpha);
          return;
        }
        const image = warriorImages[attachment.image];
        if (!image?.complete) return;
        const pose = worldPose(node);
        if (attachment.fullSkin) {
          if (isBindingMode() && attachment.restPart) {
            drawRestPartImage(image, resolveRestPartTransform(attachment.restPart, false), alpha);
            return;
          }
          drawFullSkinAttachment(attachment, image, alpha);
          return;
        }
        if (attachment.segments && attachment.chainTo) {
          drawSegmentedAttachment(node, attachment, image, alpha);
          return;
        }
        if (attachment.image === "head") {
          drawHeadAttachment(node, attachment, image, alpha);
          return;
        }
        let start = { x: pose.worldX, y: pose.worldY };
        let end = endPoint(pose);
        if (attachment.chainTo) {
          const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
          if (!chainNode) return;
          end = endPoint(worldPose(chainNode));
        }
        if (attachment.reverse) {
          const nextStart = end;
          end = start;
          start = nextStart;
        }
        const length = Math.max(8, distance(start, end) * attachment.lengthScale);
        if (attachment.image === "body" && attachment.hemEnabled) {
          drawBodyWithSpringHem(image, start, end, attachment, length, node.id);
          return;
        }
        drawImageAlong(
          image,
          start,
          end,
          attachment.width,
          length,
          alpha,
          attachment.anchorX,
          attachment.rotationOffset,
          attachment.offsetX,
          attachment.offsetY,
        );
      }

      function drawBodyWithSpringHem(image, start, end, attachment, length, nodeId) {
        const cutRatio = attachment.hemY;
        const sourceCut = Math.round(image.height * cutRatio);
        const seamOverlap = Math.min(4, Math.max(1, attachment.width * 0.04));
        const sourceOverlap = Math.min(6, Math.max(1, Math.round(image.height * 0.02)));
        const topLength = Math.max(1, length * cutRatio + seamOverlap);
        drawImageSliceAlong(
          image,
          start,
          end,
          attachment.width,
          topLength,
          attachment.alpha,
          attachment.anchorX,
          0,
          Math.min(image.height, sourceCut + sourceOverlap),
          attachment.rotationOffset,
          attachment.offsetX,
          attachment.offsetY,
        );
        const hemSourceStart = Math.max(0, sourceCut - sourceOverlap);
        const hemAnchorY = Math.max(0, cutRatio - seamOverlap / length);
        drawSpringCloth(nodeId, image, start, end, attachment, {
            sourceStart: hemSourceStart,
            sourceSize: Math.max(1, image.height - hemSourceStart),
            anchorX: attachment.hemX,
            anchorY: hemAnchorY,
            length: attachment.hemLength,
            angle: attachment.hemAngle,
            width: attachment.width,
            alpha: attachment.alpha,
            drawnLength: length,
          });
      }

      function drawSegmentedAttachment(node, attachment, image, alpha = attachment.alpha) {
        const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
        if (!chainNode) return;
        const lowerAttachment = { ...attachment, ...(attachment.lower || {}) };
        const upperPose = worldPose(node);
        const lowerPose = worldPose(chainNode);
        const shoulder = { x: upperPose.worldX, y: upperPose.worldY };
        const elbow = { x: lowerPose.worldX, y: lowerPose.worldY };
        const hand = endPoint(lowerPose);
        const upperRestPose = restWorldPose(node);
        const lowerRestPose = restWorldPose(chainNode);
        const restShoulder = { x: upperRestPose.worldX, y: upperRestPose.worldY };
        const restElbow = { x: lowerRestPose.worldX, y: lowerRestPose.worldY };
        const restHand = endPoint(lowerRestPose);
        drawSkinnedAttachment(image, [
          {
            sourceY: 0,
            sourceHeight: image.height / 2,
            width: attachment.width,
            anchorX: attachment.anchorX,
            rotationOffset: attachment.rotationOffset,
            offsetX: attachment.offsetX,
            offsetY: attachment.offsetY,
            restStart: restShoulder,
            restEnd: restElbow,
            start: shoulder,
            end: elbow,
          },
          {
            sourceY: image.height / 2,
            sourceHeight: image.height / 2,
            width: lowerAttachment.width,
            anchorX: lowerAttachment.anchorX,
            rotationOffset: lowerAttachment.rotationOffset,
            offsetX: lowerAttachment.offsetX,
            offsetY: lowerAttachment.offsetY,
            restStart: restElbow,
            restEnd: restHand,
            start: elbow,
            end: hand,
          },
        ], alpha);
      }

      function drawBowStringAttachment(node, attachment, alpha = attachment.alpha) {
        const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
        if (!chainNode) return;
        const lowerAttachment = { ...attachment, ...(attachment.lower || {}) };
        const upperPose = worldPose(node);
        const lowerPose = worldPose(chainNode);
        const start = { x: upperPose.worldX, y: upperPose.worldY };
        const middle = { x: lowerPose.worldX, y: lowerPose.worldY };
        const end = endPoint(lowerPose);
        const color = attachment.lineColor || node.color || "#d8d0bf";
        drawBowStringSegment(start, middle, attachment.width, alpha, color);
        drawBowStringSegment(middle, end, lowerAttachment.width || attachment.width, alpha, color);
      }

      function drawBowStringSegment(start, end, width, alpha, color) {
        const stringWidth = Math.max(1.5, Number(width) || 2);
        ctx.save();
        setDrawAlpha(alpha);
        ctx.strokeStyle = color;
        ctx.lineWidth = stringWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.strokeStyle = "#ffffff66";
        ctx.lineWidth = Math.max(0.5, stringWidth * 0.28);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.restore();
      }

      function drawSkinnedAttachment(image, segments, alpha) {
        const cols = 6;
        const rows = 13;
        const source = [];
        const dest = [];
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          const sourceY = image.height * v;
          const segment = sourceY < image.height / 2 ? segments[0] : segments[1];
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            const sourcePoint = {
              x: image.width * u,
              y: sourceY,
            };
            const restPoint = imagePointToSegmentRest(sourcePoint, image, segment, u);
            sourceRow.push(sourcePoint);
            destRow.push(deformByAttachmentSegments(restPoint, segments));
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        drawTexturedMesh(image, source, dest, alpha);
      }

      function resolveRestPartTransform(restPart, useCurrentPose = false) {
        if (!restPart) return null;
        const parentBoneId = restPart.parentBoneId ? String(restPart.parentBoneId) : null;
        if (!parentBoneId) return { ...restPart };
        const parentNode = state.nodes.find((node) => node.id === parentBoneId);
        if (!parentNode) return { ...restPart };
        const parentPose = useCurrentPose ? worldPose(parentNode) : restWorldPose(parentNode);
        const worldPoint = worldFromLocalByParentPose(parentPose, {
          x: restPart.x || 0,
          y: restPart.y || 0,
        });
        return {
          ...restPart,
          x: worldPoint.x,
          y: worldPoint.y,
          rotation: (restPart.rotation || 0) + parentPose.worldRotation,
        };
      }

      function setResolvedRestPartTransform(restPart, patch, useCurrentPose = false) {
        if (!restPart) return null;
        const parentBoneId = restPart.parentBoneId ? String(restPart.parentBoneId) : null;
        if (!parentBoneId) {
          return {
            ...restPart,
            ...(patch.x !== undefined ? { x: patch.x } : {}),
            ...(patch.y !== undefined ? { y: patch.y } : {}),
            ...(patch.scale !== undefined ? { scale: patch.scale } : {}),
            ...(patch.rotation !== undefined ? { rotation: patch.rotation } : {}),
          };
        }
        const parentNode = state.nodes.find((node) => node.id === parentBoneId);
        if (!parentNode) return { ...restPart };
        const parentPose = useCurrentPose ? worldPose(parentNode) : restWorldPose(parentNode);
        const resolved = resolveRestPartTransform(restPart, useCurrentPose);
        const nextWorld = {
          x: patch.x !== undefined ? patch.x : resolved.x,
          y: patch.y !== undefined ? patch.y : resolved.y,
          rotation: patch.rotation !== undefined ? patch.rotation : resolved.rotation,
        };
        const localPoint = localFromWorldByParentPose(parentPose, nextWorld);
        return {
          ...restPart,
          ...(patch.scale !== undefined ? { scale: patch.scale } : {}),
          x: localPoint.x,
          y: localPoint.y,
          rotation: nextWorld.rotation - parentPose.worldRotation,
        };
      }

      function drawFullSkinAttachment(attachment, image, alpha = attachment.alpha) {
        const restPart = resolveRestPartTransform(attachment.restPart, false);
        const segments = (attachment.skinBoneIds || [])
          .map((nodeId) => state.nodes.find((item) => item.id === nodeId))
          .filter(Boolean)
          .map((boneNode) => {
            const pose = worldPose(boneNode);
            const rest = restWorldPose(boneNode);
            return {
              restStart: { x: rest.worldX, y: rest.worldY },
              restEnd: endPoint(rest),
              start: { x: pose.worldX, y: pose.worldY },
              end: endPoint(pose),
            };
          });
        if (!restPart) return;
        if (segments.length === 0) {
          drawRestPartImage(image, restPart, alpha);
