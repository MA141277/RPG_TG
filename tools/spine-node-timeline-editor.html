        const xAxis = fitAxis("sourceX", "worldX");
        const yAxis = fitAxis("sourceY", "worldY");
        if (!xAxis || !yAxis) return null;
        const transform = (sourceX, sourceY) => ({
          x: xAxis.scale * sourceX + xAxis.offset,
          y: yAxis.scale * sourceY + yAxis.offset,
        });
        transform.scaleX = xAxis.scale;
        transform.scaleY = yAxis.scale;
        return transform;
      }

      function identifyCavalryFarLegIndices(horseLegs) {
        if (!Array.isArray(horseLegs) || horseLegs.length !== 4) return [];
        const far = [];
        const rearPair = horseLegs.slice(0, 2);
        const frontPair = horseLegs.slice(2, 4);
        if (rearPair.length === 2) {
          far.push(rearPair[0].width <= rearPair[1].width ? 0 : 1);
        }
        if (frontPair.length === 2) {
          far.push(frontPair[0].width <= frontPair[1].width ? 2 : 3);
        }
        return far;
      }

      function classifyCavalryComponents(inputImageData, components) {
        if (!inputImageData || !Array.isArray(components) || components.length < 8) {
          throw new Error("\u9a91\u5175\u7d20\u6750\u8bc6\u522b\u5931\u8d25\uff1a\u7ec4\u4ef6\u6570\u91cf\u4e0d\u8db3");
        }
        const horseBody = components.reduce((best, component) => (!best || component.minY < best.minY ? component : best), null);
        const remaining = components.filter((component) => component !== horseBody);
        const lowerHalf = remaining.filter((component) => component.cy > inputImageData.height * 0.45);
        const soldierWeapon =
          lowerHalf
            .filter(
              (component) =>
                component.cx > inputImageData.width * 0.72 &&
                component.height / Math.max(1, component.width) > 3,
            )
            .sort((a, b) => b.maxX - a.maxX || b.height - a.height)[0] || null;
        if (!soldierWeapon) throw new Error("\u9a91\u5175\u7d20\u6750\u8bc6\u522b\u5931\u8d25\uff1a\u672a\u627e\u5230\u6b66\u5668\u7ec4\u4ef6");

        const soldierTorso =
          lowerHalf
            .filter((component) => component !== soldierWeapon)
            .sort((a, b) => b.pixels - a.pixels)[0] || null;
        if (!soldierTorso) throw new Error("\u9a91\u5175\u7d20\u6750\u8bc6\u522b\u5931\u8d25\uff1a\u672a\u627e\u5230\u58eb\u5175\u8eaf\u58f3\u7ec4\u4ef6");

        const soldierRightLeg =
          lowerHalf
            .filter(
              (component) =>
                component !== soldierWeapon &&
                component !== soldierTorso &&
                component.cx < soldierTorso.cx &&
                component.minY > soldierTorso.cy,
            )
            .sort((a, b) => b.maxY - a.maxY || b.pixels - a.pixels)[0] || null;
        if (!soldierRightLeg) throw new Error("\u9a91\u5175\u7d20\u6750\u8bc6\u522b\u5931\u8d25\uff1a\u672a\u627e\u5230\u58eb\u5175\u53f3\u817f\u7ec4\u4ef6");

        const soldierRightArm =
          remaining
            .filter(
              (component) =>
                component !== soldierWeapon &&
                component !== soldierTorso &&
                component !== soldierRightLeg &&
                component.cx < soldierTorso.cx &&
                component.cy > horseBody.maxY &&
                component.cy < soldierTorso.cy,
            )
            .sort((a, b) => b.pixels - a.pixels)[0] || null;
        if (!soldierRightArm) throw new Error("\u9a91\u5175\u7d20\u6750\u8bc6\u522b\u5931\u8d25\uff1a\u672a\u627e\u5230\u58eb\u5175\u53f3\u81c2\u7ec4\u4ef6");

        const horseLegs = remaining
          .filter(
            (component) =>
              component !== soldierWeapon &&
              component !== soldierTorso &&
              component !== soldierRightLeg &&
              component !== soldierRightArm,
          )
          .sort((a, b) => a.cx - b.cx);
        if (horseLegs.length !== 4) {
          throw new Error(`\u9a91\u5175\u7d20\u6750\u8bc6\u522b\u5931\u8d25\uff1a\u9a6c\u817f\u7ec4\u4ef6\u6570\u91cf\u5f02\u5e38\uff08${horseLegs.length}\uff09`);
        }

        return {
          horseBody,
          horseLegs,
          horseFarLegIndices: identifyCavalryFarLegIndices(horseLegs),
          soldierTorso,
          soldierRightArm,
          soldierRightLeg,
          soldierWeapon,
        };
      }

      function createCavalryImageToWorldTransform(imageWidth, imageHeight) {
        const maxWidth = 760;
        const maxHeight = 620;
        const scale = Math.min(maxWidth / Math.max(1, imageWidth), maxHeight / Math.max(1, imageHeight));
        const offsetX = 420 - (imageWidth * scale) / 2;
        const offsetY = 24;
        return {
          scale,
          offsetX,
          offsetY,
          toWorld(x, y) {
            return {
              x: offsetX + x * scale,
              y: offsetY + y * scale,
            };
          },
        };
      }

      function snapGeneratedChildrenToParentsPreserveDirection(nodes) {
        if (!Array.isArray(nodes) || !nodes.length) return nodes;
        const nodeById = new Map(nodes.map((node) => [node.id, node]));
        const worldCache = new Map();
        const attachmentLocalCache = new Map();

        const computeWorldPose = (node, seen = new Set()) => {
          if (!node?.id) return null;
          if (worldCache.has(node.id)) return worldCache.get(node.id);
        const local = {
          x: Number(node.x) || 0,
          y: Number(node.y) || 0,
          rotation: Number(node.rotation) || 0,
          length: Math.max(4, Number(node.length) || 80),
          scaleX: Math.max(0.05, Number(node.scaleX) || 1),
          scaleY: Math.max(0.05, Number(node.scaleY) || 1),
          };
          if (seen.has(node.id) || !node.parentId) {
            const rootPose = {
              ...local,
              worldX: local.x,
              worldY: local.y,
              worldRotation: local.rotation,
              worldScaleX: local.scaleX,
              worldScaleY: local.scaleY,
            };
            worldCache.set(node.id, rootPose);
            return rootPose;
          }
          seen.add(node.id);
          const parent = nodeById.get(node.parentId);
          const parentPose = parent ? computeWorldPose(parent, seen) : null;
        if (!parentPose) {
            const fallbackPose = {
              ...local,
              worldX: local.x,
              worldY: local.y,
              worldRotation: local.rotation,
              worldScaleX: local.scaleX,
              worldScaleY: local.scaleY,
            };
            worldCache.set(node.id, fallbackPose);
            return fallbackPose;
          }
          const parentRad = (parentPose.worldRotation * Math.PI) / 180;
          const anchor = {
            x: parentPose.worldX + Math.cos(parentRad) * parentPose.length * parentPose.worldScaleX,
            y: parentPose.worldY + Math.sin(parentRad) * parentPose.length * parentPose.worldScaleY,
          };
          const px = local.x * parentPose.worldScaleX;
          const py = local.y * parentPose.worldScaleY;
          const pose = {
            ...local,
            worldX: anchor.x + px * Math.cos(parentRad) - py * Math.sin(parentRad),
            worldY: anchor.y + px * Math.sin(parentRad) + py * Math.cos(parentRad),
            worldRotation: parentPose.worldRotation + local.rotation,
            worldScaleX: parentPose.worldScaleX * local.scaleX,
            worldScaleY: parentPose.worldScaleY * local.scaleY,
          };
          worldCache.set(node.id, pose);
          return pose;
        };

        const endPointForPose = (pose) => {
          const rad = (pose.worldRotation * Math.PI) / 180;
          return {
          x: pose.worldX + Math.cos(rad) * pose.length * pose.worldScaleX,
          y: pose.worldY + Math.sin(rad) * pose.length * pose.worldScaleY,
          };
        };

        const resolveRestPartWorld = (restPart) => {
          if (!restPart) return null;
          const parentBoneId = restPart.parentBoneId ? String(restPart.parentBoneId) : null;
        if (!parentBoneId) {
            return {
              x: Number(restPart.x) || 0,
              y: Number(restPart.y) || 0,
              rotation: Number(restPart.rotation) || 0,
            };
          }
          const parentNode = nodeById.get(parentBoneId);
          const parentPose = parentNode ? computeWorldPose(parentNode) : null;
        if (!parentPose) {
            return {
              x: Number(restPart.x) || 0,
              y: Number(restPart.y) || 0,
              rotation: Number(restPart.rotation) || 0,
            };
          }
          const anchor = endPointForPose(parentPose);
          const rad = (parentPose.worldRotation * Math.PI) / 180;
          const localX = Number(restPart.x) || 0;
          const localY = Number(restPart.y) || 0;
          return {
            x: anchor.x + localX * Math.cos(rad) - localY * Math.sin(rad),
            y: anchor.y + localX * Math.sin(rad) + localY * Math.cos(rad),
            rotation: (Number(restPart.rotation) || 0) + parentPose.worldRotation,
          };
        };

        const localFromWorldByParentPose = (parentPose, world) => {
          const anchor = endPointForPose(parentPose);
          const dx = (Number(world?.x) || 0) - anchor.x;
          const dy = (Number(world?.y) || 0) - anchor.y;
        const rad = (-parentPose.worldRotation * Math.PI) / 180;
          return {
          x: (dx * Math.cos(rad) - dy * Math.sin(rad)) / (parentPose.worldScaleX || 1),
          y: (dx * Math.sin(rad) + dy * Math.cos(rad)) / (parentPose.worldScaleY || 1),
            rotation: (Number(world?.rotation) || 0) - parentPose.worldRotation,
          };
        };

        nodes.forEach((node) => computeWorldPose(node));
        nodes.forEach((node) => {
        const attachment = node?.attachment;
          const restPart = attachment?.restPart;
          const skinBoneIds = Array.isArray(attachment?.skinBoneIds) ? attachment.skinBoneIds : [];
          const targetParentBoneId = restPart?.parentBoneId || skinBoneIds[0] || null;
          if (!attachment?.fullSkin || !restPart || !targetParentBoneId) return;
          const parentNode = nodeById.get(String(targetParentBoneId));
          const parentPose = parentNode ? computeWorldPose(parentNode) : null;
          const restWorld = resolveRestPartWorld(restPart);
          if (!parentPose || !restWorld) return;
          attachmentLocalCache.set(node.id, {
            parentBoneId: String(targetParentBoneId),
            local: localFromWorldByParentPose(parentPose, restWorld),
          });
        });
        nodes.forEach((node) => {
          if (!node?.parentId) {
            node.bindPose = normalizeBindPose(node.bindPose || node);
            return;
          }
          if (node.preserveParentOffset) {
            node.bindPose = normalizeBindPose({
              ...(node.bindPose || node),
          x: Number(node.x) || 0,
          y: Number(node.y) || 0,
          rotation: Number(node.rotation) || 0,
              length: node.length,
              scaleX: node.scaleX,
              scaleY: node.scaleY,
            });
            return;
          }
          const pose = worldCache.get(node.id);
          const parentPose = worldCache.get(node.parentId);
          if (!pose || !parentPose) return;
            node.x = 0;
            node.y = 0;
          node.rotation = pose.worldRotation - parentPose.worldRotation;
          node.scaleX = (pose.worldScaleX || 1) / (parentPose.worldScaleX || 1);
          node.scaleY = (pose.worldScaleY || 1) / (parentPose.worldScaleY || 1);
          node.bindPose = normalizeBindPose({
            ...(node.bindPose || node),
            x: node.x,
            y: node.y,
            rotation: node.rotation,
            length: node.length,
            scaleX: node.scaleX,
            scaleY: node.scaleY,
          });
        });
        worldCache.clear();
        nodes.forEach((node) => computeWorldPose(node));
        nodes.forEach((node) => {
        const attachment = node?.attachment;
          const restPart = attachment?.restPart;
          const snapshot = attachmentLocalCache.get(node.id);
          if (!attachment?.fullSkin || !restPart || !snapshot) return;
          const parentNode = nodeById.get(snapshot.parentBoneId);
          const parentPose = parentNode ? computeWorldPose(parentNode) : null;
          if (!parentPose) return;
          restPart.parentBoneId = snapshot.parentBoneId;
          restPart.x = snapshot.local.x;
          restPart.y = snapshot.local.y;
          restPart.rotation = snapshot.local.rotation;
        });
        return nodes;
      }

      function componentPoint(component, nx, ny) {
        return {
          x: component.minX + component.width * nx,
          y: component.minY + component.height * ny,
        };
      }

      function computeImportedFullSkinScale(width, height, worldScale) {
        const currentMax = Math.max(1, Number(width) || 1, Number(height) || 1);
        const safeWorldScale = Math.max(0.001, Number(worldScale) || 1);
        const displayedMax = currentMax * safeWorldScale;
        const targetMax = Math.max(192, Math.min(768, Math.round(displayedMax * 3)));
        if (currentMax <= targetMax) {
          return {
            scaled: false,
            imageScale: 1,
            renderScaleMultiplier: 1,
            targetWidth: Math.max(1, Math.round(width)),
            targetHeight: Math.max(1, Math.round(height)),
          };
        }
        const imageScale = targetMax / currentMax;
        return {
          scaled: true,
          imageScale,
          renderScaleMultiplier: 1 / imageScale,
          targetWidth: Math.max(1, Math.round(width * imageScale)),
          targetHeight: Math.max(1, Math.round(height * imageScale)),
        };
      }

      function resizeImageData(imageData, targetWidth, targetHeight) {
        if (!imageData) return imageData;
        const nextWidth = Math.max(1, Math.round(targetWidth));
        const nextHeight = Math.max(1, Math.round(targetHeight));
        if (imageData.width === nextWidth && imageData.height === nextHeight) return imageData;

        const sourceCanvas = document.createElement("canvas");
        sourceCanvas.width = imageData.width;
        sourceCanvas.height = imageData.height;
        const sourceCtx = sourceCanvas.getContext("2d");
        sourceCtx.putImageData(imageData, 0, 0);

        const outputCanvas = document.createElement("canvas");
        outputCanvas.width = nextWidth;
        outputCanvas.height = nextHeight;
        const outputCtx = outputCanvas.getContext("2d");
        outputCtx.imageSmoothingEnabled = true;
        outputCtx.imageSmoothingQuality = "high";
        outputCtx.drawImage(sourceCanvas, 0, 0, nextWidth, nextHeight);
        return outputCtx.getImageData(0, 0, nextWidth, nextHeight);
      }

      function optimizeCavalryFullSkinImage(imageData, worldScale) {
        const scale = computeImportedFullSkinScale(imageData.width, imageData.height, worldScale);
        if (!scale.scaled) {
          return {
            imageData,
            renderScaleMultiplier: 1,
          };
        }
        return {
          imageData: resizeImageData(imageData, scale.targetWidth, scale.targetHeight),
          renderScaleMultiplier: scale.renderScaleMultiplier,
        };
      }

      function scaleGeneratedCavalryHorse(nodes, factor = 1.5) {
        if (!Array.isArray(nodes) || !Number.isFinite(Number(factor)) || Number(factor) === 1) return nodes;
        const scale = Number(factor);
        const horseNodeIds = new Set(
          nodes.filter((node) => String(node?.role || "").startsWith("cavalry-horse")).map((node) => node.id),
        );
        nodes.forEach((node) => {
          if (!node) return;
          const isHorseNode = horseNodeIds.has(node.id);
          const followsHorseParent = !isHorseNode && horseNodeIds.has(node.parentId) && !node.attachment;
          if (isHorseNode || followsHorseParent) {
            if (node.parentId) {
              node.x = (Number(node.x) || 0) * scale;
              node.y = (Number(node.y) || 0) * scale;
            }
            if (isHorseNode) {
              node.length = Math.max(4, (Number(node.length) || 0) * scale);
            }
            if (node.bindPose) {
              if (node.parentId) {
                node.bindPose.x = (Number(node.bindPose.x) || 0) * scale;
                node.bindPose.y = (Number(node.bindPose.y) || 0) * scale;
              }
              if (isHorseNode) {
                node.bindPose.length = Math.max(4, (Number(node.bindPose.length) || 0) * scale);
              }
            }
          }
          if (!isHorseNode || !node.attachment?.fullSkin || !node.attachment.restPart) return;
          const restPart = node.attachment.restPart;
          if (horseNodeIds.has(restPart.parentBoneId)) {
            restPart.x = (Number(restPart.x) || 0) * scale;
            restPart.y = (Number(restPart.y) || 0) * scale;
          }
          restPart.scale = Math.max(0.001, (Number(restPart.scale) || 1) * scale);
        });
        return nodes;
      }

      function alignGeneratedCavalryFrontLegs(horseLegPieces, horseLegUpperBones, horseLegComponents, transform) {
        if (!Array.isArray(horseLegPieces) || !Array.isArray(horseLegUpperBones) || !Array.isArray(horseLegComponents)) {
          return;
        }
        if (horseLegPieces.length < 4 || horseLegUpperBones.length < 4 || horseLegComponents.length < 4) {
          return;
        }
        const referenceBottom = Math.max(
          Number(horseLegComponents[0]?.maxY) || 0,
          Number(horseLegComponents[1]?.maxY) || 0,
        );
        const worldScale = Number(transform?.scale) || 1;
        [2, 3].forEach((index) => {
          const component = horseLegComponents[index];
          const piece = horseLegPieces[index];
          const upper = horseLegUpperBones[index];
          if (!component || !piece || !upper) return;
          const deltaPixels = referenceBottom - (Number(component.maxY) || 0);
          if (deltaPixels <= 0) return;
          const deltaWorld = deltaPixels * worldScale;
          piece.y = (Number(piece.y) || 0) + deltaWorld;
          if (piece.bindPose) {
            piece.bindPose.y = (Number(piece.bindPose.y) || 0) + deltaWorld;
          }
          if (piece.attachment?.restPart) {
            piece.attachment.restPart.y = (Number(piece.attachment.restPart.y) || 0) + deltaWorld;
          }
          upper.length = Math.max(4, (Number(upper.length) || 0) + deltaWorld);
          if (upper.bindPose) {
            upper.bindPose.length = Math.max(4, (Number(upper.bindPose.length) || 0) + deltaWorld);
          }
        });
      }

      function adjustGeneratedCavalryRearLegTwo(horseLegPieces, horseLegUpperBones, factor = 0.8) {
        if (!Array.isArray(horseLegPieces) || !Array.isArray(horseLegUpperBones)) return;
        if (horseLegPieces.length < 2 || horseLegUpperBones.length < 2) return;
        const piece = horseLegPieces[1];
        const upper = horseLegUpperBones[1];
        if (!piece || !upper) return;
        const nextFactor = Number(factor);
        if (!Number.isFinite(nextFactor) || nextFactor <= 0 || nextFactor >= 1) return;
        const currentLength = Number(upper.length) || 0;
        const nextLength = Math.max(4, currentLength * nextFactor);
        const delta = currentLength - nextLength;
        upper.length = nextLength;
        if (upper.bindPose) {
          upper.bindPose.length = nextLength;
        }
        piece.y = (Number(piece.y) || 0) - delta;
        if (piece.bindPose) {
          piece.bindPose.y = (Number(piece.bindPose.y) || 0) - delta;
        }
        if (piece.attachment?.restPart) {
          piece.attachment.restPart.y = (Number(piece.attachment.restPart.y) || 0) - delta;
        }
      }

      function splitCavalryHorseBodyComponent(component, imageWidth) {
        if (!component || !Array.isArray(component.pixelIndices) || component.pixelIndices.length < 2) {
          return {
            body: component,
            neckHead: null,
          };
        }
        const safeImageWidth = Math.max(1, Number(imageWidth) || 1);
        const safeWidth = Math.max(1, Number(component.width) || (Number(component.maxX) - Number(component.minX) + 1) || 1);
        const safeHeight = Math.max(1, Number(component.height) || (Number(component.maxY) - Number(component.minY) + 1) || 1);
        const buildComponent = (pixelIndices) => {
          if (!Array.isArray(pixelIndices) || !pixelIndices.length) return null;
          let minX = Number.POSITIVE_INFINITY;
          let minY = Number.POSITIVE_INFINITY;
          let maxX = Number.NEGATIVE_INFINITY;
          let maxY = Number.NEGATIVE_INFINITY;
          pixelIndices.forEach((sourceIndex) => {
            const x = sourceIndex % safeImageWidth;
            const y = Math.floor(sourceIndex / safeImageWidth);
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          });
          return {
            pixels: pixelIndices.length,
            minX,
            minY,
            maxX,
            maxY,
            width: maxX - minX + 1,
            height: maxY - minY + 1,
              cx: (minX + maxX + 1) / 2,
              cy: (minY + maxY + 1) / 2,
            pixelIndices: pixelIndices.slice(),
          };
        };
        const neckHeadPixels = [];
        const diagonalThreshold = Math.round(Math.max(1, Math.min(safeWidth - 1, safeHeight - 1) * 0.27));
        component.pixelIndices.forEach((sourceIndex) => {
          const x = sourceIndex % safeImageWidth;
          const y = Math.floor(sourceIndex / safeImageWidth);
          const localX = x - component.minX;
          const localY = y - component.minY;
          const isNeckHeadRegion = localX - localY >= diagonalThreshold;
          if (isNeckHeadRegion) {
            neckHeadPixels.push(sourceIndex);
          }
        });
        if (neckHeadPixels.length < 32) {
          return {
            body: component,
            neckHead: null,
          };
        }
        return {
          body: component,
          neckHead: buildComponent(neckHeadPixels),
        };
      }

      function buildGeneratedSoldierUpperBodyFromMaterial({
        addBone,
        addPiece,
        registerComponentImage,
        parts,
        transform,
        mountParentId,
      }) {
        const soldierTorsoImageId = registerComponentImage("soldier-torso", parts.soldierTorso);
        const soldierRightArmImageId = registerComponentImage("soldier-right-arm", parts.soldierRightArm);

        const soldierSpine1 = addBone("\u58eb\u5175\u810a\u690e 1", mountParentId, componentPoint(parts.soldierTorso, 0.46, 0.77), componentPoint(parts.soldierTorso, 0.49, 0.23), "#556e8a", "cavalry-soldier-spine");
        const soldierSpine2 = addBone("\u58eb\u5175\u810a\u690e 2", soldierSpine1.id, componentPoint(parts.soldierTorso, 0.47, 0.59), componentPoint(parts.soldierTorso, 0.5027, 0.3117), "#556e8a", "cavalry-soldier-spine");
        const soldierSpine3 = addBone("\u58eb\u5175\u810a\u690e 3", soldierSpine2.id, componentPoint(parts.soldierTorso, 0.49, 0.42), componentPoint(parts.soldierTorso, 0.525, 0.168), "#556e8a", "cavalry-soldier-spine");
        const soldierRightShoulder = addBone("\u58eb\u5175\u53f3\u80a9", soldierSpine2.id, componentPoint(parts.soldierTorso, 0.36, 0.25), componentPoint(parts.soldierTorso, 0.08, 0.21), "#556e8a", "cavalry-soldier-shoulder");
        const soldierLeftShoulder = addBone("\u58eb\u5175\u5de6\u80a9", soldierSpine2.id, componentPoint(parts.soldierTorso, 0.62, 0.25), componentPoint(parts.soldierTorso, 0.90, 0.21), "#556e8a", "cavalry-soldier-shoulder");

        const soldierTorsoPiece = addPiece("\u58eb\u5175\u8eaf\u58f3", "cavalry-soldier-torso-piece", soldierTorsoImageId, parts.soldierTorso, 80, [
          soldierSpine1.id,
          soldierSpine2.id,
          soldierSpine3.id,
          soldierRightShoulder.id,
          soldierLeftShoulder.id,
        ]);
        const soldierTorsoLift = parts.soldierTorso.height * transform.scale * 0.36;
        soldierTorsoPiece.y -= soldierTorsoLift;
        soldierTorsoPiece.bindPose.y -= soldierTorsoLift;
        soldierTorsoPiece.attachment.restPart.y -= soldierTorsoLift;

        const soldierRightArm1 = addBone("\u58eb\u5175\u53f3\u81c2 1", soldierRightShoulder.id, componentPoint(parts.soldierRightArm, 0.82, 0.08), componentPoint(parts.soldierRightArm, 0.58, 0.48), "#556e8a", "cavalry-soldier-right-arm");
        const soldierRightArm2 = addBone("\u58eb\u5175\u53f3\u81c2 2", soldierRightArm1.id, componentPoint(parts.soldierRightArm, 0.58, 0.48), componentPoint(parts.soldierRightArm, 0.49, 0.96), "#556e8a", "cavalry-soldier-right-arm");
        const soldierRightArmPiece = addPiece("\u58eb\u5175\u53f3\u81c2", "cavalry-soldier-right-arm-piece", soldierRightArmImageId, parts.soldierRightArm, 90, [
          soldierRightArm1.id,
          soldierRightArm2.id,
        ]);

        return {
          soldierSpine1,
          soldierSpine2,
          soldierSpine3,
          soldierRightShoulder,
          soldierLeftShoulder,
          soldierTorsoPiece,
          soldierRightArm1,
          soldierRightArm2,
          soldierRightArmPiece,
        };
      }

      function buildCavalryProjectFromMaterial(inputImageData, fileName = "cavalry.png") {
        const padding = materialReplacementOptions.padding;
        const components = detectMaterialComponents(inputImageData, 500);
        const parts = classifyCavalryComponents(inputImageData, components);
        const transform = createCavalryImageToWorldTransform(inputImageData.width, inputImageData.height);
        const nodes = [];
        const timelines = {};
        const customImages = {};
        const imageMeta = new Map();
        const worldInfo = new Map();
        let nodeCounter = 0;

        const nextId = (prefix) => `${prefix}-${String(nodeCounter += 1).padStart(3, "0")}`;
        const componentTopLeftWorld = (component) =>
          transform.toWorld(Math.max(0, component.minX - padding), Math.max(0, component.minY - padding));

        const addTimeline = (id) => {
          timelines[id] = [];
        };

        const registerComponentImage = (name, component) => {
          const imageData = extractMaterialPiece(inputImageData, component, padding);
          const optimized = optimizeCavalryFullSkinImage(imageData, transform.scale);
          const imageId = `${customImagePrefix}cavalry-${name}-${nextId("img")}`;
          customImages[imageId] = {
            name: `${fileName.replace(/\.[^.]+$/, "")}-${name}.png`,
            src: imageDataToDataUrl(optimized.imageData),
          };
          imageMeta.set(imageId, {
            width: optimized.imageData.width,
            height: optimized.imageData.height,
            renderScaleMultiplier: optimized.renderScaleMultiplier,
          });
          return imageId;
        };

        const addBone = (name, parentId, startSource, endSource, color, role) => {
          const id = nextId("bone");
          const startWorld = transform.toWorld(startSource.x, startSource.y);
          const endWorld = transform.toWorld(endSource.x, endSource.y);
          const worldRotation = (Math.atan2(endWorld.y - startWorld.y, endWorld.x - startWorld.x) * 180) / Math.PI;
          let localX = startWorld.x;
          let localY = startWorld.y;
          let rotation = worldRotation;
          if (parentId) {
            const parent = worldInfo.get(parentId);
            const anchor = parent.end;
            const dx = startWorld.x - anchor.x;
            const dy = startWorld.y - anchor.y;
            const rad = (-parent.rotation * Math.PI) / 180;
            localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            localY = dx * Math.sin(rad) + dy * Math.cos(rad);
            rotation = worldRotation - parent.rotation;
          }
          const length = Math.max(4, Math.hypot(endWorld.x - startWorld.x, endWorld.y - startWorld.y));
          const node = {
            id,
            name,
            parentId,
            x: localX,
            y: localY,
            rotation,
            length,
            scaleX: 1,
            scaleY: 1,
            color,
            visible: true,
            role,
            bindPose: {
              x: localX,
              y: localY,
              rotation,
              length,
              scaleX: 1,
              scaleY: 1,
            },
            attachment: null,
          };
          nodes.push(node);
          addTimeline(id);
          worldInfo.set(id, {
            start: startWorld,
            end: endWorld,
            rotation: worldRotation,
          });
          return node;
        };

        const addPiece = (name, role, imageId, component, layer, skinBoneIds) => {
          const id = nextId("piece");
          const image = imageMeta.get(imageId);
          const topLeft = componentTopLeftWorld(component);
          const node = {
            id,
            name,
            parentId: null,
            x: topLeft.x,
            y: topLeft.y,
            rotation: 0,
            length: 4,
            scaleX: 1,
            scaleY: 1,
            color: "#8bd17c",
            visible: true,
            role,
            bindPose: {
              x: topLeft.x,
              y: topLeft.y,
              rotation: 0,
              length: 4,
              scaleX: 1,
              scaleY: 1,
            },
            attachment: normalizeAttachment({
              image: imageId,
              width: image.width,
              alpha: 1,
              layer,
              meshCols: 6,
              meshRows: 18,
              fullSkin: true,
              skinBoneIds,
              restPart: {
                partId: id,
                x: topLeft.x,
                y: topLeft.y,
                scale: transform.scale * (image.renderScaleMultiplier || 1),
                rotation: 0,
                parentBoneId: null,
                anchorX: 0,
                anchorY: 0,
              },
            }),
          };
          nodes.push(node);
          addTimeline(id);
          return node;
        };

        const { body: horseBodyComponent, neckHead: horseNeckHeadComponent } = splitCavalryHorseBodyComponent(parts.horseBody, inputImageData.width);
        const horseBodyImageId = registerComponentImage("horse-body", horseBodyComponent);
        const horseNeckHeadImageId = horseNeckHeadComponent ? registerComponentImage("horse-neck-head", horseNeckHeadComponent) : null;
        const horseLegImageIds = parts.horseLegs.map((component, index) => registerComponentImage(`horse-leg-${index + 1}`, component));
        const soldierRightLegImageId = registerComponentImage("soldier-right-leg", parts.soldierRightLeg);
        const soldierWeaponImageId = registerComponentImage("soldier-weapon", parts.soldierWeapon);

        const horseBody1LeftAnchor = addBone("\u9a6c\u8eab 1 \u5de6\u951a\u70b9", null, componentPoint(parts.horseBody, 0.16, 0.62), componentPoint(parts.horseBody, 0.18, 0.62), "#8b6a45", "cavalry-horse-anchor");
        const horseBody1 = addBone("\u9a6c\u8eab 1", horseBody1LeftAnchor.id, componentPoint(parts.horseBody, 0.18, 0.62), componentPoint(parts.horseBody, 0.28, 0.61), "#8b6a45", "cavalry-horse-body");
        const horseBody2 = addBone("\u9a6c\u8eab 2", horseBody1.id, componentPoint(parts.horseBody, 0.28, 0.61), componentPoint(parts.horseBody, 0.58, 0.58), "#8b6a45", "cavalry-horse-body");
        const horseBody3 = addBone("\u9a6c\u8eab 3", horseBody2.id, componentPoint(parts.horseBody, 0.58, 0.58), componentPoint(parts.horseBody, 0.65, 0.54), "#8b6a45", "cavalry-horse-body");
        const horseNeck1 = addBone("\u9a6c\u8116\u5b50 1", horseBody3.id, componentPoint(parts.horseBody, 0.65, 0.54), componentPoint(parts.horseBody, 0.81, 0.36), "#8b6a45", "cavalry-horse-neck");
        const horseNeck2 = addBone("\u9a6c\u8116\u5b50 2", horseNeck1.id, componentPoint(parts.horseBody, 0.81, 0.36), componentPoint(parts.horseBody, 0.82, 0.22), "#8b6a45", "cavalry-horse-neck");
        const horseHead1 = addBone("\u9a6c\u5934 1", horseNeck2.id, componentPoint(parts.horseBody, 0.82, 0.22), componentPoint(parts.horseBody, 0.97, 0.29), "#8b6a45", "cavalry-horse-head");
        horseBody1LeftAnchor.visible = false;
        const addHorseContourAnchor = (name, parentNode, startNx, startNy, endNx, endNy) => {
          const anchor = addBone(
            name,
            parentNode.id,
            componentPoint(parts.horseBody, startNx, startNy),
            componentPoint(parts.horseBody, endNx, endNy),
            "#8b6a45",
            "cavalry-horse-head-anchor",
          );
          anchor.visible = false;
          anchor.preserveParentOffset = true;
          return anchor;
        };
        const horseHeadContourBones = [
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 1", horseNeck1, 0.70, 0.44, 0.75, 0.39),
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 2", horseNeck1, 0.73, 0.52, 0.79, 0.46),
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 3", horseNeck2, 0.79, 0.31, 0.83, 0.23),
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 4", horseHead1, 0.84, 0.19, 0.89, 0.18),
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 5", horseHead1, 0.87, 0.34, 0.92, 0.37),
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 6", horseHead1, 0.91, 0.24, 0.97, 0.22),
          addHorseContourAnchor("\u9a6c\u5934\u8f6e\u5ed3 7", horseHead1, 0.91, 0.33, 0.97, 0.31),
        ];
        const sharedHorseHeadSkinBoneIds = [
          horseBody1.id,
          horseBody2.id,
          horseBody3.id,
          horseNeck1.id,
          horseNeck2.id,
          horseHead1.id,
          ...horseHeadContourBones.map((bone) => bone.id),
        ];
        const horseBodyPiece = addPiece("\u9a6c\u8eab", "cavalry-horse-piece", horseBodyImageId, horseBodyComponent, 30, sharedHorseHeadSkinBoneIds);
        horseBodyPiece.attachment.meshCols = 6;
        horseBodyPiece.attachment.meshRows = 18;
        if (horseNeckHeadImageId && horseNeckHeadComponent) {
          const horseNeckHeadPiece = addPiece(
            "\u9a6c\u8116\u5b50\u5230\u9a6c\u5934",
            "cavalry-horse-neck-piece",
            horseNeckHeadImageId,
            horseNeckHeadComponent,
            85,
            sharedHorseHeadSkinBoneIds,
          );
          horseNeckHeadPiece.attachment.meshCols = 5;
          horseNeckHeadPiece.attachment.meshRows = 14;
        }

        const horseBody2CenterMount = addBone("\u9a6c\u8eab 2 \u4e2d\u5fc3\u8282\u70b9", horseBody2.id, componentPoint(parts.horseBody, 0.43, 0.595), componentPoint(parts.horseBody, 0.4301, 0.595), "#8b6a45", "cavalry-horse-mount");
        horseBody2CenterMount.preserveParentOffset = true;
        const horseLegRoots = [horseBody1LeftAnchor.id, horseBody1.id, horseBody2.id, horseBody3.id];
        const horseLegUpperBones = [];
        const horseLegPieces = parts.horseLegs.map((component, index) => {
          const bend = index < 2 ? -1 : 1;
          const upper = addBone(`\u9a6c\u817f ${index + 1}-\u5927\u817f`, horseLegRoots[index], componentPoint(component, 0.5, 0.04), componentPoint(component, 0.5 + bend * 0.08, 0.42), "#7c6040", "cavalry-horse-leg");
          horseLegUpperBones.push(upper);
          const lower = addBone(`\u9a6c\u817f ${index + 1}-\u5c0f\u817f`, upper.id, componentPoint(component, 0.5 + bend * 0.08, 0.42), componentPoint(component, 0.5 + bend * 0.04, 0.78), "#7c6040", "cavalry-horse-leg");
          const hoof = addBone(`\u9a6c\u817f ${index + 1}-\u9a6c\u8e44`, lower.id, componentPoint(component, 0.5 + bend * 0.04, 0.78), componentPoint(component, 0.5, 0.98), "#7c6040", "cavalry-horse-hoof");
          const layer = parts.horseFarLegIndices.includes(index) ? 20 : 40;
          return addPiece(`\u9a6c\u817f ${index + 1}`, "cavalry-horse-leg-piece", horseLegImageIds[index], component, layer, [
            upper.id,
            lower.id,
            hoof.id,
          ]);
        });
        alignGeneratedCavalryFrontLegs(horseLegPieces, horseLegUpperBones, parts.horseLegs, transform);
        adjustGeneratedCavalryRearLegTwo(horseLegPieces, horseLegUpperBones, 0.8);
        const soldierUpperBody = buildGeneratedSoldierUpperBodyFromMaterial({
          addBone,
          addPiece,
          registerComponentImage,
          parts,
          transform,
          mountParentId: horseBody2CenterMount.id,
        });
        const { soldierSpine1, soldierRightArm2 } = soldierUpperBody;

        const soldierRightLeg1 = addBone("\u58eb\u5175\u53f3\u817f 1", soldierSpine1.id, componentPoint(parts.soldierRightLeg, 0.82, 0.12), componentPoint(parts.soldierRightLeg, 0.30, 0.82), "#556e8a", "cavalry-soldier-right-leg");
        const soldierRightLeg2 = addBone("\u58eb\u5175\u53f3\u817f 2", soldierRightLeg1.id, componentPoint(parts.soldierRightLeg, 0.56, 0.47), componentPoint(parts.soldierRightLeg, 0.46, 0.82), "#556e8a", "cavalry-soldier-right-leg");
        const soldierRightLeg3 = addBone("\u58eb\u5175\u53f3\u817f 3", soldierRightLeg2.id, componentPoint(parts.soldierRightLeg, 0.46, 0.82), componentPoint(parts.soldierRightLeg, 0.75, 0.96), "#556e8a", "cavalry-soldier-right-foot");
        const soldierRightLegPiece = addPiece("\u58eb\u5175\u53f3\u817f", "cavalry-soldier-right-leg-piece", soldierRightLegImageId, parts.soldierRightLeg, 70, [
          soldierRightLeg1.id,
          soldierRightLeg2.id,
          soldierRightLeg3.id,
        ]);
        const soldierRightLeg1ExtraDrop = parts.soldierRightLeg.height * transform.scale * 0.35;
        soldierRightLegPiece.y += soldierRightLeg1ExtraDrop;
        soldierRightLegPiece.bindPose.y += soldierRightLeg1ExtraDrop;
        soldierRightLegPiece.attachment.restPart.y += soldierRightLeg1ExtraDrop;
        const soldierWeaponBone = addBone("\u58eb\u5175\u6b66\u5668", soldierRightArm2.id, componentPoint(parts.soldierWeapon, 0.55, 0.08), componentPoint(parts.soldierWeapon, 0.42, 0.96), "#f5c84b", "sword");
        addPiece("\u58eb\u5175\u6b66\u5668", "cavalry-soldier-weapon-piece", soldierWeaponImageId, parts.soldierWeapon, 95, [
          soldierWeaponBone.id,
        ]);
        snapGeneratedChildrenToParentsPreserveDirection(nodes);
        scaleGeneratedCavalryHorse(nodes, 1.5);

        return {
          name: "cavalry",
          fps: 36,
          duration: 95,
          selectedActionId: null,
          nodes,
          timelines,
          actions: [],
          customImages,
        };
      }

      async function installSpearmanFistRigFromMaterial(inputImageData, inputComponents, matches) {
        if (state.currentUnitType !== "spearman" && state.currentUnitType !== "musketeer") return false;
        const fistCandidateComponents = detectMaterialComponents(
          inputImageData,
          Math.max(12, Math.min(180, Math.round(materialReplacementOptions.minPixels * 0.08))),
        );
        const fistComponent = detectSpearmanFistComponent(inputImageData, fistCandidateComponents, matches);
        clearSpearmanFistRig();
        if (!fistComponent) return false;
        const torsoSixNode = findSpearmanTorsoSixNode();
        const attachmentOwnerNode = torsoSixNode ? findNearestAttachmentAncestor(torsoSixNode) : null;
        const attachmentOwnerMatch = matches.find(
          (match) => match?.slot?.imageKey && match.slot.imageKey === attachmentOwnerNode?.attachment?.image,
        );
        const attachmentOwnerRestPart =
          attachmentOwnerNode?.attachment?.fullSkin && attachmentOwnerNode.attachment.restPart
            ? resolveRestPartTransform(attachmentOwnerNode.attachment.restPart, false) ||
              attachmentOwnerNode.attachment.restPart
            : null;
        const ownerPixel = attachmentOwnerMatch
          ? projectSourcePointIntoNormalizedSlot(
              attachmentOwnerMatch.component,
              attachmentOwnerMatch.slot,
              fistComponent.cx,
              fistComponent.cy,
            )
          : null;
        const materialToWorld = estimateMaterialToWorldTransform(matches);
        if (!torsoSixNode) return false;
        const fistCenterWorld =
          attachmentOwnerMatch && attachmentOwnerRestPart && ownerPixel
            ? imagePixelToRestWorld(
                attachmentOwnerRestPart,
                {
                  width: attachmentOwnerMatch.slot.targetWidth,
                  height: attachmentOwnerMatch.slot.targetHeight,
                },
                ownerPixel.x,
                ownerPixel.y,
              )
            : materialToWorld
              ? materialToWorld(fistComponent.cx, fistComponent.cy)
              : null;
        if (!fistCenterWorld) return false;
        const torsoPose = worldPose(torsoSixNode);
        const fistEndWorld = { x: fistCenterWorld.x + 16, y: fistCenterWorld.y };
        const preferredFistImage = resolvePreferredSpearmanFistImage();
        if (preferredFistImage?.src) {
          registerCustomImage(
            spearmanFistCustomImageId,
            preferredFistImage.name,
            preferredFistImage.src,
          );
        } else {
          const fistImageData = extractMaterialPiece(inputImageData, fistComponent, materialReplacementOptions.padding);
          registerCustomImage(
            spearmanFistCustomImageId,
            "spearman-fist.png",
            imageDataToDataUrl(fistImageData),
          );
          warriorImages[spearmanFistCustomImageId] = await imageDataToImage(fistImageData);
        }

        const fistBone = createBindingBone(
          "spearman_fist",
          fistCenterWorld,
          fistEndWorld,
          "#d4907a",
          spearmanFistBoneRole,
          torsoSixNode,
          torsoPose,
        );
        fistBone.lockedTransform = true;
        fistBone.bindPose = {
          ...fistBone.bindPose,
          x: fistBone.x,
          y: fistBone.y,
          rotation: fistBone.rotation,
          length: fistBone.length,
        };

        const fistWorldScale =
          (Math.abs(materialToWorld.scaleX || 0) + Math.abs(materialToWorld.scaleY || 0)) / 2 || 1;
        const fistRestPart = {
          x: 0,
          y: 0,
          scale:
            attachmentOwnerRestPart?.scale && attachmentOwnerMatch
              ? Math.max(0.001, attachmentOwnerRestPart.scale)
              : Math.max(0.001, fistWorldScale),
          rotation: 0,
          anchorX: 0.5,
          anchorY: 0.5,
          parentBoneId: fistBone.id,
        };
        const fistPiece = createGeneratedPieceNode(
          "spearman_fist",
          spearmanFistCustomImageId,
          fistRestPart,
          (attachmentOwnerNode?.attachment?.layer ??
            Math.max(...state.nodes.map((node) => node.attachment?.layer || 0), 0)) + 1,
          [fistBone.id],
        );
        fistPiece.role = spearmanFistPieceRole;
        fistPiece.lockedTransform = true;
        state.nodes.push(fistBone, fistPiece);
        state.timelines[fistBone.id] = [];
        state.timelines[fistPiece.id] = [];
        resetRuntimeCaches();
        return true;
      }

      async function applyMaterialReplacement(file) {
        if (!file) return;
        el.replaceMaterialBtn.disabled = true;
        toast("Analyzing material and replacing...");
        try {
          if (state.currentUnitType === "cavalry") {
            const inputImage = await loadFileImage(file);
            const inputImageData = imageToImageData(inputImage);
            const project = buildCavalryProjectFromMaterial(inputImageData, file.name);
            applyProjectData(project, { unitType: "cavalry" });
            drawStage();
            toast("Built cavalry rig and replaced material.");
            return;
          }
          const [referenceImage, inputImage] = await Promise.all([
            loadImage(materialReferencePath),
            loadFileImage(file),
          ]);
          const referenceImageData = imageToImageData(referenceImage);
          const inputImageData = imageToImageData(inputImage);
          const referenceComponents = detectMaterialComponents(referenceImageData);
          const inputComponents = detectMaterialComponents(inputImageData);
          const slots = matchMaterialReferenceSlots(referenceImageData, referenceComponents);
          const matches = matchMaterialInputComponents(inputImageData, inputComponents, slots);
          for (const match of matches) {
            const extracted = extractMaterialPiece(inputImageData, match.component, materialReplacementOptions.padding);
            const normalized = normalizeMatchedMaterialPiece(extracted, match.slot, materialReplacementOptions.padding);
            warriorImages[match.slot.imageKey] = await imageDataToImage(normalized);
          }
          await installSpearmanFistRigFromMaterial(inputImageData, inputComponents, matches);
          drawStage();
          toast(`Material replacement completed: ${matches.length} components matched.`);
        } catch (error) {
          toast(error instanceof Error ? error.message : String(error));
        } finally {
          el.replaceMaterialBtn.disabled = false;
          el.materialInput.value = "";
        }
      }

      function key(nodeId, frame, patch = {}) {
        const node = state?.nodes?.find((item) => item.id === nodeId);
        const base = node || {
          x: 0,
          y: 0,
          rotation: 0,
          length: 80,
          scaleX: 1,
          scaleY: 1,
        };
        return {
          frame,
          x: patch.x ?? base.x,
          y: patch.y ?? base.y,
          rotation: patch.rotation ?? base.rotation,
          length: patch.length ?? base.length,
          scaleX: patch.scaleX ?? base.scaleX,
          scaleY: patch.scaleY ?? base.scaleY,
          visible: patch.visible ?? base.visible !== false,
          ...(typeof patch.attachmentImage === "string" && patch.attachmentImage.trim()
            ? { attachmentImage: patch.attachmentImage.trim() }
            : {}),
        };
      }

      function uid(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function uniqueNodeId(baseId) {
        const cleanBase = String(baseId || "node").trim() || "node";
        const used = new Set(state.nodes.map((node) => node.id));
        if (!used.has(cleanBase)) return cleanBase;
        let index = 2;
        while (used.has(`${cleanBase}-${index}`)) index += 1;
        return `${cleanBase}-${index}`;
      }

      function selectedNode() {
        return state.nodes.find((node) => node.id === state.selectedNodeId) || state.nodes[0];
      }

      function independentEditableBones() {
        return state.nodes.filter(
          (node) => node && !node.attachment && !node.parentId && !isTransformLockedNode(node),
        );
      }

      function renderIndependentBonePicker() {
        if (!el.independentBoneRow || !el.independentBoneSelect) return;
        const binding = isBindingMode();
        const bones = binding ? independentEditableBones() : [];
        el.independentBoneRow.hidden = !binding || !bones.length;
        el.independentBoneSelect.innerHTML = "";
        el.independentBoneSelect.disabled = !binding || !bones.length;
        bones.forEach((bone) => {
          const option = document.createElement("option");
          option.value = bone.id;
          option.textContent = bone.name;
          option.selected = bone.id === selectedNode()?.id;
          el.independentBoneSelect.appendChild(option);
        });
      }

      function attachmentEditNode(node = selectedNode()) {
        if (!node) return null;
        if (node.attachment) return node;
        return (
          state.nodes.find(
            (item) => item.attachment?.segments && item.attachment.chainTo === node.id,
          ) || node
        );
      }

      function attachmentEditContext(node = selectedNode()) {
        const owner = attachmentEditNode(node);
        if (!owner?.attachment) return { owner, lower: false };
        return { owner, lower: owner.id !== node?.id && owner.attachment.chainTo === node?.id };
      }

      function selectedAttachmentView(node = selectedNode()) {
        const context = attachmentEditContext(node);
        if (!context.owner?.attachment) return null;
        return context.lower
          ? { ...context.owner.attachment, ...(context.owner.attachment.lower || {}) }
          : context.owner.attachment;
      }

      function attachmentImageVariants(attachmentView = selectedAttachmentView()) {
        if (!attachmentView) return [];
        const seen = new Set();
        const result = [];
        [attachmentView.image, ...(Array.isArray(attachmentView.imageVariants) ? attachmentView.imageVariants : [])]
          .map((value) => String(value || "").trim())
          .filter(Boolean)
          .forEach((value) => {
            if (seen.has(value)) return;
            seen.add(value);
            result.push(value);
          });
        return result;
      }

      function availableLegAssetOptions() {
        const options = Array.isArray(window.__SPINE_LEG_ASSET_OPTIONS) ? window.__SPINE_LEG_ASSET_OPTIONS : [];
        return [...new Set(options.map((value) => String(value || "").trim()).filter(Boolean))];
      }

      function attachmentImageKeys(node) {
        return (state.timelines[node?.id] || []).filter((item) => typeof item.attachmentImage === "string" && item.attachmentImage);
      }

      function attachmentImageKeyAtFrame(node, frame = state.currentFrame) {
        const currentFrame = Math.round(frame);
        return attachmentImageKeys(node).find((item) => item.frame === currentFrame) || null;
      }

      function getAttachmentImageForFrame(node, frame = state.currentFrame) {
        const attachment = node?.attachment;
        if (!attachment) return "";
        const defaultImage = String(attachment.image || "");
        const variants = attachmentImageVariants(attachment);
        const keys = attachmentImageKeys(node)
          .filter((item) => item.frame <= frame)
          .sort((a, b) => a.frame - b.frame);
        const replacement = keys.length ? String(keys[keys.length - 1].attachmentImage || "") : "";
        if (replacement && (!variants.length || variants.includes(replacement))) return replacement;
        return defaultImage;
      }

      function clampFrame(frame) {
        return Math.max(0, Math.min(state.duration, Math.round(frame)));
      }

      function sortedNodes() {
        const result = [];
        const walk = (parentId, depth) => {
          state.nodes
            .filter((node) => node.parentId === parentId)
            .forEach((node) => {
              result.push({ ...node, depth });
              walk(node.id, depth + 1);
            });
        };
        walk(null, 0);
        state.nodes
          .filter((node) => !result.some((item) => item.id === node.id))
          .forEach((node) => result.push({ ...node, depth: 0 }));
        return result;
      }

      function sortedNodeRefs() {
        return sortedNodes()
          .map((node) => cachedNodeById(node.id))
          .filter(Boolean);
      }

      function isBindingMode() {
        return state.workspaceMode === "binding";
      }

      function getLocalPose(node, frame = state.currentFrame) {
        const override = ignorePoseOverrides ? null : poseOverrides.get(node.id);
        if (override) return BowRigController.enrichPose(node, { ...node, ...override });
        if (isBindingMode()) return getRestLocalPose(node);
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        if (keys.length === 0) return BowRigController.enrichPose(node, { ...node });
        const exact = keys.find((item) => item.frame === frame);
        if (exact) return BowRigController.enrichPose(node, { ...node, ...exact });
        if (keys.length === 1) return BowRigController.enrichPose(node, { ...node, ...keys[0] });
        const before = [...keys].reverse().find((item) => item.frame < frame);
        const after = keys.find((item) => item.frame > frame);
        if (!before) {
          return BowRigController.enrichPose(node, {
            ...node,
            ...keys[0],
            visible: node.visible !== false,
          });
        }
        if (!after) {
          const start = keys.find((item) => item.frame === 0) || keys[0];
          const loopEndFrame = state.duration + 1;
          const span = Math.max(1, loopEndFrame - before.frame);
          const t = Math.max(0, Math.min(1, (frame - before.frame) / span));
          return interpolateLocalPose(node, before, start, t);
        }
        const arrowPiece = arrowPieceForNode(node);
        const slashFxPiece = slashFxPieceForNode(node);
        const parentChange =
          arrowParentChangeBetweenFrames(arrowPiece, before.frame, after.frame) ||
          slashFxParentChangeBetweenFrames(slashFxPiece, before.frame, after.frame);
        if (parentChange) {
          if (frame < parentChange.frame) {
            return BowRigController.enrichPose(node, { ...node, ...before });
          }
          return BowRigController.enrichPose(node, { ...node, ...after });
        }
        const t = (frame - before.frame) / (after.frame - before.frame);
        return interpolateLocalPose(node, before, after, t);
      }

      function interpolateLocalPose(node, before, after, t) {
        return BowRigController.interpolatePose(node, before, after, t, {
          ...node,
          x: lerp(before.x, after.x, t),
          y: lerp(before.y, after.y, t),
          rotation: lerpAngle(before.rotation, after.rotation, t),
          length: lerp(before.length, after.length, t),
          scaleX: lerp(before.scaleX, after.scaleX, t),
          scaleY: lerp(before.scaleY, after.scaleY, t),
          visible:
            typeof before?.visible === "boolean"
              ? before.visible
              : typeof after?.visible === "boolean"
                ? after.visible
                : node.visible !== false,
        });
      }

      function isNodeVisibleAtFrame(node, frame = state.currentFrame) {
        if (!node) return false;
        if (isBindingMode()) return true;
        const arrowPiece = arrowPieceForNode(node);
        if (arrowPiece) return arrowVisibilityAtFrame(arrowPiece, frame);
        const slashFxPiece = slashFxPieceForNode(node);
        if (slashFxPiece) {
          if (node.id === state.selectedNodeId || slashFxPiece.id === state.selectedPieceNodeId) return true;
          return slashFxAlphaAtFrame(slashFxPiece, frame) > 0.001;
        }
        return true;
      }

      function isSpecialAnchorNode(node) {
        return node?.role === "cavalry-horse-head-anchor";
      }

      function isCanvasVisibleNode(node, frame = state.currentFrame) {
        if (!isNodeVisibleAtFrame(node, frame)) return false;
        if (isSpecialAnchorNode(node) && !state.showSpecialAnchorBones) return false;
        return true;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpAngle(a, b, t) {
        let diff = ((b - a + 180) % 360) - 180;
        if (diff < -180) diff += 360;
        return a + diff * t;
      }

      function worldPose(node, frame = state.currentFrame, seen = new Set()) {
        if (seen.has(node.id)) return getLocalPose(node, frame);
        seen.add(node.id);
        const local = getLocalPose(node, frame);
        const effectiveParentId = effectiveParentIdForNode(node, frame);
        if (!effectiveParentId) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const parent = cachedNodeById(effectiveParentId);
        if (!parent) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const p = worldPose(parent, frame, seen);
        const anchor = endPoint(p);
        const worldRotation = p.worldRotation + local.rotation;
        const worldScaleX = p.worldScaleX * local.scaleX;
        const worldScaleY = p.worldScaleY * local.scaleY;
        if (isTempParentBoundArrowCarrier(node, frame)) {
          const gripLocal = arrowGripLocalForPiece(arrowPieceForNode(node));
          if (gripLocal) {
            const gripRad = (worldRotation * Math.PI) / 180;
            const gripOffsetX =
              gripLocal.x * worldScaleX * Math.cos(gripRad) - gripLocal.y * worldScaleY * Math.sin(gripRad);
            const gripOffsetY =
              gripLocal.x * worldScaleX * Math.sin(gripRad) + gripLocal.y * worldScaleY * Math.cos(gripRad);
            return {
              ...local,
              worldX: anchor.x - gripOffsetX,
              worldY: anchor.y - gripOffsetY,
              worldRotation,
              worldScaleX,
              worldScaleY,
            };
          }
        }
        if (isTempParentBoundSlashFxCarrier(node, frame)) {
          const gripLocal = slashFxGripLocalForPiece(slashFxPieceForNode(node));
          if (gripLocal) {
            const gripRad = (worldRotation * Math.PI) / 180;
            const gripOffsetX =
              gripLocal.x * worldScaleX * Math.cos(gripRad) - gripLocal.y * worldScaleY * Math.sin(gripRad);
            const gripOffsetY =
              gripLocal.x * worldScaleX * Math.sin(gripRad) + gripLocal.y * worldScaleY * Math.cos(gripRad);
            return {
              ...local,
              worldX: anchor.x - gripOffsetX,
              worldY: anchor.y - gripOffsetY,
              worldRotation,
              worldScaleX,
              worldScaleY,
            };
          }
        }
        const rad = (p.worldRotation * Math.PI) / 180;
        const px = local.x * p.worldScaleX;
        const py = local.y * p.worldScaleY;
        const rotatedX = px * Math.cos(rad) - py * Math.sin(rad);
        const rotatedY = px * Math.sin(rad) + py * Math.cos(rad);
        return {
          ...local,
          worldX: anchor.x + rotatedX,
          worldY: anchor.y + rotatedY,
          worldRotation,
          worldScaleX,
          worldScaleY,
        };
      }

      function getRestLocalPose(node) {
        if (!node) {
          return {
            x: 0,
            y: 0,
            rotation: 0,
            length: 80,
            scaleX: 1,
            scaleY: 1,
          };
        }
        return { ...node, ...(node.bindPose || {}) };
      }

      function restWorldPose(node, seen = new Set()) {
        if (!node) {
          return {
            x: 0,
            y: 0,
            rotation: 0,
            length: 80,
            scaleX: 1,
            scaleY: 1,
            worldX: 0,
            worldY: 0,
            worldRotation: 0,
            worldScaleX: 1,
            worldScaleY: 1,
          };
        }
        if (seen.has(node.id)) return getRestLocalPose(node);
        seen.add(node.id);
        const local = getRestLocalPose(node);
        if (!node.parentId) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const parent = cachedNodeById(node.parentId);
        if (!parent) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const p = restWorldPose(parent, seen);
        const anchor = endPoint(p);
        const rad = (p.worldRotation * Math.PI) / 180;
        const px = local.x * p.worldScaleX;
        const py = local.y * p.worldScaleY;
        const rotatedX = px * Math.cos(rad) - py * Math.sin(rad);
        const rotatedY = px * Math.sin(rad) + py * Math.cos(rad);
        return {
          ...local,
          worldX: anchor.x + rotatedX,
          worldY: anchor.y + rotatedY,
          worldRotation: p.worldRotation + local.rotation,
          worldScaleX: p.worldScaleX * local.scaleX,
          worldScaleY: p.worldScaleY * local.scaleY,
        };
      }

      function endPoint(pose) {
        const rad = (pose.worldRotation * Math.PI) / 180;
        return {
          x: pose.worldX + Math.cos(rad) * pose.length * pose.worldScaleX,
          y: pose.worldY + Math.sin(rad) * pose.length * pose.worldScaleY,
        };
      }

      function resizeCanvas() {
        const rect = el.stage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        el.stage.width = Math.max(1, Math.floor(rect.width * dpr));
        el.stage.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawStage();
      }

      function drawStage() {
        resetRuntimeCaches();
        const rect = el.stage.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.save();
        applyStageViewTransform();
        drawAxes(rect);
        drawWorldOriginMarker();
        const nodes = sortedNodes();
        drawPreviousKeyGhost(nodes);
        if (state.renderMode === "texture") {
          drawWarriorTextures();
          if (state.showSkeletonOverlay) {
            nodes.forEach((node) => drawParentLink(node));
            nodes.forEach((node) => drawBone(node, node.id === state.selectedNodeId));
          }
          drawSelectedPieceBinding(nodes);
          drawTextureHandles(nodes);
        } else {
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, node.id === state.selectedNodeId));
          drawSelectedPieceBinding(nodes);
        }
        drawBindingToolPreview();
        ctx.restore();
      }

      function drawWorldOriginMarker() {
        const markerRadius = screenLengthToWorld(8);
        const markerHalf = screenLengthToWorld(18);
        ctx.save();
        ctx.strokeStyle = "#7ee787";
        ctx.fillStyle = "#7ee787";
        ctx.lineWidth = screenLengthToWorld(2);
        ctx.beginPath();
        ctx.moveTo(-markerHalf, 0);
        ctx.lineTo(markerHalf, 0);
        ctx.moveTo(0, -markerHalf);
        ctx.lineTo(0, markerHalf);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, markerRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#dff7e7";
        ctx.font = `${screenLengthToWorld(13)}px sans-serif`;
        ctx.fillText("Origin (0 px, 0 px)", screenLengthToWorld(14), -screenLengthToWorld(10));
        ctx.restore();
      }

      function drawPreviousKeyGhost(nodes) {
        if (isBindingMode()) return;
        const frame = previousKeyFrameForSelected();
        if (frame === null) return;
        const currentFrame = state.currentFrame;
        const previousAlpha = drawAlphaMultiplier;
        const previousIgnore = ignorePoseOverrides;
        state.currentFrame = frame;
        drawAlphaMultiplier = 0.28;
        ignorePoseOverrides = true;
        ctx.save();
        if (state.renderMode === "texture") {
          drawWarriorTextures();
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, false));
        } else {
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, false));
        }
        ctx.restore();
        ignorePoseOverrides = previousIgnore;
        drawAlphaMultiplier = previousAlpha;
        state.currentFrame = currentFrame;
      }

      function previousKeyFrameForSelected() {
        const node = selectedNode();
        if (!node) return null;
        const currentFrame = Number(state.currentFrame);
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        const previous = [...keys].reverse().find((item) => item.frame < currentFrame - 0.001);
        return previous?.frame ?? null;
      }

      function drawAxes(rect) {
        const topLeft = worldFromScreen({ x: 0, y: 0 });
        const bottomRight = worldFromScreen({ x: rect.width, y: rect.height });
        ctx.save();
        ctx.strokeStyle = "#ffffff10";
        ctx.lineWidth = 1 / Math.max(0.01, state.stageView?.zoom || 1);
        ctx.beginPath();
        ctx.moveTo(topLeft.x, 0);
        ctx.lineTo(bottomRight.x, 0);
        ctx.moveTo(0, topLeft.y);
        ctx.lineTo(0, bottomRight.y);
        ctx.stroke();
        ctx.restore();
      }

      function drawBone(node, active) {
        if (!isCanvasVisibleNode(node)) return;
        const pose = worldPose(node);
        const end = endPoint(pose);
        const bowTag = bowDebugLabel(node);
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = node.color;
        if (node.role?.startsWith("bow-string")) ctx.setLineDash([8, 6]);
        ctx.lineWidth = active ? 9 : 6;
        setDrawAlpha(active ? 1 : 0.78);
        ctx.beginPath();
        ctx.moveTo(pose.worldX, pose.worldY);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();

        setDrawAlpha(1);
        ctx.fillStyle = active ? "#ffffff" : node.color;
        ctx.strokeStyle = active ? varColor("--accent-2") : "#00000080";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pose.worldX, pose.worldY, active ? 8 : 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = active ? varColor("--accent-2") : "#ffffff";
        ctx.beginPath();
        ctx.arc(end.x, end.y, active ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#eef2f5";
        ctx.font = "12px sans-serif";
        ctx.fillText(bowTag ? `${node.name} [${bowTag}]` : node.name, pose.worldX + 10, pose.worldY - 8);
        ctx.restore();
      }

      function bowDebugLabel(node) {
        if (!node?.role) return "";
        if (node.role === "bow-center") return "center";
        if (node.role === "bow-upper") return "body-upper";
        if (node.role === "bow-lower") return "body-lower";
        if (node.role === "bow-string-upper") return "string-upper";
        if (node.role === "bow-string-lower") return "string-lower";
        if (node.role === "bow-string-control") return "string-control";
        return "";
      }

      function drawWarriorTextures() {
        const texturedNodes = state.nodes.filter((node) => node.attachment && isNodeVisibleAtFrame(node));
        if (texturedNodes.length === 0) return;
        texturedNodes
          .slice()
          .sort((a, b) => {
            const layerDiff = (a.attachment.layer || 0) - (b.attachment.layer || 0);
            if (layerDiff) return layerDiff;
            return effectiveAttachmentAlpha(a) - effectiveAttachmentAlpha(b);
          })
          .forEach((node) => drawAttachment(node));
      }

      function drawAttachment(node) {
        const attachment = node.attachment;
        const alpha = effectiveAttachmentAlpha(node);
        if (alpha <= 0.001) return;
        const freezeToBindPose = isBindingMode() && state.bindingDragMode === "node";
        if (node.role === "bow-string" && attachment.segments && attachment.chainTo) {
          drawBowStringAttachment(node, attachment, alpha, freezeToBindPose);
          return;
        }
        const image = warriorImages[getAttachmentImageForFrame(node)];
        if (!image?.complete) return;
        const pose = freezeToBindPose ? restWorldPose(node) : worldPose(node);
        if (attachment.fullSkin) {
          if (isBindingMode() && attachment.restPart) {
            if (freezeToBindPose) {
              drawRestPartImage(image, resolveRestPartTransform(attachment.restPart, false), alpha);
            } else {
              drawFullSkinAttachment(attachment, image, alpha, true);
            }
            return;
          }
          drawFullSkinAttachment(attachment, image, alpha, !freezeToBindPose);
          return;
        }
        if (attachment.segments && attachment.chainTo) {
          drawSegmentedAttachment(node, attachment, image, alpha, !freezeToBindPose);
          return;
        }
        if (attachment.image === "head") {
          drawHeadAttachment(node, attachment, image, alpha);
          return;
        }
        let start = { x: pose.worldX, y: pose.worldY };
        let end = endPoint(pose);
        if (attachment.chainTo) {
          const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
          if (!chainNode) return;
          end = endPoint(freezeToBindPose ? restWorldPose(chainNode) : worldPose(chainNode));
        }
        if (attachment.reverse) {
          const nextStart = end;
          end = start;
          start = nextStart;
        }
        const length = Math.max(8, distance(start, end) * attachment.lengthScale);
        if (attachment.image === "body" && attachment.hemEnabled) {
          drawBodyWithSpringHem(image, start, end, attachment, length, node.id);
          return;
        }
        drawImageAlong(
          image,
          start,
          end,
          attachment.width,
          length,
          alpha,
          attachment.anchorX,
          attachment.rotationOffset,
          attachment.offsetX,
          attachment.offsetY,
        );
      }

      function drawBodyWithSpringHem(image, start, end, attachment, length, nodeId) {
        const cutRatio = attachment.hemY;
        const sourceCut = Math.round(image.height * cutRatio);
        const seamOverlap = Math.min(4, Math.max(1, attachment.width * 0.04));
        const sourceOverlap = Math.min(6, Math.max(1, Math.round(image.height * 0.02)));
        const topLength = Math.max(1, length * cutRatio + seamOverlap);
        drawImageSliceAlong(
          image,
          start,
          end,
          attachment.width,
          topLength,
          attachment.alpha,
          attachment.anchorX,
          0,
          Math.min(image.height, sourceCut + sourceOverlap),
          attachment.rotationOffset,
          attachment.offsetX,
          attachment.offsetY,
        );
        const hemSourceStart = Math.max(0, sourceCut - sourceOverlap);
        const hemAnchorY = Math.max(0, cutRatio - seamOverlap / length);
        drawSpringCloth(nodeId, image, start, end, attachment, {
            sourceStart: hemSourceStart,
            sourceSize: Math.max(1, image.height - hemSourceStart),
            anchorX: attachment.hemX,
            anchorY: hemAnchorY,
            length: attachment.hemLength,
            angle: attachment.hemAngle,
            width: attachment.width,
            alpha: attachment.alpha,
            drawnLength: length,
          });
      }

      function drawSegmentedAttachment(node, attachment, image, alpha = attachment.alpha, useCurrentPose = true) {
        const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
        if (!chainNode) return;
        const lowerAttachment = { ...attachment, ...(attachment.lower || {}) };
        const upperPose = useCurrentPose ? worldPose(node) : restWorldPose(node);
        const lowerPose = useCurrentPose ? worldPose(chainNode) : restWorldPose(chainNode);
        const shoulder = { x: upperPose.worldX, y: upperPose.worldY };
        const elbow = { x: lowerPose.worldX, y: lowerPose.worldY };
        const hand = endPoint(lowerPose);
        const upperRestPose = restWorldPose(node);
        const lowerRestPose = restWorldPose(chainNode);
        const restShoulder = { x: upperRestPose.worldX, y: upperRestPose.worldY };
        const restElbow = { x: lowerRestPose.worldX, y: lowerRestPose.worldY };
        const restHand = endPoint(lowerRestPose);
        drawSkinnedAttachment(image, [
          {
            sourceY: 0,
            sourceHeight: image.height / 2,
            width: attachment.width,
            anchorX: attachment.anchorX,
            rotationOffset: attachment.rotationOffset,
            offsetX: attachment.offsetX,
            offsetY: attachment.offsetY,
            restStart: restShoulder,
            restEnd: restElbow,
            start: shoulder,
            end: elbow,
          },
          {
            sourceY: image.height / 2,
            sourceHeight: image.height / 2,
            width: lowerAttachment.width,
            anchorX: lowerAttachment.anchorX,
            rotationOffset: lowerAttachment.rotationOffset,
            offsetX: lowerAttachment.offsetX,
            offsetY: lowerAttachment.offsetY,
            restStart: restElbow,
            restEnd: restHand,
            start: elbow,
            end: hand,
          },
        ], alpha);
      }

      function drawBowStringAttachment(node, attachment, alpha = attachment.alpha, freezeToBindPose = false) {
        const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
        if (!chainNode) return;
        const lowerAttachment = { ...attachment, ...(attachment.lower || {}) };
        const upperPose = freezeToBindPose ? restWorldPose(node) : worldPose(node);
        const lowerPose = freezeToBindPose ? restWorldPose(chainNode) : worldPose(chainNode);
        const start = { x: upperPose.worldX, y: upperPose.worldY };
        const middle = { x: lowerPose.worldX, y: lowerPose.worldY };
        const end = endPoint(lowerPose);
        const color = attachment.lineColor || node.color || "#d8d0bf";
        drawBowStringSegment(start, middle, attachment.width, alpha, color);
        drawBowStringSegment(middle, end, lowerAttachment.width || attachment.width, alpha, color);
      }

      function drawBowStringSegment(start, end, width, alpha, color) {
        const stringWidth = Math.max(1.5, Number(width) || 2);
        ctx.save();
        setDrawAlpha(alpha);
        ctx.strokeStyle = color;
        ctx.lineWidth = stringWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.strokeStyle = "#ffffff66";
        ctx.lineWidth = Math.max(0.5, stringWidth * 0.28);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.restore();
      }

      function drawSkinnedAttachment(image, segments, alpha) {
        const cols = 6;
        const rows = 13;
        const source = [];
        const dest = [];
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          const sourceY = image.height * v;
          const segment = sourceY < image.height / 2 ? segments[0] : segments[1];
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            const sourcePoint = {
              x: image.width * u,
              y: sourceY,
            };
            const restPoint = imagePointToSegmentRest(sourcePoint, image, segment, u);
            sourceRow.push(sourcePoint);
            destRow.push(deformByAttachmentSegments(restPoint, segments));
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        drawTexturedMesh(image, source, dest, alpha);
      }

      function resolveRestPartTransform(restPart, useCurrentPose = false) {
        if (!restPart) return null;
        const parentBoneId = restPart.parentBoneId ? String(restPart.parentBoneId) : null;
        if (!parentBoneId) return { ...restPart };
        const parentNode = state.nodes.find((node) => node.id === parentBoneId);
        if (!parentNode) return { ...restPart };
        const parentPose = useCurrentPose ? worldPose(parentNode) : restWorldPose(parentNode);
        const worldPoint = worldFromLocalByParentPose(parentPose, {
          x: restPart.x || 0,
          y: restPart.y || 0,
        });
        return {
          ...restPart,
          x: worldPoint.x,
          y: worldPoint.y,
          rotation: (restPart.rotation || 0) + parentPose.worldRotation,
        };
      }

      function setResolvedRestPartTransform(restPart, patch, useCurrentPose = false) {
        if (!restPart) return null;
        const parentBoneId = restPart.parentBoneId ? String(restPart.parentBoneId) : null;
        if (!parentBoneId) {
          return {
            ...restPart,
            ...(patch.x !== undefined ? { x: patch.x } : {}),
            ...(patch.y !== undefined ? { y: patch.y } : {}),
            ...(patch.scale !== undefined ? { scale: patch.scale } : {}),
            ...(patch.rotation !== undefined ? { rotation: patch.rotation } : {}),
          };
        }
        const parentNode = state.nodes.find((node) => node.id === parentBoneId);
        if (!parentNode) return { ...restPart };
        const parentPose = useCurrentPose ? worldPose(parentNode) : restWorldPose(parentNode);
        const resolved = resolveRestPartTransform(restPart, useCurrentPose);
        const nextWorld = {
          x: patch.x !== undefined ? patch.x : resolved.x,
          y: patch.y !== undefined ? patch.y : resolved.y,
          rotation: patch.rotation !== undefined ? patch.rotation : resolved.rotation,
        };
        const localPoint = localFromWorldByParentPose(parentPose, nextWorld);
        return {
          ...restPart,
          ...(patch.scale !== undefined ? { scale: patch.scale } : {}),
          x: localPoint.x,
          y: localPoint.y,
          rotation: nextWorld.rotation - parentPose.worldRotation,
        };
      }

      function drawFullSkinAttachment(attachment, image, alpha = attachment.alpha, useCurrentPose = true) {
        const restPart = resolveRestPartTransform(attachment.restPart, false);
        const segments = (attachment.skinBoneIds || [])
          .map((nodeId) => state.nodes.find((item) => item.id === nodeId))
          .filter(Boolean)
          .map((boneNode) => {
            const pose = useCurrentPose ? worldPose(boneNode) : restWorldPose(boneNode);
            const rest = restWorldPose(boneNode);
            return {
              restStart: { x: rest.worldX, y: rest.worldY },
              restEnd: endPoint(rest),
              start: { x: pose.worldX, y: pose.worldY },
              end: endPoint(pose),
            };
          });
        if (!restPart) return;
        if (segments.length === 0) {
          drawRestPartImage(image, restPart, alpha);
          return;
        }

        const cols = Math.max(3, Math.round(Number(attachment.meshCols) || (restPart.partId === "torso" ? 5 : 4)));
        const rows = Math.max(6, Math.round(Number(attachment.meshRows) || segments.length * 5));
        const source = [];
        const dest = [];
        for (let row = 0; row <= rows; row += 1) {
          const v = row / rows;
          const sourceRow = [];
          const destRow = [];
          for (let col = 0; col <= cols; col += 1) {
            const u = col / cols;
            const sourcePoint = {
              x: image.width * u,
              y: image.height * v,
            };
            sourceRow.push(sourcePoint);
            destRow.push(
              deformByAttachmentSegments(
                imagePointToFullSkinRest(sourcePoint, image, restPart),
                segments,
              ),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        drawTexturedMesh(image, source, dest, alpha);
