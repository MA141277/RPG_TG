<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spine 节点时间轴编辑器</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151719;
        --panel: #202326;
        --panel-2: #292d31;
        --line: #3b4147;
        --text: #eef2f5;
        --muted: #9aa5ae;
        --accent: #35b6b4;
        --accent-2: #e6a23c;
        --danger: #e66f6f;
        --ok: #77c66e;
        --canvas: #101214;
        --track: #23282d;
        --track-alt: #1b1f23;
        --key: #f5c84b;
        --key-active: #ff7a59;
        --shadow: 0 18px 50px rgb(0 0 0 / 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui,
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #30363b;
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #171a1d;
        color: var(--text);
        padding: 5px 8px;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
        line-height: 1.45;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr 224px;
        width: 100vw;
        height: 100vh;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #1c2024;
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
        min-height: 32px;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background:
          linear-gradient(135deg, transparent 48%, #ffffff40 50%, transparent 52%),
          linear-gradient(135deg, var(--accent), #4d8ecf);
      }

      .brand h1 {
        margin: 0;
        overflow: hidden;
        font-size: 15px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .toolbar button {
        padding: 0 10px;
      }

      .mode-button.active {
        border-color: var(--accent);
        background: #244f4f;
      }

      .workspace {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        min-height: 0;
      }

      .panel {
        min-height: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow: auto;
      }

      .panel.right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }

      .panel-section {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .node-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .node-item {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 6px;
        align-items: center;
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        padding: 4px 8px;
        color: var(--text);
        text-align: left;
      }

      .node-item.active {
        border-color: var(--accent);
        background: #294144;
      }

      .node-depth {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      .node-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .node-color {
        width: 14px;
        height: 14px;
        border: 1px solid #ffffff80;
        border-radius: 50%;
      }

      .stage-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
        background:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px), var(--canvas);
        background-size: 32px 32px;
        user-select: none;
      }

      #stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .stage-hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: min(520px, calc(100% - 24px));
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgb(22 25 28 / 0.82);
        color: var(--muted);
        padding: 8px 10px;
        font-size: 12px;
        pointer-events: none;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
      }

      .field.checkbox-field {
        justify-content: end;
      }

      .field.checkbox-field label {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 32px;
        color: var(--text);
      }

      .field.checkbox-field input {
        width: 16px;
        min-height: 16px;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .button-row.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .danger {
        border-color: #6d3838;
        background: #4a2424;
      }

      .primary {
        border-color: #337f7d;
        background: #236160;
      }

      .timeline {
        display: grid;
        grid-template-rows: 42px 1fr;
        min-height: 0;
        border-top: 1px solid var(--line);
        background: #191d20;
      }

      .timeline-top {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        border-bottom: 1px solid var(--line);
      }

      .transport,
      .timeline-meta,
      .timeline-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
      }

      .transport {
        border-right: 1px solid var(--line);
      }

      .timeline-actions {
        justify-content: flex-end;
        border-left: 1px solid var(--line);
      }

      .transport button,
      .timeline-actions button {
        min-width: 34px;
        padding: 0 8px;
      }

      .small-input {
        width: 72px;
      }

      .timeline-body {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 0;
      }

      .track-labels {
        overflow: hidden auto;
        border-right: 1px solid var(--line);
      }

      .track-label {
        display: flex;
        align-items: center;
        min-height: 30px;
        border-bottom: 1px solid #ffffff10;
        padding: 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .tracks-viewport {
        position: relative;
        overflow: auto;
      }

      .tracks {
        position: relative;
        min-height: 100%;
      }

      .frame-ruler,
      .track-row {
        position: relative;
        min-height: 30px;
      }

      .frame-ruler {
        position: sticky;
        top: 0;
        z-index: 4;
        background: #1f2428;
        border-bottom: 1px solid var(--line);
      }

      .track-row {
        border-bottom: 1px solid #ffffff10;
        background: var(--track);
      }

      .track-row:nth-child(odd) {
        background: var(--track-alt);
      }

      .frame-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #ffffff14;
      }

      .frame-label {
        position: absolute;
        top: 8px;
        color: var(--muted);
        font-size: 11px;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        width: 2px;
        background: var(--accent-2);
        pointer-events: none;
      }

      .playhead::before {
        position: absolute;
        top: 0;
        left: -5px;
        width: 12px;
        height: 12px;
        border-radius: 0 0 6px 6px;
        background: var(--accent-2);
        content: "";
      }

      .key {
        position: absolute;
        top: 8px;
        z-index: 2;
        width: 14px;
        height: 14px;
        border: 1px solid #6f4d00;
        border-radius: 3px;
        background: var(--key);
        cursor: ew-resize;
        transform: translateX(-50%) rotate(45deg);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.35);
      }

      .key.active {
        border-color: #8c2d15;
        background: var(--key-active);
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .file-input {
        display: none;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        max-width: 360px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #24292e;
        box-shadow: var(--shadow);
        color: var(--text);
        padding: 10px 12px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 230px 1fr;
        }

        .panel.right {
          display: none;
        }

        .timeline-top {
          grid-template-columns: 230px 1fr;
        }

        .timeline-actions {
          display: none;
        }

        .timeline-body {
          grid-template-columns: 230px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>Spine 节点时间轴编辑器</h1>
            <span>骨骼节点 · 关键帧 · 插值播放 · JSON 工程导入导出</span>
          </div>
        </div>
        <div class="toolbar">
          <button id="newProjectBtn" type="button">新建</button>
          <button id="importBtn" type="button">导入 JSON</button>
          <button id="exportBtn" type="button">导出 JSON</button>
          <button id="sampleBtn" type="button">示例</button>
          <button id="walkSampleBtn" type="button">侧面行走</button>
          <button id="newVersionSampleBtn" type="button">新版</button>
          <button id="openingMonkSampleBtn" type="button">开局人物</button>
          <button id="openingCloakSampleBtn" type="button">开局披风</button>
          <button id="idleAnimationBtn" type="button">待机动画</button>
          <button id="slashSampleBtn" type="button">侧身劈砍</button>
          <button id="threeQuarterSampleBtn" type="button">70度侧身</button>
          <button id="viewToggleBtn" type="button">骨骼视图</button>
          <button id="skeletonOverlayBtn" type="button">显示骨骼</button>
          <button id="nodeModeBtn" class="mode-button active" type="button">节点移动</button>
          <button id="boneModeBtn" class="mode-button" type="button">骨骼移动</button>
          <button id="stretchModeBtn" class="mode-button" type="button">骨骼伸缩</button>
          <button id="addBoneModeBtn" class="mode-button" type="button">画骨骼</button>
          <input id="fileInput" class="file-input" type="file" accept=".json,application/json" />
        </div>
      </header>

      <main class="workspace">
        <aside class="panel">
          <section class="panel-section">
            <div class="panel-title">
              <span>节点树</span>
              <button id="addNodeBtn" type="button">添加骨骼</button>
            </div>
            <div id="nodeList" class="node-list"></div>
          </section>
          <section class="panel-section">
            <div class="panel-title">项目设置</div>
            <div class="form-grid">
              <div class="field">
                <label for="fpsInput">FPS</label>
                <input id="fpsInput" type="number" min="1" max="120" step="1" />
              </div>
              <div class="field">
                <label for="durationInput">总帧数</label>
                <input id="durationInput" type="number" min="1" max="1200" step="1" />
              </div>
            </div>
          </section>
        </aside>

        <section class="stage-wrap">
          <canvas id="stage" draggable="false"></canvas>
          <div class="stage-hint">
            画骨骼：在参考图上从起点拖到终点创建骨骼；选中已有骨骼后再画，会把新骨骼接到当前骨骼末端。
          </div>
        </section>

        <aside class="panel right">
          <section class="panel-section">
            <div class="panel-title">节点属性</div>
            <div class="form-grid">
              <div class="field full">
                <label for="nodeNameInput">名称</label>
                <input id="nodeNameInput" type="text" />
              </div>
              <div class="field full">
                <label for="parentSelect">父节点</label>
                <select id="parentSelect"></select>
              </div>
              <div class="field">
                <label for="xInput">X</label>
                <input id="xInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="yInput">Y</label>
                <input id="yInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="rotationInput">旋转</label>
                <input id="rotationInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="lengthInput">长度</label>
                <input id="lengthInput" type="number" min="4" step="1" />
              </div>
              <div class="field">
                <label for="scaleXInput">缩放 X</label>
                <input id="scaleXInput" type="number" min="0.05" step="0.05" />
              </div>
              <div class="field">
                <label for="scaleYInput">缩放 Y</label>
                <input id="scaleYInput" type="number" min="0.05" step="0.05" />
              </div>
              <div class="field full">
                <label for="colorInput">颜色</label>
                <input id="colorInput" type="color" />
              </div>
              <div class="field full">
                <label for="attachmentImageSelect">贴图</label>
                <select id="attachmentImageSelect">
                  <option value="">无</option>
                  <option value="body">body.png</option>
                  <option value="head">head.png</option>
                  <option value="arm">arm_right.png</option>
                  <option value="leg">leg.png</option>
                  <option value="newHead">新版/head.png</option>
                  <option value="newTorso">新版/torso.png</option>
                  <option value="newLeftArm">新版/leftarm.png</option>
                  <option value="newRightArm">新版/rightarm.png</option>
                  <option value="newLeftLeg">新版/leftleg.png</option>
                  <option value="newRightLeg">新版/rightleg.png</option>
                  <option value="newSword">新版/sword.png</option>
                  <option value="openingMonk">开局/foreground_monk_cliff_flag.png</option>
                  <option value="openingCloak">开局/opening_mid_cloak.png</option>
                </select>
              </div>
              <div class="field">
                <label for="attachmentOffsetXInput">贴图 X</label>
                <input id="attachmentOffsetXInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentOffsetYInput">贴图 Y</label>
                <input id="attachmentOffsetYInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentWidthInput">贴图宽度</label>
                <input id="attachmentWidthInput" type="number" min="1" step="1" />
              </div>
              <div class="field">
                <label for="attachmentLengthScaleInput">拉伸比例</label>
                <input id="attachmentLengthScaleInput" type="number" min="0.1" step="0.05" />
              </div>
              <div class="field">
                <label for="attachmentRotationInput">贴图旋转</label>
                <input id="attachmentRotationInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentAlphaInput">透明度</label>
                <input id="attachmentAlphaInput" type="number" min="0" max="1" step="0.05" />
              </div>
              <div class="field">
                <label for="attachmentLayerInput">图层</label>
                <input id="attachmentLayerInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentAnchorXInput">锚点 X</label>
                <input id="attachmentAnchorXInput" type="number" min="0" max="1" step="0.05" />
              </div>
              <div class="field checkbox-field">
                <label for="attachmentSegmentsInput">
                  <input id="attachmentSegmentsInput" type="checkbox" />
                  分段弯曲
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="attachmentReverseInput">
                  <input id="attachmentReverseInput" type="checkbox" />
                  反向贴图
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="attachmentScarfEnabledInput">
                  <input id="attachmentScarfEnabledInput" type="checkbox" />
                  头巾弹簧
                </label>
              </div>
              <div class="field">
                <label for="attachmentScarfSplitInput">头巾分割</label>
                <input id="attachmentScarfSplitInput" type="number" min="0.05" max="0.95" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfRootXInput">弹簧 X</label>
                <input id="attachmentScarfRootXInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfRootYInput">弹簧 Y</label>
                <input id="attachmentScarfRootYInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfTipXInput">弹簧长度</label>
                <input id="attachmentScarfTipXInput" type="number" min="0.05" max="2" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfTipYInput">弹簧角度</label>
                <input id="attachmentScarfTipYInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="attachmentScarfStiffnessInput">弹簧强度</label>
                <input id="attachmentScarfStiffnessInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfDampingInput">弹簧阻尼</label>
                <input id="attachmentScarfDampingInput" type="number" min="0" max="0.99" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentScarfGravityInput">弹簧重力</label>
                <input id="attachmentScarfGravityInput" type="number" step="10" />
              </div>
              <div class="field">
                <label for="attachmentScarfWaveInput">弹簧摆幅</label>
                <input id="attachmentScarfWaveInput" type="number" min="0" step="0.1" />
              </div>
              <div class="field checkbox-field">
                <label for="attachmentHemEnabledInput">
                  <input id="attachmentHemEnabledInput" type="checkbox" />
                  下摆弹簧
                </label>
              </div>
              <div class="field">
                <label for="attachmentHemXInput">下摆 X</label>
                <input id="attachmentHemXInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentHemYInput">下摆 Y</label>
                <input id="attachmentHemYInput" type="number" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentHemLengthInput">下摆长度</label>
                <input id="attachmentHemLengthInput" type="number" min="0.05" max="2" step="0.01" />
              </div>
              <div class="field">
                <label for="attachmentHemAngleInput">下摆角度</label>
                <input id="attachmentHemAngleInput" type="number" step="1" />
              </div>
            </div>
            <div class="button-row">
              <button id="keyframeBtn" class="primary" type="button">记录关键帧</button>
              <button id="deleteNodeBtn" class="danger" type="button">删除节点</button>
            </div>
            <div class="button-row three">
              <button id="keySourcePrevBtn" class="mode-button" type="button">上一关键帧</button>
              <button id="keySourceNextBtn" class="mode-button" type="button">下一关键帧</button>
              <button id="keySourceStartBtn" class="mode-button" type="button">起始帧</button>
            </div>
          </section>
          <section class="panel-section">
            <div class="panel-title">工程 JSON</div>
            <textarea id="jsonPreview"></textarea>
            <div class="button-row">
              <button id="copyJsonBtn" type="button">复制</button>
              <button id="applyJsonBtn" type="button">应用文本</button>
            </div>
          </section>
        </aside>
      </main>

      <section class="timeline">
        <div class="timeline-top">
          <div class="transport">
            <button id="prevFrameBtn" type="button">◀</button>
            <button id="playBtn" type="button">播放</button>
            <button id="nextFrameBtn" type="button">▶</button>
            <input id="frameInput" class="small-input" type="number" min="1" step="1" />
          </div>
          <div class="timeline-meta">
            <span id="timeStatus" class="status"></span>
          </div>
          <div class="timeline-actions">
            <button id="deleteKeyBtn" class="danger" type="button">删关键帧</button>
            <button id="snapAllBtn" type="button">全部记录</button>
          </div>
        </div>
        <div class="timeline-body">
          <div id="trackLabels" class="track-labels"></div>
          <div id="tracksViewport" class="tracks-viewport">
            <div id="tracks" class="tracks"></div>
          </div>
        </div>
      </section>

      function selectedNode() {

      }

      function attachmentEditNode(node = selectedNode()) {
        if (!node) return null;
        if (node.attachment) return node;
        return (
          state.nodes.find(
            (item) => item.attachment?.segments && item.attachment.chainTo === node.id,

      }

      function attachmentEditContext(node = selectedNode()) {
        const owner = attachmentEditNode(node);
        if (!owner?.attachment) return { owner, lower: false };
        return { owner, lower: owner.id !== node?.id && owner.attachment.chainTo === node?.id };
      }

      function selectedAttachmentView(node = selectedNode()) {
        const context = attachmentEditContext(node);
        if (!context.owner?.attachment) return null;
        return context.lower
          ? { ...context.owner.attachment, ...(context.owner.attachment.lower || {}) }
          : context.owner.attachment;

      function clampFrame(frame) {
        return Math.max(0, Math.min(state.duration, Math.round(frame)));
      }

      function sortedNodes() {
        const result = [];
        const walk = (parentId, depth) => {
          state.nodes
            .filter((node) => node.parentId === parentId)
            .forEach((node) => {
              result.push({ ...node, depth });
              walk(node.id, depth + 1);
            });
        };
        walk(null, 0);
        state.nodes
          .filter((node) => !result.some((item) => item.id === node.id))
          .forEach((node) => result.push({ ...node, depth: 0 }));
        return result;
      }

      function getLocalPose(node, frame = state.currentFrame) {
        const override = ignorePoseOverrides ? null : poseOverrides.get(node.id);
        if (override) return { ...node, ...override };
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        if (keys.length === 0) return { ...node };
        const exact = keys.find((item) => item.frame === frame);
        if (exact) return { ...node, ...exact };
        if (keys.length === 1) return { ...node, ...keys[0] };
        const before = [...keys].reverse().find((item) => item.frame < frame);
        const after = keys.find((item) => item.frame > frame);
        if (!before) return { ...node, ...keys[0] };
        if (!after) {
          const start = keys.find((item) => item.frame === 0) || keys[0];
          const loopEndFrame = state.duration + 1;
          const span = Math.max(1, loopEndFrame - before.frame);
          const t = Math.max(0, Math.min(1, (frame - before.frame) / span));
          return interpolateLocalPose(node, before, start, t);
        }
        const t = (frame - before.frame) / (after.frame - before.frame);
        return interpolateLocalPose(node, before, after, t);
      }

      function interpolateLocalPose(node, before, after, t) {
        return {
          ...node,
          x: lerp(before.x, after.x, t),
          y: lerp(before.y, after.y, t),
          rotation: lerpAngle(before.rotation, after.rotation, t),
          length: lerp(before.length, after.length, t),
          scaleX: lerp(before.scaleX, after.scaleX, t),
          scaleY: lerp(before.scaleY, after.scaleY, t),
        };
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpAngle(a, b, t) {
        let diff = ((b - a + 180) % 360) - 180;
        if (diff < -180) diff += 360;
        return a + diff * t;
      }

      function worldPose(node, frame = state.currentFrame, seen = new Set()) {
        if (seen.has(node.id)) return getLocalPose(node, frame);
        seen.add(node.id);
        const local = getLocalPose(node, frame);
        if (!node.parentId) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const parent = state.nodes.find((item) => item.id === node.parentId);
        if (!parent) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const p = worldPose(parent, frame, seen);
        const anchor = endPoint(p);
        const rad = (p.worldRotation * Math.PI) / 180;
        const px = local.x * p.worldScaleX;
        const py = local.y * p.worldScaleY;
        const rotatedX = px * Math.cos(rad) - py * Math.sin(rad);
        const rotatedY = px * Math.sin(rad) + py * Math.cos(rad);
        return {
          ...local,
          worldX: anchor.x + rotatedX,
          worldY: anchor.y + rotatedY,
          worldRotation: p.worldRotation + local.rotation,
          worldScaleX: p.worldScaleX * local.scaleX,
          worldScaleY: p.worldScaleY * local.scaleY,
        };
      }

      function getRestLocalPose(node) {
        return { ...node, ...(node.bindPose || {}) };
      }

      function restWorldPose(node, seen = new Set()) {
        if (seen.has(node.id)) return getRestLocalPose(node);
        seen.add(node.id);
        const local = getRestLocalPose(node);
        if (!node.parentId) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const parent = state.nodes.find((item) => item.id === node.parentId);
        if (!parent) {
          return {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        }
        const p = restWorldPose(parent, seen);
        const anchor = endPoint(p);
        const rad = (p.worldRotation * Math.PI) / 180;
        const px = local.x * p.worldScaleX;
        const py = local.y * p.worldScaleY;
        const rotatedX = px * Math.cos(rad) - py * Math.sin(rad);
        const rotatedY = px * Math.sin(rad) + py * Math.cos(rad);
        return {
          ...local,
          worldX: anchor.x + rotatedX,
          worldY: anchor.y + rotatedY,
          worldRotation: p.worldRotation + local.rotation,
          worldScaleX: p.worldScaleX * local.scaleX,
          worldScaleY: p.worldScaleY * local.scaleY,
        };
      }

      function endPoint(pose) {
        const rad = (pose.worldRotation * Math.PI) / 180;
        return {
          x: pose.worldX + Math.cos(rad) * pose.length * pose.worldScaleX,
          y: pose.worldY + Math.sin(rad) * pose.length * pose.worldScaleY,
        };
      }

      function resizeCanvas() {
        const rect = el.stage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        el.stage.width = Math.max(1, Math.floor(rect.width * dpr));
        el.stage.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawStage();

      function drawStage() {
        const rect = el.stage.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        drawAxes(rect);
        const nodes = sortedNodes();
        drawUnderlayImages();

            nodes.forEach((node) => drawBone(node, node.id === state.selectedNodeId));

          drawTextureHandles(nodes);
        } else {

        drawCreateBonePreview();

      function drawUnderlayImages() {
        if (!state.underlayImages?.length) return;
        state.underlayImages.forEach((underlay) => {
          if (underlay.kind === "dragonRig") drawDragonRig(underlay);
          else if (underlay.kind === "windCloth") drawWindPlacedImage(underlay);
          else drawPlacedImage(underlay);
        });
      }

      function drawOverlayImages() {
        if (!state.overlayImages?.length) return;
        state.overlayImages.forEach((overlay) => drawPlacedImage(overlay));
      }

      function drawReferenceImage() {
        const reference = state.referenceImage;
        drawPlacedImage(reference);
      }

      function drawPlacedImage(reference) {
        if (!reference) return;
        const image = warriorImages[reference.image];
        if (!image?.complete) return;
        ctx.save();
        setDrawAlpha(reference.alpha ?? 1);
        const drift = placedDriftOffset(reference);
        ctx.translate(
          (reference.x || 0) + movingImageOffsetX(reference, image) + drift.x,
          (reference.y || 0) + drift.y,
        );
        ctx.rotate(((reference.rotation || 0) * Math.PI) / 180);
        const scale = reference.scale || 1;
        ctx.drawImage(image, 0, 0, image.width * scale, image.height * scale);
        ctx.restore();
      }

      function drawDragonRig(reference) {
        const image = warriorImages[reference.image];
        if (!image?.complete) return;
        const scale = reference.scale || 1;
        const bounds = reference.sourceBounds || [789, 62, 1772, 741];
        const segmentCount = Math.max(3, Math.round(reference.segments || 9));
        const overlap = Math.max(0, Number(reference.overlap) || 18);
        const period = Math.max(2, Number(reference.period) || 9);
        const seconds = (performance.now() - dragonStartTime) / 1000;
        const cycle = (seconds % period) / period;
        const appear = smoothStep(0.04, 0.16, cycle);
        const travel = cycle < 0.72 ? smoothStep(0.12, 0.72, cycle) : 1;
        const vanish = smoothStep(0.58, 0.78, cycle);
        const baseAlpha = appear * (1 - vanish);
        const spawnEase = 1 - smoothStep(0.04, 0.28, cycle);
        const globalX = (Number(reference.spawnX) || 0) * spawnEase + (Number(reference.travelX) || 28) * travel;
        const globalY = (Number(reference.spawnY) || 0) * spawnEase + (Number(reference.travelY) || 24) * travel;
        const width = bounds[2] - bounds[0];
        const segmentWidth = width / segmentCount;

        ctx.save();
        ctx.translate(reference.x || 0, reference.y || 0);
        for (let index = 0; index < segmentCount; index += 1) {
          const u = index / Math.max(1, segmentCount - 1);
          const sourceX = Math.max(0, Math.floor(bounds[0] + segmentWidth * index - overlap));
          const sourceRight = Math.min(image.width, Math.ceil(bounds[0] + segmentWidth * (index + 1) + overlap));
          const sourceY = bounds[1];
          const sourceW = Math.max(1, sourceRight - sourceX);
          const sourceH = bounds[3] - bounds[1];
          const destX = sourceX * scale;
          const destY = sourceY * scale;
          const destW = sourceW * scale;
          const destH = sourceH * scale;
          const pivotX = destX + destW * 0.5;
          const pivotY = destY + destH * 0.5;
          const wave = Math.sin(cycle * Math.PI * 2 + u * Math.PI * 1.7);
          const weight = 0.35 + Math.sin(u * Math.PI) * 0.65;
          const tailWeight = Math.pow(Math.max(0, 1 - u / 0.34), 1.7);
          const tailWave = Math.sin(cycle * Math.PI * 2.8 + u * Math.PI * 2.4);
          const vanishLead = smoothStep(0.32 + (1 - u) * 0.22, 0.76 + (1 - u) * 0.12, cycle);
          const alpha = Math.max(0, Math.min(1, baseAlpha * (1 - vanishLead * 0.45)));
          const drillX = (Number(reference.drillX) || 42) * vanishLead;
          const drillY = (Number(reference.drillY) || -34) * vanishLead;
          const tailRotate = (Number(reference.tailTwist) || 0) * tailWave * tailWeight * (1 - vanish * 0.55);
          const tailX = (Number(reference.tailDriftX) || 0) * tailWave * tailWeight;
          const tailY = (Number(reference.tailDriftY) || 0) * tailWave * tailWeight;
          const rotate =
            (((Number(reference.twist) || 5) * wave * weight * (1 - vanish * 0.45) + tailRotate) * Math.PI) /
            180;

          ctx.save();
          setDrawAlpha((reference.alpha ?? 1) * alpha);
          ctx.translate(
            pivotX + (globalX + drillX + tailX) * scale,
            pivotY + (globalY + drillY + tailY) * scale,
          );
          ctx.rotate(rotate);
          ctx.drawImage(
            image,
            sourceX,
            sourceY,
            sourceW,
            sourceH,
            -destW * 0.5,
            -destH * 0.5,
            destW,
            destH,
          );
          ctx.restore();
        }
        ctx.restore();
      }

      function smoothStep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / Math.max(0.0001, edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function movingImageOffsetX(reference, image) {
        if (!reference.moveXSpeed) return 0;
        const bounds = reference.wrapBounds || [0, 0, image.width, image.height];
        const scale = reference.scale || 1;
        const viewportWidth = Number(reference.wrapViewportWidth) || image.width * scale;
        const left = Number(bounds[0]) || 0;
        const right = Number(bounds[2]) || image.width;
        const start = -right * scale;
        const end = viewportWidth - left * scale;
        const span = Math.max(1, end - start);
        const seconds = (performance.now() - cloudStartTime) / 1000;
        const initialOffset = Number(reference.moveXOffset) || 0;
        const progress = seconds * reference.moveXSpeed + initialOffset - start;
        return start + positiveModulo(progress, span);
      }

      function positiveModulo(value, modulo) {
        return ((value % modulo) + modulo) % modulo;
      }

      function placedDriftOffset(reference) {
        if (!reference.driftX && !reference.driftY) return { x: 0, y: 0 };
        const duration = Math.max(1, Number(reference.driftDuration) || 40);
        const phase = Number(reference.driftPhase) || 0;
        const seconds = (performance.now() - boatStartTime) / 1000;
        const t = positiveModulo(seconds / duration + phase, 1);
        const raw = t <= 0.5 ? t * 2 : (1 - t) * 2;
        const eased = raw * raw * (3 - 2 * raw);
        return {
          x: (Number(reference.driftX) || 0) * eased,
          y: (Number(reference.driftY) || 0) * eased,
        };
      }

      function drawClothOverlays() {
        if (!state.clothOverlays?.length) return;
        state.clothOverlays.forEach((overlay, index) => {
          const image = warriorImages[overlay.image];
          if (!image?.complete) return;
          drawWindClothOverlay(image, overlay, index);
        });
      }

      function drawWindClothOverlay(image, overlay, index) {
        const mesh = buildWindClothMesh(image, overlay);
        if (overlay.solver === "analytic") {
          drawTexturedMesh(image, mesh.source, mesh.dest, overlay.alpha);
          return;
        }
        const points = solveGravityMesh(`overlay-cloth:${overlay.id || index}`, mesh.dest, {
          stiffness: overlay.stiffness,
          damping: overlay.damping,
          gravity: overlay.gravity,
        });
        drawTexturedMesh(image, mesh.source, points, overlay.alpha);
      }

      function drawWindPlacedImage(overlay) {
        const image = warriorImages[overlay.image];
        if (!image?.complete) return;
        const mesh = buildWindClothMesh(image, overlay);
        drawTexturedMesh(image, mesh.source, mesh.dest, overlay.alpha);
      }

      function buildWindClothMesh(image, overlay) {
        const cols = Math.max(3, Math.round(overlay.cols));
        const rows = Math.max(3, Math.round(overlay.rows));
        const scale = overlay.scale || 1;
        const width = image.width * scale;
        const height = image.height * scale;
        const seconds = state.currentFrame / Math.max(1, state.fps);
        const source = [];
        const dest = [];
        const motion = overlay.motionMode === "pingpong"
          ? pingPongMotion(overlay)
          : sineMotion(seconds, overlay);
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const topLooseness = Math.max(0, Math.min(0.35, Number(overlay.topLooseness) || 0));
          const sourceRow = [];
          const destRow = [];
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            const leftLooseness = Math.max(0, Math.min(0.35, Number(overlay.leftLooseness) || 0));
            const looseness =
              overlay.weightMode === "left"
                ? leftLooseness + (1 - leftLooseness) * Math.pow(u, 1.35)
                : topLooseness + (1 - topLooseness) * Math.pow(v, 1.45);
            const rightDownBias = Math.max(0, Math.min(0.6, Number(overlay.rightDownBias) || 0));
            const rightDownWeight = 1 + rightDownBias * u * Math.pow(v, 1.2);
            const clothWeight = looseness * rightDownWeight;
            const windX = motion.swing * overlay.amplitude * clothWeight;
            const windY = motion.lift * overlay.verticalAmplitude * clothWeight * 0.35;
            sourceRow.push({
              x: image.width * u,
              y: image.height * v,
            });
            destRow.push({
              x: overlay.x + width * u + windX,
              y: overlay.y + height * v + overlay.sag * clothWeight + windY,
            });
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        return { source, dest };
      }

      function sineMotion(seconds, overlay) {
        return {
          swing: Math.sin(seconds * overlay.speed * Math.PI * 2 + overlay.phase),
          lift: Math.sin(seconds * overlay.speed * Math.PI * 2 + overlay.phase + Math.PI / 2),
        };
      }

      function pingPongMotion(overlay) {
        const duration = Math.max(1, state.duration);
        const frame = Math.max(0, Math.min(duration, state.currentFrame));
        const phaseOffset = Number.isFinite(Number(overlay.phaseOffset)) ? Number(overlay.phaseOffset) : 0;
        const t = (frame / duration + phaseOffset) % 1;
        const raw = t <= 0.5 ? t * 2 : (1 - t) * 2;
        const eased = raw * raw * (3 - 2 * raw);
        return {
          swing: eased * (Number(overlay.directionX) || 1),
          lift: eased * (Number(overlay.directionY) || 0),
        };
      }

      function drawPreviousKeyGhost(nodes) {
        const frame = previousKeyFrameForSelected();
        if (frame === null) return;
        const currentFrame = state.currentFrame;
        const previousAlpha = drawAlphaMultiplier;
        const previousIgnore = ignorePoseOverrides;
        state.currentFrame = frame;
        drawAlphaMultiplier = 0.28;
        ignorePoseOverrides = true;
        ctx.save();
        if (state.renderMode === "texture") {
          drawWarriorTextures();
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, false));
        } else {
          nodes.forEach((node) => drawParentLink(node));
          nodes.forEach((node) => drawBone(node, false));
        }
        ctx.restore();
        ignorePoseOverrides = previousIgnore;
        drawAlphaMultiplier = previousAlpha;
        state.currentFrame = currentFrame;
      }

      function previousKeyFrameForSelected() {
        const node = selectedNode();
        if (!node) return null;
        const currentFrame = Number(state.currentFrame);
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        const previous = [...keys].reverse().find((item) => item.frame < currentFrame - 0.001);
        return previous?.frame ?? null;
      }

      function drawAxes(rect) {
        ctx.save();
        ctx.strokeStyle = "#ffffff10";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, rect.height / 2);
        ctx.lineTo(rect.width, rect.height / 2);
        ctx.moveTo(rect.width / 2, 0);
        ctx.lineTo(rect.width / 2, rect.height);
        ctx.stroke();
        ctx.restore();
      }

      function drawBone(node, active) {
        const pose = worldPose(node);
        const end = endPoint(pose);
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = node.color;
        ctx.lineWidth = active ? 9 : 6;
        setDrawAlpha(active ? 1 : 0.78);
        ctx.beginPath();
        ctx.moveTo(pose.worldX, pose.worldY);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();

        setDrawAlpha(1);
        ctx.fillStyle = active ? "#ffffff" : node.color;
        ctx.strokeStyle = active ? varColor("--accent-2") : "#00000080";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pose.worldX, pose.worldY, active ? 8 : 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = active ? varColor("--accent-2") : "#ffffff";
        ctx.beginPath();
        ctx.arc(end.x, end.y, active ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#eef2f5";
        ctx.font = "12px sans-serif";
        ctx.fillText(node.name, pose.worldX + 10, pose.worldY - 8);
        ctx.restore();
      }

      function drawWarriorTextures() {
        const texturedNodes = state.nodes.filter((node) => node.attachment);
        if (texturedNodes.length === 0) return;
        texturedNodes
          .slice()
          .sort((a, b) => {
            const layerDiff = (a.attachment.layer || 0) - (b.attachment.layer || 0);
            if (layerDiff) return layerDiff;
            return (a.attachment.alpha || 1) - (b.attachment.alpha || 1);
          })
          .forEach((node) => drawAttachment(node));
      }

      function drawAttachment(node) {
        const attachment = node.attachment;
        const image = warriorImages[attachment.image];
        if (!image?.complete) return;
        const pose = worldPose(node);
        if (attachment.fullSkin) {
          drawFullSkinAttachment(attachment, image);
          return;
        }
        if (attachment.segments && attachment.chainTo) {
          drawSegmentedAttachment(node, attachment, image);
          return;
        }
        if (attachment.image === "head") {
          drawHeadAttachment(node, attachment, image);
          return;
        }
        let start = { x: pose.worldX, y: pose.worldY };
        let end = endPoint(pose);
        if (attachment.chainTo) {
          const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
          if (!chainNode) return;
          end = endPoint(worldPose(chainNode));
        }
        if (attachment.reverse) {
          const nextStart = end;
          end = start;
          start = nextStart;
        }
        const length = Math.max(8, distance(start, end) * attachment.lengthScale);
        if (attachment.image === "body" && attachment.hemEnabled) {
          drawBodyWithSpringHem(image, start, end, attachment, length, node.id);
          return;
        }
        drawImageAlong(
          image,
          start,
          end,
          attachment.width,
          length,
          attachment.alpha,
          attachment.anchorX,
          attachment.rotationOffset,
          attachment.offsetX,
          attachment.offsetY,
        );
      }

      function drawBodyWithSpringHem(image, start, end, attachment, length, nodeId) {
        const cutRatio = attachment.hemY;
        const sourceCut = Math.round(image.height * cutRatio);
        const seamOverlap = Math.min(4, Math.max(1, attachment.width * 0.04));
        const sourceOverlap = Math.min(6, Math.max(1, Math.round(image.height * 0.02)));
        const topLength = Math.max(1, length * cutRatio + seamOverlap);
        drawImageSliceAlong(
          image,
          start,
          end,
          attachment.width,
          topLength,
          attachment.alpha,
          attachment.anchorX,
          0,
          Math.min(image.height, sourceCut + sourceOverlap),
          attachment.rotationOffset,
          attachment.offsetX,
          attachment.offsetY,
        );
        const hemSourceStart = Math.max(0, sourceCut - sourceOverlap);
        const hemAnchorY = Math.max(0, cutRatio - seamOverlap / length);
        drawSpringCloth(nodeId, image, start, end, attachment, {
            sourceStart: hemSourceStart,
            sourceSize: Math.max(1, image.height - hemSourceStart),
            anchorX: attachment.hemX,
            anchorY: hemAnchorY,
            length: attachment.hemLength,
            angle: attachment.hemAngle,
            width: attachment.width,
            alpha: attachment.alpha,
            drawnLength: length,
          });
      }

      function drawSegmentedAttachment(node, attachment, image) {
        const chainNode = state.nodes.find((item) => item.id === attachment.chainTo);
        if (!chainNode) return;
        const lowerAttachment = { ...attachment, ...(attachment.lower || {}) };
        const upperPose = worldPose(node);
        const lowerPose = worldPose(chainNode);
        const shoulder = { x: upperPose.worldX, y: upperPose.worldY };
        const elbow = { x: lowerPose.worldX, y: lowerPose.worldY };
        const hand = endPoint(lowerPose);
        const upperRestPose = restWorldPose(node);
        const lowerRestPose = restWorldPose(chainNode);
        const restShoulder = { x: upperRestPose.worldX, y: upperRestPose.worldY };
        const restElbow = { x: lowerRestPose.worldX, y: lowerRestPose.worldY };
        const restHand = endPoint(lowerRestPose);
        drawSkinnedAttachment(image, [
          {
            sourceY: 0,
            sourceHeight: image.height / 2,
            width: attachment.width,
            anchorX: attachment.anchorX,
            rotationOffset: attachment.rotationOffset,
            offsetX: attachment.offsetX,
            offsetY: attachment.offsetY,
            restStart: restShoulder,
            restEnd: restElbow,
            start: shoulder,
            end: elbow,
          },
          {
            sourceY: image.height / 2,
            sourceHeight: image.height / 2,
            width: lowerAttachment.width,
            anchorX: lowerAttachment.anchorX,
            rotationOffset: lowerAttachment.rotationOffset,
            offsetX: lowerAttachment.offsetX,
            offsetY: lowerAttachment.offsetY,
            restStart: restElbow,
            restEnd: restHand,
            start: elbow,
            end: hand,
          },
        ], attachment.alpha);
      }

      function drawSkinnedAttachment(image, segments, alpha) {
        const cols = 6;
        const rows = 13;
        const source = [];
        const dest = [];
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          const sourceY = image.height * v;
          const segment = sourceY < image.height / 2 ? segments[0] : segments[1];
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            const sourcePoint = {
              x: image.width * u,
              y: sourceY,
            };
            const restPoint = imagePointToSegmentRest(sourcePoint, image, segment, u);
            sourceRow.push(sourcePoint);
            destRow.push(deformByAttachmentSegments(restPoint, segments));
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        drawTexturedMesh(image, source, dest, alpha);
      }

      function drawFullSkinAttachment(attachment, image) {
        const segments = (attachment.skinBoneIds || [])
          .map((nodeId) => state.nodes.find((item) => item.id === nodeId))
          .filter(Boolean)
          .map((boneNode) => {
            const pose = worldPose(boneNode);
            const rest = restWorldPose(boneNode);
            return {
              restStart: { x: rest.worldX, y: rest.worldY },
              restEnd: endPoint(rest),
              start: { x: pose.worldX, y: pose.worldY },
              end: endPoint(pose),
            };
          });
        if (segments.length === 0 || !attachment.restPart) return;

        const cols = attachment.restPart.partId === "torso" ? 5 : 4;
        const rows = Math.max(6, segments.length * 5);
        const source = [];
        const dest = [];
        for (let row = 0; row <= rows; row += 1) {
          const v = row / rows;
          const sourceRow = [];
          const destRow = [];
          for (let col = 0; col <= cols; col += 1) {
            const u = col / cols;
            const sourcePoint = {
              x: image.width * u,
              y: image.height * v,
            };
            sourceRow.push(sourcePoint);
            destRow.push(
              deformByAttachmentSegments(
                imagePointToFullSkinRest(sourcePoint, image, attachment.restPart),
                segments,
              ),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        drawTexturedMesh(image, source, dest, attachment.alpha);
      }

      function imagePointToFullSkinRest(sourcePoint, image, restPart) {
        const width = image.width * restPart.scale;
        const height = image.height * restPart.scale;
        const localX = (sourcePoint.x / image.width) * width - width * restPart.anchorX;
        const localY = (sourcePoint.y / image.height) * height - height * restPart.anchorY;
        const angle = (restPart.rotation * Math.PI) / 180;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: restPart.x + localX * cos - localY * sin,
          y: restPart.y + localX * sin + localY * cos,
        };
      }

      function imagePointToSegmentRest(sourcePoint, image, segment, u) {
        const relY = (sourcePoint.y - segment.sourceY) / Math.max(1, segment.sourceHeight);
        const restLength = distance(segment.restStart, segment.restEnd);
        const angle =
          Math.atan2(segment.restEnd.y - segment.restStart.y, segment.restEnd.x - segment.restStart.x) -
          Math.PI / 2 +
          (segment.rotationOffset * Math.PI) / 180;
        const x = -segment.width * segment.anchorX + segment.offsetX + segment.width * u;
        const y = segment.offsetY + restLength * relY;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: segment.restStart.x + x * cos - y * sin,
          y: segment.restStart.y + x * sin + y * cos,
        };
      }

      function deformByAttachmentSegments(point, segments) {
        let totalWeight = 0;
        const blended = { x: 0, y: 0 };
        for (const segment of segments) {
          const projection = projectPointOnSegment(point, segment.restStart, segment.restEnd);
          const weight = attachmentSegmentWeight(distance(point, projection.point), segment);
          const mapped = mapPointByAttachmentSegment(point, segment);
          blended.x += mapped.x * weight;
          blended.y += mapped.y * weight;
          totalWeight += weight;
        }
        if (totalWeight <= 0) return point;
        return {
          x: blended.x / totalWeight,
          y: blended.y / totalWeight,
        };
      }

      function mapPointByAttachmentSegment(point, segment) {
        const restLength = Math.max(1, distance(segment.restStart, segment.restEnd));
        const currentLength = Math.max(1, distance(segment.start, segment.end));
        const restDir = normalizeVector({
          x: segment.restEnd.x - segment.restStart.x,
          y: segment.restEnd.y - segment.restStart.y,
        });
        const currentDir = normalizeVector({
          x: segment.end.x - segment.start.x,
          y: segment.end.y - segment.start.y,
        });
        const restNormal = { x: -restDir.y, y: restDir.x };
        const currentNormal = { x: -currentDir.y, y: currentDir.x };
        const local = {
          x: point.x - segment.restStart.x,
          y: point.y - segment.restStart.y,
        };
        const scale = currentLength / restLength;
        const softenedScale = 1 + (scale - 1) * 0.72;
        const axial = dotVector(local, restDir) * softenedScale;
        const lateral = dotVector(local, restNormal);
        return {
          x: segment.start.x + currentDir.x * axial + currentNormal.x * lateral,
          y: segment.start.y + currentDir.y * axial + currentNormal.y * lateral,
        };
      }

      function attachmentSegmentWeight(distanceToSegment, segment) {
        const length = distance(segment.restStart, segment.restEnd);
        const reach = Math.max(16, length * 0.34);
        const normalizedDistance = distanceToSegment / reach;
        const base = 1 / ((normalizedDistance + 0.18) * (normalizedDistance + 0.18));
        return base * Math.sqrt(base);
      }

      function projectPointOnSegment(point, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (lengthSquared === 0) return { point: { ...a }, t: 0 };
        const t = Math.max(
          0,
          Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared),
        );
        return {
          point: { x: a.x + dx * t, y: a.y + dy * t },
          t,
        };
      }

      function normalizeVector(vector) {
        const length = Math.hypot(vector.x, vector.y) || 1;
        return { x: vector.x / length, y: vector.y / length };
      }

      function dotVector(a, b) {
        return a.x * b.x + a.y * b.y;
      }

      function drawHeadAttachment(node, attachment, image) {
        const pose = worldPose(node);
        const center = {
          x: pose.worldX + attachment.offsetX,
          y: pose.worldY + attachment.offsetY,
        };
        const width = attachment.width;
        const height = width * 0.96;
        const baseX = -width * 0.5;
        const baseY = -width * 0.55;
        const headAngle = ((pose.worldRotation + 90 + attachment.rotationOffset) * Math.PI) / 180;
        const scarfSourceEnd = Math.min(image.width, Math.round(image.width * attachment.scarfSplit));
        const headSourceX = Math.max(0, Math.round(image.width * Math.max(0, attachment.scarfSplit - 0.18)));
        const headDestX = baseX + (headSourceX / image.width) * width;
        const headDestWidth = width * ((image.width - headSourceX) / image.width);
        if (attachment.scarfEnabled) {
          drawSpringScarf(node, attachment, image, center, headAngle, {
            baseX,
            baseY,
            width,
            height,
            imageWidth: image.width,
            imageHeight: image.height,
            sourceEnd: scarfSourceEnd,
            rootX: attachment.scarfRootX,
            rootY: attachment.scarfRootY,
            length: attachment.scarfLength,
            angle: attachment.scarfAngle,
            stiffness: attachment.scarfStiffness,
            damping: attachment.scarfDamping,
            gravity: attachment.scarfGravity,
            wave: attachment.scarfWave,
          });
        }
        ctx.save();
        setDrawAlpha(attachment.alpha);
        ctx.translate(center.x, center.y);
        ctx.rotate(headAngle);
        if (attachment.scarfEnabled) {
          ctx.drawImage(
            image,
            headSourceX,
            0,
            image.width - headSourceX,
            image.height,
            headDestX,
            baseY,
            headDestWidth,
            height,
          );
        } else {
          ctx.drawImage(image, baseX, baseY, width, height);
        }
        ctx.restore();
      }

      function drawSpringScarf(node, attachment, image, center, angle, layout) {
        const mesh = buildScarfMesh(center, angle, layout);
        const points = solveGravityMesh(`scarf:${node.id}`, mesh.dest, {
          stiffness: layout.stiffness,
          damping: layout.damping,
          gravity: layout.gravity,
        });
        drawTexturedMesh(image, mesh.source, points, attachment.alpha);
      }

      function solveSpringScarf(nodeId, center, angle, layout) {
        const rest = scarfRestPoints(center, angle, layout);
        return solveSpringPoints(`scarf:${nodeId}`, rest, layout);
      }

      function solveSpringPoints(key, rest, layout) {
        let sim = dynamicScarves.get(key);
        const now = performance.now();
        const shouldReset =
          !state.playing ||
          !sim ||
          Math.abs((sim.frame ?? state.currentFrame) - state.currentFrame) > 4 ||
          now - (sim.time || now) > 250;
        if (shouldReset) {
          sim = {
            points: rest.map((point) => ({ ...point })),
            previous: rest.map((point) => ({ ...point })),
            frame: state.currentFrame,
            time: now,
          };
          dynamicScarves.set(key, sim);
          return sim.points;
        }

        const dt = Math.min(1 / 24, Math.max(1 / 120, (now - sim.time) / 1000));
        sim.time = now;
        sim.frame = state.currentFrame;
        sim.points[0] = { ...rest[0] };
        sim.previous[0] = { ...rest[0] };
        for (let index = 1; index < sim.points.length; index += 1) {
          const point = sim.points[index];
          const previous = sim.previous[index];
          const old = { ...point };
          point.x +=
            (point.x - previous.x) * layout.damping +
            (rest[index].x - point.x) * layout.stiffness;
          point.y +=
            (point.y - previous.y) * layout.damping +
            (rest[index].y - point.y) * layout.stiffness +
            layout.gravity * dt * dt;
          sim.previous[index] = old;
        }
        const segmentLengths = rest.slice(1).map((point, index) => distance(rest[index], point));
        for (let pass = 0; pass < 4; pass += 1) {
          sim.points[0] = { ...rest[0] };
          for (let index = 1; index < sim.points.length; index += 1) {
            const prev = sim.points[index - 1];
            const point = sim.points[index];
            const dx = point.x - prev.x;
            const dy = point.y - prev.y;
            const currentLength = Math.hypot(dx, dy) || 1;
            const correction = (currentLength - segmentLengths[index - 1]) / currentLength;
            point.x -= dx * correction;
            point.y -= dy * correction;
          }
        }
        return sim.points;
      }

      function scarfRestPoints(center, angle, layout) {
        const scale = (layout.width / 67) * layout.wave;
        const rootX = layout.baseX + layout.rootX * layout.width;
        const rootY = layout.baseY + layout.rootY * layout.height;
        const clothAngle = (layout.angle * Math.PI) / 180;
        const clothLength = layout.length * layout.width;
        const tipX = rootX + Math.cos(clothAngle) * clothLength;
        const tipY = rootY + Math.sin(clothAngle) * clothLength;
        const localPoints = [
          { x: rootX, y: rootY },
          { x: rootX * 0.65 + tipX * 0.35, y: rootY * 0.65 + tipY * 0.35 + layout.height * 0.04 },
          { x: rootX * 0.3 + tipX * 0.7, y: rootY * 0.3 + tipY * 0.7 + layout.height * 0.08 },
          { x: tipX, y: tipY },
        ];
        return localPoints.map((point, index) =>
          rotateLocalPoint(
            center,
            angle,
            point.x,
            point.y + (index > 0 ? Math.sin((state.currentFrame / state.fps) * Math.PI * 2 + index) * scale : 0),
          ),
        );
      }

      function drawSpringCloth(nodeId, image, start, end, attachment, options) {
        const drawAngle =
          Math.atan2(end.y - start.y, end.x - start.x) -
          Math.PI / 2 +
          (attachment.rotationOffset * Math.PI) / 180;
        const drawnLength = Math.max(8, distance(start, end) * attachment.lengthScale);
        const localToWorld = (point) => {
          const cos = Math.cos(drawAngle);
          const sin = Math.sin(drawAngle);
          const x = -attachment.width * attachment.anchorX + attachment.offsetX + point.x;
          const y = attachment.offsetY + point.y;
          return {
            x: start.x + x * cos - y * sin,
            y: start.y + x * sin + y * cos,
          };
        };
        const mesh = buildHemMesh(image, attachment, options, drawnLength, localToWorld);
        const points = solveGravityMesh(`hem:${nodeId}`, mesh.dest, {
          stiffness: attachment.scarfStiffness,
          damping: attachment.scarfDamping,
          gravity: attachment.scarfGravity,
        });
        drawTexturedMesh(image, mesh.source, points, options.alpha);
      }

      function buildHemMesh(image, attachment, options, drawnLength, localToWorld) {
        const cols = 5;
        const rows = 7;
        const source = [];
        const dest = [];
        const sourceBottom = options.sourceStart + options.sourceSize;
        const restHeight =
          drawnLength * (options.sourceSize / image.height) * Math.max(0.05, options.length);
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            sourceRow.push({
              x: image.width * u,
              y: options.sourceStart + (sourceBottom - options.sourceStart) * v,
            });
            destRow.push(
              localToWorld({
                x: attachment.width * u,
                y: drawnLength * options.anchorY + restHeight * v,
              }),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        return { source, dest };
      }

      function buildScarfMesh(center, angle, layout) {
        const cols = 4;
        const rows = 7;
        const source = [];
        const dest = [];
        const rootX = layout.baseX + layout.rootX * layout.width;
        const rootY = layout.baseY + layout.rootY * layout.height;
        const clothAngle = (layout.angle * Math.PI) / 180;
        const dir = { x: Math.cos(clothAngle), y: Math.sin(clothAngle) };
        const normal = { x: -dir.y, y: dir.x };
        const clothLength = layout.length * layout.width;
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          const centerX = rootX + dir.x * clothLength * v;
          const centerY = rootY + dir.y * clothLength * v;
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            sourceRow.push({
              x: layout.sourceEnd * (1 - v),
              y: layout.imageHeight * u,
            });
            destRow.push(
              rotateLocalPoint(
                center,
                angle,
                centerX + normal.x * (u - 0.5) * layout.height,
                centerY + normal.y * (u - 0.5) * layout.height,
              ),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        return { source, dest };
      }

      function solveGravityMesh(key, rest, options) {
        let sim = dynamicScarves.get(key);
        const now = performance.now();
        const rows = rest.length;
        const cols = rest[0]?.length || 0;
        const flatRest = rest.flat();
        const shouldReset =
          !state.playing ||
          !sim ||
          sim.rows !== rows ||
          sim.cols !== cols ||
          now - (sim.time || now) > 250;
        if (shouldReset) {
          sim = {
            rows,
            cols,
            points: flatRest.map((point) => ({ ...point })),
            previous: flatRest.map((point) => ({ ...point })),
            time: now,
          };
          dynamicScarves.set(key, sim);
        }

        const dt = Math.min(1 / 24, Math.max(1 / 120, (now - sim.time) / 1000));
        sim.time = now;
        for (let index = 0; index < sim.points.length; index += 1) {
          const row = Math.floor(index / cols);
          if (row === 0) {
            sim.points[index] = { ...flatRest[index] };
            sim.previous[index] = { ...flatRest[index] };
            continue;
          }
          const point = sim.points[index];
          const previous = sim.previous[index];
          const old = { ...point };
          const rowFactor = row / Math.max(1, rows - 1);
          point.x +=
            (point.x - previous.x) * options.damping +
            (flatRest[index].x - point.x) * options.stiffness * 0.7;
          point.y +=
            (point.y - previous.y) * options.damping +
            (flatRest[index].y - point.y) * options.stiffness * 0.45 +
            options.gravity * (0.45 + rowFactor * 1.4) * dt * dt;
          sim.previous[index] = old;
        }

        const constrainPair = (aIndex, bIndex, axis) => {
          const a = sim.points[aIndex];
          const b = sim.points[bIndex];
          const ar = flatRest[aIndex];
          const br = flatRest[bIndex];
          const row = Math.min(Math.floor(aIndex / cols), Math.floor(bIndex / cols));
          const rowFactor = row / Math.max(1, rows - 1);
          const target =
            distance(ar, br) * (axis === "vertical" ? 1 + rowFactor * 0.22 : 1);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const current = Math.hypot(dx, dy) || 1;
          const strength = axis === "horizontal" ? 0.92 : 0.32;
          const correction = ((current - target) / current) * strength;
          const aPinned = Math.floor(aIndex / cols) === 0;
          const bPinned = Math.floor(bIndex / cols) === 0;
          if (!aPinned && !bPinned) {
            a.x += dx * correction * 0.5;
            a.y += dy * correction * 0.5;
            b.x -= dx * correction * 0.5;
            b.y -= dy * correction * 0.5;
          } else if (aPinned && !bPinned) {
            b.x -= dx * correction;
            b.y -= dy * correction;
          } else if (!aPinned && bPinned) {
            a.x += dx * correction;
            a.y += dy * correction;
          }
        };

        for (let pass = 0; pass < 3; pass += 1) {
          for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < cols; col += 1) {
              const index = row * cols + col;
              if (row === 0) sim.points[index] = { ...flatRest[index] };
              if (col < cols - 1) constrainPair(index, index + 1, "horizontal");
              if (row < rows - 1) constrainPair(index, index + cols, "vertical");
            }
          }
        }

        const points = [];
        for (let row = 0; row < rows; row += 1) {
          points.push(sim.points.slice(row * cols, row * cols + cols));
        }
        return points;
      }

      function drawTexturedMesh(image, source, dest, alpha) {
        ctx.save();
        setDrawAlpha(alpha);
        for (let row = 0; row < source.length - 1; row += 1) {
          for (let col = 0; col < source[row].length - 1; col += 1) {
            drawImageTriangle(image, source[row][col], source[row + 1][col], source[row][col + 1], dest[row][col], dest[row + 1][col], dest[row][col + 1]);
            drawImageTriangle(image, source[row + 1][col], source[row + 1][col + 1], source[row][col + 1], dest[row + 1][col], dest[row + 1][col + 1], dest[row][col + 1]);
          }
        }
        ctx.restore();
      }

      function drawImageTriangle(image, s0, s1, s2, d0, d1, d2) {
        const denominator =
          s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y);
        if (Math.abs(denominator) < 0.001) return;
        const a =
          (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) /
          denominator;
        const b =
          (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) /
          denominator;
        const c =
          (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) /
          denominator;
        const d =
          (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) /
          denominator;
        const e =
          (d0.x * (s1.x * s2.y - s2.x * s1.y) +
            d1.x * (s2.x * s0.y - s0.x * s2.y) +
            d2.x * (s0.x * s1.y - s1.x * s0.y)) /
          denominator;
        const f =
          (d0.y * (s1.x * s2.y - s2.x * s1.y) +
            d1.y * (s2.x * s0.y - s0.x * s2.y) +
            d2.y * (s0.x * s1.y - s1.x * s0.y)) /
          denominator;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(d0.x, d0.y);
        ctx.lineTo(d1.x, d1.y);
        ctx.lineTo(d2.x, d2.y);
        ctx.closePath();
        ctx.clip();
        ctx.transform(a, b, c, d, e, f);
        ctx.drawImage(image, 0, 0);
        ctx.restore();
      }

      function rotateLocalPoint(center, angle, x, y) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: center.x + x * cos - y * sin,
          y: center.y + x * sin + y * cos,
        };
      }

      function drawImageHorizontalSliceAlong(image, start, end, width, sourceX, sourceWidth, alpha) {
        const length = distance(start, end);
        const angle = Math.atan2(end.y - start.y, end.x - start.x);
        ctx.save();
        setDrawAlpha(alpha);
        ctx.translate(start.x, start.y);
        ctx.rotate(angle);
        ctx.drawImage(image, sourceX, 0, sourceWidth, image.height, 0, -width * 0.5, length, width);
        ctx.restore();
      }

      function drawImageAlong(
        image,
        start,
        end,
        width,
        length,
        alpha,
        anchorX,
        rotationOffset = 0,
        offsetX = 0,
        offsetY = 0,
      ) {
        drawImageSliceAlong(
          image,
          start,
          end,
          width,
          length,
          alpha,
          anchorX,
          0,
          image.height,
          rotationOffset,
          offsetX,
          offsetY,
        );
      }

      function drawImageSliceAlong(
        image,
        start,
        end,
        width,
        length,
        alpha,
        anchorX,
        sourceY,
        sourceHeight,
        rotationOffset = 0,
        offsetX = 0,
        offsetY = 0,
      ) {
        const angle = Math.atan2(end.y - start.y, end.x - start.x);
        const drawAngle = angle - Math.PI / 2 + (rotationOffset * Math.PI) / 180;
        ctx.save();
        setDrawAlpha(alpha);
        ctx.translate(start.x, start.y);
        ctx.rotate(drawAngle);
        ctx.drawImage(
          image,
          0,
          sourceY,
          image.width,
          sourceHeight,
          -width * anchorX + offsetX,
          offsetY,
          width,
          length,
        );
        ctx.restore();
      }

      function drawTextureHandles(nodes) {
        const selected = state.nodes.find((node) => node.id === state.selectedNodeId);
        if (!selected) return;
        const pose = worldPose(selected);
        const end = endPoint(pose);
        ctx.save();
        ctx.fillStyle = varColor("--accent-2");
        ctx.strokeStyle = "#000000cc";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pose.worldX, pose.worldY, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(end.x, end.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawParentLink(node) {
        if (!node.parentId) return;
        const parent = state.nodes.find((item) => item.id === node.parentId);
        if (!parent) return;
        const parentEnd = endPoint(worldPose(parent));
        const pose = worldPose(node);
        const gap = Math.hypot(parentEnd.x - pose.worldX, parentEnd.y - pose.worldY);
        if (gap < 0.5) return;
        ctx.save();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(parentEnd.x, parentEnd.y);
        ctx.lineTo(pose.worldX, pose.worldY);
        ctx.stroke();
        ctx.restore();
      }

      function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function setDrawAlpha(alpha) {
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha * drawAlphaMultiplier));
      }

      function renderAll() {
        renderNodeList();
        renderProperties();
        renderTimeline();
        renderStatus();
        renderJsonPreview();
        drawStage();
      }

      function renderNodeList() {
        el.nodeList.innerHTML = "";
        sortedNodes().forEach((node) => {
          const button = document.createElement("button");
          button.className = `node-item${node.id === state.selectedNodeId ? " active" : ""}`;
          button.type = "button";
          button.dataset.id = node.id;
          button.innerHTML = `
            <span class="node-depth">${"·".repeat(node.depth)}</span>
            <span class="node-name">${escapeHtml(node.name)}</span>
            <span class="node-color" style="background:${node.color}"></span>
          `;
          button.addEventListener("click", () => {
            state.selectedNodeId = node.id;
            state.selectedKey = null;
            renderAll();
          });
          el.nodeList.appendChild(button);
        });
      }

      function renderProperties() {
        const node = selectedNode();
        const disabled = !node;
        [
          el.nodeNameInput,
          el.parentSelect,
          el.xInput,
          el.yInput,
          el.rotationInput,
          el.lengthInput,
          el.scaleXInput,
          el.scaleYInput,
          el.colorInput,
          el.attachmentImageSelect,
          el.keyframeBtn,
          el.deleteNodeBtn,
        ].forEach((input) => {
          input.disabled = disabled;
        });
        if (!node) {
          el.nodeNameInput.value = "";
          el.parentSelect.innerHTML = '<option value="">无</option>';
          renderAttachmentProperties(null);
          return;
        }
        el.nodeNameInput.value = node.name;
        el.xInput.value = round(node.x);
        el.yInput.value = round(node.y);
        el.rotationInput.value = round(node.rotation);
        el.lengthInput.value = round(node.length);
        el.scaleXInput.value = round(node.scaleX, 2);
        el.scaleYInput.value = round(node.scaleY, 2);
        el.colorInput.value = node.color;
        renderAttachmentProperties(node);

        el.parentSelect.innerHTML = '<option value="">无</option>';
        sortedNodes()
          .filter((item) => item.id !== node.id && !isDescendant(item.id, node.id))
          .forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = `${"  ".repeat(item.depth)}${item.name}`;
            option.selected = item.id === node.parentId;
            el.parentSelect.appendChild(option);
          });
      }

      function renderAttachmentProperties(node) {
        const context = attachmentEditContext(node);
        const attachment = selectedAttachmentView(node);
        const scarfInputs = [
          el.attachmentScarfEnabledInput,
          el.attachmentScarfSplitInput,
          el.attachmentScarfRootXInput,
          el.attachmentScarfRootYInput,
          el.attachmentScarfTipXInput,
          el.attachmentScarfTipYInput,
        ];
        const springInputs = [
          el.attachmentScarfStiffnessInput,
          el.attachmentScarfDampingInput,
          el.attachmentScarfGravityInput,
          el.attachmentScarfWaveInput,
        ];
        const hemInputs = [
          el.attachmentHemEnabledInput,
          el.attachmentHemXInput,
          el.attachmentHemYInput,
