<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spine 节点时间轴编辑器</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151719;
        --panel: #202326;
        --panel-2: #292d31;
        --line: #3b4147;
        --text: #eef2f5;
        --muted: #9aa5ae;
        --accent: #35b6b4;
        --accent-2: #e6a23c;
        --danger: #e66f6f;
        --ok: #77c66e;
        --canvas: #101214;
        --track: #23282d;
        --track-alt: #1b1f23;
        --key: #f5c84b;
        --key-active: #ff7a59;
        --shadow: 0 18px 50px rgb(0 0 0 / 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui,
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #30363b;
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #171a1d;
        color: var(--text);
        padding: 5px 8px;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
        line-height: 1.45;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr 224px;
        width: 100vw;
        height: 100vh;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #1c2024;
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
        min-height: 32px;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background:
          linear-gradient(135deg, transparent 48%, #ffffff40 50%, transparent 52%),
          linear-gradient(135deg, var(--accent), #4d8ecf);
      }

      .brand h1 {
        margin: 0;
        overflow: hidden;
        font-size: 15px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .unit-toolbar {
        align-items: center;
      }

      .unit-toolbar label {
        color: var(--muted);
        font-size: 12px;
      }

      .unit-toolbar select {
        width: auto;
        min-width: 160px;
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toolbar button {
        padding: 0 10px;
      }

      .mode-button.active {
        border-color: var(--accent);
        background: #244f4f;
      }

      .app.binding-mode .timeline {
        visibility: hidden;
        pointer-events: none;
      }

      .bind-only {
        display: none;
      }

      .app.binding-mode .bind-only {
        display: block;
      }

      .bind-note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .workspace {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        min-height: 0;
      }

      .panel {
        min-height: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow: auto;
      }

      .panel.right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }

      .panel-section {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .node-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .node-item {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 6px;
        align-items: center;
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        padding: 4px 8px;
        color: var(--text);
        text-align: left;
      }

      .node-item.active {
        border-color: var(--accent);
        background: #294144;
      }

      .node-depth {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      .node-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .node-color {
        width: 14px;
        height: 14px;
        border: 1px solid #ffffff80;
        border-radius: 50%;
      }

      .action-list {
        margin-top: 10px;
      }

      .action-item {
        grid-template-columns: 1fr auto;
      }

      .action-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .stage-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
        background:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px), var(--canvas);
        background-size: 32px 32px;
        user-select: none;
      }

      #stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .stage-hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: min(520px, calc(100% - 24px));
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgb(22 25 28 / 0.82);
        color: var(--muted);
        padding: 8px 10px;
        font-size: 12px;
        pointer-events: none;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
      }

      .field.checkbox-field {
        justify-content: end;
      }

      .field.checkbox-field label {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 32px;
        color: var(--text);
      }

      .field.checkbox-field input {
        width: 16px;
        min-height: 16px;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .button-row.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .danger {
        border-color: #6d3838;
        background: #4a2424;
      }

      .primary {
        border-color: #337f7d;
        background: #236160;
      }

      .timeline {
        display: grid;
        grid-template-rows: 42px 1fr;
        min-height: 0;
        border-top: 1px solid var(--line);
        background: #191d20;
      }

      .timeline-top {
        display: grid;
        grid-template-columns: 340px 1fr 300px;
        border-bottom: 1px solid var(--line);
      }

      .transport,
      .timeline-meta,
      .timeline-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
      }

      .transport {
        gap: 6px;
        border-right: 1px solid var(--line);
      }

      .timeline-actions {
        justify-content: flex-end;
        border-left: 1px solid var(--line);
      }

      .transport button,
      .timeline-actions button {
        min-width: 34px;
        padding: 0 6px;
        font-size: 12px;
        white-space: nowrap;
      }

      .small-input {
        width: 72px;
      }

      .timeline-body {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 0;
      }

      .track-labels {
        overflow: hidden auto;
        border-right: 1px solid var(--line);
      }

      .track-label {
        display: flex;
        align-items: center;
        min-height: 30px;
        border-bottom: 1px solid #ffffff10;
        padding: 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .tracks-viewport {
        position: relative;
        overflow: auto;
      }

      .tracks {
        position: relative;
        min-height: 100%;
      }

      .frame-ruler,
      .track-row {
        position: relative;
        min-height: 30px;
      }

      .frame-ruler {
        position: sticky;
        top: 0;
        z-index: 4;
        background: #1f2428;
        border-bottom: 1px solid var(--line);
      }

      .track-row {
        border-bottom: 1px solid #ffffff10;
        background: var(--track);
      }

      .track-row:nth-child(odd) {
        background: var(--track-alt);
      }

      .frame-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #ffffff14;
      }

      .frame-label {
        position: absolute;
        top: 8px;
        color: var(--muted);
        font-size: 11px;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        width: 2px;
        background: var(--accent-2);
        pointer-events: none;
      }

      .playhead::before {
        position: absolute;
        top: 0;
        left: -5px;
        width: 12px;
        height: 12px;
        border-radius: 0 0 6px 6px;
        background: var(--accent-2);
        content: "";
      }

      .key {
        position: absolute;
        top: 8px;
        z-index: 2;
        width: 14px;
        height: 14px;
        border: 1px solid #6f4d00;
        border-radius: 3px;
        background: var(--key);
        cursor: ew-resize;
        transform: translateX(-50%) rotate(45deg);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.35);
      }

      .key.active {
        border-color: #8c2d15;
        background: var(--key-active);
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .file-input {
        display: none;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        max-width: 360px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #24292e;
        box-shadow: var(--shadow);
        color: var(--text);
        padding: 10px 12px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 230px 1fr;
        }

        .panel.right {
          display: none;
        }

        .timeline-top {
          grid-template-columns: 230px 1fr;
        }

        .timeline-actions {
          display: none;
        }

        .timeline-body {
          grid-template-columns: 230px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>Spine 节点时间轴编辑器</h1>
            <span>骨骼节点 · 关键帧 · 插值播放 · JSON 工程导入导出</span>
          </div>
        </div>
        <div id="unitContextToolbar" class="toolbar unit-toolbar">
          <label for="unitTypeSelect">兵种</label>
          <select id="unitTypeSelect"></select>
        </div>
        <div class="toolbar">
          <button id="newProjectBtn" type="button">新建</button>
          <button id="importBtn" type="button">导入 JSON</button>
          <button id="exportBtn" type="button">导出 JSON</button>
          <button id="sampleBtn" type="button">示例</button>
          <button id="walkSampleBtn" type="button">侧面行走</button>
          <button id="newVersionSampleBtn" type="button">新版</button>
          <button id="idleAnimationBtn" type="button">待机动画</button>
          <button id="replaceMaterialBtn" type="button">素材替换</button>
          <button id="bindingModeBtn" class="mode-button" type="button">绑定管理</button>
          <button id="slashSampleBtn" type="button" hidden>侧身劈砍</button>
          <button id="threeQuarterSampleBtn" type="button" hidden>70度侧身</button>
          <button id="viewToggleBtn" type="button">骨骼视图</button>
          <button id="skeletonOverlayBtn" type="button">显示骨骼</button>
          <button id="specialAnchorToggleBtn" type="button">显示轮廓锚点</button>
          <button id="nodeModeBtn" class="mode-button active" type="button">节点移动</button>
          <button id="boneModeBtn" class="mode-button" type="button">骨骼移动</button>
          <button id="stretchModeBtn" class="mode-button" type="button">骨骼伸缩</button>
          <input id="fileInput" class="file-input" type="file" accept=".json,application/json" />
          <input id="materialInput" class="file-input" type="file" accept="image/png,image/jpeg,image/webp" />
          <input id="attachmentVariantFileInput" class="file-input" type="file" accept="image/png,image/jpeg,image/webp" />
        </div>
      </header>

      <main class="workspace">
        <aside class="panel">
          <section class="panel-section">
            <div class="panel-title">
              <span>动作列表</span>
              <button id="newActionBtn" type="button">新建</button>
            </div>
            <div class="button-row bind-only">
              <button id="bindingNodeModeBtn" class="mode-button active" type="button">节点移动</button>
              <button id="bindingPieceModeBtn" class="mode-button" type="button">移动贴图</button>
              <button id="bindingBoneModeBtn" class="mode-button active" type="button">移动骨骼</button>
              <button id="bindingStretchModeBtn" class="mode-button" type="button">骨骼伸缩</button>
            </div>
            <div class="field">
              <label for="actionNameInput">动作名</label>
              <input id="actionNameInput" type="text" />
            </div>
            <div class="button-row">
              <button id="saveActionBtn" class="primary" type="button">保存动作</button>
              <button id="applyIdleToActionBtn" type="button">生成待机</button>
            </div>
            <div id="actionList" class="node-list action-list"></div>
          </section>
          <section class="panel-section">
            <div class="panel-title">
              <span>节点树</span>
              <button id="addNodeBtn" type="button">添加</button>
            </div>
            <div id="nodeList" class="node-list"></div>
          </section>
          <section class="panel-section bind-only">
            <div class="panel-title">
              <span>物块列表</span>
              <button id="addPieceBtn" type="button">添加</button>
            </div>
            <div id="pieceList" class="node-list"></div>
            <div class="button-row">
              <button id="deletePieceBtn" class="danger" type="button">删除物块</button>
            </div>
            <div class="button-row">
              <button id="addBoneFromNodeBtn" type="button">从节点添加骨骼</button>
              <button id="addFreeBoneBtn" type="button">自由添加骨骼</button>
            </div>
          </section>
          <section class="panel-section">
            <div class="panel-title">项目设置</div>
            <div class="form-grid">
              <div class="field">
                <label for="fpsInput">FPS</label>
                <input id="fpsInput" type="number" min="1" max="120" step="1" />
              </div>
              <div class="field">
                <label for="durationInput">总帧数</label>
                <input id="durationInput" type="number" min="1" max="1200" step="1" />
              </div>
            </div>
          </section>
          <section class="panel-section bind-only">
            <div class="panel-title">单物块去白边</div>
            <div class="bind-note">只对当前选中的物块生效，会生成一张新的清理后贴图并只替换这个物块的引用。</div>
            <div class="form-grid">
              <div class="field checkbox-field full">
                <label for="imageCleanupEnabledInput">
                  <input id="imageCleanupEnabledInput" type="checkbox" checked />
                  导入图片时自动去背和去白边
                </label>
              </div>
              <div class="field">
                <label for="imageCleanupBackgroundModeSelect">背景色</label>
                <select id="imageCleanupBackgroundModeSelect">
                  <option value="white">白色</option>
                  <option value="magenta">品红</option>
                  <option value="custom">自定义</option>
                </select>
              </div>
              <div class="field">
                <label for="imageCleanupToleranceInput">容差</label>
                <input id="imageCleanupToleranceInput" type="number" min="0" max="255" step="1" value="28" />
              </div>
              <div class="field full">
                <label for="imageCleanupCustomColorInput">自定义取样色</label>
                <input id="imageCleanupCustomColorInput" type="color" value="#ffffff" />
              </div>
              <div class="field checkbox-field">
                <label for="imageCleanupEdgeRepairInput">
                  <input id="imageCleanupEdgeRepairInput" type="checkbox" checked />
                  B 去白边修色
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="imageCleanupShrinkInput">
                  <input id="imageCleanupShrinkInput" type="checkbox" checked />
                  C 边缘收缩抗毛刺
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="imageCleanupSupersampleInput">
                  <input id="imageCleanupSupersampleInput" type="checkbox" checked />
                  D 超采样抗锯齿
                </label>
              </div>
              <div class="field checkbox-field">
                <label for="imageCleanupCurveInput">
                  <input id="imageCleanupCurveInput" type="checkbox" />
                  E 曲线重建边缘
                </label>
              </div>
            </div>
          </section>
        </aside>

        <section class="stage-wrap">
          <canvas id="stage" draggable="false"></canvas>
          <div class="stage-hint">
            节点移动：拖拽关节圆点，沿父骨骼方向会拉伸/缩短父骨骼并带动相连子链；骨骼移动：拖拽骨骼段会平移当前骨骼和子骨骼。
          </div>
        </section>

        <aside class="panel right">
          <section class="panel-section">
            <div class="panel-title">节点属性</div>
            <div class="form-grid">
              <div class="field full">
                <label for="nodeNameInput">名称</label>
                <input id="nodeNameInput" type="text" />
              </div>
              <div class="field full">
                <label for="parentSelect">父节点</label>
                <select id="parentSelect"></select>
              </div>
              <div id="independentBoneRow" class="field full bind-only" hidden>
                <label for="independentBoneSelect">独立骨骼</label>
                <select id="independentBoneSelect"></select>
              </div>
              <div class="field full">
                <label for="attachmentVariantSelect">贴图库</label>
                <select id="attachmentVariantSelect"></select>
              </div>
              <div class="field full">
                <label for="attachmentLegAssetSelect">leg 贴图选择</label>
                <select id="attachmentLegAssetSelect"></select>
              </div>
              <div class="field full">
                <div class="button-row three">
                  <button id="attachmentVariantAddBtn" type="button">加入贴图库</button>
                  <button id="attachmentVariantImportBtn" type="button">导入所选贴图</button>
                  <button id="attachmentVariantBrowseBtn" type="button">现场选择导入</button>
                  <button id="attachmentVariantDefaultBtn" type="button">设为默认</button>
                  <button id="attachmentVariantRemoveBtn" type="button">移出贴图库</button>
                </div>
              </div>
              <div class="field full">
                <label for="attachmentImageKeySelect">贴图替换</label>
                <select id="attachmentImageKeySelect"></select>
              </div>
              <div class="field full">
                <div class="button-row">
                  <button id="attachmentImageKeySetBtn" type="button">写入替换帧</button>
                  <button id="attachmentImageKeyDeleteBtn" class="danger" type="button">删除替换帧</button>
                </div>
              </div>
              <div class="field">
                <label for="xInput">X</label>
                <input id="xInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="yInput">Y</label>
                <input id="yInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="rotationInput">旋转</label>
                <input id="rotationInput" type="number" step="1" />
              </div>
              <div class="field">
                <label for="lengthInput">长度</label>
                <input id="lengthInput" type="number" min="4" step="1" />
              </div>
              <div class="field">
                <label for="scaleXInput">缩放 X</label>
                <input id="scaleXInput" type="number" min="0.05" step="0.05" />
              </div>
              <div class="field">
                <label for="scaleYInput">缩放 Y</label>
                <input id="scaleYInput" type="number" min="0.05" step="0.05" />
              </div>
              <div class="field full">
                <label for="colorInput">颜色</label>
                <input id="colorInput" type="color" />
              </div>
              <div class="field full">
                <label for="attachmentImageSelect">贴图</label>
                <select id="attachmentImageSelect">
                  <option value="">无</option>
                  <option value="body">body.png</option>
                  <option value="head">head.png</option>
                  <option value="arm">arm_right.png</option>
                  <option value="leg">leg.png</option>
                  <option value="newHead">新版/head.png</option>
                  <option value="newTorso">新版/torso.png</option>
                  <option value="newLeftArm">新版/leftarm.png</option>
                  <option value="newRightArm">新版/rightarm.png</option>
                  <option value="newLeftLeg">新版/leftleg.png</option>
                  <option value="newRightLeg">新版/rightleg.png</option>
                  <option value="newSword">新版/sword.png</option>
                </select>
              </div>
              <div class="field">
                <label for="attachmentOffsetXInput">贴图 X</label>

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`Cannot load ${src}`));
          image.src = src;
        });
      }

      function loadFileImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error(`Cannot load ${file.name}`));
          };
          image.src = url;
        });
      }

      function imageToImageData(image) {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth || image.width;
        canvas.height = image.naturalHeight || image.height;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(image, 0, 0);
        return context.getImageData(0, 0, canvas.width, canvas.height);
      }

      function imageDataToImage(imageData) {
        const canvas = document.createElement("canvas");
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        canvas.getContext("2d").putImageData(imageData, 0, 0);
        return loadImage(canvas.toDataURL("image/png"));
      }

      function imageDataToDataUrl(imageData) {
        const canvas = document.createElement("canvas");
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        canvas.getContext("2d").putImageData(imageData, 0, 0);
        return canvas.toDataURL("image/png");
      }

      function cloneImageData(imageData) {
        return new ImageData(new Uint8ClampedArray(imageData.data), imageData.width, imageData.height);
      }

      function hexToRgbColor(hex) {
        const normalized = String(hex || "").trim().replace(/^#/, "");
        if (!/^[0-9a-f]{6}$/i.test(normalized)) return null;
        return [
          parseInt(normalized.slice(0, 2), 16),
          parseInt(normalized.slice(2, 4), 16),
          parseInt(normalized.slice(4, 6), 16),
        ];
      }

      function resolveImageCleanupBackgroundColor(options = state.imageCleanup) {
        const mode = String(options?.backgroundMode || "white");
        if (mode === "magenta") return [128, 0, 128];
        if (mode === "custom") return hexToRgbColor(options?.customColor) || [255, 255, 255];
        return [255, 255, 255];
      }

      function normalizedImageCleanupOptions(overrides = {}) {
        const source = {
          ...(state.imageCleanup || {}),
          ...(overrides || {}),
        };
        return {
          enabled: source.enabled !== false,
          backgroundMode: ["white", "magenta", "custom"].includes(source.backgroundMode)
            ? source.backgroundMode
            : "white",
          tolerance: Math.max(0, Math.min(255, Math.round(Number(source.tolerance) || 0))),
          customColor: /^#[0-9a-f]{6}$/i.test(String(source.customColor || ""))
            ? String(source.customColor)
            : "#ffffff",
          edgeRepair: source.edgeRepair !== false,
          alphaShrink: source.alphaShrink !== false,
          supersample: source.supersample !== false,
          curveRebuild: source.curveRebuild === true,
        };
      }

      function colorDistanceToBackground(r, g, b, backgroundColor) {
        const dr = r - backgroundColor[0];
        const dg = g - backgroundColor[1];
        const db = b - backgroundColor[2];
        return Math.sqrt(dr * dr + dg * dg + db * db);
      }

      function backgroundMatchesCleanupColor(r, g, b, backgroundColor, tolerance, mode = "custom") {
        if (mode === "white") {
          const threshold = 255 - tolerance;
          return r >= threshold && g >= threshold && b >= threshold;
        }
        return (
          Math.abs(r - backgroundColor[0]) <= tolerance &&
          Math.abs(g - backgroundColor[1]) <= tolerance &&
          Math.abs(b - backgroundColor[2]) <= tolerance
        );
      }

      function fourNeighborIndices(index, width, height) {
        const neighbors = [];
        const x = index % width;
        const y = Math.floor(index / width);
        if (x > 0) neighbors.push(index - 1);
        if (x < width - 1) neighbors.push(index + 1);
        if (y > 0) neighbors.push(index - width);
        if (y < height - 1) neighbors.push(index + width);
        return neighbors;
      }

      function clearImageDataPixel(imageData, index) {
        const offset = index * 4;
        imageData.data[offset] = 0;
        imageData.data[offset + 1] = 0;
        imageData.data[offset + 2] = 0;
        imageData.data[offset + 3] = 0;
      }

      function floodRemoveCornerConnectedBackground(sourceImageData, options = {}) {
        const imageData = cloneImageData(sourceImageData);
        const { width, height, data } = imageData;
        const count = width * height;
        const config = normalizedImageCleanupOptions(options);
        const backgroundColor = resolveImageCleanupBackgroundColor(config);
        const visited = new Uint8Array(count);
        const queue = [];
        let cursor = 0;

        function matches(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          return backgroundMatchesCleanupColor(
            data[offset],
            data[offset + 1],
            data[offset + 2],
            backgroundColor,
            config.tolerance,
            config.backgroundMode,
          );
        }

        function push(index) {
          if (visited[index] || !matches(index)) return;
          visited[index] = 1;
          queue.push(index);
        }

        push(0);
        push(width - 1);
        push((height - 1) * width);
        push(height * width - 1);

        while (cursor < queue.length) {
          const index = queue[cursor++];
          clearImageDataPixel(imageData, index);
          fourNeighborIndices(index, width, height).forEach(push);
        }
        return imageData;
      }

      function detectOpaqueComponentsFromImageData(imageData, minPixels = 1, alphaThreshold = 16) {
        const { width, height } = imageData;
        const mask = createOpaqueMask(imageData, alphaThreshold);
        const seen = new Uint8Array(mask.length);
        const components = [];
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index] || seen[index]) continue;
          const pixels = [index];
          seen[index] = 1;
          let minX = width;
          let minY = height;
          let maxX = 0;
          let maxY = 0;
          for (let cursor = 0; cursor < pixels.length; cursor += 1) {
            const current = pixels[cursor];
            const x = current % width;
            const y = Math.floor(current / width);
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
            fourNeighborIndices(current, width, height).forEach((neighbor) => {
              if (!mask[neighbor] || seen[neighbor]) return;
              seen[neighbor] = 1;
              pixels.push(neighbor);
            });
          }
          if (pixels.length < minPixels) continue;
          components.push({
            pixels,
            minX,
            minY,
            maxX,
            maxY,
            width: maxX - minX + 1,
            height: maxY - minY + 1,
            count: pixels.length,
          });
        }
        return components;
      }

      function averageOpaqueRgbFromImageData(imageData) {
        let r = 0;
        let g = 0;
        let b = 0;
        let weight = 0;
        for (let index = 0; index < imageData.width * imageData.height; index += 1) {
          const alpha = imageData.data[index * 4 + 3];
          if (alpha < 16) continue;
          const a = alpha / 255;
          r += imageData.data[index * 4] * a;
          g += imageData.data[index * 4 + 1] * a;
          b += imageData.data[index * 4 + 2] * a;
          weight += a;
        }
        if (weight <= 0) return [216, 208, 191];
        return [
          Math.max(0, Math.min(255, Math.round(r / weight))),
          Math.max(0, Math.min(255, Math.round(g / weight))),
          Math.max(0, Math.min(255, Math.round(b / weight))),
        ];
      }

      function averageOpaqueColorFromImageData(imageData) {
        const [r, g, b] = averageOpaqueRgbFromImageData(imageData);
        const toHex = (value) => value.toString(16).padStart(2, "0");
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }

      function countTransparentNeighbors(mask, index, width, height) {
        return fourNeighborIndices(index, width, height).reduce((count, neighbor) => count + (mask[neighbor] ? 0 : 1), 0);
      }

      function sampleNearestCleanOpaqueColor(
        imageData,
        mask,
        x,
        y,
        backgroundColor,
        tolerance,
        mode = "custom",
        maxRadius = 8,
      ) {
        const { width, height, data } = imageData;
        for (let radius = 1; radius <= maxRadius; radius += 1) {
          let r = 0;
          let g = 0;
          let b = 0;
          let weight = 0;
          const minY = Math.max(0, y - radius);
          const maxY = Math.min(height - 1, y + radius);
          const minX = Math.max(0, x - radius);
          const maxX = Math.min(width - 1, x + radius);
          for (let py = minY; py <= maxY; py += 1) {
            for (let px = minX; px <= maxX; px += 1) {
              if (Math.abs(px - x) !== radius && Math.abs(py - y) !== radius) continue;
              const index = py * width + px;
              if (!mask[index]) continue;
              if (countTransparentNeighbors(mask, index, width, height) > 1) continue;
              const offset = index * 4;
              const alpha = data[offset + 3];
              if (alpha < 48) continue;
              const cr = data[offset];
              const cg = data[offset + 1];
              const cb = data[offset + 2];
              if (backgroundMatchesCleanupColor(cr, cg, cb, backgroundColor, tolerance, mode)) continue;
              const currentWeight = (alpha / 255) / (1 + Math.hypot(px - x, py - y));
              r += cr * currentWeight;
              g += cg * currentWeight;
              b += cb * currentWeight;
              weight += currentWeight;
            }
          }
          if (weight > 0) {
            return [
              Math.max(0, Math.min(255, Math.round(r / weight))),
              Math.max(0, Math.min(255, Math.round(g / weight))),
              Math.max(0, Math.min(255, Math.round(b / weight))),
            ];
          }
        }
        return null;
      }

      function pushColorAwayFromBackground(color, backgroundColor, fallbackColor) {
        return [0, 1, 2].map((channel) => {
          const base = color[channel];
          const delta = base - backgroundColor[channel];
          if (Math.abs(delta) > 2) {
            return Math.max(0, Math.min(255, Math.round(base + delta * 0.85)));
          }
          return Math.max(0, Math.min(255, Math.round(base * 0.2 + fallbackColor[channel] * 0.8)));
        });
      }

      function repairTransparentEdgeBleed(sourceImageData, options = {}) {
        const config = normalizedImageCleanupOptions(options);
        const backgroundColor = resolveImageCleanupBackgroundColor(config);
        const imageData = cloneImageData(sourceImageData);
        const source = cloneImageData(sourceImageData);
        const mask = createOpaqueMask(source, 8);
        const fallbackColor = averageOpaqueRgbFromImageData(source);
        const { width, height } = source;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index] || !countTransparentNeighbors(mask, index, width, height)) continue;
          const offset = index * 4;
          const alpha = source.data[offset + 3];
          if (alpha < 8) continue;
          const color = [source.data[offset], source.data[offset + 1], source.data[offset + 2]];
          const polluted =
            backgroundMatchesCleanupColor(
              color[0],
              color[1],
              color[2],
              backgroundColor,
              Math.round(config.tolerance * 1.3),
              config.backgroundMode,
            ) ||
            (alpha < 220 &&
              colorDistanceToBackground(color[0], color[1], color[2], backgroundColor) <= config.tolerance * 2.4);
          if (!polluted) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          const sampled =
            sampleNearestCleanOpaqueColor(
              source,
              mask,
              x,
              y,
              backgroundColor,
              config.tolerance,
              config.backgroundMode,
            ) || pushColorAwayFromBackground(color, backgroundColor, fallbackColor);
          imageData.data[offset] = Math.round(color[0] * 0.18 + sampled[0] * 0.82);
          imageData.data[offset + 1] = Math.round(color[1] * 0.18 + sampled[1] * 0.82);
          imageData.data[offset + 2] = Math.round(color[2] * 0.18 + sampled[2] * 0.82);
        }
        return imageData;
      }

      function shrinkAndSmoothAlphaEdge(sourceImageData) {
        const imageData = cloneImageData(sourceImageData);
        const source = sourceImageData.data;
        const mask = createOpaqueMask(sourceImageData, 8);
        const { width, height } = sourceImageData;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const transparentNeighbors = countTransparentNeighbors(mask, index, width, height);
          if (!transparentNeighbors) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          let alphaSum = 0;
          let sampleCount = 0;
          for (let py = Math.max(0, y - 1); py <= Math.min(height - 1, y + 1); py += 1) {
            for (let px = Math.max(0, x - 1); px <= Math.min(width - 1, x + 1); px += 1) {
              alphaSum += source[(py * width + px) * 4 + 3];
              sampleCount += 1;
            }
          }
          const currentAlpha = source[index * 4 + 3];
          const averageAlpha = alphaSum / Math.max(1, sampleCount);
          const targetAlpha = Math.max(0, Math.min(currentAlpha, averageAlpha * (0.88 - transparentNeighbors * 0.06)));
          imageData.data[index * 4 + 3] = targetAlpha < 6
            ? 0
            : Math.round(currentAlpha * 0.55 + targetAlpha * 0.45);
        }
        return imageData;
      }

      function supersampleAlphaEdge(sourceImageData) {
        const imageData = cloneImageData(sourceImageData);
        const source = sourceImageData.data;
        const mask = createOpaqueMask(sourceImageData, 8);
        const { width, height } = sourceImageData;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const transparentNeighbors = countTransparentNeighbors(mask, index, width, height);
          if (!transparentNeighbors) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          let coverage = 0;
          let sampleCount = 0;
          for (let py = Math.max(0, y - 1); py <= Math.min(height - 1, y + 1); py += 1) {
            for (let px = Math.max(0, x - 1); px <= Math.min(width - 1, x + 1); px += 1) {
              coverage += source[(py * width + px) * 4 + 3] / 255;
              sampleCount += 1;
            }
          }
          const currentAlpha = source[index * 4 + 3];
          const resampledAlpha = Math.round((coverage / Math.max(1, sampleCount)) * 255);
          imageData.data[index * 4 + 3] = Math.max(
            0,
            Math.min(255, Math.round(currentAlpha * 0.4 + resampledAlpha * 0.6)),
          );
        }
        return imageData;
      }

      function erodeMask(mask, width, height, steps = 1) {
        let current = mask.slice();
        for (let step = 0; step < steps; step += 1) {
          const next = current.slice();
          for (let index = 0; index < current.length; index += 1) {
            if (!current[index]) continue;
            const neighbors = fourNeighborIndices(index, width, height);
            if (neighbors.length < 4 || neighbors.some((neighbor) => !current[neighbor])) {
              next[index] = 0;
            }
          }
          current = next;
        }
        return current;
      }

      function rebuildCurveEdges(sourceImageData, options = {}) {
        const config = normalizedImageCleanupOptions(options);
        const backgroundColor = resolveImageCleanupBackgroundColor(config);
        const oldMask = createOpaqueMask(sourceImageData, 16);
        const closedMask = erodeMask(
          dilateMask(oldMask, sourceImageData.width, sourceImageData.height, 1),
          sourceImageData.width,
          sourceImageData.height,
          1,
        );
        const rebuiltMask = dilateMask(
          erodeMask(closedMask, sourceImageData.width, sourceImageData.height, 1),
          sourceImageData.width,
          sourceImageData.height,
          1,
        );
        const output = cloneImageData(sourceImageData);
        const fallbackColor = averageOpaqueRgbFromImageData(sourceImageData);
        for (let index = 0; index < rebuiltMask.length; index += 1) {
          if (!rebuiltMask[index]) {
            clearImageDataPixel(output, index);
            continue;
          }
          if (oldMask[index]) continue;
          const x = index % sourceImageData.width;
          const y = Math.floor(index / sourceImageData.width);
          const sampled =
            sampleNearestCleanOpaqueColor(
              sourceImageData,
              oldMask,
              x,
              y,
              backgroundColor,
              config.tolerance,
              config.backgroundMode,
            ) || fallbackColor;
          const offset = index * 4;
          output.data[offset] = sampled[0];
          output.data[offset + 1] = sampled[1];
          output.data[offset + 2] = sampled[2];
          output.data[offset + 3] = 220;
        }
        return supersampleAlphaEdge(shrinkAndSmoothAlphaEdge(output));
      }

      function preprocessImportedImageData(sourceImageData, options = {}) {
        const config = normalizedImageCleanupOptions(options);
        let imageData = cloneImageData(sourceImageData);
        if (config.enabled) {
          imageData = floodRemoveCornerConnectedBackground(imageData, config);
          if (config.edgeRepair) imageData = repairTransparentEdgeBleed(imageData, config);
          if (config.alphaShrink) imageData = shrinkAndSmoothAlphaEdge(imageData, config);
          if (config.supersample) imageData = supersampleAlphaEdge(imageData, config);
          if (config.curveRebuild) imageData = rebuildCurveEdges(imageData, config);
        }
        for (let index = 0; index < imageData.width * imageData.height; index += 1) {
          if (imageData.data[index * 4 + 3] < 6) {
            clearImageDataPixel(imageData, index);
          }
        }
        return {
          imageData,
          components: detectOpaqueComponentsFromImageData(imageData, 1, 16),
        };
      }

      async function loadProcessedFileImage(file, options = {}) {
        const image = await loadFileImage(file);
        const processed = preprocessImportedImageData(imageToImageData(image), options);
        return {
          image: await imageDataToImage(processed.imageData),
          imageData: processed.imageData,
          components: processed.components,
        };
      }

      function imageDataOffset(imageData, x, y) {
        return (y * imageData.width + x) * 4;
      }

      function createOpaqueMask(imageData, alphaThreshold = 16) {
        const mask = new Uint8Array(imageData.width * imageData.height);
        for (let index = 0; index < mask.length; index += 1) {
          mask[index] = imageData.data[index * 4 + 3] >= alphaThreshold ? 1 : 0;
        }
        return mask;
      }

      function maskPixelCount(mask) {
        let count = 0;
        for (let index = 0; index < mask.length; index += 1) {
          count += mask[index] ? 1 : 0;
        }
        return count;
      }

      function computeOpaqueNeighborCounts(mask, width, height) {
        const counts = new Uint8Array(mask.length);
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const index = y * width + x;
            if (!mask[index]) continue;
            let count = 0;
            for (let dy = -1; dy <= 1; dy += 1) {
              const py = y + dy;
              if (py < 0 || py >= height) continue;
              for (let dx = -1; dx <= 1; dx += 1) {
                const px = x + dx;
                if (px < 0 || px >= width) continue;
                count += mask[py * width + px] ? 1 : 0;
              }
            }
            counts[index] = count;
          }
        }
        return counts;
      }

      function computeDistanceToTransparent(mask, width, height) {
        const distance = new Int16Array(mask.length);
        distance.fill(-1);
        const queue = [];
        let cursor = 0;
        for (let index = 0; index < mask.length; index += 1) {
          if (mask[index]) continue;
          distance[index] = 0;
          queue.push(index);
        }
        while (cursor < queue.length) {
          const index = queue[cursor++];
          const x = index % width;
          const y = Math.floor(index / width);
          const nextDistance = distance[index] + 1;
          if (x > 0) {
            const neighbor = index - 1;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
          if (x < width - 1) {
            const neighbor = index + 1;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
          if (y > 0) {
            const neighbor = index - width;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
          if (y < height - 1) {
            const neighbor = index + width;
            if (distance[neighbor] === -1) {
              distance[neighbor] = nextDistance;
              queue.push(neighbor);
            }
          }
        }
        return distance;
      }

      function dilateMask(mask, width, height, steps, limitMask = null) {
        let current = mask.slice();
        for (let step = 0; step < steps; step += 1) {
          const next = current.slice();
          for (let index = 0; index < current.length; index += 1) {
            if (!current[index]) continue;
            const x = index % width;
            const y = Math.floor(index / width);
            if (x > 0 && (!limitMask || limitMask[index - 1])) next[index - 1] = 1;
            if (x < width - 1 && (!limitMask || limitMask[index + 1])) next[index + 1] = 1;
            if (y > 0 && (!limitMask || limitMask[index - width])) next[index - width] = 1;
            if (y < height - 1 && (!limitMask || limitMask[index + width])) next[index + width] = 1;
          }
          current = next;
        }
        return current;
      }

      function removeSmallMaskRegions(mask, width, height, minPixels) {
        const result = mask.slice();
        const seen = new Uint8Array(mask.length);
        for (let index = 0; index < mask.length; index += 1) {
          if (!result[index] || seen[index]) continue;
          const region = [index];
          seen[index] = 1;
          for (let cursor = 0; cursor < region.length; cursor += 1) {
            const current = region[cursor];
            const x = current % width;
            const y = Math.floor(current / width);
            if (x > 0 && result[current - 1] && !seen[current - 1]) {
              seen[current - 1] = 1;
              region.push(current - 1);
            }
            if (x < width - 1 && result[current + 1] && !seen[current + 1]) {
              seen[current + 1] = 1;
              region.push(current + 1);
            }
            if (y > 0 && result[current - width] && !seen[current - width]) {
              seen[current - width] = 1;
              region.push(current - width);
            }
            if (y < height - 1 && result[current + width] && !seen[current + width]) {
              seen[current + width] = 1;
              region.push(current + width);
            }
          }
          if (region.length >= minPixels) continue;
          region.forEach((pixelIndex) => {
            result[pixelIndex] = 0;
          });
        }
        return result;
      }

      function maskBounds(mask, width, height) {
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;
        let sumX = 0;
        let sumY = 0;
        let count = 0;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          sumX += x;
          sumY += y;
          count += 1;
        }
        if (!count) return null;
        return {
          minX,
          minY,
          maxX,
          maxY,
          width: maxX - minX + 1,
          height: maxY - minY + 1,
          centerX: sumX / count,
          centerY: sumY / count,
          count,
        };
      }

      function imageDataFromMask(sourceImageData, mask) {
        const output = new ImageData(sourceImageData.width, sourceImageData.height);
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const offset = index * 4;
          output.data[offset] = sourceImageData.data[offset];
          output.data[offset + 1] = sourceImageData.data[offset + 1];
          output.data[offset + 2] = sourceImageData.data[offset + 2];
          output.data[offset + 3] = sourceImageData.data[offset + 3];
        }
        return output;
      }

      function registerGeneratedMaskImage(baseName, suffix, imageData) {
        const id = `${customImagePrefix}${uid(`bow-${suffix}`)}`;
        registerCustomImage(id, `${baseName}-${suffix}.png`, imageDataToDataUrl(imageData));
        return id;
      }

      function splitBowImageLayers(image) {
        const sourceImageData = imageToImageData(image);
        const { width, height } = sourceImageData;
        const opaqueMask = createOpaqueMask(sourceImageData);
        const opaqueCount = maskPixelCount(opaqueMask);
        if (!opaqueCount) throw new Error("Bow image has no opaque pixels");
        const distanceMap = computeDistanceToTransparent(opaqueMask, width, height);
        const neighborCounts = computeOpaqueNeighborCounts(opaqueMask, width, height);
        const bodySeed = new Uint8Array(opaqueMask.length);
        for (let index = 0; index < opaqueMask.length; index += 1) {
          if (!opaqueMask[index]) continue;
          if (distanceMap[index] >= 3 || neighborCounts[index] >= 8) {
            bodySeed[index] = 1;
          }
        }
        let bodyMask = dilateMask(bodySeed, width, height, 2, opaqueMask);
        if (maskPixelCount(bodyMask) < opaqueCount * 0.35) {
          bodyMask = dilateMask(bodySeed, width, height, 3, opaqueMask);
        }
        let stringMask = new Uint8Array(opaqueMask.length);
        for (let index = 0; index < opaqueMask.length; index += 1) {
          stringMask[index] = opaqueMask[index] && !bodyMask[index] ? 1 : 0;
        }
        stringMask = removeSmallMaskRegions(stringMask, width, height, Math.max(12, Math.round(height * 0.015)));
        if (maskPixelCount(stringMask) < Math.max(24, Math.round(opaqueCount * 0.03))) {
          throw new Error("Failed to isolate bow string");
        }
        stringMask = dilateMask(stringMask, width, height, 2, opaqueMask);
        for (let index = 0; index < opaqueMask.length; index += 1) {
          bodyMask[index] = opaqueMask[index] && !stringMask[index] ? 1 : 0;
        }
        const bodyStats = maskBounds(bodyMask, width, height);
        const stringStats = maskBounds(stringMask, width, height);
        if (!bodyStats || !stringStats) {
          throw new Error("Failed to split bow body and string");
        }
        return {
          bodyImageData: imageDataFromMask(sourceImageData, bodyMask),
          stringImageData: imageDataFromMask(sourceImageData, stringMask),
          bodyStats,
          stringStats,
          size: { width, height },
        };
      }

      function estimateMaterialBackground(imageData) {
        const samples = [];
        const edge = Math.min(24, imageData.width, imageData.height);
        for (let y = 0; y < edge; y += 1) {
          for (let x = 0; x < edge; x += 1) {
            const points = [
              [x, y],
              [imageData.width - 1 - x, y],
              [x, imageData.height - 1 - y],
              [imageData.width - 1 - x, imageData.height - 1 - y],
            ];
            for (const [px, py] of points) {
              const offset = imageDataOffset(imageData, px, py);
              samples.push([imageData.data[offset], imageData.data[offset + 1], imageData.data[offset + 2]]);
            }
          }
        }
        return [0, 1, 2].map((channel) => {
          const sorted = samples.map((sample) => sample[channel]).sort((a, b) => a - b);
          return sorted[Math.floor(sorted.length / 2)] || 255;
        });
      }

      function materialColorDistance(background, r, g, b) {
        const dr = r - background[0];
        const dg = g - background[1];
        const db = b - background[2];
        return Math.sqrt(dr * dr + dg * dg + db * db);
      }

      function createMaterialForegroundMask(imageData) {
        const { width, height, data } = imageData;
        const background = estimateMaterialBackground(imageData);
        const count = width * height;
        const edgeBackground = new Uint8Array(count);
        const candidateBackground = new Uint8Array(count);
        const strongBackground = new Uint8Array(count);
        const queue = [];
        let cursor = 0;

        function backgroundDistance(index) {
          const offset = index * 4;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return materialColorDistance(background, r, g, b);
        }

        function isBackground(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return (
            backgroundDistance(index) <= materialReplacementOptions.backgroundTolerance ||
            (r >= 235 && g >= 232 && b >= 228)
          );
        }

        function isStrongBackground(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return (
            backgroundDistance(index) <= materialReplacementOptions.backgroundTolerance * 0.65 ||
            (r >= 244 && g >= 241 && b >= 238)
          );
        }

        function push(index) {
          if (edgeBackground[index]) return;
          edgeBackground[index] = 1;
          queue.push(index);
        }

        for (let index = 0; index < count; index += 1) {
          candidateBackground[index] = isBackground(index) ? 1 : 0;
          strongBackground[index] = isStrongBackground(index) ? 1 : 0;
        }

        for (let x = 0; x < width; x += 1) {
          const top = x;
          const bottom = (height - 1) * width + x;
          if (candidateBackground[top]) push(top);
          if (candidateBackground[bottom]) push(bottom);
        }
        for (let y = 0; y < height; y += 1) {
          const left = y * width;
          const right = y * width + width - 1;
          if (candidateBackground[left]) push(left);
          if (candidateBackground[right]) push(right);
        }

        while (cursor < queue.length) {
          const index = queue[cursor++];
          const x = index % width;
          const y = Math.floor(index / width);
          const neighbors = [];
          if (x > 0) neighbors.push(index - 1);
          if (x < width - 1) neighbors.push(index + 1);
          if (y > 0) neighbors.push(index - width);
          if (y < height - 1) neighbors.push(index + width);
          for (const neighbor of neighbors) {
            if (!edgeBackground[neighbor] && candidateBackground[neighbor]) {
              push(neighbor);
            }
          }
        }

        let holeBackground = new Uint8Array(count);
        const holeSeen = new Uint8Array(count);
        const minHolePixels = Math.max(24, Math.round(count * 0.00008));
        for (let index = 0; index < count; index += 1) {
          if (!strongBackground[index] || edgeBackground[index] || holeSeen[index]) continue;
          const region = [index];
          holeSeen[index] = 1;
          let touchesEdge = false;
          for (let regionCursor = 0; regionCursor < region.length; regionCursor += 1) {
            const current = region[regionCursor];
            const x = current % width;
            const y = Math.floor(current / width);
            if (x === 0 || y === 0 || x === width - 1 || y === height - 1) touchesEdge = true;
            if (x > 0 && strongBackground[current - 1] && !edgeBackground[current - 1] && !holeSeen[current - 1]) {
              holeSeen[current - 1] = 1;
              region.push(current - 1);
            }
            if (
              x < width - 1 &&
              strongBackground[current + 1] &&
              !edgeBackground[current + 1] &&
              !holeSeen[current + 1]
            ) {
              holeSeen[current + 1] = 1;
              region.push(current + 1);
            }
            if (
              y > 0 &&
              strongBackground[current - width] &&
              !edgeBackground[current - width] &&
              !holeSeen[current - width]
            ) {
              holeSeen[current - width] = 1;
              region.push(current - width);
            }
            if (
              y < height - 1 &&
              strongBackground[current + width] &&
              !edgeBackground[current + width] &&
              !holeSeen[current + width]
            ) {
              holeSeen[current + width] = 1;
              region.push(current + width);
            }
          }
          if (touchesEdge || region.length < minHolePixels) continue;
          region.forEach((pixelIndex) => {
            holeBackground[pixelIndex] = 1;
          });
        }
        if (maskPixelCount(holeBackground)) {
          holeBackground = dilateMask(holeBackground, width, height, 1, candidateBackground);
        }

        const foreground = new Uint8Array(count);
        for (let index = 0; index < count; index += 1) {
          foreground[index] = edgeBackground[index] || holeBackground[index] || data[index * 4 + 3] < 8 ? 0 : 1;
        }
        return foreground;
      }

      function removeDarkGuideLine(imageData, options = {}) {
        const { width, height, data } = imageData;
        const count = width * height;
        const visited = new Uint8Array(count);
        const alphaThreshold = Number.isFinite(Number(options.guideAlphaThreshold))
          ? Number(options.guideAlphaThreshold)
          : 28;
        const darkThreshold = Number.isFinite(Number(options.guideDarkThreshold))
          ? Number(options.guideDarkThreshold)
          : 52;
        const maxComponentWidth = Number.isFinite(Number(options.guideMaxWidth))
          ? Number(options.guideMaxWidth)
          : Math.max(12, Math.round(width * 0.18));
        const maxComponentX = Number.isFinite(Number(options.guideMaxX))
          ? Number(options.guideMaxX)
          : Math.max(18, Math.round(width * 0.24));
        const minComponentHeight = Number.isFinite(Number(options.guideMinHeight))
          ? Number(options.guideMinHeight)
          : Math.max(48, Math.round(height * 0.35));

        function isDarkGuidePixel(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < alphaThreshold) return false;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return Math.max(r, g, b) <= darkThreshold;
        }

        for (let index = 0; index < count; index += 1) {
          if (visited[index] || !isDarkGuidePixel(index)) continue;
          const queue = [index];
          const component = [];
          visited[index] = 1;
          let minX = width;
          let maxX = 0;
          let minY = height;
          let maxY = 0;

          for (let cursor = 0; cursor < queue.length; cursor += 1) {
            const current = queue[cursor];
            component.push(current);
            const x = current % width;
            const y = Math.floor(current / width);
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);

            const neighbors = [];
            if (x > 0) neighbors.push(current - 1);
            if (x < width - 1) neighbors.push(current + 1);
            if (y > 0) neighbors.push(current - width);
            if (y < height - 1) neighbors.push(current + width);
            neighbors.forEach((neighbor) => {
              if (visited[neighbor] || !isDarkGuidePixel(neighbor)) return;
              visited[neighbor] = 1;
              queue.push(neighbor);
            });
          }

          const componentWidth = maxX - minX + 1;
          const componentHeight = maxY - minY + 1;
          const isGuideLine =
            componentWidth <= maxComponentWidth &&
            minX <= maxComponentX &&
            componentHeight >= minComponentHeight;

          if (!isGuideLine) continue;
          component.forEach((pixelIndex) => {
            data[pixelIndex * 4 + 3] = 0;
          });
        }
      }

      async function normalizeForegroundImage(image, options = {}) {
        const imageData = imageToImageData(image);
        const foreground = createMaterialForegroundMask(imageData);
        const output = new ImageData(imageData.width, imageData.height);
        for (let index = 0; index < foreground.length; index += 1) {
          if (!foreground[index]) continue;
          const offset = index * 4;
          output.data[offset] = imageData.data[offset];
          output.data[offset + 1] = imageData.data[offset + 1];
          output.data[offset + 2] = imageData.data[offset + 2];
          output.data[offset + 3] = imageData.data[offset + 3];
        }
        if (options.removeDarkGuideLine) {
          removeDarkGuideLine(output, options);
        }
        return imageDataToImage(output);
      }

      function detectMaterialComponents(imageData, minPixels = materialReplacementOptions.minPixels) {
        const { width, height } = imageData;
        const foreground = createMaterialForegroundMask(imageData);
        const seen = new Uint8Array(width * height);
        const components = [];

        for (let index = 0; index < foreground.length; index += 1) {
          if (!foreground[index] || seen[index]) continue;
          const stack = [index];
          seen[index] = 1;
          let pixels = 0;
          let minX = width;
          let minY = height;
          let maxX = 0;
          let maxY = 0;

          for (let cursor = 0; cursor < stack.length; cursor += 1) {
            const current = stack[cursor];
            const x = current % width;
            const y = Math.floor(current / width);
            pixels += 1;
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
            const neighbors = [];
            if (x > 0) neighbors.push(current - 1);
            if (x < width - 1) neighbors.push(current + 1);
            if (y > 0) neighbors.push(current - width);
            if (y < height - 1) neighbors.push(current + width);
            for (const neighbor of neighbors) {
              if (foreground[neighbor] && !seen[neighbor]) {
                seen[neighbor] = 1;
                stack.push(neighbor);
              }
            }
          }

          if (pixels >= minPixels) {
            components.push({
              pixels,
              minX,
              minY,
              maxX,
              maxY,
              width: maxX - minX + 1,
              height: maxY - minY + 1,
              cx: (minX + maxX + 1) / 2,
              cy: (minY + maxY + 1) / 2,
              pixelIndices: stack.slice(),
            });
          }
        }
        return components.sort((a, b) => b.pixels - a.pixels);
      }

      function matchMaterialReferenceSlots(referenceImageData, referenceComponents) {
        const slots = [];
        const used = new Set();
        for (const spec of materialReplacementSpecsForUnit()) {
          let best = null;
          let bestScore = Number.POSITIVE_INFINITY;
          for (const component of referenceComponents) {
            if (used.has(component)) continue;
            const widthRatio = Math.abs(component.width - spec.targetWidth) / Math.max(spec.targetWidth, 1);
            const heightRatio = Math.abs(component.height - spec.targetHeight) / Math.max(spec.targetHeight, 1);
            const score = widthRatio + heightRatio;
            if (score < bestScore) {
              best = component;
              bestScore = score;
            }
          }
          if (!best) throw new Error(`Cannot find reference slot for ${spec.id}`);
          used.add(best);
          slots.push({
            ...spec,
            reference: best,
            referenceImageSize: {
              width: referenceImageData.width,
              height: referenceImageData.height,
            },
            normalizedCenter: {
              x: best.cx / referenceImageData.width,
              y: best.cy / referenceImageData.height,
            },
          });
        }
        return slots;
      }

      function matchMaterialInputComponents(inputImageData, inputComponents, slots) {
        const matches = [];
        const scaleX = inputImageData.width / slots[0].referenceImageSize.width;
        const scaleY = inputImageData.height / slots[0].referenceImageSize.height;
        for (const slot of slots) {
          const expected = {
            minX: Math.round(slot.reference.minX * scaleX),
            minY: Math.round(slot.reference.minY * scaleY),
            maxX: Math.round(slot.reference.maxX * scaleX),
            maxY: Math.round(slot.reference.maxY * scaleY),
          };
          expected.width = expected.maxX - expected.minX + 1;
          expected.height = expected.maxY - expected.minY + 1;
          expected.cx = (expected.minX + expected.maxX + 1) / 2;
          expected.cy = (expected.minY + expected.maxY + 1) / 2;

          let best = null;
          let bestScore = Number.POSITIVE_INFINITY;
          for (const component of inputComponents) {
            const cx = component.cx / inputImageData.width;
            const cy = component.cy / inputImageData.height;
            const dx = cx - slot.normalizedCenter.x;
            const dy = cy - slot.normalizedCenter.y;
            const positionScore = Math.sqrt(dx * dx + dy * dy) * 10;
            const sizeScore =
              Math.abs(component.width / inputImageData.width - expected.width / inputImageData.width) +
              Math.abs(component.height / inputImageData.height - expected.height / inputImageData.height);
            const score = positionScore + sizeScore;
            if (score < bestScore) {
              best = component;
              bestScore = score;
            }
          }
          if (!best) throw new Error(`Cannot find input component for ${slot.id}`);

          const tooWide = best.width > expected.width * 1.35;
          const tooTall = best.height > expected.height * 1.35;
          const tooFar =
            Math.abs(best.cx - expected.cx) > expected.width * 0.9 ||
            Math.abs(best.cy - expected.cy) > expected.height * 0.9;
          const preserveComponentBounds = slot.preserveComponentBounds === true;
          const shouldFallbackToSlot = !preserveComponentBounds && (tooWide || tooTall || tooFar);
          matches.push({
            slot,
            component: shouldFallbackToSlot ? expected : best,
            mode: shouldFallbackToSlot ? "slot" : "component",
          });
        }
        return matches;
      }

      function extractMaterialPiece(sourceImageData, component, padding) {
        const minX = Math.max(0, component.minX - padding);
        const minY = Math.max(0, component.minY - padding);
        const maxX = Math.min(sourceImageData.width - 1, component.maxX + padding);
        const maxY = Math.min(sourceImageData.height - 1, component.maxY + padding);
        const output = new ImageData(maxX - minX + 1, maxY - minY + 1);
        if (Array.isArray(component?.pixelIndices) && component.pixelIndices.length) {
          for (const sourceIndex of component.pixelIndices) {
            const x = sourceIndex % sourceImageData.width;
            const y = Math.floor(sourceIndex / sourceImageData.width);
            if (x < minX || x > maxX || y < minY || y > maxY) continue;
            const outputIndex = (y - minY) * output.width + (x - minX);
            const sourceOffset = sourceIndex * 4;
            const outputOffset = outputIndex * 4;
            output.data[outputOffset] = sourceImageData.data[sourceOffset];
            output.data[outputOffset + 1] = sourceImageData.data[sourceOffset + 1];
            output.data[outputOffset + 2] = sourceImageData.data[sourceOffset + 2];
            output.data[outputOffset + 3] = sourceImageData.data[sourceOffset + 3];
          }
          return output;
        }
        const foreground = createMaterialForegroundMask(sourceImageData);
        for (let y = minY; y <= maxY; y += 1) {
          for (let x = minX; x <= maxX; x += 1) {
            const sourceIndex = y * sourceImageData.width + x;
            const outputIndex = (y - minY) * output.width + (x - minX);
            const sourceOffset = sourceIndex * 4;
            const outputOffset = outputIndex * 4;
            if (!foreground[sourceIndex]) {
              output.data[outputOffset + 3] = 0;
              continue;
            }
            output.data[outputOffset] = sourceImageData.data[sourceOffset];
            output.data[outputOffset + 1] = sourceImageData.data[sourceOffset + 1];
            output.data[outputOffset + 2] = sourceImageData.data[sourceOffset + 2];
            output.data[outputOffset + 3] = sourceImageData.data[sourceOffset + 3];
          }
        }
        return output;
      }

      function normalizeMaterialPiece(pieceImageData, width, height, padding) {
        if (pieceImageData.width === width && pieceImageData.height === height) return pieceImageData;
        const output = new ImageData(width, height);
        const drawWidth = Math.max(1, width - padding * 2);
        const drawHeight = Math.max(1, height - padding * 2);
        for (let y = 0; y < drawHeight; y += 1) {
          const sourceY = Math.min(pieceImageData.height - 1, Math.floor((y / drawHeight) * pieceImageData.height));
          for (let x = 0; x < drawWidth; x += 1) {
            const sourceX = Math.min(pieceImageData.width - 1, Math.floor((x / drawWidth) * pieceImageData.width));
            const sourceOffset = (sourceY * pieceImageData.width + sourceX) * 4;
            const outputOffset = ((y + padding) * width + (x + padding)) * 4;
            output.data[outputOffset] = pieceImageData.data[sourceOffset];
            output.data[outputOffset + 1] = pieceImageData.data[sourceOffset + 1];
            output.data[outputOffset + 2] = pieceImageData.data[sourceOffset + 2];
            output.data[outputOffset + 3] = pieceImageData.data[sourceOffset + 3];
          }
        }
        return output;
      }

      function normalizeMatchedMaterialPiece(pieceImageData, slot, padding = materialReplacementOptions.padding) {
        if (slot?.preserveExtractedSize) return pieceImageData;
        return normalizeMaterialPiece(pieceImageData, slot.targetWidth, slot.targetHeight, padding);
      }

      function detectSpearmanFistComponent(inputImageData, inputComponents, matches = []) {
        if (!inputImageData || !Array.isArray(inputComponents) || !inputComponents.length) return null;
        const occupied = new Set(matches.map((match) => match?.component).filter(Boolean));
        const minWidth = Math.max(28, Math.round(inputImageData.width * 0.035));
        const maxWidth = Math.max(minWidth, Math.round(inputImageData.width * 0.22));
        const minHeight = Math.max(28, Math.round(inputImageData.height * 0.035));
        const maxHeight = Math.max(minHeight, Math.round(inputImageData.height * 0.2));
        let best = null;
        let bestScore = Number.POSITIVE_INFINITY;
        for (const component of inputComponents) {
          if (!component || occupied.has(component)) continue;
          if (component.cx <= inputImageData.width * 0.68 || component.cy <= inputImageData.height * 0.52) continue;
          if (component.width < minWidth || component.width > maxWidth) continue;
          if (component.height < minHeight || component.height > maxHeight) continue;
          const normalizedWidth = component.width / inputImageData.width;
          const normalizedHeight = component.height / inputImageData.height;
          const score =
            (1 - component.cx / inputImageData.width) * 2.2 +
            (1 - component.cy / inputImageData.height) * 1.8 +
            normalizedWidth * 3 +
            normalizedHeight * 3;
          if (score < bestScore) {
            best = component;
            bestScore = score;
          }
        }
        return best;
      }

      function resolvePreferredSpearmanFistImage(unitType = state.currentUnitType) {
        if (unitType !== "musketeer") return null;
        const existing = state.customImages?.[spearmanFistCustomImageId];
        if (!existing?.src) return null;
        return {
          name: existing.name || "spearman-fist.png",
          src: existing.src,
        };
      }

      function findSpearmanTorsoSixNode() {
        const exact = state.nodes.find(
          (node) =>
            node &&
            node.role === "torso" &&
            !node.attachment &&
            String(node.name || "").trim() === "\u8eaf\u5e72 6",
        );
        if (exact) return exact;
        return (
          state.nodes.find(
            (node) =>
              node &&
              node.role === "torso" &&
              !node.attachment &&
              /6\s*$/.test(String(node.name || "").trim()),
          ) || null
        );
      }

      function findAttachmentAncestorByImage(node, imageKey) {
        let current = node || null;
        while (current) {
          if (current.attachment?.image === imageKey) return current;
          current = current.parentId ? state.nodes.find((item) => item.id === current.parentId) || null : null;
        }
        return null;
      }

      function findNearestAttachmentAncestor(node) {
        let current = node || null;
        while (current) {
          if (current.attachment) return current;
          current = current.parentId ? state.nodes.find((item) => item.id === current.parentId) || null : null;
        }
        return null;
      }

      function clearSpearmanFistRig() {
        const removedIds = new Set();
        state.nodes = state.nodes.filter((node) => {
          const shouldRemove = [spearmanFistBoneRole, spearmanFistPieceRole].includes(node?.role);
          if (shouldRemove) removedIds.add(node.id);
          return !shouldRemove;
        });
        if (!removedIds.size) return;
        removedIds.forEach((nodeId) => {
          delete state.timelines[nodeId];
        });
        state.nodes.forEach((node) => {
          if (!node.attachment?.skinBoneIds?.length) return;
          node.attachment = normalizeAttachment({
            ...node.attachment,
            skinBoneIds: node.attachment.skinBoneIds.filter((boneId) => !removedIds.has(boneId)),
          });
        });
        if (state.selectedNodeId && removedIds.has(state.selectedNodeId)) state.selectedNodeId = null;
        if (state.selectedPieceNodeId && removedIds.has(state.selectedPieceNodeId)) state.selectedPieceNodeId = null;
        if (state.selectedKey && removedIds.has(state.selectedKey.nodeId)) state.selectedKey = null;
        resetRuntimeCaches();
      }

      function projectSourcePointIntoNormalizedSlot(sourceRect, slot, x, y, padding = materialReplacementOptions.padding) {
        if (!sourceRect || !slot) return null;
        const paddedWidth = Math.max(1, sourceRect.width + padding * 2);
        const paddedHeight = Math.max(1, sourceRect.height + padding * 2);
        const normalizedX = (x - (sourceRect.minX - padding)) / paddedWidth;
        const normalizedY = (y - (sourceRect.minY - padding)) / paddedHeight;
        return {
          x: Math.max(0, Math.min(1, normalizedX)) * slot.targetWidth,
          y: Math.max(0, Math.min(1, normalizedY)) * slot.targetHeight,
        };
      }

      function estimateMaterialToWorldTransform(matches) {
        const samples = (matches || [])
          .map((match) => {
            const piece = state.nodes.find((node) => node.attachment?.image === match?.slot?.imageKey);
            if (!piece || !match?.component) return null;
            const center = pieceCenter(piece);
            return {
              sourceX: Number(match.component.cx),
              sourceY: Number(match.component.cy),
              worldX: Number(center.x),
              worldY: Number(center.y),
            };
          })
          .filter(
            (sample) =>
              sample &&
              Number.isFinite(sample.sourceX) &&
              Number.isFinite(sample.sourceY) &&
              Number.isFinite(sample.worldX) &&
              Number.isFinite(sample.worldY),
          );
        if (samples.length < 2) return null;

        const fitAxis = (sourceKey, targetKey) => {
          const count = samples.length;
          let sumSource = 0;
          let sumTarget = 0;
          let sumSourceTarget = 0;
          let sumSourceSquared = 0;
          samples.forEach((sample) => {
            const source = sample[sourceKey];
            const target = sample[targetKey];
            sumSource += source;
            sumTarget += target;
            sumSourceTarget += source * target;
            sumSourceSquared += source * source;
          });
          const denominator = count * sumSourceSquared - sumSource * sumSource;
          if (Math.abs(denominator) < 0.00001) return null;
          const scale = (count * sumSourceTarget - sumSource * sumTarget) / denominator;
          const offset = (sumTarget - scale * sumSource) / count;
          return { scale, offset };
        };
