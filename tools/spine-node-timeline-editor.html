          el.attachmentHemLengthInput,
          el.attachmentHemAngleInput,
        ];
        const attachmentInputs = [
          el.attachmentOffsetXInput,
          el.attachmentOffsetYInput,
          el.attachmentWidthInput,
          el.attachmentLengthScaleInput,
          el.attachmentRotationInput,
          el.attachmentAlphaInput,
          el.attachmentLayerInput,
          el.attachmentAnchorXInput,
          el.attachmentSegmentsInput,
          el.attachmentReverseInput,
          ...scarfInputs,
          ...springInputs,
          ...hemInputs,
        ];
        el.attachmentImageSelect.value = attachment?.image || "";
        attachmentInputs.forEach((input) => {
          input.disabled = !attachment;
        });
        scarfInputs.forEach((input) => {
          input.disabled = !attachment || attachment.image !== "head";
        });
        springInputs.forEach((input) => {
          input.disabled = !attachment || !["head", "body"].includes(attachment.image);
        });
        hemInputs.forEach((input) => {
          input.disabled = !attachment || attachment.image !== "body";
        });
        el.attachmentOffsetXInput.value = round(attachment?.offsetX || 0);
        el.attachmentOffsetYInput.value = round(attachment?.offsetY || 0);
        el.attachmentWidthInput.value = round(attachment?.width || 48);
        el.attachmentLengthScaleInput.value = round(attachment?.lengthScale || 1, 2);
        el.attachmentRotationInput.value = round(attachment?.rotationOffset || 0);
        el.attachmentAlphaInput.value = round(attachment?.alpha ?? 1, 2);
        el.attachmentLayerInput.value = round(attachment?.layer || 0);
        el.attachmentAnchorXInput.value = round(attachment?.anchorX ?? 0.5, 2);
        el.attachmentSegmentsInput.checked = Boolean(attachment?.segments);
        el.attachmentReverseInput.checked = Boolean(attachment?.reverse);
        el.attachmentScarfEnabledInput.checked = Boolean(attachment?.scarfEnabled);
        el.attachmentScarfSplitInput.value = round(attachment?.scarfSplit ?? 0.52, 2);
        el.attachmentScarfRootXInput.value = round(attachment?.scarfRootX ?? 0.52, 2);
        el.attachmentScarfRootYInput.value = round(attachment?.scarfRootY ?? 0.6, 2);
        el.attachmentScarfTipXInput.value = round(attachment?.scarfLength ?? 0.55, 2);
        el.attachmentScarfTipYInput.value = round(attachment?.scarfAngle ?? 154);
        el.attachmentScarfStiffnessInput.value = round(attachment?.scarfStiffness ?? 0.06, 2);
        el.attachmentScarfDampingInput.value = round(attachment?.scarfDamping ?? 0.84, 2);
        el.attachmentScarfGravityInput.value = round(attachment?.scarfGravity ?? 420);
        el.attachmentScarfWaveInput.value = round(attachment?.scarfWave ?? 1, 2);
        el.attachmentHemEnabledInput.checked = Boolean(attachment?.hemEnabled);
        el.attachmentHemXInput.value = round(attachment?.hemX ?? 0.5, 2);
        el.attachmentHemYInput.value = round(attachment?.hemY ?? 0.68, 2);
        el.attachmentHemLengthInput.value = round(attachment?.hemLength ?? 0.75, 2);
        el.attachmentHemAngleInput.value = round(attachment?.hemAngle ?? 90);
      }

      function renderTimeline() {
        const rows = sortedNodes();
        const width = (state.duration + 1) * frameWidth;
        el.tracks.style.width = `${width}px`;
        el.tracks.style.height = `${(rows.length + 1) * rowHeight}px`;
        el.trackLabels.innerHTML = '<div class="track-label">帧 / 节点</div>';
        rows.forEach((node) => {
          const label = document.createElement("div");
          label.className = "track-label";
          label.textContent = `${"  ".repeat(node.depth)}${node.name}`;
          el.trackLabels.appendChild(label);
        });

        el.tracks.innerHTML = "";
        const ruler = document.createElement("div");
        ruler.className = "frame-ruler";
        ruler.style.width = `${width}px`;
        el.tracks.appendChild(ruler);

        for (let frame = 0; frame <= state.duration; frame += 4) {
          const line = document.createElement("div");
          line.className = "frame-line";
          line.style.left = `${frame * frameWidth}px`;
          line.style.opacity = frame % 24 === 0 ? "1" : "0.45";
          ruler.appendChild(line);
          if (frame % 12 === 0) {
            const label = document.createElement("div");
            label.className = "frame-label";
            label.style.left = `${frame * frameWidth}px`;
            label.textContent = frame + 1;
            ruler.appendChild(label);
          }
        }

        rows.forEach((node, index) => {
          const row = document.createElement("div");
          row.className = "track-row";
          row.style.width = `${width}px`;
          row.dataset.nodeId = node.id;
          row.style.height = `${rowHeight}px`;
          row.addEventListener("pointerdown", (event) => {
            if (event.target !== row) return;
            const frame = frameFromPointer(event, el.tracksViewport);
            state.currentFrame = clampFrame(frame);
            state.selectedNodeId = node.id;
            state.selectedKey = null;
            renderAll();
          });

          (state.timelines[node.id] || []).forEach((keyframe) => {
            const marker = document.createElement("div");
            marker.className =
              "key" +
              (state.selectedKey &&
              state.selectedKey.nodeId === node.id &&
              state.selectedKey.frame === keyframe.frame
                ? " active"
                : "");
            marker.style.left = `${keyframe.frame * frameWidth}px`;
            marker.title = `${node.name} @ 第 ${keyframe.frame + 1} 帧`;
            marker.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              event.stopPropagation();
              state.selectedNodeId = node.id;
              state.selectedKey = { nodeId: node.id, frame: keyframe.frame };
              drag = {
                type: "key",
                nodeId: node.id,
                startX: event.clientX,
                sourceFrame: keyframe.frame,
              };
              marker.setPointerCapture(event.pointerId);
              renderAll();
            });
            row.appendChild(marker);
          });

          row.style.position = "absolute";
          row.style.top = `${(index + 1) * rowHeight}px`;
          el.tracks.appendChild(row);
        });

        const playhead = document.createElement("div");
        playhead.className = "playhead";
        playhead.style.left = `${state.currentFrame * frameWidth}px`;
        el.tracks.appendChild(playhead);
      }

      function renderStatus() {
        el.frameInput.max = state.duration + 1;
        el.frameInput.value = Math.round(state.currentFrame) + 1;
        el.fpsInput.value = state.fps;
        el.durationInput.value = state.duration + 1;
        el.timeStatus.textContent = `第 ${Math.round(state.currentFrame) + 1} 帧 / ${state.duration + 1}，${state.fps} FPS，${(state.currentFrame / state.fps).toFixed(2)} 秒`;
        el.playBtn.textContent = state.playing ? "暂停" : "播放";
        el.viewToggleBtn.textContent = state.renderMode === "texture" ? "骨骼视图" : "贴图视图";
        el.skeletonOverlayBtn.textContent = state.showSkeletonOverlay ? "隐藏骨骼" : "显示骨骼";
        el.skeletonOverlayBtn.classList.toggle("active", state.showSkeletonOverlay);
        el.nodeModeBtn.classList.toggle("active", state.editMode === "node");
        el.boneModeBtn.classList.toggle("active", state.editMode === "bone");
        el.stretchModeBtn.classList.toggle("active", state.editMode === "stretch");
        el.addBoneModeBtn.classList.toggle("active", state.editMode === "add-bone");
        el.keySourcePrevBtn.classList.toggle("active", state.keyframeSource === "previous");
        el.keySourceNextBtn.classList.toggle("active", state.keyframeSource === "next");
        el.keySourceStartBtn.classList.toggle("active", state.keyframeSource === "start");
      }

      function renderJsonPreview() {
        el.jsonPreview.value = JSON.stringify(projectData(), null, 2);
      }

      function projectData() {
        return {
          format: "spine-node-timeline-editor",
          version: 1,
          name: state.name || "未命名",
          fps: state.fps,
          duration: state.duration,
          underlayImages: state.underlayImages,
          referenceImage: state.referenceImage,
          overlayImages: state.overlayImages,
          clothOverlays: state.clothOverlays,
          nodes: state.nodes,
          timelines: state.timelines,
        };
      }

      function applyProjectData(data) {
        if (!data || !Array.isArray(data.nodes) || typeof data.timelines !== "object") {
          throw new Error("JSON 缺少 nodes 或 timelines");
        }
        state.name = String(data.name || "未命名");
        state.fps = Math.max(1, Number(data.fps) || 24);
        state.duration = Math.max(0, Number.isFinite(Number(data.duration)) ? Number(data.duration) : 95);
        state.currentFrame = 0;
        state.selectedNodeId = data.nodes[0]?.id || null;
        state.selectedKey = null;
        state.playing = false;
        state.underlayImages = normalizePlacedImages(data.underlayImages);
        state.referenceImage = normalizeReferenceImage(data.referenceImage);
        state.overlayImages = normalizePlacedImages(data.overlayImages);
        state.clothOverlays = normalizeClothOverlays(data.clothOverlays);
        dynamicScarves.clear();
        state.nodes = data.nodes.map((node) => ({
          id: String(node.id || uid("node")),
          name: String(node.name || "node"),
          parentId: node.parentId || null,
          x: Number(node.x) || 0,
          y: Number(node.y) || 0,
          rotation: Number(node.rotation) || 0,
          length: Math.max(4, Number(node.length) || 80),
          scaleX: Math.max(0.05, Number(node.scaleX) || 1),
          scaleY: Math.max(0.05, Number(node.scaleY) || 1),
          color: /^#[0-9a-f]{6}$/i.test(node.color) ? node.color : "#35b6b4",
          role: String(node.role || node.partId || ""),
          bindPose: normalizeBindPose(node.bindPose || node),
          attachment: normalizeAttachment(node.attachment),
        }));
        state.timelines = {};
        Object.entries(data.timelines).forEach(([nodeId, keys]) => {
          if (!Array.isArray(keys)) return;
          state.timelines[nodeId] = keys
            .map((item) => ({
              frame: clampFrame(item.frame),
              x: Number(item.x) || 0,
              y: Number(item.y) || 0,
              rotation: Number(item.rotation) || 0,
              length: Math.max(4, Number(item.length) || 80),
              scaleX: Math.max(0.05, Number(item.scaleX) || 1),
              scaleY: Math.max(0.05, Number(item.scaleY) || 1),
            }))
            .sort((a, b) => a.frame - b.frame);
        });
      }

      function normalizeAttachment(attachment) {
        if (!attachment || typeof attachment !== "object") return null;
        return {
          image: String(attachment.image || ""),
          chainTo: attachment.chainTo ? String(attachment.chainTo) : null,
          width: Math.max(1, Number(attachment.width) || 48),
          alpha: Number.isFinite(Number(attachment.alpha))
            ? Math.max(0, Math.min(1, Number(attachment.alpha)))
            : 1,
          layer: Number(attachment.layer) || 0,
          anchorX: Number.isFinite(Number(attachment.anchorX)) ? Number(attachment.anchorX) : 0.5,
          lengthScale: Math.max(0.1, Number(attachment.lengthScale) || 1),
          reverse: Boolean(attachment.reverse),
          segments: Boolean(attachment.segments),
          rotationOffset: Number(attachment.rotationOffset) || 0,
          offsetX: Number(attachment.offsetX) || 0,
          offsetY: Number(attachment.offsetY) || 0,
          lower: normalizeSegmentAttachment(attachment.lower),
          fullSkin: Boolean(attachment.fullSkin),
          skinBoneIds: Array.isArray(attachment.skinBoneIds)
            ? attachment.skinBoneIds.map((id) => String(id))
            : [],
          restPart:
            attachment.restPart && typeof attachment.restPart === "object"
              ? {
                  partId: String(attachment.restPart.partId || ""),
                  x: Number(attachment.restPart.x) || 0,
                  y: Number(attachment.restPart.y) || 0,
                  scale: Math.max(0.001, Number(attachment.restPart.scale) || 1),
                  rotation: Number(attachment.restPart.rotation) || 0,
                  anchorX: Number.isFinite(Number(attachment.restPart.anchorX))
                    ? Number(attachment.restPart.anchorX)
                    : 0.5,
                  anchorY: Number.isFinite(Number(attachment.restPart.anchorY))
                    ? Number(attachment.restPart.anchorY)
                    : 0.5,
                }
              : null,
          scarfEnabled:
            attachment.scarfEnabled === undefined
              ? String(attachment.image || "") === "head"
              : Boolean(attachment.scarfEnabled),
          scarfSplit: clampNumber(attachment.scarfSplit, 0.05, 0.95, 0.52),
          scarfRootX: clampNumber(attachment.scarfRootX, 0, 1, 0.52),
          scarfRootY: clampNumber(attachment.scarfRootY, 0, 1, 0.6),
          scarfLength: normalizeSpringLength(attachment),
          scarfAngle: normalizeSpringAngle(attachment),
          scarfStiffness: clampNumber(attachment.scarfStiffness, 0, 1, 0.06),
          scarfDamping: clampNumber(attachment.scarfDamping, 0, 0.99, 0.84),
          scarfGravity: Number.isFinite(Number(attachment.scarfGravity))
            ? Number(attachment.scarfGravity)
            : 420,
          scarfWave: Number.isFinite(Number(attachment.scarfWave))
            ? Math.max(0, Number(attachment.scarfWave))
            : 1,
          hemEnabled: Boolean(attachment.hemEnabled),
          hemX: clampNumber(attachment.hemX, 0, 1, 0.5),
          hemY: clampNumber(attachment.hemY, 0, 1, 0.68),
          hemLength: clampNumber(attachment.hemLength, 0.05, 2, 0.75),
          hemAngle: Number.isFinite(Number(attachment.hemAngle)) ? Number(attachment.hemAngle) : 90,
        };
      }

      function normalizeSpringLength(attachment) {
        if (Number.isFinite(Number(attachment.scarfLength))) {
          return clampNumber(attachment.scarfLength, 0.05, 2, 0.55);
        }
        if (
          Number.isFinite(Number(attachment.scarfRootX)) &&
          Number.isFinite(Number(attachment.scarfRootY)) &&
          Number.isFinite(Number(attachment.scarfTipX)) &&
          Number.isFinite(Number(attachment.scarfTipY))
        ) {
          const dx = Number(attachment.scarfTipX) - Number(attachment.scarfRootX);
          const dy = Number(attachment.scarfTipY) - Number(attachment.scarfRootY);
          return clampNumber(Math.hypot(dx, dy), 0.05, 2, 0.55);
        }
        return 0.55;
      }

      function normalizeSpringAngle(attachment) {
        if (Number.isFinite(Number(attachment.scarfAngle))) return Number(attachment.scarfAngle);
        if (
          Number.isFinite(Number(attachment.scarfRootX)) &&
          Number.isFinite(Number(attachment.scarfRootY)) &&
          Number.isFinite(Number(attachment.scarfTipX)) &&
          Number.isFinite(Number(attachment.scarfTipY))
        ) {
          const dx = Number(attachment.scarfTipX) - Number(attachment.scarfRootX);
          const dy = Number(attachment.scarfTipY) - Number(attachment.scarfRootY);
          return (Math.atan2(dy, dx) * 180) / Math.PI;
        }
        return 154;
      }

      function normalizeSegmentAttachment(attachment) {
        if (!attachment || typeof attachment !== "object") return null;
        return {
          width: Math.max(1, Number(attachment.width) || 48),
          alpha: Number.isFinite(Number(attachment.alpha))
            ? Math.max(0, Math.min(1, Number(attachment.alpha)))
            : 1,
          anchorX: Number.isFinite(Number(attachment.anchorX)) ? Number(attachment.anchorX) : 0.5,
          rotationOffset: Number(attachment.rotationOffset) || 0,
          offsetX: Number(attachment.offsetX) || 0,
          offsetY: Number(attachment.offsetY) || 0,
        };
      }

      function normalizeBindPose(pose) {
        return {
          x: Number(pose?.x) || 0,
          y: Number(pose?.y) || 0,
          rotation: Number(pose?.rotation) || 0,
          length: Math.max(4, Number(pose?.length) || 80),
          scaleX: Math.max(0.05, Number(pose?.scaleX) || 1),
          scaleY: Math.max(0.05, Number(pose?.scaleY) || 1),
        };
      }

      function clampNumber(value, min, max, fallback) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.max(min, Math.min(max, number));
      }

      function round(value, places = 1) {
        const scale = 10 ** places;
        return Math.round(value * scale) / scale;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          })[char],
        );
      }

      function isDescendant(candidateId, ancestorId) {
        let current = state.nodes.find((node) => node.id === candidateId);
        while (current?.parentId) {
          if (current.parentId === ancestorId) return true;
          current = state.nodes.find((node) => node.id === current.parentId);
        }
        return false;
      }

      function setNodePatch(patch, shouldRender = true) {
        const node = selectedNode();
        if (!node) return;
        Object.assign(node, patch);
        syncKeyAtCurrentFrame(node);
        if (shouldRender) renderAll();
      }

      function setAttachmentPatch(patch) {
        const { owner: node, lower } = attachmentEditContext();
        if (!node) return;
        if (patch === null) {
          if (lower && node.attachment) node.attachment.lower = null;
          else node.attachment = null;
        } else {
          if (lower) {
            const sharedPatch = {};
            const lowerPatch = {};
            Object.entries(patch).forEach(([key, value]) => {
              if (["image", "chainTo", "segments", "layer"].includes(key)) sharedPatch[key] = value;
              else if (
                ["width", "alpha", "anchorX", "rotationOffset", "offsetX", "offsetY"].includes(key)
              ) {
                lowerPatch[key] = value;
              }
            });
            node.attachment = normalizeAttachment({
              ...(node.attachment || createDefaultAttachment()),
              ...sharedPatch,
              lower: normalizeSegmentAttachment({
                ...(node.attachment?.lower || {
                  width: node.attachment?.width,
                  alpha: node.attachment?.alpha,
                  anchorX: node.attachment?.anchorX,
                  rotationOffset: node.attachment?.rotationOffset,
                  offsetX: node.attachment?.offsetX,
                  offsetY: node.attachment?.offsetY,
                }),
                ...lowerPatch,
              }),
            });
          } else {
            node.attachment = normalizeAttachment({
              ...(node.attachment || createDefaultAttachment()),
              ...patch,
            });
          }
        }
        dynamicScarves.clear();
        renderAll();
      }

      function createDefaultAttachment(image = "body") {
        return {
          image,
          chainTo: null,
          width: image === "head" ? 56 : 48,
          alpha: 1,
          layer: 0,
          anchorX: 0.5,
          lengthScale: 1,
          reverse: false,
          segments: false,
          rotationOffset: 0,
          offsetX: 0,
          offsetY: 0,
          scarfEnabled: image === "head",
          scarfSplit: 0.52,
          scarfRootX: 0.52,
          scarfRootY: 0.6,
          scarfLength: 0.55,
          scarfAngle: 154,
          scarfStiffness: 0.06,
          scarfDamping: 0.84,
          scarfGravity: 420,
          scarfWave: 1,
          hemEnabled: false,
          hemX: 0.5,
          hemY: 0.68,
          hemLength: 0.75,
          hemAngle: 90,
        };
      }

      function syncKeyAtCurrentFrame(node) {
        const keys = state.timelines[node.id] || [];
        const existing = keys.find((item) => item.frame === state.currentFrame);
        if (existing) Object.assign(existing, snapshotNode(node));
      }

      function snapshotNode(node) {
        const override = poseOverrides.get(node.id);
        const source = override ? { ...node, ...override } : node;
        return {
          frame: state.currentFrame,
          x: source.x,
          y: source.y,
          rotation: source.rotation,
          length: source.length,
          scaleX: source.scaleX,
          scaleY: source.scaleY,
        };
      }

      function copyPoseAtFrame(source, frame = state.currentFrame) {
        return {
          frame,
          x: source.x,
          y: source.y,
          rotation: source.rotation,
          length: source.length,
          scaleX: source.scaleX,
          scaleY: source.scaleY,
        };
      }

      function sourceSnapshotNode(node) {
        const keys = [...(state.timelines[node.id] || [])].sort((a, b) => a.frame - b.frame);
        if (!keys.length) return snapshotNode(node);
        const start = keys.find((item) => item.frame === 0) || keys[0];
        const previous = [...keys].reverse().find((item) => item.frame < state.currentFrame) || start;
        const next = keys.find((item) => item.frame > state.currentFrame) || start;
        const source =
          state.keyframeSource === "next" ? next : state.keyframeSource === "start" ? start : previous;
        return copyPoseAtFrame(source);
      }

      function addKeyframe(node = selectedNode()) {
        if (!node) return;
        upsertKeyframe(node, sourceSnapshotNode(node));
        state.selectedKey = { nodeId: node.id, frame: state.currentFrame };
        toast(`已记录 ${node.name} 第 ${state.currentFrame + 1} 帧`);
        renderAll();
      }

      function upsertKeyframe(node, snap = snapshotNode(node)) {
        const keys = state.timelines[node.id] || [];
        const existing = keys.find((item) => item.frame === state.currentFrame);
        if (existing) Object.assign(existing, snap);
        else keys.push(snap);
        keys.sort((a, b) => a.frame - b.frame);
        state.timelines[node.id] = keys;
      }

      function deleteSelectedKey() {
        if (!state.selectedKey) {
          const node = selectedNode();
          if (!node) return;
          state.selectedKey = { nodeId: node.id, frame: state.currentFrame };
        }
        const keys = state.timelines[state.selectedKey.nodeId] || [];
        const next = keys.filter((item) => item.frame !== state.selectedKey.frame);
        state.timelines[state.selectedKey.nodeId] = next;
        state.selectedKey = null;
        renderAll();
      }

      function frameFromPointer(event, container) {
        const rect = container.getBoundingClientRect();
        const x = event.clientX - rect.left + container.scrollLeft;
        return Math.round(x / frameWidth);
      }

      function canvasPoint(event) {
        const rect = el.stage.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
        };
      }

      function hitTest(point) {
        if (state.editMode === "stretch") return hitTestStretch(point);
        if (state.editMode === "add-bone") return null;
        const nodes = sortedNodes().reverse();
        for (const node of nodes) {
          const pose = worldPose(node);
          const end = endPoint(pose);
          if (distance(point, end) <= 12) {
            const childAtJoint = firstChildOf(node.id);
            if (childAtJoint) {
              return { type: "origin", node: childAtJoint, jointId: endJointId(node) };
            }
            return { type: "end", node, jointId: endJointId(node) };
          }
          if (distance(point, { x: pose.worldX, y: pose.worldY }) <= 12) {
            return { type: "origin", node, jointId: startJointId(node) };
          }
          if (pointSegmentDistance(point, { x: pose.worldX, y: pose.worldY }, end) <= 8) {
            return { type: "bone", node };
          }
        }
        return null;
      }

      function hitTestStretch(point) {
        const active = selectedNode();
        if (active) {
          const activeHit = hitTestStretchNode(point, active);
          if (activeHit) return activeHit;
        }
        const nodes = sortedNodes().reverse();
        for (const node of nodes) {
          if (node.id === active?.id) continue;
          const hit = hitTestStretchNode(point, node);
          if (hit) return hit;
        }
        return null;
      }

      function hitTestStretchNode(point, node) {
        const pose = worldPose(node);
        const end = endPoint(pose);
        if (distance(point, end) <= 14) {
          return { type: "stretch-end", node, jointId: endJointId(node) };
        }
        if (distance(point, { x: pose.worldX, y: pose.worldY }) <= 14) {
          return { type: "stretch-origin", node, jointId: startJointId(node) };
        }
        return null;
      }

      function firstChildOf(parentId) {
        return sortedNodes().find((node) => node.parentId === parentId) || null;
      }

      function startJointId(node) {
        return node.parentId ? endJointId({ id: node.parentId }) : `base:${node.id}`;
      }

      function endJointId(node) {
        return `end:${node.id}`;
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function pointSegmentDistance(point, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (lengthSquared === 0) return distance(point, a);
        const t = Math.max(
          0,
          Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared),
        );
        return distance(point, { x: a.x + dx * t, y: a.y + dy * t });
      }

      function createManualBoneFromDrag(start, end, parent = selectedNode()) {
        const length = distance(start, end);
        if (length < 8) {
          toast("拖拽距离太短，未创建骨骼");
          return null;
        }
        const id = uid("bone");
        const parentPose = parent ? worldPose(parent) : null;
        const localStart = parent ? localFromWorld({ parentId: parent.id }, start) : start;
        const worldRotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI;
        const node = {
          id,
          name: `bone_${state.nodes.length + 1}`,
          parentId: parent?.id || null,
          x: round(localStart.x, 2),
          y: round(localStart.y, 2),
          rotation: round(worldRotation - (parentPose?.worldRotation || 0), 2),
          length: round(length, 2),
          scaleX: 1,
          scaleY: 1,
          color: ["#35b6b4", "#e6a23c", "#77c66e", "#d96a7b", "#4d8ecf"][
            state.nodes.length % 5
          ],
        };
        node.bindPose = normalizeBindPose(node);
        state.nodes.push(node);
        state.timelines[id] = [{ ...snapshotNode(node), frame: state.currentFrame }];
        state.selectedNodeId = id;
        state.selectedKey = { nodeId: id, frame: state.currentFrame };
        return node;
      }

      function drawCreateBonePreview() {
        if (!drag || drag.type !== "create-bone") return;
        ctx.save();
        ctx.lineWidth = 4;
        ctx.strokeStyle = varColor("--accent-2");
        ctx.fillStyle = varColor("--accent-2");
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(drag.start.x, drag.start.y);
        ctx.lineTo(drag.end.x, drag.end.y);
        ctx.stroke();
        ctx.setLineDash([]);
        [drag.start, drag.end].forEach((point) => {
          ctx.beginPath();
          ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function localFromWorld(node, world) {
        if (!node.parentId) return world;
        const parent = state.nodes.find((item) => item.id === node.parentId);
        if (!parent) return world;
        const p = worldPose(parent);
        const anchor = endPoint(p);
        const dx = world.x - anchor.x;
        const dy = world.y - anchor.y;
        const rad = (-p.worldRotation * Math.PI) / 180;
        return {
          x: (dx * Math.cos(rad) - dy * Math.sin(rad)) / p.worldScaleX,
          y: (dx * Math.sin(rad) + dy * Math.cos(rad)) / p.worldScaleY,
        };
      }

      function captureWorldPoses() {
        return Object.fromEntries(
          state.nodes.map((node) => {
            const pose = worldPose(node);
            const end = endPoint(pose);
            return [
              node.id,
              {
                origin: { x: pose.worldX, y: pose.worldY },
                end: { x: end.x, y: end.y },
              },
            ];
          }),
        );
      }

      function solveGenericJointDrag(jointId, targetWorld) {
        const positions = captureJointPositions();
        positions[jointId] = { x: targetWorld.x, y: targetWorld.y };
        const edges = state.nodes.map((node) => ({
          node,
          startId: startJointId(node),
          endId: endJointId(node),
          length: node.length,
        }));

        for (let pass = 0; pass < 18; pass += 1) {
          edges.forEach((edge) => {
            const start = positions[edge.startId];
            const end = positions[edge.endId];
            if (!start || !end) return;
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const currentLength = Math.hypot(dx, dy);
            if (currentLength <= 0.001) return;
            const diff = (currentLength - edge.length) / currentLength;
            const offset = { x: dx * diff, y: dy * diff };
            const startPinned = edge.startId === jointId;
            const endPinned = edge.endId === jointId;
            if (startPinned && !endPinned) {
              end.x -= offset.x;
              end.y -= offset.y;
            } else if (!startPinned && endPinned) {
              start.x += offset.x;
              start.y += offset.y;
            } else if (!startPinned && !endPinned) {
              start.x += offset.x * 0.5;
              start.y += offset.y * 0.5;
              end.x -= offset.x * 0.5;
              end.y -= offset.y * 0.5;
            }
          });
          positions[jointId] = { x: targetWorld.x, y: targetWorld.y };
        }

        applySolvedJointPositions(positions);
      }

      function captureJointPositions() {
        const positions = {};
        sortedNodes().forEach((node) => {
          const pose = worldPose(node);
          positions[startJointId(node)] = { x: pose.worldX, y: pose.worldY };
          positions[endJointId(node)] = endPoint(pose);
        });
        return positions;
      }

      function applySolvedJointPositions(positions) {
        sortedNodes().forEach((node) => {
          const start = positions[startJointId(node)];
          const end = positions[endJointId(node)];
          if (!start || !end) return;
          if (!node.parentId) {
            node.x = start.x;
            node.y = start.y;
          } else {
            node.x = 0;
            node.y = 0;
          }
          const parentRotation = node.parentId
            ? worldPose(state.nodes.find((item) => item.id === node.parentId)).worldRotation
            : 0;
          node.rotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI - parentRotation;
          poseOverrides.set(node.id, {
            x: node.x,
            y: node.y,
            rotation: node.rotation,
            length: node.length,
            scaleX: node.scaleX,
            scaleY: node.scaleY,
          });
          syncKeyAtCurrentFrame(node);
          drag?.touched?.add(node.id);
        });
      }

      function moveBoneRigid(node, deltaWorld, startWorldOrigin) {
        const targetOrigin = {
          x: startWorldOrigin.x + deltaWorld.x,
          y: startWorldOrigin.y + deltaWorld.y,
        };
        const local = localFromWorld(node, targetOrigin);
        node.x = local.x;
        node.y = local.y;
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
        syncKeyAtCurrentFrame(node);
        drag?.touched?.add(node.id);
      }

      function stretchBoneEndpoint(node, movingType, targetWorld) {
        const start = movingType === "stretch-origin" ? targetWorld : drag.startWorldOrigin;
        const end = movingType === "stretch-end" ? targetWorld : drag.startWorldEnd;
        const parent = node.parentId ? state.nodes.find((item) => item.id === node.parentId) : null;
        const parentPose = parent ? worldPose(parent) : null;
        const parentRotation = parentPose?.worldRotation || 0;
        const parentScaleX = Math.abs(parentPose?.worldScaleX || 1);
        const nodeScaleX = Math.abs(node.scaleX || 1);
        const localStart = localFromWorld(node, start);
        const worldLength = distance(start, end);
        node.x = localStart.x;
        node.y = localStart.y;
        node.rotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI - parentRotation;
        node.length = Math.max(4, worldLength / Math.max(0.001, parentScaleX * nodeScaleX));
        poseOverrides.set(node.id, {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        });
        syncKeyAtCurrentFrame(node);
        drag?.touched?.add(node.id);
      }

      function toast(message) {
        el.toast.textContent = message;
        el.toast.classList.add("show");
        window.clearTimeout(toast.timer);
        toast.timer = window.setTimeout(() => el.toast.classList.remove("show"), 1700);
      }

      function downloadJson() {
        const blob = new Blob([JSON.stringify(projectData(), null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "spine-node-animation.json";
        anchor.click();
        URL.revokeObjectURL(url);
      }

      function resetProject() {

      function buildIdleTimelineForNode(node, duration = 47) {
        const loopLength = duration + 1;
        const frames = [0, 0.25, 0.5, 0.75].map((ratio) =>
          Math.max(0, Math.min(duration, Math.round(loopLength * ratio))),
        );
        const base = {
          x: node.x,
          y: node.y,
          rotation: node.rotation,
          length: node.length,
          scaleX: node.scaleX,
          scaleY: node.scaleY,
        };
        return frames.map((frame, index) => idlePoseAtFrame(node, base, frame, index));
      }

      function idlePoseAtFrame(node, base, frame, index) {
        const breath = [0, 1, 0, -0.65][index] || 0;
        const sway = [0, 0.55, 0, -0.55][index] || 0;
        const role = idleRole(node);
        const pose = { frame, ...base };
        if (!node.parentId) {
          pose.y = base.y - breath * 2.5;
          pose.rotation = base.rotation + sway * 0.35;
        }
        if (role === "head") {
          pose.y = base.y - breath * 0.8;
          pose.rotation = base.rotation - sway * 0.9;
        } else if (role === "torso") {
          pose.rotation = base.rotation + sway * 1.2;
          pose.length = Math.max(4, base.length * (1 - breath * 0.012));
        } else if (role === "rightArm") {
          pose.rotation = base.rotation - breath * 1.8 + sway * 0.7;
          pose.length = Math.max(4, base.length * (1 + breath * 0.004));
        } else if (role === "leftArm") {
          pose.rotation = base.rotation + breath * 1.5 - sway * 0.6;
          pose.length = Math.max(4, base.length * (1 + breath * 0.004));
        } else if (role === "rightLeg") {
          pose.rotation = base.rotation + sway * 0.45;
        } else if (role === "leftLeg") {
          pose.rotation = base.rotation - sway * 0.45;
        }
        return {
          frame: pose.frame,
          x: round(pose.x, 2),
          y: round(pose.y, 2),
          rotation: round(pose.rotation, 2),
          length: round(pose.length, 2),
          scaleX: round(pose.scaleX, 3),
          scaleY: round(pose.scaleY, 3),
        };
      }

      function idleRole(node) {
        if (node.role) return node.role;
        const name = String(node.name || "").toLowerCase();
        if (name.includes("head") || name.includes("头")) return "head";
        if (name.includes("torso") || name.includes("身") || name.includes("躯")) return "torso";
        if (name.includes("rightarm") || name.includes("右臂")) return "rightArm";
        if (name.includes("leftarm") || name.includes("左臂")) return "leftArm";
        if (name.includes("rightleg") || name.includes("右腿")) return "rightLeg";
        if (name.includes("leftleg") || name.includes("左腿")) return "leftLeg";
        return "";
      }

      function buildNewVersionProject(layout) {
        const scale = 0.26;
        const offset = { x: 170, y: 0 };
        const colors = {
          head: "#77c66e",
          torso: "#e6a23c",
          leftArm: "#4d8ecf",
          rightArm: "#d96a7b",
          leftLeg: "#9a7af0",
          rightLeg: "#70c99b",
          sword: "#d8d2bd",
        };
        const imageKeys = {
          head: "newHead",
          torso: "newTorso",
          leftArm: "newLeftArm",
          rightArm: "newRightArm",
          leftLeg: "newLeftLeg",
          rightLeg: "newRightLeg",
          sword: "newSword",
        };
        const toStage = (point) => ({
          x: point.x * scale + offset.x,
          y: point.y * scale + offset.y,
        });
        const samePoint = (a, b) => distance(a, b) <= 1.5;
        const nodeByBoneId = new Map();
        const nodes = layout.bones.map((bone) => {
          const start = toStage(bone.pixelStart);
          const end = toStage(bone.pixelEnd);
          const parentBone = layout.bones.find(
            (candidate) => candidate.id !== bone.id && samePoint(candidate.pixelEnd, bone.pixelStart),
          );
          const parentNode = parentBone ? nodeByBoneId.get(parentBone.id) : null;
          const worldRotation = (Math.atan2(end.y - start.y, end.x - start.x) * 180) / Math.PI;
          const parentRotation = parentNode ? parentNode.worldRotation : 0;
          const parentEnd = parentNode
            ? {
                x: parentNode.worldStart.x + Math.cos((parentNode.worldRotation * Math.PI) / 180) * parentNode.length,
                y: parentNode.worldStart.y + Math.sin((parentNode.worldRotation * Math.PI) / 180) * parentNode.length,
              }
            : null;
          const localOffset = parentNode ? rotateVector(start.x - parentEnd.x, start.y - parentEnd.y, -parentRotation) : start;
          const node = {
            id: bone.id,
            name: bone.name,
            parentId: parentNode?.id || null,
            x: parentNode ? round(localOffset.x, 2) : round(start.x, 2),
            y: parentNode ? round(localOffset.y, 2) : round(start.y, 2),
            rotation: round(worldRotation - parentRotation, 2),
            length: round(distance(start, end), 2),
            scaleX: 1,
            scaleY: 1,
            color: colors[bone.partId] || "#35b6b4",
            role: bone.partId,
            worldStart: start,
            worldRotation,
          };
          nodeByBoneId.set(bone.id, node);
          return node;
        });

        const timelines = {};
        nodes.forEach((node) => {
          const { worldStart, worldRotation, ...cleanNode } = node;
          Object.assign(node, cleanNode);
          node.bindPose = normalizeBindPose(node);
          timelines[node.id] = buildIdleTimelineForNode(node, 47);
          delete node.worldStart;
          delete node.worldRotation;
        });

        const partBoneIds = resolveNewVersionPartBoneIds(layout.bones);
        for (const part of layout.parts) {
          const partBones = (partBoneIds[part.id] || []).map((id) => layout.bones.find((bone) => bone.id === id)).filter(Boolean);
          const skinBoneIds =
            partBones.length > 0
              ? partBones.map((bone) => bone.id)
              : fallbackSkinBoneIds(part.id, layout.bones);
          const owner = nodes.find((node) => node.id === skinBoneIds[0]);
          if (!owner) continue;
          owner.attachment = {
            image: imageKeys[part.id],
            chainTo: null,
            width: 48,
            alpha: 1,
            layer: part.layer,
            anchorX: part.anchorX,
            lengthScale: 1,
            reverse: false,
            segments: false,
            fullSkin: true,
            skinBoneIds,
            rotationOffset: 0,
            offsetX: 0,
            offsetY: 0,
            restPart: {
              partId: part.id,
              x: round(part.x * scale + offset.x, 2),
              y: round(part.y * scale + offset.y, 2),
              scale: round(part.scale * scale, 4),
              rotation: part.rotation,
              anchorX: part.anchorX,
              anchorY: part.anchorY,
            },
          };
        }

        return {
          format: "spine-node-timeline-editor",
          version: 1,
          name: "新版",
          fps: 24,
          duration: 47,
          nodes,
          timelines,
        };
      }

      function fallbackSkinBoneIds(partId, bones) {
        if (partId === "sword") {
          return bones.filter((bone) => bone.partId === "rightArm").slice(-1).map((bone) => bone.id);
        }
        return [];
      }

      function resolveNewVersionPartBoneIds(bones) {
        const byPart = (partId) => bones.filter((bone) => bone.partId === partId).map((bone) => bone.id);
        const torsoBones = bones.filter((bone) => bone.partId === "torso");
        return {
          head: byPart("head"),
          torso: torsoBones.slice(0, 4).map((bone) => bone.id),
          rightArm: byPart("rightArm"),
          leftArm: torsoBones.slice(4, 6).map((bone) => bone.id),
          leftLeg: byPart("leftLeg"),
          rightLeg: byPart("rightLeg"),
          sword: bones.filter((bone) => bone.partId === "rightArm").slice(-1).map((bone) => bone.id),
        };
      }

      function rotateVector(x, y, degrees) {
        const angle = (degrees * Math.PI) / 180;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: x * cos - y * sin,
          y: x * sin + y * cos,
        };
      }

      function bindEvents() {
        window.addEventListener("resize", resizeCanvas);
        el.addNodeBtn.addEventListener("click", () => {
          state.editMode = "add-bone";
          renderStatus();
          toast("画骨骼：在画布上从起点拖到终点");
        });

        el.deleteNodeBtn.addEventListener("click", () => {
          const node = selectedNode();
          if (!node) return;
          if (state.nodes.length === 1) {
            toast("至少保留一个节点");
            return;
          }
          state.nodes.forEach((item) => {
            if (item.parentId === node.id) item.parentId = node.parentId;
          });
          state.nodes = state.nodes.filter((item) => item.id !== node.id);
          delete state.timelines[node.id];
          state.selectedNodeId = state.nodes[0]?.id || null;
          state.selectedKey = null;
          renderAll();
        });

        el.keyframeBtn.addEventListener("click", () => addKeyframe());
        el.keySourcePrevBtn.addEventListener("click", () => {
          state.keyframeSource = "previous";
          renderStatus();
        });
        el.keySourceNextBtn.addEventListener("click", () => {
          state.keyframeSource = "next";
          renderStatus();
        });
        el.keySourceStartBtn.addEventListener("click", () => {
          state.keyframeSource = "start";
          renderStatus();
        });
        el.snapAllBtn.addEventListener("click", () => {
          state.nodes.forEach((node) => addKeyframe(node));
          toast(`已记录全部节点第 ${state.currentFrame + 1} 帧`);
        });
        el.deleteKeyBtn.addEventListener("click", deleteSelectedKey);

        el.playBtn.addEventListener("click", () => {
          state.playing = !state.playing;
          lastTime = performance.now();
          if (state.playing) dynamicScarves.clear();
          renderStatus();
          if (state.playing) rafId = requestAnimationFrame(tick);
        });
        el.prevFrameBtn.addEventListener("click", () => {
          state.currentFrame = clampFrame(state.currentFrame - 1);
          state.selectedKey = null;
          renderAll();
        });
        el.nextFrameBtn.addEventListener("click", () => {
          state.currentFrame = clampFrame(state.currentFrame + 1);
          state.selectedKey = null;
          renderAll();
        });
        el.frameInput.addEventListener("change", () => {
          state.currentFrame = clampFrame((Number(el.frameInput.value) || 1) - 1);
          state.selectedKey = null;
          renderAll();
        });
        el.frameInput.addEventListener("input", () => {
          state.currentFrame = clampFrame((Number(el.frameInput.value) || 1) - 1);
          state.selectedKey = null;
          renderAll();
        });
        el.fpsInput.addEventListener("change", () => {
          state.fps = Math.max(1, Math.min(120, Number(el.fpsInput.value) || 24));
          renderAll();
        });
        el.durationInput.addEventListener("change", () => {
          state.duration = Math.max(0, Math.min(1199, (Number(el.durationInput.value) || 1) - 1));
          state.currentFrame = clampFrame(state.currentFrame);
          Object.keys(state.timelines).forEach((id) => {
            state.timelines[id] = state.timelines[id].filter(
              (item) => item.frame <= state.duration,
            );
          });
          renderAll();
        });

        bindPropertyInputs();
        bindCanvas();
        bindTimelineDrag();

        el.exportBtn.addEventListener("click", downloadJson);
        el.importBtn.addEventListener("click", () => el.fileInput.click());
        el.fileInput.addEventListener("change", async () => {
          const file = el.fileInput.files[0];
          if (!file) return;
          try {
            applyProjectData(JSON.parse(await file.text()));
            renderAll();
            toast("JSON 已导入");
          } catch (error) {
            toast(error.message || "导入失败");
          } finally {
            el.fileInput.value = "";
          }
        });
        el.copyJsonBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(el.jsonPreview.value);
          toast("JSON 已复制");
        });
        el.applyJsonBtn.addEventListener("click", () => {
          try {
            applyProjectData(JSON.parse(el.jsonPreview.value));
            renderAll();
            toast("JSON 文本已应用");
          } catch (error) {
            toast(error.message || "JSON 解析失败");
          }
        });
        el.sampleBtn.addEventListener("click", loadSample);
        el.walkSampleBtn.addEventListener("click", loadSideWalkSample);
        el.newVersionSampleBtn.addEventListener("click", loadNewVersionSample);
        el.openingMonkSampleBtn.addEventListener("click", loadOpeningMonkSample);
        el.openingCloakSampleBtn.addEventListener("click", loadOpeningCloakSample);
        el.idleAnimationBtn.addEventListener("click", applyIdleAnimation);
        el.slashSampleBtn.addEventListener("click", loadSideSlashSample);
        el.threeQuarterSampleBtn.addEventListener("click", loadThreeQuarterSample);
        el.viewToggleBtn.addEventListener("click", () => {
          state.renderMode = state.renderMode === "texture" ? "skeleton" : "texture";
          renderAll();
        });
        el.skeletonOverlayBtn.addEventListener("click", () => {
          state.showSkeletonOverlay = !state.showSkeletonOverlay;
          renderAll();
        });
        el.newProjectBtn.addEventListener("click", resetProject);
        el.nodeModeBtn.addEventListener("click", () => {
          state.editMode = "node";
          renderStatus();
          toast("节点移动：拖圆点关节，骨骼保持长度并递归传导");
        });
        el.boneModeBtn.addEventListener("click", () => {
          state.editMode = "bone";
          renderStatus();
          toast("骨骼移动：只在拖骨骼线段中间时生效，圆点仍按节点拖动");
        });
        el.stretchModeBtn.addEventListener("click", () => {
          state.editMode = "stretch";
          renderStatus();
          toast("骨骼伸缩：拖动一个端点，另一个端点固定，自动旋转并改变长度");
        });
        el.addBoneModeBtn.addEventListener("click", () => {
          state.editMode = "add-bone";
          renderStatus();
          toast("画骨骼：在画布上从起点拖到终点");
        });
      }

      function bindPropertyInputs() {
        el.nodeNameInput.addEventListener("input", () =>
          setNodePatch({ name: el.nodeNameInput.value || "node" }),
        );
        el.parentSelect.addEventListener("change", () =>
          setNodePatch({ parentId: el.parentSelect.value || null }),
        );
        el.xInput.addEventListener("change", () => setNodePatch({ x: Number(el.xInput.value) || 0 }));
        el.yInput.addEventListener("change", () => setNodePatch({ y: Number(el.yInput.value) || 0 }));
        el.rotationInput.addEventListener("change", () =>
          setNodePatch({ rotation: Number(el.rotationInput.value) || 0 }),
        );
        el.lengthInput.addEventListener("change", () =>
          setNodePatch({ length: Math.max(4, Number(el.lengthInput.value) || 80) }),
        );
        el.scaleXInput.addEventListener("change", () =>
          setNodePatch({ scaleX: Math.max(0.05, Number(el.scaleXInput.value) || 1) }),
        );
        el.scaleYInput.addEventListener("change", () =>
          setNodePatch({ scaleY: Math.max(0.05, Number(el.scaleYInput.value) || 1) }),
        );
        el.colorInput.addEventListener("input", () => setNodePatch({ color: el.colorInput.value }));
        el.attachmentImageSelect.addEventListener("change", () => {
          const image = el.attachmentImageSelect.value;
          if (!image) {
            setAttachmentPatch(null);
            return;
          }
          setAttachmentPatch({ ...createDefaultAttachment(image), ...(attachmentEditNode()?.attachment || {}), image });
        });
        el.attachmentOffsetXInput.addEventListener("change", () =>
          setAttachmentPatch({ offsetX: Number(el.attachmentOffsetXInput.value) || 0 }),
        );
        el.attachmentOffsetYInput.addEventListener("change", () =>
          setAttachmentPatch({ offsetY: Number(el.attachmentOffsetYInput.value) || 0 }),
        );
        el.attachmentWidthInput.addEventListener("change", () =>
          setAttachmentPatch({ width: Math.max(1, Number(el.attachmentWidthInput.value) || 48) }),
        );
        el.attachmentLengthScaleInput.addEventListener("change", () =>
          setAttachmentPatch({
            lengthScale: Math.max(0.1, Number(el.attachmentLengthScaleInput.value) || 1),
          }),
        );
        el.attachmentRotationInput.addEventListener("change", () =>
          setAttachmentPatch({ rotationOffset: Number(el.attachmentRotationInput.value) || 0 }),
        );
        el.attachmentAlphaInput.addEventListener("change", () =>
          setAttachmentPatch({
            alpha: Math.max(0, Math.min(1, Number(el.attachmentAlphaInput.value) || 0)),
          }),
        );
        el.attachmentLayerInput.addEventListener("change", () =>
          setAttachmentPatch({ layer: Number(el.attachmentLayerInput.value) || 0 }),
        );
        el.attachmentAnchorXInput.addEventListener("change", () =>
          setAttachmentPatch({
            anchorX: Math.max(0, Math.min(1, Number(el.attachmentAnchorXInput.value) || 0)),
          }),
        );
        el.attachmentSegmentsInput.addEventListener("change", () =>
          setAttachmentPatch({ segments: el.attachmentSegmentsInput.checked }),
        );
        el.attachmentReverseInput.addEventListener("change", () =>
          setAttachmentPatch({ reverse: el.attachmentReverseInput.checked }),
        );
        el.attachmentScarfEnabledInput.addEventListener("change", () =>
          setAttachmentPatch({ scarfEnabled: el.attachmentScarfEnabledInput.checked }),
        );
        el.attachmentScarfSplitInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfSplit: clampNumber(el.attachmentScarfSplitInput.value, 0.05, 0.95, 0.52),
          }),
        );
        el.attachmentScarfRootXInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfRootX: clampNumber(el.attachmentScarfRootXInput.value, 0, 1, 0.52),
          }),
        );
        el.attachmentScarfRootYInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfRootY: clampNumber(el.attachmentScarfRootYInput.value, 0, 1, 0.6),
          }),
        );
        el.attachmentScarfTipXInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfLength: clampNumber(el.attachmentScarfTipXInput.value, 0.05, 2, 0.55),
          }),
        );
        el.attachmentScarfTipYInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfAngle: Number(el.attachmentScarfTipYInput.value) || 0,
          }),
        );
        el.attachmentScarfStiffnessInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfStiffness: clampNumber(el.attachmentScarfStiffnessInput.value, 0, 1, 0.06),
          }),
        );
        el.attachmentScarfDampingInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfDamping: clampNumber(el.attachmentScarfDampingInput.value, 0, 0.99, 0.84),
          }),
        );
        el.attachmentScarfGravityInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfGravity: Number(el.attachmentScarfGravityInput.value) || 0,
          }),
        );
        el.attachmentScarfWaveInput.addEventListener("change", () =>
          setAttachmentPatch({
            scarfWave: Math.max(0, Number(el.attachmentScarfWaveInput.value) || 0),
          }),
        );
        el.attachmentHemEnabledInput.addEventListener("change", () =>
          setAttachmentPatch({ hemEnabled: el.attachmentHemEnabledInput.checked }),
        );
        el.attachmentHemXInput.addEventListener("change", () =>
          setAttachmentPatch({ hemX: clampNumber(el.attachmentHemXInput.value, 0, 1, 0.5) }),
        );
        el.attachmentHemYInput.addEventListener("change", () =>
          setAttachmentPatch({ hemY: clampNumber(el.attachmentHemYInput.value, 0, 1, 0.68) }),
        );
        el.attachmentHemLengthInput.addEventListener("change", () =>
          setAttachmentPatch({
            hemLength: clampNumber(el.attachmentHemLengthInput.value, 0.05, 2, 0.75),
          }),
        );
        el.attachmentHemAngleInput.addEventListener("change", () =>
          setAttachmentPatch({ hemAngle: Number(el.attachmentHemAngleInput.value) || 0 }),
        );
      }

      function bindCanvas() {
        const startDrag = (event) => {
          if (drag && drag.type !== "key") return;
          const point = canvasPoint(event);
          if (state.editMode === "add-bone") {
            event.preventDefault();
            drag = {
              type: "create-bone",
              start: point,
              end: point,
              hasMoved: false,
              parentId: selectedNode()?.id || null,
            };
            if (event.pointerId !== undefined && el.stage.setPointerCapture) {
              el.stage.setPointerCapture(event.pointerId);
            }
            drawStage();
            return;
          }
          const hit = hitTest(point);
          if (!hit) return;
          event.preventDefault();
          poseOverrides.clear();
          state.selectedNodeId = hit.node.id;
          state.selectedKey = null;
          const pose = worldPose(hit.node);
          const end = endPoint(pose);
          drag = {
            type: hit.type,
            nodeId: hit.node.id,
            jointId: hit.jointId,
            start: point,
            hasMoved: false,
            startWorldOrigin: { x: pose.worldX, y: pose.worldY },
            startWorldEnd: { x: end.x, y: end.y },
            startPoses: captureWorldPoses(),
            touched: new Set([hit.node.id]),
          };
          if (event.pointerId !== undefined && el.stage.setPointerCapture) {
            el.stage.setPointerCapture(event.pointerId);
          }
          renderAll();
        };

        const moveDrag = (event) => {
          const point = canvasPoint(event);
          if (!drag) {
            el.stage.style.cursor = state.editMode === "add-bone" ? "crosshair" : hitTest(point) ? "grab" : "default";
            return;
          }
          event.preventDefault();
          if (drag.type === "create-bone") {
            drag.end = point;
            drag.hasMoved = distance(point, drag.start) >= 3;
            drawStage();
            return;
          }
          const node = state.nodes.find((item) => item.id === drag.nodeId);
          if (!node) return;
          const moveDistance = distance(point, drag.start);
          if (!drag.hasMoved && moveDistance < 3) {
            return;
          }
          drag.hasMoved = true;
          if (drag.type === "origin") {
            solveGenericJointDrag(drag.jointId, point);
          }
          if (drag.type === "bone") {
            moveBoneRigid(
              node,
              { x: point.x - drag.start.x, y: point.y - drag.start.y },
              drag.startWorldOrigin,
            );
          }
          if (drag.type === "stretch-origin" || drag.type === "stretch-end") {
            stretchBoneEndpoint(node, drag.type, point);
          }
          if (drag.type === "end") {
            solveGenericJointDrag(drag.jointId, point);
          }
          renderProperties();
          renderTimeline();
          renderStatus();
          renderJsonPreview();
          drawStage();
        };

        const endDrag = (event) => {
          commitActiveDrag();
          if (event.pointerId !== undefined && el.stage.releasePointerCapture) {
            el.stage.releasePointerCapture(event.pointerId);
          }
        };

        el.stage.addEventListener("pointerdown", startDrag);
        el.stage.addEventListener("pointermove", moveDrag);
        el.stage.addEventListener("pointerup", endDrag);
        el.stage.addEventListener("mousedown", startDrag);
        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", endDrag);
      }

      function commitActiveDrag() {
        if (!drag || drag.type === "key") return;
        if (drag.type === "create-bone") {
          const parent = drag.parentId ? state.nodes.find((node) => node.id === drag.parentId) : null;
          const node = createManualBoneFromDrag(drag.start, drag.end, parent);
          drag = null;
          poseOverrides.clear();
          renderAll();
          if (node) toast(`已创建 ${node.name}`);
          return;
        }
        if (!drag.hasMoved) {
          drag = null;
          poseOverrides.clear();
          renderAll();
          return;
        }
        persistTouchedNodes();
        const activeNode = state.nodes.find((node) => node.id === drag.nodeId);
        if (activeNode) {
          state.selectedKey = { nodeId: activeNode.id, frame: state.currentFrame };
          toast(`已记录 ${drag.touched?.size || 1} 个节点第 ${state.currentFrame + 1} 帧`);
        }
        drag = null;
        poseOverrides.clear();
        renderAll();
      }

      function persistTouchedNodes() {
        if (!drag?.touched) return;
        const touchedNodes = state.nodes.filter((node) => drag.touched?.has(node.id));
        touchedNodes.forEach((node) => upsertKeyframe(node));
      }

      function bindTimelineDrag() {
        document.addEventListener("pointermove", (event) => {
          if (!drag || drag.type !== "key") return;
          const delta = Math.round((event.clientX - drag.startX) / frameWidth);
          const nextFrame = clampFrame(drag.sourceFrame + delta);
          const keys = state.timelines[drag.nodeId] || [];
          const keyframe = keys.find((item) => item.frame === drag.sourceFrame);
          if (!keyframe) return;
          const occupied = keys.some(
            (item) => item !== keyframe && item.frame === nextFrame,
          );
          if (!occupied) {
            keyframe.frame = nextFrame;
            state.currentFrame = nextFrame;
            state.selectedKey = { nodeId: drag.nodeId, frame: nextFrame };
            keys.sort((a, b) => a.frame - b.frame);
            renderAll();
          }
        });
        document.addEventListener("pointerup", () => {
          commitActiveDrag();
          if (drag?.type === "key") drag = null;
        });
        el.tracksViewport.addEventListener("pointerdown", (event) => {
          if (event.target !== el.tracks && !event.target.classList.contains("frame-ruler")) return;
          state.currentFrame = clampFrame(frameFromPointer(event, el.tracksViewport));
          state.selectedKey = null;
          renderAll();
        });
      }

      function tick(now) {
        if (!state.playing) return;
        const elapsed = (now - lastTime) / 1000;
        lastTime = now;
        state.currentFrame += elapsed * state.fps;
        if (state.currentFrame > state.duration) state.currentFrame = 0;
        state.currentFrame = Math.round(state.currentFrame * 100) / 100;
        el.frameInput.value = Math.round(state.currentFrame) + 1;
        el.timeStatus.textContent = `第 ${Math.round(state.currentFrame) + 1} 帧 / ${state.duration + 1}，${state.fps} FPS，${(state.currentFrame / state.fps).toFixed(2)} 秒`;
        drawStage();
        renderTimeline();
        rafId = requestAnimationFrame(tick);
      }

      bindEvents();
      resizeCanvas();
      const params = new URLSearchParams(window.location.search);
      if (params.get("sample") === "new") {
        loadNewVersionSample();
      } else if (params.get("sample") === "monk") {
        loadOpeningMonkSample();
      } else if (params.get("sample") === "cloak") {
        loadOpeningCloakSample();
      } else if (params.get("sample") === "walk") {
        loadSideWalkSample();
      } else {
        renderAll();
      }
    </script>
  </body>
</html>
