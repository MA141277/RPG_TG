          return;
        }

        const cols = restPart.partId === "torso" ? 5 : 4;
        const rows = Math.max(6, segments.length * 5);
        const source = [];
        const dest = [];
        for (let row = 0; row <= rows; row += 1) {
          const v = row / rows;
          const sourceRow = [];
          const destRow = [];
          for (let col = 0; col <= cols; col += 1) {
            const u = col / cols;
            const sourcePoint = {
              x: image.width * u,
              y: image.height * v,
            };
            sourceRow.push(sourcePoint);
            destRow.push(
              deformByAttachmentSegments(
                imagePointToFullSkinRest(sourcePoint, image, restPart),
                segments,
              ),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        drawTexturedMesh(image, source, dest, alpha);
      }

      function drawRestPartImage(image, restPart, alpha = 1) {
        const width = image.width * restPart.scale;
        const height = image.height * restPart.scale;
        ctx.save();
        setDrawAlpha(alpha);
        ctx.translate(restPart.x || 0, restPart.y || 0);
        ctx.rotate(((restPart.rotation || 0) * Math.PI) / 180);
        ctx.drawImage(
          image,
          -width * (restPart.anchorX ?? 0.5),
          -height * (restPart.anchorY ?? 0.5),
          width,
          height,
        );
        ctx.restore();
      }

      function imagePointToFullSkinRest(sourcePoint, image, restPart) {
        const width = image.width * restPart.scale;
        const height = image.height * restPart.scale;
        const localX = (sourcePoint.x / image.width) * width - width * restPart.anchorX;
        const localY = (sourcePoint.y / image.height) * height - height * restPart.anchorY;
        const angle = (restPart.rotation * Math.PI) / 180;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: restPart.x + localX * cos - localY * sin,
          y: restPart.y + localX * sin + localY * cos,
        };
      }

      function imagePointToSegmentRest(sourcePoint, image, segment, u) {
        const relY = (sourcePoint.y - segment.sourceY) / Math.max(1, segment.sourceHeight);
        const restLength = distance(segment.restStart, segment.restEnd);
        const angle =
          Math.atan2(segment.restEnd.y - segment.restStart.y, segment.restEnd.x - segment.restStart.x) -
          Math.PI / 2 +
          (segment.rotationOffset * Math.PI) / 180;
        const x = -segment.width * segment.anchorX + segment.offsetX + segment.width * u;
        const y = segment.offsetY + restLength * relY;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: segment.restStart.x + x * cos - y * sin,
          y: segment.restStart.y + x * sin + y * cos,
        };
      }

      function deformByAttachmentSegments(point, segments) {
        let totalWeight = 0;
        const blended = { x: 0, y: 0 };
        for (const segment of segments) {
          const projection = projectPointOnSegment(point, segment.restStart, segment.restEnd);
          const weight = attachmentSegmentWeight(distance(point, projection.point), segment);
          const mapped = mapPointByAttachmentSegment(point, segment);
          blended.x += mapped.x * weight;
          blended.y += mapped.y * weight;
          totalWeight += weight;
        }
        if (totalWeight <= 0) return point;
        return {
          x: blended.x / totalWeight,
          y: blended.y / totalWeight,
        };
      }

      function mapPointByAttachmentSegment(point, segment) {
        const restLength = Math.max(1, distance(segment.restStart, segment.restEnd));
        const currentLength = Math.max(1, distance(segment.start, segment.end));
        const restDir = normalizeVector({
          x: segment.restEnd.x - segment.restStart.x,
          y: segment.restEnd.y - segment.restStart.y,
        });
        const currentDir = normalizeVector({
          x: segment.end.x - segment.start.x,
          y: segment.end.y - segment.start.y,
        });
        const restNormal = { x: -restDir.y, y: restDir.x };
        const currentNormal = { x: -currentDir.y, y: currentDir.x };
        const local = {
          x: point.x - segment.restStart.x,
          y: point.y - segment.restStart.y,
        };
        const scale = currentLength / restLength;
        const softenedScale = 1 + (scale - 1) * 0.72;
        const axial = dotVector(local, restDir) * softenedScale;
        const lateral = dotVector(local, restNormal);
        return {
          x: segment.start.x + currentDir.x * axial + currentNormal.x * lateral,
          y: segment.start.y + currentDir.y * axial + currentNormal.y * lateral,
        };
      }

      function attachmentSegmentWeight(distanceToSegment, segment) {
        const length = distance(segment.restStart, segment.restEnd);
        const reach = Math.max(16, length * 0.34);
        const normalizedDistance = distanceToSegment / reach;
        const base = 1 / ((normalizedDistance + 0.18) * (normalizedDistance + 0.18));
        return base * Math.sqrt(base);
      }

      function projectPointOnSegment(point, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (lengthSquared === 0) return { point: { ...a }, t: 0 };
        const t = Math.max(
          0,
          Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared),
        );
        return {
          point: { x: a.x + dx * t, y: a.y + dy * t },
          t,
        };
      }

      function normalizeVector(vector) {
        const length = Math.hypot(vector.x, vector.y) || 1;
        return { x: vector.x / length, y: vector.y / length };
      }

      function dotVector(a, b) {
        return a.x * b.x + a.y * b.y;
      }

      function drawHeadAttachment(node, attachment, image, alpha = attachment.alpha) {
        const pose = worldPose(node);
        const center = {
          x: pose.worldX + attachment.offsetX,
          y: pose.worldY + attachment.offsetY,
        };
        const width = attachment.width;
        const height = width * 0.96;
        const baseX = -width * 0.5;
        const baseY = -width * 0.55;
        const headAngle = ((pose.worldRotation + 90 + attachment.rotationOffset) * Math.PI) / 180;
        const scarfSourceEnd = Math.min(image.width, Math.round(image.width * attachment.scarfSplit));
        const headSourceX = Math.max(0, Math.round(image.width * Math.max(0, attachment.scarfSplit - 0.18)));
        const headDestX = baseX + (headSourceX / image.width) * width;
        const headDestWidth = width * ((image.width - headSourceX) / image.width);
        if (attachment.scarfEnabled) {
          drawSpringScarf(node, attachment, image, center, headAngle, {
            baseX,
            baseY,
            width,
            height,
            imageWidth: image.width,
            imageHeight: image.height,
            sourceEnd: scarfSourceEnd,
            rootX: attachment.scarfRootX,
            rootY: attachment.scarfRootY,
            length: attachment.scarfLength,
            angle: attachment.scarfAngle,
            stiffness: attachment.scarfStiffness,
            damping: attachment.scarfDamping,
            gravity: attachment.scarfGravity,
            wave: attachment.scarfWave,
          });
        }
        ctx.save();
        setDrawAlpha(alpha);
        ctx.translate(center.x, center.y);
        ctx.rotate(headAngle);
        if (attachment.scarfEnabled) {
          ctx.drawImage(
            image,
            headSourceX,
            0,
            image.width - headSourceX,
            image.height,
            headDestX,
            baseY,
            headDestWidth,
            height,
          );
        } else {
          ctx.drawImage(image, baseX, baseY, width, height);
        }
        ctx.restore();
      }

      function drawSpringScarf(node, attachment, image, center, angle, layout, alpha = attachment.alpha) {
        const mesh = buildScarfMesh(center, angle, layout);
        const points = solveGravityMesh(`scarf:${node.id}`, mesh.dest, {
          stiffness: layout.stiffness,
          damping: layout.damping,
          gravity: layout.gravity,
        });
        drawTexturedMesh(image, mesh.source, points, alpha);
      }

      function solveSpringScarf(nodeId, center, angle, layout) {
        const rest = scarfRestPoints(center, angle, layout);
        return solveSpringPoints(`scarf:${nodeId}`, rest, layout);
      }

      function solveSpringPoints(key, rest, layout) {
        let sim = dynamicScarves.get(key);
        const now = performance.now();
        const shouldReset =
          !state.playing ||
          !sim ||
          Math.abs((sim.frame ?? state.currentFrame) - state.currentFrame) > 4 ||
          now - (sim.time || now) > 250;
        if (shouldReset) {
          sim = {
            points: rest.map((point) => ({ ...point })),
            previous: rest.map((point) => ({ ...point })),
            frame: state.currentFrame,
            time: now,
          };
          dynamicScarves.set(key, sim);
          return sim.points;
        }

        const dt = Math.min(1 / 24, Math.max(1 / 120, (now - sim.time) / 1000));
        sim.time = now;
        sim.frame = state.currentFrame;
        sim.points[0] = { ...rest[0] };
        sim.previous[0] = { ...rest[0] };
        for (let index = 1; index < sim.points.length; index += 1) {
          const point = sim.points[index];
          const previous = sim.previous[index];
          const old = { ...point };
          point.x +=
            (point.x - previous.x) * layout.damping +
            (rest[index].x - point.x) * layout.stiffness;
          point.y +=
            (point.y - previous.y) * layout.damping +
            (rest[index].y - point.y) * layout.stiffness +
            layout.gravity * dt * dt;
          sim.previous[index] = old;
        }
        const segmentLengths = rest.slice(1).map((point, index) => distance(rest[index], point));
        for (let pass = 0; pass < 4; pass += 1) {
          sim.points[0] = { ...rest[0] };
          for (let index = 1; index < sim.points.length; index += 1) {
            const prev = sim.points[index - 1];
            const point = sim.points[index];
            const dx = point.x - prev.x;
            const dy = point.y - prev.y;
            const currentLength = Math.hypot(dx, dy) || 1;
            const correction = (currentLength - segmentLengths[index - 1]) / currentLength;
            point.x -= dx * correction;
            point.y -= dy * correction;
          }
        }
        return sim.points;
      }

      function scarfRestPoints(center, angle, layout) {
        const scale = (layout.width / 67) * layout.wave;
        const rootX = layout.baseX + layout.rootX * layout.width;
        const rootY = layout.baseY + layout.rootY * layout.height;
        const clothAngle = (layout.angle * Math.PI) / 180;
        const clothLength = layout.length * layout.width;
        const tipX = rootX + Math.cos(clothAngle) * clothLength;
        const tipY = rootY + Math.sin(clothAngle) * clothLength;
        const localPoints = [
          { x: rootX, y: rootY },
          { x: rootX * 0.65 + tipX * 0.35, y: rootY * 0.65 + tipY * 0.35 + layout.height * 0.04 },
          { x: rootX * 0.3 + tipX * 0.7, y: rootY * 0.3 + tipY * 0.7 + layout.height * 0.08 },
          { x: tipX, y: tipY },
        ];
        return localPoints.map((point, index) =>
          rotateLocalPoint(
            center,
            angle,
            point.x,
            point.y + (index > 0 ? Math.sin((state.currentFrame / state.fps) * Math.PI * 2 + index) * scale : 0),
          ),
        );
      }

      function drawSpringCloth(nodeId, image, start, end, attachment, options) {
        const drawAngle =
          Math.atan2(end.y - start.y, end.x - start.x) -
          Math.PI / 2 +
          (attachment.rotationOffset * Math.PI) / 180;
        const drawnLength = Math.max(8, distance(start, end) * attachment.lengthScale);
        const localToWorld = (point) => {
          const cos = Math.cos(drawAngle);
          const sin = Math.sin(drawAngle);
          const x = -attachment.width * attachment.anchorX + attachment.offsetX + point.x;
          const y = attachment.offsetY + point.y;
          return {
            x: start.x + x * cos - y * sin,
            y: start.y + x * sin + y * cos,
          };
        };
        const mesh = buildHemMesh(image, attachment, options, drawnLength, localToWorld);
        const points = solveGravityMesh(`hem:${nodeId}`, mesh.dest, {
          stiffness: attachment.scarfStiffness,
          damping: attachment.scarfDamping,
          gravity: attachment.scarfGravity,
        });
        drawTexturedMesh(image, mesh.source, points, options.alpha);
      }

      function buildHemMesh(image, attachment, options, drawnLength, localToWorld) {
        const cols = 5;
        const rows = 7;
        const source = [];
        const dest = [];
        const sourceBottom = options.sourceStart + options.sourceSize;
        const restHeight =
          drawnLength * (options.sourceSize / image.height) * Math.max(0.05, options.length);
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            sourceRow.push({
              x: image.width * u,
              y: options.sourceStart + (sourceBottom - options.sourceStart) * v,
            });
            destRow.push(
              localToWorld({
                x: attachment.width * u,
                y: drawnLength * options.anchorY + restHeight * v,
              }),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        return { source, dest };
      }

      function buildScarfMesh(center, angle, layout) {
        const cols = 4;
        const rows = 7;
        const source = [];
        const dest = [];
        const rootX = layout.baseX + layout.rootX * layout.width;
        const rootY = layout.baseY + layout.rootY * layout.height;
        const clothAngle = (layout.angle * Math.PI) / 180;
        const dir = { x: Math.cos(clothAngle), y: Math.sin(clothAngle) };
        const normal = { x: -dir.y, y: dir.x };
        const clothLength = layout.length * layout.width;
        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          const sourceRow = [];
          const destRow = [];
          const centerX = rootX + dir.x * clothLength * v;
          const centerY = rootY + dir.y * clothLength * v;
          for (let col = 0; col < cols; col += 1) {
            const u = col / (cols - 1);
            sourceRow.push({
              x: layout.sourceEnd * (1 - v),
              y: layout.imageHeight * u,
            });
            destRow.push(
              rotateLocalPoint(
                center,
                angle,
                centerX + normal.x * (u - 0.5) * layout.height,
                centerY + normal.y * (u - 0.5) * layout.height,
              ),
            );
          }
          source.push(sourceRow);
          dest.push(destRow);
        }
        return { source, dest };
      }

      function solveGravityMesh(key, rest, options) {
        let sim = dynamicScarves.get(key);
        const now = performance.now();
        const rows = rest.length;
        const cols = rest[0]?.length || 0;
        const flatRest = rest.flat();
        const shouldReset =
          !state.playing ||
          !sim ||
          sim.rows !== rows ||
          sim.cols !== cols ||
          now - (sim.time || now) > 250;
        if (shouldReset) {
          sim = {
            rows,
            cols,
            points: flatRest.map((point) => ({ ...point })),
            previous: flatRest.map((point) => ({ ...point })),
            time: now,
          };
          dynamicScarves.set(key, sim);
        }

        const dt = Math.min(1 / 24, Math.max(1 / 120, (now - sim.time) / 1000));
        sim.time = now;
        for (let index = 0; index < sim.points.length; index += 1) {
          const row = Math.floor(index / cols);
          if (row === 0) {
            sim.points[index] = { ...flatRest[index] };
            sim.previous[index] = { ...flatRest[index] };
            continue;
          }
          const point = sim.points[index];
          const previous = sim.previous[index];
          const old = { ...point };
          const rowFactor = row / Math.max(1, rows - 1);
          point.x +=
            (point.x - previous.x) * options.damping +
            (flatRest[index].x - point.x) * options.stiffness * 0.7;
          point.y +=
            (point.y - previous.y) * options.damping +
            (flatRest[index].y - point.y) * options.stiffness * 0.45 +
            options.gravity * (0.45 + rowFactor * 1.4) * dt * dt;
          sim.previous[index] = old;
        }

        const constrainPair = (aIndex, bIndex, axis) => {
          const a = sim.points[aIndex];
          const b = sim.points[bIndex];
          const ar = flatRest[aIndex];
          const br = flatRest[bIndex];
          const row = Math.min(Math.floor(aIndex / cols), Math.floor(bIndex / cols));
          const rowFactor = row / Math.max(1, rows - 1);
          const target =
            distance(ar, br) * (axis === "vertical" ? 1 + rowFactor * 0.22 : 1);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const current = Math.hypot(dx, dy) || 1;
          const strength = axis === "horizontal" ? 0.92 : 0.32;
          const correction = ((current - target) / current) * strength;
          const aPinned = Math.floor(aIndex / cols) === 0;
          const bPinned = Math.floor(bIndex / cols) === 0;
          if (!aPinned && !bPinned) {
            a.x += dx * correction * 0.5;
            a.y += dy * correction * 0.5;
            b.x -= dx * correction * 0.5;
            b.y -= dy * correction * 0.5;
          } else if (aPinned && !bPinned) {
            b.x -= dx * correction;
            b.y -= dy * correction;
          } else if (!aPinned && bPinned) {
            a.x += dx * correction;
            a.y += dy * correction;
          }
        };

        for (let pass = 0; pass < 3; pass += 1) {
          for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < cols; col += 1) {
              const index = row * cols + col;
              if (row === 0) sim.points[index] = { ...flatRest[index] };
              if (col < cols - 1) constrainPair(index, index + 1, "horizontal");
              if (row < rows - 1) constrainPair(index, index + cols, "vertical");
            }
          }
        }

        const points = [];
        for (let row = 0; row < rows; row += 1) {
          points.push(sim.points.slice(row * cols, row * cols + cols));
        }
        return points;
      }

      function drawTexturedMesh(image, source, dest, alpha) {
        ctx.save();
        setDrawAlpha(alpha);
        for (let row = 0; row < source.length - 1; row += 1) {
          for (let col = 0; col < source[row].length - 1; col += 1) {
            drawImageTriangle(image, source[row][col], source[row + 1][col], source[row][col + 1], dest[row][col], dest[row + 1][col], dest[row][col + 1]);
            drawImageTriangle(image, source[row + 1][col], source[row + 1][col + 1], source[row][col + 1], dest[row + 1][col], dest[row + 1][col + 1], dest[row][col + 1]);
          }
        }
        ctx.restore();
      }

      function drawImageTriangle(image, s0, s1, s2, d0, d1, d2) {
        const denominator =
          s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y);
        if (Math.abs(denominator) < 0.001) return;
        const a =
          (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) /
          denominator;
        const b =
          (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) /
          denominator;
        const c =
          (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) /
          denominator;
        const d =
          (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) /
          denominator;
        const e =
          (d0.x * (s1.x * s2.y - s2.x * s1.y) +
            d1.x * (s2.x * s0.y - s0.x * s2.y) +
            d2.x * (s0.x * s1.y - s1.x * s0.y)) /
          denominator;
        const f =
          (d0.y * (s1.x * s2.y - s2.x * s1.y) +
            d1.y * (s2.x * s0.y - s0.x * s2.y) +
            d2.y * (s0.x * s1.y - s1.x * s0.y)) /
          denominator;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(d0.x, d0.y);
        ctx.lineTo(d1.x, d1.y);
        ctx.lineTo(d2.x, d2.y);
        ctx.closePath();
        ctx.clip();
        ctx.transform(a, b, c, d, e, f);
        ctx.drawImage(image, 0, 0);
        ctx.restore();
      }

      function rotateLocalPoint(center, angle, x, y) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: center.x + x * cos - y * sin,
          y: center.y + x * sin + y * cos,
        };
      }

      function drawImageHorizontalSliceAlong(image, start, end, width, sourceX, sourceWidth, alpha) {
        const length = distance(start, end);
        const angle = Math.atan2(end.y - start.y, end.x - start.x);
        ctx.save();
        setDrawAlpha(alpha);
        ctx.translate(start.x, start.y);
        ctx.rotate(angle);
        ctx.drawImage(image, sourceX, 0, sourceWidth, image.height, 0, -width * 0.5, length, width);
        ctx.restore();
      }

      function drawImageAlong(
        image,
        start,
        end,
        width,
        length,
        alpha,
        anchorX,
        rotationOffset = 0,
        offsetX = 0,
        offsetY = 0,
      ) {
        drawImageSliceAlong(
          image,
          start,
          end,
          width,
          length,
          alpha,
          anchorX,
          0,
          image.height,
          rotationOffset,
          offsetX,
          offsetY,
        );
      }

      function drawImageSliceAlong(
        image,
        start,
        end,
        width,
        length,
        alpha,
        anchorX,
        sourceY,
        sourceHeight,
        rotationOffset = 0,
        offsetX = 0,
        offsetY = 0,
      ) {
        const angle = Math.atan2(end.y - start.y, end.x - start.x);
        const drawAngle = angle - Math.PI / 2 + (rotationOffset * Math.PI) / 180;
        ctx.save();
        setDrawAlpha(alpha);
        ctx.translate(start.x, start.y);
        ctx.rotate(drawAngle);
        ctx.drawImage(
          image,
          0,
          sourceY,
          image.width,
          sourceHeight,
          -width * anchorX + offsetX,
          offsetY,
          width,
          length,
        );
        ctx.restore();
      }

      function drawTextureHandles(nodes) {
        const selected = state.nodes.find((node) => node.id === state.selectedNodeId);
        if (!selected || !isNodeVisibleAtFrame(selected)) return;
        const pose = worldPose(selected);
        const end = endPoint(pose);
        ctx.save();
        ctx.fillStyle = varColor("--accent-2");
        ctx.strokeStyle = "#000000cc";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pose.worldX, pose.worldY, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(end.x, end.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawSelectedPieceBinding(nodes) {
        if (!isBindingMode()) return;
        const piece = selectedPieceNode();
        if (!piece) return;
        const boundIds = new Set(boundBoneIdsForPiece(piece));
        ctx.save();
        ctx.shadowColor = "#f5c84baa";
        ctx.shadowBlur = 10;
        nodes.filter((node) => boundIds.has(node.id)).forEach((node) => drawBone(node, true));
        ctx.restore();
        drawPieceOutline(piece);
      }

      function drawPieceOutline(piece) {
        const corners = pieceCorners(piece);
        if (!corners?.length) return;
        ctx.save();
        ctx.strokeStyle = varColor("--accent-2");
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        corners.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.stroke();
        const handles = pieceHandlePoints(piece);
        ctx.setLineDash([]);
        ctx.fillStyle = "#101214";
        ctx.strokeStyle = varColor("--accent-2");
        handles.corners.forEach((point) => {
          ctx.beginPath();
          ctx.rect(point.x - 5, point.y - 5, 10, 10);
          ctx.fill();
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.arc(handles.rotate.x, handles.rotate.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(handles.topCenter.x, handles.topCenter.y);
        ctx.lineTo(handles.rotate.x, handles.rotate.y);
        ctx.stroke();
        ctx.restore();
      }

      function drawBindingToolPreview() {
        if (!isBindingMode() || !state.pendingFreeBoneStart) return;
        ctx.save();
        ctx.fillStyle = varColor("--accent-2");
        ctx.strokeStyle = "#000000cc";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(state.pendingFreeBoneStart.x, state.pendingFreeBoneStart.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function pieceCenter(piece) {
        const attachment = piece?.attachment;
        if (attachment?.fullSkin && attachment.restPart) {
          const restPart = resolveRestPartTransform(attachment.restPart, false);
          return { x: restPart?.x || 0, y: restPart?.y || 0 };
        }
        const corners = pieceCorners(piece) || [];
        if (!corners.length) return { x: 0, y: 0 };
        return {
          x: corners.reduce((sum, point) => sum + point.x, 0) / corners.length,
          y: corners.reduce((sum, point) => sum + point.y, 0) / corners.length,
        };
      }

      function pieceHandlePoints(piece) {
        const corners = pieceCorners(piece) || [];
        const topCenter =
          corners.length >= 2
            ? { x: (corners[0].x + corners[1].x) / 2, y: (corners[0].y + corners[1].y) / 2 }
            : pieceCenter(piece);
        const center = pieceCenter(piece);
        const dir = normalizeVector({ x: topCenter.x - center.x, y: topCenter.y - center.y });
        return {
          center,
          corners,
          topCenter,
          rotate: { x: topCenter.x + dir.x * 34, y: topCenter.y + dir.y * 34 },
        };
      }

      function pieceCorners(piece) {
        const attachment = piece?.attachment;
        const image = attachment ? warriorImages[attachment.image] : null;
        if (!attachment || !image?.complete) return null;
        if (attachment.fullSkin && attachment.restPart) {
          const restPart = resolveRestPartTransform(attachment.restPart, false);
          const width = image.width * restPart.scale;
          const height = image.height * restPart.scale;
          const base = [
            { x: -width * restPart.anchorX, y: -height * restPart.anchorY },
            { x: width * (1 - restPart.anchorX), y: -height * restPart.anchorY },
            { x: width * (1 - restPart.anchorX), y: height * (1 - restPart.anchorY) },
            { x: -width * restPart.anchorX, y: height * (1 - restPart.anchorY) },
          ];
          const angle = ((restPart.rotation || 0) * Math.PI) / 180;
          const cos = Math.cos(angle);
          const sin = Math.sin(angle);
          return base.map((point) => ({
            x: (restPart.x || 0) + point.x * cos - point.y * sin,
            y: (restPart.y || 0) + point.x * sin + point.y * cos,
          }));
        }
        const pose = worldPose(piece);
        const start = { x: pose.worldX, y: pose.worldY };
        const end = attachment.chainTo
          ? endPoint(worldPose(state.nodes.find((node) => node.id === attachment.chainTo) || piece))
          : endPoint(pose);
        const length = Math.max(8, distance(start, end) * attachment.lengthScale);
        const width = attachment.width;
        const angle = Math.atan2(end.y - start.y, end.x - start.x) - Math.PI / 2 + ((attachment.rotationOffset || 0) * Math.PI) / 180;
        const base = [
          { x: -width * attachment.anchorX + attachment.offsetX, y: attachment.offsetY },
          { x: width * (1 - attachment.anchorX) + attachment.offsetX, y: attachment.offsetY },
          { x: width * (1 - attachment.anchorX) + attachment.offsetX, y: attachment.offsetY + length },
          { x: -width * attachment.anchorX + attachment.offsetX, y: attachment.offsetY + length },
        ];
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return base.map((point) => ({
          x: start.x + point.x * cos - point.y * sin,
          y: start.y + point.x * sin + point.y * cos,
        }));
      }

      function drawParentLink(node) {
        const effectiveParentId = effectiveParentIdForNode(node);
        if (!effectiveParentId) return;
        const parent = cachedNodeById(effectiveParentId);
        if (!parent || !isNodeVisibleAtFrame(node) || !isNodeVisibleAtFrame(parent)) return;
        const parentEnd = endPoint(worldPose(parent));
        const pose = worldPose(node);
        const linkPoint = isTempParentBoundArrowCarrier(node)
          ? arrowGripWorldPointForNode(node) || { x: pose.worldX, y: pose.worldY }
          : { x: pose.worldX, y: pose.worldY };
        const gap = Math.hypot(parentEnd.x - linkPoint.x, parentEnd.y - linkPoint.y);
        if (gap < 0.5) return;
        ctx.save();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(parentEnd.x, parentEnd.y);
        ctx.lineTo(linkPoint.x, linkPoint.y);
        ctx.stroke();
        ctx.restore();
      }

      function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      function setDrawAlpha(alpha) {

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();

      function registerCustomImage(id, name, src) {
        state.customImages[id] = { name: String(name || id), src: String(src || "") };

      function registerLegAssetImage(filename) {
        const cleanName = normalizeLegAssetFilename(filename);
        const id = `${legAssetPrefix}${cleanName}`;
        if (warriorImages[id]) return id;
        const image = new Image();
        image.onload = drawStage;
        image.src = legAssetUrl(cleanName);
        warriorImages[id] = image;
        return id;
      }

      function normalizeLegAssetFilename(filename) {
        const cleanName = String(filename || "")
          .trim()
          .replace(/\\/g, "/")
          .replace(/^\/+/, "");
        if (!cleanName) throw new Error("请输入 src/faxian/leg 下的图片文件名");
        if (cleanName.includes("..") || cleanName.includes(":")) {
          throw new Error("只能读取 src/faxian/leg 目录内的图片");
        }
        if (!/\.(png|jpe?g|webp)$/i.test(cleanName)) {
          throw new Error("图片文件必须是 png、jpg、jpeg 或 webp");
        }
        return cleanName;
      }

      function legAssetUrl(filename) {
        return `${legAssetBasePath}${filename
          .split("/")
          .map((part) => encodeURIComponent(part))
          .join("/")}`;
      }

      function restoreCustomImages(customImages) {
        state.customImages = {};
        Object.entries(customImages || {}).forEach(([id, item]) => {

      function renderPieceList() {

      function pieceNodes() {
        return cachedPieceNodes();
      }

      function pieceLabel(node) {
        const image = node.attachment?.image || "image";
        return `${node.name || node.id} · ${image}`;
      }

      function selectPiece(nodeId) {
        const node = state.nodes.find((item) => item.id === nodeId && item.attachment);
        if (!node) return;
        state.selectedPieceNodeId = node.id;
        state.selectedNodeId = node.id;

      }

      function selectedPieceNode() {
        return state.nodes.find((node) => node.id === state.selectedPieceNodeId && node.attachment) || null;
      }

      function isArrowPieceNode(node) {
        return Boolean(node?.attachment && node.role === "arrow-piece");
      }

      function isSlashFxPieceNode(node) {
        return Boolean(node?.attachment && node.role === "slash-fx-piece");
      }

      function arrowCarrierBoneForPiece(piece) {
        const parentBoneId = piece?.attachment?.restPart?.parentBoneId
          ? String(piece.attachment.restPart.parentBoneId)
          : null;
        if (parentBoneId) {
          const node = cachedNodeById(parentBoneId);
          return node && !node.attachment ? node : null;
        }
        const skinBoneId = piece?.attachment?.skinBoneIds?.[0] ? String(piece.attachment.skinBoneIds[0]) : null;
        if (skinBoneId) {
          const node = cachedNodeById(skinBoneId);
          return node && !node.attachment ? node : null;
        }
        return null;
      }

      function proxyHitForArrowPieceBody(piece) {
        if (piece?.role !== "arrow-piece") return null;
        const carrier = arrowCarrierBoneForPiece(piece);
        if (!carrier) return null;
        return { type: "arrow-piece-bone", node: carrier, piece };
      }

      function arrowPieceForNode(node) {
        if (isArrowPieceNode(node)) return node;
        if (!node || node.attachment) return null;
        ensureRigPieceCaches();
        return runtimeCache.arrowPieceByCarrierId.get(node.id) || null;
      }

      function selectedArrowPiece() {
        return arrowPieceForNode(selectedPieceNode()) || arrowPieceForNode(selectedNode()) || null;
      }

      function slashFxCarrierBoneForPiece(piece) {
        const parentBoneId = piece?.attachment?.restPart?.parentBoneId
          ? String(piece.attachment.restPart.parentBoneId)
          : null;
        if (parentBoneId) {
          const node = cachedNodeById(parentBoneId);
          return node && !node.attachment ? node : null;
        }
        const skinBoneId = piece?.attachment?.skinBoneIds?.[0] ? String(piece.attachment.skinBoneIds[0]) : null;
        if (skinBoneId) {
          const node = cachedNodeById(skinBoneId);
          return node && !node.attachment ? node : null;
        }
        return null;
      }

      function proxyHitForSlashFxPieceBody(piece) {
        if (piece?.role !== "slash-fx-piece") return null;
        const carrier = slashFxCarrierBoneForPiece(piece);
        if (!carrier) return null;
        return { type: "slash-fx-piece-bone", node: carrier, piece };
      }

      function slashFxPieceForNode(node) {
        if (isSlashFxPieceNode(node)) return node;
        if (!node || node.attachment) return null;
        ensureRigPieceCaches();
        return runtimeCache.slashFxPieceByCarrierId.get(node.id) || null;
      }

      function selectedSlashFxPiece() {
        return slashFxPieceForNode(selectedPieceNode()) || slashFxPieceForNode(selectedNode()) || null;
      }

      function slashFxRigNodesForPiece(piece) {
        const bone = slashFxCarrierBoneForPiece(piece);
        return [bone, piece].filter(Boolean);
      }

      function slashFxCarrierBone() {
        const piece = selectedSlashFxPiece();
        return piece ? slashFxCarrierBoneForPiece(piece) : null;
      }

      function arrowRigNodesForPiece(piece) {
        const bone = arrowCarrierBoneForPiece(piece);
        return [bone, piece].filter(Boolean);
      }

      function arrowCarrierBone() {
        const piece = selectedArrowPiece();
        return piece ? arrowCarrierBoneForPiece(piece) : null;
      }

      function arrowGripLocalForPiece(piece) {
        const attachment = piece?.attachment;
        const restPart = attachment?.restPart;
        const image = warriorImages[attachment?.image];
        const width = Math.max(1, image?.naturalWidth || image?.width || 0);
        const height = Math.max(1, image?.naturalHeight || image?.height || 0);
        if (!restPart || !width || !height) return null;
        const candidates =
          width >= height
            ? [
                { x: 0, y: height * 0.5 },
                { x: width, y: height * 0.5 },
              ]
            : [
                { x: width * 0.5, y: 0 },
                { x: width * 0.5, y: height },
              ];
        let best = null;
        candidates.forEach((candidate) => {
          const local = imagePixelToRestWorld(restPart, { width, height }, candidate.x, candidate.y);
          const distance = Math.hypot(local.x, local.y);
          if (!best || distance < best.distance) best = { x: local.x, y: local.y, distance };
        });
        return best ? { x: best.x, y: best.y } : null;
      }

      function slashFxGripLocalForPiece(piece) {
        const attachment = piece?.attachment;
        const restPart = attachment?.restPart;
        const image = warriorImages[attachment?.image];
        const width = Math.max(1, image?.naturalWidth || image?.width || 0);
        const height = Math.max(1, image?.naturalHeight || image?.height || 0);
        if (!restPart || !width || !height) return null;
        const candidates =
          width >= height
            ? [
                { x: 0, y: height * 0.5 },
                { x: width, y: height * 0.5 },
              ]
            : [
                { x: width * 0.5, y: 0 },
                { x: width * 0.5, y: height },
              ];
        let best = null;
        candidates.forEach((candidate) => {
          const local = imagePixelToRestWorld(restPart, { width, height }, candidate.x, candidate.y);
          const distance = Math.hypot(local.x, local.y);
          if (!best || distance < best.distance) best = { x: local.x, y: local.y, distance };
        });
        return best ? { x: best.x, y: best.y } : null;
      }

      function arrowGripWorldPointForNode(node, frame = state.currentFrame) {
        const pose = worldPose(node, frame);
        if (!pose) return null;
        const gripLocal = arrowGripLocalForPiece(arrowPieceForNode(node));
        if (!gripLocal) return { x: pose.worldX, y: pose.worldY };
        const rad = (pose.worldRotation * Math.PI) / 180;
        return {
          x: pose.worldX + gripLocal.x * pose.worldScaleX * Math.cos(rad) - gripLocal.y * pose.worldScaleY * Math.sin(rad),
          y: pose.worldY + gripLocal.x * pose.worldScaleX * Math.sin(rad) + gripLocal.y * pose.worldScaleY * Math.cos(rad),
        };
      }

      function slashFxGripWorldPointForNode(node, frame = state.currentFrame) {
        const pose = worldPose(node, frame);
        if (!pose) return null;
        const gripLocal = slashFxGripLocalForPiece(slashFxPieceForNode(node));
        if (!gripLocal) return { x: pose.worldX, y: pose.worldY };
        const rad = (pose.worldRotation * Math.PI) / 180;
        return {
          x: pose.worldX + gripLocal.x * pose.worldScaleX * Math.cos(rad) - gripLocal.y * pose.worldScaleY * Math.sin(rad),
          y: pose.worldY + gripLocal.x * pose.worldScaleX * Math.sin(rad) + gripLocal.y * pose.worldScaleY * Math.cos(rad),
        };
      }

      function normalizeArrowVisibilityTrack(track, duration = state.duration) {
        if (!Array.isArray(track)) return [];
        return track
          .map((item) => ({
            frame: clampFrameToDuration(item.frame, duration),
            visible: Boolean(item.visible),
          }))
          .sort((a, b) => a.frame - b.frame)
          .filter((item, index, array) => index === array.findIndex((entry) => entry.frame === item.frame));
      }

      function cloneArrowVisibilityTracks(tracks) {
        return Object.fromEntries(
          Object.entries(tracks || {}).map(([pieceId, track]) => [pieceId, normalizeArrowVisibilityTrack(track)]),
        );
      }

      function arrowVisibilityTrackForPiece(piece) {
        return cachedNormalizedTrack(
          state.arrowVisibilityTracks?.[piece?.id],
          state.duration,
          runtimeCache.normalizedArrowVisibilityTracks,
          normalizeArrowVisibilityTrack,
        );
      }

      function normalizeArrowParentTrack(track, duration = state.duration) {
        if (!Array.isArray(track)) return [];
        const byFrame = new Map();
        track.forEach((item) => {
          byFrame.set(clampFrameToDuration(item.frame, duration), {
            frame: clampFrameToDuration(item.frame, duration),
            parentId: item.parentId ? String(item.parentId) : null,
          });
        });
        return [...byFrame.values()].sort((a, b) => a.frame - b.frame);
      }

      function cloneArrowParentTracks(tracks) {
        return Object.fromEntries(
          Object.entries(tracks || {}).map(([pieceId, track]) => [pieceId, normalizeArrowParentTrack(track)]),
        );
      }

      function arrowParentTrackForPiece(piece) {
        return cachedNormalizedTrack(
          state.arrowParentTracks?.[piece?.id],
          state.duration,
          runtimeCache.normalizedArrowParentTracks,
          normalizeArrowParentTrack,
        );
      }

      function normalizeSlashFxVisibilityTrack(track, duration = state.duration) {
        if (!Array.isArray(track)) return [];
        return track
          .map((item) => ({
            frame: clampFrameToDuration(item.frame, duration),
            visible: Boolean(item.visible),
          }))
          .sort((a, b) => a.frame - b.frame)
          .filter((item, index, array) => index === array.findIndex((entry) => entry.frame === item.frame));
      }

      function cloneSlashFxVisibilityTracks(tracks) {
        return Object.fromEntries(
          Object.entries(tracks || {}).map(([pieceId, track]) => [pieceId, normalizeSlashFxVisibilityTrack(track)]),
        );
      }

      function slashFxVisibilityTrackForPiece(piece) {
        return cachedNormalizedTrack(
          state.slashFxVisibilityTracks?.[piece?.id],
          state.duration,
          runtimeCache.normalizedSlashFxVisibilityTracks,
          normalizeSlashFxVisibilityTrack,
        );
      }

      function normalizeSlashFxParentTrack(track, duration = state.duration) {
        if (!Array.isArray(track)) return [];
        const byFrame = new Map();
        track.forEach((item) => {
          const frame = clampFrameToDuration(item.frame, duration);
          byFrame.set(frame, {
            frame,
            parentId: item.parentId ? String(item.parentId) : null,
          });
        });
        return [...byFrame.values()].sort((a, b) => a.frame - b.frame);
      }

      function cloneSlashFxParentTracks(tracks) {
        return Object.fromEntries(
          Object.entries(tracks || {}).map(([pieceId, track]) => [pieceId, normalizeSlashFxParentTrack(track)]),
        );
      }

      function cloneSlashFxActionHiddenMap(map) {
        return Object.fromEntries(
          Object.entries(map || {}).filter(([pieceId, hidden]) => pieceId && hidden === true).map(([pieceId]) => [pieceId, true]),
        );
      }

      function slashFxParentTrackForPiece(piece) {
        return cachedNormalizedTrack(
          state.slashFxParentTracks?.[piece?.id],
          state.duration,
          runtimeCache.normalizedSlashFxParentTracks,
          normalizeSlashFxParentTrack,
        );
      }

      function isSlashFxHiddenForCurrentAction(piece) {
        return Boolean(piece?.id && state.slashFxActionHiddenMap?.[piece.id]);
      }

      function lastTrackEntryAtOrBefore(track, frame) {
        for (let index = track.length - 1; index >= 0; index -= 1) {
          if (track[index].frame <= frame) return track[index];
        }
        return null;
      }

      function firstTrackEntryAfter(track, frame) {
        for (let index = 0; index < track.length; index += 1) {
          if (track[index].frame > frame) return track[index];
        }
        return null;
      }

      function legacyArrowVisibilityTrackForPiece(piece) {
        const [bone] = arrowRigNodesForPiece(piece);
        const pieceTrack = normalizeArrowVisibilityTrack(
          (state.timelines[piece?.id] || []).filter((item) => typeof item.visible === "boolean"),
        );
        if (pieceTrack.length) return pieceTrack;
        return normalizeArrowVisibilityTrack(
          (state.timelines[bone?.id] || []).filter((item) => typeof item.visible === "boolean"),
        );
      }

      function arrowVisibilityAtFrame(piece, frame = state.currentFrame) {
        if (!piece) return true;
        const track = arrowVisibilityTrackForPiece(piece);
        const effectiveTrack = track.length ? track : legacyArrowVisibilityTrackForPiece(piece);
        if (!effectiveTrack.length) return true;
        const previous = lastTrackEntryAtOrBefore(effectiveTrack, frame);
        if (previous) return previous.visible;
        return !effectiveTrack[0].visible;
      }

      function arrowParentAtFrame(piece, frame = state.currentFrame) {
        if (!piece) return null;
        const track = arrowParentTrackForPiece(piece);
        const previous = lastTrackEntryAtOrBefore(track, frame);
        return previous?.parentId || null;
      }

      function arrowParentChangeBetweenFrames(piece, startFrame, endFrame) {
        if (!piece) return null;
        return arrowParentTrackForPiece(piece).find((item) => item.frame > startFrame && item.frame <= endFrame) || null;
      }

      function slashFxVisibilityAtFrame(piece, frame = state.currentFrame) {
        if (!piece) return false;
        if (isSlashFxHiddenForCurrentAction(piece)) return false;
        const track = slashFxVisibilityTrackForPiece(piece);
        if (!track.length) return true;
        const previous = lastTrackEntryAtOrBefore(track, frame);
        return previous ? previous.visible : false;
      }

      function slashFxAlphaAtFrame(piece, frame = state.currentFrame) {
        if (!piece) return 0;
        if (isSlashFxHiddenForCurrentAction(piece)) return 0;
        const track = slashFxVisibilityTrackForPiece(piece);
        if (!track.length) return 1;
        const appearFadeFrames = 2;
        const disappearFadeFrames = 5;
        const previous = lastTrackEntryAtOrBefore(track, frame);
        if (previous && !previous.visible && frame <= previous.frame + disappearFadeFrames) {
          const fadeT = Math.max(0, Math.min(1, (frame - previous.frame) / disappearFadeFrames));
          return 1 - fadeT;
        }
        const next = firstTrackEntryAfter(track, frame);
        if (next && next.visible && frame >= next.frame - appearFadeFrames) {
          const fadeT = Math.max(0, Math.min(1, (frame - (next.frame - appearFadeFrames)) / appearFadeFrames));
          return fadeT;
        }
        return slashFxVisibilityAtFrame(piece, frame) ? 1 : 0;
      }

      function slashFxParentAtFrame(piece, frame = state.currentFrame) {
        if (!piece) return null;
        const track = slashFxParentTrackForPiece(piece);
        const previous = lastTrackEntryAtOrBefore(track, frame);
        return previous?.parentId || null;
      }

      function slashFxParentChangeBetweenFrames(piece, startFrame, endFrame) {
        if (!piece) return null;
        return (
          slashFxParentTrackForPiece(piece).find((item) => item.frame > startFrame && item.frame <= endFrame) || null
        );
      }

      function effectiveParentIdForNode(node, frame = state.currentFrame) {
        if (!node) return null;
        if (node.attachment) return node.parentId || null;
        const arrowPiece = arrowPieceForNode(node);
        if (arrowPiece) return arrowParentAtFrame(arrowPiece, frame);
        const slashFxPiece = slashFxPieceForNode(node);
        if (slashFxPiece) return slashFxParentAtFrame(slashFxPiece, frame);
        return node.parentId || null;
      }

      function isTempParentBoundArrowCarrier(node, frame = state.currentFrame) {
        if (!node || node.attachment) return false;
        const arrowPiece = arrowPieceForNode(node);
        if (!arrowPiece) return false;
        return Boolean(arrowParentAtFrame(arrowPiece, frame));
      }

      function isTempParentBoundSlashFxCarrier(node, frame = state.currentFrame) {
        if (!node || node.attachment) return false;
        const slashFxPiece = slashFxPieceForNode(node);
        if (!slashFxPiece) return false;
        return Boolean(slashFxParentAtFrame(slashFxPiece, frame));
      }

      function participatesInGenericJointSolver(node, frame = state.currentFrame) {
        if (isBowRigNode(node)) return false;
        return !isTempParentBoundArrowCarrier(node, frame) && !isTempParentBoundSlashFxCarrier(node, frame);
      }

      function effectiveAttachmentAlpha(node, frame = state.currentFrame) {
        const baseAlpha = Math.max(0, Math.min(1, Number(node?.attachment?.alpha ?? 1)));
        const slashFxPiece = slashFxPieceForNode(node);
        if (slashFxPiece) return baseAlpha * slashFxAlphaAtFrame(slashFxPiece, frame);
        return baseAlpha;
      }

      function boundBoneIdsForPiece(piece) {
        if (!piece?.attachment) return [];
        if (piece.attachment.fullSkin) {
          return (piece.attachment.skinBoneIds || []).filter((id) => state.nodes.some((node) => node.id === id));
        }
        const ids = [piece.id, piece.attachment.chainTo].filter(Boolean);
        return [...new Set(ids)];
      }

      function bindBoneToSelectedPiece(nodeId) {
        if (!isBindingMode()) return;
        const piece = selectedPieceNode();
        if (!piece?.attachment?.fullSkin) return;
        const ids = new Set(piece.attachment.skinBoneIds || []);
        ids.add(nodeId);
        piece.attachment.skinBoneIds = [...ids];
      }

      function pieceTransform(piece) {
        const attachment = piece?.attachment;
        if (!attachment) return null;
        if (attachment.fullSkin) {
          const restPart = resolveRestPartTransform(attachment.restPart, false) || attachment.restPart || {};
          return {
            x: restPart.x || 0,
            y: restPart.y || 0,
            scale: restPart.scale || 1,
            rotation: restPart.rotation || 0,
          };
        }
        const image = warriorImages[attachment.image];
        const naturalWidth = Math.max(1, image?.naturalWidth || image?.width || attachment.width || 48);
        return {
          x: attachment.offsetX || 0,
          y: attachment.offsetY || 0,
          scale: Math.max(0.01, (attachment.width || 48) / naturalWidth),
          rotation: attachment.rotationOffset || 0,
        };
      }

      function setPieceTransformPatch(patch, shouldRender = true) {
        const piece = selectedPieceNode();
        if (!piece?.attachment) return;
        if (piece.attachment.fullSkin) {
          piece.attachment.restPart = setResolvedRestPartTransform(
            piece.attachment.restPart || {
              partId: piece.id,
              x: 0,
              y: 0,
              scale: 1,
              rotation: 0,
              anchorX: 0.5,
              anchorY: 0.5,
              parentBoneId: null,
            },
            {
              ...(patch.x !== undefined ? { x: patch.x } : {}),
              ...(patch.y !== undefined ? { y: patch.y } : {}),
              ...(patch.scale !== undefined ? { scale: Math.max(0.01, patch.scale) } : {}),
              ...(patch.rotation !== undefined ? { rotation: patch.rotation } : {}),
            },
            false,
          );
        } else {
          const image = warriorImages[piece.attachment.image];
          const naturalWidth = Math.max(1, image?.naturalWidth || image?.width || piece.attachment.width || 48);
          piece.attachment = normalizeAttachment({
            ...piece.attachment,
            ...(patch.x !== undefined ? { offsetX: patch.x } : {}),
            ...(patch.y !== undefined ? { offsetY: patch.y } : {}),
            ...(patch.scale !== undefined ? { width: Math.max(1, naturalWidth * patch.scale) } : {}),
            ...(patch.rotation !== undefined ? { rotationOffset: patch.rotation } : {}),
          });
        }
        dynamicScarves.clear();
        if (shouldRender) renderAll();
      }

      function renderProperties() {

      function renderAttachmentProperties(node) {

        el.attachmentHemEnabledInput.checked = Boolean(attachment?.hemEnabled);
        el.attachmentHemXInput.value = round(attachment?.hemX ?? 0.5, 2);
        el.attachmentHemYInput.value = round(attachment?.hemY ?? 0.68, 2);
        el.attachmentHemLengthInput.value = round(attachment?.hemLength ?? 0.75, 2);
        el.attachmentHemAngleInput.value = round(attachment?.hemAngle ?? 90);
        const pieces = pieceNodes()
          .filter((item) => item.attachment)
          .sort((a, b) => {
            const layerDiff = (a.attachment?.layer || 0) - (b.attachment?.layer || 0);
            if (layerDiff) return layerDiff;
            return state.nodes.indexOf(a) - state.nodes.indexOf(b);
          });
        const selectedIndex = pieces.findIndex((item) => item.id === context.owner?.id);
        if (el.layerUpBtn) el.layerUpBtn.disabled = !attachment || selectedIndex >= pieces.length - 1;
        if (el.layerDownBtn) el.layerDownBtn.disabled = !attachment || selectedIndex <= 0;
      }

      function renderBindingPanel() {
        if (!el.weaponImageSelect) return;

      }

      function moveSelectedPieceLayer(direction) {
        const piece = selectedPieceNode();
        if (!piece?.attachment) return;
        const pieces = pieceNodes()
          .filter((node) => node.attachment)
          .sort((a, b) => {
            const layerDiff = (a.attachment?.layer || 0) - (b.attachment?.layer || 0);
            if (layerDiff) return layerDiff;
            return state.nodes.indexOf(a) - state.nodes.indexOf(b);
          });
        const index = pieces.findIndex((node) => node.id === piece.id);
        if (index === -1) return;
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= pieces.length) return;
        const target = pieces[targetIndex];
        const currentLayer = Number(piece.attachment.layer) || 0;
        piece.attachment.layer = Number(target.attachment.layer) || 0;
        target.attachment.layer = currentLayer;
        renderAll();
      }

      function renderTimeline() {
        const rows = sortedNodes();
        const width = (state.duration + 1) * frameWidth;
        el.tracks.style.width = `${width}px`;
        el.tracks.style.height = `${(rows.length + 1) * rowHeight}px`;
        el.trackLabels.innerHTML = '<div class="track-label">帧 / 节点</div>';
        rows.forEach((node) => {
          const label = document.createElement("div");
          label.className = "track-label";
          label.textContent = `${"  ".repeat(node.depth)}${node.name}`;
          el.trackLabels.appendChild(label);
        });

        el.tracks.innerHTML = "";
        const ruler = document.createElement("div");
        ruler.className = "frame-ruler";
        ruler.style.width = `${width}px`;
        el.tracks.appendChild(ruler);

        for (let frame = 0; frame <= state.duration; frame += 4) {
          const line = document.createElement("div");
          line.className = "frame-line";
          line.style.left = `${frame * frameWidth}px`;
          line.style.opacity = frame % 24 === 0 ? "1" : "0.45";
          ruler.appendChild(line);
          if (frame % 12 === 0) {
            const label = document.createElement("div");
            label.className = "frame-label";
            label.style.left = `${frame * frameWidth}px`;
            label.textContent = frame + 1;
            ruler.appendChild(label);
          }
        }

        rows.forEach((node, index) => {
          const row = document.createElement("div");
          row.className = "track-row";
          row.style.width = `${width}px`;
          row.dataset.nodeId = node.id;
          row.style.height = `${rowHeight}px`;
          row.addEventListener("pointerdown", (event) => {
            if (event.target !== row) return;
            const frame = frameFromPointer(event, el.tracksViewport);
            state.currentFrame = clampFrame(frame);
            state.selectedNodeId = node.id;
            state.selectedKey = null;
            renderAll();
          });

          (state.timelines[node.id] || []).forEach((keyframe) => {
            const marker = document.createElement("div");
            marker.className =
              "key" +
              (state.selectedKey &&
              state.selectedKey.nodeId === node.id &&
              state.selectedKey.frame === keyframe.frame
                ? " active"
                : "");
            marker.style.left = `${keyframe.frame * frameWidth}px`;
            marker.title = `${node.name} @ 第 ${keyframe.frame + 1} 帧`;
            marker.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              event.stopPropagation();
              state.selectedNodeId = node.id;
              state.selectedKey = { nodeId: node.id, frame: keyframe.frame };
              drag = {
                type: "key",
                nodeId: node.id,
                startX: event.clientX,
                sourceFrame: keyframe.frame,
                keyMoveMode: event.shiftKey ? "all" : state.keyMoveMode,
                keyEntries: keyDragEntries(node.id, keyframe, event.shiftKey ? "all" : state.keyMoveMode),
              };
              marker.setPointerCapture(event.pointerId);
              renderAll();
            });
            row.appendChild(marker);
          });

          row.style.position = "absolute";
          row.style.top = `${(index + 1) * rowHeight}px`;
          el.tracks.appendChild(row);
        });

        const playhead = document.createElement("div");
        playhead.className = "playhead";
        playhead.style.left = `${state.currentFrame * frameWidth}px`;
        el.tracks.appendChild(playhead);
      }
