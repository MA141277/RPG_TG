<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terra Observer Ground Map Replica</title>
    <style>
      :root {
        --bg: #171817;
        --panel: rgba(25, 27, 25, 0.92);
        --panel-strong: rgba(33, 36, 32, 0.96);
        --line: rgba(235, 226, 196, 0.16);
        --text: #f3ead4;
        --muted: #bcb29f;
        --accent: #d6b46b;
        --water: #5b93ac;
        --green: #80a465;
        --red: #b66353;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Microsoft YaHei UI",
          "Microsoft YaHei",
          "Segoe UI",
          sans-serif;
      }

      body {
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 340px;
        grid-template-rows: 64px minmax(0, 1fr) 84px;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 48% 42%, rgba(214, 180, 107, 0.11), transparent 34%),
          linear-gradient(135deg, rgba(50, 58, 43, 0.92), rgba(19, 22, 20, 0.98) 52%, rgba(15, 17, 18, 0.98)),
          url("../map/ZeromaX-s-Playground-master/TerraObserver/Assets/CatlikeCoding/terrain.png")
            center / 256px repeat;
      }

      .topbar {
        z-index: 5;
        grid-column: 1 / 4;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(18, 20, 18, 0.88);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 270px;
      }

      .brand strong {
        font-size: 18px;
      }

      .brand span,
      .readout {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
      }

      .segmented {
        display: flex;
        padding: 3px;
        border: 1px solid rgba(239, 226, 190, 0.14);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
      }

      .seg-btn,
      .icon-btn,
      .cmd {
        height: 36px;
        border: 1px solid rgba(239, 226, 190, 0.17);
        border-radius: 6px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        cursor: pointer;
      }

      .seg-btn {
        min-width: 68px;
        border: 0;
        color: var(--muted);
        background: transparent;
      }

      .seg-btn.is-active,
      .icon-btn.is-active,
      .cmd.primary {
        color: var(--text);
        border-color: rgba(214, 180, 107, 0.72);
        background: rgba(214, 180, 107, 0.22);
      }

      .icon-btn {
        min-width: 38px;
      }

      .seg-btn:hover,
      .icon-btn:hover,
      .cmd:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .readout {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .panel {
        z-index: 3;
        margin: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .left {
        grid-column: 1;
        grid-row: 2;
      }

      .right {
        grid-column: 3;
        grid-row: 2;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 46px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-strong);
      }

      .panel-header strong {
        font-size: 15px;
      }

      .panel-body {
        padding: 12px 14px;
        overflow: auto;
      }

      .stage-wrap {
        position: relative;
        z-index: 1;
        grid-column: 2;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        padding: 16px 0;
      }

      .map-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-top: 1px solid rgba(239, 226, 190, 0.12);
        border-bottom: 1px solid rgba(239, 226, 190, 0.12);
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          rgba(17, 20, 18, 0.52);
        background-size: 46px 46px;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .metric {
        min-height: 64px;
        padding: 10px;
        border: 1px solid rgba(239, 226, 190, 0.12);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.045);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-top: 12px;
      }

      .list-row {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        padding: 7px 8px;
        border-radius: 6px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        font-size: 13px;
      }

      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.38);
      }

      .inspector {
        display: grid;
        gap: 10px;
      }

      .tile-name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        border-radius: 6px;
        background: rgba(214, 180, 107, 0.12);
      }

      .tile-name strong {
        font-size: 18px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid rgba(239, 226, 190, 0.16);
        color: var(--muted);
        background: rgba(0, 0, 0, 0.18);
        font-size: 12px;
      }

      .stat-line {
        display: grid;
        grid-template-columns: 72px 1fr 42px;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--water), var(--accent));
      }

      .mini-map {
        height: 120px;
        border: 1px solid rgba(239, 226, 190, 0.12);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.22);
      }

      .log {
        min-height: 150px;
        max-height: 210px;
        overflow: auto;
      }

      .log p {
        margin: 0 0 8px;
        padding: 8px;
        border-left: 3px solid rgba(214, 180, 107, 0.52);
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .footer {
        z-index: 5;
        grid-column: 1 / 4;
        grid-row: 3;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        background: rgba(18, 20, 18, 0.88);
        backdrop-filter: blur(16px);
      }

      .range-block {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      input[type="range"] {
        width: 190px;
        accent-color: var(--accent);
      }

      .action-row {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .cmd {
        min-width: 88px;
        height: 38px;
      }

      @media (max-width: 1080px) {
        body {
          overflow: auto;
        }

        .app {
          min-height: 100vh;
          height: auto;
          grid-template-columns: 1fr;
          grid-template-rows: auto 62vh auto auto auto;
        }

        .topbar,
        .footer,
        .left,
        .right,
        .stage-wrap {
          grid-column: 1;
        }

        .topbar {
          flex-wrap: wrap;
        }

        .stage-wrap {
          grid-row: 2;
          padding: 0;
        }

        .left {
          grid-row: 3;
        }

        .right {
          grid-row: 4;
        }

        .footer {
          grid-row: 5;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <strong>泰拉地表地图</strong>
          <span>HTML 复刻台</span>
        </div>
        <nav class="toolbar" aria-label="图层">
          <div class="segmented" data-layer-control>
            <button class="seg-btn is-active" data-layer="terrain">地形</button>
            <button class="seg-btn" data-layer="height">海拔</button>
            <button class="seg-btn" data-layer="faction">势力</button>
            <button class="seg-btn" data-layer="water">水系</button>
          </div>
          <button class="icon-btn is-active" data-toggle="roads" title="道路">╋</button>
          <button class="icon-btn is-active" data-toggle="rivers" title="河流">≈</button>
          <button class="icon-btn is-active" data-toggle="labels" title="标记">◆</button>
        </nav>
        <div class="readout">
          <span>回合 <strong data-turn>1</strong></span>
          <span>视图 <strong data-layer-name>地形</strong></span>
        </div>
      </header>

      <aside class="panel left">
        <div class="panel-header">
          <strong>地图状态</strong>
          <span class="chip">地表</span>
        </div>
        <div class="panel-body">
          <div class="metric-grid">
            <div class="metric"><span>地块</span><strong data-total-tiles>0</strong></div>
            <div class="metric"><span>城镇</span><strong data-town-count>0</strong></div>
            <div class="metric"><span>河段</span><strong data-river-count>0</strong></div>
            <div class="metric"><span>路径</span><strong data-path-count>0</strong></div>
          </div>
          <div class="list" data-faction-list></div>
        </div>
      </aside>

      <section class="stage-wrap" aria-label="地表地图">
        <div class="map-frame">
          <canvas id="map" width="1200" height="820"></canvas>
        </div>
      </section>

      <aside class="panel right">
        <div class="panel-header">
          <strong>地块检视</strong>
          <span class="chip" data-selection-state>未锁定</span>
        </div>
        <div class="panel-body inspector">
          <div class="tile-name">
            <strong data-tile-name>地块</strong>
            <span class="chip" data-tile-type>平原</span>
          </div>
          <div class="stat-line">
            <span>海拔</span>
            <div class="bar"><span data-bar="height"></span></div>
            <strong data-value="height">0</strong>
          </div>
          <div class="stat-line">
            <span>湿度</span>
            <div class="bar"><span data-bar="moisture"></span></div>
            <strong data-value="moisture">0</strong>
          </div>
          <div class="stat-line">
            <span>开发</span>
            <div class="bar"><span data-bar="urban"></span></div>
            <strong data-value="urban">0</strong>
          </div>
          <canvas class="mini-map" id="minimap" width="560" height="170"></canvas>
          <div class="log" data-log></div>
        </div>
      </aside>

      <footer class="footer">
        <div class="range-block">
          <span>尺寸</span>
          <input type="range" min="12" max="28" value="20" step="2" data-control="size">
          <strong data-size-readout>20</strong>
        </div>
        <div class="action-row">
          <button class="cmd" data-action="regen">重建</button>
          <button class="cmd primary" data-action="step">推演</button>
          <button class="cmd" data-action="route">寻路</button>
        </div>
        <div class="range-block" style="justify-content: flex-end;">
          <span>相机</span>
          <input type="range" min="0.72" max="1.45" value="1" step="0.02" data-control="camera">
          <strong data-camera-readout>1.00x</strong>
        </div>
      </footer>
    </main>

    <script>
      const canvas = document.querySelector("#map");
      const ctx = canvas.getContext("2d");
      const minimap = document.querySelector("#minimap");
      const miniCtx = minimap.getContext("2d");

      const state = {
        cols: 20,
        rows: 14,
        zoom: 1,
        cameraScale: 1,
        layer: "terrain",
        turn: 1,
        selectedId: "10,7",
        playerId: "4,7",
        targetId: "16,6",
        showRoads: true,
        showRivers: true,
        showLabels: true,
        path: [],
        tiles: [],
        tileById: new Map(),
        logs: []
      };

      const factions = [
        { id: "temple", name: "山寺", color: "#d6b46b" },
        { id: "market", name: "市镇", color: "#6f9eb3" },
        { id: "fort", name: "边寨", color: "#b66353" },
        { id: "wild", name: "荒地", color: "#80a465" }
      ];

      const nameSeeds = [
        "青溪", "旧港", "石岭", "赤坂", "柳浦", "雾田", "白沙", "南坡",
        "寒渡", "长桥", "松原", "北寨", "浅湾", "荒丘", "东市", "云坞"
      ];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function fract(value) {
        return value - Math.floor(value);
      }

      function hash(q, r, seed = 0) {
        return fract(Math.sin(q * 127.1 + r * 311.7 + seed * 74.7) * 43758.5453123);
      }

      function tileId(q, r) {
        return `${q},${r}`;
      }

      function getTile(q, r) {
        return state.tileById.get(tileId(q, r));
      }

      function mapMetrics() {
        const size = 23 * state.zoom;
        const mapWidth = size * Math.sqrt(3) * (state.cols + state.rows / 2);
        const mapHeight = size * 1.5 * state.rows;
        return { size, mapWidth, mapHeight };
      }

      function axialToWorld(q, r) {
        const { size, mapWidth, mapHeight } = mapMetrics();
        const x = size * Math.sqrt(3) * (q + r / 2);
        const y = size * 1.5 * r;
        return {
          x: (x - mapWidth / 2 + 70) / Math.max(mapWidth, 1) * 2,
          y: (mapHeight / 2 - y - 40) / Math.max(mapHeight, 1) * 2
        };
      }

      function projectWorld(x, y, z = 0) {
        const terrainScale = 1.46 * state.cameraScale;
        const tilt = -0.82;
        const fov = 38 * Math.PI / 180;
        const distance = 2.72 / state.cameraScale;
        const scaledX = x * terrainScale;
        const scaledY = y * terrainScale;
        const scaledZ = z * 0.27 * terrainScale;
        const cos = Math.cos(tilt);
        const sin = Math.sin(tilt);
        const cameraY = scaledY * cos - scaledZ * sin;
        const cameraZ = scaledY * sin + scaledZ * cos - distance;
        const focal = 1 / Math.tan(fov / 2);
        const w = Math.max(0.1, -cameraZ);
        const ndcX = (scaledX * focal) / w;
        const ndcY = (cameraY * focal) / w;
        return {
          x: canvas.width * (0.5 + ndcX * 0.5),
          y: canvas.height * (0.5 - ndcY * 0.5),
          scale: Math.min(Math.max(1 / Math.max(w, 0.45), 0.58), 1.42),
          depth: w
        };
      }

      function axialToPixel(q, r, z = 0) {
        const world = axialToWorld(q, r);
        return projectWorld(world.x, world.y, z);
      }

      function tileCenter(tile, z = tile.height) {
        return axialToPixel(tile.q, tile.r, z);
      }

      function tileCorners(tile, z = tile.height, radiusScale = 1) {
        const { size } = mapMetrics();
        const { mapWidth, mapHeight } = mapMetrics();
        const center = axialToWorld(tile.q, tile.r);
        const radiusX = size * radiusScale / Math.max(mapWidth, 1) * 2;
        const radiusY = size * radiusScale / Math.max(mapHeight, 1) * 2;
        const corners = [];
        for (let i = 0; i < 6; i += 1) {
          const angle = Math.PI / 6 + (Math.PI * 2 * i) / 6;
          corners.push(projectWorld(
            center.x + Math.cos(angle) * radiusX,
            center.y - Math.sin(angle) * radiusY,
            z
          ));
        }
        return corners;
      }

      function averageDepth(tile) {
        const world = axialToWorld(tile.q, tile.r);
        return -world.y + tile.height * 0.2;
      }

      function pixelToTile(x, y) {
        let best = null;
        for (const tile of state.tiles) {
          const p = tileCenter(tile);
          const d = Math.hypot(p.x - x, p.y - y);
          if (best == null || d < best.d) {
            best = { tile, d };
          }
        }
        return best && best.d < 30 * state.zoom ? best.tile : null;
      }

      function classify(tile) {
        if (tile.water) return "水域";
        if (tile.height > 0.78) return "山地";
        if (tile.moisture > 0.72) return "湿地";
        if (tile.height < 0.44) return "低地";
        return "平原";
      }

      function terrainColor(tile) {
        if (tile.water) return `rgb(${42 + tile.moisture * 20}, ${82 + tile.moisture * 34}, ${112 + tile.moisture * 60})`;
        if (tile.height > 0.8) return `rgb(${183 + tile.height * 42}, ${183 + tile.height * 36}, ${174 + tile.height * 34})`;
        if (tile.moisture > 0.72) return `rgb(${58 + tile.height * 28}, ${112 + tile.moisture * 70}, ${80 + tile.moisture * 36})`;
        if (tile.moisture < 0.25) return `rgb(${158 + tile.height * 45}, ${126 + tile.height * 35}, ${82 + tile.moisture * 24})`;
        return `rgb(${96 + tile.height * 54}, ${128 + tile.moisture * 46}, ${84 + tile.height * 18})`;
      }

      function layerColor(tile) {
        if (state.layer === "height") {
          const v = Math.round(52 + tile.height * 172);
          return `rgb(${v}, ${v}, ${v - 14})`;
        }
        if (state.layer === "faction") {
          return factions.find((faction) => faction.id === tile.faction).color;
        }
        if (state.layer === "water") {
          if (tile.water || tile.riverTo != null) return "#69a7c0";
          return terrainColor(tile);
        }
        return terrainColor(tile);
      }

      function createTiles() {
        state.rows = Math.max(9, Math.round(state.cols * 0.7));
        const tiles = [];
        const tileById = new Map();

        for (let r = 0; r < state.rows; r += 1) {
          for (let q = 0; q < state.cols; q += 1) {
            const nx = q / Math.max(1, state.cols - 1);
            const ny = r / Math.max(1, state.rows - 1);
            const mountain = Math.sin((nx * 2.8 + ny * 1.1) * Math.PI);
            const valley = Math.cos((nx * 1.5 - ny * 2.4) * Math.PI);
            const noise = hash(q, r, state.cols);
            const height = clamp(0.5 + mountain * 0.18 + valley * 0.16 + (noise - 0.5) * 0.28, 0.04, 0.98);
            const moisture = clamp(0.5 + Math.sin((nx * 6.2 + ny * 1.4) * Math.PI) * 0.22 + (0.52 - height) * 0.32 + (hash(q, r, 9) - 0.5) * 0.24, 0, 1);
            const water = height < 0.31 || (ny > 0.78 && height < 0.43);
            const urban = water ? 0 : clamp((hash(q, r, 4) + moisture + height - 0.72) / 2, 0, 1);
            const faction =
              water ? "market" :
              urban > 0.66 ? "market" :
              height > 0.74 ? "fort" :
              hash(q, r, 13) > 0.74 ? "temple" :
              "wild";
            const tile = {
              id: tileId(q, r),
              q,
              r,
              height,
              moisture,
              water,
              urban,
              town: !water && urban > 0.62,
              faction,
              riverTo: null,
              roadTo: new Set(),
              name: `${nameSeeds[(q * 3 + r * 5) % nameSeeds.length]} ${q + 1}-${r + 1}`,
              neighbors: []
            };
            tiles.push(tile);
            tileById.set(tile.id, tile);
          }
        }

        state.tiles = tiles;
        state.tileById = tileById;

        const dirs = [
          [1, 0], [1, -1], [0, -1],
          [-1, 0], [-1, 1], [0, 1]
        ];

        for (const tile of state.tiles) {
          tile.neighbors = dirs
            .map(([dq, dr]) => getTile(tile.q + dq, tile.r + dr))
            .filter(Boolean)
            .map((neighbor) => neighbor.id);
        }

        createRivers();
        createRoads();
        state.selectedId = getTile(Math.floor(state.cols * 0.52), Math.floor(state.rows * 0.5)).id;
        state.playerId = getTile(Math.floor(state.cols * 0.18), Math.floor(state.rows * 0.55)).id;
        state.targetId = getTile(Math.floor(state.cols * 0.82), Math.floor(state.rows * 0.44)).id;
        updatePath();
        log(`重建地表：${state.cols} x ${state.rows}，生成 ${state.tiles.length} 个六边形地块。`);
        updateUi();
      }

      function createRivers() {
        for (const tile of state.tiles) {
          tile.riverTo = null;
        }

        const origins = state.tiles
          .filter((tile) => !tile.water && tile.height > 0.67 && tile.moisture > 0.52)
          .sort((a, b) => b.height - a.height)
          .slice(0, Math.max(4, Math.floor(state.cols / 3)));

        for (const origin of origins) {
          let current = origin;
          const visited = new Set();
          for (let i = 0; i < 24; i += 1) {
            if (current.water || visited.has(current.id)) break;
            visited.add(current.id);
            const next = current.neighbors
              .map((id) => state.tileById.get(id))
              .sort((a, b) => (a.height + hash(a.q, a.r, 21) * 0.08) - (b.height + hash(b.q, b.r, 21) * 0.08))[0];
            if (!next || next.height > current.height + 0.03) break;
            current.riverTo = next.id;
            current = next;
          }
        }
      }

      function createRoads() {
        for (const tile of state.tiles) {
          tile.roadTo.clear();
        }
        const towns = state.tiles.filter((tile) => tile.town);
        for (const town of towns) {
          const nearest = towns
            .filter((candidate) => candidate.id !== town.id)
            .map((candidate) => ({
              candidate,
              d: Math.hypot(candidate.q - town.q, candidate.r - town.r)
            }))
            .sort((a, b) => a.d - b.d)
            .slice(0, 2);
          for (const item of nearest) {
            const path = findPath(town.id, item.candidate.id, false);
            for (let i = 0; i < path.length - 1; i += 1) {
              const a = state.tileById.get(path[i]);
              const b = state.tileById.get(path[i + 1]);
              a.roadTo.add(b.id);
              b.roadTo.add(a.id);
            }
          }
        }
      }

      function moveCost(from, to) {
        if (to.water) return 8;
        const slope = Math.abs(from.height - to.height);
        const road = from.roadTo.has(to.id) ? -1.8 : 0;
        return Math.max(0.6, 1 + slope * 7 + (to.riverTo ? 0.2 : 0) + road);
      }

      function findPath(startId, goalId, avoidWater = true) {
        const frontier = [{ id: startId, priority: 0 }];
        const cameFrom = new Map([[startId, null]]);
        const costSoFar = new Map([[startId, 0]]);

        while (frontier.length > 0) {
          frontier.sort((a, b) => a.priority - b.priority);
          const current = frontier.shift();
          if (current.id === goalId) break;
          const tile = state.tileById.get(current.id);
          for (const nextId of tile.neighbors) {
            const next = state.tileById.get(nextId);
            if (avoidWater && next.water) continue;
            const cost = costSoFar.get(current.id) + moveCost(tile, next);
            if (!costSoFar.has(nextId) || cost < costSoFar.get(nextId)) {
              costSoFar.set(nextId, cost);
              const goal = state.tileById.get(goalId);
              const priority = cost + Math.hypot(goal.q - next.q, goal.r - next.r);
              frontier.push({ id: nextId, priority });
              cameFrom.set(nextId, current.id);
            }
          }
        }

        const path = [];
        let current = goalId;
        while (current != null && cameFrom.has(current)) {
          path.push(current);
          current = cameFrom.get(current);
        }
        return path.reverse();
      }

      function updatePath() {
        state.path = findPath(state.playerId, state.targetId, true);
      }

      function drawPolygon(points, fill, stroke = "rgba(0,0,0,0)", lineWidth = 1) {
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke !== "rgba(0,0,0,0)") {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      }

      function drawProjectedHex(tile, radiusScale, fill, stroke, lineWidth = 1) {
        drawPolygon(tileCorners(tile, tile.height, radiusScale), fill, stroke, lineWidth);
      }

      function drawTileColumn(tile) {
        const top = tileCorners(tile, tile.height);
        const bottom = tileCorners(tile, 0);
        const ground = tileCorners(tile, -0.03, 1.06);
        drawPolygon(ground, "rgba(0, 0, 0, 0.2)");

        for (let i = 0; i < 6; i += 1) {
          const next = (i + 1) % 6;
          const sideDepth = (top[i].y + top[next].y) / 2;
          if (sideDepth < canvas.height * 0.42) continue;
          const shade = i === 1 || i === 2 ? "rgba(25, 31, 27, 0.42)" : "rgba(9, 12, 12, 0.52)";
          drawPolygon([top[i], top[next], bottom[next], bottom[i]], shade, "rgba(0,0,0,0.12)");
        }

        const rim = tile.height > 0.74 ? "rgba(255,255,255,0.3)" : "rgba(0,0,0,0.18)";
        drawProjectedHex(tile, 1, layerColor(tile), rim, 1);
      }

      function drawVanishingGrid() {
        ctx.save();
        ctx.strokeStyle = "rgba(239, 226, 190, 0.055)";
        ctx.lineWidth = 1;
        for (let i = -8; i <= 8; i += 1) {
          const a = projectWorld(i / 4, 1.32, -0.08);
          const b = projectWorld(i / 4 + 0.4, -1.28, -0.08);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        for (let i = -10; i <= 10; i += 1) {
          const a = projectWorld(-1.3, i / 6, -0.08);
          const b = projectWorld(1.36, i / 6, -0.08);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawConnection(from, to, color, width) {
        const a = tileCenter(from, from.height + 0.04);
        const b = tileCenter(to, to.height + 0.04);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = width * Math.min(a.scale, b.scale);
        ctx.lineCap = "round";
        ctx.stroke();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawVanishingGrid();

        const sortedTiles = [...state.tiles].sort((a, b) => averageDepth(a) - averageDepth(b));
        sortedTiles.forEach(drawTileColumn);

        if (state.showRivers) {
          for (const tile of sortedTiles) {
            if (tile.riverTo != null) {
              drawConnection(tile, state.tileById.get(tile.riverTo), "rgba(105, 181, 214, 0.9)", 3.4 * state.zoom);
            }
          }
        }

        if (state.showRoads) {
          const seen = new Set();
          for (const tile of state.tiles) {
            for (const id of tile.roadTo) {
              const key = [tile.id, id].sort().join("|");
              if (seen.has(key)) continue;
              seen.add(key);
              drawConnection(tile, state.tileById.get(id), "rgba(214, 180, 107, 0.68)", 2.4 * state.zoom);
            }
          }
        }

        if (state.path.length > 1) {
          ctx.beginPath();
          state.path.forEach((id, index) => {
            const tile = state.tileById.get(id);
            const p = tileCenter(tile, tile.height + 0.07);
            if (index === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.strokeStyle = "rgba(255, 235, 161, 0.94)";
          ctx.lineWidth = 4 * state.zoom;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.stroke();
        }

        for (const tile of sortedTiles) {
          const p = tileCenter(tile, tile.height + 0.09);
          if (tile.town) {
            ctx.fillStyle = "rgba(25, 19, 13, 0.68)";
            ctx.beginPath();
            ctx.arc(p.x, p.y - 5 * p.scale, 7 * state.zoom * p.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#f0d58b";
            ctx.fillRect(p.x - 4 * state.zoom * p.scale, p.y - 13 * state.zoom * p.scale, 8 * state.zoom * p.scale, 8 * state.zoom * p.scale);
          }
        }

        const selected = state.tileById.get(state.selectedId);
        if (selected) {
          drawProjectedHex(selected, 1.07, "rgba(255,255,255,0.035)", "rgba(255,255,255,0.96)", 2.2);
        }

        const player = state.tileById.get(state.playerId);
        if (player) {
          const p = tileCenter(player, player.height + 0.16);
          ctx.fillStyle = "#f4e1a2";
          ctx.strokeStyle = "rgba(0,0,0,0.58)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(p.x, p.y - 8 * p.scale, 8 * state.zoom * p.scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        if (state.showLabels && selected) {
          const p = tileCenter(selected, selected.height + 0.16);
          ctx.fillStyle = "rgba(16, 18, 17, 0.82)";
          ctx.strokeStyle = "rgba(214, 180, 107, 0.72)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(p.x + 14, p.y - 42, 122, 30, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#f3ead4";
          ctx.font = "13px Microsoft YaHei";
          ctx.fillText(selected.name, p.x + 24, p.y - 22);
        }

        drawMiniMap();
        requestAnimationFrame(render);
      }

      function drawMiniMap() {
        miniCtx.clearRect(0, 0, minimap.width, minimap.height);
        miniCtx.fillStyle = "rgba(0,0,0,0.22)";
        miniCtx.fillRect(0, 0, minimap.width, minimap.height);
        const cellW = minimap.width / state.cols;
        const cellH = minimap.height / state.rows;
        for (const tile of state.tiles) {
          miniCtx.fillStyle = tile.id === state.selectedId ? "#f3ead4" : layerColor(tile);
          miniCtx.globalAlpha = tile.id === state.playerId ? 1 : 0.74;
          miniCtx.fillRect(tile.q * cellW, tile.r * cellH, Math.max(2, cellW - 1), Math.max(2, cellH - 1));
        }
        miniCtx.globalAlpha = 1;
      }

      function updateUi() {
        updateStats();
        updateInspector();
      }

      function updateStats() {
        const riverCount = state.tiles.filter((tile) => tile.riverTo != null).length;
        document.querySelector("[data-total-tiles]").textContent = state.tiles.length;
        document.querySelector("[data-town-count]").textContent = state.tiles.filter((tile) => tile.town).length;
        document.querySelector("[data-river-count]").textContent = riverCount;
        document.querySelector("[data-path-count]").textContent = Math.max(0, state.path.length - 1);
        document.querySelector("[data-turn]").textContent = state.turn;
        document.querySelector("[data-layer-name]").textContent =
          { terrain: "地形", height: "海拔", faction: "势力", water: "水系" }[state.layer];
        document.querySelector("[data-faction-list]").innerHTML = factions
          .map((faction) => {
            const count = state.tiles.filter((tile) => tile.faction === faction.id).length;
            return `<div class="list-row"><i class="swatch" style="background:${faction.color}"></i><span>${faction.name}</span><strong>${count}</strong></div>`;
          })
          .join("");
      }

      function updateInspector() {
        const tile = state.tileById.get(state.selectedId);
        if (!tile) return;
        document.querySelector("[data-tile-name]").textContent = tile.name;
        document.querySelector("[data-tile-type]").textContent = classify(tile);
        document.querySelector("[data-selection-state]").textContent = `(${tile.q}, ${tile.r})`;
        setMeter("height", tile.height);
        setMeter("moisture", tile.moisture);
        setMeter("urban", tile.urban);
      }

      function setMeter(name, value) {
        document.querySelector(`[data-bar="${name}"]`).style.width = `${Math.round(value * 100)}%`;
        document.querySelector(`[data-value="${name}"]`).textContent = Math.round(value * 100);
      }

      function log(message) {
        state.logs.unshift(`回合 ${state.turn}：${message}`);
        state.logs = state.logs.slice(0, 8);
        document.querySelector("[data-log]").innerHTML = state.logs.map((item) => `<p>${item}</p>`).join("");
      }

      function simulateStep() {
        state.turn += 1;
        for (const tile of state.tiles) {
          const neighbors = tile.neighbors.map((id) => state.tileById.get(id));
          const avgMoisture = neighbors.reduce((sum, item) => sum + item.moisture, 0) / neighbors.length;
          tile.moisture = clamp(tile.moisture * 0.92 + avgMoisture * 0.08 + (tile.riverTo ? 0.02 : -0.004), 0, 1);
          if (!tile.water && tile.moisture > 0.4) {
            tile.urban = clamp(tile.urban + 0.006, 0, 1);
          }
          tile.town = !tile.water && tile.urban > 0.62;
          if (tile.faction === "wild" && tile.town && hash(tile.q, tile.r, state.turn) > 0.75) {
            tile.faction = "market";
          }
        }
        createRoads();
        updatePath();
        updateUi();
        log("地表湿度、城镇开发和道路网络已刷新。");
      }

      function selectFromPointer(event) {
        const rect = canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
        const tile = pixelToTile(x, y);
        if (!tile) return;
        state.selectedId = tile.id;
        if (event.shiftKey) {
          state.targetId = tile.id;
          updatePath();
          log(`目标设为 ${tile.name}。`);
        }
        updateUi();
      }

      document.querySelector("[data-layer-control]").addEventListener("click", (event) => {
        const button = event.target.closest("[data-layer]");
        if (!button) return;
        state.layer = button.dataset.layer;
        document.querySelectorAll("[data-layer]").forEach((item) => {
          item.classList.toggle("is-active", item === button);
        });
        updateUi();
      });

      document.querySelectorAll("[data-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.toggle === "roads") state.showRoads = !state.showRoads;
          if (button.dataset.toggle === "rivers") state.showRivers = !state.showRivers;
          if (button.dataset.toggle === "labels") state.showLabels = !state.showLabels;
          button.classList.toggle("is-active");
        });
      });

      document.querySelector("[data-control='size']").addEventListener("input", (event) => {
        state.cols = Number(event.target.value);
        document.querySelector("[data-size-readout]").textContent = state.cols;
      });
      document.querySelector("[data-control='size']").addEventListener("change", createTiles);

      document.querySelector("[data-control='camera']").addEventListener("input", (event) => {
        state.cameraScale = Number(event.target.value);
        document.querySelector("[data-camera-readout]").textContent = `${state.cameraScale.toFixed(2)}x`;
      });

      document.querySelector("[data-action='regen']").addEventListener("click", createTiles);
      document.querySelector("[data-action='step']").addEventListener("click", simulateStep);
      document.querySelector("[data-action='route']").addEventListener("click", () => {
        state.targetId = state.selectedId;
        updatePath();
        updateUi();
        log(`重新计算至 ${state.tileById.get(state.targetId).name} 的道路路径。`);
      });

      canvas.addEventListener("click", selectFromPointer);

      createTiles();
      render();
    </script>
  </body>
</html>
