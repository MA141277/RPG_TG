      const renderer = canvas.__battleSpineRenderer;
      if (!renderer?.render) return;
      if (whiteFlashCanvas.width !== canvas.width) {
        whiteFlashCanvas.width = canvas.width;
      }
      if (whiteFlashCanvas.height !== canvas.height) {
        whiteFlashCanvas.height = canvas.height;
      }
      if (whiteFlashSourceCanvas.width !== canvas.width) {
        whiteFlashSourceCanvas.width = canvas.width;
      }
      if (whiteFlashSourceCanvas.height !== canvas.height) {
        whiteFlashSourceCanvas.height = canvas.height;
      }
      const side = canvas.__battleLastRenderSide || canvas.dataset.side || '';
      whiteFlashSourceCanvas.dataset.side = side;
      renderer.render(whiteFlashSourceCanvas, canvas.__battleLastRenderActionId || canvas.dataset.action || 'idle', canvas.__battleLastRenderElapsedMs || 0, {
        loop: canvas.__battleLastRenderLoop,
        side,
        imageSet: 'whiteSilhouette',
      });
      whiteFlashCanvas.dataset.side = side;
      const whiteFlashCtx = whiteFlashCanvas.getContext('2d');
      if (!whiteFlashCtx) return;
      whiteFlashCtx.setTransform(1, 0, 0, 1, 0, 0);
      whiteFlashCtx.clearRect(0, 0, whiteFlashCanvas.width, whiteFlashCanvas.height);
      const seamFillOffsets = [
        [0, 0],
        [-0.6, 0],
        [0.6, 0],
        [0, -0.6],
        [0, 0.6],
      ];
      seamFillOffsets.forEach(([offsetX, offsetY]) => {
        whiteFlashCtx.drawImage(whiteFlashSourceCanvas, offsetX, offsetY);
      });
    }

    function clearBattleSpineCanvasLayers(canvas) {
      if (!(canvas instanceof HTMLCanvasElement)) return;
      [canvas, canvas.__battleWhiteFlashOverlayCanvas, canvas.__battleWhiteFlashSourceCanvas].forEach((layer) => {
        if (!(layer instanceof HTMLCanvasElement)) return;
        const ctx = layer.getContext('2d');
        if (!ctx) return;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, layer.width, layer.height);
      });
      delete canvas.__battleSpineRenderer;
      delete canvas.__battleLastRenderActionId;
      delete canvas.__battleLastRenderElapsedMs;
      delete canvas.__battleLastRenderSide;
      delete canvas.__battleLastRenderLoop;
      delete canvas.__battleLastIdleActionFrameBucket;
    }

    class BattleSpineRenderer {
      constructor(project, images, config = {}, whiteFlashImages = null) {
        this.project = project;
        this.nodes = project.nodes || [];
        this.actions = project.actions || [];
        this.images = images;
        this.whiteFlashImages = whiteFlashImages || images;
        this.config = config;
        this.fps = Number(config.fps) || 36;
        this.nodeById = new Map();
        this.actionById = new Map();
        this.actionByName = new Map();
        this.attachmentNodes = [];
        this.timelineKeyCache = new WeakMap();
        this.projectTimelineKeyCache = new Map();
        this.restWorldPoseCache = new Map();
        this.restPartTransformCache = new WeakMap();
        this.attachmentSourceGridCache = new WeakMap();
        this.renderFrameState = null;
        this.nodes.forEach((node) => {
          if (node?.id != null) {
            this.nodeById.set(String(node.id), node);
          }
          if (node?.attachment) {
            this.attachmentNodes.push(node);
          }
        });
        this.actions.forEach((action) => {
          if (action?.id != null && !this.actionById.has(String(action.id))) {
            this.actionById.set(String(action.id), action);
          }
          if (action?.name != null && !this.actionByName.has(String(action.name))) {
            this.actionByName.set(String(action.name), action);
          }
        });
        this.idleAction =
          this.findPreferredAction(config.idleActionIds || ['idle'], config.idleActionNames || ['待机']) ||
          this.actions[0] ||
          null;
        this.moveAction =
          this.findPreferredAction(config.moveActionIds || ['jump'], config.moveActionNames || ['跳跃']) ||
          this.idleAction;
        this.attackAction =
          this.findPreferredAction(
            config.attackActionIds || [],
            config.attackActionNames || []
          ) ||
          this.findPreferredAction(
            [project.selectedActionId].filter(Boolean),
            []
          ) ||
          this.actions.find(action => action.name === '挥砍') ||
          this.actions.find(
            action => action.id !== this.idleAction?.id && action.id !== this.moveAction?.id
          ) ||
          this.moveAction ||
          this.idleAction;
        this.bounds = this.computeBounds();
      }

      static async load(config = {}) {
        let project = null;
        if (window.location.protocol !== 'file:' && config.projectUrl) {
          const response = await fetch(config.projectUrl, { cache: 'no-store' });
          project = await response.json();
        }
        project ||= config.fallbackProject || window.RECOVERED_SPINE_PROJECT || null;
        if (!project) throw new Error('Missing Spine project data.');
        const imageBaseUrl = config.imageBaseUrl || '../../src/faxian/leg/';
        const imageSources = {
          newHead: `${imageBaseUrl}head.png`,
          newTorso: `${imageBaseUrl}torso.png`,
          newLeftArm: `${imageBaseUrl}leftarm.png`,
          newRightArm: `${imageBaseUrl}rightarm.png`,
          newLeftLeg: `${imageBaseUrl}leftleg.png`,
          newRightLeg: `${imageBaseUrl}rightleg%20(1).png`,
          newSword: `${imageBaseUrl}sword.png`,
        };
        const projectImageBaseUrl = config.projectUrl
          ? new URL(config.projectUrl, window.location.href).href
          : window.location.href;
        Object.entries(project.customImages || {}).forEach(([key, item]) => {
          const src = BattleSpineRenderer.resolveImageSource(item?.src, projectImageBaseUrl);
          if (!src) return;
          imageSources[key] = src;
        });
        const images = {};
        await Promise.all(Object.entries(imageSources).map(([key, src]) => new Promise(resolve => {
          const image = new Image();
          image.onload = () => resolve();
          image.onerror = () => resolve();
          image.src = src;
          images[key] = image;
        })));
        await Promise.all(Object.entries(project.customImages || {}).map(async ([key, item]) => {
          if (!item?.cleanup) return;
          const currentSrc = String(item?.src || '').trim();
          const sourceKey = String(item?.cleanup?.sourceImageKey || item?.cleanup?.sourceImage || '').trim();
          const sourceProjectItem =
            sourceKey && project?.customImages && typeof project.customImages === 'object'
              ? project.customImages[sourceKey]
              : null;
          const sourceSrc = String(
            item?.cleanup?.sourceSrc ||
            item?.cleanup?.sourceImageSrc ||
            sourceProjectItem?.src ||
            '',
          ).trim();
          // Match the editor: if the project already stores a baked cleaned image in item.src,
          // use it as authoritative instead of running cleanup again at runtime.
          if (currentSrc && sourceSrc && currentSrc !== sourceSrc) return;
          try {
            const sourceImage = await BattleSpineRenderer.resolveCleanupSourceImage(images, imageSources, key, item);
            if (!sourceImage?.complete) return;
            images[key] = await BattleSpineRenderer.applySavedImageCleanup(
              sourceImage,
              item.cleanup?.options || item.cleanup,
            );
          } catch (error) {
            console.warn('Failed to apply saved image cleanup for battle renderer', key, error);
          }
        }));
        const materialKeys = new Set(config.materialForegroundImageKeys || []);
        const materialNormalizeOptions = config.materialForegroundNormalizeOptions || {};
        await Promise.all([...materialKeys].map(async (key) => {
          const image = images[key];
          if (!image?.complete) return;
          try {
            images[key] = await BattleSpineRenderer.normalizeForegroundImage(image, materialNormalizeOptions[key] || {});
          } catch (error) {
            console.warn('Failed to normalize material foreground image for battle renderer', key, error);
          }
        }));
        const whiteFlashImages = {};
        await Promise.all(Object.entries(images).map(async ([key, image]) => {
          if (!image?.complete) {
            whiteFlashImages[key] = image;
            return;
          }
          try {
            whiteFlashImages[key] = await BattleSpineRenderer.createWhiteSilhouetteImage(image);
          } catch (error) {
            console.warn('Failed to create white silhouette image for battle renderer', key, error);
            whiteFlashImages[key] = image;
          }
        }));
        return new BattleSpineRenderer(project, images, config, whiteFlashImages);
      }

      static resolveImageSource(src, baseHref = window.location.href) {
        if (typeof src !== 'string' || !src.trim()) return null;
        if (src.startsWith('leg:')) {
          try {
            return new URL(src.slice(4), baseHref).href;
          } catch (_error) {
            return src.slice(4);
          }
        }
        if (/^(data:|blob:|https?:|file:)/i.test(src)) return src;
        try {
          return new URL(src, baseHref).href;
        } catch (_error) {
          return src;
        }
      }

      static imageToImageData(image) {
        const canvas = document.createElement('canvas');
        canvas.width = image.naturalWidth || image.width;
        canvas.height = image.naturalHeight || image.height;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        context.drawImage(image, 0, 0);
        return context.getImageData(0, 0, canvas.width, canvas.height);
      }

      static imageDataToImage(imageData) {
        const canvas = document.createElement('canvas');
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        canvas.getContext('2d').putImageData(imageData, 0, 0);
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('Failed to create image from image data.'));
          image.src = canvas.toDataURL('image/png');
        });
      }

      static loadImageSource(src, baseHref = window.location.href) {
        const resolved = BattleSpineRenderer.resolveImageSource(src, baseHref);
        if (!resolved) return Promise.resolve(null);
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = resolved;
        });
      }

      static cloneImageData(imageData) {
        return new ImageData(new Uint8ClampedArray(imageData.data), imageData.width, imageData.height);
      }

      static hexToRgbColor(hex) {
        const normalized = String(hex || '').trim();
        if (!/^#[0-9a-f]{6}$/i.test(normalized)) return null;
        return [
          parseInt(normalized.slice(1, 3), 16),
          parseInt(normalized.slice(3, 5), 16),
          parseInt(normalized.slice(5, 7), 16),
        ];
      }

      static normalizedImageCleanupOptions(overrides = {}) {
        const source = { ...(overrides || {}) };
        return {
          enabled: source.enabled !== false,
          backgroundMode: ['white', 'magenta', 'custom'].includes(source.backgroundMode)
            ? source.backgroundMode
            : 'white',
          tolerance: Math.max(0, Math.min(255, Math.round(Number(source.tolerance) || 0))),
          customColor: /^#[0-9a-f]{6}$/i.test(String(source.customColor || ''))
            ? String(source.customColor)
            : '#ffffff',
          edgeRepair: source.edgeRepair !== false,
          alphaShrink: source.alphaShrink !== false,
          supersample: source.supersample !== false,
          curveRebuild: source.curveRebuild === true,
        };
      }

      static resolveImageCleanupBackgroundColor(options = {}) {
        const mode = String(options?.backgroundMode || 'white');
        if (mode === 'magenta') return [128, 0, 128];
        if (mode === 'custom') return BattleSpineRenderer.hexToRgbColor(options?.customColor) || [255, 255, 255];
        return [255, 255, 255];
      }

      static colorDistanceToBackground(r, g, b, backgroundColor) {
        const dr = r - backgroundColor[0];
        const dg = g - backgroundColor[1];
        const db = b - backgroundColor[2];
        return Math.sqrt(dr * dr + dg * dg + db * db);
      }

      static backgroundMatchesCleanupColor(r, g, b, backgroundColor, tolerance, mode = 'custom') {
        if (mode === 'white') {
          const threshold = 255 - tolerance;
          return r >= threshold && g >= threshold && b >= threshold;
        }
        return (
          Math.abs(r - backgroundColor[0]) <= tolerance &&
          Math.abs(g - backgroundColor[1]) <= tolerance &&
          Math.abs(b - backgroundColor[2]) <= tolerance
        );
      }

      static fourNeighborIndices(index, width, height) {
        const neighbors = [];
        const x = index % width;
        const y = Math.floor(index / width);
        if (x > 0) neighbors.push(index - 1);
        if (x < width - 1) neighbors.push(index + 1);
        if (y > 0) neighbors.push(index - width);
        if (y < height - 1) neighbors.push(index + width);
        return neighbors;
      }

      static clearImageDataPixel(imageData, index) {
        const offset = index * 4;
        imageData.data[offset] = 0;
        imageData.data[offset + 1] = 0;
        imageData.data[offset + 2] = 0;
        imageData.data[offset + 3] = 0;
      }

      static createOpaqueMask(imageData, alphaThreshold = 16) {
        const mask = new Uint8Array(imageData.width * imageData.height);
        for (let index = 0; index < mask.length; index += 1) {
          mask[index] = imageData.data[index * 4 + 3] >= alphaThreshold ? 1 : 0;
        }
        return mask;
      }

      static averageOpaqueRgbFromImageData(imageData) {
        let totalR = 0;
        let totalG = 0;
        let totalB = 0;
        let count = 0;
        for (let index = 0; index < imageData.width * imageData.height; index += 1) {
          const offset = index * 4;
          if (imageData.data[offset + 3] < 16) continue;
          totalR += imageData.data[offset];
          totalG += imageData.data[offset + 1];
          totalB += imageData.data[offset + 2];
          count += 1;
        }
        if (!count) return [128, 128, 128];
        return [
          Math.round(totalR / count),
          Math.round(totalG / count),
          Math.round(totalB / count),
        ];
      }

      static countTransparentNeighbors(mask, index, width, height) {
        let count = 0;
        BattleSpineRenderer.fourNeighborIndices(index, width, height).forEach((neighbor) => {
          if (!mask[neighbor]) count += 1;
        });
        return count;
      }

      static sampleNearestCleanOpaqueColor(imageData, mask, x, y, backgroundColor, tolerance, mode = 'custom', maxRadius = 8) {
        const { width, height, data } = imageData;
        for (let radius = 1; radius <= maxRadius; radius += 1) {
          for (let py = Math.max(0, y - radius); py <= Math.min(height - 1, y + radius); py += 1) {
            for (let px = Math.max(0, x - radius); px <= Math.min(width - 1, x + radius); px += 1) {
              if (Math.abs(px - x) !== radius && Math.abs(py - y) !== radius) continue;
              const index = py * width + px;
              const offset = index * 4;
              if (!mask[index] || data[offset + 3] < 16) continue;
              if (BattleSpineRenderer.countTransparentNeighbors(mask, index, width, height) > 0) continue;
              const r = data[offset];
              const g = data[offset + 1];
              const b = data[offset + 2];
              if (BattleSpineRenderer.backgroundMatchesCleanupColor(r, g, b, backgroundColor, tolerance, mode)) continue;
              return [r, g, b];
            }
          }
        }
        return null;
      }

      static pushColorAwayFromBackground(color, backgroundColor, fallbackColor) {
        const base = Array.isArray(color) ? color : fallbackColor;
        return [0, 1, 2].map((channel) => {
          const delta = base[channel] - backgroundColor[channel];
          if (Math.abs(delta) >= 26) return base[channel];
          const direction = delta >= 0 ? 1 : -1;
          return Math.max(0, Math.min(255, base[channel] + direction * 48));
        });
      }

      static floodRemoveCornerConnectedBackground(sourceImageData, options = {}) {
        const config = BattleSpineRenderer.normalizedImageCleanupOptions(options);
        const imageData = BattleSpineRenderer.cloneImageData(sourceImageData);
        if (!config.enabled) {
          return {
            imageData,
            backgroundColor: BattleSpineRenderer.resolveImageCleanupBackgroundColor(config),
            options: config,
          };
        }
        const { width, height, data } = imageData;
        const backgroundColor = BattleSpineRenderer.resolveImageCleanupBackgroundColor(config);
        const queue = [];
        const visited = new Uint8Array(width * height);
        const pushIfMatch = (index) => {
          if (visited[index]) return;
          const offset = index * 4;
          if (
            !BattleSpineRenderer.backgroundMatchesCleanupColor(
              data[offset],
              data[offset + 1],
              data[offset + 2],
              backgroundColor,
              config.tolerance,
              config.backgroundMode,
            )
          ) {
            return;
          }
          visited[index] = 1;
          queue.push(index);
        };
        [0, width - 1, (height - 1) * width, height * width - 1].forEach((seed) => {
          if (seed >= 0 && seed < visited.length) pushIfMatch(seed);
        });
        for (let cursor = 0; cursor < queue.length; cursor += 1) {
          const index = queue[cursor];
          BattleSpineRenderer.clearImageDataPixel(imageData, index);
          BattleSpineRenderer.fourNeighborIndices(index, width, height).forEach(pushIfMatch);
        }
        return { imageData, backgroundColor, options: config };
      }

      static detectOpaqueComponentsFromImageData(imageData, minPixels = 1, alphaThreshold = 16) {
        const { width, height } = imageData;
        const mask = BattleSpineRenderer.createOpaqueMask(imageData, alphaThreshold);
        const visited = new Uint8Array(mask.length);
        const components = [];
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index] || visited[index]) continue;
          const pixels = [index];
          visited[index] = 1;
          for (let cursor = 0; cursor < pixels.length; cursor += 1) {
            const current = pixels[cursor];
            BattleSpineRenderer.fourNeighborIndices(current, width, height).forEach((neighbor) => {
              if (!mask[neighbor] || visited[neighbor]) return;
              visited[neighbor] = 1;
              pixels.push(neighbor);
            });
          }
          if (pixels.length < minPixels) {
            pixels.forEach((pixelIndex) => BattleSpineRenderer.clearImageDataPixel(imageData, pixelIndex));
            continue;
          }
          components.push({ pixels, count: pixels.length });
        }
        return components;
      }

      static repairTransparentEdgeBleed(sourceImageData, options = {}) {
        const config = BattleSpineRenderer.normalizedImageCleanupOptions(options);
        const backgroundColor = BattleSpineRenderer.resolveImageCleanupBackgroundColor(config);
        const imageData = BattleSpineRenderer.cloneImageData(sourceImageData);
        const source = BattleSpineRenderer.cloneImageData(sourceImageData);
        const mask = BattleSpineRenderer.createOpaqueMask(source, 8);
        const fallbackColor = BattleSpineRenderer.averageOpaqueRgbFromImageData(source);
        const { width, height } = source;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index] || !BattleSpineRenderer.countTransparentNeighbors(mask, index, width, height)) continue;
          const offset = index * 4;
          const alpha = source.data[offset + 3];
          if (alpha < 8) continue;
          const color = [source.data[offset], source.data[offset + 1], source.data[offset + 2]];
          const polluted =
            BattleSpineRenderer.backgroundMatchesCleanupColor(
              color[0],
              color[1],
              color[2],
              backgroundColor,
              Math.round(config.tolerance * 1.3),
              config.backgroundMode,
            ) ||
            (alpha < 220 &&
              BattleSpineRenderer.colorDistanceToBackground(
                color[0],
                color[1],
                color[2],
                backgroundColor,
              ) <= config.tolerance * 2.4);
          if (!polluted) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          const sampled =
            BattleSpineRenderer.sampleNearestCleanOpaqueColor(
              source,
              mask,
              x,
              y,
              backgroundColor,
              config.tolerance,
              config.backgroundMode,
            ) || BattleSpineRenderer.pushColorAwayFromBackground(color, backgroundColor, fallbackColor);
          imageData.data[offset] = Math.round(color[0] * 0.18 + sampled[0] * 0.82);
          imageData.data[offset + 1] = Math.round(color[1] * 0.18 + sampled[1] * 0.82);
          imageData.data[offset + 2] = Math.round(color[2] * 0.18 + sampled[2] * 0.82);
        }
        return imageData;
      }

      static shrinkAndSmoothAlphaEdge(sourceImageData) {
        const imageData = BattleSpineRenderer.cloneImageData(sourceImageData);
        const source = sourceImageData.data;
        const mask = BattleSpineRenderer.createOpaqueMask(sourceImageData, 8);
        const { width, height } = sourceImageData;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const transparentNeighbors = BattleSpineRenderer.countTransparentNeighbors(mask, index, width, height);
          if (!transparentNeighbors) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          let alphaSum = 0;
          let sampleCount = 0;
          for (let py = Math.max(0, y - 1); py <= Math.min(height - 1, y + 1); py += 1) {
            for (let px = Math.max(0, x - 1); px <= Math.min(width - 1, x + 1); px += 1) {
              alphaSum += source[(py * width + px) * 4 + 3];
              sampleCount += 1;
            }
          }
          const currentAlpha = source[index * 4 + 3];
          const averageAlpha = alphaSum / Math.max(1, sampleCount);
          const targetAlpha = Math.max(0, Math.min(currentAlpha, averageAlpha * (0.88 - transparentNeighbors * 0.06)));
          imageData.data[index * 4 + 3] = targetAlpha < 6
            ? 0
            : Math.round(currentAlpha * 0.55 + targetAlpha * 0.45);
        }
        return imageData;
      }

      static supersampleAlphaEdge(sourceImageData) {
        const imageData = BattleSpineRenderer.cloneImageData(sourceImageData);
        const source = sourceImageData.data;
        const mask = BattleSpineRenderer.createOpaqueMask(sourceImageData, 8);
        const { width, height } = sourceImageData;
        for (let index = 0; index < mask.length; index += 1) {
          if (!mask[index]) continue;
          const transparentNeighbors = BattleSpineRenderer.countTransparentNeighbors(mask, index, width, height);
          if (!transparentNeighbors) continue;
          const x = index % width;
          const y = Math.floor(index / width);
          let coverage = 0;
          let sampleCount = 0;
          for (let py = Math.max(0, y - 1); py <= Math.min(height - 1, y + 1); py += 1) {
            for (let px = Math.max(0, x - 1); px <= Math.min(width - 1, x + 1); px += 1) {
              coverage += source[(py * width + px) * 4 + 3] / 255;
              sampleCount += 1;
            }
          }
          const currentAlpha = source[index * 4 + 3];
          const resampledAlpha = Math.round((coverage / Math.max(1, sampleCount)) * 255);
          imageData.data[index * 4 + 3] = Math.max(
            0,
            Math.min(255, Math.round(currentAlpha * 0.4 + resampledAlpha * 0.6)),
          );
        }
        return imageData;
      }

      static erodeMask(mask, width, height, steps = 1) {
        let current = mask.slice();
        for (let step = 0; step < steps; step += 1) {
          const next = current.slice();
          for (let index = 0; index < current.length; index += 1) {
            if (!current[index]) continue;
            if (BattleSpineRenderer.countTransparentNeighbors(current, index, width, height) > 0) {
              next[index] = 0;
            }
          }
          current = next;
        }
        return current;
      }

      static rebuildCurveEdges(sourceImageData, options = {}) {
        const config = BattleSpineRenderer.normalizedImageCleanupOptions(options);
        const backgroundColor = BattleSpineRenderer.resolveImageCleanupBackgroundColor(config);
        const oldMask = BattleSpineRenderer.createOpaqueMask(sourceImageData, 16);
        const closedMask = BattleSpineRenderer.erodeMask(
          BattleSpineRenderer.dilateMask(oldMask, sourceImageData.width, sourceImageData.height, 1),
          sourceImageData.width,
          sourceImageData.height,
          1,
        );
        const rebuiltMask = BattleSpineRenderer.dilateMask(
          BattleSpineRenderer.erodeMask(closedMask, sourceImageData.width, sourceImageData.height, 1),
          sourceImageData.width,
          sourceImageData.height,
          1,
        );
        const output = BattleSpineRenderer.cloneImageData(sourceImageData);
        const fallbackColor = BattleSpineRenderer.averageOpaqueRgbFromImageData(sourceImageData);
        for (let index = 0; index < rebuiltMask.length; index += 1) {
          if (!rebuiltMask[index]) {
            BattleSpineRenderer.clearImageDataPixel(output, index);
            continue;
          }
          if (oldMask[index]) continue;
          const x = index % sourceImageData.width;
          const y = Math.floor(index / sourceImageData.width);
          const sampled =
            BattleSpineRenderer.sampleNearestCleanOpaqueColor(
              sourceImageData,
              oldMask,
              x,
              y,
              backgroundColor,
              config.tolerance,
              config.backgroundMode,
            ) || fallbackColor;
          const offset = index * 4;
          output.data[offset] = sampled[0];
          output.data[offset + 1] = sampled[1];
          output.data[offset + 2] = sampled[2];
          output.data[offset + 3] = 220;
        }
        return BattleSpineRenderer.supersampleAlphaEdge(
          BattleSpineRenderer.shrinkAndSmoothAlphaEdge(output),
        );
      }

      static preprocessImportedImageData(sourceImageData, options = {}) {
        const config = BattleSpineRenderer.normalizedImageCleanupOptions(options);
        let imageData = BattleSpineRenderer.cloneImageData(sourceImageData);
        if (config.enabled) {
          imageData = BattleSpineRenderer.floodRemoveCornerConnectedBackground(imageData, config).imageData;
          if (config.edgeRepair) imageData = BattleSpineRenderer.repairTransparentEdgeBleed(imageData, config);
          if (config.alphaShrink) imageData = BattleSpineRenderer.shrinkAndSmoothAlphaEdge(imageData);
          if (config.supersample) imageData = BattleSpineRenderer.supersampleAlphaEdge(imageData);
          if (config.curveRebuild) imageData = BattleSpineRenderer.rebuildCurveEdges(imageData, config);
        }
        for (let index = 0; index < imageData.width * imageData.height; index += 1) {
          if (imageData.data[index * 4 + 3] < 6) {
            BattleSpineRenderer.clearImageDataPixel(imageData, index);
          }
        }
        return {
          imageData,
          components: BattleSpineRenderer.detectOpaqueComponentsFromImageData(imageData, 1, 16),
        };
      }

      static async applySavedImageCleanup(image, options = {}) {
        const processed = BattleSpineRenderer.preprocessImportedImageData(
          BattleSpineRenderer.imageToImageData(image),
          options,
        );
        return BattleSpineRenderer.imageDataToImage(processed.imageData);
      }

      static async resolveCleanupSourceImage(images, imageSources, key, item) {
        const sourceKey = String(item?.cleanup?.sourceImageKey || item?.cleanup?.sourceImage || '').trim();
        if (sourceKey && sourceKey !== key && images[sourceKey]) return images[sourceKey];
        if (sourceKey && imageSources[sourceKey] && images[sourceKey]) return images[sourceKey];
        const sourceSrc = String(item?.cleanup?.sourceSrc || item?.cleanup?.sourceImageSrc || '').trim();
        if (sourceSrc) return BattleSpineRenderer.loadImageSource(sourceSrc);
        return images[key];
      }

      static createWhiteSilhouetteImage(image, options = {}) {
        const alphaThreshold = Number.isFinite(Number(options.alphaThreshold))
          ? Number(options.alphaThreshold)
          : 8;
        const imageData = BattleSpineRenderer.imageToImageData(image);
        const pixels = imageData.data;
        for (let offset = 0; offset < pixels.length; offset += 4) {
          const alpha = pixels[offset + 3] > alphaThreshold ? 255 : 0;
          pixels[offset] = 255;
          pixels[offset + 1] = 255;
          pixels[offset + 2] = 255;
          pixels[offset + 3] = alpha;
        }
        return BattleSpineRenderer.imageDataToImage(imageData);
      }

      static materialColorDistance(background, r, g, b) {
        const dr = r - background[0];
        const dg = g - background[1];
        const db = b - background[2];
        return Math.sqrt(dr * dr + dg * dg + db * db);
      }

      static estimateMaterialBackground(imageData) {
        const { width, height, data } = imageData;
        const samples = [];
        const push = (x, y) => {
          const offset = (y * width + x) * 4;
          if (data[offset + 3] < 8) return;
          samples.push([data[offset], data[offset + 1], data[offset + 2]]);
        };
        for (let x = 0; x < width; x += 1) {
          push(x, 0);
          push(x, height - 1);
        }
        for (let y = 1; y < height - 1; y += 1) {
          push(0, y);
          push(width - 1, y);
        }
        if (!samples.length) return [255, 255, 255];
        return [0, 1, 2].map((channel) => {
          const sorted = samples.map((sample) => sample[channel]).sort((a, b) => a - b);
          return sorted[Math.floor(sorted.length / 2)] || 255;
        });
      }

      static maskPixelCount(mask) {
        let count = 0;
        for (let index = 0; index < mask.length; index += 1) {
          count += mask[index] ? 1 : 0;
        }
        return count;
      }

      static dilateMask(mask, width, height, steps, limitMask = null) {
        let current = mask.slice();
        for (let step = 0; step < steps; step += 1) {
          const next = current.slice();
          for (let index = 0; index < current.length; index += 1) {
            if (!current[index]) continue;
            const x = index % width;
            const y = Math.floor(index / width);
            if (x > 0 && (!limitMask || limitMask[index - 1])) next[index - 1] = 1;
            if (x < width - 1 && (!limitMask || limitMask[index + 1])) next[index + 1] = 1;
            if (y > 0 && (!limitMask || limitMask[index - width])) next[index - width] = 1;
            if (y < height - 1 && (!limitMask || limitMask[index + width])) next[index + width] = 1;
          }
          current = next;
        }
        return current;
      }

      static createMaterialForegroundMask(imageData, options = {}) {
        const backgroundTolerance = Number.isFinite(Number(options.backgroundTolerance))
          ? Number(options.backgroundTolerance)
          : 45;
        const useBrightShortcut = !options.ignoreBrightBackgroundShortcut;
        const brightBgR = Number.isFinite(Number(options.brightBackgroundR))
          ? Number(options.brightBackgroundR)
          : 235;
        const brightBgG = Number.isFinite(Number(options.brightBackgroundG))
          ? Number(options.brightBackgroundG)
          : 232;
        const brightBgB = Number.isFinite(Number(options.brightBackgroundB))
          ? Number(options.brightBackgroundB)
          : 228;
        const strongBrightBgR = Number.isFinite(Number(options.strongBrightBackgroundR))
          ? Number(options.strongBrightBackgroundR)
          : 244;
        const strongBrightBgG = Number.isFinite(Number(options.strongBrightBackgroundG))
          ? Number(options.strongBrightBackgroundG)
          : 241;
        const strongBrightBgB = Number.isFinite(Number(options.strongBrightBackgroundB))
          ? Number(options.strongBrightBackgroundB)
          : 238;
        const { width, height, data } = imageData;
        const background = BattleSpineRenderer.estimateMaterialBackground(imageData);
        const count = width * height;
        const edgeBackground = new Uint8Array(count);
        const candidateBackground = new Uint8Array(count);
        const strongBackground = new Uint8Array(count);
        const queue = [];
        let cursor = 0;

        function backgroundDistance(index) {
          const offset = index * 4;
          return BattleSpineRenderer.materialColorDistance(
            background,
            data[offset],
            data[offset + 1],
            data[offset + 2],
          );
        }

        function isBackground(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return (
            backgroundDistance(index) <= backgroundTolerance ||
            (useBrightShortcut && r >= brightBgR && g >= brightBgG && b >= brightBgB)
          );
        }

        function isStrongBackground(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < 8) return true;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return (
            backgroundDistance(index) <= backgroundTolerance * 0.65 ||
            (useBrightShortcut && r >= strongBrightBgR && g >= strongBrightBgG && b >= strongBrightBgB)
          );
        }

        function push(index) {
          if (edgeBackground[index]) return;
          edgeBackground[index] = 1;
          queue.push(index);
        }

        for (let index = 0; index < count; index += 1) {
          candidateBackground[index] = isBackground(index) ? 1 : 0;
          strongBackground[index] = isStrongBackground(index) ? 1 : 0;
        }

        for (let x = 0; x < width; x += 1) {
          const top = x;
          const bottom = (height - 1) * width + x;
          if (candidateBackground[top]) push(top);
          if (candidateBackground[bottom]) push(bottom);
        }
        for (let y = 0; y < height; y += 1) {
          const left = y * width;
          const right = y * width + width - 1;
          if (candidateBackground[left]) push(left);
          if (candidateBackground[right]) push(right);
        }

        while (cursor < queue.length) {
          const index = queue[cursor++];
          const x = index % width;
          const y = Math.floor(index / width);
          if (x > 0 && !edgeBackground[index - 1] && candidateBackground[index - 1]) push(index - 1);
          if (x < width - 1 && !edgeBackground[index + 1] && candidateBackground[index + 1]) push(index + 1);
          if (y > 0 && !edgeBackground[index - width] && candidateBackground[index - width]) push(index - width);
          if (y < height - 1 && !edgeBackground[index + width] && candidateBackground[index + width]) push(index + width);
        }

        let holeBackground = new Uint8Array(count);
        const holeSeen = new Uint8Array(count);
        const minHolePixels = Math.max(24, Math.round(count * 0.00008));
        for (let index = 0; index < count; index += 1) {
          if (!strongBackground[index] || edgeBackground[index] || holeSeen[index]) continue;
          const region = [index];
          holeSeen[index] = 1;
          let touchesEdge = false;
          for (let regionCursor = 0; regionCursor < region.length; regionCursor += 1) {
            const current = region[regionCursor];
            const x = current % width;
            const y = Math.floor(current / width);
            if (x === 0 || y === 0 || x === width - 1 || y === height - 1) touchesEdge = true;
            if (x > 0 && strongBackground[current - 1] && !edgeBackground[current - 1] && !holeSeen[current - 1]) {
              holeSeen[current - 1] = 1;
              region.push(current - 1);
            }
            if (x < width - 1 && strongBackground[current + 1] && !edgeBackground[current + 1] && !holeSeen[current + 1]) {
              holeSeen[current + 1] = 1;
              region.push(current + 1);
            }
            if (y > 0 && strongBackground[current - width] && !edgeBackground[current - width] && !holeSeen[current - width]) {
              holeSeen[current - width] = 1;
              region.push(current - width);
            }
            if (y < height - 1 && strongBackground[current + width] && !edgeBackground[current + width] && !holeSeen[current + width]) {
              holeSeen[current + width] = 1;
              region.push(current + width);
            }
          }
          if (touchesEdge || region.length < minHolePixels) continue;
          region.forEach((pixelIndex) => {
            holeBackground[pixelIndex] = 1;
          });
        }
        if (BattleSpineRenderer.maskPixelCount(holeBackground)) {
          holeBackground = BattleSpineRenderer.dilateMask(holeBackground, width, height, 1, candidateBackground);
        }

        const foreground = new Uint8Array(count);
        for (let index = 0; index < count; index += 1) {
          foreground[index] =
            edgeBackground[index] || holeBackground[index] || data[index * 4 + 3] < 8
              ? 0
              : 1;
        }
        return foreground;
      }

      static async normalizeForegroundImage(image, options = {}) {
        const imageData = BattleSpineRenderer.imageToImageData(image);
        const foreground = BattleSpineRenderer.createMaterialForegroundMask(imageData, options);
        const output = new ImageData(imageData.width, imageData.height);
        for (let index = 0; index < foreground.length; index += 1) {
          if (!foreground[index]) continue;
          const offset = index * 4;
          output.data[offset] = imageData.data[offset];
          output.data[offset + 1] = imageData.data[offset + 1];
          output.data[offset + 2] = imageData.data[offset + 2];
          output.data[offset + 3] = imageData.data[offset + 3];
        }
        if (options.trimEdgeFringe) {
          BattleSpineRenderer.trimEdgeFringe(output, imageData, options);
        }
        if (options.removeConnectedBackgroundFringe) {
          BattleSpineRenderer.removeConnectedBackgroundFringe(output, imageData, options);
        }
        if (options.removeDarkGuideLine) {
          BattleSpineRenderer.removeDarkGuideLine(output, options);
        }
        return BattleSpineRenderer.imageDataToImage(output);
      }

      static trimEdgeFringe(outputImageData, sourceImageData, options = {}) {
        const { width, height, data } = outputImageData;
        const sourceData = sourceImageData?.data || data;
        const background = BattleSpineRenderer.estimateMaterialBackground(sourceImageData || outputImageData);
        const fringeDistanceThreshold = Number.isFinite(Number(options.fringeDistanceThreshold))
          ? Number(options.fringeDistanceThreshold)
          : 36;
        const transparentNeighborCount = Number.isFinite(Number(options.fringeTransparentNeighborCount))
          ? Number(options.fringeTransparentNeighborCount)
          : 3;
        const fringeMinBrightness = Number.isFinite(Number(options.fringeMinBrightness))
          ? Number(options.fringeMinBrightness)
          : 0;
        const fringeNeutralThreshold = Number.isFinite(Number(options.fringeNeutralThreshold))
          ? Number(options.fringeNeutralThreshold)
          : 255;

        for (let y = 1; y < height - 1; y += 1) {
          for (let x = 1; x < width - 1; x += 1) {
            const index = y * width + x;
            const offset = index * 4;
            if (data[offset + 3] < 8) continue;

            let transparentNeighbors = 0;
            for (let ny = -1; ny <= 1; ny += 1) {
              for (let nx = -1; nx <= 1; nx += 1) {
                if (nx === 0 && ny === 0) continue;
                const neighborIndex = ((y + ny) * width + (x + nx)) * 4;
                if (data[neighborIndex + 3] < 8) transparentNeighbors += 1;
              }
            }
            if (transparentNeighbors < transparentNeighborCount) continue;

            const distance = BattleSpineRenderer.materialColorDistance(
              background,
              sourceData[offset],
              sourceData[offset + 1],
              sourceData[offset + 2],
            );
            if (distance > fringeDistanceThreshold) continue;
            const r = sourceData[offset];
            const g = sourceData[offset + 1];
            const b = sourceData[offset + 2];
            const brightness = (r + g + b) / 3;
            const neutralSpread = Math.max(r, g, b) - Math.min(r, g, b);
            if (brightness < fringeMinBrightness) continue;
            if (neutralSpread > fringeNeutralThreshold) continue;

            data[offset + 3] = 0;
          }
        }
      }

      static removeConnectedBackgroundFringe(outputImageData, sourceImageData, options = {}) {
        const { width, height, data } = outputImageData;
        const sourceData = sourceImageData?.data || data;
        const background = BattleSpineRenderer.estimateMaterialBackground(sourceImageData || outputImageData);
        const count = width * height;
        const seen = new Uint8Array(count);
        const distanceThreshold = Number.isFinite(Number(options.connectedFringeDistanceThreshold))
          ? Number(options.connectedFringeDistanceThreshold)
          : 68;
        const minBrightness = Number.isFinite(Number(options.connectedFringeMinBrightness))
          ? Number(options.connectedFringeMinBrightness)
          : 150;
        const neutralThreshold = Number.isFinite(Number(options.connectedFringeNeutralThreshold))
          ? Number(options.connectedFringeNeutralThreshold)
          : 62;
        const maxRegionPixels = Number.isFinite(Number(options.connectedFringeMaxRegionPixels))
          ? Number(options.connectedFringeMaxRegionPixels)
          : 1400;

        function isTransparent(index) {
          return data[index * 4 + 3] < 8;
        }

        function isCandidate(index) {
          const offset = index * 4;
          if (data[offset + 3] < 8) return false;
          const r = sourceData[offset];
          const g = sourceData[offset + 1];
          const b = sourceData[offset + 2];
          const brightness = (r + g + b) / 3;
          const neutralSpread = Math.max(r, g, b) - Math.min(r, g, b);
          if (brightness < minBrightness) return false;
          if (neutralSpread > neutralThreshold) return false;
          const distance = BattleSpineRenderer.materialColorDistance(background, r, g, b);
          return distance <= distanceThreshold;
        }

        function hasTransparentNeighbor(x, y) {
          for (let ny = -1; ny <= 1; ny += 1) {
            for (let nx = -1; nx <= 1; nx += 1) {
              if (nx === 0 && ny === 0) continue;
              const px = x + nx;
              const py = y + ny;
              if (px < 0 || py < 0 || px >= width || py >= height) return true;
              if (isTransparent(py * width + px)) return true;
            }
          }
          return false;
        }

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const startIndex = y * width + x;
            if (seen[startIndex] || !isCandidate(startIndex) || !hasTransparentNeighbor(x, y)) continue;

            const queue = [startIndex];
            const region = [];
            seen[startIndex] = 1;

            for (let cursor = 0; cursor < queue.length; cursor += 1) {
              const current = queue[cursor];
              region.push(current);
              if (region.length > maxRegionPixels) break;
              const cx = current % width;
              const cy = Math.floor(current / width);
              for (let ny = -1; ny <= 1; ny += 1) {
                for (let nx = -1; nx <= 1; nx += 1) {
                  if (nx === 0 && ny === 0) continue;
                  const px = cx + nx;
                  const py = cy + ny;
                  if (px < 0 || py < 0 || px >= width || py >= height) continue;
                  const nextIndex = py * width + px;
                  if (seen[nextIndex] || !isCandidate(nextIndex)) continue;
                  seen[nextIndex] = 1;
                  queue.push(nextIndex);
                }
              }
            }

            if (region.length > maxRegionPixels) continue;
            region.forEach((index) => {
              data[index * 4 + 3] = 0;
            });
          }
        }
      }

      static removeDarkGuideLine(imageData, options = {}) {
        const { width, height, data } = imageData;
        const count = width * height;
        const visited = new Uint8Array(count);
        const alphaThreshold = Number.isFinite(Number(options.guideAlphaThreshold))
          ? Number(options.guideAlphaThreshold)
          : 28;
        const darkThreshold = Number.isFinite(Number(options.guideDarkThreshold))
          ? Number(options.guideDarkThreshold)
          : 52;
        const maxComponentWidth = Number.isFinite(Number(options.guideMaxWidth))
          ? Number(options.guideMaxWidth)
          : Math.max(12, Math.round(width * 0.18));
        const maxComponentX = Number.isFinite(Number(options.guideMaxX))
          ? Number(options.guideMaxX)
          : Math.max(18, Math.round(width * 0.24));
        const minComponentHeight = Number.isFinite(Number(options.guideMinHeight))
          ? Number(options.guideMinHeight)
          : Math.max(48, Math.round(height * 0.35));

        function isDarkGuidePixel(index) {
          const offset = index * 4;
          const alpha = data[offset + 3];
          if (alpha < alphaThreshold) return false;
          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];
          return Math.max(r, g, b) <= darkThreshold;
        }

        for (let index = 0; index < count; index += 1) {
          if (visited[index] || !isDarkGuidePixel(index)) continue;
          const queue = [index];
          const component = [];
          visited[index] = 1;
          let minX = width;
          let maxX = 0;
          let minY = height;
          let maxY = 0;

          for (let cursor = 0; cursor < queue.length; cursor += 1) {
            const current = queue[cursor];
            component.push(current);
            const x = current % width;
            const y = Math.floor(current / width);
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);

            const neighbors = [];
            if (x > 0) neighbors.push(current - 1);
            if (x < width - 1) neighbors.push(current + 1);
            if (y > 0) neighbors.push(current - width);
            if (y < height - 1) neighbors.push(current + width);

            neighbors.forEach((neighbor) => {
              if (visited[neighbor] || !isDarkGuidePixel(neighbor)) return;
              visited[neighbor] = 1;
              queue.push(neighbor);
            });
          }

          const componentWidth = maxX - minX + 1;
          const componentHeight = maxY - minY + 1;
          const isGuideLine =
            componentWidth <= maxComponentWidth &&
            minX <= maxComponentX &&
            componentHeight >= minComponentHeight;

          if (!isGuideLine) continue;
          component.forEach((pixelIndex) => {
            data[pixelIndex * 4 + 3] = 0;
          });
        }
      }

      findAction(id) {
        if (id == null) return null;
        return this.actionById.get(String(id)) || null;
      }

      findActionByName(name) {
        if (name == null) return null;
        return this.actionByName.get(String(name)) || null;
      }

      findPreferredAction(ids = [], names = []) {
        for (const id of ids) {
          const action = this.findAction(id);
          if (action) return action;
        }
        for (const name of names) {
          const action = this.findActionByName(name);
          if (action) return action;
        }
        return null;
      }

      getNodeById(nodeId) {
        if (nodeId == null) return null;
        return this.nodeById.get(String(nodeId)) || null;
      }

      getBoneNodeById(nodeId) {
        const node = this.getNodeById(nodeId);
        return node && !node.attachment ? node : null;
      }

      getSortedTimelineKeys(action, nodeId) {
        const normalizedNodeId = nodeId == null ? '' : String(nodeId);
        if (!normalizedNodeId) return [];
        if (action && typeof action === 'object') {
          let actionCache = this.timelineKeyCache.get(action);
          if (!actionCache) {
            actionCache = new Map();
            this.timelineKeyCache.set(action, actionCache);
          }
          if (!actionCache.has(normalizedNodeId)) {
            actionCache.set(
              normalizedNodeId,
              [...((action?.timelines || {})[normalizedNodeId] || [])].sort((a, b) => a.frame - b.frame),
            );
          }
          return actionCache.get(normalizedNodeId);
        }
        if (!this.projectTimelineKeyCache.has(normalizedNodeId)) {
          this.projectTimelineKeyCache.set(normalizedNodeId, []);
        }
        return this.projectTimelineKeyCache.get(normalizedNodeId);
      }

      attachmentImageVariants(attachmentView = {}) {
        const imageVariants = Array.isArray(attachmentView?.imageVariants) ? attachmentView.imageVariants : [];
        const images = [attachmentView?.image, ...imageVariants]
          .map((value) => String(value || '').trim())
          .filter(Boolean);
        return [...new Set(images)];
      }

      attachmentImageKeys(node, action) {
        return this.getSortedTimelineKeys(action, node?.id).filter(
          (item) => typeof item?.attachmentImage === 'string' && item.attachmentImage,
        );
      }

      getAttachmentImageForFrame(node, action, frame) {
        const attachment = node?.attachment;
        if (!attachment) return '';
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && frameState.attachmentImageByNode?.has(cacheKey)) {
          return frameState.attachmentImageByNode.get(cacheKey);
        }
        const defaultImage = String(attachment.image || '');
        const variants = this.attachmentImageVariants(attachment);
        const keys = this.attachmentImageKeys(node, action)
          .filter((item) => item.frame <= frame)
          .sort((a, b) => a.frame - b.frame);
        const replacement = keys.length ? String(keys[keys.length - 1].attachmentImage || '') : '';
        const imageKey = replacement && (!variants.length || variants.includes(replacement)) ? replacement : defaultImage;
        if (cacheKey) {
          frameState.attachmentImageByNode.set(cacheKey, imageKey);
        }
        return imageKey;
      }

      beginRenderFrame(action, frame) {
        const frameKey = Math.round((Number(frame) || 0) * 1000) / 1000;
        const actionKey = action?.id != null
          ? `id:${String(action.id)}`
          : action?.name != null
            ? `name:${String(action.name)}`
            : '__default__';
        if (
          this.renderFrameState &&
          this.renderFrameState.actionKey === actionKey &&
          this.renderFrameState.frameKey === frameKey
        ) {
          return this.renderFrameState;
        }
        this.renderFrameState = {
          action,
          actionKey,
          frameKey,
          localPoseByNode: new Map(),
          worldPoseByNode: new Map(),
          effectiveParentByNode: new Map(),
          visibilityByNode: new Map(),
          attachmentAlphaByNode: new Map(),
          attachmentImageByNode: new Map(),
          attachmentSegmentsByNode: new Map(),
          bowRigByControlNode: new Map(),
          renderableAttachmentNodes: null,
        };
        return this.renderFrameState;
      }

      getRenderableAttachmentNodes(action, frame) {
        const frameState = this.beginRenderFrame(action, frame);
        if (Array.isArray(frameState.renderableAttachmentNodes)) {
          return frameState.renderableAttachmentNodes;
        }
        frameState.renderableAttachmentNodes = this.attachmentNodes
          .filter(node => this.isNodeVisibleAtFrame(node, action, frame))
          .slice()
          .sort((a, b) => {
            const layerDiff = (a.attachment.layer || 0) - (b.attachment.layer || 0);
            return layerDiff || this.effectiveAttachmentAlphaForNode(a, action, frame) - this.effectiveAttachmentAlphaForNode(b, action, frame);
          });
        return frameState.renderableAttachmentNodes;
      }

      getAttachmentSourceGrid(image, cols, rows) {
        if (!image) return [];
        let imageCache = this.attachmentSourceGridCache.get(image);
        if (!imageCache) {
          imageCache = new Map();
          this.attachmentSourceGridCache.set(image, imageCache);
        }
        const cacheKey = `${cols}x${rows}`;
        if (!imageCache.has(cacheKey)) {
          const source = [];
          for (let row = 0; row <= rows; row += 1) {
            const v = row / rows;
            const sourceRow = [];
            for (let col = 0; col <= cols; col += 1) {
              const u = col / cols;
              sourceRow.push({ x: image.width * u, y: image.height * v });
            }
            source.push(sourceRow);
          }
          imageCache.set(cacheKey, source);
        }
        return imageCache.get(cacheKey);
      }

      clampFrame(frame, duration = this.project.duration ?? 29) {
        return Math.max(0, Math.min(duration, Math.round(Number(frame) || 0)));
      }

      normalizeArrowVisibilityTrack(track, duration = this.project.duration ?? 29) {
        if (!Array.isArray(track)) return [];
        return track
          .map((item) => ({
            frame: this.clampFrame(item?.frame, duration),
            visible: Boolean(item?.visible),
          }))
          .sort((a, b) => a.frame - b.frame)
          .filter((item, index, array) => index === array.findIndex((entry) => entry.frame === item.frame));
      }

      normalizeArrowParentTrack(track, duration = this.project.duration ?? 29) {
        if (!Array.isArray(track)) return [];
        const byFrame = new Map();
        track.forEach((item) => {
          const frame = this.clampFrame(item?.frame, duration);
          byFrame.set(frame, {
            frame,
            parentId: item?.parentId ? String(item.parentId) : null,
          });
        });
        return [...byFrame.values()].sort((a, b) => a.frame - b.frame);
      }

      getArrowVisibilityTrackMap(action) {
        const source =
          action && typeof action.arrowVisibilityTracks === 'object'
            ? action.arrowVisibilityTracks
            : this.project.arrowVisibilityTracks;
        return source && typeof source === 'object' ? source : {};
      }

      getArrowParentTrackMap(action) {
        const source =
          action && typeof action.arrowParentTracks === 'object'
            ? action.arrowParentTracks
            : this.project.arrowParentTracks;
        return source && typeof source === 'object' ? source : {};
      }

      normalizeSlashFxVisibilityTrack(track, duration = this.project.duration ?? 29) {
        if (!Array.isArray(track)) return [];
        return track
          .map((item) => ({
            frame: this.clampFrame(item?.frame, duration),
            visible: Boolean(item?.visible),
          }))
          .sort((a, b) => a.frame - b.frame)
          .filter((item, index, array) => index === array.findIndex((entry) => entry.frame === item.frame));
      }

      normalizeSlashFxParentTrack(track, duration = this.project.duration ?? 29) {
        if (!Array.isArray(track)) return [];
        const byFrame = new Map();
        track.forEach((item) => {
          const frame = this.clampFrame(item?.frame, duration);
          byFrame.set(frame, {
            frame,
            parentId: item?.parentId ? String(item.parentId) : null,
          });
        });
        return [...byFrame.values()].sort((a, b) => a.frame - b.frame);
      }

      getSlashFxVisibilityTrackMap(action) {
        const source =
          action && typeof action.slashFxVisibilityTracks === 'object'
            ? action.slashFxVisibilityTracks
            : this.project.slashFxVisibilityTracks;
        return source && typeof source === 'object' ? source : {};
      }

      getSlashFxParentTrackMap(action) {
        const source =
          action && typeof action.slashFxParentTracks === 'object'
            ? action.slashFxParentTracks
            : this.project.slashFxParentTracks;
        return source && typeof source === 'object' ? source : {};
      }

      getSlashFxActionHiddenMap(action) {
        const source =
          action && typeof action.slashFxActionHiddenMap === 'object'
            ? action.slashFxActionHiddenMap
            : this.project.slashFxActionHiddenMap;
        return source && typeof source === 'object' ? source : {};
      }

      isArrowPieceNode(node) {
        return Boolean(node?.attachment && node?.role === 'arrow-piece');
      }

      isSlashFxPieceNode(node) {
        return Boolean(node?.attachment && node?.role === 'slash-fx-piece');
      }

      arrowCarrierBoneForPiece(piece) {
        const parentBoneId = piece?.attachment?.restPart?.parentBoneId
          ? String(piece.attachment.restPart.parentBoneId)
          : null;
        if (parentBoneId) {
          return this.getBoneNodeById(parentBoneId);
        }
        const skinBoneId = piece?.attachment?.skinBoneIds?.[0] ? String(piece.attachment.skinBoneIds[0]) : null;
        if (skinBoneId) {
          return this.getBoneNodeById(skinBoneId);
        }
        return null;
      }

      arrowPieceForNode(node) {
        if (this.isArrowPieceNode(node)) return node;
        if (!node || node.attachment) return null;
        return (
          this.nodes.find(
            (piece) => piece.role === 'arrow-piece' && this.arrowCarrierBoneForPiece(piece)?.id === node.id,
          ) || null
        );
      }

      slashFxCarrierBoneForPiece(piece) {
        const parentBoneId = piece?.attachment?.restPart?.parentBoneId
          ? String(piece.attachment.restPart.parentBoneId)
          : null;
        if (parentBoneId) {
          return this.getBoneNodeById(parentBoneId);
        }
        const skinBoneId = piece?.attachment?.skinBoneIds?.[0] ? String(piece.attachment.skinBoneIds[0]) : null;
        if (skinBoneId) {
          return this.getBoneNodeById(skinBoneId);
        }
        return null;
      }

      slashFxPieceForNode(node) {
        if (this.isSlashFxPieceNode(node)) return node;
        if (!node || node.attachment) return null;
        return (
          this.nodes.find(
            (piece) => piece.role === 'slash-fx-piece' && this.slashFxCarrierBoneForPiece(piece)?.id === node.id,
          ) || null
        );
      }

      isSlashFxHiddenForAction(piece, action) {
        return Boolean(piece?.id && this.getSlashFxActionHiddenMap(action)?.[piece.id]);
      }

      arrowGripLocalForPiece(piece) {
        const attachment = piece?.attachment;
        const restPart = attachment?.restPart;
        const image = this.images[attachment?.image];
        const width = Math.max(1, image?.naturalWidth || image?.width || 0);
        const height = Math.max(1, image?.naturalHeight || image?.height || 0);
        if (!restPart || !width || !height) return null;
        const candidates =
          width >= height
            ? [
                { x: 0, y: height * 0.5 },
                { x: width, y: height * 0.5 },
              ]
            : [
                { x: width * 0.5, y: 0 },
                { x: width * 0.5, y: height },
              ];
        let best = null;
        candidates.forEach((candidate) => {
          const local = this.imagePointToFullSkinRest(candidate, image, restPart);
          const distance = Math.hypot(local.x, local.y);
          if (!best || distance < best.distance) best = { x: local.x, y: local.y, distance };
        });
        return best ? { x: best.x, y: best.y } : null;
      }

      slashFxGripLocalForPiece(piece, action = null, frame = 0) {
        const attachment = piece?.attachment;
        const restPart = attachment?.restPart;
        const imageKey = this.getAttachmentImageForFrame(piece, action, frame);
        const image = this.images[imageKey];
        const width = Math.max(1, image?.naturalWidth || image?.width || 0);
        const height = Math.max(1, image?.naturalHeight || image?.height || 0);
        if (!restPart || !width || !height) return null;
        const candidates =
          width >= height
            ? [
                { x: 0, y: height * 0.5 },
                { x: width, y: height * 0.5 },
              ]
            : [
                { x: width * 0.5, y: 0 },
                { x: width * 0.5, y: height },
              ];
        let best = null;
        candidates.forEach((candidate) => {
          const local = this.imagePointToFullSkinRest(candidate, image, restPart);
          const distance = Math.hypot(local.x, local.y);
          if (!best || distance < best.distance) best = { x: local.x, y: local.y, distance };
        });
        return best ? { x: best.x, y: best.y } : null;
      }

      legacyArrowVisibilityTrackForPiece(piece, action) {
        const duration = action?.duration ?? this.project.duration ?? 29;
        const bone = this.arrowCarrierBoneForPiece(piece);
        const pieceTrack = this.normalizeArrowVisibilityTrack(
          ((action?.timelines || {})[piece?.id] || []).filter((item) => typeof item?.visible === 'boolean'),
          duration,
        );
        if (pieceTrack.length) return pieceTrack;
        return this.normalizeArrowVisibilityTrack(
          ((action?.timelines || {})[bone?.id] || []).filter((item) => typeof item?.visible === 'boolean'),
          duration,
        );
      }

      arrowVisibilityAtFrame(piece, action, frame) {
        if (!piece) return true;
        const duration = action?.duration ?? this.project.duration ?? 29;
        const track = this.normalizeArrowVisibilityTrack(
          this.getArrowVisibilityTrackMap(action)?.[piece.id],
          duration,
        );
        const effectiveTrack = track.length ? track : this.legacyArrowVisibilityTrackForPiece(piece, action);
        if (!effectiveTrack.length) return true;
        const previous = [...effectiveTrack].reverse().find((item) => item.frame <= frame);
        if (previous) return previous.visible;
        return !effectiveTrack[0].visible;
      }

      arrowParentAtFrame(piece, action, frame) {
        if (!piece) return null;
        const duration = action?.duration ?? this.project.duration ?? 29;
        const track = this.normalizeArrowParentTrack(this.getArrowParentTrackMap(action)?.[piece.id], duration);
        const previous = [...track].reverse().find((item) => item.frame <= frame);
        return previous?.parentId || null;
      }

      arrowParentChangeBetweenFrames(piece, action, startFrame, endFrame) {
        if (!piece) return null;
        const duration = action?.duration ?? this.project.duration ?? 29;
        return (
          this.normalizeArrowParentTrack(this.getArrowParentTrackMap(action)?.[piece.id], duration).find(
            (item) => item.frame > startFrame && item.frame <= endFrame,
          ) || null
        );
      }

      slashFxVisibilityAtFrame(piece, action, frame) {
        if (!piece) return false;
        if (this.isSlashFxHiddenForAction(piece, action)) return false;
        const duration = action?.duration ?? this.project.duration ?? 29;
        const track = this.normalizeSlashFxVisibilityTrack(
          this.getSlashFxVisibilityTrackMap(action)?.[piece.id],
          duration,
        );
        if (!track.length) return false;
        const previous = [...track].reverse().find((item) => item.frame <= frame);
        return previous ? previous.visible : false;
      }

      slashFxAlphaAtFrame(piece, action, frame) {
        if (!piece) return 0;
        if (this.isSlashFxHiddenForAction(piece, action)) return 0;
        const duration = action?.duration ?? this.project.duration ?? 29;
        const track = this.normalizeSlashFxVisibilityTrack(
          this.getSlashFxVisibilityTrackMap(action)?.[piece.id],
          duration,
        );
        if (!track.length) return 0;
        const appearFadeFrames = 2;
        const disappearFadeFrames = 5;
        const previous = [...track].reverse().find((item) => item.frame <= frame);
        const entryBeforePrevious = previous ? [...track].reverse().find((item) => item.frame < previous.frame) : null;
        if (previous && !previous.visible && entryBeforePrevious?.visible && frame <= previous.frame + disappearFadeFrames) {
          const fadeT = Math.max(0, Math.min(1, (frame - previous.frame) / disappearFadeFrames));
          return 1 - fadeT;
        }
        const next = track.find((item) => item.frame > frame);
        if (next && next.visible && frame >= next.frame - appearFadeFrames) {
          const fadeT = Math.max(0, Math.min(1, (frame - (next.frame - appearFadeFrames)) / appearFadeFrames));
          return fadeT;
        }
        return this.slashFxVisibilityAtFrame(piece, action, frame) ? 1 : 0;
      }

      slashFxParentAtFrame(piece, action, frame) {
        if (!piece) return null;
        const duration = action?.duration ?? this.project.duration ?? 29;
        const track = this.normalizeSlashFxParentTrack(this.getSlashFxParentTrackMap(action)?.[piece.id], duration);
        const previous = [...track].reverse().find((item) => item.frame <= frame);
        return previous?.parentId || null;
      }

      slashFxParentChangeBetweenFrames(piece, action, startFrame, endFrame) {
        if (!piece) return null;
        const duration = action?.duration ?? this.project.duration ?? 29;
        return (
          this.normalizeSlashFxParentTrack(this.getSlashFxParentTrackMap(action)?.[piece.id], duration).find(
            (item) => item.frame > startFrame && item.frame <= endFrame,
          ) || null
        );
      }

      effectiveParentIdForNode(node, action, frame) {
        if (!node) return null;
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && frameState.effectiveParentByNode.has(cacheKey)) {
          return frameState.effectiveParentByNode.get(cacheKey);
        }
        let parentId = node.parentId || null;
        if (!node.attachment) {
          const arrowPiece = this.arrowPieceForNode(node);
          if (arrowPiece) {
            parentId = this.arrowParentAtFrame(arrowPiece, action, frame);
          } else {
            const slashFxPiece = this.slashFxPieceForNode(node);
            if (slashFxPiece) {
              parentId = this.slashFxParentAtFrame(slashFxPiece, action, frame);
            }
          }
        }
        if (cacheKey) {
          frameState.effectiveParentByNode.set(cacheKey, parentId);
        }
        return parentId;
      }

      isTempParentBoundArrowCarrier(node, action, frame) {
        if (!node || node.attachment) return false;
        const arrowPiece = this.arrowPieceForNode(node);
        if (!arrowPiece) return false;
        return Boolean(this.arrowParentAtFrame(arrowPiece, action, frame));
      }

      isTempParentBoundSlashFxCarrier(node, action, frame) {
        if (!node || node.attachment) return false;
        const slashFxPiece = this.slashFxPieceForNode(node);
        if (!slashFxPiece) return false;
        return Boolean(this.slashFxParentAtFrame(slashFxPiece, action, frame));
      }

      isNodeVisibleAtFrame(node, action, frame) {
        if (!node) return false;
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && frameState.visibilityByNode.has(cacheKey)) {
          return frameState.visibilityByNode.get(cacheKey);
        }
        let visible = node.visible !== false;
        const arrowPiece = this.arrowPieceForNode(node);
        if (arrowPiece) {
          visible = this.arrowVisibilityAtFrame(arrowPiece, action, frame);
        } else {
          const slashFxPiece = this.slashFxPieceForNode(node);
          if (slashFxPiece) {
            visible = this.slashFxAlphaAtFrame(slashFxPiece, action, frame) > 0.001;
          }
        }
        if (cacheKey) {
          frameState.visibilityByNode.set(cacheKey, visible);
        }
        return visible;
      }

      effectiveAttachmentAlphaForNode(node, action, frame) {
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && frameState.attachmentAlphaByNode.has(cacheKey)) {
          return frameState.attachmentAlphaByNode.get(cacheKey);
        }
        const baseAlpha = Math.max(0, Math.min(1, Number(node?.attachment?.alpha ?? 1)));
        const slashFxPiece = this.slashFxPieceForNode(node);
        const alpha = slashFxPiece ? baseAlpha * this.slashFxAlphaAtFrame(slashFxPiece, action, frame) : baseAlpha;
        if (cacheKey) {
          frameState.attachmentAlphaByNode.set(cacheKey, alpha);
        }
        return alpha;
      }

      normalizeBowRig(bowRig) {
        if (!bowRig || typeof bowRig !== 'object') return null;
        const groupRotation = Number.isFinite(Number(bowRig.groupRotation))
          ? Number(bowRig.groupRotation)
          : Number.isFinite(Number(bowRig.angle))
            ? Number(bowRig.angle)
            : null;
        return {
          type: String(bowRig.type || ''),
          centerId: bowRig.centerId ? String(bowRig.centerId) : null,
          upperId: bowRig.upperId ? String(bowRig.upperId) : null,
          lowerId: bowRig.lowerId ? String(bowRig.lowerId) : null,
          stringUpperId: bowRig.stringUpperId ? String(bowRig.stringUpperId) : null,
          stringLowerId: bowRig.stringLowerId ? String(bowRig.stringLowerId) : null,
          stringId: bowRig.stringId ? String(bowRig.stringId) : null,
          maxPull: Math.max(1, Number(bowRig.maxPull) || 60),
          bodyInfluence: Math.max(0, Number(bowRig.bodyInfluence) || 0.5),
          groupRotation,
          angle: groupRotation,
          upperLength: Math.max(4, Number(bowRig.upperLength) || 4),
          lowerLength: Math.max(4, Number(bowRig.lowerLength) || 4),
          controlBaseX: Number.isFinite(Number(bowRig.controlBaseX)) ? Number(bowRig.controlBaseX) : null,
          controlBaseY: Number.isFinite(Number(bowRig.controlBaseY)) ? Number(bowRig.controlBaseY) : null,
          pull: Number.isFinite(Number(bowRig.pull)) ? Number(bowRig.pull) : 0,
        };
      }

      isBowStringControlNode(node) {
        return node?.role === 'bow-string-control' && node?.bowRig?.type === 'string-control';
      }

      enrichBowPose(node, pose) {
        if (!this.isBowStringControlNode(node)) return pose;
        const rig = this.rigFromBowPose(node, pose);
        if (!rig) return pose;
        return {
          ...pose,
          bowPoseSerialized: [
            'bowGroupRotation',
            'bowAngle',
            'bowUpperLength',
            'bowLowerLength',
            'bowControlBaseX',
            'bowControlBaseY',
            'bowPull',
          ].some((key) => pose && Object.prototype.hasOwnProperty.call(pose, key)),
          bowGroupRotation: rig.groupRotation,
          bowAngle: rig.angle,
          bowUpperLength: rig.upperLength,
          bowLowerLength: rig.lowerLength,
          bowControlBaseX: rig.controlBaseX,
          bowControlBaseY: rig.controlBaseY,
          bowPull: rig.pull,
        };
      }

      rigFromBowPose(node, pose) {
        if (!this.isBowStringControlNode(node)) return this.normalizeBowRig(node?.bowRig);
        const base = this.normalizeBowRig(node?.bowRig);
        if (!base) return null;
        const groupRotation =
          pose?.bowGroupRotation ??
          pose?.bowRig?.groupRotation ??
          pose?.bowAngle ??
          pose?.bowRig?.angle ??
          base.groupRotation ??
          base.angle;
        return this.normalizeBowRig({
          ...base,
          groupRotation,
          angle: groupRotation,
          upperLength: pose?.bowUpperLength ?? pose?.bowRig?.upperLength ?? base.upperLength,
          lowerLength: pose?.bowLowerLength ?? pose?.bowRig?.lowerLength ?? base.lowerLength,
          controlBaseX: pose?.bowControlBaseX ?? pose?.bowRig?.controlBaseX ?? base.controlBaseX,
          controlBaseY: pose?.bowControlBaseY ?? pose?.bowRig?.controlBaseY ?? base.controlBaseY,
          pull: pose?.bowPull ?? pose?.bowRig?.pull ?? base.pull,
        });
      }

      resolveRestPartTransform(restPart) {
        if (!restPart) return null;
        if (this.restPartTransformCache.has(restPart)) {
          return this.restPartTransformCache.get(restPart);
        }
        const parentBoneId = restPart.parentBoneId ? String(restPart.parentBoneId) : null;
        if (!parentBoneId) {
          const resolved = { ...restPart };
          this.restPartTransformCache.set(restPart, resolved);
          return resolved;
        }
        const parentNode = this.getNodeById(parentBoneId);
        if (!parentNode) {
          const resolved = { ...restPart };
          this.restPartTransformCache.set(restPart, resolved);
          return resolved;
        }
        const parentPose = this.restWorldPose(parentNode);
        if (window.SpineRuntimeMath?.resolveRestPartWorldTransform) {
          const resolved = window.SpineRuntimeMath.resolveRestPartWorldTransform(parentPose, restPart);
          this.restPartTransformCache.set(restPart, resolved);
          return resolved;
        }
        const resolved = { ...restPart };
        this.restPartTransformCache.set(restPart, resolved);
        return resolved;
      }

      isBowRigAttachment(node, attachment) {
        return node?.role === 'bow-rig' && attachment?.image === 'newSword' && Array.isArray(attachment?.skinBoneIds);
      }

      getBowRigNodes(controlNode) {
        const rig = this.normalizeBowRig(controlNode?.bowRig);
        if (!rig) return null;
        const center = this.getNodeById(rig.centerId);
        const upper = this.getNodeById(rig.upperId);
        const lower = this.getNodeById(rig.lowerId);
        const stringUpper = this.getNodeById(rig.stringUpperId) || this.getNodeById(rig.stringId);
        const stringLower = this.getNodeById(rig.stringLowerId) || this.getNodeById(rig.stringId);
        if (!center || !upper || !lower || !stringUpper || !stringLower) return null;
        return { rig, center, upper, lower, stringUpper, stringLower, control: controlNode };
      }

      findBowRigControlForAttachment(attachment) {
        const ids = new Set(attachment?.skinBoneIds || []);
        return this.nodes.find((candidate) => {
          if (!this.isBowStringControlNode(candidate)) return false;
          const rig = this.normalizeBowRig(candidate.bowRig);
          if (!rig) return false;
          return ids.has(rig.upperId) && ids.has(rig.lowerId) && ids.has(rig.stringUpperId) && ids.has(rig.stringLowerId);
        }) || null;
      }

      bowAxes(angle) {
        const rad = (angle * Math.PI) / 180;
        return {
          body: { x: Math.cos(rad), y: Math.sin(rad) },
          pull: { x: -Math.sin(rad), y: Math.cos(rad) },
        };
      }

      bowLocalToWorld(centerWorld, angle, local) {
        const axes = this.bowAxes(angle);
        return {
          x: centerWorld.x + axes.pull.x * (local.x || 0) + axes.body.x * (local.y || 0),
          y: centerWorld.y + axes.pull.y * (local.x || 0) + axes.body.y * (local.y || 0),
        };
      }

      bowWorldToLocal(centerWorld, angle, world) {
        const axes = this.bowAxes(angle);
        const offset = { x: world.x - centerWorld.x, y: world.y - centerWorld.y };
        return {
          x: this.dotVector(offset, axes.pull),
          y: this.dotVector(offset, axes.body),
        };
      }

      bowCenterWorld(nodes, action, frame) {
        return this.endPoint(this.worldPose(nodes.center, action, frame));
      }

      computeBowRigFrame(controlNode, action, frame) {
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = controlNode?.id != null ? String(controlNode.id) : '';
        if (cacheKey && frameState.bowRigByControlNode.has(cacheKey)) {
          return frameState.bowRigByControlNode.get(cacheKey);
        }
        const nodes = this.getBowRigNodes(controlNode);
        if (!nodes) return null;
        const { center, upper, lower, control } = nodes;
        const controlLocal = this.getLocalPose(control, action, frame);
        const rig =
          (controlLocal?.bowPoseSerialized
            ? this.rigFromBowPose(control, controlLocal)
            : this.normalizeBowRig({
                ...nodes.rig,
                groupRotation: null,
                angle: null,
                upperLength: null,
                lowerLength: null,
                controlBaseX: null,
                controlBaseY: null,
                pull: 0,
              })) || nodes.rig;
        if (!rig) return null;
        const centerWorld = this.bowCenterWorld(nodes, action, frame);
        const upperTipCurrent = this.endPoint(this.worldPose(upper, action, frame));
        const lowerTipCurrent = this.endPoint(this.worldPose(lower, action, frame));
        const controlPose = this.worldPose(control, action, frame);
        const controlPointCurrent = { x: controlPose.worldX, y: controlPose.worldY };
        if (!Number.isFinite(Number(rig.groupRotation))) {
          rig.groupRotation =
            (Math.atan2(upperTipCurrent.y - centerWorld.y, upperTipCurrent.x - centerWorld.x) * 180) / Math.PI;
        }
        rig.angle = rig.groupRotation;
        if (!Number.isFinite(Number(rig.upperLength)) || rig.upperLength <= 4) {
          rig.upperLength = Math.max(4, this.distance(centerWorld, upperTipCurrent));
        }
