<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>棋盘格战斗原型 — 战略验证 Demo</title>
  <style>
    :root {
      --page-scale: 1.25;
      --bg: #1a1612;
      --panel: #2a2218;
      --border: #4a3c28;
      --text: #e8dcc8;
      --muted: #9a8870;
      --accent: #c9a227;
      --player: #3a6ea5;
      --enemy: #a53a3a;
      --plain: #6b8f4e;
      --forest: #2d5a3d;
      --hill: #8a7355;
      --river: #2a4a6a;
      --bridge: #9a8260;
      --highlight-move: rgba(100, 180, 255, 0.45);
      --highlight-attack: rgba(255, 100, 80, 0.5);
      --highlight-skill: rgba(255, 200, 80, 0.45);
      --left-w: calc(270px * var(--page-scale));
      --right-w: calc(260px * var(--page-scale));
      --side-w: calc(var(--left-w) + var(--right-w));
      --header-h: calc(64px * var(--page-scale));
      --deploy-h: calc(46px * var(--page-scale));
      --controls-h: calc(38px * var(--page-scale));
      --tile-w: calc(56px * var(--page-scale));
      --tile-h: calc(32px * var(--page-scale));
      --tile-side: calc(40px * var(--page-scale));
      --cell: min(
        calc((100vh - var(--header-h) - var(--deploy-h) - var(--controls-h) - 20px) / 10 - 2px),
        calc((100vw - var(--side-w) - 40px) / 12 - 2px),
        calc(56px * var(--page-scale))
      );
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: 100%;
      overflow: hidden;
      font-size: calc(100% * var(--page-scale));
    }
    body { height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Serif SC", "SimSun", serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      height: var(--header-h);
      flex-shrink: 0;
      padding: 4px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 { font-size: 0.95rem; color: var(--accent); font-weight: 600; white-space: nowrap; }

    .phase-badge {
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.72rem;
      background: var(--panel);
      white-space: nowrap;
    }
    .phase-badge.player { border-color: var(--player); color: #8ec4ff; }
    .phase-badge.enemy { border-color: var(--enemy); color: #ff9090; }

    .objective-bar {
      font-size: 0.72rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .objective-progress {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #turn-info {
      color: var(--muted);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 8px;
      padding: 8px;
      overflow: hidden;
      position: relative;
    }

    .command-panel,
    .right-panel {
      flex-shrink: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      position: relative;
      z-index: 5;
    }

    .command-panel { width: var(--left-w); }
    .right-panel { width: var(--right-w); }
    .right-panel .debug-panel { display: none; }

    .battle-area {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .unit-card,
    .unit-formation-panel,
    .battle-status-panel {
      background: rgba(18, 16, 14, 0.92);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .panel-title {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .unit-card { flex-shrink: 0; }
    .unit-card-body {
      padding: 8px;
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
      min-height: 120px;
    }
    .unit-portrait {
      border: 1px solid var(--border);
      background: #201912;
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 0.78rem;
      text-align: center;
      padding: 6px;
    }
    .unit-summary {
      min-width: 0;
      font-size: 0.68rem;
      line-height: 1.55;
      color: var(--text);
    }
    .unit-summary .name {
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .unit-summary .muted { color: var(--muted); }
    .unit-stat-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      border-top: 1px solid rgba(201, 162, 39, 0.16);
      padding-top: 3px;
      margin-top: 3px;
    }

    .unit-formation-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .unit-formation-grid {
      flex: 1;
      min-height: 0;
      padding: 7px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: minmax(72px, 1fr);
      gap: 5px;
      overflow: hidden;
    }
    .unit-formation-cell {
      min-width: 0;
      border: 1px solid var(--border);
      background: rgba(42, 34, 24, 0.88);
      border-radius: 4px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.58rem;
      line-height: 1.2;
    }
    .unit-formation-cell.empty {
      opacity: 0.42;
      justify-content: center;
      color: var(--muted);
    }
    .unit-formation-cell.fallen {
      opacity: 0.55;
      filter: grayscale(0.65);
    }
    .unit-formation-cell .slot {
      color: var(--muted);
      font-size: 0.52rem;
    }
    .unit-formation-cell .troop {
      color: var(--text);
      font-weight: 600;
      font-size: 0.64rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unit-formation-cell .hp {
      color: var(--accent);
      font-size: 0.56rem;
    }
    .unit-formation-cell .bar {
      height: 4px;
      background: rgba(0,0,0,0.42);
      border-radius: 2px;
      overflow: hidden;
      margin-top: auto;
    }
    .unit-formation-cell .fill {
      height: 100%;
      background: linear-gradient(90deg, #6fa3d8, #c9a227);
    }

    .board-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(18, 16, 14, 0.08), rgba(18, 16, 14, 0.08)),
        url("../../ui/battle/battlegroun_forest.png") center / cover no-repeat;
      border: 0;
      border-radius: 0;
      padding: 0;
      overflow: hidden;
    }

    #board {
      position: relative;
      user-select: none;
      width: calc((12 + 10) * var(--tile-w) / 2);
      height: calc((12 + 10) * var(--tile-h) / 2 + var(--tile-h));
    }

    .cell {
      width: var(--tile-w);
      height: var(--tile-h);
      position: absolute;
      cursor: default;
      font-size: clamp(0.4rem, calc(var(--tile-w) * 0.12), 0.6rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateZ(0);
      --tile-bg: transparent;
      --tile-edge: #e2bf47;
      --tile-glow: rgba(0,0,0,0.22);
    }

    .cell::before {
      content: "";
      position: absolute;
      width: var(--tile-side);
      height: var(--tile-side);
      left: calc((var(--tile-w) - var(--tile-side)) / 2);
      top: calc((var(--tile-h) - var(--tile-side)) / 2);
      box-sizing: border-box;
      background: var(--tile-bg);
      border: 2px solid var(--tile-edge);
      border-radius: 7px;
      transform: scaleY(0.52) rotate(45deg);
      transform-origin: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.25);
      transition: transform 0.12s, filter 0.12s, box-shadow 0.12s;
    }

    .cell.deploy-zone { outline: 1px dashed rgba(100,180,255,0.4); }
    .cell.defense-zone { outline: 1px dashed rgba(201,162,39,0.35); }
    .cell.can-move { cursor: pointer; }
    .cell.can-move::before { --tile-edge: #8dd4ff; filter: brightness(1.18); box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 12px var(--highlight-move); }
    .cell.can-attack { cursor: crosshair; }
    .cell.can-attack::before { --tile-edge: #ff746b; filter: brightness(1.22); box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 14px var(--highlight-attack); }
    .cell.attack-range::before { --tile-edge: #d86a4c; filter: brightness(1.08); box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 8px rgba(255, 100, 80, 0.28); }
    .cell.can-skill { cursor: pointer; }
    .cell.can-skill::before { --tile-edge: #ffd166; filter: brightness(1.22); box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 12px var(--highlight-skill); }
    .cell.post-move::before,
    .cell.selected::before { --tile-edge: #ffe17a; transform: scaleY(0.52) rotate(45deg); translate: 0 -2px; box-shadow: 0 6px 0 rgba(0,0,0,0.28), 0 0 16px rgba(255, 225, 122, 0.72); }
    .cell.highlight-player-camp::before { box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 0 2px rgba(58, 110, 165, 0.7); }
    .cell.highlight-enemy-camp::before { box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 0 2px rgba(165, 58, 58, 0.7); }
    .cell.highlight-supply-depot::before { --tile-edge: #ffe17a; }
    .cell.highlight-cart::before { --tile-edge: #ffcc66; }
    .cell.highlight-target-commander::before { box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 0 2px rgba(255, 215, 96, 0.95); }
    .cell.highlight-protect-commander::before { box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 0 0 2px rgba(126, 200, 255, 0.95); }

    .camp-marker {
      position: absolute;
      top: -6px;
      right: 2px;
      font-size: 0.48rem;
      opacity: 0.75;
      z-index: 2;
    }

    .dropped-supply {
      position: absolute;
      font-size: 0.55rem;
      z-index: 0;
      color: #ffd080;
      text-shadow: 0 0 4px #000;
    }

    .unit.supply-cart { background: #4a3a18; border-color: #e8b84a; color: #ffe8a0; }
    .unit.supply-cart .cart-hp { font-size: 0.45rem; }

    .point-marker {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 0.48rem;
      padding: 0 2px;
      border-radius: 2px;
      background: rgba(0,0,0,0.45);
      line-height: 1.2;
      z-index: 2;
    }
    .point-marker.player-own { color: #8ec4ff; border: 1px solid var(--player); }
    .point-marker.enemy-own { color: #ff9090; border: 1px solid var(--enemy); }
    .point-marker.neutral { color: var(--muted); border: 1px solid var(--muted); }

    .capture-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(0,0,0,0.4);
      z-index: 2;
    }
    .capture-fill { height: 100%; background: var(--accent); transition: width 0.2s; }

    .unit {
      width: calc(var(--tile-w) * 0.72);
      min-height: calc(var(--tile-w) * 0.52);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.4rem, calc(var(--tile-w) * 0.1), 0.55rem);
      font-weight: 600;
      cursor: grab;
      border: 2px solid;
      position: relative;
      z-index: 1;
      line-height: 1.05;
      text-align: center;
      padding: 1px;
      box-shadow: 0 5px 8px rgba(0,0,0,0.35);
    }

    .formation-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      width: 70%;
      margin-top: 1px;
    }
    .formation-chips i {
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.58);
    }

    .unit.player { background: #1e3a5f; border-color: #5a9fd4; color: #cfe8ff; }
    .unit.enemy { background: #5f1e1e; border-color: #d45a5a; color: #ffcfcf; }
    .unit.commander { box-shadow: 0 0 4px gold; }
    .unit.acted { opacity: 0.55; }
    .unit.chaos { animation: shake 0.4s infinite; border-color: #ff8800; }
    .unit.rout { animation: flee-pulse 0.8s infinite; border-color: #888; opacity: 0.65; }
    .unit.in-river { outline: 1px dashed #6af; }

    .unit-status {
      font-size: 0.48rem;
      font-weight: 400;
      opacity: 0.9;
    }
    .unit-status.high { color: #8f8; }
    .unit-status.normal { color: #ccc; }
    .unit-status.shaken { color: #fc8; }
    .unit-status.chaos { color: #f80; }
    .unit-status.rout { color: #aaa; }

    .commander-badge {
      position: absolute;
      top: 1px;
      right: 1px;
      min-width: 1.4em;
      padding: 0 2px;
      border-radius: 2px;
      font-size: 0.42rem;
      line-height: 1.2;
      color: #241300;
      background: #f6d36b;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-1px); }
    }
    @keyframes flee-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.8; }
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      z-index: 4;
      height: var(--controls-h);
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 5px 7px;
      background: rgba(18, 16, 14, 0.88);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    button {
      font-family: inherit;
      padding: 5px 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #3a2e10; border-color: var(--accent); color: var(--accent); }

    .skill-bar { display: flex; gap: 4px; overflow: hidden; min-width: 0; }
    .skill-btn { font-size: 0.75rem; padding: 4px 8px; }

    .action-menu {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: stretch;
      min-width: 96px;
      padding: 7px 8px;
      background: rgba(18, 16, 14, 0.94);
      border: 1px solid var(--accent);
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    }
    .action-menu.hidden { display: none; }
    .action-menu .hint {
      color: var(--muted);
      font-size: 0.72rem;
      padding: 0 2px 2px;
      white-space: normal;
      line-height: 1.25;
      text-align: center;
    }
    .action-menu button { width: 100%; padding: 5px 8px; }

    .battle-log-panel {
      flex-shrink: 0;
      height: 150px;
      background: #12100e;
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .battle-log-panel h3 {
      flex-shrink: 0;
      padding: 5px 7px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
    }
    .log-panel {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 5px 7px;
      font-size: 0.7rem;
      line-height: 1.35;
    }
    .log-panel .entry { margin-bottom: 2px; }
    .log-panel .entry.damage { color: #ff8080; }
    .log-panel .entry.heal { color: #80ff80; }
    .log-panel .entry.skill { color: #ffd080; }
    .log-panel .entry.system { color: var(--muted); }
    .log-panel .entry.morale { color: #c8a0ff; }

    .morale-log-panel {
      flex-shrink: 0;
      height: 118px;
      overflow-y: auto;
      background: #151018;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 0.68rem;
      line-height: 1.35;
    }
    .morale-log-panel h3 {
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 3px;
      font-weight: 600;
    }
    .morale-log-panel .entry { margin-bottom: 2px; color: #c8a0ff; }

    .debug-panel {
      flex: 1;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .debug-panel h2 {
      padding: 5px 8px;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      flex-shrink: 0;
    }
    .debug-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 5px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      align-content: start;
    }
    .debug-unit {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 5px;
      font-size: 0.62rem;
      line-height: 1.4;
    }
    .debug-unit.player-side { border-left: 3px solid var(--player); }
    .debug-unit.enemy-side { border-left: 3px solid var(--enemy); }
    .debug-unit .name { font-weight: 600; font-size: 0.68rem; }
    .morale-bar { height: 3px; background: #333; border-radius: 2px; overflow: hidden; margin: 2px 0; }
    .morale-fill { height: 100%; background: linear-gradient(90deg, #a53a3a, #c9a227, #3a8a3a); }

    .battle-status-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .battle-status-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.68rem;
      line-height: 1.45;
    }
    .status-item {
      border: 1px solid rgba(201, 162, 39, 0.22);
      background: rgba(42, 34, 24, 0.7);
      border-radius: 4px;
      padding: 6px;
    }
    .status-item .label {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .deploy-pool {
      position: absolute;
      left: calc(var(--left-w) + 16px);
      right: calc(var(--right-w) + 16px);
      top: 8px;
      z-index: 4;
      height: var(--deploy-h);
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow-x: auto;
    }
    .deploy-pool .unit {
      width: auto;
      min-width: 68px;
      height: 36px;
      flex-shrink: 0;
      padding: 0 5px;
    }

    .type-tag {
      display: inline-block;
      padding: 0 4px;
      border-radius: 2px;
      font-size: 0.58rem;
      background: rgba(0,0,0,0.3);
    }

    .overlay-msg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay-msg.hidden { display: none; }
    .overlay-box {
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 28px 40px;
      text-align: center;
    }
    .overlay-box h2 { font-size: 1.4rem; color: var(--accent); margin-bottom: 10px; }
    .overlay-box p { font-size: 0.88rem; line-height: 1.5; color: var(--text); }
    .recap-box {
      margin-top: 14px;
      text-align: left;
      font-size: 0.82rem;
      line-height: 1.6;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .recap-box h3 { font-size: 0.88rem; color: var(--accent); margin-bottom: 8px; }
    .recap-box ul { padding-left: 18px; color: var(--muted); }
    .recap-box li { margin-bottom: 4px; }

    .tutorial-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(360px, calc(100vw - 32px));
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 14px 16px;
      z-index: 110;

      right: 8px;

      bottom: 25px;

        point_watchTower: { title: '箭塔', body: '箭塔能够扩大视野范围。\n帮助远程部队控制战场。' },
        morale_boost: { title: '士气提升', body: '高士气部队战斗能力更强。' },
        morale_shaken: { title: '部队动摇', body: '低士气会影响战斗表现。' },
        morale_rout: { title: '部队溃逃', body: '士气崩溃的部队将脱离战场。' },
      };

      let seen = new Set();
      let pendingId = null;
      let onCloseCb = null;

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) seen = new Set(JSON.parse(raw));
        } catch (_) { seen = new Set(); }
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...seen])); } catch (_) {}
      }

      function hasSeen(id) { return seen.has(id); }

      function markSeen(id) {
        seen.add(id);
        save();
      }

      function resolveTip(id) {
        return TIPS[id] || Object.values(LESSON_TAG_TIPS).find(t => t.id === id);
      }

      function showToast(title, body, tipId, onClose) {
        const el = document.getElementById('tutorial-toast');
        document.getElementById('tutorial-title').textContent = title;
        document.getElementById('tutorial-body').textContent = body;
        pendingId = tipId;
        onCloseCb = onClose;
        el.classList.remove('hidden');
      }

      function hideToast() {
        document.getElementById('tutorial-toast').classList.add('hidden');
        if (pendingId) markSeen(pendingId);
        pendingId = null;
        if (onCloseCb) { onCloseCb(); onCloseCb = null; }
      }

      function maybeShow(id) {
        if (hasSeen(id)) return;
        const tip = resolveTip(id);
        if (!tip) return;
        showToast(tip.title, tip.body, id);
      }

      function applyLessonTags(tags) {
        if (!tags?.length) return;
        for (const tag of tags) {
          const lesson = LESSON_TAG_TIPS[tag];
          if (lesson && !hasSeen(lesson.id)) {
            setTimeout(() => showToast(lesson.title, lesson.body, lesson.id), 800);
            break;
          }
        }
      }

      function resetAll() {
        seen.clear();
        save();
      }

      load();
      return { maybeShow, applyLessonTags, hideToast, resetAll, hasSeen, markSeen };
    })();

    function uid() { return 'u' + (nextId++); }
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function manhattan(x1, y1, x2, y2) { return Math.abs(x1 - x2) + Math.abs(y1 - y2); }
    function inBounds(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; }
    function cellKey(x, y) { return x + ',' + y; }

    function log(msg, cls = 'system') {
      const el = document.getElementById('log');
      const e = document.createElement('div');
      e.className = 'entry ' + cls;
      e.textContent = msg;
      el.prepend(e);
    }

    function addRecap(text) {
      if (!battleRecap.includes(text)) battleRecap.push(text);
    }

    function logMorale(msg) {
      const el = document.getElementById('morale-log');
      const e = document.createElement('div');
      e.className = 'entry';
      e.textContent = msg;
      el.prepend(e);
    }

    function getMoraleTier(m) {
      if (m >= 80) return { id: 'high', label: '高昂', atk: 1.12, def: 1.1, hit: 1.1, counter: 1.15 };
      if (m >= 50) return { id: 'normal', label: '正常', atk: 1, def: 1, hit: 1, counter: 1 };
      if (m >= 30) return { id: 'shaken', label: '动摇', atk: 0.82, def: 0.88, hit: 0.82, counter: 0.65 };
      if (m >= 10) return { id: 'chaos', label: '混乱', atk: 0.55, def: 0.72, hit: 0.45, counter: 0.25 };
      return { id: 'rout', label: '溃逃', atk: 0, def: 0, hit: 0, counter: 0 };
    }

    function isRout(u) { return u.morale < 10; }
    function isChaos(u) { return u.morale >= 10 && u.morale < 30; }

    function changeMorale(unit, delta, reason, broadcast = true) {
      if (!unit || unit.soldiers <= 0) return;
      const old = unit.morale;
      const oldTier = getMoraleTier(old);
      const wasRout = isRout(unit);
      unit.morale = clamp(unit.morale + delta, 0, 100);
      const newTier = getMoraleTier(unit.morale);

      if (delta !== 0 && broadcast) {
        logMorale(`${unit.name} ${reason}${delta >= 0 ? ' ↑' : ' ↓'}`);
      }

      if (unit.side === 'player') {
        if (delta > 0 && broadcast) BattleTutorialManager.maybeShow('morale_boost');
        if (oldTier.id !== 'shaken' && newTier.id === 'shaken') BattleTutorialManager.maybeShow('morale_shaken');
        if (!wasRout && isRout(unit)) BattleTutorialManager.maybeShow('morale_rout');
      }

      if (!wasRout && isRout(unit)) triggerRoutChain(unit);
    }

    function changeMoraleSide(side, delta, reason) {
      for (const u of units) {
        if (u.side === side && u.soldiers > 0) changeMorale(u, delta, reason);
      }
    }

    function triggerRoutChain(routUnit) {
      logMorale(`${routUnit.name} 溃逃，波及附近部队`);
      if (routUnit.side === 'player') addRecap(`${routUnit.name} 士气崩溃`);
      else addRecap(`敌军 ${routUnit.name} 士气崩溃`);
      for (const u of units) {
        if (u.side !== routUnit.side || u.id === routUnit.id || u.soldiers <= 0) continue;
        if (manhattan(u.x, u.y, routUnit.x, routUnit.y) <= 2) {
          changeMorale(u, -5, '友军溃逃波及', false);
          if (u.side === 'player') logMorale(`${u.name} 受溃逃波及`);
        }
      }
    }

    function onGeneralFallen(unit) {
      if (!unit.isCommander) return;
      if (unit.commanderFallenReported) return;
      unit.commanderFallenReported = true;
      const sideLabel = unit.side === 'player' ? '我军' : '敌军';
      logMorale(`${sideLabel}主将${unit.general.name}阵亡`);
      if (unit.side === 'enemy') addRecap('敌军主将阵亡');
      else addRecap('我军主将阵亡');
      changeMoraleSide(unit.side, -15, '主将阵亡', false);
    }

    function getTypeAdv(a, d) {
      const t = TYPE_ADVANTAGE[a.troopType];
      return t && t[d.troopType] ? t[d.troopType] : 1;
    }

    function moveRange(unit) {
      return Math.max(2, Math.min(5, Math.round(unit.speed / 10)));
    }

    function getCell(x, y) {
      return grid.find(c => c.x === x && c.y === y);
    }

    function getTerrain(x, y) {
      return getCell(x, y)?.terrain || 'plain';
    }

    function getPointAt(x, y) {
      return strategicPoints.find(p => p.x === x && p.y === y);
    }

    function isSupplyTransportBattle() {
      return battleObjective?.id === 'supplyTransport';
    }

    function isStrongpointBattle() {
      return battleObjective?.id === 'strongpoint';
    }

    function isAssassinationBattle() {
      return battleObjective?.id === 'assassination';
    }

    function getDefenseZoneLabel() {
      return `中央防区（第 ${DEFENSE_ZONE_ROWS[0] + 1}-${DEFENSE_ZONE_ROWS[DEFENSE_ZONE_ROWS.length - 1] + 1} 行高亮区域）`;
    }

    function getObjectiveDescription(objective) {
      if (!objective) return '';
      if (objective.id === 'defense') {
        return `${getDefenseZoneLabel()}内至少保有 ${DEFENSE_PLAYER_UNITS_REQUIRED} 支未溃逃部队，且敌军不得踏入，连续守住 ${DEFENSE_HOLD_REQUIRED} 回合。`;
      }
      return objective.friendlyDesc;
    }

    function getCart(side) {
      return units.find(u => u.isSupplyCart && u.side === side && u.soldiers > 0);
    }

    function getCommander(side, includeDefeated = false) {
      return units.find(u =>
        u.side === side &&
        u.isCommander &&
        (includeDefeated || u.soldiers > 0)
      ) || null;
    }

    function getAnyCart() {
      return units.find(u => u.isSupplyCart && u.soldiers > 0) || null;
    }

    function getSupplyDepot() {
      return strategicPoints.find(p => p.type === 'supplyDepot');
    }

    function isPassableTile(x, y, ignoreUnitId = null) {
      if (!inBounds(x, y)) return false;
      const t = getTerrain(x, y);
      if (isRiverTerrain(t)) return false;
      const occ = units.find(u => u.soldiers > 0 && u.x === x && u.y === y && u.id !== ignoreUnitId);
      return !occ;
    }

    function isInCampZone(x, y, side) {
      const camp = side === 'player' ? playerCamp : enemyCamp;
      if (!camp) return false;
      return camp.cells.some(c => c.x === x && c.y === y);
    }

    function distToCamp(cart) {
      const camp = cart.side === 'player' ? playerCamp : enemyCamp;
      if (!camp?.cells.length) return 99;
      return Math.min(...camp.cells.map(c => manhattan(cart.x, cart.y, c.x, c.y)));
    }

    function removeCartsOfSide(side) {
      units = units.filter(u => !(u.isSupplyCart && u.side === side));
    }

    function getCampAnchor(side) {
      return side === 'player'
        ? { x: 1, y: 8 }
        : { x: COLS - 2, y: 1 };
    }

    function raiseSupplyMorale(side, delta, reason) {
      let affected = 0;
      for (const unit of units) {
        if (unit.side !== side || unit.soldiers <= 0 || unit.isSupplyCart) continue;
        changeMorale(unit, delta, reason, false);
        affected++;
      }
      if (!affected) return;
      const sideLabel = side === 'player' ? '我军' : '敌军';
      logMorale(`${sideLabel}${reason}，士气提升`);
      if (side === 'player') BattleTutorialManager.maybeShow('morale_boost');
    }

    function findSpawnNear(originX, originY, side) {
      const candidates = [];
      const queue = [{ x: originX, y: originY, dist: 0 }];
      const visited = new Set([cellKey(originX, originY)]);

      while (queue.length && candidates.length < 8) {
        const { x, y, dist } = queue.shift();
        if (dist > 0 && dist <= 2 && isPassableTile(x, y)) {
          if (!(x === originX && y === originY)) candidates.push({ x, y });
        }
        if (dist >= 2) continue;
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const nx = x + dx, ny = y + dy;
          const nk = cellKey(nx, ny);
          if (!inBounds(nx, ny) || visited.has(nk)) continue;
          visited.add(nk);
          queue.push({ x: nx, y: ny, dist: dist + 1 });
        }
      }

      const camp = side === 'player' ? playerCamp : enemyCamp;
      const campCenter = camp?.cells[0] || { x: originX, y: originY };
      candidates.sort((a, b) =>
        manhattan(a.x, a.y, campCenter.x, campCenter.y) - manhattan(b.x, b.y, campCenter.x, campCenter.y)
      );
      return candidates[0] || null;
    }

    function createSupplyCart(side, spawnX, spawnY) {
      return {
        id: uid(),
        name: side === 'player' ? '我军粮车' : '敌军粮车',
        troopType: 'supplyCart',
        isSupplyCart: true,
        soldiers: CART_MAX_HP,
        maxSoldiers: CART_MAX_HP,
        attack: 0,
        defense: 15,
        speed: 12,
        range: 0,
        morale: 100,
        general: { name: '—', leadership: 0, strength: 0, intelligence: 0 },
        side,
        x: spawnX,
        y: spawnY,
        hasMoved: false,
        hasActed: true,
        inRiver: false,
        skillUses: { inspire: 0, charge: 0 },
        chargeReady: false,
        isCommander: false,
      };
    }

    function spawnSupplyCart(side, originX, originY, fromDepot = true) {
      if (!isSupplyTransportBattle()) return;
      if (supplyCartClaimSide != null && supplyCartClaimSide !== side) {
        log(
          `${side === 'player' ? '我军' : '敌军'}已失去粮车归属，无法再生成粮车`,
          'system'
        );
        return false;
      }
      if (getAnyCart()) return false;
      const spot = findSpawnNear(originX, originY, side);
      if (!spot) {
        log(`${side === 'player' ? '我军' : '敌军'}粮车无法出发（无可用空地）`, 'system');
        return false;
      }
      supplyCartClaimSide = side;
      const cart = createSupplyCart(side, spot.x, spot.y);
      units.push(cart);
      const label = side === 'player' ? '我军' : '敌军';
      if (fromDepot) {
        log(`${label}粮车已从粮仓附近出发`, 'skill');
      } else {
        log(`${label}粮车从散落粮食处重新出发`, 'skill');
      }
      if (side === 'player') {
        addRecap('粮车已出发');
        log('粮车已出发。请护送其返回营地。', 'system');
        BattleTutorialManager.maybeShow('supply_cart_spawn');
      } else {
        log('敌军粮车已出发', 'system');
      }
      return true;
    }

    function destroyCart(cart) {
      const sideLabel = cart.side === 'player' ? '我军' : '敌军';
      log(`${sideLabel}粮车被摧毁`, 'damage');
      log('粮车被摧毁。粮食散落在战场上。', 'system');
      if (cart.side === 'player') addRecap('我军粮车被摧毁');
      droppedSupplies.push({ x: cart.x, y: cart.y });
      units = units.filter(u => u.id !== cart.id);
      if (cart.side === 'player') BattleTutorialManager.maybeShow('supply_cart_destroyed');
    }

    function tryPickupDroppedSupply(unit) {
      if (!isSupplyTransportBattle() || unit.isSupplyCart) return;
      const idx = droppedSupplies.findIndex(d => d.x === unit.x && d.y === unit.y);
      if (idx < 0) return;
      if (supplyCartClaimSide != null && supplyCartClaimSide !== unit.side) return;
      const spawned = spawnSupplyCart(unit.side, unit.x, unit.y, false);
      if (!spawned) return;
      droppedSupplies.splice(idx, 1);
      log('粮食已被重新夺取。', 'skill');
      addRecap(`${unit.side === 'player' ? '我军' : '敌军'}重新夺取散落粮食`);
      raiseSupplyMorale(unit.side, DROPPED_SUPPLY_MORALE_BONUS, '夺回散落军粮');
      if (unit.side === 'player') BattleTutorialManager.maybeShow('supply_pickup');
    }

    function autoMoveCartStep(cart) {
      if (cart.soldiers <= 0) return;
      const campCells = (cart.side === 'player' ? playerCamp : enemyCamp)?.cells || [];
      if (!campCells.length) return;

      let best = null, bestDist = Infinity;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        const nx = cart.x + dx, ny = cart.y + dy;
        if (!isPassableTile(nx, ny, cart.id)) continue;
        const d = Math.min(...campCells.map(c => manhattan(nx, ny, c.x, c.y)));
        if (d < bestDist) {
          bestDist = d;
          best = { x: nx, y: ny };
        }
      }
      if (best) {
        cart.x = best.x;
        cart.y = best.y;
        cart.inRiver = false;
      }
    }

    function processSupplyCartMoves() {
      if (!isSupplyTransportBattle()) return;
      for (const cart of units.filter(u => u.isSupplyCart && u.soldiers > 0)) {
        for (let i = 0; i < CART_MOVE_PER_TURN; i++) {
          if (isInCampZone(cart.x, cart.y, cart.side)) break;
          autoMoveCartStep(cart);
          if (isInCampZone(cart.x, cart.y, cart.side)) break;
        }
        if (isInCampZone(cart.x, cart.y, cart.side)) {
          if (cart.side === 'player') {
            addRecap('粮车成功运回营地');
            showOverlay('胜利', '粮食已运回营地！', true);
          } else {
            showOverlay('失败', '敌军粮食已运回营地……', false);
          }
          return true;
        }
      }
      return false;
    }

    function militaryAt(x, y) {
      return units.find(u => u.x === x && u.y === y && u.soldiers > 0 && !u.isSupplyCart);
    }

    function cartAt(x, y) {
      return units.find(u => u.x === x && u.y === y && u.soldiers > 0 && u.isSupplyCart);
    }

    function unitAt(x, y) {
      return militaryAt(x, y) || cartAt(x, y);
    }

    function isRiverTerrain(t) { return t === 'river'; }
    function isBridgeTerrain(t) { return t === 'bridge'; }

    function ownsWatchTower(side, x, y) {
      for (const p of strategicPoints) {
        if (p.type !== 'watchTower' || p.owner !== side) continue;
        if (manhattan(x, y, p.x, p.y) <= 1) return true;
      }
      return false;
    }

    function getVision(unit) {
      let v = 3;
      if (getTerrain(unit.x, unit.y) === 'hill') v += 2;
      if (getTerrain(unit.x, unit.y) === 'forest') v = 1;
      for (const p of strategicPoints) {
        if (p.type === 'watchTower' && p.owner === unit.side && manhattan(unit.x, unit.y, p.x, p.y) <= 2) v += 2;
      }
      return v;
    }

    function canSee(attacker, tx, ty) {
      return manhattan(attacker.x, attacker.y, tx, ty) <= getVision(attacker);
    }

    function getEffectiveRange(unit) {
      if (unit.formationMembers?.length) {
        const aliveMembers = unit.formationMembers.filter(member => member.soldiers > 0);
        if (!aliveMembers.length) return 0;
        let maxRange = Math.max(...aliveMembers.map(member => member.range));
        if (aliveMembers.some(member => member.troopType === 'archer') && getTerrain(unit.x, unit.y) === 'hill') maxRange += 1;
        if (ownsWatchTower(unit.side, unit.x, unit.y)) maxRange += 1;
        return maxRange;
      }
      let r = TROOP_TYPES[unit.troopType].range;
      if (r <= 1) return r;
      if (unit.troopType === 'archer' && getTerrain(unit.x, unit.y) === 'hill') r += 1;
      if (ownsWatchTower(unit.side, unit.x, unit.y)) r += 1;
      return r;
    }

    function rangeToTarget(attacker, defender) {
      let r = getEffectiveRange(attacker);
      if (r > 1 && (getTerrain(attacker.x, attacker.y) === 'forest' || getTerrain(defender.x, defender.y) === 'forest')) {
        r = Math.max(1, Math.floor(r / 2));
      }
      return r;
    }

    function canLockTarget(attacker, defender) {
      const dist = manhattan(attacker.x, attacker.y, defender.x, defender.y);
      if (getTerrain(defender.x, defender.y) === 'forest' && dist >= FOREST_LOCK_RANGE) return false;
      return isInFixedAttackPattern(attacker, defender.x, defender.y) && getBattleReadyMembers(attacker, dist).length > 0;
    }

    function canApplyChargeBonus(unit) {
      return getTerrain(unit.x, unit.y) !== 'forest';
    }

    function getAliveCombatMembers(unit) {
      if (unit.formationMembers?.length) {
        return unit.formationMembers.filter(member => member.soldiers > 0 && member.status !== 'stunned');
      }
      return unit.soldiers > 0 && !unit.isSupplyCart
        ? [{ troopType: unit.troopType, range: TROOP_TYPES[unit.troopType]?.range || 1 }]
        : [];
    }

    function hasRangedMember(unit) {
      return getAliveCombatMembers(unit).some(member => member.range > 1);
    }

    function hasOnlyMeleeMembers(unit) {
      const members = getAliveCombatMembers(unit);
      return members.length > 0 && members.every(member => member.range <= 1);
    }

    function isInFixedAttackPattern(attacker, tx, ty) {
      const dx = Math.abs(tx - attacker.x);
      const dy = Math.abs(ty - attacker.y);
      if (dx === 0 && dy === 0) return false;
      if (hasRangedMember(attacker)) {
        return (dx === 0 && dy <= 2) || (dy === 0 && dx <= 2) || (dx === 1 && dy === 1);
      }
      if (hasOnlyMeleeMembers(attacker)) {
        return (dx + dy) === 1;
      }
      const maxRange = getEffectiveRange(attacker);
      return (dx + dy) > 0 && (dx + dy) <= maxRange;
    }

    function getBattleReadyMembers(unit, distance) {
      if (!unit.formationMembers?.length) return [];
      return unit.formationMembers.filter(member =>
        member.soldiers > 0 &&
        member.status !== 'stunned' &&
        (distance <= 1 || member.range >= distance)
      );
    }

    function getAliveFormationMembers(unit) {
      return unit.formationMembers?.filter(member => member.soldiers > 0) || [];
    }

    function cloneFormationSnapshot(unit) {
      const members = unit.formationMembers?.map(member => ({ ...member })) || [];
      return {
        id: unit.id,
        name: unit.name,
        side: unit.side,
        generalName: unit.general.name,
        morale: unit.morale,
        soldiers: unit.soldiers,
        maxSoldiers: unit.maxSoldiers,
        formationMembers: members,
      };
    }

    function chooseFormationTarget(attackerMember, defenderUnit) {
      const alive = getAliveFormationMembers(defenderUnit);
      if (!alive.length) return null;
      const front = alive.filter(member => member.slotKey.startsWith('front'));
      const middle = alive.filter(member => member.slotKey.startsWith('middle'));
      const rear = alive.filter(member => member.slotKey.startsWith('rear'));
      if (attackerMember.range > 1 && Math.random() < 0.35) {
        return (rear[0] || middle[0] || front[0] || alive[0]);
      }
      return (front[0] || middle[0] || rear[0] || alive[0]);
    }

    function calculateMemberDamage(attackerUnit, attackerMember, defenderUnit, defenderMember, distance, isCounter = false) {
      const atkTier = getMoraleTier(attackerUnit.morale);
      const defTier = getMoraleTier(defenderUnit.morale);
      const typeAdv = TYPE_ADVANTAGE[attackerMember.troopType]?.[defenderMember.troopType] || 1;
      const rangePenalty = distance > 1 && attackerMember.range === distance ? 0.9 : 1;
      const strengthBonus = 1 + attackerUnit.general.strength / 240;
      const effAtk = attackerMember.attack * strengthBonus * atkTier.atk * rangePenalty;
      const effDef = Math.max(1, defenderMember.defense * defTier.def);
      let damage = Math.round((effAtk / effDef) * (isCounter ? 8 : 11) * typeAdv * (0.85 + Math.random() * 0.25));

      if (isOnHill(attackerUnit.x, attackerUnit.y) && !isOnHill(defenderUnit.x, defenderUnit.y)) damage = Math.round(damage * 1.15);
      if (defenderUnit.inRiver) damage = Math.round(damage * RIVER_DAMAGE_MULT);
      if (attackerMember.troopType === 'cavalry' && distance <= 1 && canApplyChargeBonus(attackerUnit)) damage = Math.round(damage * 1.12);
      damage = clamp(damage, 1, Math.max(1, Math.round(attackerMember.soldiers * 0.22)));
      return { damage, typeAdv };
    }

    function applyMemberDamage(unit, member, damage) {
      member.soldiers = Math.max(0, member.soldiers - damage);
      syncFormationTotals(unit);
      changeMorale(unit, -Math.max(1, Math.round(damage / unit.maxSoldiers * 35)), '编队战损', false);
      if (unit.soldiers <= 0) onGeneralFallen(unit);
    }

    function isOnHill(x, y) { return getTerrain(x, y) === 'hill'; }

    // ─── 地图生成 ───────────────────────────────────────────
    function scoreStrategicPoint(type, x, y) {
      if (isStrongpointBattle()) {
        const centerX = (COLS - 1) / 2;
        const centerY = (ROWS - 1) / 2;
        const centerBias = Math.abs(x - centerX) * 1.4 + Math.abs(y - centerY) * 2.2;
        return centerBias + Math.random();
      }
      if (type !== 'supplyDepot' || !isSupplyTransportBattle()) return Math.random();
      const enemyAnchor = getCampAnchor('enemy');
      const playerAnchor = getCampAnchor('player');
      const enemyDistance = manhattan(x, y, enemyAnchor.x, enemyAnchor.y);
      const playerDistance = manhattan(x, y, playerAnchor.x, playerAnchor.y);
      return enemyDistance * 5 - playerDistance * 2 + Math.abs(y - 3) * 2 + Math.random();
    }

    function findStrategicPointSlot(type, used) {
      const candidates = [];
      const playerAnchor = getCampAnchor('player');
      const enemyAnchor = getCampAnchor('enemy');
      let tries = 0;
      while (tries < 120) {
        tries++;
        const x = randInt(1, COLS - 2), y = randInt(1, ROWS - 2);
        const k = cellKey(x, y);
        if (used.has(k)) continue;
        const t = getTerrain(x, y);
        if (isRiverTerrain(t) || isBridgeTerrain(t)) continue;
        if (PLAYER_DEPLOY_ROWS.includes(y) || ENEMY_DEPLOY_ROWS.includes(y)) continue;
        if (isStrongpointBattle()) {
          if (
            manhattan(x, y, playerAnchor.x, playerAnchor.y) < STRONGPOINT_MIN_CAMP_DISTANCE ||
            manhattan(x, y, enemyAnchor.x, enemyAnchor.y) < STRONGPOINT_MIN_CAMP_DISTANCE
          ) {
            continue;
          }
          if (
            strategicPoints.some(point =>
              manhattan(x, y, point.x, point.y) < STRONGPOINT_MIN_POINT_DISTANCE
            )
          ) {
            continue;
          }
        }
        candidates.push({ x, y, score: scoreStrategicPoint(type, x, y) });
      }
      if (!candidates.length && isStrongpointBattle()) {
        const relaxedCandidates = [];
        tries = 0;
        while (tries < 120) {
          tries++;
          const x = randInt(1, COLS - 2), y = randInt(1, ROWS - 2);
          const k = cellKey(x, y);
          if (used.has(k)) continue;
          const t = getTerrain(x, y);
          if (isRiverTerrain(t) || isBridgeTerrain(t)) continue;
          if (PLAYER_DEPLOY_ROWS.includes(y) || ENEMY_DEPLOY_ROWS.includes(y)) continue;
          if (
            manhattan(x, y, playerAnchor.x, playerAnchor.y) < Math.max(2, STRONGPOINT_MIN_CAMP_DISTANCE - 1) ||
            manhattan(x, y, enemyAnchor.x, enemyAnchor.y) < Math.max(2, STRONGPOINT_MIN_CAMP_DISTANCE - 1)
          ) {
            continue;
          }
          if (
            strategicPoints.some(point =>
              manhattan(x, y, point.x, point.y) < Math.max(2, STRONGPOINT_MIN_POINT_DISTANCE - 1)
            )
          ) {
            continue;
          }
          relaxedCandidates.push({ x, y, score: scoreStrategicPoint(type, x, y) });
        }
        if (relaxedCandidates.length) {
          relaxedCandidates.sort((a, b) => a.score - b.score);
          const pool = relaxedCandidates.slice(0, Math.min(4, relaxedCandidates.length));
          return pool[randInt(0, pool.length - 1)];
        }
      }
      if (!candidates.length) return null;
      candidates.sort((a, b) => a.score - b.score);
      const pool = candidates.slice(0, Math.min(4, candidates.length));
      return pool[randInt(0, pool.length - 1)];
    }

    function generateMap() {
      grid = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          let terrain = 'plain';
          const r = Math.random();
          if (r < 0.16) terrain = 'forest';
          else if (r < 0.24) terrain = 'hill';
          grid.push({ x, y, terrain });
        }
      }

      const riverY = randInt(2, 4);
      const bridgeX = randInt(2, COLS - 3);
      for (let x = 0; x < COLS; x++) {
        const c = getCell(x, riverY);
        c.terrain = x === bridgeX ? 'bridge' : 'river';
      }

      strategicPoints = [];
      playerCamp = null;
      enemyCamp = null;
      droppedSupplies = [];

      const types = isSupplyTransportBattle()
        ? ['supplyDepot', 'watchTower']
        : isStrongpointBattle()
          ? STRONGPOINT_TYPES
          : ['camp', 'supplyDepot', 'watchTower'];
      const used = new Set([cellKey(bridgeX, riverY)]);

      for (const type of types) {
        const slot = findStrategicPointSlot(type, used);
        if (!slot) continue;
        used.add(cellKey(slot.x, slot.y));
        strategicPoints.push({
          id: type + '_' + slot.x + slot.y,
          type,
          x: slot.x,
          y: slot.y,
          owner: 'neutral',
          captureSide: null,
          captureProgress: 0,
        });
      }

      if (!isSupplyTransportBattle() && !strategicPoints.some(p => p.type === 'camp')) {
        let tries = 0;
        while (tries < 80) {
          tries++;
          const x = randInt(1, COLS - 2), y = randInt(2, 4);
          const k = cellKey(x, y);
          if (used.has(k)) continue;
          if (isRiverTerrain(getTerrain(x, y))) continue;
          used.add(k);
          strategicPoints.push({ id: 'camp_' + x + y, type: 'camp', x, y, owner: 'neutral', captureSide: null, captureProgress: 0 });
          break;
        }
      }

      placeFactionCamps(used);
    }

    function placeFactionCamps(used) {
      const playerCells = [
        { x: 1, y: 8 }, { x: 2, y: 8 }, { x: 1, y: 9 }, { x: 2, y: 9 },
      ];
      const enemyCells = [
        { x: COLS - 3, y: 0 }, { x: COLS - 2, y: 0 }, { x: COLS - 3, y: 1 }, { x: COLS - 2, y: 1 },
      ];

      playerCamp = { side: 'player', cells: playerCells.filter(c => {
        const k = cellKey(c.x, c.y);
        if (used.has(k)) return false;
        used.add(k);
        const cell = getCell(c.x, c.y);
        if (cell) cell.campZone = 'player';
        return true;
      }) };

      enemyCamp = { side: 'enemy', cells: enemyCells.filter(c => {
        const k = cellKey(c.x, c.y);
        if (used.has(k)) return false;
        used.add(k);
        const cell = getCell(c.x, c.y);
        if (cell) cell.campZone = 'enemy';
        return true;
      }) };
    }

    function pickObjective() {
      if (battleConfig.objectiveId) {
        battleObjective = OBJECTIVES.find(o => o.id === battleConfig.objectiveId) || OBJECTIVES[0];
      } else {
        battleObjective = OBJECTIVES[randInt(0, OBJECTIVES.length - 1)];
      }
      defenseHoldTurns = 0;
      turnCounter = 0;
      updateObjectiveBar();
    }

    function inferLessonTags() {
      const tags = [];
      if (grid.some(c => c.terrain === 'bridge')) tags.push('BridgeBattle');
      if (battleObjective?.id === 'supplyTransport') tags.push('SupplyTransportBattle');
      if (battleObjective?.id === 'defense') tags.push('DefenseBattle');
      if (grid.some(c => c.terrain === 'forest')) tags.push('AmbushBattle');
      if (battleObjective?.id === 'assassination') tags.push('CommanderBattle');
      return tags;
    }

    function getObjectiveProgressText() {
      if (!battleObjective || phase === 'deploy') return '';
      const obj = battleObjective;
      if (obj.id === 'defense') {
        const defenders = activeUnits('player').filter(u => DEFENSE_ZONE_ROWS.includes(u.y)).length;
        const intruders = activeUnits('enemy').filter(u => DEFENSE_ZONE_ROWS.includes(u.y)).length;
        const remain = Math.max(0, DEFENSE_HOLD_REQUIRED - defenseHoldTurns);
        return `${getDefenseZoneLabel()} · 守卫进度 ${defenseHoldTurns}/${DEFENSE_HOLD_REQUIRED} · 我军 ${defenders}/${DEFENSE_PLAYER_UNITS_REQUIRED} · 敌军 ${intruders} · 还需${remain}回合`;
      }
      if (obj.id === 'strongpoint') {
        const owned = strategicPoints.filter(p => p.owner === 'player').length;
        return `据点进度 ${owned}/${strategicPoints.length}`;
      }
      if (obj.id === 'supplyTransport') {
        const cart = getCart('player');
        if (cart) {
          return `粮车生命 ${cart.soldiers}/${cart.maxSoldiers} · 距营地 ${distToCamp(cart)} 格`;
        }
        const depot = getSupplyDepot();
        if (depot?.owner === 'player') return '等待粮车出发或已在途中';
        if (depot?.captureSide === 'player') return '正在占领粮仓…';
        if (droppedSupplies.length) return '战场上有散落粮食';
        return '向粮仓进军并占领';
      }
      if (obj.id === 'assassination') {
        const enemyCommander = getCommander('enemy');
        const playerCommander = getCommander('player');
        if (!enemyCommander) return '敌将已被击败';
        const playerStatus = playerCommander
          ? `我方主将 ${playerCommander.general.name} ${playerCommander.soldiers}/${playerCommander.maxSoldiers}`
          : '我方主将未设定';
        return `敌将 ${enemyCommander.general.name} 仍在阵上 · ${playerStatus}`;
      }
      if (obj.id === 'annihilation') {
        const n = activeUnits('enemy').length;
        return n ? `仍有 ${n} 支敌军可战` : '敌军已无战意';
      }
      return '';
    }

    function updateObjectiveBar() {
      const bar = document.getElementById('objective-bar');
      const prog = document.getElementById('objective-progress');
      if (!battleObjective) {
        bar.textContent = '战斗目标：—';
        prog.textContent = '';
        return;
      }
      bar.textContent = isSupplyTransportBattle()
        ? `【护送粮车】${battleObjective.friendlyDesc}`
        : `【${battleObjective.friendlyTitle}】${battleObjective.friendlyDesc}`;
      prog.textContent = phase === 'battle' ? getObjectiveProgressText() : '';
      if (isSupplyTransportBattle() && phase === 'battle') {
        const cart = getCart('player');
        const sub = cart
          ? `当前目标：护送粮车返回营地 · 粮车 ${cart.soldiers}/${cart.maxSoldiers} · 距营地 ${distToCamp(cart)} 格`
          : '当前目标：护送粮车返回营地';
        prog.textContent = getObjectiveProgressText() ? `${sub} · ${getObjectiveProgressText()}` : sub;
      }
    }

    function showObjectiveIntro() {
      if (!battleObjective) return;
      document.getElementById('objective-intro-title').textContent = `【${battleObjective.friendlyTitle}】`;
      document.getElementById('objective-intro-desc').textContent = getObjectiveDescription(battleObjective);
