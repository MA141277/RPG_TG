      transformOrigin = 'center center',
      anchorTranslateX = '-50%',
      anchorTranslateY = '-50%',
      motionStartFrame = null,
      motionEndFrame = null,
      startAt,
      frameDurationMs = 16,
      frame,
      fadeInFrames = 2,
      holdFrames = 1,
      fadeOutFrames = 4,
    }) {
      if (!(layer instanceof HTMLElement) || !imageSrc || !position) return;
      const anchor = acquireBattleTimedImageEffectAnchor();
      anchor.style.left = `${position.x}px`;
      anchor.style.top = `${position.y}px`;
      const image = anchor.__battleEffectImage || anchor.querySelector('.battle-impact-effect-image');
      if (!(image instanceof HTMLImageElement)) return;
      image.src = imageSrc;
      image.style.setProperty('--battle-impact-effect-width', `${width}px`);
      image.style.setProperty('--battle-impact-effect-rotation', `${rotationDeg}deg`);
      image.style.setProperty('--battle-impact-effect-filter', filter || 'none');
      image.style.setProperty('--battle-impact-effect-scale', `${startScale}`);
      image.style.setProperty('--battle-impact-effect-transform-origin', transformOrigin);
      image.style.setProperty('--battle-impact-effect-translate-x', anchorTranslateX);
      image.style.setProperty('--battle-impact-effect-translate-y', anchorTranslateY);
      layer.appendChild(anchor);
      battleTimedImageEffectAnchors.add(anchor);

      const frameMs = Math.max(16, Number(frameDurationMs) || 16);
      const animationStartAt = Number(startAt) || performance.now();
      const effectFrame = Number(frame) || 0;
      const visibleStartFrame = effectFrame - Math.max(0, Number(fadeInFrames) || 0);
      const visibleDurationFrames = Math.max(
        0.001,
        (Number(fadeInFrames) || 0) + (Number(holdFrames) || 0) + (Number(fadeOutFrames) || 0),
      );
      const effectEndAt = animationStartAt + (effectFrame + holdFrames + fadeOutFrames) * frameMs;
      const resolvedMotionStartFrame = Number.isFinite(motionStartFrame)
        ? Number(motionStartFrame)
        : visibleStartFrame;
      const resolvedMotionEndFrame = Number.isFinite(motionEndFrame)
        ? Math.max(resolvedMotionStartFrame + 0.001, Number(motionEndFrame))
        : visibleStartFrame + visibleDurationFrames;

      const tick = (now) => {
        const currentFrame = (now - animationStartAt) / frameMs;
        const alpha = getBattleFrameEffectAlphaAtFrame(
          currentFrame,
          effectFrame,
          fadeInFrames,
          holdFrames,
          fadeOutFrames,
        );
        const motionProgress = Math.max(
          0,
          Math.min(1, (currentFrame - resolvedMotionStartFrame) / Math.max(0.001, resolvedMotionEndFrame - resolvedMotionStartFrame)),
        );
        image.style.opacity = String(alpha);
        anchor.style.left = `${position.x + motionX * motionProgress}px`;
        anchor.style.top = `${position.y + motionY * motionProgress}px`;
        image.style.setProperty(
          '--battle-impact-effect-scale',
          `${startScale + (endScale - startScale) * motionProgress}`,
        );
        if (now < effectEndAt && alpha > 0 || now < effectEndAt) {
          anchor.__battleEffectRaf = window.requestAnimationFrame(tick);
          return;
        }
        if (anchor.__battleEffectRaf) {
          window.cancelAnimationFrame(anchor.__battleEffectRaf);
          delete anchor.__battleEffectRaf;
        }
        releaseBattleTimedImageEffectAnchor(anchor);
      };
      anchor.__battleEffectRaf = window.requestAnimationFrame(tick);
    }

    function queueBattleArcherRemoteReservedAttackEffects({ sourceSlot, sourceSide, sourceAnchor, targetAnchor, targetSlot, hit, startAt, frameDurationMs }) {
      const layer = document.getElementById('battle-damage-layer')
        || document.querySelector('.formation-battle-box');

      const angleDeg = getBattleDirectionAngleDeg(sourceAnchor, targetAnchor);

      const trailPosition = getBattleArcherLaunchAnchorPosition(

      const trailMotion = getBattleDirectionalOffset(

      const rawImpactAnchor = getBattleImpactEffectAnchorPosition(targetSlot, layerRect);
      const playerArcherLineOffsetX = sourceSide === 'player' ? -40 : 0;
      const baseImpactAnchor = {

      };
      const impactAnchor = {

      const baseFlightStart = getBattleArcherLineStartPosition(

      const missEndOffsetDistance = Number(BATTLE_ARCHER_REMOTE_RESERVED_EFFECTS.flight.missEndOffsetDistance) || 60;
      const missEndOffsetAngleDeg = Number(BATTLE_ARCHER_REMOTE_RESERVED_EFFECTS.flight.missEndOffsetAngleDeg) || 60;
      const missEndRadians = missEndOffsetAngleDeg * Math.PI / 180;
      const missEndDirectionX = (sourceSide === 'enemy' ? -1 : 1) * Math.cos(missEndRadians);
      const missEndDirectionY = Math.sin(missEndRadians);
      const missFlightEnd = {

      };
      const flightRotationDeg = sourceSide === 'enemy' ? -laneAngleDeg : 180 + laneAngleDeg;
      getBattleArcherRemoteReservedAttackEffectPlan(hit).forEach(effect => {

          });

        if (effect.kind === 'arrow') {

            transformOrigin: '0% 50%',

          const stageConfig = effect.kind === 'stage1'

          queueBattleTimedImageEffect({

    function queueBattleArcherAttackEffects({ sourceSlot, sourceSide, sourceAnchor, targetAnchor, targetSlot, hit, startAt, frameDurationMs }) {
      const layer = document.getElementById('battle-damage-layer')
        || document.querySelector('.formation-battle-box');
      if (!(layer instanceof HTMLElement)) return;
      const layerRect = layer.getBoundingClientRect();
      const sideDirection = getBattleArcherSideDirection(sourceSide);
      const shotAnchor = getBattleArcherLaunchAnchorPosition(
        sourceSlot,
        layerRect,
        sourceSide,
        targetAnchor,
        0,
        0,
      );
      const rawImpactAnchor = getBattleImpactEffectAnchorPosition(targetSlot, layerRect);
      const impactAnchor = {
        x: rawImpactAnchor.x - (sourceSide === 'enemy' ? 130 : 90),
        y: rawImpactAnchor.y,
      };
      const trailConfig = BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.trail;
      const arrowConfig = BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.arrow;
      const stage1Config = BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage1;
      const stage2Config = BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage2;
      const trailPosition = {
        x: shotAnchor.x + sideDirection * trailConfig.spawnForwardOffsetX,
        y: shotAnchor.y + trailConfig.spawnOffsetY,
      };
      const trailRotationDeg = Number(trailConfig.rotationDegBySide[sourceSide]) || 0;
      const arrowRotationDeg = Number(arrowConfig.rotationDegBySide[sourceSide]) || 0;
      const impactRotationDeg = arrowRotationDeg;
      const arrowOutEndPosition = {
        x: shotAnchor.x + sideDirection * arrowConfig.speedPx,
        y: shotAnchor.y,
      };
      const arrowInStartPosition = {
        x: impactAnchor.x - sideDirection * arrowConfig.speedPx,
        y: impactAnchor.y,
      };
      const arrowSegmentFrames = Math.max(1, arrowConfig.impactFrame - arrowConfig.reappearFrame);
      const arrowSpeedPerFrame = Math.max(1, arrowConfig.speedPx / arrowSegmentFrames);
      const arrowMissExitPosition = {
        x: sideDirection > 0 ? layerRect.width + arrowConfig.width : -arrowConfig.width,
        y: impactAnchor.y,
      };
      const arrowMissTailFrames = Math.max(
        1,
        Math.ceil(Math.abs(arrowMissExitPosition.x - impactAnchor.x) / arrowSpeedPerFrame),

      getBattleArcherActiveAttackEffectPlan(hit).forEach(effect => {

            layer,

            width: trailConfig.width,
            motionX: -sideDirection * trailConfig.motionDistance,
            motionY: 0,
            startScale: 1,
            endScale: trailConfig.endScale,
            anchorTranslateX: '-50%',
            anchorTranslateY: '-50%',
            startAt,
            frameDurationMs,
            frame: effect.frame,

          });
          return;
        }
        if (effect.kind === 'arrow-in') {
          queueBattleTimedImageEffect({
            layer,
            imageSrc: arrowConfig.src,
            position: arrowInStartPosition,

            motionX: impactAnchor.x - arrowInStartPosition.x,

            endScale: 1,

        if (effect.kind === 'stage1' || effect.kind === 'stage2') {

            anchorTranslateX: '0%',

            frame: effect.frame,
            fadeInFrames: effect.fadeInFrames,
            holdFrames: effect.holdFrames,

          });
          return;
        }
        if (effect.kind === 'arrow-miss-tail') {
          queueBattleTimedImageEffect({
            layer,
            imageSrc: arrowConfig.src,
            position: impactAnchor,
            rotationDeg: arrowRotationDeg,
            width: arrowConfig.width,
            motionX: arrowMissExitPosition.x - impactAnchor.x,
            motionY: 0,
            startScale: 1,
            endScale: 1,
            transformOrigin: '0% 50%',
            anchorTranslateX: '0%',
            anchorTranslateY: '-50%',
            startAt,
            frameDurationMs,
            frame: effect.frame,
            fadeInFrames: 0,
            holdFrames: arrowMissTailFrames,
            fadeOutFrames: 0,

            motionEndFrame: effect.frame + arrowMissTailFrames,
          });

      });
    }

    function animateBattleSpineProxy(proxy, renderer, from, to, action, duration, movement = {}) {
      return new Promise(resolve => {
                const start = performance.now();
        const frameDurationMs = 1000 / Math.max(1, renderer.fps || 60);
        const impactPeakAt = movement.impactFrame != null
          ? start + movement.impactFrame * frameDurationMs
          : start;
        const effectPeakAt = movement.impactFrame != null
          ? impactPeakAt
          : start + ((movement.effectFrame ?? 0) + 1) * frameDurationMs;
        let impactTriggered = false;
        let effectTriggered = false;
        const renderGate = createBattleSpineFrameGate(frameDurationMs);
        const motionElement = proxy.closest('.battle-spine-proxy-anchor') || proxy;
        const frame = now => {
          const t = Math.min(1, (now - start) / duration);
          const elapsedMs = now - start;
          const actionFrame = (elapsedMs / 1000) * renderer.fps;
          const moveStartFrame = movement.moveStartFrame ?? 0;
          const moveEndFrame = Math.max(moveStartFrame + 0.001, movement.moveEndFrame ?? moveStartFrame);
          const moveT = movement.moveStartFrame == null
            ? t
            : Math.max(0, Math.min(1, (actionFrame - moveStartFrame) / (moveEndFrame - moveStartFrame)));
          const arcHeight = Number(movement.arcHeight) || 0;
          const arcOffsetY = arcHeight > 0 ? -4 * arcHeight * moveT * (1 - moveT) : 0;
          motionElement.style.setProperty('--battle-proxy-x', `${from.x + (to.x - from.x) * moveT}px`);
          motionElement.style.setProperty('--battle-proxy-y', `${from.y + (to.y - from.y) * moveT + arcOffsetY}px`);
          if (renderGate.shouldRender(elapsedMs, duration)) {
            renderer.render(proxy, action, elapsedMs, {
              loop: false,
              side: proxy.dataset.side || (proxy.classList.contains('enemy') ? 'enemy' : 'player'),
            });
          }
          movement.onFrame?.({
            startAt: start,
            now,
            elapsedMs,
            actionFrame,
            frameDurationMs,
            moveT,
          });
          if (
            !impactTriggered &&
            movement.impactFrame != null &&
            actionFrame >= movement.impactFrame
          ) {
            impactTriggered = true;
                        movement.onImpact?.({ peakAt: impactPeakAt, frameDurationMs, startAt: start, now });
          }
          if (
            !effectTriggered &&
            movement.effectFrame != null &&
            actionFrame >= movement.effectFrame
          ) {
            effectTriggered = true;
            movement.onEffect?.({ peakAt: effectPeakAt, frameDurationMs, startAt: start, now });
          }
          if (t < 1) requestAnimationFrame(frame);
          else {
            if (!impactTriggered && movement.impactFrame != null) {
              movement.onImpact?.({ peakAt: impactPeakAt, frameDurationMs, startAt: start, now });
            }
            if (!effectTriggered && movement.effectFrame != null) {
              movement.onEffect?.({ peakAt: effectPeakAt, frameDurationMs, startAt: start, now });
            }
            movement.onFrame?.({
              startAt: start,
              now,
              elapsedMs: duration,
              actionFrame: renderer.getActionFrameCount(action),
              frameDurationMs,
              moveT: 1,
            });
            resolve();
          }
        };
        requestAnimationFrame(frame);
      });
    }

    function getBattleRandomLandingOffset(radius = 20) {
      if (!(radius > 0)) {
        return { x: 0, y: 0 };
      }
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.sqrt(Math.random()) * radius;
      const candidate = {
        x: Math.cos(angle) * distance,
        y: Math.sin(angle) * distance,
      };
      battleRecentLandingOffsets.push(candidate);
      if (battleRecentLandingOffsets.length > 8) {
        battleRecentLandingOffsets.splice(0, battleRecentLandingOffsets.length - 8);
      }
      return candidate;
    }

    function getBattleLandingTargetPosition(targetAnchor, troopAsset, proxySide) {
      if (troopAsset?.stationaryAttack) {
        return { x: targetAnchor.x, y: targetAnchor.y };
      }
      const scatterRadius = troopAsset?.landingScatterRadius != null
        ? Math.max(0, Number(troopAsset.landingScatterRadius) || 0)
        : 20;
      const landingScatter = getBattleRandomLandingOffset(scatterRadius);
      const landingBackOffsetX = troopAsset?.landingBackOffsetXBySide
        ? Number(troopAsset.landingBackOffsetXBySide[proxySide]) || 0
        : (proxySide === 'enemy' ? 120 : -120);
      return {
        x: targetAnchor.x + landingScatter.x + landingBackOffsetX,
        y: targetAnchor.y + landingScatter.y,
      };
    }

    function getBattleJumpArcHeight(from, to) {
      const horizontalDistance = Math.abs((to?.x || 0) - (from?.x || 0));
      return clamp(horizontalDistance * 0.22, 36, 82);
    }

    function createBattleSpineFrameGate(frameDurationMs) {
      const safeFrameDuration = Math.max(1, Number(frameDurationMs) || 1000 / 36);
      let lastFrameBucket = -1;
      let renderedFinalFrame = false;
      return {
        shouldRender(elapsedMs, durationMs = Infinity) {
          const currentElapsedMs = Math.max(0, Number(elapsedMs) || 0);
          const totalDurationMs = Number.isFinite(durationMs) ? Math.max(0, Number(durationMs) || 0) : Infinity;
          const isFinalFrame = Number.isFinite(totalDurationMs) && currentElapsedMs >= totalDurationMs;
          const frameBucket = Math.floor(currentElapsedMs / safeFrameDuration);
          if (isFinalFrame) {
            if (renderedFinalFrame && frameBucket === lastFrameBucket) return false;
            lastFrameBucket = frameBucket;
            renderedFinalFrame = true;
            return true;
          }
          if (frameBucket === lastFrameBucket) return false;
          lastFrameBucket = frameBucket;
          renderedFinalFrame = false;
          return true;
        },
      };
    }

        function animateBattleSpineCanvas(canvas, renderer, action, duration, movement = {}) {
      return new Promise(resolve => {
        const start = performance.now();
        const frameDurationMs = 1000 / Math.max(1, renderer.fps || 60);
        const impactPeakAt = movement.impactFrame != null
          ? start + movement.impactFrame * frameDurationMs
          : start;
        let impactTriggered = false;
        const renderGate = createBattleSpineFrameGate(frameDurationMs);

    function queueBattleWhiteFlash(slot, peakAt, frameDurationMs = 16) {
      if (!(slot instanceof HTMLElement)) return;
      const peakTime = Number(peakAt);
      const frameMs = Math.max(16, Number(frameDurationMs) || 16);
      const fadeInMs = frameMs * 2;
      const holdMs = frameMs * 4;
      const fadeOutMs = frameMs * 2;
      if (!Number.isFinite(peakTime)) return;
      const events = Array.isArray(slot.__battleWhiteFlashEvents) ? slot.__battleWhiteFlashEvents : [];
      const lastEvent = events.length ? events[events.length - 1] : null;

      if (lastEvent) {
        const peakDeltaMs = peakTime - lastEvent.peakAt;
        if (Math.abs(peakDeltaMs) < frameMs * 0.35) {
          lastEvent.startAt = Math.min(lastEvent.startAt, peakTime - fadeInMs);
          lastEvent.peakAt = Math.max(lastEvent.peakAt, peakTime);
          lastEvent.holdEndAt = Math.max(lastEvent.holdEndAt || lastEvent.peakAt, lastEvent.peakAt + holdMs);
          lastEvent.endAt = lastEvent.holdEndAt + fadeOutMs;
          lastEvent.startIntensity = 0;
          slot.__battleWhiteFlashEvents = events;
          battleWhiteFlashActiveSlots.add(slot);
          if (!battleWhiteFlashActiveRaf) battleWhiteFlashActiveRaf = window.requestAnimationFrame(updateBattleWhiteFlashState);
          return;
        }
        if (peakDeltaMs > 0 && peakDeltaMs < holdMs + fadeOutMs) {
          const lastHoldEndAt = lastEvent.holdEndAt || lastEvent.peakAt;
          const junctionAt = Math.max(lastHoldEndAt, peakTime - fadeInMs);
          let startIntensity = 0;
          if (junctionAt <= lastHoldEndAt) {
            startIntensity = 1;
          } else {
            startIntensity = Math.max(0, 1 - ((junctionAt - lastHoldEndAt) / fadeOutMs));
          }
          lastEvent.endAt = junctionAt;
          lastEvent.holdEndAt = Math.min(lastHoldEndAt, junctionAt);
          events.push({
            startAt: junctionAt,
            peakAt: peakTime,
            holdEndAt: peakTime + holdMs,
            endAt: peakTime + holdMs + fadeOutMs,
            startIntensity,
          });
          slot.__battleWhiteFlashEvents = events;
          battleWhiteFlashActiveSlots.add(slot);
          if (!battleWhiteFlashActiveRaf) battleWhiteFlashActiveRaf = window.requestAnimationFrame(updateBattleWhiteFlashState);
          return;
        }
      }

            events.push({
        startAt: peakTime - frameMs * 2,
        peakAt: peakTime,
        holdEndAt: peakTime + frameMs * 4,
        endAt: peakTime + frameMs * 6,
        startIntensity: 0,
      });
      slot.__battleWhiteFlashEvents = events;
      battleWhiteFlashActiveSlots.add(slot);
      if (!battleWhiteFlashActiveRaf) battleWhiteFlashActiveRaf = window.requestAnimationFrame(updateBattleWhiteFlashState);

    function updateBattleWhiteFlashState(now) {
      battleWhiteFlashActiveRaf = 0;
      battleWhiteFlashActiveSlots.forEach(slot => {
        const events = (slot.__battleWhiteFlashEvents || []).filter(event => now < event.endAt);
        if (!events.length) {
                    slot.classList.remove('hit-white-flash');
          slot.style.removeProperty('--hit-white-opacity');
          delete slot.__battleWhiteFlashEvents;
          battleWhiteFlashActiveSlots.delete(slot);
          return;
        }

        const activeEvent = events[0];
        let intensity = 0;
        if (now < activeEvent.startAt) {
          intensity = 0;
        } else if (now <= activeEvent.peakAt) {
          intensity = activeEvent.startIntensity + (1 - activeEvent.startIntensity) * Math.max(0, Math.min(1, (now - activeEvent.startAt) / Math.max(1, activeEvent.peakAt - activeEvent.startAt)));
        } else if (now <= activeEvent.holdEndAt) {
          intensity = 1;
        } else {
          intensity = Math.max(0, Math.min(1, 1 - ((now - activeEvent.holdEndAt) / Math.max(1, activeEvent.endAt - activeEvent.holdEndAt))));

        slot.style.setProperty('--hit-white-opacity', String(intensity));

        const distance = Math.sqrt(Math.random()) * radius;

        attempt += 1;

    async function playScheduledFormationSideBlock(report, strikes, state) {
      clearBattleModelShakeState();
      clearBattleTimedImageEffects();
      battleRecentLandingOffsets.length = 0;
      const ordered = strikes
        .slice()
        .sort((a, b) => (Number(a.launchAtMs) || 0) - (Number(b.launchAtMs) || 0));
      const batchActiveState = buildBattleBatchActiveState(ordered);
      renderBattleAnimationState(report, state.attackerSnapshot, state.defenderSnapshot, batchActiveState);
      const running = [];
      let previousLaunchAtMs = 0;
      for (const step of ordered) {
        const launchAtMs = Math.max(0, Number(step.launchAtMs) || 0);
        const waitMs = Math.max(0, launchAtMs - previousLaunchAtMs);
        previousLaunchAtMs = launchAtMs;
        if (waitMs > 0) await sleep(waitMs);
        running.push(playSingleFormationStrike(report, step, state, batchActiveState));
      }
      await Promise.all(running);
      const lastStep = ordered[ordered.length - 1];
      renderBattleAnimationState(
        report,
        state.attackerSnapshot,
        state.defenderSnapshot,
        lastStep
          ? {
              sourceSide: lastStep.sourceSide,
              sourceSlotKey: lastStep.sourceSlotKey,
              targetSide: lastStep.targetSide,
              targetSlotKey: lastStep.targetSlotKey,
            }
          : {}
      );
      await sleep(60);
    }

    async function playFormationStrikeBatch(report, steps, state) {
      let launchAtMs = 0;
      const normalizedSteps = steps.map((step, index) => {
        const normalized = {
          ...step,
          launchAtMs: Number.isFinite(Number(step.launchAtMs)) ? Number(step.launchAtMs) : launchAtMs,
        };
        if (!Number.isFinite(Number(step.launchAtMs))) {
          let stepDelayMs = Number(step.delayMs) || 0;
          if ((step.delayFrames || 0) > 0) {
            stepDelayMs = step.delayFrames * (1000 / 36);
          }
          if (index < steps.length - 1) {
            launchAtMs += stepDelayMs;
          }
        }
        return normalized;
      });
      return playScheduledFormationSideBlock(report, normalizedSteps, state);
    }

    async function playFormationBattleTimeline(report) {
      const closeBtn = document.getElementById('battle-close');
      closeBtn.disabled = true;
      closeBtn.textContent = '演出中...';
      document.getElementById('battle-event-list').innerHTML = '';
      let attackerSnapshot = report.attackerBefore;
      let defenderSnapshot = report.defenderBefore;
      renderBattleAnimationState(report, attackerSnapshot, defenderSnapshot);
      startBattleSpineIdleLoop();

      for (let index = 0; index < report.timeline.length; index++) {
        const step = report.timeline[index];
        if (step.type === 'round' || step.type === 'entry') {
          appendBattleEvent(step);
          await sleep(step.type === 'round' ? BATTLE_TIMELINE_ROUND_PAUSE_MS : BATTLE_TIMELINE_ENTRY_PAUSE_MS);
          continue;
        }
        const strikeBatch = [step];
        while (
          index + 1 < report.timeline.length &&
          report.timeline[index + 1].type === 'strike' &&
          report.timeline[index + 1].sourceSide === step.sourceSide
        ) {
          strikeBatch.push(report.timeline[index + 1]);
          index++;

        const state = { attackerSnapshot, defenderSnapshot };
        await playScheduledFormationSideBlock(report, strikeBatch, state);
        attackerSnapshot = state.attackerSnapshot;
        defenderSnapshot = state.defenderSnapshot;

        configureBattleSpineCanvasMetrics(portraitEntry.canvas);
        if (shouldPlayPortraitHit) {
          syncBattleWhiteFlashOverlayCanvas(portraitEntry.canvas);
          queueBattleWhiteFlash(portraitEntry.root, performance.now() + 90, 16);
          queueBattleModelShake(portraitEntry.root, performance.now() + 90, 16);
        }
      }
      if (portraitTitle) {
        portraitTitle.textContent = activeSnapshot?.generalName || sideState.leaderName || '';
      }
      if (portraitSubtitle) {
        portraitSubtitle.textContent = TROOP_TYPES[sideState.captainTroopType]?.label || sideState.captainTroopType || '';
      }
      if (sideLabel) sideLabel.textContent = sideState.sideLabel;
      if (leaderName) leaderName.textContent = sideState.leaderName;
      if (captainName) captainName.textContent = sideState.captainName;
      if (moraleValue) {
        moraleValue.textContent = String(Math.round(settled ? sideState.moraleAfter : sideState.moraleBefore));
      }
      if (moraleFill) {
        moraleFill.style.width = `${clamp(settled ? sideState.moraleAfter : sideState.moraleBefore, 0, 100)}%`;
      }

      sideState.slots.forEach((slotState) => {
        const slotElement = panel.querySelector(`[data-slot-key="${slotState.slotKey}"]`);
        if (!slotElement) return;
        const activeMember = settled ? (slotState.after || slotState.before) : (slotState.before || slotState.after);
        const beforeSoldiers = slotState.before?.soldiers ?? slotState.after?.soldiers ?? 0;
        const activeSoldiers = settled
          ? (slotState.after?.soldiers ?? slotState.before?.soldiers ?? 0)
          : (slotState.before?.soldiers ?? slotState.after?.soldiers ?? 0);
        const maxSoldiers = activeMember?.maxSoldiers || slotState.before?.maxSoldiers || slotState.after?.maxSoldiers || 0;
        const hpRatio = maxSoldiers > 0 ? clamp((activeSoldiers / maxSoldiers) * 100, 0, 100) : 0;
        const slotIcon = slotElement.querySelector('[data-quick-role="slot-icon"]');
        const slotName = slotElement.querySelector('[data-quick-role="slot-name"]');
        const slotCaptain = slotElement.querySelector('[data-quick-role="slot-captain"]');
        const slotHpFill = slotElement.querySelector('[data-quick-role="slot-hp-fill"]');
        const slotHpText = slotElement.querySelector('[data-quick-role="slot-hp-text"]');
        const slotLoss = slotElement.querySelector('[data-quick-role="slot-loss"]');

        slotElement.classList.toggle('is-empty', !activeMember);
        slotElement.classList.toggle('is-captain', slotState.isCaptain);
        slotElement.classList.toggle('is-fallen', Boolean(settled && activeMember && activeSoldiers <= 0));
        slotElement.classList.toggle('is-damaged', Boolean(settled && slotState.loss > 0));

        if (slotIcon) {
          if (activeMember) {
            slotIcon.style.setProperty('--unit-sprite', `url("${getQuickBattleMemberSprite(sideState.side, activeMember)}")`);
            slotIcon.style.opacity = '1';
          } else {
            slotIcon.style.removeProperty('--unit-sprite');
            slotIcon.style.opacity = '0.18';
          }
        }
        if (slotName) {
          slotName.textContent = activeMember
            ? TROOP_TYPES[activeMember.troopType]?.label || activeMember.name || ''
            : '空位';
        }
        if (slotCaptain) {
          slotCaptain.style.display = slotState.isCaptain ? 'inline-flex' : 'none';
        }
        if (slotHpFill) {
          slotHpFill.style.width = `${hpRatio}%`;
        }
        if (slotHpText) {
          if (!activeMember) {
            slotHpText.textContent = '--';
          } else if (settled) {
            animateQuickBattleSlotHp(slotHpText, beforeSoldiers, activeSoldiers);
          } else {
            slotHpText.textContent = `${activeSoldiers}/${maxSoldiers}`;
          }
        }
        if (slotLoss) {
          slotLoss.textContent = settled && slotState.loss > 0 ? `损失 ${slotState.loss}` : '';
        }
      });
    }

    function animateQuickBattleMorale(panel, fromValue, toValue) {
      const valueElement = panel?.querySelector('[data-quick-role="morale-value"]');
      const fillElement = panel?.querySelector('[data-quick-role="morale-fill"]');
      if (!valueElement || !fillElement) return;
      const start = performance.now();
      const durationMs = 1000;
      const from = Number.isFinite(fromValue) ? fromValue : 0;
      const to = Number.isFinite(toValue) ? toValue : 0;
      valueElement.textContent = String(Math.round(from));
      fillElement.style.width = `${clamp(from, 0, 100)}%`;

      function tick(now) {
        const ratio = clamp((now - start) / durationMs, 0, 1);
        const nextValue = from + (to - from) * ratio;
        valueElement.textContent = String(Math.round(nextValue));
        fillElement.style.width = `${clamp(nextValue, 0, 100)}%`;
        if (ratio < 1) {
          window.requestAnimationFrame(tick);
        }
      }

      window.requestAnimationFrame(tick);
    }

    function animateQuickBattleSlotHp(slotHpText, fromValue, toValue) {
      if (!slotHpText) return;
      const start = performance.now();
      const durationMs = 1000;
      const from = Math.max(0, Number(fromValue) || 0);
      const to = Math.max(0, Number(toValue) || 0);
      const maxValue = Math.max(from, to, 0);

      function tick(now) {
        const ratio = clamp((now - start) / durationMs, 0, 1);
        const nextValue = Math.round(from + (to - from) * ratio);
        slotHpText.textContent = `${nextValue}/${maxValue}`;
        if (ratio < 1) {
          window.requestAnimationFrame(tick);
        }
      }

      window.requestAnimationFrame(tick);
    }

      rightPanel.innerHTML = createQuickBattlePanelMarkup(report.right);
      ensureQuickBattlePortraitEntry(leftPanel, report.left);
      ensureQuickBattlePortraitEntry(rightPanel, report.right);
      applyQuickBattlePanelState(leftPanel, report.left, false);
      applyQuickBattlePanelState(rightPanel, report.right, false);

    function settleQuickBattleOverlay(report) {
      const leftPanel = document.getElementById('quick-battle-left-panel');
      const rightPanel = document.getElementById('quick-battle-right-panel');
      if (!leftPanel || !rightPanel) return;
      applyQuickBattlePanelState(leftPanel, report.left, true);

    function showQuickBattleOverlay(report) {
      if (quickBattleState.isActive) {
        return quickBattleState.currentPromise ?? Promise.resolve();
      }
      const run = (async () => {
        const overlay = document.getElementById('quick-battle-overlay');
        if (!overlay) return;
        quickBattleState.isActive = true;
        overlay.classList.remove('hidden', 'is-active', 'is-results-visible');
        overlay.setAttribute('aria-hidden', 'false');
        renderQuickBattleOverlay(report);
        startBattleSpineIdleLoop();
        void overlay.offsetWidth;
        overlay.classList.add('is-active');
        await sleep(700);
        settleQuickBattleOverlay(report);
        renderBoard();
        updateDebug();
        updateUI();
        await sleep(500);
        overlay.classList.add('is-results-visible');
        await sleep(1000);
        overlay.classList.remove('is-results-visible', 'is-active');
        await sleep(220);
        overlay.classList.add('hidden');
        overlay.setAttribute('aria-hidden', 'true');
        stopBattleSpineIdleLoop();
      })().finally(() => {
        quickBattleState.isActive = false;
        quickBattleState.currentPromise = null;
      });
      quickBattleState.currentPromise = run;
      return run;
    }

    // ─── AI ───────────────────────────────────────────────
    function scoreMove(enemy, cell) {
      let score = 0;
      const point = getPointAt(cell.x, cell.y);
      if (point && point.owner !== enemy.side) score += isStrongpointBattle() ? 120 : 40;
      if (isStrongpointBattle() && point?.owner === enemy.side) score += 55;
      if (getTerrain(cell.x, cell.y) === 'hill') score += 15;
      if (getTerrain(cell.x, cell.y) === 'forest') score += 8;

      if (isAssassinationBattle()) {
        const enemyCommander = getCommander('enemy');
        const playerCommander = getCommander('player');
        const playerUnits = activeUnits('player');
        if (enemy.isCommander) {
          const nearestThreat = playerUnits.length
            ? Math.min(...playerUnits.map(unit => manhattan(cell.x, cell.y, unit.x, unit.y)))
            : 6;
          const nearbyAllies = activeUnits('enemy').filter(
            unit => unit.id !== enemy.id && manhattan(cell.x, cell.y, unit.x, unit.y) <= 2
          ).length;
          score += nearestThreat * 9 + nearbyAllies * 12;
        } else if (enemyCommander) {
          score += Math.max(0, 48 - manhattan(cell.x, cell.y, enemyCommander.x, enemyCommander.y) * 14);
          const threatsNearCommander = playerUnits.filter(
            unit => manhattan(unit.x, unit.y, enemyCommander.x, enemyCommander.y) <= 4
          );
          if (threatsNearCommander.length) {
            const nearestThreatDistance = Math.min(
              ...threatsNearCommander.map(unit => manhattan(cell.x, cell.y, unit.x, unit.y))
            );
            score += Math.max(0, 40 - nearestThreatDistance * 9);
          }
        }
        if (playerCommander) {
          score += Math.max(0, 24 - manhattan(cell.x, cell.y, playerCommander.x, playerCommander.y) * 4);
        }
      }

      if (isSupplyTransportBattle()) {
        const playerCart = getCart('player');
        const enemyCart = getCart('enemy');
        if (playerCart) {
          const d = manhattan(cell.x, cell.y, playerCart.x, playerCart.y);
          score += 55 - d * 9;
        }
        if (enemyCart) {
          const d = manhattan(cell.x, cell.y, enemyCart.x, enemyCart.y);
          score += 30 - d * 6;
        }
      } else {
        const players = activeUnits('player');
        if (players.length) {
          const nearest = Math.min(...players.map(p => manhattan(cell.x, cell.y, p.x, p.y)));
          score -= nearest * 3;
        }
      }
      return score;
    }

    function shouldEnemyHoldStrongpoint(enemy) {
      if (!isStrongpointBattle()) return false;
      const point = getPointAt(enemy.x, enemy.y);
      return point?.owner === enemy.side;
    }

    function scoreNpcAllyMove(ally, cell) {
      let score = 0;
      const point = getPointAt(cell.x, cell.y);
      if (point && point.owner !== ally.side) score += 24;
      if (getTerrain(cell.x, cell.y) === 'hill') score += 12;
      if (getTerrain(cell.x, cell.y) === 'forest') score += 6;
      const enemies = activeUnits('enemy');
      if (enemies.length) {
        const nearest = Math.min(...enemies.map(enemy => manhattan(cell.x, cell.y, enemy.x, enemy.y)));
        score += Math.max(0, 70 - nearest * 10);
      }
      const endangered = units.find(unit => unit.name.includes('孙德崖') && unit.soldiers > 0);
      if (endangered) {
        score += Math.max(0, 30 - manhattan(cell.x, cell.y, endangered.x, endangered.y) * 4);
      }
      return score;
    }

    async function runNpcAllyTurn() {
      const allies = units.filter(u => u.side === 'player' && u.controller === 'npc' && u.soldiers > 0 && !isRout(u));
      if (!allies.length) {
        await playTurnTransition("enemy");
        return await runEnemyTurn();
      }

      turn = 'ally';
      updateUI();
      log('——盟友行动——', 'system');
      for (const ally of allies) {
        if (checkVictory()) return true;
        ally.hasMoved = false;
        ally.hasActed = false;

        const attackables = computeAttackable(ally);
        if (attackables.length && !ally.hasActed) {
          attackables.sort((a, b) => aiTargetPriority(ally, b) - aiTargetPriority(ally, a));
          await resolveAttack(ally, attackables[0]);
          ally.hasActed = true;
        } else if (!ally.hasMoved) {
          const reach = computeReachable(ally);
          if (reach.length) {
            reach.sort((a, b) => scoreNpcAllyMove(ally, b) - scoreNpcAllyMove(ally, a));
            await animateUnitMove(ally, reach[0].x, reach[0].y);
            const postMoveAttackables = computeAttackable(ally);
            if (postMoveAttackables.length && !ally.hasActed) {
              postMoveAttackables.sort((a, b) => aiTargetPriority(ally, b) - aiTargetPriority(ally, a));
              await resolveAttack(ally, postMoveAttackables[0]);
              ally.hasActed = true;
            }
          }
        }

        renderBoard();
        updateDebug();
        await sleep(BATTLE_NPC_ACTION_PAUSE_MS);
      }

      processCaptureProgress();
      processRout();
      if (checkVictory()) return true;
      await playTurnTransition("enemy");
      return await runEnemyTurn();
    }

    async function runEnemyTurn() {
      turn = 'enemy';
      updateUI();
      log('——敌方回合——', 'system');

      for (const enemy of units.filter(u => u.side === 'enemy' && u.soldiers > 0 && !isRout(u))) {
        if (checkVictory()) return;
        enemy.hasMoved = false;
        enemy.hasActed = false;

        const targets = activeUnits('player');
        if (!targets.length) break;

        const attackables = computeAttackable(enemy);
        if (attackables.length && !enemy.hasActed) {
          attackables.sort((a, b) => aiTargetPriority(enemy, b) - aiTargetPriority(enemy, a));
          await resolveAttack(enemy, attackables[0]);
          enemy.hasActed = true;
        } else if (shouldEnemyHoldStrongpoint(enemy)) {
          enemy.hasMoved = true;
        } else if (!enemy.hasMoved) {
          const reach = computeReachable(enemy);
          if (reach.length) {
            reach.sort((a, b) => scoreMove(enemy, b) - scoreMove(enemy, a));
            await animateUnitMove(enemy, reach[0].x, reach[0].y);
            const postMoveAttackables = computeAttackable(enemy);
            if (postMoveAttackables.length && !enemy.hasActed) {
              postMoveAttackables.sort((a, b) => aiTargetPriority(enemy, b) - aiTargetPriority(enemy, a));
              await resolveAttack(enemy, postMoveAttackables[0]);
              enemy.hasActed = true;
            }
          }
        }

        renderBoard();
        updateDebug();
        await sleep(BATTLE_ENEMY_ACTION_PAUSE_MS);
      }

      processCaptureProgress();
      if (processSupplyCartMoves()) return;
      processRout();
      applyStrategicTurnEffects('enemy');
      if (checkVictory()) return;

      recoverMorale('enemy');
      await playTurnTransition("player");
      turn = 'player';
      resetPlayerTurn();
      log('——我方回合——', 'system');
      updateUI();
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function resetPlayerTurn() {
      for (const u of units) {
        if (u.side === 'player' && u.soldiers > 0) {
          u.hasMoved = false;
          u.hasActed = false;
          u.movedFrom = null;
        }
      }
      turnCounter++;
      if (battleObjective?.id === 'defense' && playerHoldsDefenseZone()) {
        defenseHoldTurns++;
        updateObjectiveBar();
        log(`守卫进度 ${defenseHoldTurns}/${DEFENSE_HOLD_REQUIRED} · ${getDefenseZoneLabel()}`, 'system');
      }
      recoverMorale('player');
      applyStrategicTurnEffects('player');
      updateObjectiveBar();
      clearSelection();
    }

    // ─── 渲染 ───────────────────────────────────────────────
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const wrap = board.parentElement.getBoundingClientRect();
      const tileW = Math.max(50, Math.min(85, Math.floor(Math.min(
        (wrap.width - 12) / ((COLS + ROWS) / 2),
        (wrap.height - 12) / ((COLS + ROWS) * 0.31)
      ))));
      const tileH = Math.round(tileW * 0.5);
      const tileSide = Math.round(tileW / Math.SQRT2);
      const boardW = Math.round((COLS + ROWS) * tileW / 2 + tileW);
      const boardH = Math.round((COLS + ROWS) * tileH / 2 + tileH);
      board.style.setProperty('--tile-w', `${tileW}px`);
      board.style.setProperty('--tile-h', `${tileH}px`);
      board.style.setProperty('--tile-side', `${tileSide}px`);
      board.style.width = `${boardW}px`;
      board.style.height = `${boardH}px`;
      const zoneRows = DEFENSE_ZONE_ROWS;
      const depot = getSupplyDepot();
      const playerCart = getCart('player');
      const highlightCart = playerCart || getCart('enemy');
      const enemyCommander = getCommander('enemy');
      const playerCommander = getCommander('player');

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const terrain = getTerrain(x, y);
          const cellData = getCell(x, y);
          const cell = document.createElement('div');
          cell.className = 'cell ' + terrain;
          cell.dataset.x = String(x);
          cell.dataset.y = String(y);
          const left = Math.round((x - y) * tileW / 2 + (ROWS - 1) * tileW / 2 + tileW / 2);
          const top = Math.round((x + y) * tileH / 2 + 8);
          cell.style.left = `${left}px`;
          cell.style.top = `${top}px`;
          cell.style.zIndex = String((x + y) * 2 + (militaryAt(x, y) || cartAt(x, y) ? 2 : 0));

          if (phase === 'deploy' && PLAYER_DEPLOY_ROWS.includes(y)) cell.classList.add('deploy-zone');
          if (battleObjective?.id === 'defense' && zoneRows.includes(y)) cell.classList.add('defense-zone');
          if (cellData?.campZone === 'player') cell.classList.add('highlight-player-camp');
          if (cellData?.campZone === 'enemy') cell.classList.add('highlight-enemy-camp');
          if (depot && depot.x === x && depot.y === y) cell.classList.add('highlight-supply-depot');
          if (highlightCart && highlightCart.x === x && highlightCart.y === y) cell.classList.add('highlight-cart');
          if (isAssassinationBattle() && enemyCommander?.x === x && enemyCommander?.y === y) {
            cell.classList.add('highlight-target-commander');
          }
          if (isAssassinationBattle() && playerCommander?.x === x && playerCommander?.y === y) {
            cell.classList.add('highlight-protect-commander');
          }

          if (cellData?.campZone === 'player') {
            const cm = document.createElement('span');
            cm.className = 'camp-marker';
            cm.textContent = '我营';
            cm.title = '我军营地 · 粮车运抵此处获胜';
            cell.appendChild(cm);
          }
          if (cellData?.campZone === 'enemy') {
            const cm = document.createElement('span');
            cm.className = 'camp-marker';
            cm.textContent = '敌营';
            cm.title = '敌军营地';
            cell.appendChild(cm);
          }

          const point = getPointAt(x, y);
          if (point) {
            const pm = document.createElement('span');
            pm.className = 'point-marker ' + (point.owner === 'player' ? 'player-own' : point.owner === 'enemy' ? 'enemy-own' : 'neutral');
            pm.textContent = STRATEGIC[point.type].label;
            pm.title = STRATEGIC[point.type].desc + (point.owner !== 'neutral' ? `\n所属：${point.owner === 'player' ? '我军' : '敌军'}` : '');
            cell.appendChild(pm);

            if (point.captureSide && point.owner !== point.captureSide) {
              const bar = document.createElement('div');
              bar.className = 'capture-bar';
              const captureRequired = isStrongpointBattle() ? STRONGPOINT_CAPTURE_REQUIRED : 1;
              const pct = Math.min(
                100,
                Math.round(((point.captureProgress + 1) / (captureRequired + 1)) * 100)
              );
              bar.innerHTML = `<div class="capture-fill" style="width:${pct}%"></div>`;
              cell.appendChild(bar);
            }
          }

          const drop = droppedSupplies.find(d => d.x === x && d.y === y);
          if (drop) {
            const de = document.createElement('span');
            de.className = 'dropped-supply';
            de.textContent = '粮';
            de.title = '散落粮食 · 任意部队进入可拾取';
            cell.appendChild(de);
          }

          if (reachable.some(c => c.x === x && c.y === y)) cell.classList.add('can-move');
          if (mode === 'move' && selectedUnit?.x === x && selectedUnit?.y === y) cell.classList.add('can-move');
          if (attackRangeCells.some(c => c.x === x && c.y === y)) cell.classList.add('attack-range');
          if (attackable.some(u => u.x === x && u.y === y)) cell.classList.add('can-attack');
          if (skillTargets.some(c => c.x === x && c.y === y)) cell.classList.add('can-skill');
          if (selectedUnit?.x === x && selectedUnit?.y === y && selectedUnit.movedFrom) cell.classList.add('post-move');

          const military = militaryAt(x, y);
          const cart = cartAt(x, y);

          if (military) {
            const tier = getMoraleTier(military.morale);
            const soldierPercent = military.maxSoldiers > 0
              ? clamp(Math.round((military.soldiers / military.maxSoldiers) * 100), 0, 100)
              : 0;
            const moralePercent = clamp(Math.round(military.morale || 0), 0, 100);
            const ue = document.createElement('div');
            ue.className = `unit ${military.side} ${military.hasActed && military.hasMoved ? 'acted' : ''} ${tier.id === 'chaos' || tier.id === 'rout' ? tier.id : ''} ${military.isCommander ? 'commander' : ''} ${military.inRiver ? 'in-river' : ''}`;
            ue.style.setProperty('--unit-sprite', `url("${getBoardUnitSprite(military)}")`);
            if (selectedUnit?.id === military.id) cell.classList.add('selected');

            ue.innerHTML = `
              <span class="unit-art" aria-hidden="true"></span>
              <span class="unit-caption unit-name">${escapeHtml(military.name)}</span>
              <div class="unit-bars" aria-hidden="true">
                <div class="unit-bar unit-bar--hp"><span class="unit-bar-fill" style="width:${soldierPercent}%"></span></div>
                <div class="unit-bar unit-bar--morale"><span class="unit-bar-fill" style="width:${moralePercent}%"></span></div>
              </div>
            `;
            if (military.isCommander) {
              const badge = document.createElement('span');
              badge.className = 'commander-badge';
              badge.textContent = isAssassinationBattle()
                ? military.side === 'enemy'
                  ? '敌主'
                  : '我主'
                : '主';
              ue.appendChild(badge);
            }
            ue.title = `${military.name} · ${military.general.name}\n兵力 ${military.soldiers}/${military.maxSoldiers} · 士气 ${military.morale}\n${STRATEGIC[point?.type]?.desc || TERRAIN_HINT[terrain] || ''}`;

            if (phase === 'deploy' && military.side === 'player' && military.x >= 0) {
              ue.draggable = true;
              ue.addEventListener('dragstart', e => { dragUnit = military; e.dataTransfer.effectAllowed = 'move'; });
            }
            cell.appendChild(ue);
          } else if (cart) {
            const ue = document.createElement('div');
            ue.className = `unit supply-cart ${cart.side}`;
            ue.innerHTML = `
              <span>粮车</span>
              <span class="cart-hp">${cart.soldiers}</span>
              <span class="unit-status">运粮</span>
            `;
            ue.title = `${cart.name} · 生命 ${cart.soldiers}/${cart.maxSoldiers}\n距营地 ${distToCamp(cart)} 格`;
            cell.appendChild(ue);
          }

          cell.addEventListener('click', () => onCellClick(x, y));
          cell.addEventListener('dragover', e => { if (phase === 'deploy') e.preventDefault(); });
          cell.addEventListener('drop', e => { e.preventDefault(); onDeployDrop(x, y); });
          board.appendChild(cell);
        }
      }
    }

    function renderDeployPool() {
      const pool = document.getElementById('deploy-pool');
      pool.innerHTML = '';
      const undeployed = units.filter(u => u.side === 'player' && u.x < 0);
      const shouldShowDeployPool = phase === 'deploy' && undeployed.length > 0;
      pool.classList.toggle('hidden', !shouldShowDeployPool);
      if (!shouldShowDeployPool) return;
      for (const u of undeployed) {
        const el = document.createElement('div');
        el.className = 'unit player';
        el.draggable = true;
        el.innerHTML = `
          <span class="unit-caption">${u.name}${u.isCommander ? '·主将' : ''}</span>
          <span class="unit-caption">${getFormationTemplateLabel(u)}</span>
        `;
        el.title = `${u.general.name}\n${getFormationTemplateLabel(u)}`;
        el.addEventListener('click', () => { inspectUnit(u); updateUI(); });
        el.addEventListener('dragstart', e => { dragUnit = u; e.dataTransfer.effectAllowed = 'move'; });
        pool.appendChild(el);
      }
    }

    function updateDebug() {
      const list = document.getElementById('debug-list');
      list.innerHTML = '';
      for (const u of units) {
        if (u.isSupplyCart && phase !== 'deploy') {
          const el = document.createElement('div');
          el.className = 'debug-unit ' + (u.side === 'player' ? 'player-side' : 'enemy-side');
          el.innerHTML = `
            <div class="name">${u.name} <span class="type-tag">粮车</span></div>
            <div>(${u.x},${u.y}) · 生命 ${u.soldiers}/${u.maxSoldiers} · 距营地 ${distToCamp(u)} 格</div>
          `;
          list.appendChild(el);
          continue;
        }
        if (u.soldiers <= 0 && phase !== 'deploy') continue;
        const tier = getMoraleTier(u.morale);
        const pos = u.x >= 0 ? `(${u.x},${u.y})` : '未部署';
        const el = document.createElement('div');
        el.className = 'debug-unit ' + (u.side === 'player' ? 'player-side' : 'enemy-side');
        el.innerHTML = `
          <div class="name">${u.name}${u.isCommander ? ' · 主将' : ''} <span class="type-tag">${getFormationTemplateLabel(u)}</span></div>
          <div>${pos} · ${u.soldiers} · <span class="unit-status ${tier.id}">${tier.label}</span></div>
          <div class="morale-bar"><div class="morale-fill" style="width:${u.morale}%"></div></div>
          <div>${u.general.name}${u.inRiver ? ' · 渡河' : ''}</div>
          <div>${getFormationTemplateLabel(u)}</div>
        `;
        list.appendChild(el);
      }
    }

    function updateUI() {
      const badge = document.getElementById('phase-badge');
      const turnInfo = document.getElementById('turn-info');
      const armyTurnFooter = document.getElementById('army-turn-footer');
      const btnStart = document.getElementById('btn-start');
      const btnEnd = document.getElementById('btn-end-turn');
      const btnWait = document.getElementById('btn-wait');

      if (phase === 'deploy') {
        badge.textContent = '部署阶段';
        badge.className = 'phase-badge';
        turnInfo.textContent = isSupplyTransportBattle()
          ? '占领粮仓 · 护送粮车回营 · 可拦截敌军粮车'
          : battleObjective?.id === 'defense'
            ? `部署后前往${getDefenseZoneLabel()}`
            : '拖至底部三排 · 观察据点与地形';
        btnStart.disabled = false;
        btnEnd.disabled = true;
        btnWait.disabled = true;
      } else if (phase === 'battle') {
        badge.textContent = turn === 'enemy' ? '敌方回合' : '我方回合';
        badge.className = 'phase-badge ' + (turn === 'enemy' ? 'enemy' : 'player');
        turnInfo.textContent = turn === 'player'
          ? battleObjective?.id === 'defense'
            ? `守住${getDefenseZoneLabel()} · 至少 ${DEFENSE_PLAYER_UNITS_REQUIRED} 人驻守且敌军不得进入`
            : '移动、占点、维持士气'
          : turn === 'ally'
            ? '盟友行动中…'
            : '敌方行动中…';
        btnStart.disabled = true;
        btnEnd.disabled = turn !== 'player' || isBattleInteractionLocked();
        btnWait.disabled = turn !== 'player' || !selectedUnit || isBattleInteractionLocked();
      }

      armyTurnFooter.textContent = turn === 'ally'
        ? '我方军团回合'
        : turn === 'enemy'
          ? '敌方军团回合'
          : '';
      armyTurnFooter.classList.toggle('hidden', phase !== 'battle' || turn === 'player');

      updateObjectiveBar();
      renderSkillBar();
      renderBoard();
      renderDeployPool();
      updateDebug();
      renderInspectedUnitPanel();
      renderBattleStatusPanel();
      renderTopBattleStats();
      renderActionMenu();
    }

    function renderSkillBar() {
      const bar = document.getElementById('skill-bar');
      bar.innerHTML = '';
      if (phase !== 'battle' || turn !== 'player' || !selectedUnit || selectedUnit.hasActed) return;
      const u = selectedUnit;
      [
        { id: 'inspire', label: `鼓舞(${u.skillUses.inspire})`, ok: u.skillUses.inspire > 0 },
      ].forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'skill-btn';
        btn.textContent = s.label;
        btn.disabled = !s.ok;
        btn.addEventListener('click', () => onSkillClick(s.id));
        bar.appendChild(btn);
      });
    }

    function renderActionMenu() {
      const menu = document.getElementById('action-menu');
      const waitBtn = document.getElementById('action-wait');
      const rallyBtn = document.getElementById('action-rally');
      const attackBtn = document.getElementById('action-attack');
      const cancelBtn = document.getElementById('action-cancel');
      if (phase !== 'battle' || turn !== 'player' || !selectedUnit || !selectedUnit.movedFrom || !['post-move', 'target-attack'].includes(mode)) {
        menu.classList.add('hidden');
        menu.style.left = '';
        menu.style.top = '';
        waitBtn.hidden = false;
        rallyBtn.hidden = false;
        attackBtn.hidden = false;
        cancelBtn.hidden = false;
        return;
      }
      const attackCount = attackable.length;
      const selectingAttackTarget = mode === 'target-attack';
      waitBtn.hidden = selectingAttackTarget;
      rallyBtn.hidden = selectingAttackTarget;
      attackBtn.hidden = selectingAttackTarget;
      cancelBtn.hidden = false;
      waitBtn.disabled = isBattleInteractionLocked();
      rallyBtn.disabled = isBattleInteractionLocked();
      attackBtn.disabled = attackCount === 0 || isBattleInteractionLocked();
      cancelBtn.disabled = isBattleInteractionLocked();
      attackBtn.textContent = mode === 'target-attack' ? '选择目标' : `攻击${attackCount ? `(${attackCount})` : ''}`;
      menu.classList.remove('hidden');
      positionActionMenu(menu);
    }

    function positionActionMenu(menu) {
      if (!selectedUnit) return;
      const area = document.querySelector('.battle-area');
      const cell = document.querySelector(`#board .cell[data-x="${selectedUnit.x}"][data-y="${selectedUnit.y}"]`);
      if (!area || !cell) return;
      const areaRect = area.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();
      const menuW = menu.offsetWidth || 108;
      const menuH = menu.offsetHeight || 150;
      let left = cellRect.right - areaRect.left + 8;
      let top = cellRect.top - areaRect.top - 10;
      const maxLeft = Math.max(8, areaRect.width - menuW - 8);
      const maxTop = Math.max(8, areaRect.height - menuH - 8);
      if (left > maxLeft) left = cellRect.left - areaRect.left - menuW - 8;
      left = Math.max(8, Math.min(left, maxLeft));
      top = Math.max(8, Math.min(top, maxTop));
      menu.style.left = `${Math.round(left)}px`;
      menu.style.top = `${Math.round(top)}px`;
    }

    function clearSelection() {
      if (selectedUnit) selectedUnit.movedFrom = null;
      selectedUnit = null; mode = null;
      reachable = []; attackable = []; skillTargets = []; attackRangeCells = [];
      renderActionMenu();
    }

    function cancelCurrentOperation() {
      if (!selectedUnit) return false;
      const unit = selectedUnit;
      if (unit.movedFrom && ['post-move', 'target-attack'].includes(mode)) {
        const from = unit.movedFrom;
        unit.x = from.x;
        unit.y = from.y;
        unit.inRiver = from.inRiver;
        unit.hasMoved = false;
        log(`${unit.name} 撤回移动`, 'system');
      }
      clearSelection();
      return true;
    }

    function canSelectPlayerUnit(unit) {
      return Boolean(unit && unit.side === 'player' && unit.controller !== 'npc' && !unit.hasActed && !unit.isSupplyCart);
    }

    function selectPlayerUnit(unit) {
      if (!canSelectPlayerUnit(unit)) return false;
      if (isRout(unit)) {
        log(`${unit.name} 溃逃中`, 'system');
        return false;
      }
      selectedUnit = unit;
      inspectUnit(unit);
      attackable = computeAttackable(unit);
      if (!unit.hasMoved) {
        mode = 'move';
        reachable = computeReachable(unit);
        attackRangeCells = [];
      } else {
        mode = attackable.length ? 'target-attack' : null;
        reachable = [];
        attackRangeCells = computeAttackRangeCells(unit);
      }
      skillTargets = [];
      playBattleDemoUiCue('troopSelection');
      return true;
    }

    function cancelOperationAndMaybeSelect(clicked) {
      const nextUnit = clicked?.id !== selectedUnit?.id && canSelectPlayerUnit(clicked) ? clicked : null;
      cancelCurrentOperation();
      if (nextUnit) selectPlayerUnit(nextUnit);
      updateUI();
    }

    function finishUnitAction(unit) {
      unit.hasActed = true;
      unit.hasMoved = true;
      unit.movedFrom = null;
      processRout();
      checkVictory();
    }

    function enterPostMove(unit) {
      mode = 'post-move';
      reachable = [];
      attackable = computeAttackable(unit);
      attackRangeCells = computeAttackRangeCells(unit);
      skillTargets = [];
    }

    function enterPostMoveAtCurrentCell(unit) {
      unit.movedFrom = { x: unit.x, y: unit.y, inRiver: unit.inRiver };
      unit.hasMoved = true;
      enterPostMove(unit);
    }

    function undoPendingMove() {
      if (isBattleInteractionLocked()) return;
      if (!selectedUnit?.movedFrom || !['post-move', 'target-attack'].includes(mode)) return;
      cancelCurrentOperation();
      updateUI();
    }

    function waitSelectedUnit() {
      if (isBattleInteractionLocked()) return;
      if (!selectedUnit) return;
      finishUnitAction(selectedUnit);
      clearSelection();
      updateUI();
    }

    function rallySelectedUnit() {
      if (isBattleInteractionLocked()) return;
      if (!selectedUnit) return;
      const isAfterMove = Boolean(selectedUnit.movedFrom);
      const moraleGain = isAfterMove ? 8 : 12;
      changeMorale(selectedUnit, moraleGain, '整顿');
      log(`${selectedUnit.name} 整顿队伍，士气恢复`, 'heal');
      finishUnitAction(selectedUnit);
      clearSelection();
      updateUI();
    }

    async function onCellClick(x, y) {
      if (isBattleInteractionLocked()) return;
      const clicked = unitAt(x, y);
      if (clicked) inspectUnit(clicked);
      if (phase !== 'battle' || turn !== 'player') {
        if (clicked) updateUI();
        return;
      }

      if (mode === 'skill-inspire') {
        if (clicked?.side === 'player' && !clicked.isSupplyCart && clicked.id !== selectedUnit.id) {
          useInspire(selectedUnit, clicked);
          clearSelection(); updateUI();
        } else {
          cancelOperationAndMaybeSelect(clicked);
        }
        return;
      }
      if (mode === 'move') {
        if (selectedUnit.x === x && selectedUnit.y === y) {
          enterPostMoveAtCurrentCell(selectedUnit);
          updateUI();
        } else if (reachable.some(c => c.x === x && c.y === y)) {
          selectedUnit.movedFrom = { x: selectedUnit.x, y: selectedUnit.y, inRiver: selectedUnit.inRiver };
          playBattleDemoUiCue('troopSelection');
          applyMove(selectedUnit, x, y);
          if (selectedUnit.hasActed) {
            finishUnitAction(selectedUnit);
            clearSelection();
          } else {
            enterPostMove(selectedUnit);
          }
          updateUI();
        } else {
          cancelOperationAndMaybeSelect(clicked);
        }
        return;
      }

      if (mode === 'post-move') {
        cancelOperationAndMaybeSelect(clicked);
        return;
      }

      if (mode === 'target-attack') {
        if (clicked?.side === 'enemy' && attackable.some(u => u.id === clicked.id)) {
          selectedUnit.movedFrom = null;
          playBattleDemoUiCue('buttonHeavy');
          await resolveAttack(selectedUnit, clicked);
          finishUnitAction(selectedUnit);
          clearSelection(); updateUI();
        } else {
          cancelOperationAndMaybeSelect(clicked);
        }
        return;
      }

      if (selectPlayerUnit(clicked)) {
        updateUI();
        return;
      }

      clearSelection(); updateUI();
    }

    function onSkillClick(id) {
      if (isBattleInteractionLocked()) return;
      if (!selectedUnit || selectedUnit.hasActed) return;
      if (id === 'inspire') { mode = 'skill-inspire'; log('选择友军使用【鼓舞】', 'skill'); }
    }

    function onDeployDrop(x, y) {
      if (isBattleInteractionLocked()) return;
      if (phase !== 'deploy' || !dragUnit) return;
      if (!PLAYER_DEPLOY_ROWS.includes(y)) { log('只能部署在底部三排', 'system'); return; }
      if (unitAt(x, y)) { log('该格已有部队', 'system'); return; }
      dragUnit.x = x; dragUnit.y = y;
      checkApproachTutorials(dragUnit);
      dragUnit = null;
      renderBoard(); renderDeployPool(); updateDebug();
    }

    function startBattle() {
      if (!units.some(u => u.side === 'player' && u.x >= 0)) {
        log('请至少部署一支部队', 'system'); return;
      }
      if (isAssassinationBattle()) {
        const playerCommander = getCommander('player', true);
        if (playerCommander && playerCommander.x < 0) {
          log('斩将战必须先部署我方主将', 'system'); return;
        }
      }
      playBattleDemoMusicCue('battleMusicStart');
      showObjectiveIntro();
    }

    async function beginBattle() {
      hideObjectiveIntro();
      phase = 'battle';
      turn = 'player';
      battleRecap = [];
      resetPlayerTurn();
      BattleTutorialManager.applyLessonTags(battleConfig.lessonTags);
      if (isSupplyTransportBattle()) BattleTutorialManager.maybeShow('lesson_supply_transport');
      log(`战斗开始：${battleObjective.friendlyTitle}`, 'system');
      log('——我方回合——', 'system');
      updateUI();
      await playTurnTransition("player");
      updateUI();
    }

    function init(config = {}) {
      const scenario = config.scenarioId ? STORY_BATTLE_SCENARIOS[config.scenarioId] || null : null;
      battleConfig = {
        lessonTags: config.lessonTags || scenario?.lessonTags || [],
        objectiveId: config.objectiveId || scenario?.objectiveId || null,
        scenarioId: config.scenarioId || scenario?.scenarioId || null,
        embedded: Boolean(config.embedded || scenario?.embedded),
        scenario,
      };
      pickObjective();
      generateMap();
      applyScenarioMap();
      units = createPlayerPool();
      spawnEnemies();
      configureBattleCommanders();
      phase = 'deploy';
      turn = 'player';
      supplyCartClaimSide = null;
      droppedSupplies = [];
      battleRecap = [];
      lastBattleResult = null;
      battleDemoLocalBgmLoopToken += 1;
      if (battleDemoLocalBgmAudio) {
        battleDemoLocalBgmAudio.pause();
        battleDemoLocalBgmAudio.currentTime = 0;
        battleDemoLocalBgmAudio.volume = 0.35;
      }
      if (battleDemoLocalVictoryAudio) {
        battleDemoLocalVictoryAudio.pause();
        battleDemoLocalVictoryAudio.currentTime = 0;
      }
      inspectedUnit = null;
      clearSelection();
      hideObjectiveIntro();
      BattleTutorialManager.hideToast();

      if (!battleConfig.lessonTags.length) battleConfig.lessonTags = inferLessonTags();

      document.getElementById('log').innerHTML = '';
      document.getElementById('morale-log').innerHTML = '';
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('recap-box').classList.add('hidden');
      document.getElementById('turn-transition-overlay').classList.add('hidden');
      document.getElementById('turn-transition-overlay').classList.remove('is-active', 'is-text-visible');
      turnTransitionState.isActive = false;
      turnTransitionState.activeType = null;
      turnTransitionState.currentPromise = null;
      log('部署部队，观察地图上的据点与地形', 'system');
      if (battleObjective?.id === 'defense') {
        log(`本局需守住${getDefenseZoneLabel()}：至少 ${DEFENSE_PLAYER_UNITS_REQUIRED} 支未溃逃部队驻守，且敌军不得踏入，连续 ${DEFENSE_HOLD_REQUIRED} 回合。`, 'system');
      }
      updateUI();
      if (battleConfig.scenario?.autoDeployment) {
        log('剧情战役已载入：玩家只可操控朱重八本队，其余友军由 NPC 自动行动。', 'system');
        renderBoard();
        renderDeployPool();
        showObjectiveIntro();
      }
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      playBattleDemoUiCue('buttonHeavy');
      startBattle();
    });
    document.getElementById('btn-objective-ok').addEventListener('click', () => {
      playBattleDemoUiCue('buttonHeavy');
      playBattleDemoMusicCue('battleMusicStart');
      beginBattle();
    });
    document.getElementById('btn-tutorial-close').addEventListener('click', () => BattleTutorialManager.hideToast());
    document.getElementById('btn-end-turn').addEventListener('click', async () => {
      if (isBattleInteractionLocked()) return;
      if (turn !== 'player') return;
      playBattleDemoUiCue('buttonHeavy');
      processCaptureProgress();
      if (processSupplyCartMoves()) return;
      processRout();
      if (checkVictory()) return;
      await playTurnTransition("ally");
      if (await runNpcAllyTurn()) return;
    });
    document.getElementById('btn-wait').addEventListener('click', () => {
      if (!selectedUnit) return;
      playBattleDemoUiCue('troopSelection');
      waitSelectedUnit();
    });
    document.getElementById('action-wait').addEventListener('click', () => {
      if (!selectedUnit) return;
      playBattleDemoUiCue('troopSelection');
      waitSelectedUnit();
    });
    document.getElementById('action-rally').addEventListener('click', () => {
      if (!selectedUnit) return;
      playBattleDemoUiCue('troopSelection');
      rallySelectedUnit();
    });
    document.getElementById('action-attack').addEventListener('click', () => {
      if (isBattleInteractionLocked()) return;
      if (!selectedUnit || !attackable.length) return;
      playBattleDemoUiCue('troopSelection');
      mode = 'target-attack';
      log('选择敌方编队进入战斗演出', 'skill');
      updateUI();
    });
    document.getElementById('action-cancel').addEventListener('click', () => {
      if (!selectedUnit?.movedFrom || !['post-move', 'target-attack'].includes(mode)) return;
      playBattleDemoUiCue('troopSelection');
      undoPendingMove();
    });
    document.getElementById('battle-close').addEventListener('click', () => {
      playBattleDemoUiCue('buttonLight');
      closeFormationBattleOverlay();
    });
    document.getElementById('board').addEventListener('contextmenu', event => {
      event.preventDefault();
      if (isBattleInteractionLocked()) return;
      undoPendingMove();
    });
    function getBattleConfigFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return {
        scenarioId: params.get('scenario') || null,
        embedded: params.get('embedded') === '1',
        previewMode: params.get('preview') || null,
      };
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      if (battleConfig.embedded && lastBattleResult?.result === 'victory') {
        notifyBattleDemoResult();
        return;
      }
      nextId = 1;
      init(initialBattleConfig || {});
    });

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) {
        return;
      }
      const data = event.data;
      if (!data || typeof data !== 'object') {
        return;
      }
      if (data.type === 'rpg-tg:formation-preview') {
        showFormationPreview(data.preview || {});
      }
    });

    /** 剧情战役：init({ objectiveId: 'supplyTransport', lessonTags: ['SupplyTransportBattle'] }) */
    window.BattleDemo = { init, showFormationPreview, BattleTutorialManager, inferLessonTags };

    battleFpsState.rafId = window.requestAnimationFrame(tickBattleFpsHud);
    initialBattleConfig = getBattleConfigFromUrl();
    if (initialBattleConfig.previewMode === 'formation') {
      showFormationPreview({});
    } else {
      init(initialBattleConfig);
    }
  </script>
</body>
</html>
