    function hideObjectiveIntro() {
      document.getElementById('objective-intro').classList.add('hidden');
    }

    function checkTerrainTutorial(unit, terrain) {
      if (unit.side !== 'player') return;
      if (terrain === 'forest') BattleTutorialManager.maybeShow('terrain_forest');
      else if (terrain === 'hill') BattleTutorialManager.maybeShow('terrain_hill');
      else if (terrain === 'river') BattleTutorialManager.maybeShow('terrain_river');
    }

    function checkApproachTutorials(unit) {
      if (unit.side !== 'player') return;
      for (const p of strategicPoints) {
        if (manhattan(unit.x, unit.y, p.x, p.y) <= 2) {
          BattleTutorialManager.maybeShow('point_' + p.type);
        }
      }
    }

    // ─── 单位 ───────────────────────────────────────────────
    const GENERAL_NAMES = ['赵云', '张飞', '关羽', '黄忠', '马超', '张辽', '徐晃', '于禁', '乐进', '李典'];
    const ENEMY_GENERAL_NAMES = ['夏侯惇', '夏侯渊', '许褚', '典韦', '张郃', '曹仁', '曹洪', '荀攸', '郭嘉', '贾诩'];

    function createGeneral(pool) {
      return {
        name: pool[randInt(0, pool.length - 1)],
        leadership: randInt(60, 95),
        strength: randInt(55, 90),
        intelligence: randInt(50, 88),
      };
    }

    function distributeSoldiers(total, count) {
      const base = Math.floor(total / count);
      let remaining = total;
      return Array.from({ length: count }, (_, idx) => {
        const value = idx === count - 1 ? remaining : base;
        remaining -= value;
        return Math.max(1, value);
      });
    }

    function createFormationMembers(templateKey, totalSoldiers) {
      const template = FORMATION_TEMPLATES[templateKey] || FORMATION_TEMPLATES.vanguard;
      const shares = distributeSoldiers(totalSoldiers, template.slots.length);
      return template.slots.map(([slotKey, troopType], idx) => {
        const base = TROOP_TYPES[troopType];
        const maxSoldiers = shares[idx];
        return {
          id: uid(),
          slotKey,
          troopType,
          name: base.label,
          soldiers: maxSoldiers,
          maxSoldiers,
          attack: base.attack,
          defense: base.defense,
          speed: base.speed,
          range: base.range,
          status: 'normal',
        };
      });
    }

    function syncFormationTotals(unit) {
      if (!unit.formationMembers?.length) return;
      const aliveMembers = unit.formationMembers.filter(member => member.soldiers > 0);
      unit.soldiers = unit.formationMembers.reduce((total, member) => total + member.soldiers, 0);
      unit.maxSoldiers = unit.formationMembers.reduce((total, member) => total + member.maxSoldiers, 0);
      unit.range = aliveMembers.length ? Math.max(...aliveMembers.map(member => member.range)) : 0;
      unit.attack = aliveMembers.length
        ? Math.round(aliveMembers.reduce((total, member) => total + member.attack, 0) / aliveMembers.length)
        : 0;
      unit.defense = aliveMembers.length
        ? Math.round(aliveMembers.reduce((total, member) => total + member.defense, 0) / aliveMembers.length)
        : 1;
      unit.speed = aliveMembers.length
        ? Math.round(aliveMembers.reduce((total, member) => total + member.speed, 0) / aliveMembers.length)
        : 0;
    }

    function getFormationTemplateLabel(unit) {
      return FORMATION_TEMPLATES[unit.formationTemplate]?.label || TROOP_TYPES[unit.troopType]?.label || '编队';
    }

    function getFormationCompositionText(unit) {
      if (!unit.formationMembers?.length) return TROOP_TYPES[unit.troopType]?.label || '—';
      const counts = new Map();
      for (const member of unit.formationMembers) {
        counts.set(member.troopType, (counts.get(member.troopType) || 0) + 1);
      }
      return [...counts.entries()]
        .map(([troopType, count]) => `${TROOP_TYPES[troopType].label}${count > 1 ? count : ''}`)
        .join(' / ');
    }

    function renderFormationChips(unit) {
      if (!unit.formationMembers?.length) return '';
      const occupiedSlots = new Map(unit.formationMembers.map(member => [member.slotKey, member]));
      return `<span class="formation-chips">${FORMATION_SLOT_KEYS.map(slotKey => {
        const member = occupiedSlots.get(slotKey);
        const opacity = member && member.soldiers > 0 ? 1 : 0.18;
        return `<i style="opacity:${opacity}"></i>`;
      }).join('')}</span>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function getInspectUnit() {
      if (inspectedUnit && units.includes(inspectedUnit)) return inspectedUnit;
      if (selectedUnit) return selectedUnit;
      return units.find(unit => unit.side === 'player' && unit.x >= 0 && !unit.isSupplyCart)
        || units.find(unit => unit.side === 'player' && !unit.isSupplyCart)
        || units.find(unit => !unit.isSupplyCart)
        || null;
    }

    function inspectUnit(unit) {
      if (!unit) return;
      inspectedUnit = unit;
    }

    function renderInspectedUnitPanel() {
      const card = document.getElementById('unit-card-body');
      const grid = document.getElementById('unit-formation-grid');
      if (!card || !grid) return;
      const unit = getInspectUnit();
      if (!unit) {
        card.innerHTML = '<div class="unit-summary">点击单位查看编队。</div>';
        grid.innerHTML = '';
        return;
      }

      const tier = getMoraleTier(unit.morale || 0);
      const pos = unit.x >= 0 ? `(${unit.x}, ${unit.y})` : '未部署';
      const sideLabel = unit.side === 'player' ? '我方' : unit.side === 'enemy' ? '敌方' : '中立';
      const total = unit.maxSoldiers ? `${unit.soldiers}/${unit.maxSoldiers}` : unit.soldiers;
      card.innerHTML = `
        <div class="unit-portrait">${escapeHtml(unit.general?.name || unit.name)}</div>
        <div class="unit-summary">
          <div class="name">${escapeHtml(unit.name)}${unit.isCommander ? ' · 主将' : ''}</div>
          <div class="muted">${sideLabel} · ${escapeHtml(getFormationTemplateLabel(unit))} · ${pos}</div>
          <div class="unit-stat-row"><span>总兵力</span><strong>${total}</strong></div>
          <div class="unit-stat-row"><span>士气</span><strong>${unit.morale ?? 0}/100 · ${escapeHtml(tier.label)}</strong></div>
          <div class="unit-stat-row"><span>构成</span><strong>${escapeHtml(getFormationCompositionText(unit))}</strong></div>
        </div>
      `;

      const occupiedSlots = new Map((unit.formationMembers || []).map(member => [member.slotKey, member]));
      grid.innerHTML = FORMATION_SLOT_KEYS.map(slotKey => {
        const member = occupiedSlots.get(slotKey);
        if (!member) {
          return `<div class="unit-formation-cell empty"><div>${escapeHtml(FORMATION_SLOT_LABELS[slotKey])}</div><div>空位</div></div>`;
        }
        const pct = member.maxSoldiers ? Math.max(0, Math.round(member.soldiers / member.maxSoldiers * 100)) : 0;
        const classes = ['unit-formation-cell'];
        if (member.soldiers <= 0) classes.push('fallen');
        return `
          <div class="${classes.join(' ')}">
            <div class="slot">${escapeHtml(FORMATION_SLOT_LABELS[slotKey])}</div>
            <div class="troop">${escapeHtml(TROOP_TYPES[member.troopType]?.label || member.troopType)}</div>
            <div class="hp">${member.soldiers}/${member.maxSoldiers}</div>
            <div class="muted">射程 ${member.range}</div>
            <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join('');
    }

    function renderBattleStatusPanel() {
      const list = document.getElementById('battle-status-list');
      if (!list) return;
      const playerAlive = units.filter(unit => unit.side === 'player' && unit.soldiers > 0 && !unit.isSupplyCart).length;
      const enemyAlive = units.filter(unit => unit.side === 'enemy' && unit.soldiers > 0 && !unit.isSupplyCart).length;
      const selectedText = selectedUnit ? `${selectedUnit.name} · ${mode || '已选中'}` : '未选择单位';
      list.innerHTML = `
        <div class="status-item"><div class="label">胜利条件</div><div>${escapeHtml(battleObjective?.friendlyTitle || '未设定')}</div></div>
        <div class="status-item"><div class="label">当前回合</div><div>${turn === 'player' ? '我方行动' : '敌方行动'}</div></div>
        <div class="status-item"><div class="label">当前选择</div><div>${escapeHtml(selectedText)}</div></div>
        <div class="status-item"><div class="label">战场兵力</div><div>我方 ${playerAlive} 队 · 敌方 ${enemyAlive} 队</div></div>
      `;
    }

    function createUnit(name, troopType, soldiers, side, general, extra = {}) {
      const base = TROOP_TYPES[troopType];
      const templateKey = extra.formationTemplate;
      const formationMembers = extra.isSupplyCart ? null : createFormationMembers(templateKey || 'vanguard', soldiers);
      const primaryType = templateKey ? FORMATION_TEMPLATES[templateKey].primary : troopType;
      const unit = {
        id: uid(), name, troopType: primaryType, soldiers, maxSoldiers: soldiers,
        attack: base.attack, defense: base.defense, speed: base.speed,
        range: base.range,
        morale: 75 + randInt(0, 20),
        general: general || createGeneral(side === 'player' ? GENERAL_NAMES : ENEMY_GENERAL_NAMES),
        side, x: -1, y: -1,
        hasMoved: false, hasActed: false,
        inRiver: false,
        skillUses: { ...SKILL_USES },
        chargeReady: false,
        isCommander: false,
        formationTemplate: templateKey || null,
        formationMembers,
        ...extra,
      };
      syncFormationTotals(unit);
      return unit;
    }

    function createPlayerPool() {
      return [
        createUnit('先锋编队', 'infantry', 420, 'player', null, { formationTemplate: 'vanguard' }),
        createUnit('突击编队', 'cavalry', 360, 'player', null, { formationTemplate: 'assault' }),
        createUnit('射击编队', 'archer', 340, 'player', null, { formationTemplate: 'missile' }),
        createUnit('守备编队', 'spear', 440, 'player', null, { formationTemplate: 'guard' }),
        createUnit('机动编队', 'cavalry', 320, 'player', null, { formationTemplate: 'mobile' }),
      ];
    }

    function spawnEnemies() {
      const templates = ['vanguard', 'assault', 'missile', 'guard', 'mobile'];
      const names = ['曹军先锋', '曹军突击', '曹军射击', '曹军守备', '曹军机动', '曹军偏师'];
      const occupied = new Set();
      const count = randInt(4, 6);
      let commander = null;

      for (let i = 0; i < count; i++) {
        let x, y, tries = 0;
        do {
          x = randInt(0, COLS - 1);
          y = ENEMY_DEPLOY_ROWS[randInt(0, ENEMY_DEPLOY_ROWS.length - 1)];
          tries++;
        } while (occupied.has(cellKey(x, y)) && tries < 50);
        if (occupied.has(cellKey(x, y))) continue;
        occupied.add(cellKey(x, y));

        const template = templates[randInt(0, templates.length - 1)];
        const u = createUnit(
          names[i] || '曹军部队',
          FORMATION_TEMPLATES[template].primary,
          randInt(280, 430),
          'enemy',
          null,
          { formationTemplate: template }
        );
        u.x = x; u.y = y;
        if (!commander) { u.isCommander = true; commander = u; }
        units.push(u);
      }
    }

    function configureBattleCommanders() {
      for (const unit of units) {
        if (unit.side === 'player') unit.isCommander = false;
      }
      const enemyCommander = units.find(unit => unit.side === 'enemy' && unit.isCommander);
      if (!enemyCommander) {
        const firstEnemy = units.find(unit => unit.side === 'enemy');
        if (firstEnemy) firstEnemy.isCommander = true;
      }
      if (!isAssassinationBattle()) return;
      const playerCommander = units.find(unit => unit.side === 'player');
      if (playerCommander) playerCommander.isCommander = true;
    }

    // ─── 移动 ───────────────────────────────────────────────
    function computeReachable(unit) {
      const maxDist = moveRange(unit);
      const result = [], visited = new Map();
      const queue = [{ x: unit.x, y: unit.y, dist: 0 }];
      visited.set(cellKey(unit.x, unit.y), 0);

      while (queue.length) {
        const { x, y, dist } = queue.shift();
        if (dist > 0) result.push({ x, y });
        if (dist >= maxDist) continue;

        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          const nk = cellKey(nx, ny);
          const blocked = unitAt(nx, ny);
          if (blocked && blocked.id !== unit.id) continue;
          const nd = dist + 1;
          if (!visited.has(nk) || visited.get(nk) > nd) {
            visited.set(nk, nd);
            queue.push({ x: nx, y: ny, dist: nd });
          }
        }
      }
      return result.filter(c => !unitAt(c.x, c.y));
    }

    function computeAttackable(unit) {
      if (unit.isSupplyCart) return [];
      return units.filter(u =>
        u.side !== unit.side && u.soldiers > 0 && canLockTarget(unit, u)
      );
    }

    function computeAttackRangeCells(unit) {
      if (!unit || unit.isSupplyCart) return [];
      const cells = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (isInFixedAttackPattern(unit, x, y)) cells.push({ x, y });
        }
      }
      return cells;
    }

    function aiTargetPriority(attacker, target) {
      if (isAssassinationBattle() && target.isCommander) {
        return target.side === 'player' ? 140 : 135;
      }
      if (!isSupplyTransportBattle()) {
        return (target.isCommander ? 50 : 0) + getTypeAdv(attacker, target) * 10;
      }
      if (target.isSupplyCart && target.side !== attacker.side) return 120;
      const enemyCart = getCart(attacker.side === 'player' ? 'enemy' : 'player');
      if (enemyCart && manhattan(target.x, target.y, enemyCart.x, enemyCart.y) <= 1) return 70;
      if (target.isCommander) return 55;
      return 10 + getTypeAdv(attacker, target) * 5;
    }

    function applyMove(unit, nx, ny) {
      const terrain = getTerrain(nx, ny);
      unit.x = nx; unit.y = ny;
      unit.hasMoved = true;

      checkTerrainTutorial(unit, terrain);
      checkApproachTutorials(unit);

      if (isRiverTerrain(terrain)) {
        unit.inRiver = true;
        unit.hasActed = true;
        log(`${unit.name} 进入河流 — 渡河受阻，本回合行动结束`, 'system');
      } else {
        unit.inRiver = false;
      }
      tryPickupDroppedSupply(unit);
    }

    function findMovePath(unit, tx, ty) {
      if (unit.x === tx && unit.y === ty) return [];
      const startKey = cellKey(unit.x, unit.y);
      const targetKey = cellKey(tx, ty);
      const queue = [{ x: unit.x, y: unit.y }];
      const cameFrom = new Map([[startKey, null]]);

      while (queue.length) {
        const current = queue.shift();
        if (cellKey(current.x, current.y) === targetKey) break;
        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = current.x + dx, ny = current.y + dy;
          if (!inBounds(nx, ny)) continue;
          const nk = cellKey(nx, ny);
          if (cameFrom.has(nk)) continue;
          const blocked = unitAt(nx, ny);
          if (blocked && blocked.id !== unit.id) continue;
          cameFrom.set(nk, current);
          queue.push({ x: nx, y: ny });
        }
      }

      if (!cameFrom.has(targetKey)) return [];
      const path = [];
      let cursor = { x: tx, y: ty };
      while (cellKey(cursor.x, cursor.y) !== startKey) {
        path.push(cursor);
        cursor = cameFrom.get(cellKey(cursor.x, cursor.y));
      }
      return path.reverse();
    }

    async function animateUnitMove(unit, tx, ty, stepDelay = 160) {
      const path = findMovePath(unit, tx, ty);
      if (!path.length) {
        applyMove(unit, tx, ty);
        renderBoard();
        updateDebug();
        return;
      }

      for (let i = 0; i < path.length; i++) {
        const step = path[i];
        if (i === path.length - 1) {
          applyMove(unit, step.x, step.y);
        } else {
          unit.x = step.x;
          unit.y = step.y;
          unit.inRiver = isRiverTerrain(getTerrain(step.x, step.y));
        }
        renderBoard();
        updateDebug();
        await sleep(stepDelay);
      }
    }

    // ─── 战斗 ───────────────────────────────────────────────
    function calcDamage(attacker, defender, chargeBonus = false) {
      const atkTier = getMoraleTier(attacker.morale);
      const defTier = getMoraleTier(defender.morale);
      const typeAdv = getTypeAdv(attacker, defender);

      let hitRate = 0.72 * atkTier.hit;
      if (isChaos(attacker) && Math.random() < 0.35) {
        return { hit: false, damage: 0, counter: 0, typeAdv, chaosFail: true };
      }
      if (Math.random() > hitRate) return { hit: false, damage: 0, counter: 0, typeAdv };

      const effAtk = attacker.attack * (1 + attacker.general.strength / 200) * atkTier.atk;
      const effDef = defender.defense * defTier.def;

      let damage = Math.round(
        (effAtk / Math.max(effDef, 1)) * 14 * typeAdv *
        (attacker.soldiers / attacker.maxSoldiers) * (0.85 + Math.random() * 0.3)
      );

      const hillFirst = isOnHill(attacker.x, attacker.y) && !isOnHill(defender.x, defender.y);
      if (hillFirst) damage = Math.round(damage * 1.25);

      const useCharge = chargeBonus || attacker.chargeReady;
      if (useCharge && canApplyChargeBonus(attacker)) {
        damage = Math.round(damage * 1.5);
        attacker.chargeReady = false;
      } else if (useCharge) {
        attacker.chargeReady = false;
        log(`${attacker.name} 在森林中无法发动冲锋`, 'system');
      }

      if (defender.inRiver) damage = Math.round(damage * RIVER_DAMAGE_MULT);
      damage = clamp(damage, 1, Math.round(attacker.soldiers * 0.15));

      let counter = 0;
      const dist = manhattan(attacker.x, attacker.y, defender.x, defender.y);
      if (!defender.isSupplyCart && !hillFirst && defender.soldiers > 0 && defender.range >= dist) {
        const counterRate = 0.55 * defTier.counter;
        if (Math.random() < counterRate) {
          const cAtk = defender.attack * (1 + defender.general.strength / 200) * defTier.atk;
          const cDef = attacker.defense * 0.5 * atkTier.def;
          counter = Math.round((cAtk / Math.max(cDef, 1)) * 7 * (defender.soldiers / defender.maxSoldiers));
          if (attacker.inRiver) counter = Math.round(counter * RIVER_DAMAGE_MULT);
          counter = clamp(counter, 0, Math.round(defender.soldiers * 0.1));
        }
      }

      return { hit: true, damage, counter, typeAdv, hillFirst };
    }

    function applyDamage(unit, amount) {
      const wasAlive = unit.soldiers > 0;
      if (unit.formationMembers?.length) {
        let remaining = amount;
        for (const slotPrefix of ['front', 'middle', 'rear']) {
          for (const member of unit.formationMembers.filter(item => item.soldiers > 0 && item.slotKey.startsWith(slotPrefix))) {
            if (remaining <= 0) break;
            const part = Math.min(member.soldiers, Math.max(1, Math.ceil(remaining / 2)));
            member.soldiers -= part;
            remaining -= part;
          }
          if (remaining <= 0) break;
        }
        syncFormationTotals(unit);
      } else {
      unit.soldiers = Math.max(0, unit.soldiers - amount);
      }
      if (unit.isSupplyCart) {
        if (wasAlive && unit.soldiers <= 0) destroyCart(unit);
        return;
      }
      changeMorale(unit, -Math.round(amount / unit.maxSoldiers * 35), '战损', false);
      if (wasAlive && unit.soldiers <= 0) onGeneralFallen(unit);
    }

    function resolveDirectAttack(attacker, defender, chargeBonus = false) {
      if (attacker.isSupplyCart) return Promise.resolve();
      if (isRout(attacker)) return Promise.resolve();
      if (isChaos(attacker) && Math.random() < 0.25) {
        log(`${attacker.name} 混乱中行动失败`, 'system');
        return Promise.resolve();
      }

      const wasCharge = (chargeBonus || attacker.chargeReady) && canApplyChargeBonus(attacker);
      const result = calcDamage(attacker, defender, chargeBonus);
      const typeLabel = TROOP_TYPES[attacker.troopType].label;
      const advLabel = result.typeAdv > 1 ? '（克制）' : '';

      if (result.chaosFail) {
        log(`${attacker.name} 混乱中攻击失误`, 'system');
        attacker.hasActed = true;
        return Promise.resolve();
      }
      if (!result.hit) {
        log(`${attacker.name} 攻击 ${defender.name} — 未命中`, 'system');
        attacker.hasActed = true;
        return Promise.resolve();
      }

      if (result.hillFirst) log(`${attacker.name} 占高地先手！`, 'skill');
      applyDamage(defender, result.damage);
      if (result.counter > 0) applyDamage(attacker, result.counter);

      const chargeText = wasCharge ? '发动冲锋！' : '发动攻击！';
      const targetName = defender.isSupplyCart ? '粮车' : defender.name;
      log(`${attacker.name}（${typeLabel}）${chargeText}${advLabel}`, 'skill');
      log(`  ${targetName} 损失 ${result.damage}${result.counter ? `，${attacker.name} 损失 ${result.counter}` : ''}`, 'damage');
      changeMorale(attacker, -randInt(1, 2), '激战消耗', false);
      return Promise.resolve();
    }

    function resolveAttack(attacker, defender, chargeBonus = false) {
      if (defender.isSupplyCart || !attacker.formationMembers?.length || !defender.formationMembers?.length) {
        return resolveDirectAttack(attacker, defender, chargeBonus);
      }

      if (attacker.isSupplyCart || isRout(attacker)) return Promise.resolve();
      if (isChaos(attacker) && Math.random() < 0.25) {
        log(`${attacker.name} 混乱中行动失败`, 'system');
        return Promise.resolve();
      }

      const distance = manhattan(attacker.x, attacker.y, defender.x, defender.y);
      const attackerBefore = cloneFormationSnapshot(attacker);
      const defenderBefore = cloneFormationSnapshot(defender);
      const timeline = [];
      let totalDamageToDefender = 0;
      let totalDamageToAttacker = 0;

      function pushBattleStep(step) {
        timeline.push({
          ...step,
          attackerSnapshot: cloneFormationSnapshot(attacker),
          defenderSnapshot: cloneFormationSnapshot(defender),
        });
      }

      function runSideRound(sourceUnit, targetUnit, label, isCounter, sourceSide, targetSide) {
        const readyMembers = getBattleReadyMembers(sourceUnit, distance).slice();
        if (!readyMembers.length) {
          pushBattleStep({ type: 'entry', text: `${label}无成员能够出手` });
          return;
        }
        for (const member of readyMembers) {
          if (member.soldiers <= 0 || member.status === 'stunned') continue;
          if (distance > 1 && member.range < distance) continue;
          if (sourceUnit.soldiers <= 0 || targetUnit.soldiers <= 0) return;
          const targetMember = chooseFormationTarget(member, targetUnit);
          if (!targetMember) return;
          const hitRate = 0.76 * getMoraleTier(sourceUnit.morale).hit;
          if (Math.random() > hitRate) {
            pushBattleStep({
              type: 'strike',
              className: 'miss',
              text: `${label}${TROOP_TYPES[member.troopType].label}攻击落空`,
              sourceSide,
              targetSide,
              sourceSlotKey: member.slotKey,
              targetSlotKey: targetMember.slotKey,
              hit: false,
              damage: 0,
            });
            continue;
          }
          const result = calculateMemberDamage(sourceUnit, member, targetUnit, targetMember, distance, isCounter);
          applyMemberDamage(targetUnit, targetMember, result.damage);
          if (targetUnit.id === defender.id) totalDamageToDefender += result.damage;
          else totalDamageToAttacker += result.damage;
          const adv = result.typeAdv > 1 ? '（克制）' : '';
          pushBattleStep({
            type: 'strike',
            className: 'damage',
            text: `${label}${TROOP_TYPES[member.troopType].label}击中${targetUnit.name}${TROOP_TYPES[targetMember.troopType].label}，损失 ${result.damage}${adv}`,
            sourceSide,
            targetSide,
            sourceSlotKey: member.slotKey,
            targetSlotKey: targetMember.slotKey,
            hit: true,
            damage: result.damage,
          });
        }
      }

      for (let round = 1; round <= 2; round++) {
        pushBattleStep({ type: 'round', text: `第 ${round} 轮` });
        runSideRound(attacker, defender, '攻方', false, 'attacker', 'defender');
        if (defender.soldiers > 0) runSideRound(defender, attacker, '守方还击：', true, 'defender', 'attacker');
      }

      changeMorale(attacker, -randInt(1, 2), '激战消耗', false);
      attacker.chargeReady = false;

      log(`${attacker.name} 与 ${defender.name} 展开编队交战`, 'skill');
      log(`  ${defender.name} 损失 ${totalDamageToDefender}，${attacker.name} 损失 ${totalDamageToAttacker}`, 'damage');
      if (defender.soldiers <= 0) onGeneralFallen(defender);
      if (attacker.soldiers <= 0) onGeneralFallen(attacker);
      return showFormationBattleOverlay({
        attackerBefore,
        defenderBefore,
        attackerAfter: cloneFormationSnapshot(attacker),
        defenderAfter: cloneFormationSnapshot(defender),
        timeline,
        distance,
      });
    }

    // ─── 技能 ───────────────────────────────────────────────
    function useInspire(caster, target) {
      if (caster.skillUses.inspire <= 0) return;
      const bonus = Math.round(20 * (1 + caster.general.intelligence / 200));
      changeMorale(target, bonus, '鼓舞');
      caster.skillUses.inspire--;
      caster.hasActed = true;
    }

    function useCharge(caster) {
      if (caster.skillUses.charge <= 0) return;
      if (getTerrain(caster.x, caster.y) === 'forest') {
        log('森林中骑兵无法冲锋', 'system');
        return;
      }
      caster.chargeReady = true;
      caster.skillUses.charge--;
      log(`${caster.general.name} 预备【冲锋】`, 'skill');
    }

    // ─── 据点 ───────────────────────────────────────────────
    function capturePoint(point, side) {
      point.owner = side;
      point.captureProgress = 0;
      point.captureSide = null;
      const info = STRATEGIC[point.type];
      log(`【${info.name}】被${side === 'player' ? '我军' : '敌军'}占领！`, 'skill');

      if (side === 'player') addRecap(`你占领了${info.name}`);

      if (point.type === 'supplyDepot') {
        raiseSupplyMorale(side, SUPPLY_CAPTURE_MORALE_BONUS, '夺得粮仓');
        if (isSupplyTransportBattle()) {
          spawnSupplyCart(side, point.x, point.y, true);
        }
      }
    }

    function processCaptureProgress() {
      const captureRequired = isStrongpointBattle() ? STRONGPOINT_CAPTURE_REQUIRED : 1;
      for (const point of strategicPoints) {
        const u = unitAt(point.x, point.y);
        if (!u) {
          if (point.captureSide) {
            point.captureSide = null;
            point.captureProgress = 0;
          }
          continue;
        }
        if (u.side === point.owner) {
          point.captureSide = null;
          point.captureProgress = 0;
          continue;
        }
        if (point.captureSide === u.side) {
          point.captureProgress += 1;
          if (point.captureProgress >= captureRequired) capturePoint(point, u.side);
        } else {
          point.captureSide = u.side;
          point.captureProgress = 0;
        }
      }
    }

    function applyStrategicTurnEffects(side) {
      for (const p of strategicPoints) {
        if (p.owner !== side) continue;
        if (p.type === 'camp') {
          changeMoraleSide(side, 2, '营寨补给', false);
          logMorale(`${side === 'player' ? '我军' : '敌军'}据守营寨，士气恢复`);
          for (const u of units) {
            if (u.side !== side || u.soldiers <= 0) continue;
            if (manhattan(u.x, u.y, p.x, p.y) <= 1) changeMorale(u, 3, '营寨附近', false);
          }
        }
      }
    }

    function recoverMorale(side) {
      for (const u of units) {
        if (u.side !== side || u.soldiers <= 0 || isRout(u)) continue;
        changeMorale(u, Math.round(u.general.leadership / 22), '统率恢复', false);
      }
    }

    // ─── 溃逃 ───────────────────────────────────────────────
    function processRout() {
      for (const u of units) {
        if (!isRout(u) || u.soldiers <= 0) continue;
        const edges = [];
        for (let x = 0; x < COLS; x++) { edges.push({ x, y: 0 }, { x, y: ROWS - 1 }); }
        for (let y = 0; y < ROWS; y++) { edges.push({ x: 0, y }, { x: COLS - 1, y }); }

        let best = edges[0], bestDist = Infinity;
        for (const e of edges) {
          const d = manhattan(u.x, u.y, e.x, e.y);
          if (d < bestDist) { bestDist = d; best = e; }
        }

        let moved = false;
        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = u.x + dx, ny = u.y + dy;
          if (!inBounds(nx, ny) || unitAt(nx, ny)) continue;
          if (manhattan(nx, ny, best.x, best.y) < bestDist) {
            u.x = nx; u.y = ny;
            u.inRiver = isRiverTerrain(getTerrain(nx, ny));
            moved = true;
            break;
          }
        }
        if (!moved) {
          for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
            const nx = u.x + dx, ny = u.y + dy;
            if (inBounds(nx, ny) && !unitAt(nx, ny)) {
              u.x = nx; u.y = ny;
              u.inRiver = isRiverTerrain(getTerrain(nx, ny));
              break;
            }
          }
        }
      }
    }

    // ─── 胜负 ───────────────────────────────────────────────
    function livingUnits(side) {
      return units.filter(u => u.side === side && u.soldiers > 0 && !u.isSupplyCart);
    }

    function activeUnits(side) {
      return livingUnits(side).filter(u => !isRout(u));
    }

    function allPointsOwnedBy(side) {
      return strategicPoints.every(p => p.owner === side);
    }

    function playerHoldsDefenseZone() {
      const playerDefenders = activeUnits('player').filter(u => DEFENSE_ZONE_ROWS.includes(u.y));
      const enemyIntruders = activeUnits('enemy').filter(u => DEFENSE_ZONE_ROWS.includes(u.y));
      return playerDefenders.length >= DEFENSE_PLAYER_UNITS_REQUIRED && enemyIntruders.length === 0;
    }

    function checkObjectiveWin() {
      const obj = battleObjective;
      if (!obj) return null;

      if (obj.id === 'supplyTransport' || obj.id === 'annihilation') {
        if (livingUnits('enemy').length === 0) return { win: true, msg: '敌军全灭！' };
        if (activeUnits('enemy').length === 0) {
          addRecap('敌军士气崩溃');
          return { win: true, msg: '敌军全线溃逃！' };
        }
      }
      if (obj.id === 'strongpoint' && allPointsOwnedBy('player')) {
        return { win: true, msg: '全部据点已占领！' };
      }
      if (obj.id === 'assassination') {
        const cmd = getCommander('enemy', true);
        if (cmd && cmd.soldiers <= 0) return { win: true, msg: '敌军主将已阵斩！' };
      }
      if (obj.id === 'defense' && defenseHoldTurns >= DEFENSE_HOLD_REQUIRED) {
        return { win: true, msg: `成功守住${getDefenseZoneLabel()} ${DEFENSE_HOLD_REQUIRED} 回合！` };
      }
      return null;
    }

    function checkObjectiveLoss() {
      if (isAssassinationBattle()) {
        const playerCommander = getCommander('player', true);
        if (playerCommander != null && playerCommander.soldiers <= 0) {
          return { win: false, msg: '我军主将已被阵斩……' };
        }
      }
      if (livingUnits('player').length === 0) return { win: false, msg: '我军全灭……' };
      if (activeUnits('player').length === 0) return { win: false, msg: '我军全部溃逃……' };
      if (battleObjective?.id === 'defense' && turnCounter > 0 && !playerHoldsDefenseZone()) {
        return { win: false, msg: `${getDefenseZoneLabel()}失守……` };
      }
      return null;
    }

    function checkVictory() {
      const win = checkObjectiveWin();
      if (win) { showOverlay('胜利', win.msg, true); return true; }
      const loss = checkObjectiveLoss();
      if (loss) { showOverlay('失败', loss.msg, false); return true; }
      return false;
    }

    function showOverlay(title, desc, isWin = false) {
      document.getElementById('overlay-title').textContent = title;
      document.getElementById('overlay-desc').textContent = desc;
      const recapBox = document.getElementById('recap-box');
      const recapList = document.getElementById('recap-list');
      if (isWin && battleRecap.length) {
        recapList.innerHTML = battleRecap.map(t => `<li>${t}</li>`).join('');
        recapBox.classList.remove('hidden');
      } else {
        recapBox.classList.add('hidden');
        recapList.innerHTML = '';
      }
      document.getElementById('overlay').classList.remove('hidden');
      phase = 'ended';
    }

    function getBattleSlotPosition(slotKey) {
      const [rowName, colName] = slotKey.split('-');
      const rowMap = { front: 0, middle: 1, rear: 2 };
      const colMap = { left: 0, center: 1, right: 2 };
      return {
        row: rowMap[rowName] ?? 0,
        col: colMap[colName] ?? 0,
        rowClass: `row-${rowName}`,
      };
    }

    function renderBattleFormationGrid(snapshotBefore, snapshotAfter, active = {}) {
      const beforeBySlot = new Map(snapshotBefore.formationMembers.map(member => [member.slotKey, member]));
      const afterBySlot = new Map(snapshotAfter.formationMembers.map(member => [member.slotKey, member]));
      return FORMATION_SLOT_KEYS.map(slotKey => {
        const before = beforeBySlot.get(slotKey);
        const after = afterBySlot.get(slotKey);
        const pos = getBattleSlotPosition(slotKey);
        const stateClasses = [];
        if (after && after.soldiers <= 0) stateClasses.push('fallen');
        if (active.sourceSlotKey === slotKey) stateClasses.push('striker');
        if (active.targetSlotKey === slotKey) stateClasses.push('targeted');
        if (!after && !before) {
          return `<div class="formation-slot empty ${pos.rowClass}" data-slot="${slotKey}" style="--row:${pos.row};--col:${pos.col};"></div>`;
        }
        const current = after || before;
        const loss = before && after ? before.soldiers - after.soldiers : 0;
        const hpRatio = current.maxSoldiers > 0 ? clamp((after ? after.soldiers : 0) / current.maxSoldiers, 0, 1) * 100 : 0;
        return `
          <div class="formation-slot ${pos.rowClass} ${stateClasses.join(' ')}" data-slot="${slotKey}" style="--row:${pos.row};--col:${pos.col};">
            <div class="formation-standee"></div>
            <div class="slot-name">${FORMATION_SLOT_LABELS[slotKey]}</div>
            <div class="member-name">${TROOP_TYPES[current.troopType].label}</div>
            <div class="member-hp"><div class="member-hp-fill" style="width:${hpRatio}%"></div></div>
            ${loss > 0 ? `<div class="member-loss">-${loss}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function appendBattleEvent(event) {
      const list = document.getElementById('battle-event-list');
      const entry = document.createElement('div');
      entry.className = `entry ${event.type === 'round' ? 'round' : ''} ${event.className || ''}`;
      entry.textContent = event.text;
      list.appendChild(entry);
      list.scrollTop = list.scrollHeight;
    }

    function renderBattleAnimationState(report, attackerSnapshot, defenderSnapshot, active = {}) {
      const leftKey = report.attackerBefore.side === 'player' ? 'attacker' : 'defender';
      const rightKey = leftKey === 'attacker' ? 'defender' : 'attacker';
      const beforeByKey = {
        attacker: report.attackerBefore,
        defender: report.defenderBefore,
      };
      const snapshotByKey = {
        attacker: attackerSnapshot,
        defender: defenderSnapshot,
      };
      const getActiveState = key => active.sourceSide === key
        ? { sourceSlotKey: active.sourceSlotKey }
        : active.targetSide === key
          ? { targetSlotKey: active.targetSlotKey }
          : {};
      document.getElementById('battle-attacker-grid').innerHTML =
        renderBattleFormationGrid(beforeByKey[leftKey], snapshotByKey[leftKey], getActiveState(leftKey));
      document.getElementById('battle-defender-grid').innerHTML =
        renderBattleFormationGrid(beforeByKey[rightKey], snapshotByKey[rightKey], getActiveState(rightKey));
      document.getElementById('battle-attacker-morale').style.width = `${clamp(snapshotByKey[leftKey].morale, 0, 100)}%`;
      document.getElementById('battle-defender-morale').style.width = `${clamp(snapshotByKey[rightKey].morale, 0, 100)}%`;
    }

    async function playFormationBattleTimeline(report) {
      const closeBtn = document.getElementById('battle-close');
      closeBtn.disabled = true;
      closeBtn.textContent = '演出中...';
      document.getElementById('battle-event-list').innerHTML = '';
      let attackerSnapshot = report.attackerBefore;
      let defenderSnapshot = report.defenderBefore;
      renderBattleAnimationState(report, attackerSnapshot, defenderSnapshot);

      for (const step of report.timeline) {
        if (step.type === 'round' || step.type === 'entry') {
          appendBattleEvent(step);
          await sleep(step.type === 'round' ? 260 : 180);
          continue;
        }

        renderBattleAnimationState(report, attackerSnapshot, defenderSnapshot, step);
        await sleep(160);
        attackerSnapshot = step.attackerSnapshot;
        defenderSnapshot = step.defenderSnapshot;
        renderBattleAnimationState(report, attackerSnapshot, defenderSnapshot, step.hit ? step : {});
        appendBattleEvent(step);
        await sleep(step.hit ? 220 : 160);
      }

      renderBattleAnimationState(report, report.attackerAfter, report.defenderAfter);
      closeBtn.disabled = false;
      closeBtn.textContent = '返回战场';
      updateUI();
    }

    function showFormationBattleOverlay(report) {
      if (activeBattleOverlayResolve) {
        activeBattleOverlayResolve();
        activeBattleOverlayResolve = null;
      }
      const playerSnapshot = report.attackerBefore.side === 'player' ? report.attackerBefore : report.defenderBefore;
      const enemySnapshot = report.attackerBefore.side === 'enemy' ? report.attackerBefore : report.defenderBefore;
      document.getElementById('battle-attacker-title').textContent =
        `我方 · ${playerSnapshot.name} · ${playerSnapshot.generalName}`;
      document.getElementById('battle-defender-title').textContent =
        `敌方 · ${enemySnapshot.name} · ${enemySnapshot.generalName}`;
      document.getElementById('battle-sequence-title').textContent = `编队交战 · 距离 ${report.distance}`;
      document.getElementById('formation-battle').classList.remove('hidden');
      playFormationBattleTimeline(report);
      return new Promise(resolve => {
        activeBattleOverlayResolve = resolve;
      });
    }

    function closeFormationBattleOverlay() {
      document.getElementById('formation-battle').classList.add('hidden');
      if (activeBattleOverlayResolve) {
        activeBattleOverlayResolve();
        activeBattleOverlayResolve = null;
      }
    }

    // ─── AI ───────────────────────────────────────────────
    function scoreMove(enemy, cell) {
      let score = 0;
      const point = getPointAt(cell.x, cell.y);
      if (point && point.owner !== enemy.side) score += isStrongpointBattle() ? 120 : 40;
      if (isStrongpointBattle() && point?.owner === enemy.side) score += 55;
      if (getTerrain(cell.x, cell.y) === 'hill') score += 15;
      if (getTerrain(cell.x, cell.y) === 'forest') score += 8;

      if (isAssassinationBattle()) {
        const enemyCommander = getCommander('enemy');
        const playerCommander = getCommander('player');
        const playerUnits = activeUnits('player');
        if (enemy.isCommander) {
          const nearestThreat = playerUnits.length
            ? Math.min(...playerUnits.map(unit => manhattan(cell.x, cell.y, unit.x, unit.y)))
            : 6;
          const nearbyAllies = activeUnits('enemy').filter(
            unit => unit.id !== enemy.id && manhattan(cell.x, cell.y, unit.x, unit.y) <= 2
          ).length;
          score += nearestThreat * 9 + nearbyAllies * 12;
        } else if (enemyCommander) {
          score += Math.max(0, 48 - manhattan(cell.x, cell.y, enemyCommander.x, enemyCommander.y) * 14);
          const threatsNearCommander = playerUnits.filter(
            unit => manhattan(unit.x, unit.y, enemyCommander.x, enemyCommander.y) <= 4
          );
          if (threatsNearCommander.length) {
            const nearestThreatDistance = Math.min(
              ...threatsNearCommander.map(unit => manhattan(cell.x, cell.y, unit.x, unit.y))
            );
            score += Math.max(0, 40 - nearestThreatDistance * 9);
          }
        }
        if (playerCommander) {
          score += Math.max(0, 24 - manhattan(cell.x, cell.y, playerCommander.x, playerCommander.y) * 4);
        }
      }

      if (isSupplyTransportBattle()) {
        const playerCart = getCart('player');
        const enemyCart = getCart('enemy');
        if (playerCart) {
          const d = manhattan(cell.x, cell.y, playerCart.x, playerCart.y);
          score += 55 - d * 9;
        }
        if (enemyCart) {
          const d = manhattan(cell.x, cell.y, enemyCart.x, enemyCart.y);
          score += 30 - d * 6;
        }
      } else {
        const players = activeUnits('player');
        if (players.length) {
          const nearest = Math.min(...players.map(p => manhattan(cell.x, cell.y, p.x, p.y)));
          score -= nearest * 3;
        }
      }
      return score;
    }

    function shouldEnemyHoldStrongpoint(enemy) {
      if (!isStrongpointBattle()) return false;
      const point = getPointAt(enemy.x, enemy.y);
      return point?.owner === enemy.side;
    }

    async function runEnemyTurn() {
      turn = 'enemy';
      updateUI();
      log('—— 敌方回合 ——', 'system');

      for (const enemy of units.filter(u => u.side === 'enemy' && u.soldiers > 0 && !isRout(u))) {
        if (checkVictory()) return;
        enemy.hasMoved = false;
        enemy.hasActed = false;

        const targets = activeUnits('player');
        if (!targets.length) break;

        const attackables = computeAttackable(enemy);
        if (attackables.length && !enemy.hasActed) {
          attackables.sort((a, b) => aiTargetPriority(enemy, b) - aiTargetPriority(enemy, a));
          await resolveAttack(enemy, attackables[0]);
          enemy.hasActed = true;
        } else if (shouldEnemyHoldStrongpoint(enemy)) {
          enemy.hasMoved = true;
        } else if (!enemy.hasMoved) {
          const reach = computeReachable(enemy);
          if (reach.length) {
            reach.sort((a, b) => scoreMove(enemy, b) - scoreMove(enemy, a));
            await animateUnitMove(enemy, reach[0].x, reach[0].y);
            const postMoveAttackables = computeAttackable(enemy);
            if (postMoveAttackables.length && !enemy.hasActed) {
              postMoveAttackables.sort((a, b) => aiTargetPriority(enemy, b) - aiTargetPriority(enemy, a));
              await resolveAttack(enemy, postMoveAttackables[0]);
              enemy.hasActed = true;
            }
          }
        }

        renderBoard();
        updateDebug();
        await sleep(350);
      }

      processCaptureProgress();
      if (processSupplyCartMoves()) return;
      processRout();
      applyStrategicTurnEffects('enemy');
      if (checkVictory()) return;

      recoverMorale('enemy');
      turn = 'player';
      resetPlayerTurn();
      log('—— 我方回合 ——', 'system');
      updateUI();
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function resetPlayerTurn() {
      for (const u of units) {
        if (u.side === 'player' && u.soldiers > 0) {
          u.hasMoved = false;
          u.hasActed = false;
          u.movedFrom = null;
        }
      }
      turnCounter++;
      if (battleObjective?.id === 'defense' && playerHoldsDefenseZone()) {
        defenseHoldTurns++;
        updateObjectiveBar();
        log(`守卫进度 ${defenseHoldTurns}/${DEFENSE_HOLD_REQUIRED} · ${getDefenseZoneLabel()}`, 'system');
      }
      recoverMorale('player');
      applyStrategicTurnEffects('player');
      updateObjectiveBar();
      clearSelection();
    }

    // ─── 渲染 ───────────────────────────────────────────────
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const wrap = board.parentElement.getBoundingClientRect();
      const tileW = Math.max(50, Math.min(85, Math.floor(Math.min(
        (wrap.width - 12) / ((COLS + ROWS) / 2),
        (wrap.height - 12) / ((COLS + ROWS) * 0.31)
      ))));
      const tileH = Math.round(tileW * 0.5);
      const tileSide = Math.round(tileW / Math.SQRT2);
      const boardW = Math.round((COLS + ROWS) * tileW / 2 + tileW);
      const boardH = Math.round((COLS + ROWS) * tileH / 2 + tileH);
      board.style.setProperty('--tile-w', `${tileW}px`);
      board.style.setProperty('--tile-h', `${tileH}px`);
      board.style.setProperty('--tile-side', `${tileSide}px`);
      board.style.width = `${boardW}px`;
      board.style.height = `${boardH}px`;
      const zoneRows = DEFENSE_ZONE_ROWS;
      const depot = getSupplyDepot();
      const playerCart = getCart('player');
      const highlightCart = playerCart || getCart('enemy');
      const enemyCommander = getCommander('enemy');
      const playerCommander = getCommander('player');

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const terrain = getTerrain(x, y);
          const cellData = getCell(x, y);
          const cell = document.createElement('div');
          cell.className = 'cell ' + terrain;
          cell.dataset.x = String(x);
          cell.dataset.y = String(y);
          const left = Math.round((x - y) * tileW / 2 + (ROWS - 1) * tileW / 2 + tileW / 2);
          const top = Math.round((x + y) * tileH / 2 + 8);
          cell.style.left = `${left}px`;
          cell.style.top = `${top}px`;
          cell.style.zIndex = String((x + y) * 2 + (militaryAt(x, y) || cartAt(x, y) ? 2 : 0));

          if (phase === 'deploy' && PLAYER_DEPLOY_ROWS.includes(y)) cell.classList.add('deploy-zone');
          if (battleObjective?.id === 'defense' && zoneRows.includes(y)) cell.classList.add('defense-zone');
          if (cellData?.campZone === 'player') cell.classList.add('highlight-player-camp');
          if (cellData?.campZone === 'enemy') cell.classList.add('highlight-enemy-camp');
          if (depot && depot.x === x && depot.y === y) cell.classList.add('highlight-supply-depot');
          if (highlightCart && highlightCart.x === x && highlightCart.y === y) cell.classList.add('highlight-cart');
          if (isAssassinationBattle() && enemyCommander?.x === x && enemyCommander?.y === y) {
            cell.classList.add('highlight-target-commander');
          }
          if (isAssassinationBattle() && playerCommander?.x === x && playerCommander?.y === y) {
            cell.classList.add('highlight-protect-commander');
          }

          if (cellData?.campZone === 'player') {
            const cm = document.createElement('span');
            cm.className = 'camp-marker';
            cm.textContent = '我营';
            cm.title = '我军营地 · 粮车运抵此处获胜';
            cell.appendChild(cm);
          }
          if (cellData?.campZone === 'enemy') {
            const cm = document.createElement('span');
            cm.className = 'camp-marker';
            cm.textContent = '敌营';
            cm.title = '敌军营地';
            cell.appendChild(cm);
          }

          const point = getPointAt(x, y);
          if (point) {
            const pm = document.createElement('span');
            pm.className = 'point-marker ' + (point.owner === 'player' ? 'player-own' : point.owner === 'enemy' ? 'enemy-own' : 'neutral');
            pm.textContent = STRATEGIC[point.type].label;
            pm.title = STRATEGIC[point.type].desc + (point.owner !== 'neutral' ? `\n所属：${point.owner === 'player' ? '我军' : '敌军'}` : '');
            cell.appendChild(pm);

            if (point.captureSide && point.owner !== point.captureSide) {
              const bar = document.createElement('div');
              bar.className = 'capture-bar';
              const captureRequired = isStrongpointBattle() ? STRONGPOINT_CAPTURE_REQUIRED : 1;
              const pct = Math.min(
                100,
                Math.round(((point.captureProgress + 1) / (captureRequired + 1)) * 100)
              );
              bar.innerHTML = `<div class="capture-fill" style="width:${pct}%"></div>`;
              cell.appendChild(bar);
            }
          }

          const drop = droppedSupplies.find(d => d.x === x && d.y === y);
          if (drop) {
            const de = document.createElement('span');
            de.className = 'dropped-supply';
            de.textContent = '粮';
            de.title = '散落粮食 · 任意部队进入可拾取';
            cell.appendChild(de);
          }

          if (reachable.some(c => c.x === x && c.y === y)) cell.classList.add('can-move');
          if (mode === 'move' && selectedUnit?.x === x && selectedUnit?.y === y) cell.classList.add('can-move');
          if (attackRangeCells.some(c => c.x === x && c.y === y)) cell.classList.add('attack-range');
          if (attackable.some(u => u.x === x && u.y === y)) cell.classList.add('can-attack');
          if (skillTargets.some(c => c.x === x && c.y === y)) cell.classList.add('can-skill');
          if (selectedUnit?.x === x && selectedUnit?.y === y && selectedUnit.movedFrom) cell.classList.add('post-move');

          const military = militaryAt(x, y);
          const cart = cartAt(x, y);

          if (military) {
            const tier = getMoraleTier(military.morale);
            const ue = document.createElement('div');
            ue.className = `unit ${military.side} ${military.hasActed && military.hasMoved ? 'acted' : ''} ${tier.id === 'chaos' || tier.id === 'rout' ? tier.id : ''} ${military.isCommander ? 'commander' : ''} ${military.inRiver ? 'in-river' : ''}`;
            if (selectedUnit?.id === military.id) cell.classList.add('selected');

            ue.innerHTML = `
              <span>${getFormationTemplateLabel(military)}</span>
              <span>${military.soldiers}</span>
              <span class="unit-status ${tier.id}">${tier.label}</span>
              ${renderFormationChips(military)}
            `;
            if (military.isCommander) {
              const badge = document.createElement('span');
              badge.className = 'commander-badge';
              badge.textContent = isAssassinationBattle()
                ? military.side === 'enemy'
                  ? '敌主'
                  : '我主'
                : '主';
              ue.appendChild(badge);
            }
            ue.title = `${military.name} · ${military.general.name}\n${getFormationCompositionText(military)}\n${STRATEGIC[point?.type]?.desc || TERRAIN_HINT[terrain] || ''}`;

            if (phase === 'deploy' && military.side === 'player' && military.x >= 0) {
              ue.draggable = true;
              ue.addEventListener('dragstart', e => { dragUnit = military; e.dataTransfer.effectAllowed = 'move'; });
            }
            cell.appendChild(ue);
          } else if (cart) {
            const ue = document.createElement('div');
            ue.className = `unit supply-cart ${cart.side}`;
            ue.innerHTML = `
              <span>粮车</span>
              <span class="cart-hp">${cart.soldiers}</span>
              <span class="unit-status">运粮</span>
            `;
            ue.title = `${cart.name} · 生命 ${cart.soldiers}/${cart.maxSoldiers}\n距营地 ${distToCamp(cart)} 格`;
            cell.appendChild(ue);
          }

          cell.addEventListener('click', () => onCellClick(x, y));
          cell.addEventListener('dragover', e => { if (phase === 'deploy') e.preventDefault(); });
          cell.addEventListener('drop', e => { e.preventDefault(); onDeployDrop(x, y); });
          board.appendChild(cell);
        }
      }
    }

    function renderDeployPool() {
      const pool = document.getElementById('deploy-pool');
      pool.innerHTML = '';
      const undeployed = units.filter(u => u.side === 'player' && u.x < 0);
      if (!undeployed.length) {
        pool.innerHTML = '<span style="color:var(--muted);font-size:0.72rem;">部署完成 · 点击开始战斗</span>';
        return;
      }
      for (const u of undeployed) {
        const el = document.createElement('div');
        el.className = 'unit player';
        el.draggable = true;
        el.innerHTML = `<span>${u.name}${u.isCommander ? '·主将' : ''}</span><span>${getFormationCompositionText(u)}</span>`;
        el.title = `${u.general.name}\n${getFormationCompositionText(u)}`;
        el.addEventListener('click', () => { inspectUnit(u); updateUI(); });
        el.addEventListener('dragstart', e => { dragUnit = u; e.dataTransfer.effectAllowed = 'move'; });
        pool.appendChild(el);
      }
    }

    function updateDebug() {
      const list = document.getElementById('debug-list');
      list.innerHTML = '';
      for (const u of units) {
        if (u.isSupplyCart && phase !== 'deploy') {
          const el = document.createElement('div');
          el.className = 'debug-unit ' + (u.side === 'player' ? 'player-side' : 'enemy-side');
          el.innerHTML = `
            <div class="name">${u.name} <span class="type-tag">粮车</span></div>
            <div>(${u.x},${u.y}) · 生命 ${u.soldiers}/${u.maxSoldiers} · 距营地 ${distToCamp(u)} 格</div>
          `;
          list.appendChild(el);
          continue;
        }
        if (u.soldiers <= 0 && phase !== 'deploy') continue;
        const tier = getMoraleTier(u.morale);
        const pos = u.x >= 0 ? `(${u.x},${u.y})` : '未部署';
        const el = document.createElement('div');
        el.className = 'debug-unit ' + (u.side === 'player' ? 'player-side' : 'enemy-side');
        el.innerHTML = `
          <div class="name">${u.name}${u.isCommander ? '★' : ''} <span class="type-tag">${getFormationTemplateLabel(u)}</span></div>
          <div>${pos} · ${u.soldiers} · <span class="unit-status ${tier.id}">${tier.label}</span></div>
          <div class="morale-bar"><div class="morale-fill" style="width:${u.morale}%"></div></div>
          <div>${u.general.name}${u.inRiver ? ' · 渡河' : ''}</div>
          <div>${getFormationCompositionText(u)}</div>
        `;
        list.appendChild(el);
      }
    }

    function updateUI() {
      const badge = document.getElementById('phase-badge');
      const turnInfo = document.getElementById('turn-info');
      const btnStart = document.getElementById('btn-start');
      const btnEnd = document.getElementById('btn-end-turn');
      const btnWait = document.getElementById('btn-wait');

      if (phase === 'deploy') {
        badge.textContent = '部署阶段';
        badge.className = 'phase-badge';
        turnInfo.textContent = isSupplyTransportBattle()
          ? '占领粮仓 → 护送粮车回营 · 可拦截敌军粮车'
          : battleObjective?.id === 'defense'
            ? `部署后前往${getDefenseZoneLabel()}`
            : '拖至底部三排 · 观察据点与地形';
        btnStart.disabled = false;
        btnEnd.disabled = true;
        btnWait.disabled = true;
      } else if (phase === 'battle') {
        badge.textContent = turn === 'player' ? '我方回合' : '敌方回合';
        badge.className = 'phase-badge ' + turn;
        turnInfo.textContent = turn === 'player'
          ? battleObjective?.id === 'defense'
            ? `守住${getDefenseZoneLabel()} · 至少 ${DEFENSE_PLAYER_UNITS_REQUIRED} 人驻守且敌军不得进入`
            : '移动、占点、维持士气'
          : '敌方行动中…';
        btnStart.disabled = true;
        btnEnd.disabled = turn !== 'player';
        btnWait.disabled = turn !== 'player' || !selectedUnit;
      }

      updateObjectiveBar();
      renderSkillBar();
      renderBoard();
      renderDeployPool();
      updateDebug();
      renderInspectedUnitPanel();
      renderBattleStatusPanel();
      renderActionMenu();
    }

    function renderSkillBar() {
      const bar = document.getElementById('skill-bar');
      bar.innerHTML = '';
      if (phase !== 'battle' || turn !== 'player' || !selectedUnit || selectedUnit.hasActed) return;
      const u = selectedUnit;
      [
        { id: 'inspire', label: `鼓舞(${u.skillUses.inspire})`, ok: u.skillUses.inspire > 0 },
        { id: 'charge', label: `冲锋(${u.skillUses.charge})`, ok: u.skillUses.charge > 0 && !u.chargeReady && getTerrain(u.x, u.y) !== 'forest' },
      ].forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'skill-btn';
        btn.textContent = s.label;
        btn.disabled = !s.ok;
        btn.addEventListener('click', () => onSkillClick(s.id));
        bar.appendChild(btn);
      });
    }

    function renderActionMenu() {
      const menu = document.getElementById('action-menu');
      const hint = document.getElementById('action-menu-hint');
      const waitBtn = document.getElementById('action-wait');
      const rallyBtn = document.getElementById('action-rally');
      const attackBtn = document.getElementById('action-attack');
      const cancelBtn = document.getElementById('action-cancel');
      if (phase !== 'battle' || turn !== 'player' || !selectedUnit || !selectedUnit.movedFrom || !['post-move', 'target-attack'].includes(mode)) {
        menu.classList.add('hidden');
        menu.style.left = '';
        menu.style.top = '';
        waitBtn.hidden = false;
        rallyBtn.hidden = false;
        attackBtn.hidden = false;
        cancelBtn.hidden = false;
        return;
      }
      const attackCount = attackable.length;
      const selectingAttackTarget = mode === 'target-attack';
      hint.textContent = mode === 'target-attack'
        ? '选择攻击目标'
        : `选择行动 · 右键可撤回 · 可攻 ${attackCount}`;
      waitBtn.hidden = selectingAttackTarget;
      rallyBtn.hidden = selectingAttackTarget;
      attackBtn.hidden = selectingAttackTarget;
      cancelBtn.hidden = false;
      attackBtn.disabled = attackCount === 0;
      attackBtn.textContent = mode === 'target-attack' ? '选择目标中' : `攻击${attackCount ? `(${attackCount})` : ''}`;
      menu.classList.remove('hidden');
      positionActionMenu(menu);
    }

    function positionActionMenu(menu) {
      if (!selectedUnit) return;
      const area = document.querySelector('.battle-area');
      const cell = document.querySelector(`#board .cell[data-x="${selectedUnit.x}"][data-y="${selectedUnit.y}"]`);
      if (!area || !cell) return;
      const areaRect = area.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();
      const menuW = menu.offsetWidth || 108;
      const menuH = menu.offsetHeight || 150;
      let left = cellRect.right - areaRect.left + 8;
      let top = cellRect.top - areaRect.top - 10;
      const maxLeft = Math.max(8, areaRect.width - menuW - 8);
      const maxTop = Math.max(8, areaRect.height - menuH - 8);
      if (left > maxLeft) left = cellRect.left - areaRect.left - menuW - 8;
      left = Math.max(8, Math.min(left, maxLeft));
      top = Math.max(8, Math.min(top, maxTop));
      menu.style.left = `${Math.round(left)}px`;
      menu.style.top = `${Math.round(top)}px`;
    }

    function clearSelection() {
      if (selectedUnit) selectedUnit.movedFrom = null;
      selectedUnit = null; mode = null;
      reachable = []; attackable = []; skillTargets = []; attackRangeCells = [];
      renderActionMenu();
    }

    function cancelCurrentOperation() {
      if (!selectedUnit) return false;
      const unit = selectedUnit;
      if (unit.movedFrom && ['post-move', 'target-attack'].includes(mode)) {
        const from = unit.movedFrom;
        unit.x = from.x;
        unit.y = from.y;
        unit.inRiver = from.inRiver;
        unit.hasMoved = false;
        log(`${unit.name} 撤回移动`, 'system');
      }
      clearSelection();
      return true;
    }

    function canSelectPlayerUnit(unit) {
      return Boolean(unit && unit.side === 'player' && !unit.hasActed && !unit.isSupplyCart);
    }

    function selectPlayerUnit(unit) {
      if (!canSelectPlayerUnit(unit)) return false;
      if (isRout(unit)) {
        log(`${unit.name} 溃逃中`, 'system');
        return false;
      }
      selectedUnit = unit;
      inspectUnit(unit);
      attackable = computeAttackable(unit);
      if (!unit.hasMoved) {
        mode = 'move';
        reachable = computeReachable(unit);
        attackRangeCells = [];
      } else {
        mode = attackable.length ? 'target-attack' : null;
        reachable = [];
        attackRangeCells = computeAttackRangeCells(unit);
      }
      skillTargets = [];
      return true;
    }

    function cancelOperationAndMaybeSelect(clicked) {
      const nextUnit = clicked?.id !== selectedUnit?.id && canSelectPlayerUnit(clicked) ? clicked : null;
      cancelCurrentOperation();
      if (nextUnit) selectPlayerUnit(nextUnit);
      updateUI();
    }

    function finishUnitAction(unit) {
      unit.hasActed = true;
      unit.hasMoved = true;
      unit.movedFrom = null;
      processRout();
      checkVictory();
    }

    function enterPostMove(unit) {
      mode = 'post-move';
      reachable = [];
      attackable = computeAttackable(unit);
      attackRangeCells = computeAttackRangeCells(unit);
      skillTargets = [];
    }

    function enterPostMoveAtCurrentCell(unit) {
      unit.movedFrom = { x: unit.x, y: unit.y, inRiver: unit.inRiver };
      unit.hasMoved = true;
      enterPostMove(unit);
    }

    function undoPendingMove() {
      if (!selectedUnit?.movedFrom || !['post-move', 'target-attack'].includes(mode)) return;
      cancelCurrentOperation();
      updateUI();
    }

    function waitSelectedUnit() {
      if (!selectedUnit) return;
      finishUnitAction(selectedUnit);
      clearSelection();
      updateUI();
    }

    function rallySelectedUnit() {
      if (!selectedUnit) return;
      const isAfterMove = Boolean(selectedUnit.movedFrom);
      const moraleGain = isAfterMove ? 8 : 12;
      changeMorale(selectedUnit, moraleGain, '整顿');
      if (selectedUnit.chargeReady) selectedUnit.chargeReady = false;
      log(`${selectedUnit.name} 整顿队伍，士气恢复`, 'heal');
      finishUnitAction(selectedUnit);
      clearSelection();
      updateUI();
    }

    async function onCellClick(x, y) {
      const clicked = unitAt(x, y);
      if (clicked) inspectUnit(clicked);
      if (phase !== 'battle' || turn !== 'player') {
        if (clicked) updateUI();
        return;
      }

      if (mode === 'skill-inspire') {
        if (clicked?.side === 'player' && !clicked.isSupplyCart && clicked.id !== selectedUnit.id) {
          useInspire(selectedUnit, clicked);
          clearSelection(); updateUI();
        } else {
          cancelOperationAndMaybeSelect(clicked);
        }
        return;
      }
      if (mode === 'move') {
        if (selectedUnit.x === x && selectedUnit.y === y) {
          enterPostMoveAtCurrentCell(selectedUnit);
          updateUI();
        } else if (reachable.some(c => c.x === x && c.y === y)) {
          selectedUnit.movedFrom = { x: selectedUnit.x, y: selectedUnit.y, inRiver: selectedUnit.inRiver };
          applyMove(selectedUnit, x, y);
          if (selectedUnit.hasActed) {
            finishUnitAction(selectedUnit);
            clearSelection();
          } else {
            enterPostMove(selectedUnit);
          }
          updateUI();
        } else {
          cancelOperationAndMaybeSelect(clicked);
        }
        return;
      }

      if (mode === 'post-move') {
        cancelOperationAndMaybeSelect(clicked);
        return;
      }

      if (mode === 'target-attack') {
        if (clicked?.side === 'enemy' && attackable.some(u => u.id === clicked.id)) {
          selectedUnit.movedFrom = null;
          await resolveAttack(selectedUnit, clicked, selectedUnit.chargeReady);
          finishUnitAction(selectedUnit);
          clearSelection(); updateUI();
        } else {
          cancelOperationAndMaybeSelect(clicked);
        }
        return;
      }

      if (selectPlayerUnit(clicked)) {
        updateUI();
        return;
      }

      clearSelection(); updateUI();
    }

    function onSkillClick(id) {
      if (!selectedUnit || selectedUnit.hasActed) return;
      if (id === 'inspire') { mode = 'skill-inspire'; log('选择友军使用【鼓舞】', 'skill'); }
      else if (id === 'charge') { useCharge(selectedUnit); updateUI(); }
    }

    function onDeployDrop(x, y) {
      if (phase !== 'deploy' || !dragUnit) return;
      if (!PLAYER_DEPLOY_ROWS.includes(y)) { log('只能部署在底部三排', 'system'); return; }
      if (unitAt(x, y)) { log('该格已有部队', 'system'); return; }
      dragUnit.x = x; dragUnit.y = y;
      checkApproachTutorials(dragUnit);
      dragUnit = null;
      renderBoard(); renderDeployPool(); updateDebug();
    }

    function startBattle() {
      if (!units.some(u => u.side === 'player' && u.x >= 0)) {
        log('请至少部署一支部队', 'system'); return;
      }
      if (isAssassinationBattle()) {
        const playerCommander = getCommander('player', true);
        if (playerCommander && playerCommander.x < 0) {
          log('斩将战必须先部署我方主将', 'system'); return;
        }
      }
      showObjectiveIntro();
    }

    function beginBattle() {
      hideObjectiveIntro();
      phase = 'battle';
      turn = 'player';
      battleRecap = [];
      resetPlayerTurn();
      BattleTutorialManager.applyLessonTags(battleConfig.lessonTags);
      if (isSupplyTransportBattle()) BattleTutorialManager.maybeShow('lesson_supply_transport');
      log(`战斗开始 — ${battleObjective.friendlyTitle}`, 'system');
      log('—— 我方回合 ——', 'system');
      updateUI();
    }

    function init(config = {}) {
      battleConfig = { lessonTags: config.lessonTags || [], objectiveId: config.objectiveId || null };
      pickObjective();
      generateMap();
      units = createPlayerPool();
      spawnEnemies();
      configureBattleCommanders();
      phase = 'deploy';
      turn = 'player';
      supplyCartClaimSide = null;
      droppedSupplies = [];
      battleRecap = [];
      inspectedUnit = null;
      clearSelection();
      hideObjectiveIntro();
      BattleTutorialManager.hideToast();

      if (!battleConfig.lessonTags.length) battleConfig.lessonTags = inferLessonTags();

      document.getElementById('log').innerHTML = '';
      document.getElementById('morale-log').innerHTML = '';
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('recap-box').classList.add('hidden');
      log('部署部队，观察地图上的据点与地形', 'system');
      if (battleObjective?.id === 'defense') {
        log(`本局需守住${getDefenseZoneLabel()}：至少 ${DEFENSE_PLAYER_UNITS_REQUIRED} 支未溃逃部队驻守，且敌军不得踏入，连续 ${DEFENSE_HOLD_REQUIRED} 回合。`, 'system');
      }
      updateUI();
    }

    document.getElementById('btn-start').addEventListener('click', startBattle);
    document.getElementById('btn-objective-ok').addEventListener('click', beginBattle);
    document.getElementById('btn-tutorial-close').addEventListener('click', () => BattleTutorialManager.hideToast());
    document.getElementById('btn-end-turn').addEventListener('click', () => {
      if (turn !== 'player') return;
      processCaptureProgress();
      if (processSupplyCartMoves()) return;
      processRout();
      if (checkVictory()) return;
      runEnemyTurn();
    });
    document.getElementById('btn-wait').addEventListener('click', () => {
      waitSelectedUnit();
    });
    document.getElementById('action-wait').addEventListener('click', waitSelectedUnit);
    document.getElementById('action-rally').addEventListener('click', rallySelectedUnit);
    document.getElementById('action-attack').addEventListener('click', () => {
      if (!selectedUnit || !attackable.length) return;
      mode = 'target-attack';
      log('选择敌方编队进入战斗演出', 'skill');
      updateUI();
    });
    document.getElementById('action-cancel').addEventListener('click', undoPendingMove);
    document.getElementById('battle-close').addEventListener('click', closeFormationBattleOverlay);
    document.getElementById('board').addEventListener('contextmenu', event => {
      event.preventDefault();
      undoPendingMove();
    });
    document.getElementById('btn-restart').addEventListener('click', () => { nextId = 1; init(); });

    /** 剧情战役：init({ objectiveId: 'supplyTransport', lessonTags: ['SupplyTransportBattle'] }) */
    window.BattleDemo = { init, BattleTutorialManager, inferLessonTags };

    init();
  </script>
</body>
</html>
