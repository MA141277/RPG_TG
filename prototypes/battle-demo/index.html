      const camp = side === 'player' ? playerCamp : enemyCamp;
      if (!camp) return false;
      return camp.cells.some(c => c.x === x && c.y === y);
    }

    function distToCamp(cart) {
      const camp = cart.side === 'player' ? playerCamp : enemyCamp;
      if (!camp?.cells.length) return 99;
      return Math.min(...camp.cells.map(c => manhattan(cart.x, cart.y, c.x, c.y)));
    }

    function removeCartsOfSide(side) {
      units = units.filter(u => !(u.isSupplyCart && u.side === side));
    }

    function getCampAnchor(side) {
      return side === 'player'
        ? { x: 1, y: 8 }
        : { x: COLS - 2, y: 1 };
    }

    function raiseSupplyMorale(side, delta, reason) {
      let affected = 0;
      for (const unit of units) {
        if (unit.side !== side || unit.soldiers <= 0 || unit.isSupplyCart) continue;
        changeMorale(unit, delta, reason, false);
        affected++;
      }
      if (!affected) return;
      const sideLabel = side === 'player' ? '我军' : '敌军';
      logMorale(`${sideLabel}${reason}，士气提升`);
      if (side === 'player') BattleTutorialManager.maybeShow('morale_boost');
    }

    function findSpawnNear(originX, originY, side) {
      const candidates = [];
      const queue = [{ x: originX, y: originY, dist: 0 }];
      const visited = new Set([cellKey(originX, originY)]);

      while (queue.length && candidates.length < 8) {
        const { x, y, dist } = queue.shift();
        if (dist > 0 && dist <= 2 && isPassableTile(x, y)) {
          if (!(x === originX && y === originY)) candidates.push({ x, y });
        }
        if (dist >= 2) continue;
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const nx = x + dx, ny = y + dy;
          const nk = cellKey(nx, ny);
          if (!inBounds(nx, ny) || visited.has(nk)) continue;
          visited.add(nk);
          queue.push({ x: nx, y: ny, dist: dist + 1 });
        }
      }

      const camp = side === 'player' ? playerCamp : enemyCamp;
      const campCenter = camp?.cells[0] || { x: originX, y: originY };
      candidates.sort((a, b) =>
        manhattan(a.x, a.y, campCenter.x, campCenter.y) - manhattan(b.x, b.y, campCenter.x, campCenter.y)
      );
      return candidates[0] || null;
    }

    function createSupplyCart(side, spawnX, spawnY) {
      return {
        id: uid(),
        name: side === 'player' ? '我军粮车' : '敌军粮车',
        troopType: 'supplyCart',
        isSupplyCart: true,
        soldiers: CART_MAX_HP,
        maxSoldiers: CART_MAX_HP,
        attack: 0,
        defense: 15,
        speed: 12,
        range: 0,
        morale: 100,
        general: { name: '辎重队', leadership: 0, strength: 0, intelligence: 0 },
        side,
        x: spawnX,
        y: spawnY,
        hasMoved: false,
        hasActed: true,
        inRiver: false,
        skillUses: { inspire: 0 },
        isCommander: false,
      };
    }

    function spawnSupplyCart(side, originX, originY, fromDepot = true) {
      if (!isSupplyTransportBattle()) return;
      if (supplyCartClaimSide != null && supplyCartClaimSide !== side) {
        log(
          `${side === 'player' ? '我军' : '敌军'}已失去粮车归属，无法再生成粮车`,
          'system'
        );
        return false;
      }
      if (getAnyCart()) return false;
      const spot = findSpawnNear(originX, originY, side);
      if (!spot) {
        log(`${side === 'player' ? '我军' : '敌军'}粮车无法出发（无可用空地）`, 'system');
        return false;
      }
      supplyCartClaimSide = side;
      const cart = createSupplyCart(side, spot.x, spot.y);
      units.push(cart);
      const label = side === 'player' ? '我军' : '敌军';
      if (fromDepot) {
        log(`${label}粮车已从粮仓附近出发`, 'skill');
      } else {
        log(`${label}粮车从散落粮食处重新出发`, 'skill');
      }
      if (side === 'player') {
        addRecap('粮车已出发');
        log('粮车已出发。请护送其返回营地。', 'system');
        BattleTutorialManager.maybeShow('supply_cart_spawn');
      } else {
        log('敌军粮车已出发。', 'system');
      }
      return true;
    }

    function destroyCart(cart) {
      const sideLabel = cart.side === 'player' ? '我军' : '敌军';
      log(`${sideLabel}粮车被摧毁`, 'damage');
      log('粮车被摧毁。粮食散落在战场上。', 'system');
      if (cart.side === 'player') addRecap('我军粮车被摧毁');
      droppedSupplies.push({ x: cart.x, y: cart.y });
      units = units.filter(u => u.id !== cart.id);
      if (cart.side === 'player') BattleTutorialManager.maybeShow('supply_cart_destroyed');
    }

    function tryPickupDroppedSupply(unit) {
      if (!isSupplyTransportBattle() || unit.isSupplyCart) return;
      const idx = droppedSupplies.findIndex(d => d.x === unit.x && d.y === unit.y);
      if (idx < 0) return;
      if (supplyCartClaimSide != null && supplyCartClaimSide !== unit.side) return;
      const spawned = spawnSupplyCart(unit.side, unit.x, unit.y, false);
      if (!spawned) return;
      droppedSupplies.splice(idx, 1);
      log('粮食已被重新夺取。', 'skill');
      addRecap(`${unit.side === 'player' ? '我军' : '敌军'}重新夺取散落粮食`);
      raiseSupplyMorale(unit.side, DROPPED_SUPPLY_MORALE_BONUS, '夺回散落军粮');
      if (unit.side === 'player') BattleTutorialManager.maybeShow('supply_pickup');
    }

    function autoMoveCartStep(cart) {
      if (cart.soldiers <= 0) return;
      const campCells = (cart.side === 'player' ? playerCamp : enemyCamp)?.cells || [];
      if (!campCells.length) return;

      let best = null, bestDist = Infinity;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        const nx = cart.x + dx, ny = cart.y + dy;
        if (!isPassableTile(nx, ny, cart.id)) continue;
        const d = Math.min(...campCells.map(c => manhattan(nx, ny, c.x, c.y)));
        if (d < bestDist) {
          bestDist = d;
          best = { x: nx, y: ny };
        }
      }
      if (best) {
        cart.x = best.x;
        cart.y = best.y;
        cart.inRiver = false;
      }
    }

    function processSupplyCartMoves() {
      if (!isSupplyTransportBattle()) return;
      for (const cart of units.filter(u => u.isSupplyCart && u.soldiers > 0)) {
        for (let i = 0; i < CART_MOVE_PER_TURN; i++) {
          if (isInCampZone(cart.x, cart.y, cart.side)) break;
          autoMoveCartStep(cart);
          if (isInCampZone(cart.x, cart.y, cart.side)) break;
        }
        if (isInCampZone(cart.x, cart.y, cart.side)) {
          if (cart.side === 'player') {
            addRecap('粮车成功运回营地');
            showOverlay('胜利', '粮食已运回营地！', true);
          } else {
            showOverlay('失败', '敌军粮食已运回营地……', false);
          }
          return true;
        }
      }
      return false;
    }

    function militaryAt(x, y) {
      return units.find(u => u.x === x && u.y === y && u.soldiers > 0 && !u.isSupplyCart);
    }

    function cartAt(x, y) {
      return units.find(u => u.x === x && u.y === y && u.soldiers > 0 && u.isSupplyCart);
    }

    function unitAt(x, y) {
      return militaryAt(x, y) || cartAt(x, y);
    }

    function isRiverTerrain(t) { return t === 'river'; }
    function isBridgeTerrain(t) { return t === 'bridge'; }

    function ownsWatchTower(side, x, y) {
      for (const p of strategicPoints) {
        if (p.type !== 'watchTower' || p.owner !== side) continue;
        if (manhattan(x, y, p.x, p.y) <= 1) return true;
      }
      return false;
    }

    function getVision(unit) {
      let v = 3;
      if (getTerrain(unit.x, unit.y) === 'hill') v += 2;
      if (getTerrain(unit.x, unit.y) === 'forest') v = 1;
      for (const p of strategicPoints) {
        if (p.type === 'watchTower' && p.owner === unit.side && manhattan(unit.x, unit.y, p.x, p.y) <= 2) v += 2;
      }
      return v;
    }

    function canSee(attacker, tx, ty) {
      return manhattan(attacker.x, attacker.y, tx, ty) <= getVision(attacker);
    }

    function getEffectiveRange(unit) {
      if (unit.formationMembers?.length) {
        const aliveMembers = unit.formationMembers.filter(member => member.soldiers > 0);
        if (!aliveMembers.length) return 0;
        let maxRange = Math.max(...aliveMembers.map(member => member.range));
        if (aliveMembers.some(member => member.troopType === 'archer') && getTerrain(unit.x, unit.y) === 'hill') maxRange += 1;
        if (ownsWatchTower(unit.side, unit.x, unit.y)) maxRange += 1;
        return maxRange;
      }
      let r = TROOP_TYPES[unit.troopType].range;
      if (r <= 1) return r;
      if (unit.troopType === 'archer' && getTerrain(unit.x, unit.y) === 'hill') r += 1;
      if (ownsWatchTower(unit.side, unit.x, unit.y)) r += 1;
      return r;
    }

    function rangeToTarget(attacker, defender) {
      let r = getEffectiveRange(attacker);
      if (r > 1 && (getTerrain(attacker.x, attacker.y) === 'forest' || getTerrain(defender.x, defender.y) === 'forest')) {
        r = Math.max(1, Math.floor(r / 2));
      }
      return r;
    }

    function canLockTarget(attacker, defender) {
      const dist = manhattan(attacker.x, attacker.y, defender.x, defender.y);
      if (getTerrain(defender.x, defender.y) === 'forest' && dist >= FOREST_LOCK_RANGE) return false;
      return isInFixedAttackPattern(attacker, defender.x, defender.y) && getBattleReadyMembers(attacker, dist).length > 0;
    }

    function getAliveCombatMembers(unit) {
      if (unit.formationMembers?.length) {
        return unit.formationMembers.filter(member => member.soldiers > 0 && member.status !== 'stunned');
      }
      return unit.soldiers > 0 && !unit.isSupplyCart
        ? [{ troopType: unit.troopType, range: TROOP_TYPES[unit.troopType]?.range || 1 }]
        : [];
    }

    function hasRangedMember(unit) {
      return getAliveCombatMembers(unit).some(member => member.range > 1);
    }

    function hasOnlyMeleeMembers(unit) {
      const members = getAliveCombatMembers(unit);
      return members.length > 0 && members.every(member => member.range <= 1);
    }

    function isInFixedAttackPattern(attacker, tx, ty) {
      const dx = Math.abs(tx - attacker.x);
      const dy = Math.abs(ty - attacker.y);
      if (dx === 0 && dy === 0) return false;
      if (hasRangedMember(attacker)) {
        return (dx === 0 && dy <= 2) || (dy === 0 && dx <= 2) || (dx === 1 && dy === 1);
      }
      if (hasOnlyMeleeMembers(attacker)) {
        return (dx + dy) === 1;
      }
      const maxRange = getEffectiveRange(attacker);
      return (dx + dy) > 0 && (dx + dy) <= maxRange;
    }

    function getBattleReadyMembers(unit, distance) {
      if (!unit.formationMembers?.length) return [];
      return unit.formationMembers.filter(member =>
        member.soldiers > 0 &&
        member.status !== 'stunned' &&
        (distance <= 1 || member.range >= distance)
      );
    }

    function getAliveFormationMembers(unit) {
      return unit.formationMembers?.filter(member => member.soldiers > 0) || [];
    }

    function cloneFormationSnapshot(unit) {
      const members = unit.formationMembers?.map(member => ({ ...member })) || [];
      return {
        id: unit.id,
        name: unit.name,
        side: unit.side,
        controller: unit.controller || null,
        generalName: unit.general.name,
        troopType: unit.troopType,
        facing: unit.facing,
        isCommander: unit.isCommander === true,
        captainMemberId: unit.captainMemberId || null,
        morale: unit.morale,
        soldiers: unit.soldiers,
        maxSoldiers: unit.maxSoldiers,
        formationMembers: members,
      };
    }

    function cloneBattleAnimationSnapshot(snapshot) {
      return {
        ...snapshot,
        formationMembers: snapshot.formationMembers.map(member => ({ ...member })),
      };
    }

    function applyBattleAnimationStrike(state, step) {
      if (!step?.hit || !(step.damage > 0)) {
        return {
          attackerSnapshot: state.attackerSnapshot,
          defenderSnapshot: state.defenderSnapshot,
        };
      }
      const nextAttackerSnapshot = cloneBattleAnimationSnapshot(state.attackerSnapshot);
      const nextDefenderSnapshot = cloneBattleAnimationSnapshot(state.defenderSnapshot);
      const targetSnapshot = step.targetSide === 'attacker'
        ? nextAttackerSnapshot
        : nextDefenderSnapshot;
      const targetMember = targetSnapshot.formationMembers.find(member => member.slotKey === step.targetSlotKey);
      if (!targetMember) {
        return {
          attackerSnapshot: nextAttackerSnapshot,
          defenderSnapshot: nextDefenderSnapshot,
        };
      }
      targetMember.soldiers = Math.max(0, targetMember.soldiers - step.damage);
      targetSnapshot.soldiers = targetSnapshot.formationMembers.reduce(
        (total, member) => total + Math.max(0, member.soldiers),
        0
      );
      return {
        attackerSnapshot: nextAttackerSnapshot,
        defenderSnapshot: nextDefenderSnapshot,
      };
    }

    function getFormationSlotMeta(slotKey, mirrorCols = false) {
      const [rowName = 'front', colName = 'center'] = String(slotKey).split('-');
      const row = rowName === 'front' ? 0 : rowName === 'middle' ? 1 : 2;
      const rawCol = colName === 'left' ? 0 : colName === 'center' ? 1 : 2;
      const displayColName = mirrorCols
        ? ({ left: 'right', center: 'center', right: 'left' }[colName] || colName)
        : colName;
      const visualCol = displayColName === 'left' ? 0 : displayColName === 'center' ? 1 : 2;
      return { rowName, colName, row, col: rawCol, visualCol, displayColName };
    }

    function shouldMirrorFormationCols(unit) {
      return unit?.side === 'player';
    }

    function getFormationRowMembers(alive, rowName) {
      return alive.filter(member => member.slotKey.startsWith(`${rowName}-`));
    }

    function getFormationResolutionOrder(member) {
      const meta = getFormationSlotMeta(member?.slotKey || '');
      return {
        rank: meta.row,
        lane: meta.col,
      };
    }

    function sortFormationMembersForBattleOrder(members) {
      return members.slice().sort((a, b) => {
        const orderA = getFormationResolutionOrder(a);
        const orderB = getFormationResolutionOrder(b);
        if (orderA.rank !== orderB.rank) return orderA.rank - orderB.rank;
        return orderB.lane - orderA.lane;
      });
    }

    function getVisualFormationDepth(unit, member) {
      return getBattleSlotPosition(
        member.slotKey,
        shouldMirrorFormationCols(unit)
      ).x;
    }

    function chooseFormationTarget(attackerUnit, attackerMember, defenderUnit) {
      const alive = getAliveFormationMembers(defenderUnit);
      if (!alive.length) return null;
      const attackerMeta = getFormationSlotMeta(
        attackerMember?.slotKey || '',
        shouldMirrorFormationCols(attackerUnit)
      );
      const defenderMirrorCols = shouldMirrorFormationCols(defenderUnit);
      const sameLaneTargets = alive
        .filter(member => getFormationSlotMeta(member.slotKey, defenderMirrorCols).visualCol === attackerMeta.visualCol)
        .sort((a, b) => getFormationResolutionOrder(a).rank - getFormationResolutionOrder(b).rank);
      if (sameLaneTargets.length) {
        return sameLaneTargets[0];
      }
      const frontMostRank = alive.reduce((best, member) => {
        const rank = getFormationResolutionOrder(member).rank;
        return Math.min(best, rank);
      }, Infinity);
      const frontMostTargets = alive.filter(member => getFormationResolutionOrder(member).rank === frontMostRank);
      return frontMostTargets.length
        ? frontMostTargets[randInt(0, frontMostTargets.length - 1)]
        : null;
    }

    function pickRandomFormationMemberIndex(poolLength, randomValue = Math.random()) {
      if (!Number.isFinite(poolLength) || poolLength <= 0) return -1;
      const clamped = Math.max(0, Math.min(0.999999, Number(randomValue) || 0));
      return Math.floor(clamped * poolLength);
    }

    function buildScheduledFormationSideStrikes(sourceUnit, targetUnit, options = {}) {
      const {
        distance = 1,
        sourceSide = 'attacker',
        targetSide = 'defender',
        label = '',
        random = Math.random,
      } = options;
      const readyPool = sortFormationMembersForBattleOrder(getBattleReadyMembers(sourceUnit, distance)).filter((member) => {
        if (!member || member.soldiers <= 0) return false;
        if (member.status === 'stunned') return false;
        return !(distance > 1 && member.range < distance);
      });
      const strikes = [];
      let launchAtMs = 0;

      while (readyPool.length) {
        const nextIndex = pickRandomFormationMemberIndex(readyPool.length, random());
        const member = readyPool.splice(nextIndex, 1)[0];
        if (!member) continue;
        const previewTarget = chooseFormationTarget(sourceUnit, member, targetUnit);
        const nextDelayMs = readyPool.length ? randInt(200, 400) : null;
        strikes.push({
          type: 'strike',
          className: 'pending',
          text: `${label}${TROOP_TYPES[member.troopType]?.label || member.troopType || ''}发起攻击`,
          sourceSide,
          targetSide,
          sourceSlotKey: member.slotKey,
          targetSlotKey: previewTarget?.slotKey || null,
          sourceTroopType: member.troopType,
          targetTroopType: previewTarget?.troopType || null,
          launchAtMs,
          nextDelayMs,
          member,
        });
        launchAtMs += nextDelayMs || 0;
      }

      return strikes;
    }

    function getMemberTypeAdv(attackerMember, defenderMember) {
      if (attackerMember.troopType === 'cavalry' && defenderMember.range > 1) {
        return 1.5;
      }
      if (attackerMember.troopType === 'spear' && defenderMember.troopType === 'cavalry') {
        return 1.5;
      }
      return 1;
    }

    function calculateMemberDamage(attackerUnit, attackerMember, defenderUnit, defenderMember, distance, isCounter = false) {
      const atkTier = getMoraleTier(attackerUnit.morale);
      const defTier = getMoraleTier(defenderUnit.morale);
      const typeAdv = getMemberTypeAdv(attackerMember, defenderMember);
      const rangePenalty = distance > 1 && attackerMember.range === distance ? 0.9 : 1;
      const strengthBonus = 1 + attackerUnit.general.strength / 240;
      const effAtk = attackerMember.attack * strengthBonus * atkTier.atk * rangePenalty;
      const effDef = Math.max(1, defenderMember.defense * defTier.def);
      let damage = Math.round((effAtk / effDef) * (isCounter ? 8 : 11) * typeAdv * (0.85 + Math.random() * 0.25));

      if (isOnHill(attackerUnit.x, attackerUnit.y) && !isOnHill(defenderUnit.x, defenderUnit.y)) damage = Math.round(damage * 1.15);
      if (defenderUnit.inRiver) damage = Math.round(damage * RIVER_DAMAGE_MULT);
      damage = clamp(damage, 1, Math.max(1, Math.round(attackerMember.soldiers * 0.22)));
      return { damage, typeAdv };
    }

    function applyMemberDamage(unit, member, damage) {
      member.soldiers = Math.max(0, member.soldiers - damage);
      syncFormationTotals(unit);
      changeMorale(unit, -Math.max(1, Math.round(damage / unit.maxSoldiers * 35)), '编队战损', false);
      if (unit.soldiers <= 0) onGeneralFallen(unit);
    }

    function isOnHill(x, y) { return getTerrain(x, y) === 'hill'; }

    // ─── 地图生成 ───────────────────────────────────────────
    function scoreStrategicPoint(type, x, y) {
      if (isStrongpointBattle()) {
        const centerX = (COLS - 1) / 2;
        const centerY = (ROWS - 1) / 2;
        const centerBias = Math.abs(x - centerX) * 1.4 + Math.abs(y - centerY) * 2.2;
        return centerBias + Math.random();
      }
      if (type !== 'supplyDepot' || !isSupplyTransportBattle()) return Math.random();
      const enemyAnchor = getCampAnchor('enemy');
      const playerAnchor = getCampAnchor('player');
      const enemyDistance = manhattan(x, y, enemyAnchor.x, enemyAnchor.y);
      const playerDistance = manhattan(x, y, playerAnchor.x, playerAnchor.y);
      return enemyDistance * 5 - playerDistance * 2 + Math.abs(y - 3) * 2 + Math.random();
    }

    function findStrategicPointSlot(type, used) {
      const candidates = [];
      const playerAnchor = getCampAnchor('player');
      const enemyAnchor = getCampAnchor('enemy');
      let tries = 0;
      while (tries < 120) {
        tries++;
        const x = randInt(1, COLS - 2), y = randInt(1, ROWS - 2);
        const k = cellKey(x, y);
        if (used.has(k)) continue;
        const t = getTerrain(x, y);
        if (isRiverTerrain(t) || isBridgeTerrain(t)) continue;
        if (PLAYER_DEPLOY_ROWS.includes(y) || ENEMY_DEPLOY_ROWS.includes(y)) continue;
        if (isStrongpointBattle()) {
          if (
            manhattan(x, y, playerAnchor.x, playerAnchor.y) < STRONGPOINT_MIN_CAMP_DISTANCE ||
            manhattan(x, y, enemyAnchor.x, enemyAnchor.y) < STRONGPOINT_MIN_CAMP_DISTANCE
          ) {
            continue;
          }
          if (
            strategicPoints.some(point =>
              manhattan(x, y, point.x, point.y) < STRONGPOINT_MIN_POINT_DISTANCE
            )
          ) {
            continue;
          }
        }
        candidates.push({ x, y, score: scoreStrategicPoint(type, x, y) });
      }
      if (!candidates.length && isStrongpointBattle()) {
        const relaxedCandidates = [];
        tries = 0;
        while (tries < 120) {
          tries++;
          const x = randInt(1, COLS - 2), y = randInt(1, ROWS - 2);
          const k = cellKey(x, y);
          if (used.has(k)) continue;
          const t = getTerrain(x, y);
          if (isRiverTerrain(t) || isBridgeTerrain(t)) continue;
          if (PLAYER_DEPLOY_ROWS.includes(y) || ENEMY_DEPLOY_ROWS.includes(y)) continue;
          if (
            manhattan(x, y, playerAnchor.x, playerAnchor.y) < Math.max(2, STRONGPOINT_MIN_CAMP_DISTANCE - 1) ||
            manhattan(x, y, enemyAnchor.x, enemyAnchor.y) < Math.max(2, STRONGPOINT_MIN_CAMP_DISTANCE - 1)
          ) {
            continue;
          }
          if (
            strategicPoints.some(point =>
              manhattan(x, y, point.x, point.y) < Math.max(2, STRONGPOINT_MIN_POINT_DISTANCE - 1)
            )
          ) {
            continue;
          }
          relaxedCandidates.push({ x, y, score: scoreStrategicPoint(type, x, y) });
        }
        if (relaxedCandidates.length) {
          relaxedCandidates.sort((a, b) => a.score - b.score);
          const pool = relaxedCandidates.slice(0, Math.min(4, relaxedCandidates.length));
          return pool[randInt(0, pool.length - 1)];
        }
      }
      if (!candidates.length) return null;
      candidates.sort((a, b) => a.score - b.score);
      const pool = candidates.slice(0, Math.min(4, candidates.length));
      return pool[randInt(0, pool.length - 1)];
    }

    function generateMap() {
      grid = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          let terrain = 'plain';
          const r = Math.random();
          if (r < 0.16) terrain = 'forest';
          else if (r < 0.24) terrain = 'hill';
          grid.push({ x, y, terrain });
        }
      }

      const riverY = randInt(2, 4);
      const bridgeX = randInt(2, COLS - 3);
      for (let x = 0; x < COLS; x++) {
        const c = getCell(x, riverY);
        c.terrain = x === bridgeX ? 'bridge' : 'river';
      }

      strategicPoints = [];
      playerCamp = null;
      enemyCamp = null;
      droppedSupplies = [];

      const types = isSupplyTransportBattle()
        ? ['supplyDepot', 'watchTower']
        : isStrongpointBattle()
          ? STRONGPOINT_TYPES
          : ['camp', 'supplyDepot', 'watchTower'];
      const used = new Set([cellKey(bridgeX, riverY)]);

      for (const type of types) {
        const slot = findStrategicPointSlot(type, used);
        if (!slot) continue;
        used.add(cellKey(slot.x, slot.y));
        strategicPoints.push({
          id: type + '_' + slot.x + slot.y,
          type,
          x: slot.x,
          y: slot.y,
          owner: 'neutral',
          captureSide: null,
          captureProgress: 0,
        });
      }

      if (!isSupplyTransportBattle() && !strategicPoints.some(p => p.type === 'camp')) {
        let tries = 0;
        while (tries < 80) {
          tries++;
          const x = randInt(1, COLS - 2), y = randInt(2, 4);
          const k = cellKey(x, y);
          if (used.has(k)) continue;
          if (isRiverTerrain(getTerrain(x, y))) continue;
          used.add(k);
          strategicPoints.push({ id: 'camp_' + x + y, type: 'camp', x, y, owner: 'neutral', captureSide: null, captureProgress: 0 });
          break;
        }
      }

      placeFactionCamps(used);
    }

    function applyScenarioMap() {
      const scenario = battleConfig.scenario;
      if (!scenario) return;

      for (const cell of grid) {
        cell.terrain = 'plain';
        delete cell.campZone;
      }

      for (const patch of scenario.terrain || []) {
        const cell = getCell(patch.x, patch.y);
        if (cell) cell.terrain = patch.terrain;
      }

      strategicPoints = (scenario.strategicPoints || []).map(point => ({
        id: point.id || `${point.type}_${point.x}_${point.y}`,
        type: point.type,
        x: point.x,
        y: point.y,
        owner: point.owner || 'neutral',
        captureSide: null,
        captureProgress: 0,
      }));

      playerCamp = { side: 'player', cells: [{ x: 1, y: 8 }, { x: 2, y: 8 }] };
      enemyCamp = { side: 'enemy', cells: [{ x: 9, y: 2 }, { x: 10, y: 2 }] };
      for (const cell of playerCamp.cells) {
        const target = getCell(cell.x, cell.y);
        if (target) target.campZone = 'player';
      }
      for (const cell of enemyCamp.cells) {
        const target = getCell(cell.x, cell.y);
        if (target) target.campZone = 'enemy';
      }
    }

    function placeFactionCamps(used) {
      const playerCells = [
        { x: 1, y: 8 }, { x: 2, y: 8 }, { x: 1, y: 9 }, { x: 2, y: 9 },
      ];
      const enemyCells = [
        { x: COLS - 3, y: 0 }, { x: COLS - 2, y: 0 }, { x: COLS - 3, y: 1 }, { x: COLS - 2, y: 1 },
      ];

      playerCamp = { side: 'player', cells: playerCells.filter(c => {
        const k = cellKey(c.x, c.y);
        if (used.has(k)) return false;
        used.add(k);
        const cell = getCell(c.x, c.y);
        if (cell) cell.campZone = 'player';
        return true;
      }) };

      enemyCamp = { side: 'enemy', cells: enemyCells.filter(c => {
        const k = cellKey(c.x, c.y);
        if (used.has(k)) return false;
        used.add(k);
        const cell = getCell(c.x, c.y);
        if (cell) cell.campZone = 'enemy';
        return true;
      }) };
    }

    function pickObjective() {
      if (battleConfig.objectiveId) {
        battleObjective = OBJECTIVES.find(o => o.id === battleConfig.objectiveId) || OBJECTIVES[0];
      } else {
        battleObjective = OBJECTIVES[randInt(0, OBJECTIVES.length - 1)];
      }
      defenseHoldTurns = 0;
      turnCounter = 0;
      updateObjectiveBar();
    }

    function inferLessonTags() {
      const tags = [];
      if (grid.some(c => c.terrain === 'bridge')) tags.push('BridgeBattle');
      if (battleObjective?.id === 'supplyTransport') tags.push('SupplyTransportBattle');
      if (battleObjective?.id === 'defense') tags.push('DefenseBattle');
      if (grid.some(c => c.terrain === 'forest')) tags.push('AmbushBattle');
      if (battleObjective?.id === 'assassination') tags.push('CommanderBattle');
      return tags;
    }

    function getObjectiveProgressText() {
      if (!battleObjective || phase === 'deploy') return '';
      const obj = battleObjective;
      if (obj.id === 'defense') {
        const defenders = activeUnits('player').filter(u => DEFENSE_ZONE_ROWS.includes(u.y)).length;
        const intruders = activeUnits('enemy').filter(u => DEFENSE_ZONE_ROWS.includes(u.y)).length;
        const remain = Math.max(0, DEFENSE_HOLD_REQUIRED - defenseHoldTurns);
        return `${getDefenseZoneLabel()} · 守卫进度 ${defenseHoldTurns}/${DEFENSE_HOLD_REQUIRED} · 我军 ${defenders}/${DEFENSE_PLAYER_UNITS_REQUIRED} · 敌军 ${intruders} · 还需${remain}回合`;
      }
      if (obj.id === 'strongpoint') {
        const owned = strategicPoints.filter(p => p.owner === 'player').length;
        return `据点进度 ${owned}/${strategicPoints.length}`;
      }
      if (obj.id === 'supplyTransport') {
        const cart = getCart('player');
        if (cart) {
          return `粮车生命 ${cart.soldiers}/${cart.maxSoldiers} · 距营地 ${distToCamp(cart)} 格`;
        }
        const depot = getSupplyDepot();
        if (depot?.owner === 'player') return '等待粮车出发或已在途中';
        if (depot?.captureSide === 'player') return '正在占领粮仓…';
        if (droppedSupplies.length) return '战场上有散落粮食';
        return '向粮仓进军并占领';
      }
      if (obj.id === 'assassination') {
        const enemyCommander = getCommander('enemy');
        const playerCommander = getCommander('player');
        if (!enemyCommander) return '敌将已被击败';
        const playerStatus = playerCommander
          ? `我方主将 ${playerCommander.general.name} ${playerCommander.soldiers}/${playerCommander.maxSoldiers}`
          : '我方主将未设定';
        return `敌将 ${enemyCommander.general.name} 仍在阵上 · ${playerStatus}`;
      }
      if (obj.id === 'annihilation') {
        const n = activeUnits('enemy').length;
        return n ? `仍有 ${n} 支敌军可战` : '敌军已无战意';
      }
      return '';
    }

    function updateObjectiveBar() {
      const bar = document.getElementById('objective-bar');
      const prog = document.getElementById('objective-progress');
      if (!battleObjective) {
        bar.textContent = '战斗目标：未设定';
        prog.textContent = '';
        return;
      }
      bar.textContent = isSupplyTransportBattle()
        ? `【护送粮车】${battleObjective.friendlyDesc}`
        : `【${battleObjective.friendlyTitle}】${battleObjective.friendlyDesc}`;
      prog.textContent = phase === 'battle' ? getObjectiveProgressText() : '';
      if (isSupplyTransportBattle() && phase === 'battle') {
        const cart = getCart('player');
        const sub = cart
          ? `当前目标：护送粮车返回营地 · 粮车 ${cart.soldiers}/${cart.maxSoldiers} · 距营地 ${distToCamp(cart)} 格`
          : '当前目标：护送粮车返回营地';
        prog.textContent = getObjectiveProgressText() ? `${sub} · ${getObjectiveProgressText()}` : sub;
      }
    }

    function showObjectiveIntro() {
      if (!battleObjective) return;
      document.getElementById('objective-intro-title').textContent = `【${battleObjective.friendlyTitle}】`;
      document.getElementById('objective-intro-desc').textContent = getObjectiveDescription(battleObjective);
      document.getElementById('objective-intro').classList.remove('hidden');
    }

    function hideObjectiveIntro() {
      document.getElementById('objective-intro').classList.add('hidden');
    }

    function checkTerrainTutorial(unit, terrain) {
      if (unit.side !== 'player') return;
      if (terrain === 'forest') BattleTutorialManager.maybeShow('terrain_forest');
      else if (terrain === 'hill') BattleTutorialManager.maybeShow('terrain_hill');
      else if (terrain === 'river') BattleTutorialManager.maybeShow('terrain_river');
    }

    function checkApproachTutorials(unit) {
      if (unit.side !== 'player') return;
      for (const p of strategicPoints) {
        if (manhattan(unit.x, unit.y, p.x, p.y) <= 2) {
          BattleTutorialManager.maybeShow('point_' + p.type);
        }
      }
    }

    // ─── 单位 ───────────────────────────────────────────────
    const GENERAL_NAMES = ['赵云', '张飞', '关羽', '黄忠', '马超', '张辽', '徐晃', '于禁', '乐进', '李典'];
    const ENEMY_GENERAL_NAMES = ['夏侯惇', '夏侯渊', '许褚', '典韦', '张郃', '曹仁', '曹洪', '荀彧', '郭嘉', '贾诩'];

    function createGeneral(pool) {
      return {
        name: pool[randInt(0, pool.length - 1)],
        leadership: randInt(60, 95),
        strength: randInt(55, 90),
        intelligence: randInt(50, 88),
      };
    }

    function distributeSoldiers(total, count) {
      const base = Math.floor(total / count);
      let remaining = total;
      return Array.from({ length: count }, (_, idx) => {
        const value = idx === count - 1 ? remaining : base;
        remaining -= value;
        return Math.max(1, value);
      });
    }

    function createFormationMembers(templateKey, totalSoldiers) {
      const template = FORMATION_TEMPLATES[templateKey] || FORMATION_TEMPLATES.vanguard;
      const shares = distributeSoldiers(totalSoldiers, template.slots.length);
      return template.slots.map(([slotKey, troopType], idx) => {
        const base = TROOP_TYPES[troopType];
        const maxSoldiers = shares[idx];
        return {
          id: uid(),
          slotKey,
          troopType,
          name: base.label,
          soldiers: maxSoldiers,
          maxSoldiers,
          attack: base.attack,
          defense: base.defense,
          speed: base.speed,
          range: base.range,
          status: 'normal',
        };
      });
    }

    function syncFormationTotals(unit) {
      if (!unit.formationMembers?.length) return;
      const aliveMembers = unit.formationMembers.filter(member => member.soldiers > 0);
      unit.soldiers = unit.formationMembers.reduce((total, member) => total + member.soldiers, 0);
      unit.maxSoldiers = unit.formationMembers.reduce((total, member) => total + member.maxSoldiers, 0);
      unit.range = aliveMembers.length ? Math.max(...aliveMembers.map(member => member.range)) : 0;
      unit.attack = aliveMembers.length
        ? Math.round(aliveMembers.reduce((total, member) => total + member.attack, 0) / aliveMembers.length)
        : 0;
      unit.defense = aliveMembers.length
        ? Math.round(aliveMembers.reduce((total, member) => total + member.defense, 0) / aliveMembers.length)
        : 1;
      unit.speed = aliveMembers.length
        ? Math.round(aliveMembers.reduce((total, member) => total + member.speed, 0) / aliveMembers.length)
        : 0;
    }

    function getFormationTemplateLabel(unit) {
      return FORMATION_GENERIC_LABEL;
    }

    function getFormationCompositionText(unit) {
      if (!unit.formationMembers?.length) return FORMATION_GENERIC_LABEL;
      const counts = new Map();
      for (const member of unit.formationMembers) {
        counts.set(member.troopType, (counts.get(member.troopType) || 0) + 1);
      }
      return [...counts.entries()]
        .map(([troopType, count]) => `${TROOP_TYPES[troopType].label}${count > 1 ? count : ''}`)
        .join(' / ');
    }

    function getFormationCaptainMember(unit) {
      if (!unit || !Array.isArray(unit.formationMembers)) {
        return null;
      }

      if (unit.captainMemberId) {
        const explicitCaptain = unit.formationMembers.find(member => member.id === unit.captainMemberId) || null;
        if (explicitCaptain) {
          return explicitCaptain;
        }
      }

      const middleCaptain = unit.formationMembers.find(member => (member.slotKey || member.slot) === 'middle-center') || null;
      if (middleCaptain) {
        return middleCaptain;
      }

      const troopTypeCaptain = unit.formationMembers.find(member => member.troopType === unit.troopType) || null;
      return troopTypeCaptain || unit.formationMembers[0] || null;
    }

    function renderFormationChips(unit) {
      if (!unit.formationMembers?.length) return '';
      const occupiedSlots = new Map(unit.formationMembers.map(member => [member.slotKey, member]));
      return `<span class="formation-chips">${FORMATION_SLOT_KEYS.map(slotKey => {
        const member = occupiedSlots.get(slotKey);
        const opacity = member && member.soldiers > 0 ? 1 : 0.18;
        return `<i style="opacity:${opacity}"></i>`;
      }).join('')}</span>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function getInspectUnit() {
      if (inspectedUnit && units.includes(inspectedUnit)) return inspectedUnit;
      if (selectedUnit) return selectedUnit;
      return units.find(unit => unit.side === 'player' && unit.x >= 0 && !unit.isSupplyCart)
        || units.find(unit => unit.side === 'player' && !unit.isSupplyCart)
        || units.find(unit => !unit.isSupplyCart)
        || null;
    }

    function inspectUnit(unit) {
      if (!unit) return;
      inspectedUnit = unit;
    }

    function renderInspectedUnitPanel() {
      const card = document.getElementById('unit-card-body');
      const grid = document.getElementById('unit-formation-grid');
      if (!card || !grid) return;
      const unit = getInspectUnit();
      if (!unit) {
        card.innerHTML = '<div class="unit-summary">点击单位查看编队</div>';
        grid.innerHTML = '';
        return;
      }

      const tier = getMoraleTier(unit.morale || 0);
      const pos = unit.x >= 0 ? `(${unit.x}, ${unit.y})` : '未部署';
      const sideLabel = unit.side === 'player' ? '我方' : unit.side === 'enemy' ? '敌方' : '中立';
      const total = unit.maxSoldiers ? `${unit.soldiers}/${unit.maxSoldiers}` : unit.soldiers;
      const soldierPercent = unit.maxSoldiers
        ? Math.max(0, Math.min(100, Math.round(unit.soldiers / unit.maxSoldiers * 100)))
        : 0;
      const moralePercent = Math.max(0, Math.min(100, Math.round(unit.morale || 0)));
      const actionState = unit.hasActed || unit.hasMoved ? '已行动' : '待命';
      const moveText = typeof moveRange === 'function' ? moveRange(unit) : 0;
      const rangeText = unit.range ?? getEffectiveRange(unit);
      const captain = getFormationCaptainMember(unit);
      card.innerHTML = `
        <div class="unit-portrait">${escapeHtml(unit.general?.name || unit.name)}</div>
        <div class="unit-summary">
          <div class="unit-summary-header">
            <div class="name">${escapeHtml(unit.name)}</div>
            <div class="unit-state-pill">${actionState}</div>
          </div>
          <div class="muted">主将：${escapeHtml(unit.general?.name || unit.name)}${unit.isCommander ? ' · 主帅' : ''}</div>
          <div class="unit-meter">
            <span>总兵力</span>
            <div class="unit-meter-track"><i class="unit-meter-fill" style="width:${soldierPercent}%"></i></div>
            <strong>${total}</strong>
          </div>
          <div class="unit-meter unit-meter--morale">
            <span>士气</span>
            <div class="unit-meter-track"><i class="unit-meter-fill" style="width:${moralePercent}%"></i></div>
            <strong>${unit.morale ?? 0}/100</strong>
          </div>
          <div class="unit-stat-row"><span>队长</span><strong>${escapeHtml(captain?.name || '暂无')}</strong></div>
          <div class="unit-stat-row"><span>阵型</span><strong>${escapeHtml(getFormationTemplateLabel(unit))}</strong></div>
          <div class="unit-stat-row"><span>机动/射程</span><strong>${moveText} / ${rangeText}</strong></div>
          <div class="unit-stat-row"><span>兵种构成</span><strong>${escapeHtml(getFormationCompositionText(unit))}</strong></div>
          <div class="unit-stat-row"><span>状态</span><strong>${escapeHtml(tier.label)} · ${sideLabel} · ${pos}</strong></div>
        </div>
      `;

      const occupiedSlots = new Map((unit.formationMembers || []).map(member => [member.slotKey, member]));
      const displaySlotKeys = getFormationPanelDisplaySlotKeys(unit.side);
      grid.innerHTML = displaySlotKeys.map(slotKey => {
        const member = occupiedSlots.get(slotKey);
        if (!member) {
          return `<div class="unit-formation-cell empty"><div>${escapeHtml(FORMATION_SLOT_LABELS[slotKey])}</div><div>空位</div></div>`;
        }
        const pct = member.maxSoldiers ? Math.max(0, Math.round(member.soldiers / member.maxSoldiers * 100)) : 0;
        const classes = ['unit-formation-cell'];
        if (member.soldiers <= 0) classes.push('fallen');
        return `
          <div class="${classes.join(' ')}">
            ${captain && member.id === captain.id ? '<span class="formation-slot__captain-badge">L</span>' : ''}
            <div class="slot">${escapeHtml(FORMATION_SLOT_LABELS[slotKey])}</div>
            <div class="troop">${escapeHtml(TROOP_TYPES[member.troopType]?.label || member.troopType)}</div>
            <div class="hp">${member.soldiers}/${member.maxSoldiers}</div>
            <div class="muted">射程 ${member.range}</div>
            <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join('');
    }

    function renderBattleStatusPanel() {
      const list = document.getElementById('battle-status-list');
      if (!list) return;
      const playerAlive = units.filter(unit => unit.side === 'player' && unit.soldiers > 0 && !unit.isSupplyCart).length;
      const enemyAlive = units.filter(unit => unit.side === 'enemy' && unit.soldiers > 0 && !unit.isSupplyCart).length;
      const selectedText = selectedUnit ? `${selectedUnit.name} · ${mode || '已选中'}` : '未选择单位';
      list.innerHTML = `
        <div class="status-item"><div class="label">胜利条件</div><div>${escapeHtml(battleObjective?.friendlyTitle || '未设定')}</div></div>
        <div class="status-item"><div class="label">当前回合</div><div>${turn === 'player' ? '我方行动' : '敌方行动'}</div></div>
        <div class="status-item"><div class="label">当前选择</div><div>${escapeHtml(selectedText)}</div></div>
        <div class="status-item"><div class="label">战场兵力</div><div>我方 ${playerAlive} 支 · 敌方 ${enemyAlive} 支</div></div>
      `;
    }

    function getSideBattleTotals(side) {
      const sideUnits = units.filter(unit => unit.side === side && !unit.isSupplyCart);
      const soldiers = sideUnits.reduce((total, unit) => total + Math.max(0, unit.soldiers || 0), 0);
      const maxSoldiers = sideUnits.reduce((total, unit) => total + Math.max(0, unit.maxSoldiers || 0), 0);
      const activeUnits = sideUnits.filter(unit => unit.soldiers > 0);
      const morale = activeUnits.length
        ? Math.round(activeUnits.reduce((total, unit) => total + (unit.morale || 0), 0) / activeUnits.length)
        : 0;
      return { soldiers, maxSoldiers, morale };
    }

    function renderTopBattleStats() {
      const configs = [
        { side: 'player', prefix: 'ally' },
        { side: 'enemy', prefix: 'enemy' },
      ];
      for (const { side, prefix } of configs) {
        const totals = getSideBattleTotals(side);
        const soldierPct = totals.maxSoldiers
          ? Math.max(0, Math.min(100, Math.round(totals.soldiers / totals.maxSoldiers * 100)))
          : 0;
        const moralePct = Math.max(0, Math.min(100, totals.morale));
        const soldiersLabel = document.getElementById(`${prefix}-soldiers-label`);
        const moraleLabel = document.getElementById(`${prefix}-morale-label`);
        const soldiersFill = document.getElementById(`${prefix}-soldiers-fill`);
        const moraleFill = document.getElementById(`${prefix}-morale-fill`);
        if (soldiersLabel) soldiersLabel.textContent = `总兵力 ${totals.soldiers}`;
        if (moraleLabel) moraleLabel.textContent = `总士气 ${totals.morale}`;
        if (soldiersFill) soldiersFill.style.width = `${soldierPct}%`;
        if (moraleFill) moraleFill.style.width = `${moralePct}%`;
      }
    }

    function getDefaultUnitFacing(side) {
      return side === 'enemy' ? 'right' : 'up';
    }

    function getFacingFromDelta(dx, dy, fallback = 'down') {
      if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
      if (dy !== 0) return dy > 0 ? 'down' : 'up';
      if (dx !== 0) return dx > 0 ? 'right' : 'left';
      return fallback;
    }

    function faceUnitToward(unit, tx, ty) {
      if (!unit) return;
      unit.facing = getFacingFromDelta(tx - unit.x, ty - unit.y, unit.facing || getDefaultUnitFacing(unit.side));
    }

    function getBoardUnitSprite(unit) {
      const sideSprites = BOARD_UNIT_SPRITES[unit.side === 'enemy' ? 'enemy' : 'player'];
      const facing = unit.facing || getDefaultUnitFacing(unit.side);
      if (unit.isCommander) {
        const horseFacing = facing === 'down'
          ? 'down'
          : facing === 'up'
            ? 'up'
            : unit.side === 'enemy'
              ? 'down'
              : 'up';
        return sideSprites.horse[horseFacing];
      }
      return sideSprites.man[facing] || sideSprites.man[getDefaultUnitFacing(unit.side)];
    }

    function createUnit(name, troopType, soldiers, side, general, extra = {}) {
      const base = TROOP_TYPES[troopType];
      const templateKey = extra.formationTemplate;
      const formationMembers = extra.isSupplyCart ? null : createFormationMembers(templateKey || 'vanguard', soldiers);
      const primaryType = templateKey ? FORMATION_TEMPLATES[templateKey].primary : troopType;
      const unit = {
        id: uid(), name, troopType: primaryType, soldiers, maxSoldiers: soldiers,
        attack: base.attack, defense: base.defense, speed: base.speed,
        range: base.range,
        morale: 75 + randInt(0, 20),
        general: general || createGeneral(side === 'player' ? GENERAL_NAMES : ENEMY_GENERAL_NAMES),
        side, x: -1, y: -1,
        hasMoved: false, hasActed: false,
        inRiver: false,
        facing: getDefaultUnitFacing(side),
        skillUses: { ...SKILL_USES },
        isCommander: false,
        formationTemplate: templateKey || null,
        formationMembers,
        ...extra,
      };
      syncFormationTotals(unit);
      return unit;
    }

    function createScenarioUnit(definition, side) {
      const unit = createUnit(
        definition.name,
        definition.troopType,
        definition.soldiers,
        side,
        definition.general,
        {
          formationTemplate: definition.template,
          controller: definition.controller || (side === 'player' ? 'player' : 'npc'),
        }
      );
      unit.x = definition.x;
      unit.y = definition.y;
      if (typeof definition.morale === 'number') unit.morale = definition.morale;
      if (definition.isCommander) unit.isCommander = true;
      return unit;
    }

    function createPlayerPool() {
      if (battleConfig.scenario?.playerUnits?.length) {
        return battleConfig.scenario.playerUnits.map(definition => createScenarioUnit(definition, 'player'));
      }

      return [
        createUnit('前军一队', 'infantry', 420, 'player', null, { formationTemplate: 'vanguard' }),
        createUnit('前军二队', 'cavalry', 360, 'player', null, { formationTemplate: 'assault' }),
        createUnit('前军三队', 'archer', 340, 'player', null, { formationTemplate: 'missile' }),
        createUnit('中军一队', 'spear', 440, 'player', null, { formationTemplate: 'guard' }),
        createUnit('中军二队', 'cavalry', 320, 'player', null, { formationTemplate: 'mobile' }),
      ];
    }

    function spawnEnemies() {
      if (battleConfig.scenario?.enemyUnits?.length) {
        for (const definition of battleConfig.scenario.enemyUnits) {
          units.push(createScenarioUnit(definition, 'enemy'));
        }
        return;
      }

      const templates = ['vanguard', 'assault', 'missile', 'guard', 'mobile'];
      const names = ['曹军先锋', '曹军突击', '曹军射击', '曹军守备', '曹军机动', '曹军偏师'];
      const occupied = new Set();
      const count = randInt(4, 6);
      let commander = null;

      for (let i = 0; i < count; i++) {
        let x, y, tries = 0;
        do {
          x = randInt(0, COLS - 1);
          y = ENEMY_DEPLOY_ROWS[randInt(0, ENEMY_DEPLOY_ROWS.length - 1)];
          tries++;
        } while (occupied.has(cellKey(x, y)) && tries < 50);
        if (occupied.has(cellKey(x, y))) continue;
        occupied.add(cellKey(x, y));

        const template = templates[randInt(0, templates.length - 1)];
        const u = createUnit(
          names[i] || '曹军部队',
          FORMATION_TEMPLATES[template].primary,
          randInt(280, 430),
          'enemy',
          null,
          { formationTemplate: template }
        );
        u.x = x; u.y = y;
        if (!commander) { u.isCommander = true; commander = u; }
        units.push(u);
      }
    }

    function configureBattleCommanders() {
      if (battleConfig.scenario) {
        const enemyCommander = units.find(unit => unit.side === 'enemy' && unit.isCommander);
        if (!enemyCommander) {
          const firstEnemy = units.find(unit => unit.side === 'enemy');
          if (firstEnemy) firstEnemy.isCommander = true;
        }
        return;
      }

      for (const unit of units) {
        if (unit.side === 'player') unit.isCommander = false;
      }
      const enemyCommander = units.find(unit => unit.side === 'enemy' && unit.isCommander);
      if (!enemyCommander) {
        const firstEnemy = units.find(unit => unit.side === 'enemy');
        if (firstEnemy) firstEnemy.isCommander = true;
      }
      if (!isAssassinationBattle()) return;
      const playerCommander = units.find(unit => unit.side === 'player');
      if (playerCommander) playerCommander.isCommander = true;
    }

    // ─── 移动 ───────────────────────────────────────────────
    function computeReachable(unit) {
      const maxDist = moveRange(unit);
      const result = [], visited = new Map();
      const queue = [{ x: unit.x, y: unit.y, dist: 0 }];
      visited.set(cellKey(unit.x, unit.y), 0);

      while (queue.length) {
        const { x, y, dist } = queue.shift();
        if (dist > 0) result.push({ x, y });
        if (dist >= maxDist) continue;

        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          const nk = cellKey(nx, ny);
          const blocked = unitAt(nx, ny);
          if (blocked && blocked.id !== unit.id) continue;
          const nd = dist + 1;
          if (!visited.has(nk) || visited.get(nk) > nd) {
            visited.set(nk, nd);
            queue.push({ x: nx, y: ny, dist: nd });
          }
        }
      }
      return result.filter(c => !unitAt(c.x, c.y));
    }

    function computeAttackable(unit) {
      if (unit.isSupplyCart) return [];
      return units.filter(u =>
        u.side !== unit.side && u.soldiers > 0 && canLockTarget(unit, u)
      );
    }

    function computeAttackRangeCells(unit) {
      if (!unit || unit.isSupplyCart) return [];
      const cells = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (isInFixedAttackPattern(unit, x, y)) cells.push({ x, y });
        }
      }
      return cells;
    }

    function aiTargetPriority(attacker, target) {
      if (isAssassinationBattle() && target.isCommander) {
        return target.side === 'player' ? 140 : 135;
      }
      if (!isSupplyTransportBattle()) {
        return (target.isCommander ? 50 : 0) + getTypeAdv(attacker, target) * 10;
      }
      if (target.isSupplyCart && target.side !== attacker.side) return 120;
      const enemyCart = getCart(attacker.side === 'player' ? 'enemy' : 'player');
      if (enemyCart && manhattan(target.x, target.y, enemyCart.x, enemyCart.y) <= 1) return 70;
      if (target.isCommander) return 55;
      return 10 + getTypeAdv(attacker, target) * 5;
    }

    function applyMove(unit, nx, ny) {
      const terrain = getTerrain(nx, ny);
      faceUnitToward(unit, nx, ny);
      unit.x = nx; unit.y = ny;
      unit.hasMoved = true;

      checkTerrainTutorial(unit, terrain);
      checkApproachTutorials(unit);

      if (isRiverTerrain(terrain)) {
        unit.inRiver = true;
        unit.hasActed = true;
        log(`${unit.name} 进入河流 · 渡河受阻，本回合行动结束`, 'system');
      } else {
        unit.inRiver = false;
      }
      tryPickupDroppedSupply(unit);
    }

    function findMovePath(unit, tx, ty) {
      if (unit.x === tx && unit.y === ty) return [];
      const startKey = cellKey(unit.x, unit.y);
      const targetKey = cellKey(tx, ty);
      const queue = [{ x: unit.x, y: unit.y }];
      const cameFrom = new Map([[startKey, null]]);

      while (queue.length) {
        const current = queue.shift();
        if (cellKey(current.x, current.y) === targetKey) break;
        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = current.x + dx, ny = current.y + dy;
          if (!inBounds(nx, ny)) continue;
          const nk = cellKey(nx, ny);
          if (cameFrom.has(nk)) continue;
          const blocked = unitAt(nx, ny);
          if (blocked && blocked.id !== unit.id) continue;
          cameFrom.set(nk, current);
          queue.push({ x: nx, y: ny });
        }
      }

      if (!cameFrom.has(targetKey)) return [];
      const path = [];
      let cursor = { x: tx, y: ty };
      while (cellKey(cursor.x, cursor.y) !== startKey) {
        path.push(cursor);
        cursor = cameFrom.get(cellKey(cursor.x, cursor.y));
      }
      return path.reverse();
    }

    async function animateUnitMove(unit, tx, ty, stepDelay = 160) {
      const path = findMovePath(unit, tx, ty);
      if (!path.length) {
        applyMove(unit, tx, ty);
        renderBoard();
        updateDebug();
        return;
      }

      for (let i = 0; i < path.length; i++) {
        const step = path[i];
        if (i === path.length - 1) {
          applyMove(unit, step.x, step.y);
        } else {
          faceUnitToward(unit, step.x, step.y);
          unit.x = step.x;
          unit.y = step.y;
          unit.inRiver = isRiverTerrain(getTerrain(step.x, step.y));
        }
        renderBoard();
        updateDebug();
        await sleep(stepDelay);
      }
    }

    // ─── 战斗 ───────────────────────────────────────────────
    function calcDamage(attacker, defender) {
      const atkTier = getMoraleTier(attacker.morale);
      const defTier = getMoraleTier(defender.morale);
      const typeAdv = getTypeAdv(attacker, defender);

      let hitRate = 0.72 * atkTier.hit;
      if (isChaos(attacker) && Math.random() < 0.35) {
        return { hit: false, damage: 0, counter: 0, typeAdv, chaosFail: true };
      }
      if (Math.random() > hitRate) return { hit: false, damage: 0, counter: 0, typeAdv };

      const effAtk = attacker.attack * (1 + attacker.general.strength / 200) * atkTier.atk;
      const effDef = defender.defense * defTier.def;

      let damage = Math.round(
        (effAtk / Math.max(effDef, 1)) * 14 * typeAdv *
        (attacker.soldiers / attacker.maxSoldiers) * (0.85 + Math.random() * 0.3)
      );

      const hillFirst = isOnHill(attacker.x, attacker.y) && !isOnHill(defender.x, defender.y);
      if (hillFirst) damage = Math.round(damage * 1.25);

      if (defender.inRiver) damage = Math.round(damage * RIVER_DAMAGE_MULT);
      damage = clamp(damage, 1, Math.round(attacker.soldiers * 0.15));

      let counter = 0;
      const dist = manhattan(attacker.x, attacker.y, defender.x, defender.y);
      if (!defender.isSupplyCart && !hillFirst && defender.soldiers > 0 && defender.range >= dist) {
        const counterRate = 0.55 * defTier.counter;
        if (Math.random() < counterRate) {
          const cAtk = defender.attack * (1 + defender.general.strength / 200) * defTier.atk;
          const cDef = attacker.defense * 0.5 * atkTier.def;
          counter = Math.round((cAtk / Math.max(cDef, 1)) * 7 * (defender.soldiers / defender.maxSoldiers));
          if (attacker.inRiver) counter = Math.round(counter * RIVER_DAMAGE_MULT);
          counter = clamp(counter, 0, Math.round(defender.soldiers * 0.1));
        }
      }

      return { hit: true, damage, counter, typeAdv, hillFirst };
    }

    function applyDamage(unit, amount) {
      const wasAlive = unit.soldiers > 0;
      if (unit.formationMembers?.length) {
        let remaining = amount;
        for (const slotPrefix of ['front', 'middle', 'rear']) {
          for (const member of unit.formationMembers.filter(item => item.soldiers > 0 && item.slotKey.startsWith(slotPrefix))) {
            if (remaining <= 0) break;
            const part = Math.min(member.soldiers, Math.max(1, Math.ceil(remaining / 2)));
            member.soldiers -= part;
            remaining -= part;
          }
          if (remaining <= 0) break;
        }
        syncFormationTotals(unit);
      } else {
      unit.soldiers = Math.max(0, unit.soldiers - amount);
      }
      if (unit.isSupplyCart) {
        if (wasAlive && unit.soldiers <= 0) destroyCart(unit);
        return;
      }
      changeMorale(unit, -Math.round(amount / unit.maxSoldiers * 35), '战损', false);
      if (wasAlive && unit.soldiers <= 0) onGeneralFallen(unit);
    }

    function resolveDirectAttack(attacker, defender) {
      if (attacker.isSupplyCart) return Promise.resolve();
      if (isRout(attacker)) return Promise.resolve();
      if (isChaos(attacker) && Math.random() < 0.25) {
        log(`${attacker.name} 混乱中行动失败`, 'system');
        return Promise.resolve();
      }

      const result = calcDamage(attacker, defender);
      const advLabel = result.typeAdv > 1 ? '（克制）' : '';

      if (result.chaosFail) {
        log(`${attacker.name} 混乱中攻击失误`, 'system');
        attacker.hasActed = true;
        return Promise.resolve();
      }
      if (!result.hit) {
        log(`${attacker.name} 攻击 ${defender.name}，未命中`, 'system');
        attacker.hasActed = true;
        return Promise.resolve();
      }

      if (result.hillFirst) log(`${attacker.name} 占高地先手！`, 'skill');
      applyDamage(defender, result.damage);
      if (result.counter > 0) applyDamage(attacker, result.counter);

      const targetName = defender.isSupplyCart ? '粮车' : defender.name;
      log(`${attacker.name}发动攻击${advLabel}`, 'skill');
      log(`  ${targetName} 损失 ${result.damage}${result.counter ? `，${attacker.name} 损失 ${result.counter}` : ''}`, 'damage');
      changeMorale(attacker, -randInt(1, 2), '激战消耗', false);
      return Promise.resolve();
    }

    function resolveAttack(attacker, defender) {
      faceUnitToward(attacker, defender.x, defender.y);
      renderBoard();
      updateDebug();
      if (defender.isSupplyCart || !attacker.formationMembers?.length || !defender.formationMembers?.length) {
        return resolveDirectAttack(attacker, defender);
      }

      if (attacker.isSupplyCart || isRout(attacker)) return Promise.resolve();
      if (isChaos(attacker) && Math.random() < 0.25) {
        log(`${attacker.name} 混乱中行动失败`, 'system');
        return Promise.resolve();
      }

      const distance = manhattan(attacker.x, attacker.y, defender.x, defender.y);
      const attackerBefore = cloneFormationSnapshot(attacker);
      const defenderBefore = cloneFormationSnapshot(defender);
      const useQuickNpcBattle = shouldUseQuickNpcBattle(attacker, defender);
      const timeline = [];
      let totalDamageToDefender = 0;
      let totalDamageToAttacker = 0;

      function pushBattleStep(step) {
        timeline.push({
          ...step,
          attackerSnapshot: cloneFormationSnapshot(attacker),
          defenderSnapshot: cloneFormationSnapshot(defender),
        });
      }

            function runSideRound(sourceUnit, targetUnit, label, isCounter, sourceSide, targetSide) {
        const scheduledStrikes = buildScheduledFormationSideStrikes(sourceUnit, targetUnit, {
          distance,
          sourceSide,
          targetSide,
          label,
        });
        let strikeCount = 0;
        if (!scheduledStrikes.length) {
          pushBattleStep({ type: 'entry', text: `${label}无成员能够出手` });
          return;
        }
        for (const scheduledStrike of scheduledStrikes) {
          if (sourceUnit.soldiers <= 0 || targetUnit.soldiers <= 0) return;
          const member = scheduledStrike.member;
          if (!member) continue;
          if (member.soldiers <= 0 || member.status === 'stunned') continue;
          if (distance > 1 && member.range < distance) continue;
          const targetMember = chooseFormationTarget(sourceUnit, member, targetUnit);
          if (!targetMember) continue;
          strikeCount += 1;
          const hitRate = 0.76 * getMoraleTier(sourceUnit.morale).hit;
          if (Math.random() > hitRate) {
            pushBattleStep({
              type: 'strike',
              className: 'miss',
              text: `${label}${TROOP_TYPES[member.troopType].label}攻击落空`,
              sourceSide,
              targetSide,
              sourceSlotKey: member.slotKey,
              targetSlotKey: targetMember.slotKey,
              sourceTroopType: member.troopType,
              targetTroopType: targetMember.troopType,
              hit: false,
              damage: 0,
              delayMs: scheduledStrike.nextDelayMs || 0,
              launchAtMs: scheduledStrike.launchAtMs,
              nextDelayMs: scheduledStrike.nextDelayMs,
            });
            continue;
          }
          const result = calculateMemberDamage(sourceUnit, member, targetUnit, targetMember, distance, isCounter);
          const actualDamage = Math.min(result.damage, targetMember.soldiers);
          applyMemberDamage(targetUnit, targetMember, actualDamage);
          if (targetUnit.id === defender.id) totalDamageToDefender += actualDamage;
          else totalDamageToAttacker += actualDamage;
          pushBattleStep({
            type: 'strike',
            className: 'damage',
            text: `${label}${TROOP_TYPES[member.troopType].label}击中${targetUnit.name}${TROOP_TYPES[targetMember.troopType].label}，损失 ${actualDamage}${result.typeAdv > 1 ? '（克制）' : ''}`,
            sourceSide,
            targetSide,
            sourceSlotKey: member.slotKey,
            targetSlotKey: targetMember.slotKey,
            sourceTroopType: member.troopType,
            targetTroopType: targetMember.troopType,
            typeAdv: result.typeAdv,
            hit: true,
            damage: actualDamage,
            delayMs: scheduledStrike.nextDelayMs || 0,
            launchAtMs: scheduledStrike.launchAtMs,
            nextDelayMs: scheduledStrike.nextDelayMs,
          });
        }

        if (!strikeCount) {
          pushBattleStep({ type: 'entry', text: `${label}未形成有效攻击` });
        }
      }

      for (let round = 1; round <= 2; round++) {
        pushBattleStep({ type: 'round', text: `第 ${round} 轮` });
        runSideRound(attacker, defender, '攻方', false, 'attacker', 'defender');
        if (defender.soldiers > 0) runSideRound(defender, attacker, '守方还击', true, 'defender', 'attacker');
      }

      changeMorale(attacker, -randInt(1, 2), '激战消耗', false);

      log(`${attacker.name} 与 ${defender.name} 展开编队交战`, 'skill');
      log(`  ${defender.name} 损失 ${totalDamageToDefender}，${attacker.name} 损失 ${totalDamageToAttacker}`, 'damage');
      if (defender.soldiers <= 0) onGeneralFallen(defender);
      if (attacker.soldiers <= 0) onGeneralFallen(attacker);
      const battleReport = {
        attackerBefore,
        defenderBefore,
        attackerAfter: cloneFormationSnapshot(attacker),
        defenderAfter: cloneFormationSnapshot(defender),
        timeline,
        distance,
      };
      return useQuickNpcBattle
        ? showQuickBattleOverlay(buildQuickBattleReport(battleReport))
        : showFormationBattleOverlay(battleReport);
    }

    // ─── 技能 ───────────────────────────────────────────────
    function useInspire(caster, target) {
      if (caster.skillUses.inspire <= 0) return;
      const bonus = Math.round(20 * (1 + caster.general.intelligence / 200));
      changeMorale(target, bonus, '鼓舞');
      caster.skillUses.inspire--;
      caster.hasActed = true;
    }

    // ─── 据点 ───────────────────────────────────────────────
    function capturePoint(point, side) {
      point.owner = side;
      point.captureProgress = 0;
      point.captureSide = null;
      const info = STRATEGIC[point.type];
      log(`【${info.name}】被${side === 'player' ? '我军' : '敌军'}占领！`, 'skill');

      if (side === 'player') addRecap(`你占领了${info.name}`);

      if (point.type === 'supplyDepot') {
        raiseSupplyMorale(side, SUPPLY_CAPTURE_MORALE_BONUS, '夺得粮仓');
        if (isSupplyTransportBattle()) {
          spawnSupplyCart(side, point.x, point.y, true);
        }
      }
    }

    function processCaptureProgress() {
      const captureRequired = isStrongpointBattle() ? STRONGPOINT_CAPTURE_REQUIRED : 1;
      for (const point of strategicPoints) {
        const u = unitAt(point.x, point.y);
        if (!u) {
          if (point.captureSide) {
            point.captureSide = null;
            point.captureProgress = 0;
          }
          continue;
        }
        if (u.side === point.owner) {
          point.captureSide = null;
          point.captureProgress = 0;
          continue;
        }
        if (point.captureSide === u.side) {
          point.captureProgress += 1;
          if (point.captureProgress >= captureRequired) capturePoint(point, u.side);
        } else {
          point.captureSide = u.side;
          point.captureProgress = 0;
        }
      }
    }

    function applyStrategicTurnEffects(side) {
      for (const p of strategicPoints) {
        if (p.owner !== side) continue;
        if (p.type === 'camp') {
          changeMoraleSide(side, 2, '营寨补给', false);
          logMorale(`${side === 'player' ? '我军' : '敌军'}据守营寨，士气恢复`);
          for (const u of units) {
            if (u.side !== side || u.soldiers <= 0) continue;
            if (manhattan(u.x, u.y, p.x, p.y) <= 1) changeMorale(u, 3, '营寨附近', false);
          }
        }
      }
    }

    function recoverMorale(side) {
      for (const u of units) {
        if (u.side !== side || u.soldiers <= 0 || isRout(u)) continue;
        changeMorale(u, Math.round(u.general.leadership / 22), '统率恢复', false);
      }
    }

    // ─── 溃逃 ───────────────────────────────────────────────
    function processRout() {
      for (const u of units) {
        if (!isRout(u) || u.soldiers <= 0) continue;
        const edges = [];
        for (let x = 0; x < COLS; x++) { edges.push({ x, y: 0 }, { x, y: ROWS - 1 }); }
        for (let y = 0; y < ROWS; y++) { edges.push({ x: 0, y }, { x: COLS - 1, y }); }

        let best = edges[0], bestDist = Infinity;
        for (const e of edges) {
          const d = manhattan(u.x, u.y, e.x, e.y);
          if (d < bestDist) { bestDist = d; best = e; }
        }

        let moved = false;
        for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nx = u.x + dx, ny = u.y + dy;
          if (!inBounds(nx, ny) || unitAt(nx, ny)) continue;
          if (manhattan(nx, ny, best.x, best.y) < bestDist) {
            u.x = nx; u.y = ny;
            u.inRiver = isRiverTerrain(getTerrain(nx, ny));
            moved = true;
            break;
          }
        }
        if (!moved) {
          for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
            const nx = u.x + dx, ny = u.y + dy;
            if (inBounds(nx, ny) && !unitAt(nx, ny)) {
              u.x = nx; u.y = ny;
              u.inRiver = isRiverTerrain(getTerrain(nx, ny));
              break;
            }
          }
        }
      }
    }

    // ─── 胜负 ───────────────────────────────────────────────
    function livingUnits(side) {
      return units.filter(u => u.side === side && u.soldiers > 0 && !u.isSupplyCart);
    }

    function activeUnits(side) {
      return livingUnits(side).filter(u => !isRout(u));
    }

    function allPointsOwnedBy(side) {
      return strategicPoints.every(p => p.owner === side);
    }

    function playerHoldsDefenseZone() {
      const playerDefenders = activeUnits('player').filter(u => DEFENSE_ZONE_ROWS.includes(u.y));
      const enemyIntruders = activeUnits('enemy').filter(u => DEFENSE_ZONE_ROWS.includes(u.y));
      return playerDefenders.length >= DEFENSE_PLAYER_UNITS_REQUIRED && enemyIntruders.length === 0;
    }

    function checkObjectiveWin() {
      const obj = battleObjective;
      if (!obj) return null;

      if (obj.id === 'supplyTransport' || obj.id === 'annihilation') {
        if (livingUnits('enemy').length === 0) return { win: true, msg: '敌军全灭。' };
        if (activeUnits('enemy').length === 0) {
          addRecap('敌军士气崩溃');
          return { win: true, msg: '敌军全线溃逃！' };
        }
      }
      if (obj.id === 'strongpoint' && allPointsOwnedBy('player')) {
        return { win: true, msg: '全部据点已占领！' };
      }
      if (obj.id === 'assassination') {
        const cmd = getCommander('enemy', true);
        if (cmd && cmd.soldiers <= 0) return { win: true, msg: '敌军主将已阵斩！' };
      }
      if (obj.id === 'defense' && defenseHoldTurns >= DEFENSE_HOLD_REQUIRED) {
        return { win: true, msg: `成功守住${getDefenseZoneLabel()} ${DEFENSE_HOLD_REQUIRED} 回合！` };
      }
      return null;
    }

    function checkObjectiveLoss() {
      if (isAssassinationBattle()) {
        const playerCommander = getCommander('player', true);
        if (playerCommander != null && playerCommander.soldiers <= 0) {
          return { win: false, msg: '我军主将已被阵斩……' };
        }
      }
      if (livingUnits('player').length === 0) return { win: false, msg: '我军全灭……' };
      if (activeUnits('player').length === 0) return { win: false, msg: '我军全部溃逃……' };
      if (battleObjective?.id === 'defense' && turnCounter > 0 && !playerHoldsDefenseZone()) {
        return { win: false, msg: `${getDefenseZoneLabel()}失守……` };
      }
      return null;
    }

    function checkVictory() {
      const win = checkObjectiveWin();
      if (win) { showOverlay('胜利', win.msg, true); return true; }
      const loss = checkObjectiveLoss();
      if (loss) { showOverlay('失败', loss.msg, false); return true; }
      return false;
    }

    function notifyBattleDemoResult() {
      if (!battleConfig.embedded || !lastBattleResult) return;
      window.parent?.postMessage({
        type: 'rpg-tg:battle-demo-result',
        scenarioId: battleConfig.scenarioId,
        result: lastBattleResult.result,
      }, '*');
    }

    function postBattleDemoAudioMessage(message) {
      if (!battleConfig.embedded || !battleConfig.scenarioId) return;

    function scheduleBattleDemoLocalBgmLoop(audio, token, delayMs) {
      const fadeDurationMs = 200;
      const fadeSteps = 4;
      const loopDurationMs = 74000;
      const nextDelayMs = delayMs > fadeDurationMs ? delayMs - fadeDurationMs : 10;
      window.setTimeout(() => {
        if (battleDemoLocalBgmLoopToken !== token || battleDemoLocalBgmAudio !== audio) return;
        if (audio.paused) {
          window.setTimeout(() => {
            scheduleBattleDemoLocalBgmLoop(audio, token, 10);
          }, 50);
          return;
        }
        const remainingMs = Math.round((92 - audio.currentTime) * 1000);
        if (remainingMs > fadeDurationMs) {
          scheduleBattleDemoLocalBgmLoop(audio, token, remainingMs);
          return;
        }
        const startVolume = Math.max(0, audio.volume);
        for (let step = 1; step <= fadeSteps; step += 1) {
          const delayMsOut = Math.round((fadeDurationMs * step) / fadeSteps);
          window.setTimeout(() => {
            if (battleDemoLocalBgmLoopToken !== token || battleDemoLocalBgmAudio !== audio || audio.paused) return;
            audio.volume = Math.max(0, startVolume * (1 - step / fadeSteps));
          }, delayMsOut);
        }
        window.setTimeout(() => {
          if (battleDemoLocalBgmLoopToken !== token || battleDemoLocalBgmAudio !== audio) return;
          audio.currentTime = 18;
          audio.volume = 0;
          void audio.play().catch(() => {});
        }, fadeDurationMs);
        for (let step = 1; step <= fadeSteps; step += 1) {
          const delayMsIn = fadeDurationMs + Math.round((fadeDurationMs * step) / fadeSteps);
          window.setTimeout(() => {
            if (battleDemoLocalBgmLoopToken !== token || battleDemoLocalBgmAudio !== audio) return;
            audio.volume = Math.min(startVolume, startVolume * (step / fadeSteps));
          }, delayMsIn);
        }
        scheduleBattleDemoLocalBgmLoop(audio, token, loopDurationMs + fadeDurationMs);
      }, Math.max(10, nextDelayMs));
    }

    function fadeOutBattleDemoLocalBgm(onComplete) {
      battleDemoLocalBgmLoopToken += 1;
      const audio = battleDemoLocalBgmAudio;
      if (!audio || audio.paused) {
        onComplete();
        return;
      }
      const startVolume = audio.volume;
      const fadeDurationMs = 200;
      const fadeSteps = 4;
      for (let step = 1; step <= fadeSteps; step += 1) {
        const nextVolume = startVolume * (1 - step / fadeSteps);
        const delayMs = Math.round((fadeDurationMs * step) / fadeSteps);
        window.setTimeout(() => {
          if (battleDemoLocalBgmAudio !== audio || audio.paused) return;
          audio.volume = Math.max(0, nextVolume);
          if (step === fadeSteps) {
            audio.pause();
          }
        }, delayMs);
      }
      window.setTimeout(() => {
        if (battleDemoLocalBgmAudio === audio) {
          audio.currentTime = 0;
          audio.volume = 0.35;
        }
        onComplete();
      }, fadeDurationMs);
    }

    function playBattleDemoMusicCue(cueId) {
      if (battleConfig.embedded && battleConfig.scenarioId) {
        postBattleDemoAudioMessage({ cueId });
        return;
      }
      if (cueId === 'battleMusicStart') {
        const victoryAudio = ensureBattleDemoLocalVictoryAudio();
        victoryAudio.pause();
        victoryAudio.currentTime = 0;
        const audio = ensureBattleDemoLocalBgmAudio();
        battleDemoLocalBgmLoopToken += 1;
        const token = battleDemoLocalBgmLoopToken;
        if (audio.currentTime >= 92 || audio.currentTime < 0) {
          audio.currentTime = 0;
        }
        audio.volume = 0.35;
        void audio.play().catch(() => {});
        scheduleBattleDemoLocalBgmLoop(audio, token, Math.round((92 - audio.currentTime) * 1000));
        return;
      }
      if (cueId !== 'battleMusicVictory') return;
      fadeOutBattleDemoLocalBgm(() => {
        const audio = ensureBattleDemoLocalVictoryAudio();
        audio.currentTime = 0;
        audio.volume = 0.26;
        void audio.play().catch(() => {});
      });
    }

    function fadeBattleAudioPlayer(audio, frameDurationMs, fadeFrames = 4) {
      if (!audio || audio.paused) return;
      const steps = Math.max(1, Math.round(fadeFrames || 4));
      const durationMs = Math.max(0, Math.round(Math.max(0, frameDurationMs) * steps));
      const startVolume = Math.max(0, Number(audio.volume) || 0);
      if (durationMs === 0) {
        audio.pause();
        return;
      }
      for (let step = 1; step <= steps; step += 1) {
        const nextVolume = Math.max(0, startVolume * (1 - step / steps));
        const delayMs = Math.round((durationMs * step) / steps);
        window.setTimeout(() => {
          if (audio.paused) return;
          audio.volume = nextVolume;
          if (step === steps) {
            audio.pause();
          }
        }, delayMs);
      }
    }

    function getBattleSlotPosition(slotKey, mirrorCols = false) {
      const [rowName, colName] = slotKey.split('-');
      const colMap = { left: 0, center: 1, right: 2 };
      const rankIndex = rowName === 'front' ? 0 : rowName === 'middle' ? 1 : 2;
      const formationFile = colMap[colName] ?? 0;
      const visualFile = mirrorCols ? 2 - formationFile : formationFile;
      const frontX = mirrorCols ? BATTLE_PLAYER_FRONT_X : BATTLE_ENEMY_FRONT_X;
      const x =
        frontX +
        (mirrorCols ? -1 : 1) *
          (rankIndex * BATTLE_RANK_HORIZONTAL_STEP - visualFile * BATTLE_FILE_DIAGONAL_STEP.x);
      const y = BATTLE_FORMATION_BASELINE_Y - visualFile * BATTLE_FILE_DIAGONAL_STEP.y;
      return {
        row: rankIndex,
        col: visualFile,
        rowClass: `row-${rowName}`,
        x,
        y,
        z: 100 + Math.round(y * 10) + visualFile,
        scale: 0.92,
        anchor: 'bottom-center',
      };
    }

      cavalry: Object.freeze({
        enemy: Object.freeze({
          left: 240,
          right: 260,
          top: 24,
          bottom: 36,
        }),
        player: Object.freeze({
          left: 180,
          right: 220,
          top: 24,
          bottom: 36,
        }),
      }),
    });

    function getBattleSpineCanvasMetrics(canvas = null) {
      const troopType = String(canvas?.dataset?.troopType || '').trim();
      const side = String(canvas?.dataset?.side || '').trim();
      const troopOverscan =
        (troopType && BATTLE_SPINE_OVERSCAN_BY_TROOP[troopType]?.[side]) ||
        (troopType && BATTLE_SPINE_OVERSCAN_BY_TROOP[troopType]) ||
        null;
      return {
        logicalWidth: BATTLE_SPINE_LOGICAL_BOX.width,
        logicalHeight: BATTLE_SPINE_LOGICAL_BOX.height,
        bleedLeft: BATTLE_SPINE_OVERSCAN.left + Math.max(0, Number(troopOverscan?.left) || 0),
        bleedRight: BATTLE_SPINE_OVERSCAN.right + Math.max(0, Number(troopOverscan?.right) || 0),
        bleedTop: BATTLE_SPINE_OVERSCAN.top + Math.max(0, Number(troopOverscan?.top) || 0),
        bleedBottom: BATTLE_SPINE_OVERSCAN.bottom + Math.max(0, Number(troopOverscan?.bottom) || 0),
      };
    }

    function configureBattleSpineCanvasMetrics(canvas) {
      const metrics = getBattleSpineCanvasMetrics(canvas);
      if (!canvas) {
        return metrics;
      }

      canvas.dataset.logicalWidth = String(metrics.logicalWidth);
      canvas.dataset.logicalHeight = String(metrics.logicalHeight);
      canvas.dataset.bleedLeft = String(metrics.bleedLeft);
      canvas.dataset.bleedRight = String(metrics.bleedRight);
      canvas.dataset.bleedTop = String(metrics.bleedTop);
      canvas.dataset.bleedBottom = String(metrics.bleedBottom);

      const actualWidth = metrics.logicalWidth + metrics.bleedLeft + metrics.bleedRight;
      const actualHeight = metrics.logicalHeight + metrics.bleedTop + metrics.bleedBottom;
      canvas.style.width = `${actualWidth}px`;
      canvas.style.height = `${actualHeight}px`;
      const whiteFlashCanvas = canvas.__battleWhiteFlashOverlayCanvas;
      if (whiteFlashCanvas instanceof HTMLCanvasElement) {
        whiteFlashCanvas.dataset.logicalWidth = canvas.dataset.logicalWidth;
        whiteFlashCanvas.dataset.logicalHeight = canvas.dataset.logicalHeight;
        whiteFlashCanvas.dataset.bleedLeft = canvas.dataset.bleedLeft;
        whiteFlashCanvas.dataset.bleedRight = canvas.dataset.bleedRight;
        whiteFlashCanvas.dataset.bleedTop = canvas.dataset.bleedTop;
        whiteFlashCanvas.dataset.bleedBottom = canvas.dataset.bleedBottom;
        whiteFlashCanvas.style.width = `${actualWidth}px`;
        whiteFlashCanvas.style.height = `${actualHeight}px`;
      }
      const whiteFlashSourceCanvas = canvas.__battleWhiteFlashSourceCanvas;
      if (whiteFlashSourceCanvas instanceof HTMLCanvasElement) {
        whiteFlashSourceCanvas.dataset.logicalWidth = canvas.dataset.logicalWidth;
        whiteFlashSourceCanvas.dataset.logicalHeight = canvas.dataset.logicalHeight;
        whiteFlashSourceCanvas.dataset.bleedLeft = canvas.dataset.bleedLeft;
        whiteFlashSourceCanvas.dataset.bleedRight = canvas.dataset.bleedRight;
        whiteFlashSourceCanvas.dataset.bleedTop = canvas.dataset.bleedTop;
        whiteFlashSourceCanvas.dataset.bleedBottom = canvas.dataset.bleedBottom;
        whiteFlashSourceCanvas.style.width = `${actualWidth}px`;
        whiteFlashSourceCanvas.style.height = `${actualHeight}px`;
      }

      const frame = canvas.closest('.formation-spine-frame');
      if (frame) {
        frame.style.setProperty('--spine-bleed-left', `${metrics.bleedLeft}px`);
        frame.style.setProperty('--spine-bleed-right', `${metrics.bleedRight}px`);
        frame.style.setProperty('--spine-bleed-top', `${metrics.bleedTop}px`);
        frame.style.setProperty('--spine-bleed-bottom', `${metrics.bleedBottom}px`);
      }

      return metrics;
    }

    function syncBattleWhiteFlashOverlayCanvas(canvas) {
      if (!(canvas instanceof HTMLCanvasElement)) return;
      const whiteFlashCanvas = canvas.__battleWhiteFlashOverlayCanvas;
      if (!(whiteFlashCanvas instanceof HTMLCanvasElement)) return;
      const whiteFlashSourceCanvas = canvas.__battleWhiteFlashSourceCanvas;
      if (!(whiteFlashSourceCanvas instanceof HTMLCanvasElement)) return;
