        if (!Number.isFinite(Number(rig.lowerLength)) || rig.lowerLength <= 4) {
          rig.lowerLength = Math.max(4, this.distance(centerWorld, lowerTipCurrent));
        }
        if (!Number.isFinite(Number(rig.controlBaseX)) || !Number.isFinite(Number(rig.controlBaseY))) {
          const local = this.bowWorldToLocal(centerWorld, rig.groupRotation, controlPointCurrent);
          rig.controlBaseX = local.x;
          rig.controlBaseY = local.y;
        }
        if (!Number.isFinite(Number(rig.pull))) rig.pull = 0;
        const bend = (rig.pull || 0) * rig.bodyInfluence;
        const upperTip = this.bowLocalToWorld(centerWorld, rig.groupRotation, { x: bend, y: rig.upperLength });
        const lowerTip = this.bowLocalToWorld(centerWorld, rig.groupRotation, { x: bend, y: -rig.lowerLength });
        const controlPoint = this.bowLocalToWorld(centerWorld, rig.groupRotation, {
          x: (rig.controlBaseX || 0) + (rig.pull || 0),
          y: rig.controlBaseY || 0,
        });
        const bowFrame = { ...nodes, rig: this.normalizeBowRig(rig), centerWorld, upperTip, lowerTip, controlPoint };
        if (cacheKey) {
          frameState.bowRigByControlNode.set(cacheKey, bowFrame);
        }
        return bowFrame;
      }

      bowRigSegments(attachment, action, frame) {
        const controlNode = this.findBowRigControlForAttachment(attachment);
        const bowFrame = controlNode ? this.computeBowRigFrame(controlNode, action, frame) : null;
        if (!bowFrame) return null;
        const upperRest = this.restWorldPose(bowFrame.upper);
        const lowerRest = this.restWorldPose(bowFrame.lower);
        const stringUpperRest = this.restWorldPose(bowFrame.stringUpper);
        const stringLowerRest = this.restWorldPose(bowFrame.stringLower);
        return [
          {
            restStart: { x: upperRest.worldX, y: upperRest.worldY },
            restEnd: this.endPoint(upperRest),
            start: bowFrame.centerWorld,
            end: bowFrame.upperTip,
          },
          {
            restStart: { x: lowerRest.worldX, y: lowerRest.worldY },
            restEnd: this.endPoint(lowerRest),
            start: bowFrame.centerWorld,
            end: bowFrame.lowerTip,
          },
          {
            restStart: { x: stringUpperRest.worldX, y: stringUpperRest.worldY },
            restEnd: this.endPoint(stringUpperRest),
            start: bowFrame.upperTip,
            end: bowFrame.controlPoint,
          },
          {
            restStart: { x: stringLowerRest.worldX, y: stringLowerRest.worldY },
            restEnd: this.endPoint(stringLowerRest),
            start: bowFrame.controlPoint,
            end: bowFrame.lowerTip,
          },
        ];
      }

      attachmentSegments(node, attachment, action, frame) {
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : `${attachment?.image || ''}:${attachment?.restPart?.partId || ''}`;
        if (frameState.attachmentSegmentsByNode.has(cacheKey)) {
          return frameState.attachmentSegmentsByNode.get(cacheKey);
        }
        let segments = null;
        if (this.isBowRigAttachment(node, attachment)) {
          const bowSegments = this.bowRigSegments(attachment, action, frame);
          if (bowSegments?.length) {
            segments = bowSegments;
          }
        }
        if (!segments) {
          segments = (attachment.skinBoneIds || [])
            .map(nodeId => this.getNodeById(nodeId))
            .filter(Boolean)
            .map(boneNode => {
              const pose = this.worldPose(boneNode, action, frame);
              const rest = this.restWorldPose(boneNode);
              return {
                restStart: { x: rest.worldX, y: rest.worldY },
                restEnd: this.endPoint(rest),
                start: { x: pose.worldX, y: pose.worldY },
                end: this.endPoint(pose),
              };
            });
        }
        frameState.attachmentSegmentsByNode.set(cacheKey, segments);
        return segments;
      }

      computeBounds() {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const node of this.nodes) {
          if (node?.role === 'arrow-piece' || node?.role === 'slash-fx-piece') continue;
          const attachment = node.attachment;
          const image = this.images[attachment?.image];
          const restPart = this.resolveRestPartTransform(attachment?.restPart);
          if (!image || !restPart) continue;
          const corners = [
            { x: 0, y: 0 },
            { x: image.width, y: 0 },
            { x: image.width, y: image.height },
            { x: 0, y: image.height },
          ].map(point => this.imagePointToFullSkinRest(point, image, restPart));
          for (const point of corners) {
            minX = Math.min(minX, point.x);
            minY = Math.min(minY, point.y);
            maxX = Math.max(maxX, point.x);
            maxY = Math.max(maxY, point.y);
          }
        }
        return Number.isFinite(minX)
          ? { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY }
          : { minX: 280, minY: 40, maxX: 610, maxY: 620, width: 330, height: 580 };
      }

      getAction(actionId) {
        if (actionId === 'move' || actionId === 'jump') return this.moveAction;
        if (actionId === 'attack' || actionId === 'slash') return this.attackAction;
        if (actionId === 'idle') return this.idleAction;
        return this.findAction(actionId) || this.idleAction;
      }

      getActionFrameCount(actionId) {
        const action = this.getAction(actionId);
        return Math.max(1, action?.duration ?? this.project.duration ?? 29);
      }

      getActionDurationMs(actionId) {
        return ((this.getActionFrameCount(actionId) + 1) / this.fps) * 1000;
      }

      getRenderPlacement(canvas, options = {}) {
        const rect = canvas.getBoundingClientRect();
        const logicalWidth = Math.max(1, Number(canvas.dataset.logicalWidth) || rect.width);
        const logicalHeight = Math.max(1, Number(canvas.dataset.logicalHeight) || rect.height);
        const bleedLeft = Math.max(0, Number(canvas.dataset.bleedLeft) || 0);
        const bleedTop = Math.max(0, Number(canvas.dataset.bleedTop) || 0);
        const overscanX = Math.max(0, logicalWidth * 0.27);
        const overscanY = Math.max(0, logicalHeight * 0.21);
        const layoutWidth = Math.max(1, logicalWidth - overscanX * 2);
        const layoutHeight = Math.max(1, logicalHeight - overscanY * 2);
        const scale = Math.min(
          layoutWidth / Math.max(1, this.bounds.width),
          layoutHeight / Math.max(1, this.bounds.height)
        ) * 0.94 * Math.max(0.1, Number(this.config.renderScaleMultiplier) || 1);
        const side = options.side || canvas.dataset.side || '';
        const baseRenderOffsetX = Number(this.config.renderOffsetX) || 0;
        const sideRenderOffsetX =
          side && this.config.renderOffsetXBySide
            ? Number(this.config.renderOffsetXBySide[side]) || 0
            : baseRenderOffsetX;
        const renderOffsetY =
          side && this.config.renderOffsetYBySide
            ? Number(this.config.renderOffsetYBySide[side]) || 0
            : Number(this.config.renderOffsetY) || 0;
        return {
          rect,
          side,
          scale,
          translateX:
            bleedLeft +
            overscanX +
            layoutWidth / 2 -
            (this.bounds.minX + this.bounds.width / 2) * scale +
            sideRenderOffsetX,
          translateY:
            bleedTop +
            overscanY +
            layoutHeight * 0.58 -
            (this.bounds.minY + this.bounds.height * 0.52) * scale +
            renderOffsetY,
        };
      }

      projectWorldPoint(canvas, worldPoint, options = {}) {
        const placement = this.getRenderPlacement(canvas, options);
        return {
          rect: placement.rect,
          side: placement.side,
          scale: placement.scale,
          x: placement.translateX + worldPoint.x * placement.scale,
          y: placement.translateY + worldPoint.y * placement.scale,
        };
      }

      getRightHandNode() {
        if (Object.prototype.hasOwnProperty.call(this, 'rightHandNodeCache')) {
          return this.rightHandNodeCache;
        }
        this.rightHandNodeCache =
          this.nodes.find((node) => {
            if (node?.role !== 'rightArm') return false;
            const parent = this.getNodeById(node.parentId);
            return parent?.role === 'rightArm';
          }) ||
          this.nodes.find(node => node?.role === 'rightArm') ||
          null;
        return this.rightHandNodeCache;
      }

      getRightHandWorldPoint(actionId, frame) {
        const node = this.getRightHandNode();
        if (!node) return null;
        const pose = this.worldPose(node, this.getAction(actionId), frame);
        return this.endPoint(pose);
      }

      getBowRigControlNode() {
        if (Object.prototype.hasOwnProperty.call(this, 'bowRigControlNodeCache')) {
          return this.bowRigControlNodeCache;
        }
        this.bowRigControlNodeCache = this.nodes.find(node => this.isBowStringControlNode(node)) || null;
        return this.bowRigControlNodeCache;
      }

      getBowRigFrame(actionId, frame) {
        const controlNode = this.getBowRigControlNode();
        if (!controlNode) return null;
        return this.computeBowRigFrame(controlNode, this.getAction(actionId), frame);
      }

      render(canvas, actionId = 'idle', elapsedMs = 0, options = {}) {
        const placement = this.getRenderPlacement(canvas, options);
        const rect = placement.rect;
        const logicalWidth = Math.max(1, Number(canvas.dataset.logicalWidth) || rect.width);
        const logicalHeight = Math.max(1, Number(canvas.dataset.logicalHeight) || rect.height);
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, rect.width, rect.height);
        this.lowDetail = logicalWidth < 64 || logicalHeight < 84;
        const action = this.getAction(actionId);
        const duration = Math.max(1, action?.duration ?? this.project.duration ?? 29);
        const rawFrame = (elapsedMs / 1000) * this.fps;
        const frame = options.loop === false ? Math.min(duration, rawFrame) : rawFrame % (duration + 1);
        const imageMap = options.imageSet === 'whiteSilhouette' ? this.whiteFlashImages : this.images;
        canvas.__battleSpineRenderer = this;
        canvas.__battleLastRenderActionId = actionId;
        canvas.__battleLastRenderElapsedMs = elapsedMs;
        canvas.__battleLastRenderSide = options.side || canvas.dataset.side || '';
        canvas.__battleLastRenderLoop = options.loop;
        this.beginRenderFrame(action, frame);
        ctx.save();
        ctx.translate(placement.translateX, placement.translateY);
        ctx.scale(placement.scale, placement.scale);
        this.drawCharacter(ctx, action, frame, imageMap);
        ctx.restore();
      }

      drawCharacter(ctx, action, frame, imageMap = this.images) {
        this.getRenderableAttachmentNodes(action, frame)
          .forEach(node => this.drawAttachment(ctx, node, action, frame, imageMap));
      }

      drawAttachment(ctx, node, action, frame, imageMap = this.images) {
        const attachment = node.attachment;
        const alpha = this.effectiveAttachmentAlphaForNode(node, action, frame);
        if (alpha <= 0.001) return;
        const imageKey = this.getAttachmentImageForFrame(node, action, frame);
        const image = imageMap[imageKey] || imageMap[attachment.image];
        const restPart = this.resolveRestPartTransform(attachment.restPart);
        if (!image?.complete || !attachment.fullSkin || !restPart) return;
        const segments = this.attachmentSegments(node, attachment, action, frame);
        if (!segments.length) return;
        const defaultCols = this.lowDetail ? 3 : attachment.restPart.partId === 'torso' ? 5 : 4;
        const defaultRows = this.lowDetail ? Math.max(4, segments.length * 3) : Math.max(6, segments.length * 5);
        const authoredMeshCols = Math.round(Number(attachment.meshCols));
        const authoredMeshRows = Math.round(Number(attachment.meshRows));
        const cols = authoredMeshCols > 0
          ? Math.max(3, authoredMeshCols)
          : defaultCols;
        const rows = authoredMeshRows > 0
          ? Math.max(6, authoredMeshRows)
          : defaultRows;
        const source = this.getAttachmentSourceGrid(image, cols, rows);
        const dest = [];
        for (let row = 0; row <= rows; row += 1) {
          const destRow = [];
          for (let col = 0; col <= cols; col += 1) {
            const sourcePoint = source[row][col];
            destRow.push(this.deformByAttachmentSegments(
              this.imagePointToFullSkinRest(sourcePoint, image, restPart),
              segments,
            ));
          }
          dest.push(destRow);
        }
        this.drawTexturedMesh(ctx, image, source, dest, alpha);
      }

      getLocalPose(node, action, frame) {
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && frameState.localPoseByNode.has(cacheKey)) {
          return frameState.localPoseByNode.get(cacheKey);
        }
        const keys = this.getSortedTimelineKeys(action, node.id);
        let pose = null;
        if (!keys.length) {
          pose = this.enrichBowPose(node, { ...node });
        } else {
          const exact = keys.find(item => item.frame === frame);
          if (exact) {
            pose = this.enrichBowPose(node, { ...node, ...exact });
          } else if (keys.length === 1) {
            pose = this.enrichBowPose(node, { ...node, ...keys[0] });
          } else {
            const before = [...keys].reverse().find(item => item.frame < frame);
            const after = keys.find(item => item.frame > frame);
            if (!before) {
              pose = this.enrichBowPose(node, { ...node, ...keys[0] });
            } else if (!after) {
              const start = keys.find(item => item.frame === 0) || keys[0];
              const span = Math.max(1, (action?.duration ?? this.project.duration ?? 29) + 1 - before.frame);
              pose = this.interpolateLocalPose(
                node,
                before,
                start,
                Math.max(0, Math.min(1, (frame - before.frame) / span)),
              );
            } else {
              const arrowPiece = this.arrowPieceForNode(node);
              const slashFxPiece = this.slashFxPieceForNode(node);
              const parentChange =
                this.arrowParentChangeBetweenFrames(arrowPiece, action, before.frame, after.frame) ||
                this.slashFxParentChangeBetweenFrames(slashFxPiece, action, before.frame, after.frame);
              if (parentChange) {
                pose = frame < parentChange.frame
                  ? this.enrichBowPose(node, { ...node, ...before })
                  : this.enrichBowPose(node, { ...node, ...after });
              } else {
                pose = this.interpolateLocalPose(node, before, after, (frame - before.frame) / (after.frame - before.frame));
              }
            }
          }
        }
        if (cacheKey) {
          frameState.localPoseByNode.set(cacheKey, pose);
        }
        return pose;
      }

      interpolateLocalPose(node, before, after, t) {
        const basePose = {
          ...node,
          x: this.lerp(before.x, after.x, t),
          y: this.lerp(before.y, after.y, t),
          rotation: this.lerpAngle(before.rotation, after.rotation, t),
          length: this.lerp(before.length, after.length, t),
          scaleX: this.lerp(before.scaleX, after.scaleX, t),
          scaleY: this.lerp(before.scaleY, after.scaleY, t),
        };
        if (!this.isBowStringControlNode(node)) return basePose;
        const from = this.enrichBowPose(node, before || {});
        const to = this.enrichBowPose(node, after || before || {});
        return {
          ...basePose,
          bowPoseSerialized: Boolean(from.bowPoseSerialized || to.bowPoseSerialized),
          bowGroupRotation: this.lerpAngle(
            Number(from.bowGroupRotation ?? from.bowAngle) || 0,
            Number(to.bowGroupRotation ?? to.bowAngle) || 0,
            t,
          ),
          bowAngle: this.lerpAngle(
            Number(from.bowGroupRotation ?? from.bowAngle) || 0,
            Number(to.bowGroupRotation ?? to.bowAngle) || 0,
            t,
          ),
          bowUpperLength: this.lerp(Number(from.bowUpperLength) || 4, Number(to.bowUpperLength) || 4, t),
          bowLowerLength: this.lerp(Number(from.bowLowerLength) || 4, Number(to.bowLowerLength) || 4, t),
          bowControlBaseX: this.lerp(Number(from.bowControlBaseX) || 0, Number(to.bowControlBaseX) || 0, t),
          bowControlBaseY: this.lerp(Number(from.bowControlBaseY) || 0, Number(to.bowControlBaseY) || 0, t),
          bowPull: this.lerp(Number(from.bowPull) || 0, Number(to.bowPull) || 0, t),
        };
      }

      worldPose(node, action, frame, seen = new Set()) {
        const frameState = this.beginRenderFrame(action, frame);
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && frameState.worldPoseByNode.has(cacheKey)) {
          return frameState.worldPoseByNode.get(cacheKey);
        }
        if (seen.has(node.id)) return this.getLocalPose(node, action, frame);
        seen.add(node.id);
        const local = this.getLocalPose(node, action, frame);
        const effectiveParentId = this.effectiveParentIdForNode(node, action, frame);
        let world = null;
        if (!effectiveParentId) {
          world = {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        } else {
          const parent = this.getNodeById(effectiveParentId);
          if (!parent) {
            world = {
              ...local,
              worldX: local.x,
              worldY: local.y,
              worldRotation: local.rotation,
              worldScaleX: local.scaleX,
              worldScaleY: local.scaleY,
            };
          } else {
            const p = this.worldPose(parent, action, frame, seen);
            const anchor = this.endPoint(p);
            const worldRotation = p.worldRotation + local.rotation;
            const worldScaleX = p.worldScaleX * local.scaleX;
            const worldScaleY = p.worldScaleY * local.scaleY;
            if (this.isTempParentBoundArrowCarrier(node, action, frame)) {
              const gripLocal = this.arrowGripLocalForPiece(this.arrowPieceForNode(node));
              if (gripLocal) {
                const gripRad = (worldRotation * Math.PI) / 180;
                const gripOffsetX =
                  gripLocal.x * worldScaleX * Math.cos(gripRad) - gripLocal.y * worldScaleY * Math.sin(gripRad);
                const gripOffsetY =
                  gripLocal.x * worldScaleX * Math.sin(gripRad) + gripLocal.y * worldScaleY * Math.cos(gripRad);
                world = {
                  ...local,
                  worldX: anchor.x - gripOffsetX,
                  worldY: anchor.y - gripOffsetY,
                  worldRotation,
                  worldScaleX,
                  worldScaleY,
                };
              }
            }
            if (!world && this.isTempParentBoundSlashFxCarrier(node, action, frame)) {
              const gripLocal = this.slashFxGripLocalForPiece(this.slashFxPieceForNode(node), action, frame);
              if (gripLocal) {
                const gripRad = (worldRotation * Math.PI) / 180;
                const gripOffsetX =
                  gripLocal.x * worldScaleX * Math.cos(gripRad) - gripLocal.y * worldScaleY * Math.sin(gripRad);
                const gripOffsetY =
                  gripLocal.x * worldScaleX * Math.sin(gripRad) + gripLocal.y * worldScaleY * Math.cos(gripRad);
                world = {
                  ...local,
                  worldX: anchor.x - gripOffsetX,
                  worldY: anchor.y - gripOffsetY,
                  worldRotation,
                  worldScaleX,
                  worldScaleY,
                };
              }
            }
            if (!world) {
              const rad = (p.worldRotation * Math.PI) / 180;
              const px = local.x * p.worldScaleX;
              const py = local.y * p.worldScaleY;
              world = {
                ...local,
                worldX: anchor.x + px * Math.cos(rad) - py * Math.sin(rad),
                worldY: anchor.y + px * Math.sin(rad) + py * Math.cos(rad),
                worldRotation,
                worldScaleX,
                worldScaleY,
              };
            }
          }
        }
        if (cacheKey) {
          frameState.worldPoseByNode.set(cacheKey, world);
        }
        return world;
      }

      restWorldPose(node, seen = new Set()) {
        const cacheKey = node?.id != null ? String(node.id) : '';
        if (cacheKey && this.restWorldPoseCache.has(cacheKey)) {
          return this.restWorldPoseCache.get(cacheKey);
        }
        if (seen.has(node.id)) return { ...node, ...(node.bindPose || {}) };
        seen.add(node.id);
        const local = { ...node, ...(node.bindPose || {}) };
        let world = null;
        if (!node.parentId) {
          world = {
            ...local,
            worldX: local.x,
            worldY: local.y,
            worldRotation: local.rotation,
            worldScaleX: local.scaleX,
            worldScaleY: local.scaleY,
          };
        } else {
          const parent = this.getNodeById(node.parentId);
          if (!parent) {
            world = {
              ...local,
              worldX: local.x,
              worldY: local.y,
              worldRotation: local.rotation,
              worldScaleX: local.scaleX,
              worldScaleY: local.scaleY,
            };
          } else {
            const p = this.restWorldPose(parent, seen);
            const anchor = this.endPoint(p);
            const rad = (p.worldRotation * Math.PI) / 180;
            const px = local.x * p.worldScaleX;
            const py = local.y * p.worldScaleY;
            world = {
              ...local,
              worldX: anchor.x + px * Math.cos(rad) - py * Math.sin(rad),
              worldY: anchor.y + px * Math.sin(rad) + py * Math.cos(rad),
              worldRotation: p.worldRotation + local.rotation,
              worldScaleX: p.worldScaleX * local.scaleX,
              worldScaleY: p.worldScaleY * local.scaleY,
            };
          }
        }
        if (cacheKey) {
          this.restWorldPoseCache.set(cacheKey, world);
        }
        return world;
      }

      endPoint(pose) {
        const rad = (pose.worldRotation * Math.PI) / 180;
        return {
          x: pose.worldX + Math.cos(rad) * pose.length * pose.worldScaleX,
          y: pose.worldY + Math.sin(rad) * pose.length * pose.worldScaleY,
        };
      }

      imagePointToFullSkinRest(sourcePoint, image, restPart) {
        const width = image.width * restPart.scale;
        const height = image.height * restPart.scale;
        const localX = (sourcePoint.x / image.width) * width - width * restPart.anchorX;
        const localY = (sourcePoint.y / image.height) * height - height * restPart.anchorY;
        const angle = (restPart.rotation * Math.PI) / 180;
        return {
          x: restPart.x + localX * Math.cos(angle) - localY * Math.sin(angle),
          y: restPart.y + localX * Math.sin(angle) + localY * Math.cos(angle),
        };
      }

      deformByAttachmentSegments(point, segments) {
        let totalWeight = 0;
        const blended = { x: 0, y: 0 };
        for (const segment of segments) {
          const projection = this.projectPointOnSegment(point, segment.restStart, segment.restEnd);
          const weight = this.attachmentSegmentWeight(this.distance(point, projection.point), segment);
          const mapped = this.mapPointByAttachmentSegment(point, segment);
          blended.x += mapped.x * weight;
          blended.y += mapped.y * weight;
          totalWeight += weight;
        }
        return totalWeight <= 0 ? point : { x: blended.x / totalWeight, y: blended.y / totalWeight };
      }

      mapPointByAttachmentSegment(point, segment) {
        const restLength = Math.max(1, this.distance(segment.restStart, segment.restEnd));
        const currentLength = Math.max(1, this.distance(segment.start, segment.end));
        const restDir = this.normalizeVector({ x: segment.restEnd.x - segment.restStart.x, y: segment.restEnd.y - segment.restStart.y });
        const currentDir = this.normalizeVector({ x: segment.end.x - segment.start.x, y: segment.end.y - segment.start.y });
        const restNormal = { x: -restDir.y, y: restDir.x };
        const currentNormal = { x: -currentDir.y, y: currentDir.x };
        const local = { x: point.x - segment.restStart.x, y: point.y - segment.restStart.y };
        const softenedScale = 1 + (currentLength / restLength - 1) * 0.72;
        const axial = this.dotVector(local, restDir) * softenedScale;
        const lateral = this.dotVector(local, restNormal);
        return {
          x: segment.start.x + currentDir.x * axial + currentNormal.x * lateral,
          y: segment.start.y + currentDir.y * axial + currentNormal.y * lateral,
        };
      }

      attachmentSegmentWeight(distanceToSegment, segment) {
        const reach = Math.max(16, this.distance(segment.restStart, segment.restEnd) * 0.34);
        const base = 1 / ((distanceToSegment / reach + 0.18) * (distanceToSegment / reach + 0.18));
        return base * Math.sqrt(base);
      }

      projectPointOnSegment(point, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (lengthSquared === 0) return { point: { ...a }, t: 0 };
        const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared));
        return { point: { x: a.x + dx * t, y: a.y + dy * t }, t };
      }

      drawTexturedMesh(ctx, image, source, dest, alpha) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        for (let row = 0; row < source.length - 1; row += 1) {
          for (let col = 0; col < source[row].length - 1; col += 1) {
            this.drawImageTriangle(ctx, image, source[row][col], source[row + 1][col], source[row][col + 1], dest[row][col], dest[row + 1][col], dest[row][col + 1]);
            this.drawImageTriangle(ctx, image, source[row + 1][col], source[row + 1][col + 1], source[row][col + 1], dest[row + 1][col], dest[row + 1][col + 1], dest[row][col + 1]);
          }
        }
        ctx.restore();
      }

      drawImageTriangle(ctx, image, s0, s1, s2, d0, d1, d2) {
        const denominator = s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y);
        if (Math.abs(denominator) < 0.001) return;
        const a = (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) / denominator;
        const b = (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) / denominator;
        const c = (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) / denominator;
        const d = (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) / denominator;
        const e = (d0.x * (s1.x * s2.y - s2.x * s1.y) + d1.x * (s2.x * s0.y - s0.x * s2.y) + d2.x * (s0.x * s1.y - s1.x * s0.y)) / denominator;
        const f = (d0.y * (s1.x * s2.y - s2.x * s1.y) + d1.y * (s2.x * s0.y - s0.x * s2.y) + d2.y * (s0.x * s1.y - s1.x * s0.y)) / denominator;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(d0.x, d0.y);
        ctx.lineTo(d1.x, d1.y);
        ctx.lineTo(d2.x, d2.y);
        ctx.closePath();
        ctx.clip();
        ctx.transform(a, b, c, d, e, f);
        ctx.drawImage(image, 0, 0);
        ctx.restore();
      }

      lerp(a, b, t) { return a + (b - a) * t; }
      lerpAngle(a, b, t) {
        let diff = ((b - a + 180) % 360) - 180;
        if (diff < -180) diff += 360;
        return a + diff * t;
      }
      distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      normalizeVector(vector) {
        const length = Math.hypot(vector.x, vector.y) || 1;
        return { x: vector.x / length, y: vector.y / length };
      }
      dotVector(a, b) { return a.x * b.x + a.y * b.y; }
    }

    function getBattleSpineRenderer(troopType = 'infantry') {
      const asset = getBattleSpineTroopAsset(troopType);
      if (!battleSpineRendererPromises.has(asset.cacheKey)) {
        battleSpineRendererPromises.set(
          asset.cacheKey,
          BattleSpineRenderer.load(asset).catch(error => {
            console.warn('Failed to load battle Spine renderer', troopType, error);
            return null;
          })
        );
      }
      return battleSpineRendererPromises.get(asset.cacheKey);
    }

    function clearBattleSpineRendererCache(cacheKey = null) {
      if (!cacheKey) {
        battleSpineRendererPromises.clear();
        return;
      }
      battleSpineRendererPromises.delete(String(cacheKey));
    }

    function startBattleSpineIdleLoop() {
      if (battleSpineIdleRaf) return;
      const tick = () => {
        const formationOverlay = document.getElementById('formation-battle');
        const quickOverlay = document.getElementById('quick-battle-overlay');
        const formationVisible = !formationOverlay?.classList.contains('hidden');
        const quickVisible = !quickOverlay?.classList.contains('hidden');
        if (!formationVisible && !quickVisible) {
          stopBattleSpineIdleLoop();
          return;
        }
        const now = performance.now();
        const allowThrottledIdleRender = now - battleSpineLastIdleRender >= 83;
        if (allowThrottledIdleRender) {
          battleSpineLastIdleRender = now;
        }
        for (const entry of getBattleSpineCanvasEntries()) {
          if (
            entry.slot.classList.contains('empty') ||
            entry.slot.classList.contains('is-proxying') ||
            entry.canvas.dataset.animating === 'true'
          ) {
            continue;
          }
          if (entry.canvas.dataset.freezeIdleFrame === 'true' && entry.canvas.__battleFrozenFrameRendered === true) {
            continue;
          }
          const rect = entry.canvas.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) continue;
          const troopType = entry.canvas.dataset.troopType || 'infantry';
          if (troopType !== 'cavalry' && !allowThrottledIdleRender) {
            continue;
          }
          getBattleSpineRenderer(troopType).then(renderer => {
            if (!renderer) return;
            const freezeIdleFrame = entry.canvas.dataset.freezeIdleFrame === 'true';
            const actionId = entry.canvas.dataset.action || 'idle';
            const elapsedMs = freezeIdleFrame ? 0 : now + Number(entry.canvas.dataset.phase || 0);
            if (troopType === 'cavalry' && !freezeIdleFrame) {
              const frameCount = Math.max(1, renderer.getActionFrameCount(actionId));
              const actionFrameBucket = Math.floor((elapsedMs / 1000) * Math.max(1, renderer.fps || 60)) % (frameCount + 1);
              if (entry.canvas.__battleLastIdleActionFrameBucket === actionFrameBucket) {
                return;
              }
              entry.canvas.__battleLastIdleActionFrameBucket = actionFrameBucket;
            }
            renderer.render(
              entry.canvas,
              actionId,
              elapsedMs,
              { side: entry.canvas.dataset.side || '' }
            );
            if (freezeIdleFrame) {
              entry.canvas.__battleFrozenFrameRendered = true;
            }
          });
        }
      };
      battleSpineIdleRaf = window.setInterval(tick, 16);
      tick();
    }

    function stopBattleSpineIdleLoop() {
      if (!battleSpineIdleRaf) return;
      window.clearInterval(battleSpineIdleRaf);
      battleSpineIdleRaf = 0;
      battleSpineLastIdleRender = 0;
    }

    function getBattleSpineCanvasEntries() {
      const entries = [];
      if (battleFormationViewState.initialized) {
        for (const view of [battleFormationViewState.attacker, battleFormationViewState.defender]) {
          if (!view) continue;
          for (const entry of view.slots.values()) {
            entries.push(entry);
          }
        }
      }
      document.querySelectorAll('[data-quick-role="portrait-renderer"]').forEach((host) => {
        const entry = host.__quickBattlePortraitEntry;
        if (entry?.canvas instanceof HTMLCanvasElement) {
          entries.push(entry);
        }
      });
      return entries;
    }

    function createQuickBattlePortraitSpineEntry(side = 'player', troopType = 'infantry') {
      const root = document.createElement('div');
      root.className = `quick-battle-portrait-renderer ${side === 'enemy' ? 'enemy' : 'player'}`;

      const frame = document.createElement('div');
      frame.className = 'formation-spine-frame quick-battle-portrait-spine-frame';

      const canvas = document.createElement('canvas');
      canvas.className = 'formation-spine-canvas';
      canvas.dataset.action = 'idle';
      canvas.dataset.phase = String(Math.floor(Math.random() * 1000));
      canvas.dataset.side = side;
      canvas.dataset.troopType = troopType;
      canvas.setAttribute('aria-hidden', 'true');

      const whiteFlashCanvas = document.createElement('canvas');
      whiteFlashCanvas.className = 'formation-spine-white-flash-canvas';
      whiteFlashCanvas.setAttribute('aria-hidden', 'true');
      const whiteFlashSourceCanvas = document.createElement('canvas');
      whiteFlashSourceCanvas.className = 'formation-spine-white-flash-source-canvas';
      whiteFlashSourceCanvas.setAttribute('aria-hidden', 'true');

      canvas.__battleWhiteFlashOverlayCanvas = whiteFlashCanvas;
      canvas.__battleWhiteFlashSourceCanvas = whiteFlashSourceCanvas;
      frame.appendChild(canvas);
      frame.appendChild(whiteFlashSourceCanvas);
      frame.appendChild(whiteFlashCanvas);
      root.appendChild(frame);
      configureBattleSpineCanvasMetrics(canvas);

      const entry = { root, slot: root, frame, canvas, whiteFlashCanvas };
      root.__quickBattlePortraitEntry = entry;
      return entry;
    }

    function createBattleFormationSlotElement(slotKey, mirrorCols = false) {
      const pos = getBattleSlotPosition(slotKey, mirrorCols);
      const slot = document.createElement('div');
      slot.className = `formation-slot ${pos.rowClass} empty`;
      slot.dataset.slot = slotKey;
      slot.style.setProperty('--row', String(pos.row));
      slot.style.setProperty('--col', String(pos.col));
      slot.style.setProperty('--x', String(pos.x));
      slot.style.setProperty('--y', String(pos.y));
      slot.style.setProperty('--slot-scale', String(pos.scale ?? 1));
      slot.dataset.anchor = pos.anchor || 'bottom-center';
      slot.style.zIndex = String(pos.z);

      const frame = document.createElement('div');
      frame.className = 'formation-spine-frame';

      const canvas = document.createElement('canvas');
      canvas.className = 'formation-spine-canvas';
      canvas.dataset.action = 'idle';
      canvas.dataset.phase = String((pos.row * 137 + pos.col * 83) % 1000);
      canvas.setAttribute('aria-hidden', 'true');
      const whiteFlashCanvas = document.createElement('canvas');
      whiteFlashCanvas.className = 'formation-spine-white-flash-canvas';
      whiteFlashCanvas.setAttribute('aria-hidden', 'true');
      const whiteFlashSourceCanvas = document.createElement('canvas');
      whiteFlashSourceCanvas.className = 'formation-spine-white-flash-source-canvas';
      whiteFlashSourceCanvas.setAttribute('aria-hidden', 'true');
      canvas.__battleWhiteFlashOverlayCanvas = whiteFlashCanvas;
      canvas.__battleWhiteFlashSourceCanvas = whiteFlashSourceCanvas;
      frame.appendChild(canvas);
      frame.appendChild(whiteFlashSourceCanvas);
      frame.appendChild(whiteFlashCanvas);
      configureBattleSpineCanvasMetrics(canvas);

      const slotName = document.createElement('div');
      slotName.className = 'slot-name';
      slotName.textContent = FORMATION_SLOT_LABELS[slotKey];

      const memberName = document.createElement('div');
      memberName.className = 'member-name';

      const memberHp = document.createElement('div');
      memberHp.className = 'member-hp';
      const memberHpFill = document.createElement('div');
      memberHpFill.className = 'member-hp-fill';
      memberHp.appendChild(memberHpFill);

      const memberLoss = document.createElement('div');
      memberLoss.className = 'member-loss';
      memberLoss.hidden = true;

      slot.appendChild(frame);
      slot.appendChild(slotName);
      slot.appendChild(memberName);
      slot.appendChild(memberHp);
      slot.appendChild(memberLoss);

      return {
        slot,
        frame,
        canvas,
        whiteFlashCanvas,
        memberName,
        memberHp,
        memberHpFill,
        memberLoss,
      };
    }

    function initializeBattleFormationGrid(gridId, mirrorCols = false) {
      const grid = document.getElementById(gridId);
      const slots = new Map();
      if (!grid) {
        return { root: null, slots, mirrorCols };
      }
      grid.innerHTML = '';
      for (const slotKey of FORMATION_SLOT_KEYS) {
        const entry = createBattleFormationSlotElement(slotKey, mirrorCols);
        slots.set(slotKey, entry);
        grid.appendChild(entry.slot);
      }
      return { root: grid, slots, mirrorCols };
    }

    function ensureBattleFormationViews() {
      if (battleFormationViewState.initialized) {
        return;
      }
      battleFormationViewState.attacker = initializeBattleFormationGrid('battle-attacker-grid', true);
      battleFormationViewState.defender = initializeBattleFormationGrid('battle-defender-grid', false);
      battleFormationViewState.attackerMoraleBar = document.getElementById('battle-attacker-morale');
      battleFormationViewState.defenderMoraleBar = document.getElementById('battle-defender-morale');
      battleFormationViewState.initialized = true;
    }

    function clearBattleFormationProxyState() {
      document.querySelectorAll('.battle-spine-proxy').forEach(proxy => proxy.remove());
      document.querySelectorAll('.battle-spine-proxy-anchor').forEach(proxy => proxy.remove());
      document.querySelectorAll('.formation-slot.is-proxying').forEach(slot => {
        slot.classList.remove('is-proxying');
      });
    }

    function normalizeBattleActiveSlotKeys(active, sideKey, fieldPrefix) {
      const singleKey = active?.[`${fieldPrefix}SlotKey`];
      const multipleKeys = active?.[`${fieldPrefix}SlotKeys`];
      const fieldSide = active?.[`${fieldPrefix}Side`];
      const fieldEntries = Array.isArray(active?.[`${fieldPrefix}s`]) ? active[`${fieldPrefix}s`] : [];
      const keys = new Set();

      if (fieldSide === sideKey && typeof singleKey === 'string' && singleKey) {
        keys.add(singleKey);
      }
      if (fieldSide === sideKey && Array.isArray(multipleKeys)) {
        multipleKeys.forEach((slotKey) => {
          if (typeof slotKey === 'string' && slotKey) keys.add(slotKey);
        });
      }
      fieldEntries.forEach((entry) => {
        if (entry?.side !== sideKey) return;
        if (typeof entry.slotKey === 'string' && entry.slotKey) {
          keys.add(entry.slotKey);
        }
      });

      return keys;
    }

    function buildBattleFormationSideState(snapshotBefore, snapshotAfter, active = {}) {
      const beforeBySlot = new Map((snapshotBefore?.formationMembers || []).map(member => [member.slotKey, member]));
      const afterBySlot = new Map((snapshotAfter?.formationMembers || []).map(member => [member.slotKey, member]));
      const side = snapshotAfter?.side || snapshotBefore?.side || '';
      const activeSourceSlots = normalizeBattleActiveSlotKeys(active, side, 'source');
      const activeTargetSlots = normalizeBattleActiveSlotKeys(active, side, 'target');
      const slots = new Map();

      for (const slotKey of FORMATION_SLOT_KEYS) {
        const before = beforeBySlot.get(slotKey) || null;
        const after = afterBySlot.get(slotKey) || null;
        const current = after || before || null;
        const loss = before && after ? before.soldiers - after.soldiers : 0;
        const hpRatio =
          current && current.maxSoldiers > 0
            ? clamp(((after ? after.soldiers : 0) / current.maxSoldiers) * 100, 0, 100)
            : 0;

        slots.set(slotKey, {
          before,
          after,
          current,
          loss,
          hpRatio,
          isSource: activeSourceSlots.has(slotKey),
          isTarget: activeTargetSlots.has(slotKey),
        });
      }

      return {
        side,
        morale: snapshotAfter?.morale ?? snapshotBefore?.morale ?? 0,
        slots,
        activeSourceSlots,
        activeTargetSlots,
      };
    }

    function buildBattleOverlayRenderState(report, attackerSnapshot, defenderSnapshot, active = {}) {
      const leftKey = report.attackerBefore.side === 'player' ? 'attacker' : 'defender';
      const rightKey = leftKey === 'attacker' ? 'defender' : 'attacker';
      const beforeByKey = {
        attacker: report.attackerBefore,
        defender: report.defenderBefore,
      };
      const snapshotByKey = {
        attacker: attackerSnapshot,
        defender: defenderSnapshot,
      };

      return {
        left: buildBattleFormationSideState(beforeByKey[leftKey], snapshotByKey[leftKey], active),
        right: buildBattleFormationSideState(beforeByKey[rightKey], snapshotByKey[rightKey], active),
      };
    }

    function commitBattleFormationSlot(entry, slotState, side) {
      if (!entry || !slotState) return;
      const isPreviewOnly = document.body.classList.contains('preview-formation-only');
      const nextState = {
        isEmpty: slotState.current == null,
        isFallen: Boolean(slotState.after && slotState.after.soldiers <= 0),
        isSource: Boolean(slotState.isSource),
        isTarget: Boolean(slotState.isTarget),
        troopType: slotState.current?.troopType || '',
        action: 'idle',
        side: side || '',
        memberName:
          slotState.current == null
            ? (isPreviewOnly ? '空位' : '')
            : slotState.current.name || TROOP_TYPES[slotState.current.troopType]?.label || slotState.current.troopType || '',
        hpWidth: `${slotState.hpRatio}%`,
        hideHp: isPreviewOnly && slotState.current == null,
        lossHidden: !(slotState.loss > 0),
        lossText: slotState.loss > 0 ? `-${slotState.loss}` : '',
      };
      const previous = entry.__battleLastCommittedState;
      const troopTypeChanged = previous && previous.troopType !== nextState.troopType;
      if (
        previous &&
        previous.isEmpty === nextState.isEmpty &&
        previous.isFallen === nextState.isFallen &&
        previous.isSource === nextState.isSource &&
        previous.isTarget === nextState.isTarget &&
        previous.troopType === nextState.troopType &&
        previous.action === nextState.action &&
        previous.side === nextState.side &&
        previous.memberName === nextState.memberName &&
        previous.hpWidth === nextState.hpWidth &&
        previous.hideHp === nextState.hideHp &&
        previous.lossHidden === nextState.lossHidden &&
        previous.lossText === nextState.lossText
      ) {
        return;
      }

      entry.slot.classList.toggle('empty', nextState.isEmpty);
      entry.slot.classList.toggle('fallen', nextState.isFallen);
      entry.slot.classList.toggle('striker', nextState.isSource);
      entry.slot.classList.toggle('targeted', nextState.isTarget);
      entry.slot.dataset.troopType = nextState.troopType;
      entry.canvas.dataset.action = nextState.action;
      entry.canvas.dataset.freezeIdleFrame = nextState.isFallen ? 'true' : 'false';
      entry.canvas.dataset.troopType = nextState.troopType;
      entry.canvas.dataset.side = nextState.side;
      entry.canvas.__battleFrozenFrameRendered = false;
      configureBattleSpineCanvasMetrics(entry.canvas);
      if (troopTypeChanged) {
        clearBattleSpineCanvasLayers(entry.canvas);
      }
      entry.memberName.textContent = nextState.memberName;
      entry.memberHp.hidden = nextState.hideHp;
      entry.memberHpFill.style.width = nextState.hpWidth;
      entry.memberLoss.hidden = nextState.lossHidden;
      entry.memberLoss.textContent = nextState.lossText;
      entry.__battleLastCommittedState = nextState;
    }

    function commitBattleFormationView(view, sideState) {
      if (!view?.slots || !sideState?.slots) return;
      for (const slotKey of FORMATION_SLOT_KEYS) {
        const entry = view.slots.get(slotKey);
        if (!entry) continue;
        commitBattleFormationSlot(entry, sideState.slots.get(slotKey), sideState.side);
      }
    }

    function updateBattleFormationView(view, snapshotBefore, snapshotAfter, active = {}) {
      if (!view?.root) {
        return;
      }
      commitBattleFormationView(
        view,
        buildBattleFormationSideState(snapshotBefore, snapshotAfter, active),
      );
    }

    function shouldSkipBattleOverlayCommit(nextState) {
      const previous = battleFormationViewState.lastCommittedRenderState;
      if (!previous || !nextState) return false;
      const buildSideKey = (sideState) => {
        const parts = [`${sideState?.side || ''}`, `${sideState?.morale ?? 0}`];
        const slotEntries = sideState?.slots instanceof Map ? [...sideState.slots.entries()] : [];
        slotEntries.forEach(([slotKey, slotState]) => {
          parts.push([
            slotKey,
            slotState?.current?.troopType || '',
            slotState?.after?.soldiers ?? '',
            slotState?.current?.maxSoldiers ?? '',
            slotState?.loss ?? 0,
            slotState?.isSource ? '1' : '0',
            slotState?.isTarget ? '1' : '0',
          ].join(':'));
        });
        return parts.join('|');
      };
      return (
        buildSideKey(previous.left) === buildSideKey(nextState.left) &&
        buildSideKey(previous.right) === buildSideKey(nextState.right)
      );
    }

    function commitBattleOverlayRenderState(renderState) {
      if (!renderState || shouldSkipBattleOverlayCommit(renderState)) return;
      commitBattleFormationView(battleFormationViewState.attacker, renderState.left);
      commitBattleFormationView(battleFormationViewState.defender, renderState.right);
      if (battleFormationViewState.attackerMoraleBar) {
        battleFormationViewState.attackerMoraleBar.style.width = `${clamp(renderState.left?.morale ?? 0, 0, 100)}%`;
      }
      if (battleFormationViewState.defenderMoraleBar) {
        battleFormationViewState.defenderMoraleBar.style.width = `${clamp(renderState.right?.morale ?? 0, 0, 100)}%`;
      }
      battleFormationViewState.lastCommittedRenderState = renderState;
    }

    function normalizeFormationPreviewTroopType(value) {
      const troopType = String(value || '').trim();
      if (troopType === 'spearman') return 'spear';
      if (troopType === 'gunpowder' || troopType === 'teppo') return 'musketeer';
      if (troopType === 'light-cavalry' || troopType === 'heavy-cavalry') return 'cavalry';
      if (troopType && TROOP_TYPES[troopType]) return troopType;
      return 'infantry';
    }

    function normalizeFormationPreviewMember(definition, index) {
      const slotKey = String(definition?.slotKey || '').trim();
      if (!FORMATION_SLOT_KEYS.includes(slotKey)) {
        return null;
      }
      const troopType = normalizeFormationPreviewTroopType(
        definition?.troopType || definition?.role
      );
      const base = TROOP_TYPES[troopType] || TROOP_TYPES.infantry;
      const soldiers = Math.max(1, Math.round(Number(definition?.soldiers) || 100));
      const maxSoldiers = Math.max(
        soldiers,
        Math.round(Number(definition?.maxSoldiers) || soldiers)
      );
      return {
        id: String(definition?.id || `preview-member-${index}`),
        slotKey,
        troopType,
        name: String(definition?.name || base.label),
        soldiers,
        maxSoldiers,
        attack: base.attack,
        defense: base.defense,
        speed: base.speed,
        range: base.range,
        status: 'normal',
      };
    }

    function createFormationPreviewSnapshot(config = {}) {
      const members = Array.isArray(config.members)
        ? config.members
            .map((member, index) => normalizeFormationPreviewMember(member, index))
            .filter(Boolean)
        : [];
      const soldiers = members.reduce((total, member) => total + (member?.soldiers || 0), 0);
      const maxSoldiers = members.reduce(
        (total, member) => total + (member?.maxSoldiers || 0),
        0
      );
      return {
        id: String(config.id || 'preview.player'),
        name: String(config.name || '编队预览'),
        side: config.side === 'enemy' ? 'enemy' : 'player',
        generalName: String(config.generalName || ''),
        morale: clamp(Number(config.morale) || 0, 0, 100),
        soldiers,
        maxSoldiers,
        formationMembers: members,
      };
    }

    function createEmptyFormationPreviewSnapshot(side = 'enemy') {
      return {
        id: `preview-empty-${side}`,
        name: '',
        side,
        generalName: '',
        morale: 0,
        soldiers: 0,
        maxSoldiers: 0,
        formationMembers: [],
      };
    }

    function showFormationPreview(previewConfig = {}) {
      document.body.classList.add('preview-formation-only');
      ensureBattleFormationViews();
      const overlay = document.getElementById('formation-battle');
      if (overlay) {
        overlay.classList.remove('hidden');
      }

      const playerSnapshot = createFormationPreviewSnapshot(previewConfig);
      const enemySnapshot = createEmptyFormationPreviewSnapshot('enemy');
      const titleElement = document.getElementById('battle-attacker-title');
      if (titleElement) {
        titleElement.textContent = playerSnapshot.name || '编队预览';
      }

      battleFormationViewState.lastCommittedRenderState = null;
      commitBattleOverlayRenderState({
        left: buildBattleFormationSideState(playerSnapshot, playerSnapshot, {}),
        right: buildBattleFormationSideState(enemySnapshot, enemySnapshot, {}),
      });
      startBattleSpineIdleLoop();
    }

    function getBattleVisualGridId(report, timelineSide) {
      const leftKey = report.attackerBefore.side === 'player' ? 'attacker' : 'defender';
      return timelineSide === leftKey ? 'battle-attacker-grid' : 'battle-defender-grid';
    }

    function getBattleTimelineUnit(report, timelineSide) {
      return timelineSide === 'attacker' ? report.attackerBefore : report.defenderBefore;
    }

    function getBattleSlotAnchorPosition(slot, boxRect) {
      const slotRect = slot?.getBoundingClientRect();
      if (!slotRect || !boxRect) {
        return { x: 0, y: 0 };
      }
      return {
        x: slotRect.left - boxRect.left + slotRect.width / 2,
        y: slotRect.top - boxRect.top + slotRect.height,
      };
    }

    function getBattleDamageAnchorPosition(slot, layerRect) {
      const anchor = getBattleSlotAnchorPosition(slot, layerRect);
      return {
        x: anchor.x,
        y: anchor.y - 190,
      };
    }

    function createBattleSpineProxyFromSlot(sourceSlot, layer, layerRect, proxySide, troopType, stackOrder = 1000) {
      const proxyAnchor = document.createElement('div');
      const anchorPosition = getBattleSlotAnchorPosition(sourceSlot, layerRect);
      proxyAnchor.className = 'battle-spine-proxy-anchor';
      proxyAnchor.style.setProperty('--battle-proxy-x', `${anchorPosition.x}px`);
      proxyAnchor.style.setProperty('--battle-proxy-y', `${anchorPosition.y}px`);
      proxyAnchor.style.zIndex = String(stackOrder);

      const proxySlot = sourceSlot.cloneNode(true);
      proxySlot.classList.add('battle-spine-proxy-slot', proxySide);
      proxySlot.classList.remove('empty', 'fallen', 'striker', 'targeted', 'is-proxying');
      proxySlot.style.left = '0px';
      proxySlot.style.top = '0px';

      Array.from(proxySlot.children).forEach((child) => {
        if (!child.classList.contains('formation-spine-frame')) {
          child.remove();
        }
      });

      const proxyFrame = proxySlot.querySelector('.formation-spine-frame');
      const proxyCanvas = proxyFrame?.querySelector('.formation-spine-canvas');
      if (!proxyFrame || !proxyCanvas) {
        return null;
      }

      proxyCanvas.width = 0;
      proxyCanvas.height = 0;
      proxyCanvas.dataset.side = proxySide;
      proxyCanvas.dataset.action = 'idle';
      proxyCanvas.dataset.troopType = troopType;
      configureBattleSpineCanvasMetrics(proxyCanvas);

      proxySlot.dataset.proxySourceSlot = sourceSlot.dataset.slot || '';
      proxyAnchor.appendChild(proxySlot);
      layer.appendChild(proxyAnchor);

      return {
        anchor: proxyAnchor,
        slot: proxySlot,
        frame: proxyFrame,
        canvas: proxyCanvas,
        position: anchorPosition,
      };
    }

    async function playBattleSpineStrike(report, step, onImpact) {
      const troopType = step.sourceTroopType || 'infantry';
      const troopAsset = getBattleSpineTroopAsset(troopType);
      const renderer = await getBattleSpineRenderer(troopType);
      if (!renderer) {
        await sleep(380);
        onImpact?.();
        return;
      }
      const sourceGrid = document.getElementById(getBattleVisualGridId(report, step.sourceSide));
      const targetGrid = document.getElementById(getBattleVisualGridId(report, step.targetSide));
      const sourceSlot = sourceGrid?.querySelector(`.formation-slot[data-slot="${step.sourceSlotKey}"]`);
      const targetSlot = targetGrid?.querySelector(`.formation-slot[data-slot="${step.targetSlotKey}"]`);
      const sourceCanvas = sourceSlot?.querySelector('.formation-spine-canvas');
      const infantryAttackPlan = !troopAsset.stationaryAttack && troopType !== 'archer'
        ? getBattleMeleeAttackPlan(troopType, renderer)
        : null;
      const attackActionId = infantryAttackPlan?.attackAction || 'attack';
      const attackPeakFrame = infantryAttackPlan?.impactFrame
        ?? troopAsset.attackImpactFrame
        ?? (troopType === 'archer' ? 42 : 14);

      const sourceFrame = sourceSlot?.querySelector('.formation-spine-frame');
      const targetFrame = targetSlot?.querySelector('.formation-spine-frame');
      const box = document.querySelector('.formation-battle-box');
      if (!sourceCanvas || !sourceFrame || !targetFrame || !sourceGrid || !box) {
        await sleep(380);
        onImpact?.();
        return;
      }

      const layerRect = box.getBoundingClientRect();
      const sourceUnit = getBattleTimelineUnit(report, step.sourceSide);
      const proxySide = sourceUnit.side === 'enemy' ? 'enemy' : 'player';
      const sourceSlotZ = Number(sourceSlot.style.zIndex || 0);
      const targetSlotZ = Number(targetSlot?.style.zIndex || 0);
      const elevateProxyLayer = !troopAsset.stationaryAttack;
      const proxyLayer = elevateProxyLayer ? box : sourceGrid;
      const proxyLayerRect = elevateProxyLayer
        ? layerRect
        : sourceGrid.getBoundingClientRect();
      const proxyStackOrder = elevateProxyLayer
        ? 1000 + Math.max(sourceSlotZ, targetSlotZ) + 1
        : sourceSlotZ;
      const proxyView = createBattleSpineProxyFromSlot(
        sourceSlot,
        proxyLayer,
        proxyLayerRect,
        proxySide,
        troopType,
        proxyStackOrder,
      );
      if (!proxyView) {
        await sleep(380);
        onImpact?.();
        return;
      }
      const proxy = proxyView.canvas;
      const motionElement = proxyView.anchor;
      const initialLeft = proxyView.position.x;
      const initialTop = proxyView.position.y;
      const targetAnchor = getBattleSlotAnchorPosition(targetSlot, layerRect);
      const sourceAnchor = getBattleSlotAnchorPosition(sourceSlot, layerRect);

      sourceSlot.classList.add('is-proxying');
      proxyView.slot.classList.add('striker');

      const from = {
        x: initialLeft,
        y: initialTop,
      };
      const to = getBattleLandingTargetPosition(targetAnchor, troopAsset, proxySide);
      const jumpLandingSoundPlan = resolveBattleJumpLandingSoundPlan({
        troopType,
        variant: infantryAttackPlan?.variant || null,
      });
      const moveJumpLandingSoundPlan =
        jumpLandingSoundPlan && infantryAttackPlan?.moveAction ? jumpLandingSoundPlan : null;
      const attackJumpLandingSoundPlan =
        jumpLandingSoundPlan && !infantryAttackPlan?.moveAction ? jumpLandingSoundPlan : null;
      const moveJumpLandingAudioState = moveJumpLandingSoundPlan
        ? { jumpAudioTriggered: false, landingAudioTriggered: false }
        : null;
      const attackJumpLandingAudioState = attackJumpLandingSoundPlan
        ? { jumpAudioTriggered: false, landingAudioTriggered: false }
        : null;
      let cavalryRunAudioTriggered = false;
      const cavalryRunAudioChainId = troopType === 'cavalry' ? createBattleDemoCavalryAudioChainId(step) : null;
      let cavalryRunAudioPlayer = null;
      if (!troopAsset.stationaryAttack && infantryAttackPlan?.moveAction) {
        await animateBattleSpineProxy(
          proxy,
          renderer,
          from,
          to,
          infantryAttackPlan.moveAction,
          infantryAttackPlan.moveDurationMs,
          {
            moveStartFrame: infantryAttackPlan.moveStartFrame,
            moveEndFrame: infantryAttackPlan.moveEndFrame,
            arcHeight: infantryAttackPlan?.moveArcHeight ?? getBattleJumpArcHeight(from, to),
            onFrame: info => {
              if (troopType === 'cavalry' && !cavalryRunAudioTriggered && info.actionFrame >= 1) {
                cavalryRunAudioTriggered = true;
                if (battleConfig.embedded && battleConfig.scenarioId && cavalryRunAudioChainId) {
                  postBattleDemoAudioMessage({
                    chainId: cavalryRunAudioChainId,
                    phase: 'horse-run',
                    mode: 'play',
                    currentActionFrame: info.actionFrame,
                    frameDurationMs: info.frameDurationMs,
                  });
                } else {
                  cavalryRunAudioPlayer = playBattleMeleeCue('horseRun');
                }
              }
              triggerBattleJumpLandingCues(
                info,
                moveJumpLandingSoundPlan,
                moveJumpLandingAudioState,
              );
            },
          }
        );
        if (troopType === 'cavalry' && cavalryRunAudioTriggered) {
          const moveFrameDurationMs = 1000 / Math.max(1, renderer.fps || 60);
          if (battleConfig.embedded && battleConfig.scenarioId && cavalryRunAudioChainId) {
            postBattleDemoAudioMessage({
              chainId: cavalryRunAudioChainId,
              phase: 'horse-run',
              mode: 'stop',
              currentActionFrame: renderer.getActionFrameCount(infantryAttackPlan.moveAction),
              frameDurationMs: moveFrameDurationMs,
              fadeFrames: 4,
            });
          } else {
            fadeBattleAudioPlayer(cavalryRunAudioPlayer, moveFrameDurationMs, 4);
          }
        }
      } else if (!troopAsset.stationaryAttack && !infantryAttackPlan && troopType !== 'archer') {
        await animateBattleSpineProxy(
          proxy,
          renderer,
          from,
          to,
          'move',
          renderer.getActionDurationMs('move'),
          {
            moveStartFrame: 7,
            moveEndFrame: 23,
            arcHeight: getBattleJumpArcHeight(from, to),
          }
        );
      }
      const attackWhiteFlashStartFrame = infantryAttackPlan?.effectFrame
        ?? troopAsset.attackEffectFrame
        ?? Math.max(0, attackPeakFrame - 1);
      const attackFrom = infantryAttackPlan?.variant === 'jump_chop'
        ? from
        : (troopAsset.stationaryAttack ? from : to);
      const attackTo = infantryAttackPlan?.variant === 'jump_chop'
        ? to
        : attackFrom;
      const targetCanvas = targetSlot?.querySelector('.formation-spine-canvas');
      const meleeSoundPlan = resolveBattleMeleeSoundPlan({
        troopType,
        variant: infantryAttackPlan?.variant || null,
        hit: step.hit,
        randomValue: Math.random(),
      });
      let meleeSoundTriggered = false;
      const isMusketeerAudioTroop =
        troopType === 'musketeer' || troopType === 'gunpowder' || troopType === 'teppo';
      const archerAudioChainId =
        troopType === 'archer' ? createBattleDemoArcherAudioChainId(step) : null;
      const musketeerAudioChainId =
        isMusketeerAudioTroop ? createBattleDemoMusketeerAudioChainId(step) : null;
      let archerDrawAudioTriggered = false;
      let archerReleaseAudioTriggered = false;
      let archerImpactAudioTriggered = false;
      let musketeerReloadAudioTriggered = false;
      let musketeerFireAudioTriggered = false;
      await animateBattleSpineProxy(
        proxy,
        renderer,
        attackFrom,
        attackTo,
        attackActionId,
        infantryAttackPlan?.attackDurationMs || renderer.getActionDurationMs('attack'),
        {
          moveStartFrame: infantryAttackPlan?.attackMoveStartFrame,
          moveEndFrame: infantryAttackPlan?.attackMoveEndFrame,
          arcHeight: infantryAttackPlan?.variant === 'jump_chop'
            ? getBattleJumpArcHeight(from, to)
            : 0,
          impactFrame: attackPeakFrame,
          onFrame: info => {
            if (troopType === 'archer') {
              if (!archerDrawAudioTriggered && info.actionFrame >= 18) {
                archerDrawAudioTriggered = true;
                postBattleDemoAudioMessage({
                  chainId: archerAudioChainId,
                  phase: 'draw',
                  mode: 'play',
                  currentActionFrame: info.actionFrame,
                  frameDurationMs: info.frameDurationMs,
                });
              }
              if (!archerReleaseAudioTriggered && info.actionFrame >= 37) {
                archerReleaseAudioTriggered = true;
                postBattleDemoAudioMessage({
                  chainId: archerAudioChainId,
                  phase: 'release',
                  mode: 'transition',
                  currentActionFrame: info.actionFrame,
                  frameDurationMs: info.frameDurationMs,
                  fadeFrames: 4,
                  nextStartFrame: 41,
                });
              }
              if (step.hit && !archerImpactAudioTriggered && info.actionFrame >= 41) {
                archerImpactAudioTriggered = true;
                postBattleDemoAudioMessage({
                  chainId: archerAudioChainId,
                  phase: 'impact',
                  mode: 'transition',
                  currentActionFrame: info.actionFrame,
                  frameDurationMs: info.frameDurationMs,
                  fadeFrames: 4,
                  nextStartFrame: 42,
                });
              }
              if (!proxy.__battleArcherEffectsQueued) {
                proxy.__battleArcherEffectsQueued = 'true';
                queueBattleArcherAttackEffects({
                  sourceSlot,
                  sourceSide: proxySide,
                  sourceAnchor,
                  targetAnchor,
                  targetSlot,
                  hit: step.hit,
                  startAt: info.startAt,
                  frameDurationMs: info.frameDurationMs,
                });
              }
            }
            if (isMusketeerAudioTroop) {
              if (!musketeerReloadAudioTriggered && info.actionFrame >= 9) {
                musketeerReloadAudioTriggered = true;
                postBattleDemoAudioMessage({
                  chainId: musketeerAudioChainId,
                  phase: 'reload',
                  mode: 'play',
                  currentActionFrame: info.actionFrame,
                  frameDurationMs: info.frameDurationMs,
                });
              }
              if (!musketeerFireAudioTriggered && info.actionFrame >= 26) {
                musketeerFireAudioTriggered = true;
                postBattleDemoAudioMessage({
                  chainId: musketeerAudioChainId,
                  phase: 'fire',
                  mode: 'transition',
                  currentActionFrame: info.actionFrame,
                  frameDurationMs: info.frameDurationMs,
                  fadeFrames: 3,
                  nextStartFrame: 29,
                });
              }
            }
            triggerBattleJumpLandingCues(
              info,
              attackJumpLandingSoundPlan,
              attackJumpLandingAudioState,
            );
            if (
              meleeSoundPlan &&
              !meleeSoundTriggered &&
              info.actionFrame >= meleeSoundPlan.triggerFrame
            ) {
              meleeSoundTriggered = true;
              playBattleMeleeCue(meleeSoundPlan.cueId);
            }
          },
          onImpact: info => {
            onImpact?.();
            if (step.hit) {
              queueBattleModelShake(targetSlot, info?.peakAt, info?.frameDurationMs);
            }
          },
          effectFrame: step.hit ? attackWhiteFlashStartFrame : null,
          onEffect: step.hit
            ? info => {
                syncBattleWhiteFlashOverlayCanvas(targetCanvas);
                queueBattleWhiteFlash(targetSlot, info?.peakAt, info?.frameDurationMs);
              }
            : null,
        }
      );

      sourceSlot.classList.remove('is-proxying');
      motionElement.remove();
    }

    function getBattleFrameEffectAlphaAtFrame(frame, effectFrame, fadeInFrames = 2, holdFrames = 1, fadeOutFrames = 4) {
      if (!Number.isFinite(frame) || !Number.isFinite(effectFrame)) return 0;
      const fadeInStart = effectFrame - Math.max(0, fadeInFrames);
      if (frame < fadeInStart) return 0;
      if (frame < effectFrame) {
        return Math.max(0, Math.min(1, (frame - fadeInStart) / Math.max(1, fadeInFrames)));
      }
      const holdEnd = effectFrame + Math.max(0, holdFrames);
      if (frame < holdEnd) return 1;
      const fadeOutEnd = holdEnd + Math.max(0, fadeOutFrames);
      if (frame < fadeOutEnd) {
        return Math.max(0, Math.min(1, 1 - ((frame - holdEnd) / Math.max(1, fadeOutFrames))));
      }
      return 0;
    }

    function getBattleDirectionalOffset(sourceAnchor, targetAnchor, distance = 20) {
      const dx = (targetAnchor?.x || 0) - (sourceAnchor?.x || 0);
      const dy = (targetAnchor?.y || 0) - (sourceAnchor?.y || 0);
      const length = Math.hypot(dx, dy);
      if (length <= 0.001) {
        return { x: distance, y: 0 };
      }
      const ratio = distance / length;
      return {
        x: dx * ratio,
        y: dy * ratio,
      };
    }

    function getBattleArcherLaunchAnchorPosition(sourceSlot, layerRect, sourceSide, targetAnchor, forwardOffset = 50, upOffset = 70) {
      const frame = sourceSlot?.querySelector('.formation-spine-frame');
      const rect = frame?.getBoundingClientRect?.() || sourceSlot?.getBoundingClientRect?.();
      if (!rect || !layerRect) return { x: 0, y: 0 };
      const localXRatioBySide = BATTLE_ARCHER_LAUNCH_ANCHOR_PRESET?.localXBySide || {};
      const localXRatio = Number(localXRatioBySide[sourceSide]);
      const normalizedLocalX = Number.isFinite(localXRatio) ? localXRatio : 0.5;
      const upperBodyAnchor = {
        x: rect.left - layerRect.left + rect.width * normalizedLocalX,
        y: rect.top - layerRect.top + rect.height * 0.35,
      };
      const forward = getBattleDirectionalOffset(upperBodyAnchor, targetAnchor, forwardOffset);
      const sideAdjustXBySide = BATTLE_ARCHER_LAUNCH_ANCHOR_PRESET?.launchForwardAdjustBySide || {};
      const sideAdjustX = Number(sideAdjustXBySide[sourceSide]) || 0;
      const sideForward = getBattleDirectionalOffset(upperBodyAnchor, targetAnchor, sideAdjustX);
      return {
        x: upperBodyAnchor.x + forward.x + sideForward.x,
        y: upperBodyAnchor.y + sideForward.y - upOffset,
      };
    }

    function getBattleArcherNominalSlotAnchorPosition(slot, layerRect, sourceSide) {
      const frame = slot?.querySelector('.formation-spine-frame');
      const rect = frame?.getBoundingClientRect?.() || slot?.getBoundingClientRect?.();
      if (!rect || !layerRect) return { x: 0, y: 0 };
      const localXRatioBySide = BATTLE_ARCHER_LAUNCH_ANCHOR_PRESET?.localXBySide || {};
      const localXRatio = Number(localXRatioBySide[sourceSide]);
      const normalizedLocalX = Number.isFinite(localXRatio) ? localXRatio : 0.5;
      return {
        x: rect.left - layerRect.left + rect.width * normalizedLocalX,
        y: rect.top - layerRect.top + rect.height * 0.35,
      };
    }

    function getBattlePairedSourceLaneSlot(sourceSlot, targetSlot) {
      const sourceGrid = sourceSlot?.closest('.formation-grid');
      const pairedSlotKey = targetSlot?.dataset?.slot || '';
      if (sourceGrid && pairedSlotKey) {
        const paired = sourceGrid.querySelector(`.formation-slot[data-slot="${pairedSlotKey}"]`);
        if (paired) return paired;
      }
      return sourceSlot;
    }

    function projectPointToBattleFixedAngleLine(point, anchor, sourceSide, angleDeg = 60) {
      const radians = (sourceSide === 'enemy' ? 180 - angleDeg : angleDeg) * Math.PI / 180;
      const dirX = Math.cos(radians);
      const dirY = Math.sin(radians);
      const dx = (point?.x || 0) - (anchor?.x || 0);
      const dy = (point?.y || 0) - (anchor?.y || 0);
      const t = dx * dirX + dy * dirY;
      return {
        x: (anchor?.x || 0) + dirX * t,
        y: (anchor?.y || 0) + dirY * t,
      };
    }

    function getBattleArcherLineStartPosition(sourceSlot, targetSlot, layerRect, sourceSide, impactAnchor, angleDeg = 60) {
      const pairedSourceSlot = getBattlePairedSourceLaneSlot(sourceSlot, targetSlot);
      const nominalAnchor = getBattleArcherNominalSlotAnchorPosition(pairedSourceSlot, layerRect, sourceSide);
      return projectPointToBattleFixedAngleLine(nominalAnchor, impactAnchor, sourceSide, angleDeg);
    }

    function getBattleArcherRemoteReservedAttackEffectPlan(hit = false) {
      const plan = [
        { kind: 'trail', frame: 41, fadeInFrames: 2, holdFrames: 2, fadeOutFrames: 8 },
        { kind: 'arrow', frame: 41, fadeInFrames: 2, holdFrames: 0, fadeOutFrames: 2 },
      ];
      if (hit) {
        plan.push(
          { kind: 'flight', frame: 41, fadeInFrames: 0, holdFrames: 1, fadeOutFrames: 0, motionStartFrame: 41, motionEndFrame: 42 },
          { kind: 'stage1', frame: 42, fadeInFrames: 0, holdFrames: 2, fadeOutFrames: 0 },
          { kind: 'stage2', frame: 44, fadeInFrames: 0, holdFrames: 2, fadeOutFrames: 2 },
        );
        return plan;
      }
      plan.push(
        { kind: 'flight', frame: 41, fadeInFrames: 0, holdFrames: 2, fadeOutFrames: 1, motionStartFrame: 41, motionEndFrame: 43 },
      );
      return plan;
    }

    function getBattleArcherActiveAttackEffectPlan(hit = false) {
      const trail = BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.trail;
      const arrow = BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.arrow;
      const plan = [
        {
          kind: 'trail',
          frame: arrow.startFrame,
          fadeInFrames: trail.fadeInFrames,
          holdFrames: trail.holdFrames,
          fadeOutFrames: trail.fadeOutFrames,
          motionStartFrame: arrow.startFrame,
          motionEndFrame: arrow.startFrame + trail.holdFrames + trail.fadeOutFrames,
        },
        {
          kind: 'arrow-out',
          frame: arrow.startFrame,
          fadeInFrames: arrow.fadeInFrames,
          holdFrames: Math.max(0, arrow.vanishFrame - arrow.startFrame),
          fadeOutFrames: arrow.fadeOutFrames,
          motionStartFrame: arrow.startFrame,
          motionEndFrame: arrow.vanishFrame,
        },
        {
          kind: 'arrow-in',
          frame: arrow.reappearFrame,
          fadeInFrames: arrow.fadeInFrames,
          holdFrames: Math.max(0, arrow.impactFrame - arrow.reappearFrame),
          fadeOutFrames: arrow.fadeOutFrames,
          motionStartFrame: arrow.reappearFrame,
          motionEndFrame: arrow.impactFrame,
        },
      ];
      if (!hit) {
        plan.push({
          kind: 'arrow-miss-tail',
          frame: arrow.impactFrame,
          fadeInFrames: 0,
          holdFrames: 0,
          fadeOutFrames: 0,
          motionStartFrame: arrow.impactFrame,
          motionEndFrame: arrow.impactFrame + 1,
        });
        return plan;
      }
      plan.push(
        {
          kind: 'stage1',
          frame: BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage1.frame,
          fadeInFrames: 0,
          holdFrames: BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage1.holdFrames,
          fadeOutFrames: BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage1.fadeOutFrames,
        },
        {
          kind: 'stage2',
          frame: BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage2.frame,
          fadeInFrames: 0,
          holdFrames: BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage2.holdFrames,
          fadeOutFrames: BATTLE_ARCHER_REMOTE_ACTIVE_EFFECTS.stage2.fadeOutFrames,
        },
      );
      return plan;
    }

    function getBattleImpactEffectAnchorPosition(slot, layerRect) {
      const frame = slot?.querySelector('.formation-spine-frame');
      const rect = frame?.getBoundingClientRect?.() || slot?.getBoundingClientRect?.();
      if (!rect || !layerRect) return { x: 0, y: 0 };
      return {
        x: rect.left - layerRect.left + rect.width / 2,
        y: rect.top - layerRect.top + rect.height * 0.46,
      };
    }

    function getBattleDirectionAngleDeg(sourceAnchor, targetAnchor) {
      return Math.atan2((targetAnchor?.y || 0) - (sourceAnchor?.y || 0), (targetAnchor?.x || 0) - (sourceAnchor?.x || 0)) * 180 / Math.PI;
    }

    function getBattleArcherSideDirection(sourceSide) {
      return sourceSide === 'enemy' ? -1 : 1;
    }

    function getBattleArcherTrailRotationDeg(sourceSide, baseAngleDeg = 0) {
      const rotationOffsetDegBySide = BATTLE_ARCHER_REMOTE_RESERVED_EFFECTS?.trail?.rotationOffsetDegBySide || {};
      const rotationOffset = Number(rotationOffsetDegBySide[sourceSide]) || 0;
      return baseAngleDeg + rotationOffset;
    }

    function getBattleArcherScreenEntryStartPosition(targetPosition, layerRect, sourceSide = 'player', angleDeg = 20, padding = 180) {
      const endX = Number(targetPosition?.x) || 0;
      const endY = Number(targetPosition?.y) || 0;
      const mirroredAngleDeg = sourceSide === 'enemy'
        ? 180 - angleDeg
        : angleDeg;
      const radians = mirroredAngleDeg * Math.PI / 180;
      const directionX = Math.cos(radians);
      const directionY = Math.sin(radians);
      const distances = [];
      if (directionX > 1e-6) {
        distances.push((endX + padding) / directionX);
      }
      if (directionY > 1e-6) {
        distances.push((endY + padding) / directionY);
      }
      const fallbackDistance = Math.max(
        Number(layerRect?.width) || 0,
        Number(layerRect?.height) || 0,
        padding * 2,
      );
      const travelDistance = Math.max(
        fallbackDistance,
        ...distances.filter(distance => Number.isFinite(distance) && distance > 0),
      );
      return {
        x: endX - directionX * travelDistance,
        y: endY - directionY * travelDistance,
      };
    }

    function getBattleArcherArrowEffectMotion(sourceSide, startPosition, layerRect, speedPxPerFrame = 120, padding = 200) {
      const travelAngleDeg = sourceSide === 'enemy' ? 200 : -20;
      const rotationDeg = travelAngleDeg - 180;
      const radians = travelAngleDeg * Math.PI / 180;
      const directionX = Math.cos(radians);
      const directionY = Math.sin(radians);
      const startX = Number(startPosition?.x) || 0;
      const startY = Number(startPosition?.y) || 0;
      const width = Number(layerRect?.width) || 0;
      const height = Number(layerRect?.height) || 0;
      const positiveDistances = [];
      if (Math.abs(directionX) > 1e-6) {
        positiveDistances.push((((directionX >= 0 ? width + padding : -padding) - startX) / directionX));
      }
      if (Math.abs(directionY) > 1e-6) {
        positiveDistances.push((((directionY >= 0 ? height + padding : -padding) - startY) / directionY));
      }
      const travelDistance = Math.max(
        padding,
        Math.min(...positiveDistances.filter(distance => Number.isFinite(distance) && distance > 0)),
      );
      return {
        rotationDeg,
        motionX: directionX * travelDistance,
        motionY: directionY * travelDistance,
        holdFrames: Math.max(1, Math.ceil(travelDistance / Math.max(1, Number(speedPxPerFrame) || 1))),
      };
    }

    function createBattleTimedImageEffectAnchor() {
      const anchor = document.createElement('div');
      anchor.className = 'battle-impact-effect-anchor';
      const image = document.createElement('img');
      image.className = 'battle-impact-effect-image';
      image.alt = '';
      anchor.appendChild(image);
      anchor.__battleEffectImage = image;
      return anchor;
    }

    function acquireBattleTimedImageEffectAnchor() {
      return battleTimedImageEffectPool.pop() || createBattleTimedImageEffectAnchor();
    }

    function releaseBattleTimedImageEffectAnchor(anchor) {
      if (!(anchor instanceof HTMLElement)) return;
      if (anchor.__battleEffectRaf) {
        window.cancelAnimationFrame(anchor.__battleEffectRaf);
        delete anchor.__battleEffectRaf;
      }
      battleTimedImageEffectAnchors.delete(anchor);
      anchor.remove();
      anchor.style.left = '';
      anchor.style.top = '';
      const image = anchor.__battleEffectImage || anchor.querySelector('.battle-impact-effect-image');
      if (image instanceof HTMLElement) {
        image.removeAttribute('src');
        image.style.opacity = '0';
        image.style.removeProperty('--battle-impact-effect-width');
        image.style.removeProperty('--battle-impact-effect-rotation');
        image.style.removeProperty('--battle-impact-effect-filter');
        image.style.removeProperty('--battle-impact-effect-scale');
        image.style.removeProperty('--battle-impact-effect-transform-origin');
        image.style.removeProperty('--battle-impact-effect-translate-x');
        image.style.removeProperty('--battle-impact-effect-translate-y');
      }
      if (battleTimedImageEffectPool.length < BATTLE_TIMED_IMAGE_EFFECT_POOL_LIMIT) {
        battleTimedImageEffectPool.push(anchor);
      }
    }

    function clearBattleTimedImageEffects() {
      Array.from(battleTimedImageEffectAnchors).forEach(releaseBattleTimedImageEffectAnchor);
    }

    function queueBattleTimedImageEffect({
      layer,
      imageSrc,
      position,
      rotationDeg = 0,
      width = 120,
      filter = 'none',
      motionX = 0,
      motionY = 0,
      startScale = 1,
      endScale = 1,
