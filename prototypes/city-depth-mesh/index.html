<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Depth Mesh</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1110;
        --panel: #18201c;
        --panel-2: #222b25;
        --text: #eef4ef;
        --muted: #9daf9f;
        --line: #354338;
        --accent: #79d67a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        min-height: 100vh;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          #070a08;
        background-size: 34px 34px;
      }

      #meshCanvas {
        display: block;
        width: 100%;
        height: 100vh;
        cursor: grab;
      }

      #meshCanvas.is-dragging {
        cursor: grabbing;
      }

      .hud {
        position: absolute;
        left: 18px;
        top: 18px;
        display: grid;
        gap: 5px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        background: rgba(8, 12, 10, 0.72);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        backdrop-filter: blur(8px);
      }

      .hud strong {
        color: var(--text);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        min-height: 100vh;
        max-height: 100vh;
        padding: 20px;
        border-left: 1px solid var(--line);
        background: var(--panel);
        scrollbar-color: var(--accent) rgba(255, 255, 255, 0.08);
      }

      .sidebar::-webkit-scrollbar {
        width: 10px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.08);
      }

      .sidebar::-webkit-scrollbar-thumb {
        border: 2px solid var(--panel);
        border-radius: 999px;
        background: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .note,
      .stats {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .controls {
        display: grid;
        gap: 13px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      .row,
      .checkbox-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .checkbox-row {
        min-height: 32px;
      }

      output {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      input[type="file"],
      input[type="number"],
      select {
        width: 100%;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px 8px;
        background: #0d1411;
        color: var(--text);
        font: inherit;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(8, 12, 10, 0.42);
      }

      .segmented label {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 34px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 5px;
        color: var(--muted);
        text-align: center;
        cursor: pointer;
      }

      .segmented input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .segmented label:has(input:checked) {
        border-color: var(--accent);
        background: var(--panel-2);
        color: var(--text);
      }

      button {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .button-row--triple {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .panel {
        display: grid;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(34, 43, 37, 0.72);
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .asset-readout {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-line;
      }

      .source-readout {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .preview-tile {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
      }

      .preview-tile canvas {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px;
        background: #0b100d;
      }

      .stats {
        margin-top: auto;
        white-space: pre-line;
      }

      @media (max-width: 920px) {
        body {
          overflow: auto;
        }

        .app {
          grid-template-columns: 1fr;
        }

        #meshCanvas {
          height: 65vh;
        }

        .sidebar {
          min-height: auto;
          max-height: none;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <canvas id="meshCanvas" aria-label="City depth mesh viewer"></canvas>
        <div class="hud">
          <strong>City Depth Mesh</strong>
          <span id="hudStatus">Loading city.png and city_depth.png...</span>
          <span>Drag: rotate / Wheel: zoom</span>
        </div>
      </section>

      <aside class="sidebar">
        <div>
          <h1>城市深度建模</h1>
          <p class="note">使用根目录 city.png 作为城市贴图，city_depth.png 作为高度图生成可旋转的 mesh。</p>
        </div>

        <section class="panel">
          <div class="panel-title">
            <span>Asset source</span>
            <span id="sourceStatus">default</span>
          </div>
          <label>
            <span>Folder images</span>
            <input id="assetFolder" type="file" accept="image/*" webkitdirectory multiple />
          </label>
          <label>
            <span>Texture image</span>
            <select id="textureSelect">
              <option value="">Default ../../city.png</option>
            </select>
          </label>
          <label>
            <span>Depth image</span>
            <select id="depthSelect">
              <option value="">Default ../../city_depth.png</option>
            </select>
          </label>
          <button id="loadSelectedAssets" type="button">Load selected assets</button>
          <p class="source-readout" id="sourceReadout">texture: city.png / depth: city_depth.png</p>
        </section>

        <section class="panel">
          <div class="preview-grid">
            <div class="preview-tile">
              <span>城市贴图</span>
              <canvas id="texturePreview" width="160" height="160"></canvas>
            </div>
            <div class="preview-tile">
              <span>城市深度</span>
              <canvas id="depthPreview" width="160" height="160"></canvas>
            </div>
          </div>
        </section>

        <div class="controls">
          <div class="segmented" role="radiogroup" aria-label="建模方法">
            <label>
              <input type="radio" name="meshMode" value="heightfield" checked />
              <span>整图高度场</span>
            </label>
            <label>
              <input type="radio" name="meshMode" value="white-mask" />
              <span>白底去背主体</span>
            </label>
          </div>

          <label>
            <span class="row">采样步长 <output id="sampleStepValue">8</output></span>
            <input id="sampleStep" type="range" min="1" max="18" step="1" value="8" />
          </label>

          <label>
            <span class="row">白底容差 <output id="whiteToleranceValue">8</output></span>
            <input id="whiteTolerance" type="range" min="0" max="40" step="1" value="8" />
          </label>

          <label>
            <span class="row">黑场空气阈值 <output id="blackAirValue">10</output></span>
            <input id="blackAir" type="range" min="0" max="120" step="1" value="10" />
          </label>

          <label>
            <span class="row">高度强度 <output id="heightScaleValue">0.42</output></span>
            <input id="heightScale" type="number" step="0.01" value="0.42" />
          </label>

          <label>
            <span class="row">深度对比 <output id="depthContrastValue">1.20</output></span>
            <input id="depthContrast" type="range" min="0.2" max="3" step="0.01" value="1.2" />
          </label>

          <label>
            <span class="row">平滑次数 <output id="smoothPassesValue">2</output></span>
            <input id="smoothPasses" type="range" min="0" max="8" step="1" value="2" />
          </label>

          <label>
            <span class="row">断面阈值 <output id="depthGapValue">0.18</output></span>
            <input id="depthGap" type="range" min="0.02" max="1" step="0.01" value="0.18" />
          </label>

          <label>
            <span class="row">贴图细节 <output id="textureDetailValue">1.15</output></span>
            <input id="textureDetail" type="range" min="0.4" max="1.8" step="0.01" value="1.15" />
          </label>

          <label>
            <span class="row">面透明度 <output id="surfaceAlphaValue">1.00</output></span>
            <input id="surfaceAlpha" type="range" min="0.05" max="1" step="0.01" value="1" />
          </label>

          <label>
            <span class="row">线透明度 <output id="lineAlphaValue">0.42</output></span>
            <input id="lineAlpha" type="range" min="0" max="1" step="0.01" value="0.42" />
          </label>

          <label>
            <span class="row">点大小 <output id="pointSizeValue">3</output></span>
            <input id="pointSize" type="range" min="1" max="12" step="1" value="3" />
          </label>

          <label>
            <span class="row">环境光 <output id="ambientValue">0.58</output></span>
            <input id="ambient" type="range" min="0" max="1" step="0.01" value="0.58" />
          </label>

          <label>
            <span class="row">视角缩放 <output id="zoomValue">1.05</output></span>
            <input id="zoom" type="range" min="0.45" max="2.8" step="0.01" value="1.05" />
          </label>

          <label class="checkbox-row">
            <span>显示三角面</span>
            <input id="showSurface" type="checkbox" checked />
          </label>

          <label class="checkbox-row">
            <span>显示线框</span>
            <input id="showWire" type="checkbox" />
          </label>

          <label class="checkbox-row">
            <span>显示点云</span>
            <input id="showPoints" type="checkbox" />
          </label>

          <label class="checkbox-row">
            <span>浮空细节层</span>
            <input id="showFloatingLeaves" type="checkbox" />
          </label>

          <label>
            <span class="row">细节步长 <output id="leafStepValue">5</output></span>
            <input id="leafStep" type="range" min="1" max="18" step="1" value="5" />
          </label>

          <label>
            <span class="row">细节浮高 <output id="leafLiftValue">0.08</output></span>
            <input id="leafLift" type="range" min="0" max="0.5" step="0.01" value="0.08" />
          </label>

          <label>
            <span class="row">细节大小 <output id="leafSizeValue">0.025</output></span>
            <input id="leafSize" type="range" min="0.005" max="0.12" step="0.001" value="0.025" />
          </label>

          <label>
            <span class="row">绿色阈值 <output id="greenThresholdValue">0.06</output></span>
            <input id="greenThreshold" type="range" min="0" max="0.35" step="0.01" value="0.06" />
          </label>

          <label class="checkbox-row">
            <span>反转深度</span>
            <input id="invertDepth" type="checkbox" />
          </label>

          <label class="checkbox-row">
            <span>自动旋转</span>
            <input id="autoRotate" type="checkbox" checked />
          </label>

          <section class="panel">
            <div class="panel-title">
              <span>Asset export</span>
              <span id="assetSummary">pending</span>
            </div>

            <label>
              <span class="row">Decimation <output id="exportReductionValue">3x</output></span>
              <input id="exportReduction" type="range" min="1" max="12" step="1" value="3" />
            </label>

            <label>
              <span class="row">Min tri area <output id="exportMinAreaValue">0.000002</output></span>
              <input id="exportMinArea" type="range" min="0" max="0.01" step="0.00001" value="0.000002" />
            </label>

            <label>
              <span class="row">Planar tolerance <output id="planarToleranceValue">0.010</output></span>
              <input id="planarTolerance" type="range" min="0" max="1" step="0.005" value="0.01" />
            </label>

            <label>
              <span class="row">Air fill ratio <output id="airFillRatioValue">0.35</output></span>
              <input id="airFillRatio" type="range" min="0" max="0.9" step="0.01" value="0.35" />
            </label>

            <label>
              <span class="row">Merge rounds <output id="mergeRoundsValue">2</output></span>
              <input id="mergeRounds" type="range" min="1" max="5" step="1" value="2" />
            </label>

            <label class="checkbox-row">
              <span>Preview export mesh</span>
              <input id="previewExportMesh" type="checkbox" />
            </label>

            <div class="button-row button-row--triple">
              <button id="exportObj" type="button">Export OBJ</button>
              <button id="exportJson" type="button">Export JSON</button>
              <button id="exportReport" type="button">Report</button>
            </div>

            <p class="asset-readout" id="assetReadout">Waiting for mesh...</p>
          </section>

          <div class="button-row">
            <button id="rebuild" type="button">重建 mesh</button>
            <button id="resetView" type="button">重置视角</button>
          </div>
        </div>

        <p class="stats" id="stats">等待资源...</p>
      </aside>
    </main>

    <script type="module">
      const DEFAULT_TEXTURE_PATH = "../../city.png";
      const DEFAULT_DEPTH_PATH = "../../city_depth.png";
      const canvas = document.querySelector("#meshCanvas");
      const hudStatus = document.querySelector("#hudStatus");
      const stats = document.querySelector("#stats");
      const sourceStatus = document.querySelector("#sourceStatus");
      const sourceReadout = document.querySelector("#sourceReadout");
      const assetSummary = document.querySelector("#assetSummary");
      const assetReadout = document.querySelector("#assetReadout");
      const texturePreview = document.querySelector("#texturePreview");
      const depthPreview = document.querySelector("#depthPreview");
      const texturePreviewContext = texturePreview.getContext("2d");
      const depthPreviewContext = depthPreview.getContext("2d");
      const controls = {
        assetFolder: document.querySelector("#assetFolder"),
        textureSelect: document.querySelector("#textureSelect"),
        depthSelect: document.querySelector("#depthSelect"),
        loadSelectedAssets: document.querySelector("#loadSelectedAssets"),
        meshMode: Array.from(document.querySelectorAll("input[name='meshMode']")),
        sampleStep: document.querySelector("#sampleStep"),
        whiteTolerance: document.querySelector("#whiteTolerance"),
        blackAir: document.querySelector("#blackAir"),
        heightScale: document.querySelector("#heightScale"),
        depthContrast: document.querySelector("#depthContrast"),
        smoothPasses: document.querySelector("#smoothPasses"),
        depthGap: document.querySelector("#depthGap"),
        textureDetail: document.querySelector("#textureDetail"),
        surfaceAlpha: document.querySelector("#surfaceAlpha"),
        lineAlpha: document.querySelector("#lineAlpha"),
        pointSize: document.querySelector("#pointSize"),
        ambient: document.querySelector("#ambient"),
        zoom: document.querySelector("#zoom"),
        showSurface: document.querySelector("#showSurface"),
        showWire: document.querySelector("#showWire"),
        showPoints: document.querySelector("#showPoints"),
        showFloatingLeaves: document.querySelector("#showFloatingLeaves"),
        leafStep: document.querySelector("#leafStep"),
        leafLift: document.querySelector("#leafLift"),
        leafSize: document.querySelector("#leafSize"),
        greenThreshold: document.querySelector("#greenThreshold"),
        invertDepth: document.querySelector("#invertDepth"),
        autoRotate: document.querySelector("#autoRotate"),
        exportReduction: document.querySelector("#exportReduction"),
        exportMinArea: document.querySelector("#exportMinArea"),
        planarTolerance: document.querySelector("#planarTolerance"),
        airFillRatio: document.querySelector("#airFillRatio"),
        mergeRounds: document.querySelector("#mergeRounds"),
        previewExportMesh: document.querySelector("#previewExportMesh"),
        exportObj: document.querySelector("#exportObj"),
        exportJson: document.querySelector("#exportJson"),
        exportReport: document.querySelector("#exportReport"),
        rebuild: document.querySelector("#rebuild"),
        resetView: document.querySelector("#resetView"),
      };
      const sourceState = {
        folderFiles: new Map(),
        objectUrls: [],
        textureName: "city.png",
        depthName: "city_depth.png",
        version: 0,
      };
      let textureImage = null;
      let depthImage = null;
      let textureData = null;
      let depthData = null;
      const outputs = {
        sampleStep: document.querySelector("#sampleStepValue"),
        whiteTolerance: document.querySelector("#whiteToleranceValue"),
        blackAir: document.querySelector("#blackAirValue"),
        heightScale: document.querySelector("#heightScaleValue"),
        depthContrast: document.querySelector("#depthContrastValue"),
        smoothPasses: document.querySelector("#smoothPassesValue"),
        depthGap: document.querySelector("#depthGapValue"),
        textureDetail: document.querySelector("#textureDetailValue"),
        surfaceAlpha: document.querySelector("#surfaceAlphaValue"),
        lineAlpha: document.querySelector("#lineAlphaValue"),
        pointSize: document.querySelector("#pointSizeValue"),
        ambient: document.querySelector("#ambientValue"),
        zoom: document.querySelector("#zoomValue"),
        leafStep: document.querySelector("#leafStepValue"),
        leafLift: document.querySelector("#leafLiftValue"),
        leafSize: document.querySelector("#leafSizeValue"),
        greenThreshold: document.querySelector("#greenThresholdValue"),
        exportReduction: document.querySelector("#exportReductionValue"),
        exportMinArea: document.querySelector("#exportMinAreaValue"),
        planarTolerance: document.querySelector("#planarToleranceValue"),
        airFillRatio: document.querySelector("#airFillRatioValue"),
        mergeRounds: document.querySelector("#mergeRoundsValue"),
      };

      const vertexShader = `
        precision mediump float;
        attribute vec3 aPosition;
        attribute vec3 aNormal;
        attribute vec2 aUv;
        uniform mat4 uMatrix;
        uniform float uPointSize;
        varying vec3 vNormal;
        varying vec2 vUv;

        void main() {
          gl_Position = uMatrix * vec4(aPosition, 1.0);
          gl_PointSize = uPointSize;
          vNormal = aNormal;
          vUv = aUv;
        }
      `;

      const fragmentShader = `
        precision mediump float;
        uniform sampler2D uTexture;
        uniform float uAlpha;
        uniform float uAmbient;
        uniform float uTextureDetail;
        uniform float uUseWireColor;
        uniform float uRenderPoints;
        varying vec3 vNormal;
        varying vec2 vUv;

        void main() {
          if (uRenderPoints > 0.5) {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            if (dot(p, p) > 1.0) {
              discard;
            }
          }

          vec4 tex = texture2D(uTexture, vUv);
          vec3 color = tex.rgb;
          if (uUseWireColor > 0.5) {
            color = vec3(0.76, 0.95, 0.72);
          } else {
            color = mix(vec3(dot(color, vec3(0.2126, 0.7152, 0.0722))), color, uTextureDetail);
          }
          vec3 lightDirection = normalize(vec3(-0.35, 0.62, 0.7));
          float lambert = max(dot(normalize(vNormal), lightDirection), 0.0);
          float shade = clamp(uAmbient + lambert * (1.0 - uAmbient + 0.32), 0.0, 1.35);
          gl_FragColor = vec4(color * shade, tex.a * uAlpha);
        }
      `;

      const state = {
        yaw: -0.58,
        pitch: 0.98,
        zoom: 1.05,
        dragging: false,
        lastPointer: { x: 0, y: 0 },
        vertexCount: 0,
        triangleIndexCount: 0,
        lineIndexCount: 0,
        leafVertexCount: 0,
        leafIndexCount: 0,
        currentMesh: null,
        exportMesh: null,
        meshBounds: {
          centerX: 0,
          centerY: 0,
          centerZ: 0,
          radius: 1.6,
        },
        texture: null,
        vertexBuffer: null,
        normalBuffer: null,
        uvBuffer: null,
        triangleIndexBuffer: null,
        lineIndexBuffer: null,
        exportVertexBuffer: null,
        exportNormalBuffer: null,
        exportUvBuffer: null,
        exportTriangleIndexBuffer: null,
        leafVertexBuffer: null,
        leafNormalBuffer: null,
        leafUvBuffer: null,
        leafIndexBuffer: null,
      };

      const gl = canvas.getContext("webgl", {
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
      });
      if (!gl) {
        throw new Error("WebGL is not available.");
      }

      const uintExtension = gl.getExtension("OES_element_index_uint");
      if (!uintExtension) {
        throw new Error("This browser cannot draw large index buffers.");
      }
      const maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);

      const program = createProgram(gl, vertexShader, fragmentShader);
      const locations = {
        position: gl.getAttribLocation(program, "aPosition"),
        normal: gl.getAttribLocation(program, "aNormal"),
        uv: gl.getAttribLocation(program, "aUv"),
        matrix: gl.getUniformLocation(program, "uMatrix"),
        texture: gl.getUniformLocation(program, "uTexture"),
        pointSize: gl.getUniformLocation(program, "uPointSize"),
        alpha: gl.getUniformLocation(program, "uAlpha"),
        ambient: gl.getUniformLocation(program, "uAmbient"),
        textureDetail: gl.getUniformLocation(program, "uTextureDetail"),
        useWireColor: gl.getUniformLocation(program, "uUseWireColor"),
        renderPoints: gl.getUniformLocation(program, "uRenderPoints"),
      };

      for (const [name, location] of Object.entries(locations)) {
        if (location == null || location === -1) {
          throw new Error(`Missing WebGL location: ${name}`);
        }
      }

      gl.useProgram(program);
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0.025, 0.035, 0.028, 1);

      canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        hudStatus.textContent = "WebGL context lost. Reload the page, or choose a smaller preview texture.";
      });

      await loadAssetPair({
        texture: { url: DEFAULT_TEXTURE_PATH, name: "city.png" },
        depth: { url: DEFAULT_DEPTH_PATH, name: "city_depth.png" },
        sourceLabel: "default",
      }).catch((error) => {
        sourceStatus.textContent = "default blocked";
        hudStatus.textContent = "Open through http://localhost:5173 or choose a folder below.";
        sourceReadout.textContent =
          `${error.message}\n` +
          "If the page URL starts with file://, start the dev server and open the localhost URL.";
        console.error(error);
      });
      updateOutputs();
      requestAnimationFrame(render);

      controls.assetFolder.addEventListener("change", () => {
        populateFolderAssetSelectors(Array.from(controls.assetFolder.files ?? []));
      });
      controls.textureSelect.addEventListener("change", updateSelectedAssetReadout);
      controls.depthSelect.addEventListener("change", updateSelectedAssetReadout);
      controls.loadSelectedAssets.addEventListener("click", () => {
        loadSelectedFolderAssets().catch((error) => {
          sourceStatus.textContent = "load failed";
          hudStatus.textContent = `Asset load failed: ${error.message}`;
          console.error(error);
        });
      });

      for (const key of ["heightScale", "depthContrast"]) {
        controls[key].addEventListener("input", () => {
          updateOutputs();
          rebuildMesh();
        });
      }

      for (const key of ["textureDetail", "surfaceAlpha", "lineAlpha", "pointSize", "ambient", "zoom"]) {
        controls[key].addEventListener("input", () => {
          if (key === "zoom") {
            state.zoom = Number.parseFloat(controls.zoom.value);
          }
          updateOutputs();
        });
      }

      for (const key of ["sampleStep", "smoothPasses", "depthGap", "leafStep", "leafLift", "leafSize", "greenThreshold"]) {
        controls[key].addEventListener("input", () => {
          updateOutputs();
          rebuildMesh();
        });
      }

      controls.whiteTolerance.addEventListener("input", () => {
        updateOutputs();
        rebuildMesh();
      });
      controls.blackAir.addEventListener("input", () => {
        updateOutputs();
        rebuildMesh();
      });
      for (const modeControl of controls.meshMode) {
        modeControl.addEventListener("change", rebuildMesh);
      }
      controls.invertDepth.addEventListener("change", rebuildMesh);
      controls.showFloatingLeaves.addEventListener("change", rebuildMesh);
      controls.exportReduction.addEventListener("input", () => {
        updateOutputs();
        updateExportMesh();
      });
      controls.exportMinArea.addEventListener("input", () => {
        updateOutputs();
        updateExportMesh();
      });
      controls.planarTolerance.addEventListener("input", () => {
        updateOutputs();
        updateExportMesh();
      });
      controls.airFillRatio.addEventListener("input", () => {
        updateOutputs();
        updateExportMesh();
      });
      controls.mergeRounds.addEventListener("input", () => {
        updateOutputs();
        updateExportMesh();
      });
      controls.previewExportMesh.addEventListener("change", updateExportMesh);
      controls.exportObj.addEventListener("click", () => {
        updateExportMesh();
        if (state.exportMesh != null) {
          downloadText(buildObjAsset(state.exportMesh), `${getExportBaseName()}-lowpoly.obj`, "text/plain");
        }
      });
      controls.exportJson.addEventListener("click", () => {
        updateExportMesh();
        if (state.exportMesh != null) {
          downloadText(buildJsonAsset(state.exportMesh), `${getExportBaseName()}-lowpoly.json`, "application/json");
        }
      });
      controls.exportReport.addEventListener("click", () => {
        updateExportMesh();
      });
      controls.rebuild.addEventListener("click", rebuildMesh);
      controls.resetView.addEventListener("click", () => {
        state.yaw = -0.58;
        state.pitch = 0.98;
        state.zoom = 1.05;
        controls.zoom.value = String(state.zoom);
        updateOutputs();
      });

      canvas.addEventListener("pointerdown", (event) => {
        state.dragging = true;
        state.lastPointer = { x: event.clientX, y: event.clientY };
        canvas.classList.add("is-dragging");
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!state.dragging) {
          return;
        }
        const dx = event.clientX - state.lastPointer.x;
        const dy = event.clientY - state.lastPointer.y;
        state.lastPointer = { x: event.clientX, y: event.clientY };
        state.yaw += dx * 0.006;
        state.pitch = clamp(state.pitch + dy * 0.005, 0.18, 1.35);
      });

      canvas.addEventListener("pointerup", (event) => {
        state.dragging = false;
        canvas.classList.remove("is-dragging");
        canvas.releasePointerCapture(event.pointerId);
      });

      canvas.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          state.zoom = clamp(state.zoom * (event.deltaY < 0 ? 1.07 : 1 / 1.07), 0.45, 2.8);
          controls.zoom.value = String(state.zoom.toFixed(2));
          updateOutputs();
        },
        { passive: false },
      );

      function populateFolderAssetSelectors(files) {
        revokeSourceObjectUrls();
        sourceState.folderFiles.clear();
        const imageFiles = files
          .filter((file) => /^image\//.test(file.type) || /\.(png|jpe?g|webp|bmp)$/i.test(file.name))
          .sort((left, right) => getFileLabel(left).localeCompare(getFileLabel(right)));

        for (const file of imageFiles) {
          sourceState.folderFiles.set(getFileLabel(file), file);
        }

        fillAssetSelect(controls.textureSelect, imageFiles, "Texture image");
        fillAssetSelect(controls.depthSelect, imageFiles, "Depth image");
        const guessedDepth = guessDepthFile(imageFiles);
        const guessedTexture = guessTextureFile(imageFiles, guessedDepth);
        if (guessedTexture != null) {
          controls.textureSelect.value = getFileLabel(guessedTexture);
        }
        if (guessedDepth != null) {
          controls.depthSelect.value = getFileLabel(guessedDepth);
        }

        sourceStatus.textContent = `${imageFiles.length} images`;
        sourceReadout.textContent =
          imageFiles.length === 0
            ? "No image files found in selected folder."
            : `texture: ${controls.textureSelect.value || "not selected"}\n` +
              `depth: ${controls.depthSelect.value || "not selected"}`;
      }

      function fillAssetSelect(select, files, placeholder) {
        select.textContent = "";
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = placeholder;
        select.appendChild(empty);
        for (const file of files) {
          const option = document.createElement("option");
          option.value = getFileLabel(file);
          option.textContent = getFileLabel(file);
          select.appendChild(option);
        }
      }

      function updateSelectedAssetReadout() {
        if (sourceState.folderFiles.size === 0) {
          return;
        }
        sourceReadout.textContent =
          `texture: ${controls.textureSelect.value || "not selected"}\n` +
          `depth: ${controls.depthSelect.value || "not selected"}`;
      }

      async function loadSelectedFolderAssets() {
        const textureFile = sourceState.folderFiles.get(controls.textureSelect.value);
        const depthFile = sourceState.folderFiles.get(controls.depthSelect.value);
        if (textureFile == null || depthFile == null) {
          throw new Error("Choose both a texture image and a depth image from the folder.");
        }

        revokeSourceObjectUrls();
        const textureUrl = URL.createObjectURL(textureFile);
        const depthUrl = URL.createObjectURL(depthFile);
        sourceState.objectUrls.push(textureUrl, depthUrl);
        await loadAssetPair({
          texture: { url: textureUrl, name: getFileLabel(textureFile) },
          depth: { url: depthUrl, name: getFileLabel(depthFile) },
          sourceLabel: "folder",
        });
      }

      async function loadAssetPair(input) {
        hudStatus.textContent = `Loading ${input.texture.name} and ${input.depth.name}...`;
        const [nextTextureImage, nextDepthImage] = await Promise.all([
          loadImage(input.texture.url),
          loadImage(input.depth.url),
        ]);
        textureImage = nextTextureImage;
        depthImage = nextDepthImage;
        try {
          textureData = imageDataFrom(textureImage);
          depthData = imageDataFrom(depthImage);
        } catch (error) {
          throw new Error(
            `${error.message} Use http://localhost:5173 instead of file://, or load images from the folder picker.`
          );
        }
        sourceState.textureName = input.texture.name;
        sourceState.depthName = input.depth.name;
        sourceState.version += 1;
        sourceStatus.textContent = input.sourceLabel;
        sourceReadout.textContent =
          `texture: ${sourceState.textureName} (${textureData.width} x ${textureData.height})\n` +
          `depth: ${sourceState.depthName} (${depthData.width} x ${depthData.height})`;
        updateTexture();
        rebuildMesh();
      }

      function guessDepthFile(files) {
        return files.find((file) => /(^|[\\/_-])(depth|height|disparity|z|depthmap)([\\/_\-.]|$)/i.test(getFileLabel(file)))
          ?? files.find((file) => /(depth|height|disparity|depthmap)/i.test(getFileLabel(file)))
          ?? null;
      }

      function guessTextureFile(files, depthFile) {
        return files.find((file) => file !== depthFile && /(city|albedo|texture|color|diffuse|front|tietu|贴图)/i.test(getFileLabel(file)))
          ?? files.find((file) => file !== depthFile)
          ?? null;
      }

      function getFileLabel(file) {
        return file.webkitRelativePath || file.name;
      }

      function revokeSourceObjectUrls() {
        for (const url of sourceState.objectUrls) {
          URL.revokeObjectURL(url);
        }
        sourceState.objectUrls = [];
      }

      function imageRect(imageData) {
        return { x: 0, y: 0, width: imageData.width, height: imageData.height };
      }

      function updateImagePreviews() {
        texturePreviewContext.clearRect(0, 0, texturePreview.width, texturePreview.height);
        depthPreviewContext.clearRect(0, 0, depthPreview.width, depthPreview.height);
        texturePreviewContext.drawImage(
          textureImage,
          0,
          0,
          textureImage.naturalWidth,
          textureImage.naturalHeight,
          0,
          0,
          texturePreview.width,
          texturePreview.height,
        );
        depthPreviewContext.drawImage(
          depthImage,
          0,
          0,
          depthImage.naturalWidth,
          depthImage.naturalHeight,
          0,
          0,
          depthPreview.width,
          depthPreview.height,
        );
      }

      function updateTexture() {
        const nextTexture = createTexture(textureImage);
        if (state.texture) {
          gl.deleteTexture(state.texture);
        }
        state.texture = nextTexture;
      }

      function getMeshMode() {
        return controls.meshMode.find((control) => control.checked)?.value ?? "heightfield";
      }

      function rebuildMesh() {
        if (getMeshMode() === "white-mask") {
          rebuildWhiteMaskMesh();
          return;
        }
        rebuildHeightfieldMesh();
      }

      function rebuildHeightfieldMesh() {
        const step = Number.parseInt(controls.sampleStep.value, 10);
        const heightScale = Number.parseFloat(controls.heightScale.value);
        const contrast = Number.parseFloat(controls.depthContrast.value);
        const smoothPasses = Number.parseInt(controls.smoothPasses.value, 10);
        const depthGap = Number.parseFloat(controls.depthGap.value);
        const blackAir = Number.parseInt(controls.blackAir.value, 10);
        const invertDepth = controls.invertDepth.checked;
        const textureRect = imageRect(textureData);
        const depthRect = imageRect(depthData);
        const columns = Math.floor((depthRect.width - 1) / step) + 1;
        const rows = Math.floor((depthRect.height - 1) / step) + 1;
        const rawHeights = new Float32Array(columns * rows);
        const heights = new Float32Array(columns * rows);
        const valid = new Uint8Array(columns * rows);
        const vertexLookup = new Int32Array(columns * rows);
        vertexLookup.fill(-1);
        const positions = [];
        const uvs = [];
        const gridPositions = new Float32Array(columns * rows * 3);
        const gridUvs = new Float32Array(columns * rows * 2);
        gridPositions.fill(Number.NaN);
        const terrainAspect = depthRect.width / depthRect.height;
        updateImagePreviews();

        let minDepth = Number.POSITIVE_INFINITY;
        let maxDepth = Number.NEGATIVE_INFINITY;
        let skippedBlack = 0;
        for (let row = 0; row < rows; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            const x = Math.min(depthRect.x + depthRect.width - 1, depthRect.x + column * step);
            const y = Math.min(depthRect.y + depthRect.height - 1, depthRect.y + row * step);
            const index = row * columns + column;
            if (isBlackAirAt(depthData, x, y, blackAir)) {
              skippedBlack += 1;
              continue;
            }
            let depth = luminanceAt(depthData, x, y) / 255;
            if (invertDepth) {
              depth = 1 - depth;
            }
            minDepth = Math.min(minDepth, depth);
            maxDepth = Math.max(maxDepth, depth);
            rawHeights[index] = depth;
            valid[index] = 1;
          }
        }

        if (minDepth === Number.POSITIVE_INFINITY) {
          minDepth = 0;
          maxDepth = 1;
        }
        const depthRange = Math.max(maxDepth - minDepth, 0.0001);
        for (let index = 0; index < rawHeights.length; index += 1) {
          if (valid[index] === 0) {
            continue;
          }
          let normalized = (rawHeights[index] - minDepth) / depthRange;
          normalized = clamp((normalized - 0.5) * contrast + 0.5, 0, 1);
          heights[index] = normalized;
        }
        const gapHeights = new Float32Array(heights);
        smoothMaskedHeights(heights, valid, columns, rows, smoothPasses);

        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          for (let column = 0; column < columns; column += 1) {
            const index = row * columns + column;
            if (valid[index] === 0) {
              continue;
            }
            const u = column / (columns - 1);
            const x = (u - 0.5) * terrainAspect * 2;
            const y = (heights[index] - 0.5) * heightScale;
            const z = (v - 0.5) * 2;
            const vertexIndex = positions.length / 3;
            vertexLookup[index] = vertexIndex;
            positions.push(x, y, z);
            uvs.push(u, v);
            gridPositions[index * 3] = x;
            gridPositions[index * 3 + 1] = y;
            gridPositions[index * 3 + 2] = z;
            gridUvs[index * 2] = u;
            gridUvs[index * 2 + 1] = v;
          }
        }

        const triangleIndices = [];
        const lineIndices = [];
        const lineSet = new Set();
        for (let row = 0; row < rows - 1; row += 1) {
          for (let column = 0; column < columns - 1; column += 1) {
            const topLeft = row * columns + column;
            const topRight = topLeft + 1;
            const bottomLeft = topLeft + columns;
            const bottomRight = bottomLeft + 1;
            addTriangleByLookup(topLeft, bottomLeft, topRight, vertexLookup, gapHeights, depthGap, triangleIndices, lineIndices, lineSet);
            addTriangleByLookup(topRight, bottomLeft, bottomRight, vertexLookup, gapHeights, depthGap, triangleIndices, lineIndices, lineSet);
          }
        }

        const packedPositions = new Float32Array(positions);
        const packedUvs = new Float32Array(uvs);
        const normals = computeNormals(packedPositions, triangleIndices);
        setCurrentMesh({
          positions: packedPositions,
          normals,
          uvs: packedUvs,
          indices: new Uint32Array(triangleIndices),
          mode: "heightfield",
          columns,
          rows,
          sourceVertexCount: positions.length / 3,
          gridPositions,
          gridUvs,
          gridValid: valid,
        });
        state.vertexCount = positions.length / 3;
        state.triangleIndexCount = triangleIndices.length;
        state.lineIndexCount = lineIndices.length;
        uploadArrayBuffer("vertexBuffer", locations.position, packedPositions, 3);
        uploadArrayBuffer("normalBuffer", locations.normal, normals, 3);
        uploadArrayBuffer("uvBuffer", locations.uv, packedUvs, 2);
        uploadIndexBuffer("triangleIndexBuffer", new Uint32Array(triangleIndices));
        uploadIndexBuffer("lineIndexBuffer", new Uint32Array(lineIndices));

        const leaves = controls.showFloatingLeaves.checked
          ? buildFloatingLeaves(textureRect, heights, columns, rows, terrainAspect, heightScale)
          : {
              positions: new Float32Array(),
              normals: new Float32Array(),
              uvs: new Float32Array(),
              indices: [],
              vertexCount: 0,
              indexCount: 0,
            };
        state.leafVertexCount = leaves.vertexCount;
        state.leafIndexCount = leaves.indexCount;
        uploadArrayBuffer("leafVertexBuffer", locations.position, leaves.positions, 3);
        uploadArrayBuffer("leafNormalBuffer", locations.normal, leaves.normals, 3);
        uploadArrayBuffer("leafUvBuffer", locations.uv, leaves.uvs, 2);
        uploadIndexBuffer("leafIndexBuffer", new Uint32Array(leaves.indices));

        hudStatus.textContent =
          `${state.vertexCount.toLocaleString()} vertices / ${(state.triangleIndexCount / 3).toLocaleString()} faces`;
        stats.textContent =
          `${sourceState.textureName} ${textureData.width} x ${textureData.height}\n` +
          `${sourceState.depthName} ${depthData.width} x ${depthData.height}\n` +
          `method full image heightfield\n` +
          `grid ${columns} x ${rows}\n` +
          `depth gap ${depthGap.toFixed(2)}\n` +
          `black skipped ${skippedBlack.toLocaleString()}\n` +
          `vertices ${state.vertexCount.toLocaleString()}\n` +
          `faces ${(state.triangleIndexCount / 3).toLocaleString()}\n` +
          `lines ${(state.lineIndexCount / 2).toLocaleString()}\n` +
          `floating details ${(state.leafIndexCount / 6).toLocaleString()}`;
      }

      function rebuildWhiteMaskMesh() {
        const step = Number.parseInt(controls.sampleStep.value, 10);
        const heightScale = Number.parseFloat(controls.heightScale.value);
        const contrast = Number.parseFloat(controls.depthContrast.value);
        const smoothPasses = Number.parseInt(controls.smoothPasses.value, 10);
        const depthGap = Number.parseFloat(controls.depthGap.value);
        const whiteTolerance = Number.parseInt(controls.whiteTolerance.value, 10);
        const blackAir = Number.parseInt(controls.blackAir.value, 10);
        const invertDepth = controls.invertDepth.checked;
        const textureRect = imageRect(textureData);
        const depthRect = imageRect(depthData);
        const columns = Math.floor((depthRect.width - 1) / step) + 1;
        const rows = Math.floor((depthRect.height - 1) / step) + 1;
        const rawHeights = new Float32Array(columns * rows);
        const heights = new Float32Array(columns * rows);
        const valid = new Uint8Array(columns * rows);
        const vertexLookup = new Int32Array(columns * rows);
        vertexLookup.fill(-1);
        const positions = [];
        const uvs = [];
        const gridPositions = new Float32Array(columns * rows * 3);
        const gridUvs = new Float32Array(columns * rows * 2);
        gridPositions.fill(Number.NaN);
        const terrainAspect = depthRect.width / depthRect.height;
        updateImagePreviews();

        let minDepth = Number.POSITIVE_INFINITY;
        let maxDepth = Number.NEGATIVE_INFINITY;
        let skippedWhite = 0;
        let skippedBlack = 0;
        for (let row = 0; row < rows; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            const x = Math.min(depthRect.width - 1, column * step);
            const y = Math.min(depthRect.height - 1, row * step);
            const textureX = Math.min(
              textureData.width - 1,
              Math.round((x / Math.max(depthRect.width - 1, 1)) * (textureData.width - 1)),
            );
            const textureY = Math.min(
              textureData.height - 1,
              Math.round((y / Math.max(depthRect.height - 1, 1)) * (textureData.height - 1)),
            );
            const index = row * columns + column;
            let depth = luminanceAt(depthData, x, y) / 255;
            if (invertDepth) {
              depth = 1 - depth;
            }
            rawHeights[index] = depth;
            if (isBlackAirAt(depthData, x, y, blackAir)) {
              skippedBlack += 1;
              continue;
            }
            if (isWhiteBackgroundAt(textureData, textureX, textureY, whiteTolerance)) {
              skippedWhite += 1;
              continue;
            }
            valid[index] = 1;
            minDepth = Math.min(minDepth, depth);
            maxDepth = Math.max(maxDepth, depth);
          }
        }

        if (minDepth === Number.POSITIVE_INFINITY) {
          minDepth = 0;
          maxDepth = 1;
        }
        const depthRange = Math.max(maxDepth - minDepth, 0.0001);
        for (let index = 0; index < rawHeights.length; index += 1) {
          if (valid[index] === 0) {
            continue;
          }
          let normalized = (rawHeights[index] - minDepth) / depthRange;
          normalized = clamp((normalized - 0.5) * contrast + 0.5, 0, 1);
          heights[index] = normalized;
        }
        const gapHeights = new Float32Array(heights);
        smoothMaskedHeights(heights, valid, columns, rows, smoothPasses);

        for (let row = 0; row < rows; row += 1) {
          const v = row / (rows - 1);
          for (let column = 0; column < columns; column += 1) {
            const index = row * columns + column;
            if (valid[index] === 0) {
              continue;
            }
            const u = column / (columns - 1);
            const x = (u - 0.5) * terrainAspect * 2;
            const y = (heights[index] - 0.5) * heightScale;
            const z = (v - 0.5) * 2;
            const vertexIndex = positions.length / 3;
            vertexLookup[index] = vertexIndex;
            positions.push(x, y, z);
            uvs.push(u, v);
            gridPositions[index * 3] = x;
            gridPositions[index * 3 + 1] = y;
            gridPositions[index * 3 + 2] = z;
            gridUvs[index * 2] = u;
            gridUvs[index * 2 + 1] = v;
          }
        }

        const triangleIndices = [];
        const lineIndices = [];
        const lineSet = new Set();
        for (let row = 0; row < rows - 1; row += 1) {
          for (let column = 0; column < columns - 1; column += 1) {
            const topLeft = row * columns + column;
            const topRight = topLeft + 1;
            const bottomLeft = topLeft + columns;
            const bottomRight = bottomLeft + 1;
            addTriangleByLookup(topLeft, bottomLeft, topRight, vertexLookup, gapHeights, depthGap, triangleIndices, lineIndices, lineSet);
            addTriangleByLookup(topRight, bottomLeft, bottomRight, vertexLookup, gapHeights, depthGap, triangleIndices, lineIndices, lineSet);
          }
        }

        const normals = computeNormals(positions, triangleIndices);
        setCurrentMesh({
          positions: new Float32Array(positions),
          normals,
          uvs: new Float32Array(uvs),
          indices: new Uint32Array(triangleIndices),
          mode: "white-mask",
          columns,
          rows,
          sourceVertexCount: positions.length / 3,
          gridPositions,
          gridUvs,
          gridValid: valid,
        });
        state.vertexCount = positions.length / 3;
        state.triangleIndexCount = triangleIndices.length;
        state.lineIndexCount = lineIndices.length;
        uploadArrayBuffer("vertexBuffer", locations.position, new Float32Array(positions), 3);
        uploadArrayBuffer("normalBuffer", locations.normal, normals, 3);
        uploadArrayBuffer("uvBuffer", locations.uv, new Float32Array(uvs), 2);
        uploadIndexBuffer("triangleIndexBuffer", new Uint32Array(triangleIndices));
        uploadIndexBuffer("lineIndexBuffer", new Uint32Array(lineIndices));

        const leaves = controls.showFloatingLeaves.checked
          ? buildFloatingLeaves(textureRect, heights, columns, rows, terrainAspect, heightScale)
          : {
              positions: new Float32Array(),
              normals: new Float32Array(),
              uvs: new Float32Array(),
              indices: [],
              vertexCount: 0,
              indexCount: 0,
            };
        state.leafVertexCount = leaves.vertexCount;
        state.leafIndexCount = leaves.indexCount;
        uploadArrayBuffer("leafVertexBuffer", locations.position, leaves.positions, 3);
        uploadArrayBuffer("leafNormalBuffer", locations.normal, leaves.normals, 3);
        uploadArrayBuffer("leafUvBuffer", locations.uv, leaves.uvs, 2);
        uploadIndexBuffer("leafIndexBuffer", new Uint32Array(leaves.indices));

        hudStatus.textContent =
          `${state.vertexCount.toLocaleString()} vertices / ${(state.triangleIndexCount / 3).toLocaleString()} faces`;
        stats.textContent =
          `${sourceState.textureName} ${textureData.width} x ${textureData.height}\n` +
          `${sourceState.depthName} ${depthData.width} x ${depthData.height}\n` +
          `method white background mask\n` +
          `grid ${columns} x ${rows}\n` +
          `depth gap ${depthGap.toFixed(2)}\n` +
          `white skipped ${skippedWhite.toLocaleString()}\n` +
          `black skipped ${skippedBlack.toLocaleString()}\n` +
          `vertices ${state.vertexCount.toLocaleString()}\n` +
          `faces ${(state.triangleIndexCount / 3).toLocaleString()}\n` +
          `lines ${(state.lineIndexCount / 2).toLocaleString()}\n` +
          `floating details ${(state.leafIndexCount / 6).toLocaleString()}`;
      }

      function render() {
        resizeCanvas();
        if (controls.autoRotate.checked && !state.dragging) {
          state.yaw += 0.0018;
        }

        const aspect = canvas.width / Math.max(canvas.height, 1);
        const bounds = state.meshBounds;
        const cameraDistance = Math.max(3.1, bounds.radius * 2.8) / state.zoom;
        const farClip = Math.max(20, cameraDistance + bounds.radius * 4 + 4);
        const projection = perspective(Math.PI / 4.7, aspect, 0.01, farClip);
        const modelCenter = translation(-bounds.centerX, -bounds.centerY, -bounds.centerZ);
        const rotation = multiply(rotationX(state.pitch), rotationY(state.yaw));
        const view = multiply(
          translation(0, -0.05, -cameraDistance),
          multiply(rotation, modelCenter),
        );
        const matrix = multiply(projection, view);

        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.useProgram(program);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, state.texture);
        gl.uniform1i(locations.texture, 0);
        gl.uniformMatrix4fv(locations.matrix, false, matrix);
        gl.uniform1f(locations.pointSize, Number.parseFloat(controls.pointSize.value));
        gl.uniform1f(locations.ambient, Number.parseFloat(controls.ambient.value));
        gl.uniform1f(locations.textureDetail, Number.parseFloat(controls.textureDetail.value));
        const previewExport = controls.previewExportMesh.checked && state.exportMesh != null;
        const renderVertexBuffer = previewExport ? state.exportVertexBuffer : state.vertexBuffer;
        const renderNormalBuffer = previewExport ? state.exportNormalBuffer : state.normalBuffer;
        const renderUvBuffer = previewExport ? state.exportUvBuffer : state.uvBuffer;
        const renderIndexBuffer = previewExport ? state.exportTriangleIndexBuffer : state.triangleIndexBuffer;
        const renderVertexCount = previewExport ? state.exportMesh.vertexCount : state.vertexCount;
        const renderIndexCount = previewExport ? state.exportMesh.indexCount : state.triangleIndexCount;

        if (controls.showSurface.checked && renderIndexCount > 0) {
          bindGeometryBuffers(renderVertexBuffer, renderNormalBuffer, renderUvBuffer);
          gl.depthMask(true);
          gl.uniform1f(locations.alpha, Number.parseFloat(controls.surfaceAlpha.value));
          gl.uniform1f(locations.useWireColor, 0);
          gl.uniform1f(locations.renderPoints, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, renderIndexBuffer);
          gl.drawElements(gl.TRIANGLES, renderIndexCount, gl.UNSIGNED_INT, 0);
        }

        if (!previewExport && controls.showWire.checked && state.lineIndexCount > 0) {
          bindGeometryBuffers(state.vertexBuffer, state.normalBuffer, state.uvBuffer);
          gl.depthMask(false);
          gl.uniform1f(locations.alpha, Number.parseFloat(controls.lineAlpha.value));
          gl.uniform1f(locations.useWireColor, 1);
          gl.uniform1f(locations.renderPoints, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, state.lineIndexBuffer);
          gl.drawElements(gl.LINES, state.lineIndexCount, gl.UNSIGNED_INT, 0);
        }

        if (controls.showPoints.checked && renderVertexCount > 0) {
          bindGeometryBuffers(renderVertexBuffer, renderNormalBuffer, renderUvBuffer);
          gl.depthMask(false);
          gl.uniform1f(locations.alpha, 0.9);
          gl.uniform1f(locations.useWireColor, 0);
          gl.uniform1f(locations.renderPoints, 1);
          gl.drawArrays(gl.POINTS, 0, state.vertexCount);
        }

        if (controls.showFloatingLeaves.checked && state.leafIndexCount > 0) {
          bindGeometryBuffers(state.leafVertexBuffer, state.leafNormalBuffer, state.leafUvBuffer);
          gl.depthMask(true);
          gl.uniform1f(locations.alpha, 0.95);
          gl.uniform1f(locations.useWireColor, 0);
          gl.uniform1f(locations.renderPoints, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, state.leafIndexBuffer);
          gl.drawElements(gl.TRIANGLES, state.leafIndexCount, gl.UNSIGNED_INT, 0);
        }

        requestAnimationFrame(render);
      }

      function updateOutputs() {
        outputs.sampleStep.value = controls.sampleStep.value;
        outputs.whiteTolerance.value = controls.whiteTolerance.value;
        outputs.blackAir.value = controls.blackAir.value;
        outputs.heightScale.value = Number.parseFloat(controls.heightScale.value).toFixed(2);
        outputs.depthContrast.value = Number.parseFloat(controls.depthContrast.value).toFixed(2);
        outputs.smoothPasses.value = controls.smoothPasses.value;
        outputs.depthGap.value = Number.parseFloat(controls.depthGap.value).toFixed(2);
        outputs.textureDetail.value = Number.parseFloat(controls.textureDetail.value).toFixed(2);
        outputs.surfaceAlpha.value = Number.parseFloat(controls.surfaceAlpha.value).toFixed(2);
        outputs.lineAlpha.value = Number.parseFloat(controls.lineAlpha.value).toFixed(2);
        outputs.pointSize.value = controls.pointSize.value;
        outputs.ambient.value = Number.parseFloat(controls.ambient.value).toFixed(2);
        outputs.zoom.value = Number.parseFloat(controls.zoom.value).toFixed(2);
        outputs.leafStep.value = controls.leafStep.value;
        outputs.leafLift.value = Number.parseFloat(controls.leafLift.value).toFixed(2);
        outputs.leafSize.value = Number.parseFloat(controls.leafSize.value).toFixed(3);
        outputs.greenThreshold.value = Number.parseFloat(controls.greenThreshold.value).toFixed(2);
        outputs.exportReduction.value = `${controls.exportReduction.value}x`;
        outputs.exportMinArea.value = Number.parseFloat(controls.exportMinArea.value).toFixed(6);
        outputs.planarTolerance.value = Number.parseFloat(controls.planarTolerance.value).toFixed(3);
        outputs.airFillRatio.value = Number.parseFloat(controls.airFillRatio.value).toFixed(2);
        outputs.mergeRounds.value = controls.mergeRounds.value;
      }

      function setCurrentMesh(mesh) {
        const bounds = computeMeshBounds(mesh.positions);
        state.currentMesh = {
          ...mesh,
          vertexCount: mesh.positions.length / 3,
          indexCount: mesh.indices.length,
          faceCount: mesh.indices.length / 3,
          bounds,
          sourceVersion: sourceState.version,
          sourceTextureName: sourceState.textureName,
          sourceDepthName: sourceState.depthName,
        };
        state.meshBounds = bounds;
        invalidateExportMesh();
      }

      function invalidateExportMesh() {
        state.exportMesh = null;
        assetSummary.textContent = "pending";
        assetReadout.textContent = "Click Report, Export, or enable Preview export mesh to simplify.";
      }

      function computeMeshBounds(positions) {
        if (positions.length < 3) {
          return {
            centerX: 0,
            centerY: 0,
            centerZ: 0,
            radius: 1.6,
          };
        }

        let minX = Number.POSITIVE_INFINITY;
        let minY = Number.POSITIVE_INFINITY;
        let minZ = Number.POSITIVE_INFINITY;
        let maxX = Number.NEGATIVE_INFINITY;
        let maxY = Number.NEGATIVE_INFINITY;
        let maxZ = Number.NEGATIVE_INFINITY;
        for (let index = 0; index < positions.length; index += 3) {
          const x = positions[index];
          const y = positions[index + 1];
          const z = positions[index + 2];
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          minZ = Math.min(minZ, z);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          maxZ = Math.max(maxZ, z);
        }

        const centerX = (minX + maxX) * 0.5;
        const centerY = (minY + maxY) * 0.5;
        const centerZ = (minZ + maxZ) * 0.5;
        let radius = 0;
        for (let index = 0; index < positions.length; index += 3) {
          radius = Math.max(
            radius,
            Math.hypot(
              positions[index] - centerX,
              positions[index + 1] - centerY,
              positions[index + 2] - centerZ,
            ),
          );
        }

        return {
          centerX,
          centerY,
          centerZ,
          radius: Math.max(radius, 1.6),
        };
      }

      function updateExportMesh() {
        if (state.currentMesh == null) {
          state.exportMesh = null;
          assetSummary.textContent = "pending";
          assetReadout.textContent = "Waiting for mesh...";
          return;
        }

        const reductionFactor = Number.parseInt(controls.exportReduction.value, 10);
        const minTriangleArea = Number.parseFloat(controls.exportMinArea.value);
        const planarTolerance = Number.parseFloat(controls.planarTolerance.value);
        const airFillRatio = Number.parseFloat(controls.airFillRatio.value);
        const mergeRounds = Number.parseInt(controls.mergeRounds.value, 10);
        if (
          state.exportMesh != null &&
          state.exportMesh.reductionFactor === reductionFactor &&
          state.exportMesh.minTriangleArea === minTriangleArea &&
          state.exportMesh.planarTolerance === planarTolerance &&
          state.exportMesh.airFillRatio === airFillRatio &&
          state.exportMesh.mergeRounds === mergeRounds &&
          state.exportMesh.sourceVersion === state.currentMesh.sourceVersion
        ) {
          return;
        }
        const exportMesh = simplifyMeshByAdaptivePlanarBlocks(
          state.currentMesh,
          reductionFactor,
          minTriangleArea,
          planarTolerance,
          airFillRatio,
          mergeRounds,
        );
        state.exportMesh = exportMesh;
        uploadArrayBuffer("exportVertexBuffer", locations.position, exportMesh.positions, 3);
        uploadArrayBuffer("exportNormalBuffer", locations.normal, exportMesh.normals, 3);
        uploadArrayBuffer("exportUvBuffer", locations.uv, exportMesh.uvs, 2);
        uploadIndexBuffer("exportTriangleIndexBuffer", exportMesh.indices);

        const sourceFaces = state.currentMesh.faceCount;
        const exportFaces = exportMesh.faceCount;
        const facePercent = sourceFaces <= 0 ? 0 : (exportFaces / sourceFaces) * 100;
        assetSummary.textContent = `${exportFaces.toLocaleString()} faces`;
        assetReadout.textContent =
          `source ${state.currentMesh.vertexCount.toLocaleString()} vertices / ${sourceFaces.toLocaleString()} faces\n` +
          `export ${exportMesh.vertexCount.toLocaleString()} vertices / ${exportFaces.toLocaleString()} faces\n` +
          `kept ${facePercent.toFixed(1)}% faces\n` +
          `mode ${exportMesh.mode}, adaptive block ${exportMesh.maxBlockSize}x, rounds ${mergeRounds}, air fill ${airFillRatio.toFixed(2)}, planar ${planarTolerance.toFixed(3)}`;
      }

      function simplifyMeshByAdaptivePlanarBlocks(
        mesh,
        reductionFactor,
        minTriangleArea,
        planarTolerance,
        airFillRatio,
        mergeRounds,
      ) {
        if (mesh.gridPositions == null || mesh.gridUvs == null || mesh.gridValid == null) {
          return mesh;
        }
        const maxBlockSize = Math.max(
          1,
          Math.round(reductionFactor * Math.pow(2, Math.max(0, mergeRounds - 1))),
        );
        const positions = [];
        const uvs = [];
        const indices = [];
        const vertexByGridIndex = new Map();
        const triangleSet = new Set();

        function addGridVertex(gridIndex) {
          let vertexIndex = vertexByGridIndex.get(gridIndex);
          if (vertexIndex != null) {
            return vertexIndex;
          }
          const positionOffset = gridIndex * 3;
          const uvOffset = gridIndex * 2;
          vertexIndex = positions.length / 3;
          vertexByGridIndex.set(gridIndex, vertexIndex);
          positions.push(
            mesh.gridPositions[positionOffset],
            mesh.gridPositions[positionOffset + 1],
            mesh.gridPositions[positionOffset + 2],
          );
          uvs.push(mesh.gridUvs[uvOffset], mesh.gridUvs[uvOffset + 1]);
          return vertexIndex;
        }

        function addTriangleFromGrid(aGrid, bGrid, cGrid) {
          if (
            mesh.gridValid[aGrid] === 0 ||
            mesh.gridValid[bGrid] === 0 ||
            mesh.gridValid[cGrid] === 0
          ) {
            return;
          }
          const a = addGridVertex(aGrid);
          const b = addGridVertex(bGrid);
          const c = addGridVertex(cGrid);
          if (a === b || b === c || c === a) {
            return;
          }
          const packedPositions = { positions, a, b, c };
          if (getArrayTriangleArea(packedPositions) < minTriangleArea) {
            addFlattenedTriangleFromGrid(aGrid, bGrid, cGrid);
            return;
          }
          const key = [a, b, c].slice().sort((left, right) => left - right).join(":");
          if (triangleSet.has(key)) {
            return;
          }
          triangleSet.add(key);
          indices.push(a, b, c);
        }

        function addFlattenedTriangleFromGrid(aGrid, bGrid, cGrid) {
          const key = `fill:${[aGrid, bGrid, cGrid].slice().sort((left, right) => left - right).join(":")}`;
          if (triangleSet.has(key)) {
            return;
          }
          triangleSet.add(key);

          const fillPlane = fitLocalFillPlane([aGrid, bGrid, cGrid]);
          const nextIndex = positions.length / 3;
          for (const gridIndex of [aGrid, bGrid, cGrid]) {
            const positionOffset = gridIndex * 3;
            const uvOffset = gridIndex * 2;
            const x = mesh.gridPositions[positionOffset];
            const z = mesh.gridPositions[positionOffset + 2];
            positions.push(
              x,
              sampleFillPlane(fillPlane, x, z, mesh.gridPositions[positionOffset + 1]),
              z,
            );
            uvs.push(mesh.gridUvs[uvOffset], mesh.gridUvs[uvOffset + 1]);
          }
          indices.push(nextIndex, nextIndex + 1, nextIndex + 2);
        }

        function fitLocalFillPlane(gridIndices) {
          const sampleSet = new Set();
          for (const gridIndex of gridIndices) {
            const x = gridIndex % mesh.columns;
            const y = Math.floor(gridIndex / mesh.columns);
            for (let dy = -2; dy <= 2; dy += 1) {
              for (let dx = -2; dx <= 2; dx += 1) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx < 0 || nx >= mesh.columns || ny < 0 || ny >= mesh.rows) {
                  continue;
                }
                const neighborIndex = ny * mesh.columns + nx;
                if (mesh.gridValid[neighborIndex] !== 0) {
                  sampleSet.add(neighborIndex);
                }
              }
            }
          }
          if (sampleSet.size < 3) {
            return null;
          }

          let sumX = 0;
          let sumZ = 0;
          let sumY = 0;
          let sumXX = 0;
          let sumZZ = 0;
          let sumXZ = 0;
          let sumXY = 0;
          let sumZY = 0;
          let count = 0;
          for (const gridIndex of sampleSet) {
            const offset = gridIndex * 3;
            const x = mesh.gridPositions[offset];
            const y = mesh.gridPositions[offset + 1];
            const z = mesh.gridPositions[offset + 2];
            if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) {
              continue;
            }
            sumX += x;
            sumZ += z;
            sumY += y;
            sumXX += x * x;
            sumZZ += z * z;
            sumXZ += x * z;
            sumXY += x * y;
            sumZY += z * y;
            count += 1;
          }
          if (count < 3) {
            return null;
          }

          const solution = solveSymmetric3x3(
            [
              sumXX, sumXZ, sumX,
              sumXZ, sumZZ, sumZ,
              sumX, sumZ, count,
            ],
            [sumXY, sumZY, sumY],
          );
          if (solution == null) {
            return null;
          }
          return {
            xSlope: solution[0],
            zSlope: solution[1],
            intercept: solution[2],
          };
        }

        function sampleFillPlane(plane, x, z, fallbackY) {
          if (plane == null) {
            return fallbackY;
          }
          return plane.xSlope * x + plane.zSlope * z + plane.intercept;
        }

        function solveSymmetric3x3(matrix, vector) {
          const m = [
            [matrix[0], matrix[1], matrix[2], vector[0]],
            [matrix[3], matrix[4], matrix[5], vector[1]],
            [matrix[6], matrix[7], matrix[8], vector[2]],
          ];
          for (let pivot = 0; pivot < 3; pivot += 1) {
            let bestRow = pivot;
            for (let row = pivot + 1; row < 3; row += 1) {
              if (Math.abs(m[row][pivot]) > Math.abs(m[bestRow][pivot])) {
                bestRow = row;
              }
            }
            if (Math.abs(m[bestRow][pivot]) < 0.0000001) {
              return null;
            }
            if (bestRow !== pivot) {
              const temp = m[pivot];
              m[pivot] = m[bestRow];
              m[bestRow] = temp;
            }
            const scale = m[pivot][pivot];
            for (let column = pivot; column < 4; column += 1) {
              m[pivot][column] /= scale;
            }
            for (let row = 0; row < 3; row += 1) {
              if (row === pivot) {
                continue;
              }
              const factor = m[row][pivot];
              for (let column = pivot; column < 4; column += 1) {
                m[row][column] -= factor * m[pivot][column];
              }
            }
          }
          return [m[0][3], m[1][3], m[2][3]];
        }

        function simplifyBlock(x0, y0, x1, y1) {
          if (x1 <= x0 || y1 <= y0) {
            return;
          }
          if (canMergeBlock(x0, y0, x1, y1)) {
            const topLeft = y0 * mesh.columns + x0;
            const topRight = y0 * mesh.columns + x1;
            const bottomLeft = y1 * mesh.columns + x0;
            const bottomRight = y1 * mesh.columns + x1;
            addTriangleFromGrid(topLeft, bottomLeft, topRight);
            addTriangleFromGrid(topRight, bottomLeft, bottomRight);
            return;
          }
          if (x1 - x0 <= 1 && y1 - y0 <= 1) {
            const topLeft = y0 * mesh.columns + x0;
            const topRight = y0 * mesh.columns + x1;
            const bottomLeft = y1 * mesh.columns + x0;
            const bottomRight = y1 * mesh.columns + x1;
            addTriangleFromGrid(topLeft, bottomLeft, topRight);
            addTriangleFromGrid(topRight, bottomLeft, bottomRight);
            return;
          }
          const midX = Math.floor((x0 + x1) / 2);
          const midY = Math.floor((y0 + y1) / 2);
          simplifyBlock(x0, y0, midX, midY);
          simplifyBlock(midX, y0, x1, midY);
          simplifyBlock(x0, midY, midX, y1);
          simplifyBlock(midX, midY, x1, y1);
        }

        function canMergeBlock(x0, y0, x1, y1) {
          if (x1 - x0 > maxBlockSize || y1 - y0 > maxBlockSize) {
            return false;
          }
          const corners = [
            y0 * mesh.columns + x0,
            y0 * mesh.columns + x1,
            y1 * mesh.columns + x0,
            y1 * mesh.columns + x1,
          ];
          if (corners.some((index) => mesh.gridValid[index] === 0)) {
            return false;
          }
          let invalidCount = 0;
          let totalCount = 0;
          for (let y = y0; y <= y1; y += 1) {
            for (let x = x0; x <= x1; x += 1) {
              const gridIndex = y * mesh.columns + x;
              totalCount += 1;
              if (mesh.gridValid[gridIndex] === 0) {
                invalidCount += 1;
                continue;
              }
              if (
                airFillRatio <= 0 &&
                x > x0 &&
                x < x1 &&
                y > y0 &&
                y < y1 &&
                isBoundaryGridPoint(mesh.gridValid, mesh.columns, mesh.rows, x, y)
              ) {
                return false;
              }
            }
          }
          if (invalidCount / Math.max(totalCount, 1) > airFillRatio) {
            return false;
          }
          return getBlockPlaneError(mesh.gridPositions, mesh.gridValid, mesh.columns, x0, y0, x1, y1) <= planarTolerance;
        }

        const blockSize = Math.max(1, maxBlockSize);
        for (let y = 0; y < mesh.rows - 1; y += blockSize) {
          for (let x = 0; x < mesh.columns - 1; x += blockSize) {
            simplifyBlock(
              x,
              y,
              Math.min(mesh.columns - 1, x + blockSize),
              Math.min(mesh.rows - 1, y + blockSize),
            );
          }
        }

        const compact = compactMesh(new Float32Array(positions), new Float32Array(uvs), new Uint32Array(indices));
        const normals = computeNormals(compact.positions, compact.indices);

        return {
          positions: compact.positions,
          normals,
          uvs: compact.uvs,
          indices: compact.indices,
          mode: mesh.mode,
          columns: mesh.columns,
          rows: mesh.rows,
          reductionFactor,
          maxBlockSize,
          minTriangleArea,
          planarTolerance,
          airFillRatio,
          mergeRounds,
          sourceVersion: mesh.sourceVersion,
          sourceTextureName: mesh.sourceTextureName,
          sourceDepthName: mesh.sourceDepthName,
          vertexCount: compact.positions.length / 3,
          indexCount: compact.indices.length,
          faceCount: compact.indices.length / 3,
        };
      }

      function getArrayTriangleArea(input) {
        const positions = input.positions;
        const a = input.a;
        const b = input.b;
        const c = input.c;
        const ax = positions[a * 3];
        const ay = positions[a * 3 + 1];
        const az = positions[a * 3 + 2];
        const bx = positions[b * 3];
        const by = positions[b * 3 + 1];
        const bz = positions[b * 3 + 2];
        const cx = positions[c * 3];
        const cy = positions[c * 3 + 1];
        const cz = positions[c * 3 + 2];
        return Math.hypot(
          (by - ay) * (cz - az) - (bz - az) * (cy - ay),
          (bz - az) * (cx - ax) - (bx - ax) * (cz - az),
          (bx - ax) * (cy - ay) - (by - ay) * (cx - ax),
        ) * 0.5;
      }

      function isBoundaryGridPoint(valid, columns, rows, x, y) {
        const neighbors = [
          [x - 1, y],
          [x + 1, y],
          [x, y - 1],
          [x, y + 1],
        ];
        for (const [nx, ny] of neighbors) {
          if (nx < 0 || nx >= columns || ny < 0 || ny >= rows) {
            return true;
          }
          if (valid[ny * columns + nx] === 0) {
            return true;
          }
        }
        return false;
      }

      function getBlockPlaneError(gridPositions, gridValid, columns, x0, y0, x1, y1) {
        const a = readGridPosition(gridPositions, columns, x0, y0);
        const b = readGridPosition(gridPositions, columns, x1, y0);
        const c = readGridPosition(gridPositions, columns, x0, y1);
        const normal = cross(
          [b[0] - a[0], b[1] - a[1], b[2] - a[2]],
          [c[0] - a[0], c[1] - a[1], c[2] - a[2]],
        );
        const length = Math.hypot(normal[0], normal[1], normal[2]);
        if (length <= 0.000001) {
          return Number.POSITIVE_INFINITY;
        }
        normal[0] /= length;
        normal[1] /= length;
        normal[2] /= length;
        let error = 0;
        let sampleCount = 0;
        for (let y = y0; y <= y1; y += 1) {
          for (let x = x0; x <= x1; x += 1) {
            if (gridValid[y * columns + x] === 0) {
              continue;
            }
            const p = readGridPosition(gridPositions, columns, x, y);
            if (!Number.isFinite(p[0]) || !Number.isFinite(p[1]) || !Number.isFinite(p[2])) {
              continue;
            }
            sampleCount += 1;
            error = Math.max(
              error,
              Math.abs(
                (p[0] - a[0]) * normal[0] +
                (p[1] - a[1]) * normal[1] +
                (p[2] - a[2]) * normal[2],
              ),
            );
          }
        }
        if (sampleCount < 3) {
          return Number.POSITIVE_INFINITY;
        }
        return error;
      }

      function readGridPosition(gridPositions, columns, x, y) {
        const offset = (y * columns + x) * 3;
        return [
          gridPositions[offset],
          gridPositions[offset + 1],
          gridPositions[offset + 2],
        ];
      }

      function cross(a, b) {
        return [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0],
        ];
      }

      function compactMesh(positions, uvs, indices) {
        const remap = new Int32Array(positions.length / 3);
        remap.fill(-1);
        const nextPositions = [];
        const nextUvs = [];
        const nextIndices = new Uint32Array(indices.length);

        for (let index = 0; index < indices.length; index += 1) {
          const sourceIndex = indices[index];
          let targetIndex = remap[sourceIndex];
          if (targetIndex < 0) {
            targetIndex = nextPositions.length / 3;
            remap[sourceIndex] = targetIndex;
            nextPositions.push(
              positions[sourceIndex * 3],
              positions[sourceIndex * 3 + 1],
              positions[sourceIndex * 3 + 2],
            );
            nextUvs.push(uvs[sourceIndex * 2], uvs[sourceIndex * 2 + 1]);
          }
          nextIndices[index] = targetIndex;
        }

        return {
          positions: new Float32Array(nextPositions),
          uvs: new Float32Array(nextUvs),
          indices: nextIndices,
        };
      }

      function getTriangleArea(positions, a, b, c) {
        const ax = positions[a * 3];
        const ay = positions[a * 3 + 1];
        const az = positions[a * 3 + 2];
        const bx = positions[b * 3];
        const by = positions[b * 3 + 1];
        const bz = positions[b * 3 + 2];
        const cx = positions[c * 3];
        const cy = positions[c * 3 + 1];
        const cz = positions[c * 3 + 2];
        const abx = bx - ax;
        const aby = by - ay;
        const abz = bz - az;
        const acx = cx - ax;
        const acy = cy - ay;
        const acz = cz - az;
        const crossX = aby * acz - abz * acy;
        const crossY = abz * acx - abx * acz;
        const crossZ = abx * acy - aby * acx;

        return Math.hypot(crossX, crossY, crossZ) * 0.5;
      }

      function buildObjAsset(mesh) {
        const materialName = getExportMaterialName();
        const lines = [
          "# city-depth-mesh low-poly OBJ",
          `# texture ${mesh.sourceTextureName ?? sourceState.textureName}`,
          `# depth ${mesh.sourceDepthName ?? sourceState.depthName}`,
          `# mode ${mesh.mode}`,
          `# vertices ${mesh.vertexCount}`,
          `# faces ${mesh.faceCount}`,
          `# reductionFactor ${mesh.reductionFactor}`,
          `# maxBlockSize ${mesh.maxBlockSize}`,
          `# mergeRounds ${mesh.mergeRounds}`,
          `# airFillRatio ${mesh.airFillRatio}`,
          `# minTriangleArea ${mesh.minTriangleArea}`,
          `mtllib ${getExportBaseName()}-lowpoly.mtl`,
          `o ${getExportBaseName()}_lowpoly`,
          `usemtl ${materialName}`,
        ];

        for (let index = 0; index < mesh.positions.length; index += 3) {
          lines.push(
