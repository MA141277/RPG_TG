      .small { font: 400 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #8E735C; }
      .btn { font: 700 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #FFF8EF; }
      .btn-soft { font: 700 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #5A402C; }
